format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-fl/statute/constitution/article-vii/section-5/block-1
      - us-fl/statute/title-xiv/chapter-220/section-220-02/block-1
      - us-fl/statute/title-xiv/chapter-220/section-220-03/block-1
    upstream_source_check:
      status: complete_current_authority
      checked_paths:
        - us-fl/statute/constitution/article-vii/section-5
        - us-fl/statute/title-xiv/chapter-220/section-220-02
        - us-fl/statute/title-xiv/chapter-220/section-220-03
      rationale: |-
        The current official Florida Constitution supplies the natural-person
        income-tax boundary. Current Florida Statutes section 220.02 directs
        that chapter 220 not be construed to tax natural persons and describes
        the constitutional mandate as barring an income tax on natural-person
        residents and citizens. Section 220.03(1)(z) independently limits a
        chapter 220 taxpayer to a corporation subject to the code.
  summary: |-
    Complete Florida full-year-resident individual income-tax pipeline for tax
    year 2026. For a natural person, chapter 220 imposes no annual individual
    income tax. Accordingly there is no individual deduction, exemption,
    surtax, or credit stage, and resident liability is zero before credits,
    after nonrefundable credits, after refundable credits, and before
    payments. The result is the legal absence of an individual income tax, not
    a fictional zero-percent bracket or a zero taxable-income assumption.
    Corporate and other artificial-entity taxes, a corporation's distributive
    share of partnership income, payments, filing administration, local taxes,
    and nonresident allocation are outside this module.
rules:
  - name: fl_pit_2026_natural_person_income_tax_constitutional_boundary_applies
    kind: derived
    dtype: Boolean
    period: Year
    source: Fla. Const. art. VII, § 5(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-fl/statute/constitution/article-vii/section-5/block-1
              excerpt: "No tax upon estates or inheritances or upon the income of natural persons who are residents or citizens of the state shall be levied by the state, or under its authority"
    versions:
      - effective_from: '2026-01-01'
        formula: true

  - name: fl_pit_2026_chapter_220_taxpayer_definition_excludes_natural_person
    kind: derived
    dtype: Boolean
    period: Year
    source: Fla. Stat. § 220.03(1)(z)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-fl/statute/title-xiv/chapter-220/section-220-03/block-1
              excerpt: "“Taxpayer” means any corporation subject to the tax imposed by this code"
    versions:
      - effective_from: '2026-01-01'
        formula: true

