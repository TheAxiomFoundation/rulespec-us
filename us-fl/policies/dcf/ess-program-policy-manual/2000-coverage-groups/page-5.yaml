format: rulespec/v1
module:
  source_verification:
    corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
    source_sha256: bebf7b71bf1fbfe656b643851702f9e0379c20da8bddaa46d51b48c59a396c41
  proof_validation:
    required: true
  summary: |-
    FS is the only code that will appear for a food stamp assistance group.
    Broad-based categorically eligible SFUs must meet the 200% gross income limits.
    If the SFU does not meet the 200% of the federal poverty income limit, the SFU must meet the net income limit of 100% of the federal poverty level for the AG size and the asset limit of $4,500.
inputs:
  - name: receives_temporary_cash_assistance_or_ssi
    entity: Person
    dtype: Boolean
    period: Month
  - name: temporary_cash_assistance_or_ssi_authorized
    entity: Person
    dtype: Boolean
    period: Month
  - name: temporary_cash_assistance_or_ssi_suspended
    entity: Person
    dtype: Boolean
    period: Month
  - name: temporary_cash_assistance_or_ssi_recouped
    entity: Person
    dtype: Boolean
    period: Month
  - name: temporary_cash_assistance_or_ssi_unpaid_below_minimum
    entity: Person
    dtype: Boolean
    period: Month
  - name: individual_categorically_eligible
    entity: Person
    dtype: Boolean
    period: Month
  - name: categorical_verification_questionable
    entity: Person
    dtype: Boolean
    period: Month
  - name: all_members_receive_or_are_authorized_temporary_cash_assistance_or_ssi
    entity: Household
    dtype: Boolean
    period: Month
  - name: family_receives_or_is_authorized_healthy_families_florida_services
    entity: Household
    dtype: Boolean
    period: Month
  - name: receives_tanf_or_moe_information_on_access_notice
    entity: Household
    dtype: Boolean
    period: Month
  - name: individual_opts_out_of_temporary_cash_assistance
    entity: Household
    dtype: Boolean
    period: Month
  - name: sfu_contains_ineligible_member
    entity: Household
    dtype: Boolean
    period: Month
  - name: sfu_contains_disqualified_member
    entity: Household
    dtype: Boolean
    period: Month
  - name: receives_medical_assistance_only
    entity: Household
    dtype: Boolean
    period: Month
  - name: oldest_sfu_member_age
    entity: Household
    dtype: Integer
    period: Month
  - name: sfu_contains_food_stamp_disabled_member
    entity: Household
    dtype: Boolean
    period: Month
  - name: gross_income_limit_200_percent_for_ag_size
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: net_income_limit_100_percent_for_ag_size
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: sfu_gross_income
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: sfu_net_income
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: sfu_countable_assets
    entity: Household
    dtype: Money
    unit: USD
    period: Month
rules:
  - name: broad_based_gross_poverty_ratio
    kind: parameter
    dtype: Rate
    source: Florida ESS Manual 2010.0201
    metadata:
      proof:
        atoms:
          - kind: amount
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "200% of the federal poverty level for the AG size"
    versions:
      - effective_from: '0001-01-01'
        formula: '2.00'
  - name: elderly_or_disabled_fallback_net_poverty_ratio
    kind: parameter
    dtype: Rate
    source: Florida ESS Manual 2010.0201
    metadata:
      proof:
        atoms:
          - kind: amount
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "100% of the federal poverty level for the AG size"
    versions:
      - effective_from: '0001-01-01'
        formula: '1.00'
  - name: elderly_member_age_threshold
    kind: parameter
    dtype: Integer
    source: Florida ESS Manual 2010.0201
    metadata:
      proof:
        atoms:
          - kind: amount
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "age 60 or over"
    versions:
      - effective_from: '0001-01-01'
        formula: '60'
  - name: elderly_or_disabled_fallback_asset_limit
    kind: parameter
    dtype: Money
    unit: USD
    source: Florida ESS Manual 2010.0201
    metadata:
      proof:
        atoms:
          - kind: amount
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "asset limit of $4,500"
    versions:
      - effective_from: '0001-01-01'
        formula: '4500'
  - name: food_stamp_category_code
    kind: derived
    entity: Household
    dtype: String
    period: Month
    source: Florida ESS Manual 2010.0101
    metadata:
      proof:
        atoms:
          - kind: definition
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
    versions:
      - effective_from: '0001-01-01'
        formula: '"FS"'
  - name: temporary_cash_assistance_or_ssi_recipient
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Florida ESS Manual 2010.0201
    metadata:
      proof:
        atoms:
          - kind: definition
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          receives_temporary_cash_assistance_or_ssi
          or temporary_cash_assistance_or_ssi_authorized
          or temporary_cash_assistance_or_ssi_suspended
          or temporary_cash_assistance_or_ssi_recouped
          or temporary_cash_assistance_or_ssi_unpaid_below_minimum
  - name: categorical_requirements_met_without_further_verification
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Florida ESS Manual 2010.0201, gross and net income, assets, SSN and residency verification
    metadata:
      proof:
        atoms:
          - kind: exception
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "without further verification, unless questionable"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          individual_categorically_eligible
          and not categorical_verification_questionable
  - name: categorical_status_barred
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS Manual 2010.0201, months excluded from categorical eligibility
    metadata:
      proof:
        atoms:
          - kind: exception
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          individual_opts_out_of_temporary_cash_assistance
          or sfu_contains_ineligible_member
          or sfu_contains_disqualified_member
          or receives_medical_assistance_only
  - name: categorically_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS Manual 2010.0201 and 2010.0202
    metadata:
      proof:
        atoms:
          - kind: definition
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
          - kind: exception
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          (all_members_receive_or_are_authorized_temporary_cash_assistance_or_ssi
           or family_receives_or_is_authorized_healthy_families_florida_services)
          and not categorical_status_barred
  - name: broad_based_categorically_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS Manual 2010.0201 and 2010.0202
    metadata:
      proof:
        atoms:
          - kind: definition
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
          - kind: exception
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "does not contain a disqualified member"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          receives_tanf_or_moe_information_on_access_notice
          and not categorical_status_barred
  - name: sfu_has_elderly_or_disabled_member
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS Manual 2010.0201
    metadata:
      proof:
        atoms:
          - kind: condition
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "age 60 or over or meets the definition of food stamp disabled"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          oldest_sfu_member_age >= elderly_member_age_threshold
          or sfu_contains_food_stamp_disabled_member
  - name: income_and_asset_limits_met_through_categorical_status
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Florida ESS Manual 2010.0201
    metadata:
      proof:
        atoms:
          - kind: formula
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "200% gross income limits"
          - kind: exception
            path: versions[0].formula
            source:
              corpus_citation_path: us-fl/manual/dcf/ess-program-policy-manual/2000-coverage-groups/page-5
              excerpt: "net income limit of 100% of the federal poverty level for the AG size and the asset limit of $4,500"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          categorically_eligible
          or (broad_based_categorically_eligible
              and (sfu_gross_income <= gross_income_limit_200_percent_for_ag_size
                   or (sfu_has_elderly_or_disabled_member
                       and sfu_net_income <= net_income_limit_100_percent_for_ag_size
                       and sfu_countable_assets <= elderly_or_disabled_fallback_asset_limit)))
