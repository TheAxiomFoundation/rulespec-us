name: Late-start imports

# Ratchets the rule versions that read an imported rule before it has any
# version. The engine reports such a gap only at run time, so a clean compile
# does not rule it out, and the encoder's temporal-dependency-coverage validator
# stops at imports. tests/test_late_start_imports.py holds the tree to
# tools/known-late-start-imports.txt in the required validate check. This
# workflow adds what that test cannot do: a pull request may not add a
# (rule, target) pair against its protected base unless it carries the
# late-start-import-accepted label, and the static model must equal the pinned
# engine's own name bindings. See tools/late_start_imports.py.

on:
  pull_request:
    branches: [main]
    # The label decides the verdict, so changing it has to rerun the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    # Daily. The static model mirrors the engine at the pin, and the runner's
    # Rust toolchain is not pinned, so drift shows even with no rulespec PR open.
    - cron: "52 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  late-start-imports:
    name: late-start-imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The base commit's baseline bounds this one.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Test the gate logic
        # Before the comparison, so a red gate never hides a broken gate.
        run: |
          python -m pip install --quiet pyyaml==6.0.3 pytest hypothesis
          python -m pytest -q -p no:cacheprovider \
            tests/test_late_start_imports.py \
            tests/test_late_start_imports_properties.py

      - name: Compare with the known-edge baseline
        shell: bash
        env:
          # Only a pull request has a label to read, so only a pull request is
          # bound by its base; on main the baseline must still match exactly.
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'late-start-import-accepted') }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$BASE_REF" ]; then
            args+=(--base-ref "$BASE_REF")
          fi
          if [ "$ACCEPTED" = "true" ]; then
            args+=(--allow-added)
          fi
          python tools/late_start_imports.py check "${args[@]}" | tee "$RUNNER_TEMP/late-start-imports.txt"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/late-start-imports.txt" ]; then
            {
              echo '### Late-start imports'
              echo '```'
              head -c 60000 "$RUNNER_TEMP/late-start-imports.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  engine-differential:
    name: engine-differential
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: rulespec-us

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install the tool's dependency
        run: python -m pip install --quiet pyyaml==6.0.3

      - name: Resolve pinned engine
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          path = Path("rulespec-us/.axiom/workflow-toolchain.toml")
          toolchain = tomllib.loads(path.read_text())["workflow_toolchain"]
          ref = toolchain.get("axiom_rules_engine_ref", "")
          if re.fullmatch(r"[0-9a-f]{40}", ref) is None:
              raise SystemExit(f"{path}: axiom_rules_engine_ref must be a full lowercase commit SHA")
          print(f"axiom_rules_engine_ref={ref}")
          PY

      - name: Checkout axiom-rules-engine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ steps.toolchain.outputs.axiom_rules_engine_ref }}
          path: axiom-rules-engine

      - name: Cache harness build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom-rules-engine/target
          key: late-start-imports-${{ runner.os }}-${{ steps.toolchain.outputs.axiom_rules_engine_ref }}-${{ hashFiles('rulespec-us/tools/late_start_imports.py') }}
          restore-keys: |
            late-start-imports-${{ runner.os }}-${{ steps.toolchain.outputs.axiom_rules_engine_ref }}-

      - name: Compare the static references with the engine's
        shell: bash
        run: |
          set -euo pipefail
          python rulespec-us/tools/late_start_imports.py differential \
            --engine-src axiom-rules-engine \
            --root "$GITHUB_WORKSPACE/rulespec-us" \
            --output "$RUNNER_TEMP/late-start-differential.jsonl" \
            | tee "$RUNNER_TEMP/late-start-differential.txt"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/late-start-differential.txt" ]; then
            {
              echo '### Static references against the pinned engine'
              echo '```'
              head -c 60000 "$RUNNER_TEMP/late-start-differential.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: late-start-differential
          path: ${{ runner.temp }}/late-start-differential.*
          if-no-files-found: ignore
