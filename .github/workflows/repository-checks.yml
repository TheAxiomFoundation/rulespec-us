name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The daily full run moved to validation-drift.yml (axiom-encode#2094): it
  # runs only when an encoder, engine or corpus change can affect results,
  # plus weekly, and opens one issue per failing file instead of one alarm.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  workflow-toolchain:
    runs-on: ubuntu-latest
    outputs:
      axiom_encode_ref: ${{ steps.pins.outputs.axiom_encode_ref }}
      axiom_compose_ref: ${{ steps.pins.outputs.axiom_compose_ref }}
      axiom_rules_engine_ref: ${{ steps.pins.outputs.axiom_rules_engine_ref }}
      axiom_corpus_ref: ${{ steps.pins.outputs.axiom_corpus_ref }}
      rulespec_us_ref: ${{ steps.pins.outputs.rulespec_us_ref }}
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read protected workflow toolchain
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          path = Path(".axiom/workflow-toolchain.toml")
          toolchain = tomllib.loads(path.read_text())["workflow_toolchain"]
          for key in (
              "axiom_encode_ref",
              "axiom_compose_ref",
              "axiom_rules_engine_ref",
              "axiom_corpus_ref",
              "rulespec_us_ref",
          ):
              value = toolchain.get(key)
              if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"{path}: {key} must be a full lowercase commit SHA")
              print(f"{key}={value}")
          PY

  validate:
    needs: workflow-toolchain
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@882c5f11545ec3343fc5ed170e01d65aa2c5bb3e
    secrets: inherit
    with:
      axiom-encode-ref: ${{ needs.workflow-toolchain.outputs.axiom_encode_ref }}
      axiom-compose-ref: ${{ needs.workflow-toolchain.outputs.axiom_compose_ref }}
      axiom-rules-engine-ref: ${{ needs.workflow-toolchain.outputs.axiom_rules_engine_ref }}
      axiom-corpus-ref: ${{ needs.workflow-toolchain.outputs.axiom_corpus_ref }}
      rulespec-us-ref: ${{ needs.workflow-toolchain.outputs.rulespec_us_ref }}
      # The pinned signed release is mirrored to the public object store. The
      # registry endpoint returns HTTP 500 for its 30 MB release object; the
      # reusable validator authenticates the same pinned object after fetch.
      validate-roots: auto
      validation-workers: 4
      guard-programs-root: false
      allow-retired-schema-prefreeze: true

  push-alarm:
    # A red full validation after a push to main opens (or refreshes) one
    # alarm. The daily drift run moved to validation-drift.yml, which opens
    # one issue per failing file instead (axiom-encode#2094).
    needs: validate
    if: ${{ always() && github.event_name == 'push' && needs.validate.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or refresh the red-main alarm
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Full RuleSpec validation is red on main after a push"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still red: ${RUN_URL}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The full validation after a push to main failed: ${RUN_URL}. Close this issue once main is green again."
          fi
