name: Source staleness and reverse index

# A5 of the Axiom platform plan: wire source-staleness checking into CI and
# maintain the provision -> rules reverse index.
#
# Two independent concerns:
#
# 1. reverse-index (BLOCKING) - `.axiom/index/provisions_to_rules.json` is a
#    generated artifact. This job regenerates it from the tracked RuleSpec YAML
#    and fails if the committed copy is stale. It needs only PyYAML, so it is
#    cheap and deterministic.
#
# 2. source-staleness (REPORT-ONLY) - recompute every
#    `module.source_verification.source_sha256` pin against the signed corpus
#    release pinned in `.axiom/toolchain.toml` and report drift. The pinned
#    encoder resolves only bytes the signed release lists, and hash-checks
#    each provisions file against the release inventory, so drift is measured
#    against that release, not corpus main. The job checks out only the
#    release's provisions artifacts, at the release's provenance commit, so it
#    does not depend on corpus main still tracking those bytes in its tree.
#    tests/source_staleness_report.py does the binding and the report. Findings
#    never fail the job. See the job's comment for when a broken report does.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, aligned with the corpus/oracle cadence: catches corpus drift
    # even when no rulespec PR is open.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse-index:
    name: reverse-index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Regenerate provision -> rules reverse index
        run: python tests/generate_reverse_index.py

      - name: Fail if the committed reverse index is stale
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- .axiom/index/provisions_to_rules.json; then
            echo "::error::.axiom/index/provisions_to_rules.json is stale." >&2
            echo "Run 'python tests/generate_reverse_index.py' and commit the result." >&2
            exit 1
          fi
          echo "Reverse index is up to date."

  source-staleness:
    name: source-staleness (report-only)
    runs-on: ubuntu-latest
    # Report-only. Stale or unresolvable pins never fail this job. Steps that
    # can fail on their own logic run with continue-on-error; the last step
    # decides. On pull requests it only annotates, so a broken report cannot
    # hold up a merge. On pushes to main, the weekly schedule and manual runs,
    # a report that could not be produced fails the job, so the break shows.
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@v6.0.2

      - name: Resolve pinned encoder and corpus release
        id: pins
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          workflow_path = Path(".axiom/workflow-toolchain.toml")
          workflow = tomllib.loads(workflow_path.read_text()).get("workflow_toolchain", {})
          encode_ref = workflow.get("source_staleness_axiom_encode_ref", "")
          if not isinstance(encode_ref, str) or not re.fullmatch(r"[0-9a-f]{40}", encode_ref):
              raise SystemExit(
                  f"{workflow_path}: source_staleness_axiom_encode_ref must be a full lowercase commit SHA"
              )
          toolchain_path = Path(".axiom/toolchain.toml")
          toolchain = tomllib.loads(toolchain_path.read_text()).get("toolchain", {})
          name = toolchain.get("axiom_corpus_release", "")
          content = toolchain.get("axiom_corpus_release_content_sha256", "")
          if not isinstance(name, str) or not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name):
              raise SystemExit(f"{toolchain_path}: axiom_corpus_release is not a release name")
          if not isinstance(content, str) or not re.fullmatch(r"[0-9a-f]{64}", content):
              raise SystemExit(
                  f"{toolchain_path}: axiom_corpus_release_content_sha256 is not a sha256"
              )
          print(f"axiom_encode_ref={encode_ref}")
          print(f"release_name={name}")
          print(f"release_content_sha256={content}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      # Same acquisition and content check as the org validate-rulespec
      # workflow: the registry row must hold exactly one release object whose
      # canonical content hashes to the pinned digest. The encoder verifies
      # the signature when it binds the release.
      - name: Fetch pinned signed corpus release object
        id: release
        if: ${{ steps.pins.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          RELEASE_REGISTRY_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          RELEASE_REGISTRY_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          RELEASE_NAME: ${{ steps.pins.outputs.release_name }}
          RELEASE_CONTENT_SHA256: ${{ steps.pins.outputs.release_content_sha256 }}
        run: |
          set -euo pipefail
          case "$RELEASE_REGISTRY_URL" in
            https://*) ;;
            *) echo "vars.NEXT_PUBLIC_SUPABASE_URL must be an https URL" >&2; exit 1 ;;
          esac
          test -n "$RELEASE_REGISTRY_ANON_KEY" || {
            echo "vars.NEXT_PUBLIC_SUPABASE_ANON_KEY is required" >&2; exit 1;
          }
          response="$RUNNER_TEMP/release-response.json"
          url="${RELEASE_REGISTRY_URL%/}/rest/v1/release_objects?select=release_object&release_name=eq.${RELEASE_NAME}&content_sha256=eq.${RELEASE_CONTENT_SHA256}&limit=2"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --header "apikey: $RELEASE_REGISTRY_ANON_KEY" \
            --header "Authorization: Bearer $RELEASE_REGISTRY_ANON_KEY" \
            --header "Accept-Profile: corpus" \
            --output "$response" "$url"
          python - "$response" "$RUNNER_TEMP" "$RELEASE_NAME" "$RELEASE_CONTENT_SHA256" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          response, temp, expected_name, expected_sha = sys.argv[1:5]
          rows = json.loads(Path(response).read_bytes())
          if not isinstance(rows, list) or len(rows) != 1 or not isinstance(rows[0], dict):
              raise SystemExit("registry did not return exactly one release row")
          payload = rows[0].get("release_object")
          if not isinstance(payload, dict) or payload.get("release") != expected_name:
              raise SystemExit("registry row is not the pinned release")
          content = payload.get("content")
          if not isinstance(content, dict):
              raise SystemExit("release object has no content object")
          actual = hashlib.sha256(
              json.dumps(content, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          ).hexdigest()
          if payload.get("content_sha256") != actual or actual != expected_sha:
              raise SystemExit(f"release content sha256 mismatch ({actual} != {expected_sha})")
          commit = (content.get("git") or {}).get("commit")
          if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("release provenance commit is not a full lowercase SHA")
          paths = sorted(
              artifact["path"]
              for artifact in content.get("artifacts", [])
              if artifact.get("artifact_class") == "provisions"
          )
          if not paths or any(
              not re.fullmatch(r"data/corpus/provisions/[A-Za-z0-9._/-]+\.jsonl", path)
              or ".." in path.split("/")
              for path in paths
          ):
              raise SystemExit("release lists no provisions artifacts, or an unsafe path")
          Path(temp, "release-object.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          # Non-cone patterns: exactly the release's provisions files, plus
          # the lock-file directory a post-switch corpus commit carries.
          Path(temp, "corpus-sparse.txt").write_text(
              "".join(f"/{path}\n" for path in paths) + "/.axiom/corpus-locks/\n"
          )
          print(f"commit={commit}")
          print(f"provisions={len(paths)}")
          PY
          cat "$GITHUB_OUTPUT"

      # A blobless, sparse, depth-1 fetch of the provenance commit downloads
      # only the release's provisions blobs (272 files, about 306 MB for
      # us-rulespec-2026-08-08-obbb-alien-snap) instead of the 15 GB tree.
      - name: Check out the release's provisions at its provenance commit
        id: corpus
        if: ${{ steps.release.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_NAME: ${{ steps.pins.outputs.release_name }}
          RELEASE_CONTENT_SHA256: ${{ steps.pins.outputs.release_content_sha256 }}
        run: |
          set -euo pipefail
          corpus="$GITHUB_WORKSPACE/_axiom/axiom-corpus"
          rm -rf "$corpus"
          git init --quiet "$corpus"
          git -C "$corpus" remote add origin https://github.com/TheAxiomFoundation/axiom-corpus.git
          git -C "$corpus" config remote.origin.promisor true
          git -C "$corpus" config remote.origin.partialclonefilter blob:none
          git -C "$corpus" fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$COMMIT"
          git -C "$corpus" sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/corpus-sparse.txt"
          git -C "$corpus" -c advice.detachedHead=false checkout --quiet --detach "$COMMIT"
          test "$(git -C "$corpus" rev-parse HEAD)" = "$COMMIT"
          release_dir="$corpus/releases/$RELEASE_NAME"
          mkdir -p "$release_dir"
          cp "$RUNNER_TEMP/release-object.json" "$release_dir/$RELEASE_CONTENT_SHA256.json"
          echo "Checked out $(git -C "$corpus" ls-files | wc -l) corpus file(s) at $COMMIT"

      - name: Checkout axiom-encode (pinned)
        id: encode_checkout
        if: ${{ steps.pins.outcome == 'success' }}
        continue-on-error: true
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-encode
          ref: ${{ steps.pins.outputs.axiom_encode_ref }}
          path: _axiom/axiom-encode
          persist-credentials: false

      - name: Install pinned axiom-encode
        id: install
        if: ${{ steps.encode_checkout.outcome == 'success' }}
        continue-on-error: true
        run: python -m pip install --quiet --upgrade pip ./_axiom/axiom-encode pytest hypothesis

      - name: Test the report script
        id: script_tests
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: python -m pytest -q tests/test_source_staleness_report.py tests/test_source_staleness_report_properties.py

      - name: Report source staleness
        id: report
        if: ${{ steps.corpus.outcome == 'success' && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          ENCODE_REF: ${{ steps.pins.outputs.axiom_encode_ref }}
          CORPUS_RELEASE_PUBLIC_KEY: ${{ vars.AXIOM_CORPUS_RELEASE_PUBLIC_KEY }}
          CORPUS_RELEASE_RETIRED_PUBLIC_KEY: ${{ vars.AXIOM_CORPUS_RELEASE_RETIRED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # Verification-only public keys, current first. The retired key
          # still verifies releases it signed, as the supervisor's keyring does.
          keys=()
          if [ -n "$CORPUS_RELEASE_PUBLIC_KEY" ]; then
            keys+=(--corpus-release-public-key "AXIOM_CORPUS_RELEASE_PUBLIC_KEY=$CORPUS_RELEASE_PUBLIC_KEY")
          fi
          if [ -n "$CORPUS_RELEASE_RETIRED_PUBLIC_KEY" ]; then
            keys+=(--corpus-release-public-key "AXIOM_CORPUS_RELEASE_RETIRED_PUBLIC_KEY=$CORPUS_RELEASE_RETIRED_PUBLIC_KEY")
          fi
          set +e
          python tests/source_staleness_report.py \
            --rulespec-root "$GITHUB_WORKSPACE" \
            --corpus-path "$GITHUB_WORKSPACE/_axiom/axiom-corpus" \
            --encoder-ref "$ENCODE_REF" \
            --report "$RUNNER_TEMP/staleness-report.md" \
            --json "$RUNNER_TEMP/staleness-report.json" \
            "${keys[@]}"
          status=$?
          set -e
          cat "$RUNNER_TEMP/staleness-report.md" >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "Every pin matches the pinned release." ;;
            1) echo "::warning::Source staleness report lists findings; see the job summary and artifact." ;;
            *) echo "::error::The source staleness report could not be produced (exit $status)."; exit "$status" ;;
          esac

      - name: Upload staleness report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-staleness-report
          path: |
            ${{ runner.temp }}/staleness-report.md
            ${{ runner.temp }}/staleness-report.json
          if-no-files-found: warn

      - name: Decide the job result
        if: ${{ always() }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          OUTCOMES: >-
            pins=${{ steps.pins.outcome }}
            release=${{ steps.release.outcome }}
            corpus=${{ steps.corpus.outcome }}
            encode_checkout=${{ steps.encode_checkout.outcome }}
            install=${{ steps.install.outcome }}
            script_tests=${{ steps.script_tests.outcome }}
            report=${{ steps.report.outcome }}
        run: |
          set -euo pipefail
          echo "Step outcomes: $OUTCOMES"
          if [[ " $OUTCOMES " != *"=failure"* && " $OUTCOMES " != *"=skipped"* ]]; then
            echo "Report produced."
            exit 0
          fi
          message="The source staleness report was not produced cleanly ($OUTCOMES)."
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::error::$message Report-only on pull requests, so this job still passes."
            exit 0
          fi
          echo "::error::$message"
          exit 1
