name: Source staleness and reverse index

# A5 of the Axiom platform plan: wire source-staleness checking into CI and
# maintain the provision -> rules reverse index.
#
# Two independent concerns:
#
# 1. reverse-index - the provision -> rules index is a pure function of the
#    tracked RuleSpec YAML and is NOT tracked in Git. A tracked copy was the
#    one file every encoding pull request had to edit, so each merge made every
#    other open pull request stale or conflicting, and the signed encoder
#    workflow could not write it at all. This job proves the index is derivable
#    from the tree under test (generator runs, output is canonical) and that
#    no copy is tracked. For commits on `main` it also uploads the generated
#    index as the `provisions-to-rules-index` artifact, which is what readers
#    can use instead of a committed file. The job holds no secret and no
#    write permission, and this definition never uploads for pull requests.
#    A pull request can still edit its own copy of this workflow, so readers
#    must take the artifact only from a successful `push` run whose head
#    commit is on `main` (or generate the index locally, which is the trusted
#    way).
#
# 2. source-staleness (REPORT-ONLY) - recompute every
#    `module.source_verification.source_sha256` pin against axiom-corpus@main
#    and report drift. No checked-in module pins a source hash yet (see the
#    A5 follow-up: pin stamping is blocked by the guard-generated signed-apply
#    gate), so this job would be vacuous as a required check. It runs with
#    continue-on-error so the drift report is always visible without blocking
#    merges. Flip `continue-on-error` to false once pins exist repo-wide.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, aligned with the corpus/oracle cadence: catches corpus drift
    # even when no rulespec PR is open.
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse-index:
    name: reverse-index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Fail if a reverse index is tracked
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- .axiom/index)"
          if [ -n "$tracked" ]; then
            echo "::error::The reverse index is generated on demand and must not be tracked:" >&2
            printf '%s\n' "$tracked" >&2
            echo "Run 'git rm -r --cached .axiom/index' and commit." >&2
            exit 1
          fi
          echo "No reverse index is tracked."

      - name: Generate provision -> rules reverse index
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reverse-index"
          python tests/generate_reverse_index.py \
            --output "$RUNNER_TEMP/reverse-index/provisions_to_rules.json"

      - name: Check the generated index is well formed and stable across runs
        run: |
          set -euo pipefail
          python tests/generate_reverse_index.py --check \
            --output "$RUNNER_TEMP/reverse-index/provisions_to_rules.json"
          python - "$RUNNER_TEMP/reverse-index/provisions_to_rules.json" <<'PY'
          import json
          import sys

          index = json.load(open(sys.argv[1], encoding="utf-8"))
          assert index["schema"] == "axiom.rulespec.provisions_to_rules/v1", index["schema"]
          provisions = index["provisions"]
          assert provisions, "generated reverse index has no provisions"
          assert list(provisions) == sorted(provisions), "provisions are not sorted"
          print(f"Generated reverse index: {len(provisions)} provisions.")
          PY
          # --ignored on .axiom: the index directory is git-ignored, so a
          # copy written there would be invisible to a plain status.
          dirty="$(git status --porcelain)"
          ignored="$(git status --porcelain --ignored -- .axiom)"
          if [ -n "$dirty$ignored" ]; then
            echo "::error::Generating the reverse index changed the checkout." >&2
            printf '%s\n' "$dirty" "$ignored" >&2
            exit 1
          fi

      # Only commits on main publish the index. A pull request (or a manual run
      # on another branch) runs the generator from its own tree, so its output
      # is not an index of main and must not be offered as one.
      - name: Upload the reverse index for this main commit
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: provisions-to-rules-index
          path: ${{ runner.temp }}/reverse-index/provisions_to_rules.json
          if-no-files-found: error
          retention-days: 90

  source-staleness:
    name: source-staleness (report-only)
    runs-on: ubuntu-latest
    # Report-only: pins do not exist yet, so a failure here must not block
    # merges. Remove this line once source_sha256 pins are stamped repo-wide.
    continue-on-error: true
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@v6.0.2

      - name: Resolve pinned axiom-encode ref
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          encode_ref="$(python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          path = Path(".axiom/workflow-toolchain.toml")
          data = tomllib.loads(path.read_text()).get("workflow_toolchain", {})
          value = data.get("source_staleness_axiom_encode_ref", "")
          if not re.fullmatch(r"[0-9a-f]{40}", value):
              raise SystemExit(
                  f"{path}: source_staleness_axiom_encode_ref must be a full lowercase commit SHA"
              )
          print(value)
          PY
          )"
          echo "axiom_encode_ref=$encode_ref" >> "$GITHUB_OUTPUT"
          echo "Pinned axiom-encode ref: $encode_ref"

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      # axiom-corpus is checked out at main on purpose: staleness detection
      # must see the latest corpus text so it can flag pins that the corpus has
      # since moved past.
      - name: Checkout axiom-corpus @ main
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-corpus
          ref: main
          path: _axiom/axiom-corpus

      - name: Checkout axiom-encode (pinned)
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-encode
          ref: ${{ steps.toolchain.outputs.axiom_encode_ref }}
          path: _axiom/axiom-encode

      - name: Install scanner dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Report unpinned-module counts
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/staleness-report.txt"
          python - "$report" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          repo = Path(".")
          pinned = 0
          unpinned = 0
          grounded = 0
          # Jurisdiction roots are top-level dirs like ``us`` and ``us-ca``.
          module_paths = sorted(
              {
                  path
                  for entry in repo.iterdir()
                  if entry.is_dir() and entry.name.split("-")[0].isalpha()
                  and len(entry.name.split("-")[0]) == 2
                  and entry.name[0] != "."
                  for pattern in ("*.yaml", "*.yml")
                  for path in entry.rglob(pattern)
              }
          )
          for path in module_paths:
              name = path.name
              if name.endswith((".test.yaml", ".test.yml")):
                  continue
              try:
                  payload = yaml.safe_load(path.read_text(encoding="utf-8"))
              except (OSError, yaml.YAMLError):
                  continue
              if not isinstance(payload, dict):
                  continue
              module = payload.get("module")
              if not isinstance(module, dict):
                  continue
              verification = module.get("source_verification")
              if not isinstance(verification, dict):
                  continue
              grounded += 1
              if str(verification.get("source_sha256") or "").strip():
                  pinned += 1
              else:
                  unpinned += 1

          lines = [
              "# Source staleness report",
              "",
              f"- Modules with source_verification: {grounded}",
              f"- Pinned (source_sha256 present): {pinned}",
              f"- Unpinned (no source_sha256): {unpinned}",
              "",
          ]
          if pinned == 0:
              lines.append(
                  "No modules pin source_sha256 yet, so the staleness check below "
                  "is vacuous. Pin stamping is blocked by the guard-generated "
                  "signed-apply gate; see the A5 follow-up issue."
              )
          Path(sys.argv[1]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report_path=$report" >> "$GITHUB_OUTPUT"

      - name: Run check-source-staleness (report-only)
        shell: bash
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '## check-source-staleness output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          python - \
            "$GITHUB_WORKSPACE/_axiom/axiom-encode/src/axiom_encode/source_hash.py" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/_axiom/axiom-corpus" <<'PY' \
            | tee -a "$RUNNER_TEMP/staleness-report.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          import runpy
          import sys

          scanner = runpy.run_path(sys.argv[1])
          raise SystemExit(
              scanner["run_check_source_staleness"](
                  [
                      "--rulespec-root",
                      sys.argv[2],
                      "--corpus-root",
                      sys.argv[3],
                  ]
              )
          )
          PY
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "check-source-staleness exit status: $status"
          # Surface the status for humans, but do not fail the job: this is the
          # report-only phase. The uploaded report preserves the full finding.
          if [ "$status" -ne 0 ]; then
            echo "::warning::check-source-staleness reported findings (exit $status); see the job summary and artifact."
          fi
          exit 0

      - name: Upload staleness report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: source-staleness-report
          path: ${{ runner.temp }}/staleness-report.txt
          if-no-files-found: warn
