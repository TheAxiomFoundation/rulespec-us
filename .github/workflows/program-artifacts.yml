name: program-artifacts

# Compiles every programs/ spec through axiom-compose + axiom-rules-engine.
# On pull requests this is a gate: every program not excluded by an active
# module waiver must compile, so spec/corpus drift is caught at PR time instead
# of at admission time.
# On pushes to main it additionally publishes the provenance-stamped
# artifacts and manifest as a GitHub release, which downstream consumers
# must pin by tag + sha256.

on:
  pull_request:
    paths:
      - "programs/**"
      - "tools/**"
      - ".axiom/toolchain.toml"
      - "known-validation-gaps.yaml"
      - "us/**"
      - "us-*/**"
      - ".github/workflows/program-artifacts.yml"
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "tools/**"
      - ".axiom/toolchain.toml"
      - "known-validation-gaps.yaml"
      - "us/**"
      - "us-*/**"
      - ".github/workflows/program-artifacts.yml"

env:
  # Toolchain pins — bump deliberately; they define artifact provenance.
  AXIOM_COMPOSE_REF: 9a514aca29c85a4a5f30a63f2275f9a362dd2b7a
  AXIOM_RULES_ENGINE_REF: de0efdc73b469132ee268e1c832e8f7148b91431

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release publishing on main
      id-token: write # build provenance attestations
      attestations: write # build provenance attestations
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.4"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"

      - name: Resolve pinned encoder
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with open(".axiom/toolchain.toml", "rb") as stream:
              toolchain = tomllib.load(stream)["toolchain"]

          ref = toolchain.get("axiom_encode_ref", "")
          version = toolchain.get("axiom_encode_version", "")
          if not re.fullmatch(r"[0-9a-f]{40}", ref):
              raise SystemExit(
                  "axiom_encode_ref must be exactly 40 lowercase hexadecimal characters"
              )
          if not isinstance(version, str) or not version:
              raise SystemExit("axiom_encode_version must be a non-empty string")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"axiom_encode_ref={ref}\n")
              output.write(f"axiom_encode_version={version}\n")
          PY

      - name: Checkout axiom-encode
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-encode
          ref: ${{ steps.toolchain.outputs.axiom_encode_ref }}
          path: _axiom/axiom-encode

      - name: Checkout axiom-compose
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-compose
          ref: ${{ env.AXIOM_COMPOSE_REF }}
          path: _axiom/axiom-compose

      - name: Install frozen encoder environment
        shell: bash
        env:
          PINNED_AXIOM_ENCODE_REF: ${{ steps.toolchain.outputs.axiom_encode_ref }}
          PINNED_AXIOM_ENCODE_VERSION: ${{ steps.toolchain.outputs.axiom_encode_version }}
        run: |
          set -euo pipefail
          test "$(git -C _axiom/axiom-encode rev-parse HEAD)" = "$PINNED_AXIOM_ENCODE_REF"
          test "$(git -C _axiom/axiom-compose rev-parse HEAD)" = "$AXIOM_COMPOSE_REF"
          EXPECTED_AXIOM_ENCODE_VERSION="$PINNED_AXIOM_ENCODE_VERSION" \
            python -I - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["EXPECTED_AXIOM_ENCODE_VERSION"]
          with Path("_axiom/axiom-encode/pyproject.toml").open("rb") as stream:
              actual = tomllib.load(stream).get("project", {}).get("version")
          if actual != expected:
              raise SystemExit(
                  "axiom_encode_version does not match the checked-out package "
                  f"({expected!r} != {actual!r})"
              )
          PY
          uv sync \
            --frozen \
            --extra dev \
            --python "$(command -v python)" \
            --project _axiom/axiom-encode
          echo "AXIOM_ENCODE_REF=$PINNED_AXIOM_ENCODE_REF" >> "$GITHUB_ENV"
          echo "AXIOM_ARTIFACT_PYTHON=$GITHUB_WORKSPACE/_axiom/axiom-encode/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Test artifact builder
        env:
          PYTHONPATH: ${{ github.workspace }}/_axiom/axiom-compose/src
        run: |
          "$AXIOM_ARTIFACT_PYTHON" -P -m pytest -q tests/test_build_program_artifacts.py

      - name: Checkout axiom-rules-engine
        uses: actions/checkout@v6.0.2
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ env.AXIOM_RULES_ENGINE_REF }}
          path: .engine-src

      - name: Cache engine build
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: .engine-src/target/release/axiom-rules-engine
          key: engine-bin-${{ runner.os }}-${{ env.AXIOM_RULES_ENGINE_REF }}

      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --bin axiom-rules-engine
        working-directory: .engine-src

      - name: Compile all program specs
        env:
          PYTHONPATH: ${{ github.workspace }}/_axiom/axiom-compose/src
        run: |
          set -euo pipefail
          test "$(git -C _axiom/axiom-encode rev-parse HEAD)" = "$AXIOM_ENCODE_REF"
          test "$(git -C _axiom/axiom-compose rev-parse HEAD)" = "$AXIOM_COMPOSE_REF"
          test "$(git -C .engine-src rev-parse HEAD)" = "$AXIOM_RULES_ENGINE_REF"
          test -z "$(git -C _axiom/axiom-encode status --porcelain --untracked-files=all)"
          test -z "$(git -C _axiom/axiom-compose status --porcelain --untracked-files=all)"
          test -z "$(git -C .engine-src status --porcelain --untracked-files=all)"
          AXIOM_RULES_ENGINE_BIN="$PWD/.engine-src/target/release/axiom-rules-engine" \
            "$AXIOM_ARTIFACT_PYTHON" -P tools/build_program_artifacts.py --dist dist

      # Attest build provenance for the published artifacts; consumers can
      # verify with `gh attestation verify <file> --repo TheAxiomFoundation/rulespec-us`.
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/manifest.json
            dist/*.compiled.json

      - name: Publish artifacts release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          tag="program-artifacts-${short_sha}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Program artifacts @ ${short_sha}" \
            --notes "Compiled program artifacts built from ${GITHUB_SHA} by the program-artifacts workflow. Pin these by tag + sha256 (see manifest.json)." \
            dist/manifest.json dist/*.compiled.json dist/*.rulespec.yaml
