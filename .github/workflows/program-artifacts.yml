name: program-artifacts

# Compiles every programs/ spec through axiom-compose + axiom-rules-engine.
#
# Two decoupled jobs share this build:
#
# - On pull requests this is a GATE: any spec outside
#   tools/known-broken-specs.txt that fails to compile fails the check, so
#   spec/corpus drift is caught at PR time instead of at admission time. It
#   publishes nothing and should never be a reason to disable the workflow.
# - Publishing is DELIBERATE: `workflow_dispatch` on main compiles and
#   publishes the provenance-stamped artifacts and manifest as an immutable
#   GitHub release, which downstream consumers (axiom-api) pin by tag +
#   sha256. A dispatch from any other ref runs the compile only.
#
# Publishing used to ride every push to main. That coupled the release
# cadence to merge traffic (two releases inside four hours on 2026-08-05) and
# gave the kill switch a hidden blast radius: disabling the workflow to stop
# the release spam also silently removed the PR compile gate, and #1233
# merged without it. Releases are deliberate acts, like corpus releases; the
# gate must not share their off switch.

on:
  pull_request:
    paths:
      - "programs/**"
      - "tools/**"
      - "us/**"
      - "us-*/**"
      - ".axiom/toolchain.toml"
      - ".axiom/workflow-toolchain.toml"
      - ".github/workflows/program-artifacts.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Resolve immutable execution toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          path = Path(".axiom/workflow-toolchain.toml")
          data = tomllib.loads(path.read_text()).get("workflow_toolchain", {})
          ref_keys = (
              "axiom_compose_ref",
              "axiom_encode_ref",
              "axiom_rules_engine_ref",
              "axiom_corpus_ref",
              "rulespec_us_ref",
          )
          for key in ref_keys:
              value = data.get(key, "")
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit(f"{path}: {key} must be a full lowercase commit SHA")
              print(f"{key}={value}")
          version = data.get("axiom_encode_version", "")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){2,}", version):
              raise SystemExit(f"{path}: axiom_encode_version must be an exact version")
          print(f"axiom_encode_version={version}")
          PY

      - name: Install axiom-compose
        env:
          AXIOM_COMPOSE_REF: ${{ steps.toolchain.outputs.axiom_compose_ref }}
        run: |
          python -m pip install --quiet pyyaml \
            "axiom-compose @ git+https://github.com/TheAxiomFoundation/axiom-compose@${AXIOM_COMPOSE_REF}"

      - name: Checkout axiom-rules-engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: ${{ steps.toolchain.outputs.axiom_rules_engine_ref }}
          path: .engine-src

      - name: Cache engine build
        id: engine-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .engine-src/target/release/axiom-rules-engine
          key: engine-bin-${{ runner.os }}-${{ steps.toolchain.outputs.axiom_rules_engine_ref }}

      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: cargo build --release --bin axiom-rules-engine
        working-directory: .engine-src

      - name: Compile all program specs
        run: |
          AXIOM_RULES_ENGINE_BIN="$PWD/.engine-src/target/release/axiom-rules-engine" \
            python tools/build_program_artifacts.py --dist dist

      - name: Stage artifacts for deliberate publication
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: program-artifacts
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download compiled artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: program-artifacts
          path: dist

      # Consumers can verify with `gh attestation verify <file>
      # --repo TheAxiomFoundation/rulespec-us`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/manifest.json
            dist/*.compiled.json

      - name: Publish artifacts release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          tag="program-artifacts-${short_sha}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Program artifacts @ ${short_sha}" \
            --notes "Compiled program artifacts built from ${GITHUB_SHA} by the program-artifacts workflow. Pin these by tag + sha256 (see manifest.json)." \
            dist/manifest.json dist/*.compiled.json dist/*.rulespec.yaml
