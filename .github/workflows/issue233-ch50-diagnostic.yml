         report['runtimes'][root]=runtime
        engine=pathlib.Path('_axiom/axiom-rules-engine/target/debug/axiom-rules-engine')
        report['engine_sha256']=hashlib.sha256(engine.read_bytes()).hexdigest()
        (out/'protected-identities.json').write_text(json.dumps(report,indent=2)+'\n')
