name: Source validation diagnostics
on: pull_request
permissions:
  contents: read
jobs:
  diagnose:
    uses: ./.github/workflows/source-validation-diagnostics.yml
    secrets: inherit
    with:
      axiom-encode-ref: b041b6b5a0e39f2c05c93669f354f8a54e9a84c3
      axiom-rules-engine-ref: f6b0d15246a7db1403836628576f11e0d334348c
      axiom-corpus-ref: 8f7d60aaced28ee4252b9237f9d6e02360dc34bc
      rulespec-us-ref: 38d5c8c516f9243cedf8e07a22f96dde9ac66fe3
      corpus-release-registry-url: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      corpus-release-registry-anon-key: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      validate-roots: auto
      guard-programs-root: false
      allow-retired-schema-prefreeze: true
