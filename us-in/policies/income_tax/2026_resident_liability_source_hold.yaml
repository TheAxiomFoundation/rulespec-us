format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-in/statute/6-3-1-3.5
      - us-in/statute/6-3-2-1
      - us-in/statute/6-3.1-21-1
      - us-in/guidance/dor/individual-income-tax-rate/2026/individual-income-tax-rate
      - us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us-in/statute/6-3-1-3.5
        - us-in/statute/6-3-2-1
        - us-in/statute/6-3.1-21-1
        - us-in/guidance/dor/individual-income-tax-rate/2026/individual-income-tax-rate
        - us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
      rationale: |-
        The pinned official 2025 Indiana Code Title 6 establishes the
        federal-adjusted-gross-income starting point and a long modification,
        deduction, and exemption chain in IC 6-3-1-3.5; the 2.95 percent 2026
        resident rate in IC 6-3-2-1; and the existence of an Indiana earned
        income tax credit in IC 6-3.1-21. The current official Indiana DOR rate
        page independently confirms the 2.95 percent 2026 rate and identifies
        county income tax as a separate rate surface.

        As of July 24, 2026, the DOR current-year individual-return portal
        identifies the available full-year-resident IT-40 booklet, return,
        add-back, deduction, exemption, other-tax, and credit schedules as
        tax-year-2025 materials. The portal expressly warns taxpayers to use
        the correct form for the desired filing year. The pinned corpus has no
        final tax-year-2026 IT-40 annual-return package and no complete
        codification of 2026 session changes. The 2025 Title 6 snapshot and
        selected recovered sections therefore cannot establish every
        operative 2026 conformity modification, deduction, exemption,
        statewide specialty tax, credit eligibility rule, limitation,
        ordering rule, recapture, or refundability rule.

        Those missing current-law and annual-return authorities are typed
        source holds. No caller-completed Indiana adjusted gross income,
        deduction, exemption, taxable income, tax, surtax, or credit amount is
        accepted. Every public Money stage after the raw federal/fact boundary
        is a fail-closed zero sentinel while a hold remains active. The
        sentinels are not claims that Indiana income, tax, or liability is
        legally zero. The existing narrow pilot remains a rate calculation
        from a prohibited completed-return Indiana adjusted-gross-income
        boundary and is not composed into this annual resident program.
  summary: |-
    Tax-year-2026 Indiana full-year-resident individual-income-tax
    source-held program boundary. It accepts federal adjusted gross income,
    full-year residency, aligned filing-unit status, and a raw dependent
    count. It never accepts a completed Indiana income, deduction, exemption,
    taxable-income, statewide surtax, or credit amount.

    Indiana adjusted gross income, deductions and exemptions, taxable income,
    tax before credits including any applicable statewide surtaxes, tax after
    nonrefundable credits, refundable credits, and signed net income-tax
    liability before payments all fail closed while the pinned source gaps
    remain. The program is intentionally bounded and incomplete and makes no
    annual liability or oracle-parity claim.

    County and other local income taxes, withholding, estimated payments,
    extension payments, penalties, interest, refunds of payments, filing and
    collection administration, nonresident sourcing, and part-year allocation
    are outside scope.
  deferred_outputs:
    - output: us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_indiana_adjusted_gross_income
      reason: |-
        The pinned 2025 Title 6 snapshot displays the IC 6-3-1-3.5
        modification chain, but the corpus lacks a final 2026 codification and
        final 2026 IT-40 add-back and deduction instructions. Federal adjusted
        gross income cannot be transformed into operative 2026 Indiana
        adjusted gross income without projecting current-year conformity and
        return implementation.
      source_values:
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_current_law_source_hold_applies
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_income_base_source_hold_applies
    - output: us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_deductions_and_exemptions
      reason: |-
        The final 2026 IT-40 deduction, exemption, and dependent schedules are
        absent, and the displayed IC 6-3-1-3.5 text is from the 2025 Code.
        Complete current-year eligibility, election, interaction, and amount
        rules therefore remain source held.
      source_values:
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_deduction_and_exemption_source_hold_applies
    - output: us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_taxable_income
      reason: |-
        Indiana taxable income cannot be completed until the Indiana income
        base and the full deduction and exemption chain are source complete.
      source_values:
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_complete_liability_source_hold_applies
    - output: us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_tax_before_credits_including_statewide_surtaxes
      reason: |-
        The 2.95 percent regular rate is source complete, but it cannot be
        applied before Indiana taxable income is complete. The pinned corpus
        also lacks the final 2026 Schedule 4 and a complete statewide
        individual specialty-tax and surtax surface. County income tax is
        separately excluded as local tax.
      source_values:
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_tax_and_surtax_source_hold_applies
    - output: us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_tax_after_nonrefundable_credits
      reason: |-
        The final 2026 IT-40 credit schedules and a complete operative
        nonrefundable-credit eligibility, limitation, ordering, recapture, and
        carryforward chain are absent.
      source_values:
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_credit_surface_source_hold_applies
    - output: us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_refundable_credits
      reason: |-
        The final 2026 IT-40 credit schedules and complete operative
        refundable-credit eligibility, limitation, ordering, and recapture
        rules are absent.
      source_values:
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_credit_surface_source_hold_applies
    - output: us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_net_income_tax_liability_before_payments
      reason: |-
        Signed annual resident liability cannot be completed until every
        current-law, income-base, deduction, exemption, tax, surtax, and credit
        source hold is cleared.
      source_values:
        - us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_complete_liability_source_hold_applies

rules:
  - name: in_pit_2026_input_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Indiana DOR full-year-resident IT-40 and raw federal/dependent input domain
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Federal forms such as Form 1040 and W-4 can be found on the IRS website."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule IN-DEP 54815 Dependent Information and Additional Dependent Information"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          in_pit_2026_is_full_year_indiana_resident_return
          and in_pit_2026_federal_and_indiana_filing_units_are_aligned
          and (
            in_pit_2026_federal_adjusted_gross_income >= 0
            or in_pit_2026_federal_adjusted_gross_income < 0
          )
          and in_pit_2026_dependent_count >= 0
          and floor(in_pit_2026_dependent_count) == in_pit_2026_dependent_count

  - name: in_pit_2026_current_law_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Missing final 2026 Indiana Code and final tax-year-2026 IT-40 annual-return package
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "You must download and use the correct form for the desired filing year."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "2025 IT-40 Income Tax Instruction Booklet (not including form or schedules)"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

  - name: in_pit_2026_income_base_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Indiana adjusted-gross-income modification chain is not current-year source complete
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/statute/6-3-1-3.5
              excerpt: '"adjusted gross income" (as defined in Section 62 of the Internal Revenue Code), modified as follows'
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule 1 53995 Add-Backs"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: in_pit_2026_current_law_source_hold_applies

  - name: in_pit_2026_deduction_and_exemption_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Final 2026 Indiana deduction, exemption, and dependent schedules are absent
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/statute/6-3-1-3.5
              excerpt: "Subtract one thousand dollars ($1,000), or in the case of a joint return filed by a husband and wife"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule 3 53997 Exemptions"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          in_pit_2026_current_law_source_hold_applies
          or in_pit_2026_income_base_source_hold_applies

  - name: in_pit_2026_tax_and_surtax_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Regular 2026 rate is known, but taxable income and the complete statewide specialty-tax surface are held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/individual-income-tax-rate/2026/individual-income-tax-rate
              excerpt: "The Indiana Individual adjusted gross income tax rate for 2026 is 2.95%"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule 4 56540 Other Taxes"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          in_pit_2026_current_law_source_hold_applies
          or in_pit_2026_income_base_source_hold_applies
          or in_pit_2026_deduction_and_exemption_source_hold_applies

  - name: in_pit_2026_credit_surface_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Missing final 2026 IT-40 credit schedules and complete credit ordering authority
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule 5 / Schedule IN-DONATE 53998 Credits / Donations"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "IN-EIC 49469 Indiana's Earned Income Credit"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/statute/6-3.1-21-1
              excerpt: "This chapter creates the Indiana earned income tax credit."
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

  - name: in_pit_2026_complete_liability_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Combined source hold for incomplete 2026 Indiana resident liability
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/statute/6-3-1-3.5
              excerpt: '"adjusted gross income" shall mean the following'
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/statute/6-3-2-1
              excerpt: "two and ninety-five hundredths percent (2.95%)"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "You must include Schedules 1 (add-backs), 2 (deductions), 5 (credits"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          in_pit_2026_current_law_source_hold_applies
          or in_pit_2026_income_base_source_hold_applies
          or in_pit_2026_deduction_and_exemption_source_hold_applies
          or in_pit_2026_tax_and_surtax_source_hold_applies
          or in_pit_2026_credit_surface_source_hold_applies

  - name: in_pit_2026_indiana_adjusted_gross_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Indiana adjusted-gross-income sentinel while the current-year income base is source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/statute/6-3-1-3.5
              excerpt: '"adjusted gross income" shall mean the following'
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: in_pit_2026_deductions_and_exemptions
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Indiana deduction-and-exemption sentinel while the current-year schedules are source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule 2 53996 Deductions"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule 3 53997 Exemptions"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: in_pit_2026_taxable_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Indiana taxable-income sentinel while income, deductions, and exemptions are source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/statute/6-3-2-1
              excerpt: "a tax at the following rate of adjusted gross income is imposed"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: in_pit_2026_tax_before_credits_including_statewide_surtaxes
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Indiana tax-and-statewide-surtax sentinel while taxable income and the complete tax surface are source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/guidance/dor/individual-income-tax-rate/2026/individual-income-tax-rate
              excerpt: "The Indiana Individual adjusted gross income tax rate for 2026 is 2.95%"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: in_pit_2026_tax_after_nonrefundable_credits
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Indiana tax-after-nonrefundable-credits sentinel while the current-year credit surface is source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "Schedule 5 / Schedule IN-DONATE 53998 Credits / Donations"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: in_pit_2026_refundable_credits
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Indiana refundable-credit sentinel while the current-year credit surface is source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/guidance/dor/current-year-individual-tax-forms/available-return-materials
              excerpt: "IN-EIC 49469 Indiana's Earned Income Credit"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: in_pit_2026_net_income_tax_liability_before_payments
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed signed Indiana resident income-tax liability sentinel before payments
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-in/statute/6-3-2-1
              excerpt: "Each taxable year, a tax at the following rate of adjusted gross income is imposed"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

inputs:
  - name: in_pit_2026_federal_adjusted_gross_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Federal adjusted gross income from the aligned federal return; it is not a completed Indiana income amount.
  - name: in_pit_2026_is_full_year_indiana_resident_return
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Whether the return is within this program's full-year Indiana resident scope.
  - name: in_pit_2026_federal_and_indiana_filing_units_are_aligned
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Whether the federal return and Indiana return cover the same filing unit.
  - name: in_pit_2026_dependent_count
    entity: TaxUnit
    dtype: Count
    period: Year
    description: Raw dependent count potentially relevant to the Indiana exemption chain; no completed exemption amount is accepted.
