# The pinned corpus has the 2026 regular rate but lacks final 2026 Indiana
# current-law and annual-return materials. These fixtures prove that federal
# and raw-fact inputs can establish the domain while every Indiana Money stage
# remains a fail-closed sentinel.

- name: valid full-year resident return is held through signed liability
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-in:policies/income_tax/2026_resident_liability_source_hold#input.in_pit_2026_federal_adjusted_gross_income: 60000
    us-in:policies/income_tax/2026_resident_liability_source_hold#input.in_pit_2026_is_full_year_indiana_resident_return: true
    us-in:policies/income_tax/2026_resident_liability_source_hold#input.in_pit_2026_federal_and_indiana_filing_units_are_aligned: true
    us-in:policies/income_tax/2026_resident_liability_source_hold#input.in_pit_2026_dependent_count: 0
  output:
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_input_domain_is_valid: holds
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_current_law_source_hold_applies: holds
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_income_base_source_hold_applies: holds
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_deduction_and_exemption_source_hold_applies: holds
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_tax_and_surtax_source_hold_applies: holds
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_credit_surface_source_hold_applies: holds
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_complete_liability_source_hold_applies: holds
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_indiana_adjusted_gross_income: '0'
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_deductions_and_exemptions: '0'
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_taxable_income: '0'
    us-in:policies/income_tax/2026_resident_liability_source_hold#in_pit_2026_tax_before_credits_including_statewide_surtaxes: '0'
