format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-nd/statute/57/57-38-30.3
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us-nd/statute/57/57-38-30.3
      rationale: |-
        N.D.C.C. section 57-38-30.3(1) imposes individual income tax under
        filing-status schedules, and subdivision (g) directs the Tax
        Commissioner to prescribe annually indexed replacement schedules.
        The official corpus provision composes the current Century Code with
        the Tax Commissioner's official 2026 Form ND-1ES estimated-income-tax
        worksheet. The form supplies every threshold, cumulative base amount,
        and marginal rate for its single, joint or qualifying-surviving-spouse,
        married-separate, and head-of-household estimated-tax schedules.

        This narrow module accepts caller-supplied estimated North Dakota
        taxable income and four filing-status classifications. Exactly one
        status must hold; missing or overlapping statuses fail closed to zero.
        The module does not construct annual-return taxable income, substitute
        for the Commissioner's prescribed annual Tax Table, apply credits or
        return rounding, compute estimated payments, or claim final annual
        liability. Every executable version fails closed outside tax year 2026.
  summary: |-
    Canonical North Dakota 2026 Form ND-1ES estimated-tax schedule component.
    It normalizes caller-supplied estimated North Dakota taxable income to zero,
    validates that exactly one filing status is selected, and applies the
    corresponding Form ND-1ES schedule while preserving the Commissioner's
    published cumulative top-bracket bases.

    Its sole public result is estimated schedule tax before credits. It is not
    annual Form ND-1 tax, an annual Tax Table result, estimated payments, or
    final liability. PolicyEngine parity is not claimed.
rules:
  - name: nd_pit_2026_nd1es_estimated_taxable_income_boundary
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Official 2026 Form ND-1ES worksheet, caller-supplied estimated North Dakota taxable income
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-nd/statute/57/57-38-30.3
              excerpt: "North Dakota taxable income multiplied by the rates in the applicable rate schedule"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: max(0, nd_pit_2026_nd1es_estimated_taxable_income)

  - name: nd_pit_2026_nd1es_filing_status_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Official 2026 Form ND-1ES mutually exclusive filing-status schedules
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source: {corpus_citation_path: us-nd/statute/57/57-38-30.3, excerpt: "Single, other than head of household or surviving spouse."}
          - path: versions[0].formula
            kind: condition
            source: {corpus_citation_path: us-nd/statute/57/57-38-30.3, excerpt: "Married filing jointly and surviving spouse."}
          - path: versions[0].formula
            kind: condition
            source: {corpus_citation_path: us-nd/statute/57/57-38-30.3, excerpt: "Married filing separately."}
          - path: versions[0].formula
            kind: condition
            source: {corpus_citation_path: us-nd/statute/57/57-38-30.3, excerpt: "Head of household."}
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            nd_pit_2026_nd1es_filing_status_single
            or nd_pit_2026_nd1es_filing_status_joint_or_surviving_spouse
            or nd_pit_2026_nd1es_filing_status_separate
            or nd_pit_2026_nd1es_filing_status_head_of_household
          )
          and not (
            nd_pit_2026_nd1es_filing_status_single
            and (
              nd_pit_2026_nd1es_filing_status_joint_or_surviving_spouse
              or nd_pit_2026_nd1es_filing_status_separate
              or nd_pit_2026_nd1es_filing_status_head_of_household
            )
          )
          and not (
            nd_pit_2026_nd1es_filing_status_joint_or_surviving_spouse
            and (
              nd_pit_2026_nd1es_filing_status_separate
              or nd_pit_2026_nd1es_filing_status_head_of_household
            )
          )
          and not (
            nd_pit_2026_nd1es_filing_status_separate
            and nd_pit_2026_nd1es_filing_status_head_of_household
          )

  - name: nd_pit_2026_nd1es_middle_rate
