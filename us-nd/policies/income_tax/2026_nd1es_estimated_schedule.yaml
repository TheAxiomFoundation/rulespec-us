  - name: nd_pit_2026_nd1es_single_schedule_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: N.D.C.C. section 57-38-30.3(1)(a), official 2026 single schedule
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source: {corpus_citation_path: us-nd/statute/57/57-38-30.3, excerpt: "Single, other than head of household or surviving spouse."}
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if nd_pit_2026_nd1es_estimated_taxable_income_boundary <= nd_pit_2026_nd1es_single_zero_tax_ceiling: 0
          else: if nd_pit_2026_nd1es_estimated_taxable_income_boundary <= nd_pit_2026_nd1es_single_top_threshold:
              nd_pit_2026_nd1es_middle_rate * (nd_pit_2026_nd1es_estimated_taxable_income_boundary - nd_pit_2026_nd1es_single_zero_tax_ceiling)
          else:
              nd_pit_2026_nd1es_single_top_base
              + nd_pit_2026_nd1es_top_rate * (nd_pit_2026_nd1es_estimated_taxable_income_boundary - nd_pit_2026_nd1es_single_top_threshold)

