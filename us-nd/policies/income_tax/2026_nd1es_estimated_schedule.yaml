  - name: nd_pit_2026_nd1es_estimated_schedule_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Official 2026 Form ND-1ES applicable estimated-tax schedule before credits
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-nd/statute/57/57-38-30.3
              excerpt: "corresponding to an individual's filing status used for federal income tax purposes"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if not nd_pit_2026_nd1es_filing_status_is_valid:
              0
          else: if nd_pit_2026_nd1es_filing_status_joint_or_surviving_spouse:
              nd_pit_2026_nd1es_joint_schedule_tax
          else: if nd_pit_2026_nd1es_filing_status_separate:
              nd_pit_2026_nd1es_separate_schedule_tax
          else: if nd_pit_2026_nd1es_filing_status_head_of_household:
              nd_pit_2026_nd1es_head_schedule_tax
          else:
              nd_pit_2026_nd1es_single_schedule_tax

inputs:
  - name: nd_pit_2026_nd1es_estimated_taxable_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Estimated North Dakota taxable income supplied by the caller for Form ND-1ES.
  - name: nd_pit_2026_nd1es_filing_status_single
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: True only for a single return other than head of household or qualifying surviving spouse.
  - name: nd_pit_2026_nd1es_filing_status_joint_or_surviving_spouse
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: True only for a joint or qualifying-surviving-spouse return.
  - name: nd_pit_2026_nd1es_filing_status_separate
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: True only for a married-separate return.
  - name: nd_pit_2026_nd1es_filing_status_head_of_household
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: True only for a head-of-household return.
