format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/540-resources-540-5-excluded-resources/block-17
    source_sha256: 22dfbd1ec2ae1dd6ce0bd845142f4159155f1c0c5fbf5d38758044bd74e65511
  summary: |-
    The CAO will exclude:
    Funds deposited into and interest accrued on family savings accounts (FSAs) during the time the person maintains or makes contributions into the account
inputs:
  - name: family_savings_account_deposited_funds
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: family_savings_account_accrued_interest
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: person_maintains_same_family_savings_account
    entity: Person
    dtype: Boolean
    period: Month
  - name: person_contributes_to_same_family_savings_account
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: family_savings_account_excluded_resources
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 540.5, family savings accounts exclusion; Pub. L. 104-193 § 404
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/540-resources-540-5-excluded-resources/block-17
              excerpt: Funds deposited into and interest accrued on family savings accounts (FSAs) during the time the person maintains or makes contributions into the account
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if person_maintains_same_family_savings_account or person_contributes_to_same_family_savings_account:
            family_savings_account_deposited_funds + family_savings_account_accrued_interest
          else: 0
