format: rulespec/v1
module:
  summary: |-
    All funds deposited into (SEED) accounts and any interest accrued.
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/540-resources-540-5-excluded-resources/block-18
    source_sha256: 153d2dbc07c56da1502bdb0cc87357ecbb6af658de0f3ae21ce4627d7dd8fa18
  proof_validation:
    required: true
inputs:
  - name: account_established_for_child_born_on_or_after_cutoff
    entity: Asset
    dtype: Boolean
    period: Month
  - name: account_is_savings_account_at_pfp_credit_union
    entity: Asset
    dtype: Boolean
    period: Month
  - name: account_withdrawals_require_pfp_permission
    entity: Asset
    dtype: Boolean
    period: Month
  - name: account_intended_use
    entity: Asset
    dtype: String
    period: Month
  - name: funds_deposited
    entity: Asset
    dtype: Money
    period: Month
  - name: interest_accrued
    entity: Asset
    dtype: Money
    period: Month
rules:
  - name: seed_account
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 540.5, SEED account note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/540-resources-540-5-excluded-resources/block-18
              excerpt: "SEED accounts are accounts established for children born on or after January 1, 2006"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/540-resources-540-5-excluded-resources/block-18
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          account_established_for_child_born_on_or_after_cutoff
          and account_is_savings_account_at_pfp_credit_union
          and account_withdrawals_require_pfp_permission
          and (
            account_intended_use == "post-secondary education"
            or account_intended_use == "career-specific training"
            or account_intended_use == "start a small business"
            or account_intended_use == "purchase a home"
          )
  - name: excluded_seed_resources
    kind: derived
    entity: Asset
    dtype: Money
    period: Month
    source: Pennsylvania SNAP Handbook 540.5, SEED funds and interest exclusion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/540-resources-540-5-excluded-resources/block-18
              excerpt: "All funds deposited into (SEED) accounts and any interest accrued."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if seed_account: funds_deposited + interest_accrued else: 0
