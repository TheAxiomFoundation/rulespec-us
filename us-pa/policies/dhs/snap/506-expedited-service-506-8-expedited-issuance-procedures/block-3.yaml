format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-3
    source_sha256: 86706c11d07c9fe9a44d6b65bbdbfd1c9afca2f9993eddb7f768a0485968b6a3
  summary: |-
    If the household provides all required verification within the 5 -day time limit and is eligible, the CAO must process a regular opening with a centrally issued OTI for the first and second months.

    If verification is postponed, the CAO must process a locally issued NCE for the first and second months.

    When the household provides all required postponed verifications, the CAO must:

    Determine eligibility for continued benefits; and

    Process a regular opening for the third month, if the household is eligible.

    This opening cannot be processed until after the deadline for the second month of the NCE period has passed.
inputs:
  - name: verification_postponed
    entity: Household
    dtype: Boolean
    period: Month
  - name: all_required_verification_provided
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_elapsed_days
    entity: Household
    dtype: Integer
    period: Month
  - name: household_eligible
    entity: Household
    dtype: Boolean
    period: Month
  - name: all_required_postponed_verifications_provided
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_eligible_for_continued_benefits
    entity: Household
    dtype: Boolean
    period: Month
  - name: second_month_nce_deadline_has_passed
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: verification_time_limit_days
    kind: parameter
    dtype: Integer
    source: Pennsylvania SNAP Handbook 506.8, verification time limit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-3
              excerpt: within the 5 -day time limit
    versions:
      - effective_from: '2026-03-12'
        formula: |-
          5
  - name: first_and_second_month_issuance_procedure
    kind: derived
    entity: Household
    dtype: String
    period: Month
    source: Pennsylvania SNAP Handbook 506.8, first and second months
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-3
              excerpt: If verification is postponed, the CAO must process a locally issued NCE for the first and second months.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-3
              excerpt: If the household provides all required verification within the 5 -day time limit and is eligible, the CAO must process a regular opening with a centrally issued OTI for the first and second months.
    versions:
      - effective_from: '2026-03-12'
        formula: |-
          if verification_postponed: "locally issued NCE"
          else: if all_required_verification_provided and verification_elapsed_days <= verification_time_limit_days and household_eligible: "regular opening with centrally issued OTI"
          else: "no procedure specified by this source"
  - name: third_month_regular_opening_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 506.8, postponed verification and third-month opening
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-3
              excerpt: 'When the household provides all required postponed verifications, the CAO must:'
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-3
              excerpt: Process a regular opening for the third month, if the household is eligible.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-3
              excerpt: This opening cannot be processed until after the deadline for the second month of the NCE period has passed.
    versions:
      - effective_from: '2026-03-12'
        formula: |-
          all_required_postponed_verifications_provided
          and household_eligible_for_continued_benefits
          and second_month_nce_deadline_has_passed
