format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-2
    source_sha256: 5d0547f58fb19a6db7d49f4fc7c9db76651bdf25fbab98c8e37e15b0896fd8e0
  summary: |-
    If the household provides all verification when applying or within the 5-day expedited service time limit and is eligible, the CAO must process a regular opening with a centrally issued OTI for the first month.
    If there is postponed verification, the CAO must process a centrally issued NCE for the first month.
    When the household provides all required postponed verifications, the CAO must:
    Determine eligibility for continued benefits; and
    Process a regular opening for the second month, if the household is eligible.
inputs:
  - name: all_verification_provided
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_days_after_application
    entity: Household
    dtype: Integer
    period: Month
  - name: household_is_eligible
    entity: Household
    dtype: Boolean
    period: Month
  - name: first_month_regular_opening_with_centrally_issued_oti_processed
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_is_postponed
    entity: Household
    dtype: Boolean
    period: Month
  - name: first_month_centrally_issued_nce_processed
    entity: Household
    dtype: Boolean
    period: Month
  - name: all_required_postponed_verifications_provided
    entity: Household
    dtype: Boolean
    period: Month
  - name: continued_benefits_eligibility_determined
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_is_eligible_for_second_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: second_month_regular_opening_processed
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: expedited_service_time_limit_days
    kind: parameter
    dtype: Integer
    source: Pennsylvania SNAP Handbook 506.8, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-2
              excerpt: within the 5-day expedited service time limit
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          5
  - name: first_month_oti_processing_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 506.8, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-2
              excerpt: If the household provides all verification when applying or within the 5-day expedited service time limit and is eligible, the CAO must process a regular opening with a centrally issued OTI for the first month.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not (all_verification_provided
            and verification_days_after_application <= expedited_service_time_limit_days
            and household_is_eligible)
          or first_month_regular_opening_with_centrally_issued_oti_processed
  - name: first_month_nce_processing_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 506.8, second sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-2
              excerpt: If there is postponed verification, the CAO must process a centrally issued NCE for the first month.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not verification_is_postponed
          or first_month_centrally_issued_nce_processed
  - name: postponed_verification_followup_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 506.8, postponed-verification chapeau and both following duties
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-2
              excerpt: 'When the household provides all required postponed verifications, the CAO must:'
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-2
              excerpt: Determine eligibility for continued benefits; and
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/506-expedited-service-506-8-expedited-issuance-procedures/block-2
              excerpt: Process a regular opening for the second month, if the household is eligible.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not all_required_postponed_verifications_provided
          or (continued_benefits_eligibility_determined
            and (not household_is_eligible_for_second_month
              or second_month_regular_opening_processed))
