format: rulespec/v1
module:
  summary: |-
    A LIHEAP payment or emergency cooling project (ECP) payment was received, or
    A LIHEAP payment or emergency cooling project (ECP) was authorized;
    When an adult member leaves a LIHEAP household and applies for SNAP, the member may receive the HSUA, because he or she was included in a LIHEAP payment.
    A household that has heating or cooling costs on an irregular basis but is otherwise eligible to use the HSUA may continue to use it between billing periods.
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
    source_sha256: 3458937328678771b7cc408a14b5baddb1c242f2f1e3e86b5fca40ab15c07927
  proof_validation:
    required: true
inputs:
  - name: within_certification_period_indicated_in_current_annual_liheap_history
    entity: Household
    dtype: Boolean
    period: Month
  - name: liheap_payment_received
    entity: Household
    dtype: Boolean
    period: Month
  - name: ecp_payment_received
    entity: Household
    dtype: Boolean
    period: Month
  - name: liheap_payment_authorized
    entity: Household
    dtype: Boolean
    period: Month
  - name: ecp_authorized
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_has_moved
    entity: Household
    dtype: Boolean
    period: Month
  - name: liheap_received_at_previous_address
    entity: Household
    dtype: Boolean
    period: Month
  - name: within_same_annual_liheap_period
    entity: Household
    dtype: Boolean
    period: Month
  - name: liheap_payment_received_at_new_address
    entity: Household
    dtype: Boolean
    period: Month
  - name: adult_member_left_liheap_household
    entity: Person
    dtype: Boolean
    period: Month
  - name: applies_for_snap
    entity: Person
    dtype: Boolean
    period: Month
  - name: heating_or_cooling_costs_are_irregular
    entity: Household
    dtype: Boolean
    period: Month
  - name: otherwise_eligible_to_use_hsua
    entity: Household
    dtype: Boolean
    period: Month
  - name: between_billing_periods
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: hsua_entitlement_from_liheap_history
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 9, opening sentence and payment alternatives
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
              excerpt: "A LIHEAP payment or emergency cooling project (ECP) payment was received, or"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
              excerpt: "A LIHEAP payment or emergency cooling project (ECP) was authorized;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
              excerpt: "A household is entitled to the HSUA for the certification period as indicated in the LIHEAP system history file in E-CIS during the current annual LIHEAP period (October 1 to September 30) if:"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          within_certification_period_indicated_in_current_annual_liheap_history
          and (liheap_payment_received or ecp_payment_received or liheap_payment_authorized or ecp_authorized)
  - name: hsua_entitlement_after_move
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 9, household moves paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
              excerpt: "When a household moves, the entitlement to the SUA continues if that household received LIHEAP at the previous address and it is within the same annual LIHEAP period."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
              excerpt: "If it did not receive LIHEAP at the previous address but has received a LIHEAP payment at the new address, the household is entitled to the HSUA."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_has_moved
          and (
            (liheap_received_at_previous_address and within_same_annual_liheap_period)
            or (
              not liheap_received_at_previous_address
              and liheap_payment_received_at_new_address
            )
          )
  - name: departing_adult_may_receive_hsua
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 9, departing adult paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
              excerpt: "When an adult member leaves a LIHEAP household and applies for SNAP, the member may receive the HSUA, because he or she was included in a LIHEAP payment."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          adult_member_left_liheap_household
          and applies_for_snap
  - name: hsua_continues_between_bills
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 9, irregular heating or cooling costs paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-9
              excerpt: "A household that has heating or cooling costs on an irregular basis but is otherwise eligible to use the HSUA may continue to use it between billing periods."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          heating_or_cooling_costs_are_irregular
          and otherwise_eligible_to_use_hsua
          and between_billing_periods
