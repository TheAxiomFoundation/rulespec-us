format: rulespec/v1
module:
  summary: |-
    A SNAP household living with and sharing costs with another person or household is entitled to the appropriate SUA. There is no proration .
    Both SNAP households are eligible for the HSUA based on receipt of LIHEAP during the current heating season.
    If two or more households share telephone expenses, each household gets the $33 telephone allowance.
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-10
    source_sha256: 0a74da7722a4a2d530e0e7ccf3b174fa743259544fc2c055f7fc40a3f60ff449
  proof_validation:
    required: true
inputs:
  - name: lives_with_another_person_or_household
    entity: Household
    dtype: Boolean
    period: Month
  - name: shares_costs_with_co_resident_person_or_household
    entity: Household
    dtype: Boolean
    period: Month
  - name: appropriate_sua_amount
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: lives_with_another_separate_snap_household
    entity: Household
    dtype: Boolean
    period: Month
  - name: received_liheap_as_one_unit_during_current_heating_season
    entity: Household
    dtype: Boolean
    period: Month
  - name: shares_telephone_expenses_with_another_household
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: shared_residence_sua
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block-10, opening paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-10
              excerpt: A SNAP household living with and sharing costs with another person or household is entitled to the appropriate SUA. There is no proration .
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if lives_with_another_person_or_household and shares_costs_with_co_resident_person_or_household: appropriate_sua_amount else: 0
  - name: shared_liheap_hsua_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block-10, grandmother example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-10
              excerpt: Both SNAP households live at the same residence and receive LIHEAP as one unit. Both SNAP households are eligible for the HSUA based on receipt of LIHEAP during the current heating season.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          lives_with_another_separate_snap_household
          and received_liheap_as_one_unit_during_current_heating_season
  - name: telephone_allowance_standard
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block-10, final paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-10
              excerpt: each household gets the $33 telephone allowance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          33
  - name: shared_telephone_allowance
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block-10, final paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-10
              excerpt: If two or more households share telephone expenses, each household gets the $33 telephone allowance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if shares_telephone_expenses_with_another_household: telephone_allowance_standard else: 0
