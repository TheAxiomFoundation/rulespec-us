format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
    source_sha256: 009bfa01e5c96c6b9d22342496da93a6a3fddc264375a30589733f7176ba4db4
  summary: |-
    Living arrangements are not dependent on ownership of the property where the household lives.
    When households share a residence, the CAO must discuss the situation with the household to determine if the households are actually sharing expenses or if a roomer situation exists.
inputs:
  - name: payment_is_for_a_room
    entity: Person
    dtype: Boolean
    period: Month
  - name: households_are_sharing_expenses
    entity: Person
    dtype: Boolean
    period: Month
  - name: room_payment
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: example_households_are_sharing_expenses
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: example_apartment_rent
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 3, example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: X rents an apartment for $550 a month.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          550
  - name: example_payment
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 3, example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: Y moves in and pays X $250 a month.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          250
  - name: example_stated_shared_rent
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 3, expense-sharing example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: X would be allowed shelter costs of $300 for the rent X pays.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          300
  - name: room_payment_self_employment_income
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 3, ownership independence and expense-sharing exclusion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: If the agreement between X and Y is that Y is paying X for a room, then the $250 payment is considered earned self-employment income for X.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: If the two households are sharing expenses, the payment made from Y to X is not considered income to X
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: SNAP rules do not limit self-employment from renting rooms to persons who own their residence.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if households_are_sharing_expenses: 0
          else: if payment_is_for_a_room: room_payment
          else: 0
  - name: example_x_shelter_cost
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 3, X expense-sharing and roomer examples
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: X would be allowed shelter costs of $300 for the rent X pays.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: Shelter costs of $550 would be allowed for X.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if example_households_are_sharing_expenses:
            max(0, example_apartment_rent - example_payment)
          else: example_apartment_rent
  - name: example_y_shared_shelter_cost
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, block 3, Y expense-sharing example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-3
              excerpt: If Y applies for SNAP, Y would be allowed shelter costs of $250.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if example_households_are_sharing_expenses: example_payment else: 0
