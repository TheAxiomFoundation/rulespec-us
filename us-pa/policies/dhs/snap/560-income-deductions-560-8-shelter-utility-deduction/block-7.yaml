format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-7
    source_sha256: 31cf26059543ba3c45b45894ca011b52e813557c8534449acfb003175b29f9f6
  summary: |-
    Allowable utility expenses to determine standard utility allowances (SUA) include the following:
    Heating and cooling fuel costs
    Water
    Electricity
    Sewer
    Well installation and maintenance
    Garbage and trash collection fee
    Septic tank installation and maintenance
    NOTE: Late/penalty fees or interest charges are not allowable utility expenses.
  deferred_outputs:
    - output: us-pa:policies/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-7#standard_telephone_allowance_amount
      reason: Cannot be computed until Chapter 560, Appendix A is encoded.
inputs:
  - name: utility_category
    entity: Payment
    dtype: String
    period: Month
  - name: charge_type
    entity: Payment
    dtype: String
    period: Month
  - name: telephone_type
    entity: Payment
    dtype: String
    period: Month
  - name: telephone_plan_has_monthly_service_fee
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: allowable_utility_expense
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, allowable utility expenses list and NOTE.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-7
              excerpt: 'Allowable utility expenses to determine standard utility allowances (SUA) include the following:'
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-7
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-7
              excerpt: Late/penalty fees or interest charges are not allowable utility expenses.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (utility_category == "heating_and_cooling_fuel"
          or utility_category == "water"
          or utility_category == "electricity"
          or utility_category == "sewer"
          or utility_category == "well_installation_and_maintenance"
          or utility_category == "garbage_and_trash_collection"
          or utility_category == "septic_tank_installation_and_maintenance")
          and not (charge_type == "late_fee")
          and not (charge_type == "penalty_fee")
          and not (charge_type == "interest_charge")
  - name: telephone_plan_qualifies_for_standard_allowance
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 560.8, standard telephone allowance paragraph.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-7
              excerpt: applies to regular or cell telephones having a monthly service fee associated with their plans.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/560-income-deductions-560-8-shelter-utility-deduction/block-7
              excerpt: Pagers do not qualify for this allowance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (telephone_type == "regular" or telephone_type == "cell")
          and telephone_plan_has_monthly_service_fee
