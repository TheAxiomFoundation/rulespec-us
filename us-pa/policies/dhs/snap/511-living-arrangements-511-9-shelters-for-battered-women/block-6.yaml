format: rulespec/v1
module:
  summary: |-
    If authorized by FNS, a shelter may accept SNAP benefits for meals provided to the resident and use the benefits to buy food from wholesalers.

    If not authorized by FNS, a shelter may be an AR and use SNAP benefits at retail stores to buy food for prepared meals served to residents.
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/511-living-arrangements-511-9-shelters-for-battered-women/block-6
    source_sha256: 349f629f016d456a2ebe5d9bbb39bb62c9a885a042cb09457b6c7a875b039c97
  proof_validation:
    required: true
inputs:
  - name: authorized_by_fns
    entity: Shelter
    dtype: Boolean
    period: Month
  - name: accepts_snap_for_meals_provided_to_resident
    entity: Shelter
    dtype: Boolean
    period: Month
  - name: uses_those_benefits_to_buy_food_from_wholesalers
    entity: Shelter
    dtype: Boolean
    period: Month
  - name: acts_as_ar
    entity: Shelter
    dtype: Boolean
    period: Month
  - name: uses_snap_at_retail_to_buy_food_for_prepared_meals_served_to_residents
    entity: Shelter
    dtype: Boolean
    period: Month
