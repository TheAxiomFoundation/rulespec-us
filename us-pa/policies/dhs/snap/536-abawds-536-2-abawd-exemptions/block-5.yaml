format: rulespec/v1
module:
  summary: |-
    Each state is allotted ABAWD exemptions equal to 8 percent of the state’s SNAP caseload that is ineligible because of the ABAWD time limit.
    These " discretionary exemptions” (sometimes also referred to as “ 8 % exemptions”) allow the state to extend SNAP eligibility to ABAWDs who would otherwise be ineligible because of the three-month time limit.
    See Appendix B for a list of the current discretionary exemptions.
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/536-abawds-536-2-abawd-exemptions/block-5
    source_sha256: 7a6a8a7cacaad593291cd3c044acebaf4a39680db1a7317adad649498a38a515
  proof_validation:
    required: true
inputs:
  - name: snap_caseload_ineligible_because_of_abawd_time_limit
    entity: StateAgency
    dtype: Count
    period: Month
rules:
  - name: discretionary_exemption_rate
    kind: parameter
    dtype: Rate
    source: Pennsylvania SNAP Handbook 536.2, discretionary exemption allotment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/536-abawds-536-2-abawd-exemptions/block-5
              excerpt: equal to 8 percent
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          0.08
  - name: abawd_time_limit_months
    kind: parameter
    dtype: Integer
    source: Pennsylvania SNAP Handbook 536.2, three-month time limit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/536-abawds-536-2-abawd-exemptions/block-5
              excerpt: three-month time limit
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          3
  - name: discretionary_exemption_allotment
    kind: derived
    entity: StateAgency
    dtype: Decimal
    period: Month
    source: Pennsylvania SNAP Handbook 536.2, discretionary exemption allotment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/536-abawds-536-2-abawd-exemptions/block-5
              excerpt: Each state is allotted ABAWD exemptions equal to 8 percent of the state’s SNAP caseload that is ineligible because of the ABAWD time limit.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          discretionary_exemption_rate * snap_caseload_ineligible_because_of_abawd_time_limit
