format: rulespec/v1
module:
  summary: |-
    The CAO must exclude interest earned on savings bonds and on the following checking and savings accounts in the month of receipt:
    Checking and savings accounts, including passbook accounts
    Interest that remains in the account after the month of receipt is considered a resource (see Chapter 512 and 540 ) .
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/550-income-550-5-income-excluded-in-computing-eligibility/block-37
    source_sha256: 57c9cdf9b00f8ab6834f681fb80ba7fe9b6362e8719324fb3486efba48478c21
  proof_validation:
    required: true
inputs:
  - name: interest_source_type
    entity: Payment
    dtype: String
    period: Month
  - name: month_is_this_interest_receipt_month
    entity: Payment
    dtype: Boolean
    period: Month
  - name: month_is_after_this_interest_receipt_month
    entity: Payment
    dtype: Boolean
    period: Month
  - name: this_interest_remains_in_its_account
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: interest_has_listed_source
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 550.5, interest exclusion account list
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/550-income-550-5-income-excluded-in-computing-eligibility/block-37
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          interest_source_type == "savings_bond"
          or interest_source_type == "checking_account"
          or interest_source_type == "savings_account"
          or interest_source_type == "passbook_account"
          or interest_source_type == "statement_account"
          or interest_source_type == "now_account"
          or interest_source_type == "super_now_account"
          or interest_source_type == "money_market_deposit_account"
          or interest_source_type == "certificate_of_deposit"
          or interest_source_type == "christmas_club"
          or interest_source_type == "vacation_club"
  - name: interest_excluded_from_income
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 550.5, interest exclusion in receipt month
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/550-income-550-5-income-excluded-in-computing-eligibility/block-37
              excerpt: "The CAO must exclude interest earned on savings bonds and on the following checking and savings accounts in the month of receipt:"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          interest_has_listed_source
          and month_is_this_interest_receipt_month
  - name: retained_interest_is_resource
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 550.5, retained interest after receipt month
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/550-income-550-5-income-excluded-in-computing-eligibility/block-37
              excerpt: "Interest that remains in the account after the month of receipt is considered a resource"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          interest_has_listed_source
          and month_is_after_this_interest_receipt_month
          and this_interest_remains_in_its_account
