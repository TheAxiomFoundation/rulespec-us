format: rulespec/v1
module:
  summary: |-
    The CAO must exclude payments to individuals for injuries or death resulting from exposure to radiation from nuclear testing and uranium mining in Arizona, Nevada, or Utah.
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/550-income-550-5-income-excluded-in-computing-eligibility/block-28
    source_sha256: 1cd47cf5cec334eb4fdb19ae33235e200847a1a8dadd0c6d66eabba14c9ddf68
  proof_validation:
    required: true
inputs:
  - name: radiation_injury_or_death_payments
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: payments_concern_nuclear_testing_or_uranium_mining_exposure
    entity: Person
    dtype: Boolean
    period: Month
  - name: payments_concern_exposure_in_arizona_nevada_or_utah
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: radiation_compensation_excluded_income
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Pennsylvania SNAP Handbook 550.5, block 28; Pub. L. 101-426 § 6(h)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/550-income-550-5-income-excluded-in-computing-eligibility/block-28
              excerpt: "exclude payments to individuals for injuries or death resulting from exposure to radiation from nuclear testing and uranium mining in Arizona, Nevada, or Utah."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if payments_concern_nuclear_testing_or_uranium_mining_exposure and payments_concern_exposure_in_arizona_nevada_or_utah: radiation_injury_or_death_payments else: 0
