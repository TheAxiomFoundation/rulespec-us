format: rulespec/v1
module:
  summary: |-
    The CAO must complete an EBT Card Request form and get the recipient’s signature on the form.
    The form must be kept in the case record (see the sample in Chapter 580, Appendix A ).
    The CAO must monitor card replacements when the recipient requests multiple replacements for lost or stolen cards.
    The CAO must not deny or delay a recipient's request for replacement of the EBT ACCESS card.
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
    source_sha256: 12545b7cdc1fd3adca54d54d6be21586243caf43402c84a203ce39bbb82ef5f2
  proof_validation:
    required: true
inputs:
  - name: recipient_requested_lost_or_stolen_card_replacements_within_six_months
    entity: Person
    dtype: Count
    period: Month
  - name: recipient_requested_lost_or_stolen_card_replacements_in_one_month
    entity: Person
    dtype: Count
    period: Month
  - name: ebt_card_request_form_completed
    entity: Person
    dtype: Boolean
    period: Month
  - name: recipient_signature_obtained_on_request_form
    entity: Person
    dtype: Boolean
    period: Month
  - name: signed_request_form_kept_in_case_record
    entity: Person
    dtype: Boolean
    period: Month
  - name: supervisor_discussed_responsibility_to_keep_card_safe
    entity: Person
    dtype: Boolean
    period: Month
  - name: supervisor_warned_illegal_card_use_may_result_in_disqualification
    entity: Person
    dtype: Boolean
    period: Month
  - name: supervisor_warned_further_replacements_will_result_in_oig_referral
    entity: Person
    dtype: Boolean
    period: Month
  - name: replacement_request_denied
    entity: Person
    dtype: Boolean
    period: Month
  - name: replacement_request_delayed
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: six_month_replacement_threshold
    kind: parameter
    dtype: Count
    source: Pennsylvania SNAP Handbook 580.6, replacement monitoring paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: three replacements of a lost or stolen card within six months
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          3
  - name: replacement_lookback_months
    kind: parameter
    dtype: Integer
    source: Pennsylvania SNAP Handbook 580.6, replacement monitoring paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: within six months
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          6
  - name: one_month_replacement_threshold
    kind: parameter
    dtype: Count
    source: Pennsylvania SNAP Handbook 580.6, replacement monitoring paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: two or more replacements in one month
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          2
  - name: supervisor_interview_required
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 580.6, monitoring recipient requests for multiple lost-or-stolen card replacements and scheduling an OIM supervisor interview
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: After three replacements of a lost or stolen card within six months or two or more replacements in one month, the CAO must schedule the recipient for an interview with an OIM supervisor
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: when the recipient requests multiple replacements for lost or stolen cards
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          recipient_requested_lost_or_stolen_card_replacements_within_six_months >= six_month_replacement_threshold
          or recipient_requested_lost_or_stolen_card_replacements_in_one_month >= one_month_replacement_threshold
  - name: request_documentation_compliant
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 580.6, EBT Card Request form, recipient signature, and case-record retention
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: The CAO must complete an EBT Card Request form and get the recipient’s signature on the form.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: The form must be kept in the case record
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          ebt_card_request_form_completed
          and recipient_signature_obtained_on_request_form
          and signed_request_form_kept_in_case_record
  - name: supervisor_interview_content_compliant
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 580.6, required discussion and supervisor warnings at the replacement interview
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: to discuss the recipient’s responsibility to keep the card safe
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: illegal use of the card may result in disqualification and that further replacements will result in a referral to the Office of Inspector General (OIG)
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not supervisor_interview_required
          or (
            supervisor_discussed_responsibility_to_keep_card_safe
            and supervisor_warned_illegal_card_use_may_result_in_disqualification
            and supervisor_warned_further_replacements_will_result_in_oig_referral
          )
  - name: replacement_request_handling_compliant
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 580.6, prohibition on denying or delaying replacement requests
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/580-issuing-benefits-580-6-pennsylvania-ebt-access-card/block-6
              excerpt: The CAO must not deny or delay a recipient's request for replacement of the EBT ACCESS card.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not replacement_request_denied
          and not replacement_request_delayed
