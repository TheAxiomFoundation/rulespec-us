format: rulespec/v1
module:
  status: deferred
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/578-verification-requirements-578-appendix-a/block-12
    source_sha256: fb2e476d084100ccdf70322166d70bc77b67c0e543b2379f440fc2501265318a
  summary: |-
    Support agreement (The CAO must check PACSES even if applicant/recipient states support is voluntary)

    NOTE: Individuals may get proof of SSA and SSI benefits online by creating an account with the Social Security Administration.
  deferred_outputs:
    - output: us-pa:policies/dhs/snap/578-verification-requirements-578-appendix-a/block-12#verification_information
      reason: >-
        The unmarked document inventory lists SSA, Workers' Compensation, VA,
        Railroad Retirement, SSI, and Unemployment Compensation award letters;
        court orders; benefits and support-payment correspondence; UC exhaustion
        letters; pension award notices; benefit payment checks; divorce or
        separation decrees; income tax statements; support agreements; rental
        agreements; and interest Forms 1099. It supplies documentary verification
        information rather than a computable determination or amount.
    - output: us-pa:policies/dhs/snap/578-verification-requirements-578-appendix-a/block-12#pacses_check
      reason: >-
        "Support agreement (The CAO must check PACSES even if applicant/recipient
        states support is voluntary)" states an administrative duty. Executing
        that duty requires access to PACSES and the applicant's or recipient's
        support record; neither is supplied as an executable interface.
    - output: us-pa:policies/dhs/snap/578-verification-requirements-578-appendix-a/block-12#online_benefit_proof_information
      reason: >-
        "Individuals may get proof of SSA and SSI benefits online by creating an
        account with the Social Security Administration." The remainder identifies
        www.ssa.gov/myaccount and information the CAO may provide: "Important
        Information: Changes In Certain Services The Fastest Way To Verify Social
        Security And Supplemental Security Income Benefits How To Create An Online
        Account". This is account-access and informational guidance, with no
        computable policy condition or amount.
