format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-pa/manual/dhs/snap/513-strikers-513-5-computing-net-income/block-1
    source_sha256: 34e63313afdf37e9affa5482c2769d7ac3ffc4ab46633e77ea925cf18c34bfde
  summary: |-
    Allow deductions for the current month, even when using the striker’s pre-strike income.
    Allow the earned income deduction for all household members, including the striker.
inputs:
  - name: computing_net_income_for_household_with_striker
    entity: Household
    dtype: Boolean
    period: Month
  - name: deduction_is_for_current_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: net_income_computation_is_for_household_with_striker
    entity: Person
    dtype: Boolean
    period: Month
  - name: person_is_member_of_that_household
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: current_month_deduction_allowed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 513.5, current-month deductions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/513-strikers-513-5-computing-net-income/block-1
              excerpt: Allow deductions for the current month, even when using the striker’s pre-strike income.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          computing_net_income_for_household_with_striker
