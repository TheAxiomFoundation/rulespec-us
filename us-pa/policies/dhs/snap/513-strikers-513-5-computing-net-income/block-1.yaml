  - name: member_earned_income_deduction_allowed
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Pennsylvania SNAP Handbook 513.5, earned income deduction
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-pa/manual/dhs/snap/513-strikers-513-5-computing-net-income/block-1
              excerpt: Allow the earned income deduction for all household members, including the striker.
    versions:
