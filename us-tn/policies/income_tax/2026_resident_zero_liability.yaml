format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-tn/statute/public-chapter/2017/181/pages-3-through-4/document-1
      - us-tn/guidance/revenue/hall-income-tax/block-1
      - us-tn/guidance/revenue/gen-34-income-tax-withholding/block-1
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us-tn/statute/public-chapter/2017/181/pages-3-through-4
        - us-tn/guidance/revenue/hall-income-tax
        - us-tn/guidance/revenue/gen-34-income-tax-withholding
      rationale: |-
        Enacted 2017 Public Chapter 181 sets the Tennessee Code Annotated
        title 67, chapter 2 tax rate to zero percent for every tax year
        beginning on or after January 1, 2021. Current Tennessee Department
        of Revenue guidance confirms that the Hall tax applied to bond or note
        interest and stock dividends, was repealed for periods beginning
        January 1, 2021 or later, and must not be reported on a return for
        those years. Current GEN-34 guidance separately confirms that
        Tennessee has no state income tax on earned income.
  summary: |-
    Complete Tennessee full-year-resident individual income-tax pipeline for
    tax year 2026. The former Hall income-tax chapter has a permanent
    post-2020 zero rate, Revenue treats the tax as repealed and directs that no
    return be filed for periods beginning on or after January 1, 2021, and
    Tennessee has no state income tax on earned income. Accordingly there is
    no operative resident individual deduction, exemption, surtax, or credit
    return stage, and annual liability is zero before credits, after
    nonrefundable credits, after refundable credits, and before payments.
    This result is grounded in the enacted zero rate and current no-return
    administration, not a zero-income assumption.

    Franchise and excise taxes, business and entity taxes, historic Hall-tax
    periods, payments and withholding administration, local taxes, and
    nonresident or part-year allocation are outside this module.
rules:
  - name: tn_pit_2026_hall_income_tax_zero_rate_applies
    kind: derived
    dtype: Boolean
    period: Year
    source: 2017 Tenn. Pub. Acts ch. 181, § 13
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-tn/statute/public-chapter/2017/181/pages-3-through-4/document-1
              excerpt: "For any tax year that begins on or after January 1,2021, and for subsequent tax years, zero percent (0%)."
    versions:
      - effective_from: '2026-01-01'
        formula: true

  - name: tn_pit_2026_no_earned_income_tax_applies
    kind: derived
