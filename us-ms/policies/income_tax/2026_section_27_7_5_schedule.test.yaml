# Expected amounts are independently computed from Mississippi Code section
# 27-7-5(1): calendar-year-2026 tax is 4% of taxable income above $10,000.
# These fixtures test only the source-owned schedule, not an annual return.

- name: negative supplied income normalizes to zero
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#input.ms_pit_2026_supplied_taxable_income: -500
  output:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_schedule_taxable_income: '0'
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_section_27_7_5_schedule_tax: '0'

- name: one dollar below zero tax ceiling
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#input.ms_pit_2026_supplied_taxable_income: 9999
  output:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_section_27_7_5_schedule_tax: '0'

- name: at zero tax ceiling
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#input.ms_pit_2026_supplied_taxable_income: 10000
  output:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_schedule_taxable_income: '10000'
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_section_27_7_5_schedule_tax: '0'

- name: one dollar above zero tax ceiling
  # 4% * (10,001 - 10,000) = 0.04.
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#input.ms_pit_2026_supplied_taxable_income: 10001
  output:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_section_27_7_5_schedule_tax: '0.04'

- name: sixty thousand
  # 4% * (60,000 - 10,000) = 2,000.
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#input.ms_pit_2026_supplied_taxable_income: 60000
  output:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_section_27_7_5_schedule_tax: '2000'

- name: one hundred fifty thousand
  # 4% * (150,000 - 10,000) = 5,600.
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#input.ms_pit_2026_supplied_taxable_income: 150000
  output:
    us-ms:policies/income_tax/2026_section_27_7_5_schedule#ms_pit_2026_section_27_7_5_schedule_tax: '5600'
