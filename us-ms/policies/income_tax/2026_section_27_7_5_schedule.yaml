format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ms/statute/27-7-5
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us-ms/statute/27-7-5
      rationale: |-
        Mississippi Code section 27-7-5(1) supplies the complete individual
        rate schedule operative for calendar year 2026: no tax applies through
        $10,000 of taxable income and a 4 percent rate applies above $10,000.
        This canonical narrow module accepts one completed Mississippi taxable-
        income amount at the Person grain, floors it at zero, and applies only
        that source-owned schedule.

        The former pilot compared two PolicyEngine-specific completed-return
        candidates and selected the lower computed amount. That comparison was
        oracle-integration mechanics, not a rule established by this source,
        and is intentionally absent here. Taxable-income construction, filing-
        method selection, deductions, exemptions, credits, nonresident
        allocation, S-corporation treatment, subsection (4) fiscal-year
        proration, and final-return liability remain outside this schedule.
        All executable versions fail closed outside calendar year 2026.
  summary: |-
    Canonical Mississippi calendar-year-2026 individual income-tax schedule
    under section 27-7-5(1). The caller supplies completed Mississippi taxable
    income for one Person. The module floors the amount at zero and computes
    4 percent of taxable income above $10,000. It does not claim a complete
    annual return, tax before credits, or final liability.
rules:
  - name: ms_pit_2026_zero_tax_ceiling
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: Miss. Code section 27-7-5(1)(a)(ii), (1)(b)(i), 2026 zero-tax amount
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ms/statute/27-7-5
              excerpt: "For calendar year 2022 and all taxable years thereafter, there shall be no tax levied on the first Five Thousand Dollars ($5,000.00) of taxable income"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ms/statute/27-7-5
              excerpt: "there shall be no tax levied under subparagraph (ii) ... in excess of Five Thousand Dollars ($5,000.00) up to and including Ten Thousand Dollars ($10,000.00)"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '10000'

  - name: ms_pit_2026_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Miss. Code section 27-7-5(1)(b)(ii)(3), calendar-year-2026 rate
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ms/statute/27-7-5
              excerpt: "For calendar year 2026, on such taxable income, the rate shall be four percent (4%)"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0.04'

  - name: ms_pit_2026_schedule_taxable_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    source: Supplied completed Mississippi taxable income under section 27-7-5(1), floored at zero
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ms/statute/27-7-5
              excerpt: "upon the entire net income of every resident individual"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: max(0, ms_pit_2026_supplied_taxable_income)

  - name: ms_pit_2026_section_27_7_5_schedule_tax
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    source: Miss. Code section 27-7-5(1), calendar-year-2026 individual rate schedule
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ms/statute/27-7-5
              excerpt: "For calendar year 2026, on such taxable income, the rate shall be four percent (4%)"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: ms_pit_2026_rate * max(0, ms_pit_2026_schedule_taxable_income - ms_pit_2026_zero_tax_ceiling)

inputs:
  - name: ms_pit_2026_supplied_taxable_income
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    description: Completed Mississippi taxable income supplied by the caller solely for application of the section 27-7-5 schedule.
