format: rulespec/v1
module:
  summary: |-
    Only migrant or seasonal farmworker households can be determined as destitute.
    Verify destitute status but only if verification will not delay meeting expedited processing requirements.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
    source_sha256: 079d86f5b3cb4f83c68039c6106577ec9d3d5bdeccbe8fca975d5d8cd236f6a0
  proof_validation:
    required: true
inputs:
  - name: migrant_or_seasonal_farmworker_household
    entity: Household
    dtype: Boolean
    period: Month
  - name: liquid_resources
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: only_application_month_income_received_before_application
    entity: Household
    dtype: Boolean
    period: Month
  - name: all_such_income_paid_monthly_or_more_frequently
    entity: Household
    dtype: Boolean
    period: Month
  - name: no_further_receipt_from_those_sources_in_application_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: income_absent_in_next_normally_due_payment_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: only_application_month_income_from_new_sources
    entity: Household
    dtype: Boolean
    period: Month
  - name: new_source_income_amount
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: new_source_payment_day_after_application
    entity: Household
    dtype: Integer
    period: Month
  - name: new_source_paid_monthly_or_more_frequently
    entity: Household
    dtype: Boolean
    period: Month
  - name: days_without_receipt_from_new_source_before_application
    entity: Household
    dtype: Integer
    period: Month
  - name: no_receipt_from_new_source_during_last_normal_payment_interval
    entity: Household
    dtype: Boolean
    period: Month
  - name: job_change_continues_same_employer_or_grower
    entity: Household
    dtype: Boolean
    period: Month
  - name: stopped_income_before_application_and_new_income_after_application
    entity: Household
    dtype: Boolean
    period: Month
  - name: no_other_application_month_income
    entity: Household
    dtype: Boolean
    period: Month
  - name: every_stopped_source_meets_frequency_specific_stopping_test
    entity: Household
    dtype: Boolean
    period: Month
  - name: every_new_source_meets_frequency_specific_newness_test
    entity: Household
    dtype: Boolean
    period: Month
  - name: all_new_source_payments_at_or_above_threshold_arrive_after_deadline
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_delays_expedited_processing
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: destitute_liquid_resource_limit
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 2100, destitute definition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: liquid resources do not exceed $100
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          100
  - name: new_income_threshold
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 2100, new income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: from a new source for $25 or more
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          25
  - name: new_income_receipt_deadline
    kind: parameter
    dtype: Integer
    period: Month
    source: Vermont 3SquaresVT Manual 2100, new income timing
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: the 10th calendar day after the date of application
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          10
  - name: new_source_lookback_days
    kind: parameter
    dtype: Integer
    period: Month
    source: Vermont 3SquaresVT Manual 2100, monthly or more frequent new source
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: income has not been received from that source 30-days prior to the date of application
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          30
  - name: stopped_income_path
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, stopped-source income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: was received from a stopped source before the date of application
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: Income received less often than monthly is stopped from that source if the income is not received in the month the next payment would normally be received.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          only_application_month_income_received_before_application
          and ((all_such_income_paid_monthly_or_more_frequently
                and no_further_receipt_from_those_sources_in_application_month)
               or (not all_such_income_paid_monthly_or_more_frequently
                   and income_absent_in_next_normally_due_payment_month))
  - name: new_income_path
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, new-source income and employer identity
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: is from a new source for $25 or more but will not be received by the 10th calendar day after the date of application
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: Income received less often than monthly is from a new source if the income was not received from that source during the last normal interval between payments.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: Household members changing jobs but continuing to work for the same employer/grower are receiving continuing income, not income from a new source.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          only_application_month_income_from_new_sources
          and new_source_income_amount >= new_income_threshold
          and new_source_payment_day_after_application > new_income_receipt_deadline
          and ((new_source_paid_monthly_or_more_frequently
                and days_without_receipt_from_new_source_before_application >= new_source_lookback_days)
               or (not new_source_paid_monthly_or_more_frequently
                   and no_receipt_from_new_source_during_last_normal_payment_interval))
          and not job_change_continues_same_employer_or_grower
  - name: mixed_income_path
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, combined stopped and new income; source means employer/grower, not crew chief
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: they receive both stopped income prior to the date of application, and income from a new source after the date of application
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: will not receive any other income in the month of application
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: any income of $25 or more from a new source will not be received by the 10th day after the date of application
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: Consider migrant or seasonal farmworker households traveling with a crew chief from one job source to another source as moving from a stopped source to a new source.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          stopped_income_before_application_and_new_income_after_application
          and no_other_application_month_income
          and every_stopped_source_meets_frequency_specific_stopping_test
          and every_new_source_meets_frequency_specific_newness_test
          and all_new_source_payments_at_or_above_threshold_arrive_after_deadline
  - name: destitute
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, destitute household definition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: Only migrant or seasonal farmworker households can be determined as destitute.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: Destitute means the household’s liquid resources do not exceed $100 and their only income for the month of application
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          migrant_or_seasonal_farmworker_household
          and liquid_resources <= destitute_liquid_resource_limit
          and (stopped_income_path or new_income_path or mixed_income_path)
  - name: destitute_verification_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, verification
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-54
              excerpt: Verify destitute status but only if verification will not delay meeting expedited processing requirements.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          destitute
          and not verification_delays_expedited_processing
