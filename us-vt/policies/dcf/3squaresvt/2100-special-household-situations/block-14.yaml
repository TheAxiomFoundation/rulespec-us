format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-14
    source_sha256: 5fa68782ca5cc8c95e2f3b80e33d51e1e9b51c2376595a181634f9de262ffef5
  summary: |-
    Step 1: Determine the ineligible member’s monthly countable Earned Income and Unearned Income separately.
    Step 2: Total the number of eligible and ineligible household members.
inputs:
  - name: ineligible_member_countable_earned_income
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    description: Monthly countable earned income of the particular ineligible member whose income is being allocated, determined under Income and Determining Income and Deductions; not household earnings or another member's income.
  - name: ineligible_member_countable_unearned_income
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    description: Monthly countable unearned income of that same ineligible member, determined under Income and Determining Income and Deductions; not household unearned income or another member's income.
  - name: eligible_household_member_count
    entity: Household
    dtype: Count
    period: Month
  - name: ineligible_household_member_count
    entity: Household
    dtype: Count
    period: Month
rules:
  - name: household_member_count
    kind: derived
    entity: Household
    dtype: Count
    period: Month
    source: Vermont 3SquaresVT Manual, 2100, block-14, Step 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-14
              excerpt: "Total the number of eligible and ineligible household members."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          eligible_household_member_count + ineligible_household_member_count
  - name: ineligible_member_earned_income_per_household_member
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: Vermont 3SquaresVT Manual, 2100, block-14, Steps 1 and 3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-14
              excerpt: "Determine the ineligible member’s monthly countable Earned Income and Unearned Income separately."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-14
              excerpt: "Divide the earned/unearned amount in step 1 by the number of people in the household."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          ineligible_member_countable_earned_income / household_member_count
  - name: ineligible_member_unearned_income_per_household_member
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: Vermont 3SquaresVT Manual, 2100, block-14, Steps 1 and 3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-14
              excerpt: "Determine the ineligible member’s monthly countable Earned Income and Unearned Income separately."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-14
              excerpt: "Divide the earned/unearned amount in step 1 by the number of people in the household."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          ineligible_member_countable_unearned_income / household_member_count
  - name: ineligible_member_earned_income_allocated_to_eligible_members
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: Vermont 3SquaresVT Manual, 2100, block-14, Step 4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-14
              excerpt: "Multiply the amount in step 3 by the number of eligible household members."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          ineligible_member_earned_income_per_household_member * eligible_household_member_count
