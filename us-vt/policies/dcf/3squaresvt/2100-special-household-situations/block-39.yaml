format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-39
    source_sha256: 5e698ac7e1ca0f3cc2f168650ef53627765e7453955e19de5e53b6be563d93b3
  summary: |-
    Residents certified as a household of one may: give their benefits to the facility to purchase food for meals served to the group or person, purchase and prepare their own food, or purchase meals prepared and served by the facility.
inputs:
  - name: is_facility_resident_certified_as_household_of_one
    entity: Person
    dtype: Boolean
    period: Month
  - name: proposed_benefit_transfer_buys_food_for_group_or_personal_meals
    entity: Person
    dtype: Boolean
    period: Month
  - name: proposed_food_purchase_is_for_own_purchase_and_preparation
    entity: Person
    dtype: Boolean
    period: Month
  - name: proposed_meal_purchase_is_prepared_and_served_by_facility
    entity: Person
    dtype: Boolean
    period: Month
  - name: is_facility_resident
    entity: Person
    dtype: Boolean
    period: Month
  - name: chooses_personal_meals_instead_of_group_meals
    entity: Person
    dtype: Boolean
    period: Month
  - name: facility_ensures_resident_benefits_used_for_meals_intended_for_that_resident
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: may_give_benefits_to_facility_for_food
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, block-39, first sentence, facility food purchase option.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-39
              excerpt: "Residents certified as a household of one may: give their benefits to the facility to purchase food for meals served to the group or person"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          is_facility_resident_certified_as_household_of_one
          and proposed_benefit_transfer_buys_food_for_group_or_personal_meals
  - name: may_purchase_and_prepare_own_food
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, block-39, first sentence, own food option.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-39
              excerpt: "Residents certified as a household of one may:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-39
              excerpt: "purchase and prepare their own food"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          is_facility_resident_certified_as_household_of_one
          and proposed_food_purchase_is_for_own_purchase_and_preparation
  - name: may_purchase_facility_prepared_and_served_meals
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, block-39, first sentence, facility meal option.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-39
              excerpt: "Residents certified as a household of one may:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-39
              excerpt: "purchase meals prepared and served by the facility."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          is_facility_resident_certified_as_household_of_one
          and proposed_meal_purchase_is_prepared_and_served_by_facility
  - name: facility_personal_meal_benefit_use_requirement_satisfied
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, block-39, second sentence.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-39
              excerpt: "The facility will ensure each resident's 3SVT benefits are used for meals intended for that resident when the resident chooses personal meals instead of group meals."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not is_facility_resident
          or not chooses_personal_meals_instead_of_group_meals
          or facility_ensures_resident_benefits_used_for_meals_intended_for_that_resident
