format: rulespec/v1
module:
  summary: |-
    Do not increase 3SVT benefits when the household’s RU / RF benefits end or decrease because the household/person intentionally failed to comply with a RU/RF requirement.
    Note : Do not end 3SVT benefits when the household’s benefits from the other program end due to the household’s failure to comply with a requirement of that program.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-19
    source_sha256: 718d9189890cc43cd3b2030f70c5ea771929316f237b99a3d793589b23fd0bea
  proof_validation:
    required: true
inputs:
  - name: ru_rf_benefits_end_or_decrease
    entity: Household
    dtype: Boolean
    period: Month
  - name: ru_rf_change_caused_by_intentional_noncompliance
    entity: Household
    dtype: Boolean
    period: Month
  - name: other_program_benefits_end
    entity: Household
    dtype: Boolean
    period: Month
  - name: other_program_termination_caused_by_household_noncompliance
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: benefit_increase_due_to_ru_rf_change_prohibited
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, block-19, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-19
              excerpt: "Do not increase 3SVT benefits when the household’s RU / RF benefits end or decrease because the household/person intentionally failed to comply with a RU/RF requirement."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          ru_rf_benefits_end_or_decrease
          and ru_rf_change_caused_by_intentional_noncompliance
  - name: benefit_termination_due_to_other_program_termination_prohibited
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, block-19, Note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-19
              excerpt: "Do not end 3SVT benefits when the household’s benefits from the other program end due to the household’s failure to comply with a requirement of that program."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          other_program_benefits_end
          and other_program_termination_caused_by_household_noncompliance
