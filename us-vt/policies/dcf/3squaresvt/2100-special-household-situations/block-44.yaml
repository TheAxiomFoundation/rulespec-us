format: rulespec/v1
module:
  summary: |-
    Homeless shelters are public or private nonprofit facilities that provide temporary housing for homeless people. They are exempt from Institution rules.
    Temporary accommodations in the residence of another person, for not more than 90 days;
    If the homeless shelter’s eligibility isn’t known, email the Agency of Human Services-Economic Services Division-Assistant Operations (AHS-ESD-AOPS). AOPS will determine if the homeless shelter is eligible.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-44
    source_sha256: 2d93b4aa564cae050d70b48aff6dae432ed97449776964cd12b0b39161daf6a9
  proof_validation:
    required: true
inputs:
  - name: facility_is_public
    entity: ShelterFacility
    dtype: Boolean
    period: Month
  - name: facility_is_private
    entity: ShelterFacility
    dtype: Boolean
    period: Month
  - name: facility_is_nonprofit
    entity: ShelterFacility
    dtype: Boolean
    period: Month
  - name: provides_temporary_housing_for_homeless_people
    entity: ShelterFacility
    dtype: Boolean
    period: Month
  - name: lacks_fixed_and_regular_nighttime_residence
    entity: Person
    dtype: Boolean
    period: Month
  - name: primary_nighttime_residence_is_halfway_house_or_similar_temporary_institution_for_people_intended_to_be_institutionalized
    entity: Person
    dtype: Boolean
    period: Month
  - name: primary_nighttime_residence_is_temporary_hotel_motel_or_shelter_accommodation
    entity: Person
    dtype: Boolean
    period: Month
  - name: primary_nighttime_residence_is_temporary_accommodation_in_another_persons_residence
    entity: Person
    dtype: Boolean
    period: Month
  - name: days_in_another_persons_residence
    entity: Person
    dtype: Integer
    period: Month
  - name: primary_nighttime_residence_is_place_not_designed_or_ordinarily_used_for_human_sleeping
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: temporary_stay_limit_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual 2100, temporary accommodations in another person's residence.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-44
              excerpt: "for not more than 90 days"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          90
  - name: homeless_shelter
    kind: derived
    entity: ShelterFacility
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, homeless shelter definition.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-44
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (facility_is_public or facility_is_private)
          and facility_is_nonprofit
          and provides_temporary_housing_for_homeless_people
  - name: homeless_shelter_exempt_from_institution_rules
    kind: derived
    entity: ShelterFacility
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, Institution exemption; unknown shelter eligibility is referred to AHS-ESD-AOPS for determination.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-44
              excerpt: "They are exempt from Institution rules."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          homeless_shelter
  - name: homeless
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2100, homeless people definition and all listed nighttime-residence alternatives, including hallways, bus stations, lobbies or similar places.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-44
              excerpt: "without a fixed and regular nighttime residence"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2100-special-household-situations/block-44
              excerpt: "for not more than 90 days"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          lacks_fixed_and_regular_nighttime_residence
          or primary_nighttime_residence_is_halfway_house_or_similar_temporary_institution_for_people_intended_to_be_institutionalized
          or primary_nighttime_residence_is_temporary_hotel_motel_or_shelter_accommodation
          or (primary_nighttime_residence_is_temporary_accommodation_in_another_persons_residence
              and days_in_another_persons_residence <= temporary_stay_limit_days)
          or primary_nighttime_residence_is_place_not_designed_or_ordinarily_used_for_human_sleeping
