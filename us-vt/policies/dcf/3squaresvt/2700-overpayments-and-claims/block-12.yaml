format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-12
    source_sha256: 2c900b79fd19a80ed15f8f990a7cb0fb097bbae9d01d77469ea34f4bfd3c8c9b
  summary: |-
    The following members are responsible for repaying the overpayment: Each adult receiving 3SVT benefits when the overpayment occurred; or Persons connected to the household, such as an authorized representative, who actually trafficked or otherwise caused an overpayment or trafficking.

    The FACU initiates collection action against the household.

    When an adult member of an overpayment household moves to a different household, ACCESS issues an informational message to the ES. Notify FACU if this message is received. FACU will transfer the overpayment in RECO to the new case (DISP panel) if the overpayment will be pursued in the new household.
  interpretations:
    - id: adult-condition-scope
      status: open
      question: Does the adult condition also restrict the connected-person repayment category?
      texts:
        - corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-12
          excerpt: "Each adult receiving 3SVT benefits when the overpayment occurred; or Persons connected to the household"
      reading: The adult condition qualifies the benefit-recipient category. The separate connected-person category requires connection and actual trafficking or causation, without an additional adult condition.
      alternatives:
        - id: adult-condition-both-categories
          reading: Both repayment categories require the person to be an adult.
          effect: A nonadult connected person who actually trafficked or otherwise caused an overpayment or trafficking would not be responsible under this rule.
      basis: The source expressly says adult in the first category and Persons in the second. The automatic review requests an adult restriction on the second category, but no supplied legal text states that restriction.
      affects:
        - responsible_for_repaying_overpayment
inputs:
  - name: adult_when_overpayment_occurred
    entity: Person
    dtype: Boolean
    period: Month
  - name: received_3svt_when_overpayment_occurred
    entity: Person
    dtype: Boolean
    period: Month
  - name: connected_to_overpayment_household
    entity: Person
    dtype: Boolean
    period: Month
  - name: actually_trafficked
    entity: Person
    dtype: Boolean
    period: Month
  - name: otherwise_caused_overpayment_or_trafficking
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: responsible_for_repaying_overpayment
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2700 Overpayments and Claims, block-12, repayment responsibility.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-12
              excerpt: "Each adult receiving 3SVT benefits when the overpayment occurred"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-12
              excerpt: "Persons connected to the household, such as an authorized representative, who actually trafficked or otherwise caused an overpayment or trafficking."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (adult_when_overpayment_occurred and received_3svt_when_overpayment_occurred)
          or (connected_to_overpayment_household
              and (actually_trafficked or otherwise_caused_overpayment_or_trafficking))
