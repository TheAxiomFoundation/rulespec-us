format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-19
    source_sha256: b6d405619820b43dc294a8bd716ad8ae2b144ccfd46e97f2db8bfccf22e006f6
  summary: |-
    The household may pay the overpayment partially or in full with cash, check, money order, or with unused EBT benefits.
    FACU is responsible for obtaining a written agreement from the household prior to using active EBT benefits to repay an overpayment.
    If paid by cash or its equivalent, issue the household an ESD 140 receipt, and Give the payment to the assigned staff member. Send to Accounts Receivable, Administrative Services.
inputs:
  - name: repayment_method
    entity: Household
    dtype: String
    period: Month
  - name: repayment_extent
    entity: Household
    dtype: String
    period: Month
  - name: facu_obtained_written_household_agreement_before_active_ebt_use
    entity: Household
    dtype: Boolean
    period: Month
  - name: overpayment_paid_by_cash_or_equivalent
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_issued_esd_140_receipt
    entity: Household
    dtype: Boolean
    period: Month
  - name: payment_given_to_assigned_staff_member
    entity: Household
    dtype: Boolean
    period: Month
  - name: payment_sent_to_accounts_receivable_administrative_services
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: overpayment_repayment_permitted
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2700, block 19, repayment methods and written agreement.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-19
              excerpt: The household may pay the overpayment partially or in full with cash, check, money order, or with unused EBT benefits.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-19
              excerpt: FACU is responsible for obtaining a written agreement from the household prior to using active EBT benefits to repay an overpayment.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (repayment_extent == "partial" or repayment_extent == "full")
          and (
            repayment_method == "cash"
            or repayment_method == "check"
            or repayment_method == "money_order"
            or repayment_method == "unused_ebt"
            or (
              repayment_method == "active_ebt"
              and facu_obtained_written_household_agreement_before_active_ebt_use
            )
          )
  - name: cash_repayment_handling_requirements_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2700, block 19, cash or equivalent receipt and routing.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-19
              excerpt: If paid by cash or its equivalent, issue the household an ESD 140 receipt, and Give the payment to the assigned staff member. Send to Accounts Receivable, Administrative Services.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not overpayment_paid_by_cash_or_equivalent
          or (
            household_issued_esd_140_receipt
            and payment_given_to_assigned_staff_member
            and payment_sent_to_accounts_receivable_administrative_services
          )
