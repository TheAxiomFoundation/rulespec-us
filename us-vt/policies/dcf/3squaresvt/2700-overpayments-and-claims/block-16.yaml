format: rulespec/v1
module:
  summary: |-
    The fraud supervisor may terminate and write off the overpayment if: All household members are deceased; A fair hearing finds no overpayment; The overpayment has a balance less than $25 and no payment has been received in the last 90 days; or There has not been a payment on the overpayment for 3 years or more.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
    source_sha256: 7d50169d04ca8b296469e618b78778a6f876bcc1bccc666d3b71a0bb27887e47
  proof_validation:
    required: true
inputs:
  - name: all_household_members_are_deceased
    entity: Overpayment
    dtype: Boolean
    period: Month
  - name: fair_hearing_finds_no_overpayment
    entity: Overpayment
    dtype: Boolean
    period: Month
  - name: balance
    entity: Overpayment
    dtype: Money
    unit: USD
    period: Month
  - name: payment_free_days
    entity: Overpayment
    dtype: Integer
    period: Month
  - name: payment_free_years
    entity: Overpayment
    dtype: Decimal
    period: Month
rules:
  - name: small_balance_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: Vermont 3SquaresVT Manual 2700, termination and write-off conditions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: balance less than $25
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          25
  - name: small_balance_payment_free_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual 2700, small-balance payment period
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: no payment has been received in the last 90 days
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          90
  - name: long_payment_free_years
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual 2700, prolonged nonpayment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: There has not been a payment on the overpayment for 3 years or more.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          3
  - name: fraud_supervisor_may_terminate_and_write_off
    kind: derived
    entity: Overpayment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2700, all four termination and write-off alternatives
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: 'The fraud supervisor may terminate and write off the overpayment if:'
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: All household members are deceased
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: A fair hearing finds no overpayment
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: The overpayment has a balance less than $25 and no payment has been received in the last 90 days
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-16
              excerpt: There has not been a payment on the overpayment for 3 years or more.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          all_household_members_are_deceased
          or fair_hearing_finds_no_overpayment
          or (balance < small_balance_threshold and payment_free_days >= small_balance_payment_free_days)
          or payment_free_years >= long_payment_free_years
