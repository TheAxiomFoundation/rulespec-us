format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
    source_sha256: 38a97e8e2d84150622e8be2531e5b49c030648d2d9e4c7a778f6f771cd894dbd
  summary: |-
    An overpayment caused by the agency’s action or failure to take action.
    If it is possible, establish two overpayments.
inputs:
  - name: agency_action_or_failure_caused_overpayment
    entity: Overpayment
    dtype: Boolean
    period: Month
  - name: inadvertent_household_error_and_agency_error_occurred_together
    entity: Overpayment
    dtype: Boolean
    period: Month
  - name: overpayment_amount_for_each_error_can_be_determined
    entity: Overpayment
    dtype: Boolean
    period: Month
rules:
  - name: agency_error
    kind: derived
    entity: Overpayment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2700, agency-error definition, examples, and Note.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: An overpayment caused by the agency’s action or failure to take action.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: Failure to take prompt action on a reported change.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: Incorrect computation of 3SVT benefits amount.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: Benefits were issued after the certification period expired.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: Reach Up grant changes were not budgeted.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: consider the error as an Agency Error if it is not possible to determine the overpayment amount for each error.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          agency_action_or_failure_caused_overpayment
          or (
            inadvertent_household_error_and_agency_error_occurred_together
            and not overpayment_amount_for_each_error_can_be_determined
          )
  - name: two_overpayments_required
    kind: derived
    entity: Overpayment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2700, Note.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: When an Inadvertent Household Error and Agency Error occur at the same time
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2700-overpayments-and-claims/block-6
              excerpt: If it is possible, establish two overpayments.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          inadvertent_household_error_and_agency_error_occurred_together
          and overpayment_amount_for_each_error_can_be_determined
