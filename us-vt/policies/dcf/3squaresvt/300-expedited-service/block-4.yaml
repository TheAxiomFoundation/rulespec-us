format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
    source_sha256: 5ef9f388dde8c1da93fdb0d4b4955e532184e805196186b32cfa015159d202ef
  summary: |-
    Households must meet one of the following criteria to receive expedited service:
    Review PERS/D and/or INQD/D to see if the household is known to ACCESS and whether they receive or have received benefits in Vermont.
inputs:
  - name: application_month_countable_income
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: liquid_resources
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: monthly_shelter_expenses
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: appropriate_utility_standard
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: migrant_worker_household
    entity: Household
    dtype: Boolean
    period: Month
  - name: seasonal_farmworker_household
    entity: Household
    dtype: Boolean
    period: Month
  - name: destitute
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: low_income_threshold
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 300, expedited-service income criterion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: Countable income for the month of application is less than $150
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          150
  - name: low_income_resource_limit
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 300, low-income liquid-resource criterion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: liquid resources are not more than $100
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          100
  - name: farmworker_resource_threshold
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 300, destitute farmworker liquid-resource criterion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: have less than $100 in liquid resources
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          100
  - name: expedited_service_criteria_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 300, three alternative household criteria and PERS/D or INQD/D review instruction
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: "Households must meet one of the following criteria to receive expedited service:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: Countable income for the month of application is less than $150 and liquid resources are not more than $100
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: "Combined countable income for the month of application , and liquid resources are less than the household’s monthly:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: "shelter expenses including but not limited to rent, mortgage, lot rent, property taxes, home insurance, condo fees; and utility expenses using the appropriate utility standard"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/300-expedited-service/block-4
              excerpt: "Migrant Worker or Seasonal Farmworker households who: are Destitute , and have less than $100 in liquid resources."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (application_month_countable_income < low_income_threshold
            and liquid_resources <= low_income_resource_limit)
          or (application_month_countable_income + liquid_resources
            < monthly_shelter_expenses + appropriate_utility_standard)
          or ((migrant_worker_household or seasonal_farmworker_household)
            and destitute
            and liquid_resources < farmworker_resource_threshold)
