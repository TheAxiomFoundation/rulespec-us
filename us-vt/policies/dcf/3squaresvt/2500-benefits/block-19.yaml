format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-19
    source_sha256: 937f6ea90a387ac24a17c7f3979c79619526a6a0b8cf67ebc17d5bc56a0333c2
  summary: |-
    The EBT card can be used to purchase eligible food at any retailer or wholesaler authorized to accept 3SVT benefits. EBT benefits or cash out benefits can be used to pay a 3SVT claim .
inputs:
  - name: payment_uses_ebt_card
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_purchases_eligible_food
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_payee_is_retailer_or_wholesaler_authorized_to_accept_3svt
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_is_for_3svt_claim
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_uses_ebt_benefits
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_uses_cash_out_benefits
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: ebt_food_purchase_allowed
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2500 Benefits, block-19, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-19
              excerpt: The EBT card can be used to purchase eligible food at any retailer or wholesaler authorized to accept 3SVT benefits.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          payment_uses_ebt_card
          and payment_purchases_eligible_food
          and payment_payee_is_retailer_or_wholesaler_authorized_to_accept_3svt
  - name: benefits_claim_payment_allowed
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2500 Benefits, block-19, second sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-19
              excerpt: EBT benefits or cash out benefits can be used to pay a 3SVT claim .
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          payment_is_for_3svt_claim
          and (payment_uses_ebt_benefits or payment_uses_cash_out_benefits)
