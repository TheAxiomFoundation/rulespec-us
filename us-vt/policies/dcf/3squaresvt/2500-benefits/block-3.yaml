format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-3
    source_sha256: 30cb72758b2d147ad7e8826751530f2283254362ec6cc261ffb84a6c7485c692
  summary: |-
    Households applying on the first of the month and found eligible receive a full initial month’s benefits. Households applying after the first of the month and found eligible receive prorated benefits.
inputs:
  - name: migrant_or_seasonal_farm_worker_household
    entity: Household
    dtype: Boolean
    period: Month
  - name: first_receipt_month_for_first_time_or_following_nonapproval
    entity: Household
    dtype: Boolean
    period: Month
  - name: first_approval_month_following_last_approval
    entity: Household
    dtype: Boolean
    period: Month
  - name: days_since_last_approval
    entity: Household
    dtype: Integer
    period: Month
  - name: found_eligible
    entity: Household
    dtype: Boolean
    period: Month
  - name: applied_on_first_of_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: applied_after_first_of_month
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: farm_worker_approval_gap_days
    kind: parameter
    dtype: Integer
    period: Month
    source: Vermont 3SquaresVT Manual, 2500 Benefits, initial-month exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-3
              excerpt: more than 30 days since the last approval
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          30
  - name: initial_month
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2500 Benefits, initial-month definition and exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-3
              excerpt: An initial month is the first month the household receives benefits for the first time or following any time the household was not approved.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-3
              excerpt: Initial month for migrant or seasonal farm workers is the first month the household is approved following a period of more than 30 days since the last approval.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (not migrant_or_seasonal_farm_worker_household
          and first_receipt_month_for_first_time_or_following_nonapproval)
          or (migrant_or_seasonal_farm_worker_household
          and first_approval_month_following_last_approval
          and days_since_last_approval > farm_worker_approval_gap_days)
  - name: full_initial_month_benefits
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2500 Benefits, first-of-month applications
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-3
              excerpt: Households applying on the first of the month and found eligible receive a full initial month’s benefits.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          applied_on_first_of_month and found_eligible
  - name: prorated_initial_month_benefits
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 2500 Benefits, applications after the first
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-3
              excerpt: Households applying after the first of the month and found eligible receive prorated benefits.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          applied_after_first_of_month and found_eligible
