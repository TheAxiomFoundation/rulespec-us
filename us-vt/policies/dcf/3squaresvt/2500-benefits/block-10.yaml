format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-10
    source_sha256: 5702ea614ed96ce2849724dba6534eba16be2e064cc586a84c72d6e7a8a3c748
  summary: |-
    Determine the prorated benefit amount using the 3SquaresVT Allotment Proration Tables
    Note : Prorated benefits of less than $10 are not issued for the initial month only.
  deferred_outputs:
    - output: us-vt:policies/dcf/3squaresvt/2500-benefits/block-10#prorated_benefit_amount
      reason: >-
        Cannot be computed until 3SquaresVT Allotment Proration Tables is encoded.
inputs:
  - name: prorated_benefit_amount
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: month_is_initial_month
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: initial_month_minimum_issuable_prorated_benefit
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 2500 Benefits, block-10, Note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-10
              excerpt: Prorated benefits of less than $10 are not issued for the initial month only.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          10
  - name: prorated_benefit_issuance_prohibited
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2500 Benefits, block-10, Note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-10
              excerpt: Prorated benefits of less than $10 are not issued for the initial month only.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          month_is_initial_month
          and prorated_benefit_amount < initial_month_minimum_issuable_prorated_benefit
