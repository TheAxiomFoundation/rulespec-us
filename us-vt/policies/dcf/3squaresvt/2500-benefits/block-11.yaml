format: rulespec/v1
module:
  summary: |-
    Except during an initial month all eligible one and two-person households receive a minimum benefit minimum benefit .
    Minimum Benefits Household Size Minimum Benefit 1 or 2 $24
    Eligible households of three or more may be entitled to zero benefits. Suspend the case for these households.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
    source_sha256: 2013a818167bdf2806a1e8e393898377ae989357dafe3ca3b031b37a51cd4d90
  proof_validation:
    required: true
inputs:
  - name: household_is_eligible
    entity: Household
    dtype: Boolean
    period: Month
  - name: is_initial_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_size
    entity: Household
    dtype: Count
    period: Month
  - name: benefit_entitlement
    entity: Household
    dtype: Money
    unit: USD
    period: Month
rules:
  - name: minimum_benefit_smallest_household_size
    kind: parameter
    dtype: Count
    source: Minimum Benefits table, Household Size
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
              excerpt: "Household Size Minimum Benefit 1 or 2 $24"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1
  - name: minimum_benefit_largest_household_size
    kind: parameter
    dtype: Count
    source: Minimum Benefits table, Household Size
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
              excerpt: "Household Size Minimum Benefit 1 or 2 $24"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          2
  - name: minimum_benefit_by_household_size
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    indexed_by: household_size
    source: Minimum Benefits table
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
              excerpt: "Household Size Minimum Benefit 1 or 2 $24"
              table:
                header: Minimum Benefits
                row_key: Household Size
                column_key: Minimum Benefit
    versions:
      - effective_from: '2026-08-01'
        values:
          1: 24
          2: 24
  - name: zero_benefit_suspension_minimum_household_size
    kind: parameter
    dtype: Count
    source: Eligible households of three or more
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
              excerpt: "Eligible households of three or more may be entitled to zero benefits."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          3
  - name: minimum_benefit
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Minimum-benefit paragraph and Minimum Benefits table
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
              excerpt: "Except during an initial month all eligible one and two-person households receive a minimum benefit"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
              excerpt: "Household Size Minimum Benefit 1 or 2 $24"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if household_is_eligible and not is_initial_month and household_size >= minimum_benefit_smallest_household_size and household_size <= minimum_benefit_largest_household_size:
            minimum_benefit_by_household_size[household_size]
          else: 0
  - name: case_suspension_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Zero-benefit households paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-11
              excerpt: "Eligible households of three or more may be entitled to zero benefits. Suspend the case for these households."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_is_eligible
          and household_size >= zero_benefit_suspension_minimum_household_size
          and benefit_entitlement == 0
