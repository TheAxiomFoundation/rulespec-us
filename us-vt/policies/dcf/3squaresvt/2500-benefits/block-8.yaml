format: rulespec/v1
module:
  summary: |-
    Issue prorated benefits at recertification if the household: Files for recertification within 30 days after the end of the certification period. Benefits are issued from the date of application through the last day of the month. Was at fault for a delay in the recertification process. Benefits are issued from the date the household takes the required action to the end of that month.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-8
    source_sha256: 9c3fc8c78d1aee1c9faebf7679f0f145852390cbad73f1a03f45ca41172101da
  proof_validation:
    required: true
inputs:
  - name: recertification_filing_days_after_certification_end
    entity: Household
    dtype: Integer
    period: Day
  - name: day_is_from_application_through_application_month_end
    entity: Household
    dtype: Boolean
    period: Day
  - name: household_caused_recertification_delay
    entity: Household
    dtype: Boolean
    period: Day
  - name: day_is_from_required_action_through_action_month_end
    entity: Household
    dtype: Boolean
    period: Day
rules:
  - name: recertification_filing_window_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual, 2500 Benefits, block 8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-8
              excerpt: within 30 days after the end of the certification period.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          30
  - name: prorated_benefits_issued_for_late_recertification_day
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: Vermont 3SquaresVT Manual, 2500 Benefits, block 8, recertification filing
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-8
              excerpt: Files for recertification within 30 days after the end of the certification period. Benefits are issued from the date of application through the last day of the month.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          recertification_filing_days_after_certification_end > 0
          and recertification_filing_days_after_certification_end <= recertification_filing_window_days
          and day_is_from_application_through_application_month_end
  - name: prorated_benefits_issued_for_household_delay_day
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: Vermont 3SquaresVT Manual, 2500 Benefits, block 8, household-caused delays; See Recertification, Household Caused Delays
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2500-benefits/block-8
              excerpt: Was at fault for a delay in the recertification process. Benefits are issued from the date the household takes the required action to the end of that month.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_caused_recertification_delay
          and day_is_from_required_action_through_action_month_end
