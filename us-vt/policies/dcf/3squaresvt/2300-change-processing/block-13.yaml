    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual, 2300 Change Processing, block-13
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2300-change-processing/block-13
              excerpt: Act within ten days
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          10
