    Act within ten days to determine the household’s benefits without allowing the shelter expenses when the household failed to provide the requested information by the ESD 202VCR due date.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2300-change-processing/block-13
    source_sha256: e72325b9704cc7cb20f4d91672a2037787fe320afe58abbf99b1b0ad3ea9c986
  proof_validation:
    required: true
inputs:
  - name: requested_information_provided_by_esd_202vcr_due_date
    entity: Household
    dtype: Boolean
    period: Day
rules:
