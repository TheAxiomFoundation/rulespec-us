    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2300-change-processing/block-13
              excerpt: determine the household’s benefits without allowing the shelter expenses when the household failed to provide the requested information by the ESD 202VCR due date.
