format: rulespec/v1
module:
  summary: |-
    When a determination is made finding the household was not underpaid, and the household disagrees with the decision, they have 90-days to request a fair hearing. Restore benefits to the household only when the fair hearing rules in favor of the household.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-19
    source_sha256: e28a5c91bcc5ccd36cfd136ab35bc435080b36da8112538c911826f94945fab3
  proof_validation:
    required: true
inputs:
  - name: determination_finds_household_not_underpaid
    entity: Household
    dtype: Boolean
    period: Day
  - name: household_disagrees_with_determination
    entity: Household
    dtype: Boolean
    period: Day
  - name: days_since_determination
    entity: Household
    dtype: Integer
    period: Day
  - name: fair_hearing_rules_in_household_favor
    entity: Household
    dtype: Boolean
    period: Day
rules:
  - name: fair_hearing_request_limit_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual 2600, block 19, sentence 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-19
              excerpt: they have 90-days to request a fair hearing.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          90
  - name: fair_hearing_request_available_after_denial
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: Vermont 3SquaresVT Manual 2600, block 19, sentence 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-19
              excerpt: When a determination is made finding the household was not underpaid, and the household disagrees with the decision, they have 90-days to request a fair hearing.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          determination_finds_household_not_underpaid
          and household_disagrees_with_determination
          and days_since_determination <= fair_hearing_request_limit_days
  - name: restoration_allowed_after_disputed_denial
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: Vermont 3SquaresVT Manual 2600, block 19, sentences 1–2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-19
              excerpt: When a determination is made finding the household was not underpaid, and the household disagrees with the decision
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-19
              excerpt: Restore benefits to the household only when the fair hearing rules in favor of the household.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          determination_finds_household_not_underpaid
          and household_disagrees_with_determination
          and fair_hearing_rules_in_household_favor
