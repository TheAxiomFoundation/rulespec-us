format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-14
    source_sha256: c96f6bb5af864751cc3d7aa73c1c85be48e5f0517378665bf3952dd61f4f1288
  summary: |-
    Send the household form ESD 202VCR, Verification Change Request , requesting the missing information for each month needed. Deny restored benefits due to an underpayment for the months the household fails to provide the missing information.
inputs:
  - name: case_record_missing_information_needed_for_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: esd_202vcr_sent_requesting_missing_information_for_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_failed_to_provide_requested_information_for_month
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: restored_underpayment_benefits_denied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2600 Underpayments, block-14, sentences 1–3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-14
              excerpt: "when the case record doesn’t contain all necessary information."
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-14
              excerpt: "Send the household form ESD 202VCR, Verification Change Request , requesting the missing information for each month needed."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-14
              excerpt: "Deny restored benefits due to an underpayment for the months the household fails to provide the missing information."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          case_record_missing_information_needed_for_month
          and esd_202vcr_sent_requesting_missing_information_for_month
          and household_failed_to_provide_requested_information_for_month
