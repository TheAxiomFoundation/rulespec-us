format: rulespec/v1
module:
  summary: |-
    Restore benefits when a Fair Hearing decision states the agency’s actions regarding the household’s benefit amount or eligibility were incorrect. Issue underpaid benefits for not more than 12-months from whichever timeframe date occurred first.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-11
    source_sha256: 5179ac9eff2117849e3a0abaea0a816012ac329e772af8706e9b10a6ed954251
  proof_validation:
    required: true
inputs:
  - name: fair_hearing_decision_states_benefit_amount_action_incorrect
    entity: Household
    dtype: Boolean
    period: Month
  - name: fair_hearing_decision_states_eligibility_action_incorrect
    entity: Household
    dtype: Boolean
    period: Month
  - name: months_before_earliest_timeframe_date
    entity: Household
    dtype: Count
    period: Month
rules:
  - name: restoration_lookback_months
    kind: parameter
    dtype: Count
    source: Vermont 3SquaresVT Manual 2600, block-11
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-11
              excerpt: "not more than 12-months"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          12
  - name: fair_hearing_underpaid_benefits_restoration_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2600, block-11
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-11
              excerpt: "a Fair Hearing decision states the agency’s actions regarding the household’s benefit amount or eligibility were incorrect"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-11
              excerpt: "Issue underpaid benefits for not more than 12-months from whichever timeframe date occurred first."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (fair_hearing_decision_states_benefit_amount_action_incorrect
          or fair_hearing_decision_states_eligibility_action_incorrect)
          and months_before_earliest_timeframe_date <= restoration_lookback_months
