format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-18
    source_sha256: 71234a81f66fefd5d21644f531b5711fe48259e88b201b5858be610c562ea4a3
  summary: Households that do not agree with the underpayment amount have the right
    to request a fair hearing within 90-days of the date they are notified of the
    restored underpayment. Issue the original underpayment amount to the household,
    pending the hearing decision. Do not adjust the underpayment amount unless the
    hearing decision rules in favor of the household and requires an additional underpayment
    issuance.
inputs:
- name: household_disagrees_with_underpayment_amount
  entity: Household
  dtype: Boolean
  period: Day
- name: days_since_restored_underpayment_notification
  entity: Household
  dtype: Integer
  period: Day
- name: original_underpayment_amount
  entity: Household
  dtype: Money
  unit: USD
  period: Day
- name: hearing_decision_favors_household
  entity: Household
  dtype: Boolean
  period: Day
- name: hearing_decision_requires_additional_issuance
  entity: Household
  dtype: Boolean
  period: Day
- name: additional_underpayment_amount_required_by_hearing
  entity: Household
  dtype: Money
  unit: USD
  period: Day
rules:
- name: fair_hearing_request_limit_days
  kind: parameter
  dtype: Integer
  source: Vermont 3SquaresVT Manual 2600 Underpayments, block-18, sentence 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-18
          excerpt: within 90-days of the date they are notified of the restored underpayment
  versions:
  - effective_from: '2026-08-01'
    formula: "90"
- name: fair_hearing_request_right
  kind: derived
  entity: Household
  dtype: Judgment
  period: Day
  source: Vermont 3SquaresVT Manual 2600 Underpayments, block-18, sentence 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-18
          excerpt: Households that do not agree with the underpayment amount have
            the right to request a fair hearing within 90-days of the date they are
            notified of the restored underpayment.
  versions:
  - effective_from: '2026-08-01'
    formula: 'household_disagrees_with_underpayment_amount

      and days_since_restored_underpayment_notification >= 0

      and days_since_restored_underpayment_notification <= fair_hearing_request_limit_days'
- name: restored_underpayment_amount
  kind: derived
  entity: Household
  dtype: Money
  unit: USD
  period: Day
  source: "Vermont 3SquaresVT Manual 2600 Underpayments, block-18, sentences 2\u2013\
    3"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: default
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-18
          excerpt: Issue the original underpayment amount to the household, pending
            the hearing decision.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-18
          excerpt: Do not adjust the underpayment amount unless the hearing decision
            rules in favor of the household and requires an additional underpayment
            issuance.
  versions:
  - effective_from: '2026-08-01'
    formula: 'if hearing_decision_favors_household and hearing_decision_requires_additional_issuance:
      original_underpayment_amount + additional_underpayment_amount_required_by_hearing
      else: original_underpayment_amount'
