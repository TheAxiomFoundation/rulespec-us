format: rulespec/v1
module:
  summary: |-
    Restore underpaid benefits to households when the underpayment was not caused by the household. Complete the ESD 203R, Lost 3SquaresVT Benefits Restoration Worksheet .

    Note : The FACU now completes the ESD 203R. See Overpayments and Underpayments SOP .
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-2
    source_sha256: b1064b19d0c633b35a6529787b63a34b28f609c7e76f0380559b4e10fc0b8a00
  proof_validation:
    required: true
inputs:
  - name: household_has_underpaid_benefits
    entity: Household
    dtype: Boolean
    period: Month
  - name: underpayment_caused_by_household
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: underpaid_benefits_restoration_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: "Vermont 3SquaresVT Manual, 2600 Underpayments, block-2; restoration instruction and ESD 203R completion note."
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-2
              excerpt: Restore underpaid benefits to households when the underpayment was not caused by the household.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_has_underpaid_benefits
          and not underpayment_caused_by_household
