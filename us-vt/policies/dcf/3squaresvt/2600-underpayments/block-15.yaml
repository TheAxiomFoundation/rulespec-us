format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-15
    source_sha256: 4c0952c33b7c14d2dec687796eec9840b5da2d154a62eee4cecf4218d42c8377
  summary: |-
    Restored benefits for underpayments must be used to offset any unpaid 3SVT claims including compromised overpayments .
    Apply underpayments to a prior claim by faxing the ESD 203R, Lost 3SquaresVT Benefits Restoration Worksheet , to the Fraud and Claims Unit at 802-241-0960, ATTN: Supervisor.
inputs:
  - name: restored_underpayment
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: unpaid_claims_including_compromised_overpayments
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: restoration_is_for_initial_month_benefit
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_agrees_to_reduction
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: restoration_claim_offset
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 2600 Underpayments, offset requirement, initial-month exception, and ESD 203R submission procedure.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-15
              excerpt: Restored benefits for underpayments must be used to offset any unpaid 3SVT claims including compromised overpayments .
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-15
              excerpt: Restored underpayments are not used to offset a claim when restoring benefits due to an underpayment for an initial month’s benefit, unless the household agrees to the reduction.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if restoration_is_for_initial_month_benefit and not household_agrees_to_reduction: 0 else: min(restored_underpayment, unpaid_claims_including_compromised_overpayments)
  - name: restoration_issued_to_household
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual 2600 Underpayments, remaining restored benefits.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2600-underpayments/block-15
              excerpt: Amounts remaining after offsetting the claim are issued to the household.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          max(0, restored_underpayment - restoration_claim_offset)
