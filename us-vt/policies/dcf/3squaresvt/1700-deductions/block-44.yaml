format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-44
    source_sha256: 99db655b6c96e388afb703871ebf0af75ca87b19da98ca7b504cf4370e20573d
  summary: |-
    Individuals who report they are will lose their housing within 14 days are considered Homeless .

    Shelter costs must be updated based on the details the household provides. Note: Dependent care transportation cost must also be updated.
inputs:
  - name: reports_will_lose_housing
    entity: Person
    dtype: Boolean
    period: Month
  - name: reported_days_until_housing_loss
    entity: Person
    dtype: Count
    period: Month
rules:
  - name: imminent_housing_loss_day_limit
    kind: parameter
    dtype: Count
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block-44, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-44
              excerpt: "within 14 days"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          14
  - name: homeless_due_to_imminent_housing_loss
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block-44, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-44
              excerpt: "Individuals who report they are will lose their housing within 14 days are considered Homeless ."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          reports_will_lose_housing
          and reported_days_until_housing_loss <= imminent_housing_loss_day_limit
