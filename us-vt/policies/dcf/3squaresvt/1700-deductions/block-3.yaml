format: rulespec/v1
module:
  summary: |-
    Allow a child support deduction when the support is Legally Obligated and is: Paid by a household member for a child who is not part of the 3SVT household; or Paid by a household member to an agency or person outside of the household if the payments are not returned to the household.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-3
    source_sha256: 9028eef556e7722fe63a3e23ce6cc29712595dce7fdd2ebfe0cb0955ddc01766
  proof_validation:
    required: true
inputs:
  - name: support_is_legally_obligated
    entity: Payment
    dtype: Boolean
    period: Month
  - name: paid_by_household_member
    entity: Payment
    dtype: Boolean
    period: Month
  - name: support_is_for_child_outside_household
    entity: Payment
    dtype: Boolean
    period: Month
  - name: recipient_is_agency_or_person_outside_household
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_is_returned_to_household
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: child_support_payment_deductible
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, child support deduction
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-3
              excerpt: "Allow a child support deduction when the support is Legally Obligated"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-3
              excerpt: "Paid by a household member for a child who is not part of the 3SVT household"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-3
              excerpt: "Paid by a household member to an agency or person outside of the household if the payments are not returned to the household."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          support_is_legally_obligated
          and paid_by_household_member
          and (
            support_is_for_child_outside_household
            or (
              recipient_is_agency_or_person_outside_household
              and not payment_is_returned_to_household
            )
          )
