format: rulespec/v1
module:
  summary: |-
    If verification is not submitted prior to the end of the 30-day processing period, process the application without the deduction.

    Postpone verification for expedited service month(s), unless verification can be provided in time to meet the seven-day standard of promptness.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-7
    source_sha256: 3f65921a0033b69cade66a57d411bdd0e4c3691b1e0058a60d33850ec26b6329
  proof_validation:
    required: true
inputs:
  - name: processing_days_elapsed
    entity: Application
    dtype: Integer
    period: Month
  - name: verification_submitted_before_processing_period_end
    entity: Application
    dtype: Boolean
    period: Month
  - name: expedited_service_month
    entity: Application
    dtype: Boolean
    period: Month
  - name: days_within_which_verification_can_be_provided
    entity: Application
    dtype: Integer
    period: Month
rules:
  - name: application_processing_period_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block-7, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-7
              excerpt: "30-day processing period"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          30
  - name: expedited_promptness_standard_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block-7, second sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-7
              excerpt: "seven-day standard of promptness"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          7
  - name: process_application_without_deduction
    kind: derived
    entity: Application
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block-7, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-7
              excerpt: "If verification is not submitted prior to the end of the 30-day processing period, process the application without the deduction."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          processing_days_elapsed >= application_processing_period_days
          and not verification_submitted_before_processing_period_end
  - name: postpone_expedited_verification
    kind: derived
    entity: Application
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block-7, second sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-7
              excerpt: "Postpone verification for expedited service month(s), unless verification can be provided in time to meet the seven-day standard of promptness."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          expedited_service_month
          and days_within_which_verification_can_be_provided > expedited_promptness_standard_days
