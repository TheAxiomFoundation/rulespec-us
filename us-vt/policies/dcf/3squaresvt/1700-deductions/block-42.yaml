format: rulespec/v1
module:
  summary: |-
    Shelter costs of an unoccupied home may be allowed if the household intends to return to the home and the members are away from the home for: Training; Employment; Illness; or Abandonment because of natural disaster or casualty loss.
    The household is allowed only one utility allowance to cover both residences. Allow the highest applicable utility allowance.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
    source_sha256: 8bb2e65d52414e6dc3c8dafa52ef688957b7a5815d774846a8b8f44fb5adc566
  proof_validation:
    required: true
inputs:
  - name: intends_to_return_to_unoccupied_home
    entity: Household
    dtype: Boolean
    period: Month
  - name: away_for_training
    entity: Household
    dtype: Boolean
    period: Month
  - name: away_for_employment
    entity: Household
    dtype: Boolean
    period: Month
  - name: away_for_illness
    entity: Household
    dtype: Boolean
    period: Month
  - name: away_because_home_abandoned_after_natural_disaster_or_casualty_loss
    entity: Household
    dtype: Boolean
    period: Month
  - name: unoccupied_home_rented_out_during_absence
    entity: Household
    dtype: Boolean
    period: Month
  - name: unoccupied_home_leased_during_absence
    entity: Household
    dtype: Boolean
    period: Month
  - name: current_resident_claims_snap_shelter_deduction_for_same_home_in_any_state
    entity: Household
    dtype: Boolean
    period: Month
  - name: applicable_utility_allowance_for_current_residence
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: applicable_utility_allowance_for_unoccupied_home
    entity: Household
    dtype: Money
    unit: USD
    period: Month
rules:
  - name: unoccupied_home_shelter_costs_allowable
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, unoccupied home conditions and exclusions.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
              excerpt: "Shelter costs of an unoccupied home may be allowed if the household intends to return to the home"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
              excerpt: "Training; Employment; Illness; or Abandonment because of natural disaster or casualty loss."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
              excerpt: "The home is being rented out or leased during the absence of the household members"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
              excerpt: "Any current residents are claiming shelter costs for the home for 3SVT or SNAP deductions in any state."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          intends_to_return_to_unoccupied_home
          and (away_for_training or away_for_employment or away_for_illness or away_because_home_abandoned_after_natural_disaster_or_casualty_loss)
          and not unoccupied_home_rented_out_during_absence
          and not unoccupied_home_leased_during_absence
          and not current_resident_claims_snap_shelter_deduction_for_same_home_in_any_state
  - name: maximum_utility_allowance_count
    kind: parameter
    dtype: Count
    source: Vermont 3SquaresVT Manual, 1700 Deductions, utility allowance limitation.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
              excerpt: "The household is allowed only one utility allowance to cover both residences."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1
  - name: utility_allowance_count_for_both_residences
    kind: derived
    entity: Household
    dtype: Count
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, utility allowance limitation.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
              excerpt: "The household is allowed only one utility allowance to cover both residences."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          maximum_utility_allowance_count
  - name: utility_allowance_for_both_residences
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, highest applicable utility allowance.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-42
              excerpt: "Allow the highest applicable utility allowance."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          max(applicable_utility_allowance_for_current_residence, applicable_utility_allowance_for_unoccupied_home)
