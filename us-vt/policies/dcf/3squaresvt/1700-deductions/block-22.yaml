format: rulespec/v1
module:
  summary: |-
    Subtract 20% of Gross Earned Income .
    Do not allow the 20% gross earned income deduction when determining an overpayment amount if the household failed to report earned income correctly or timely.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-22
    source_sha256: 2ae3360cbd0452f0b0431caba18cc71e5323421b882bbd525636c4307b2efe76
  proof_validation:
    required: true
inputs:
  - name: gross_earned_income
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: determining_overpayment_amount
    entity: Household
    dtype: Boolean
    period: Month
  - name: failed_to_report_earned_income_correctly
    entity: Household
    dtype: Boolean
    period: Month
  - name: failed_to_report_earned_income_timely
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: earned_income_deduction_rate
    kind: parameter
    dtype: Rate
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block 22, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-22
              excerpt: Subtract 20% of Gross Earned Income .
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          0.20
  - name: earned_income_deduction
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1700 Deductions, block 22
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-22
              excerpt: Subtract 20% of Gross Earned Income .
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-22
              excerpt: Do not allow the 20% gross earned income deduction when determining an overpayment amount if the household failed to report earned income correctly or timely.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if determining_overpayment_amount and (failed_to_report_earned_income_correctly or failed_to_report_earned_income_timely): 0 else: earned_income_deduction_rate * max(0, gross_earned_income)
