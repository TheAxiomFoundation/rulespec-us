format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-52
    source_sha256: 10fb6c26d2853c92f59d44bb178df92674db6da0d3c2d986da038fef5f6a4393
  summary: |-
    Give the telephone allowance to households when this is their only utility expense. This includes households which share the telephone expense.
    SUA (with heat) $1,096 BUA (without heat) $311 Telephone $37
inputs:
  - name: household_has_telephone_expense
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_has_other_utility_expense
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: standard_utility_allowance_with_heat
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: "1700 Deductions, block-52: SUA (with heat)"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-52
              excerpt: "SUA (with heat) $1,096"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1096
  - name: basic_utility_allowance_without_heat
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: "1700 Deductions, block-52: BUA (without heat)"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-52
              excerpt: "BUA (without heat) $311"
