      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-52
              excerpt: "Telephone $37"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          37
  - name: telephone_allowance
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: "1700 Deductions, block-52: telephone-only utility expense, including shared telephone expense"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-52
              excerpt: "Give the telephone allowance to households when this is their only utility expense."
