            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-52
              excerpt: "This includes households which share the telephone expense."
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-52
              excerpt: "Telephone $37"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if household_has_other_utility_expense: 0 else: if household_has_telephone_expense: telephone_allowance_standard else: 0
