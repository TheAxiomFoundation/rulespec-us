format: rulespec/v1
module:
  summary: |-
    If verification is not submitted prior to the end of the 30-day processing period, process the application without the expense.
    Postpone verification for expedited service month(s), unless verification can be provided in time to meet the seven-day standard of promptness.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-18
    source_sha256: 459baebeb5401a7385092cfd5ed59929b18d52625d4d970fb95199bf2f40f635
  proof_validation:
    required: true
inputs:
  - name: application_processing_days_elapsed
    entity: Application
    dtype: Integer
    period: Month
  - name: expense_verification_submitted_before_processing_period_end
    entity: Application
    dtype: Boolean
    period: Month
  - name: month_is_expedited_service_month
    entity: Application
    dtype: Boolean
    period: Month
  - name: earliest_verification_availability_day_after_application
    entity: Application
    dtype: Integer
    period: Month
rules:
  - name: application_processing_period_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual 1700 Deductions, block-18, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-18
              excerpt: 30-day processing period
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          30
  - name: expedited_promptness_standard_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual 1700 Deductions, block-18, second sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-18
              excerpt: seven-day standard of promptness
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          7
  - name: process_application_without_expense
    kind: derived
    entity: Application
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1700 Deductions, block-18, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-18
              excerpt: If verification is not submitted prior to the end of the 30-day processing period, process the application without the expense.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          application_processing_days_elapsed >= application_processing_period_days
          and not expense_verification_submitted_before_processing_period_end
  - name: expense_verification_postponed
    kind: derived
    entity: Application
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1700 Deductions, block-18, second sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1700-deductions/block-18
              excerpt: Postpone verification for expedited service month(s), unless verification can be provided in time to meet the seven-day standard of promptness.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          month_is_expedited_service_month
          and earliest_verification_availability_day_after_application > expedited_promptness_standard_days
