format: rulespec/v1
module:
  summary: |-
    A child may only be a member of one 3SquaresVT household.
    If a child spends an equal amount of time in each household, the custodians decide which household can claim the child.
    Note : A child residing in the home 50% or more of the time and who is not on 3SVT in another household must be considered a mandatory household member.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
    source_sha256: ded36dc2e9dbb811399f81efe90f9c586418f2ebe5b74fab1b4a2e5f87f4e5b0
  proof_validation:
    required: true
  interpretations:
    - id: equal-custody-choice-priority
      status: open
      question: Does an agreed equal-custody choice override application order?
      texts:
        - corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
          excerpt: The first household to apply may include the child regardless of the percentage of custody.
        - corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
          excerpt: If a child spends an equal amount of time in each household, the custodians decide which household can claim the child.
      reading: An agreed custodial choice controls equal-custody claims; application order controls when the custodians cannot decide.
      alternatives:
        - id: application-order-controls
          reading: The first applicant may include the child even when equal-time custodians agree on the other household.
      basis: The specific equal-time sentences qualify the general first-applicant sentence.
      affects:
        - child_may_be_included
inputs:
  - name: participating_household_count
    entity: Person
    dtype: Count
    period: Month
  - name: child_on_3squaresvt_in_another_household
    entity: Person
    dtype: Boolean
    period: Month
  - name: this_household_applied_first
    entity: Person
    dtype: Boolean
    period: Month
  - name: child_spends_equal_time_in_each_household
    entity: Person
    dtype: Boolean
    period: Month
  - name: custodians_choice
    entity: Person
    dtype: String
    period: Month
  - name: parent_died
    entity: Person
    dtype: Boolean
    period: Month
  - name: second_household_applied
    entity: Person
    dtype: Boolean
    period: Month
  - name: second_household_verified_child_primarily_resides_with_them
    entity: Person
    dtype: Boolean
    period: Month
  - name: child_residence_share_in_this_home
    entity: Person
    dtype: Rate
    period: Month
rules:
  - name: maximum_child_households
    kind: parameter
    dtype: Count
    source: Vermont 3SquaresVT Manual 500, child household exclusivity.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: A child may only be a member of one 3SquaresVT household.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1
  - name: mandatory_child_residence_share
    kind: parameter
    dtype: Rate
    source: Vermont 3SquaresVT Manual 500, Note.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: A child residing in the home 50% or more of the time
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          0.50
  - name: child_household_exclusivity_satisfied
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 500, first sentence.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: A child may only be a member of one 3SquaresVT household.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          participating_household_count <= maximum_child_households
  - name: child_may_be_included
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 500, first paragraph.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: The first household to apply may include the child regardless of the percentage of custody.
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: If the custodians cannot decide, include the child in the household that applies first.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: If a child spends an equal amount of time in each household, the custodians decide which household can claim the child.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: A child may only be a member of one 3SquaresVT household.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not child_on_3squaresvt_in_another_household
          and (
            (child_spends_equal_time_in_each_household and custodians_choice == "this_household")
            or (
              this_household_applied_first
              and (
                not child_spends_equal_time_in_each_household
                or custodians_choice == "undecided"
              )
            )
          )
  - name: child_transfer_required
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 500, transfer paragraph.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: "Transfer the child to the other household if: the parent dies, or the second household, after applying for benefits, provides verification that the child primarily resides with them."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          parent_died
          or (
            second_household_applied
            and second_household_verified_child_primarily_resides_with_them
          )
  - name: child_mandatory_household_member
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 500, Note.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/500householdcomp/block-10
              excerpt: A child residing in the home 50% or more of the time and who is not on 3SVT in another household must be considered a mandatory household member.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          child_residence_share_in_this_home >= mandatory_child_residence_share
          and not child_on_3squaresvt_in_another_household
