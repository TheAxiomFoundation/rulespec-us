format: rulespec/v1
module:
  summary: |-
    Trafficking means: Exchanging 3SVT benefits or EBT cards for non-food items or cash;
    Exchanging 3SVT benefits for firearms, ammunition, explosives, or Controlled Substance;
    Returning a container for a deposit if the product was purchased with 3SVT benefits
    when the contents were intentionally discarded; or Reselling a product purchased
    with 3SVT benefits for non-food items or cash.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-3
    source_sha256: 9fcb54a44df70455dc3389cf7e3df0d683b4ac3a6e85606b7432662b527bdae7
  proof_validation:
    required: true
inputs:
  - name: activity
    entity: Person
    dtype: String
    period: Month
  - name: consideration
    entity: Person
    dtype: String
    period: Month
  - name: same_product_purchased_with_3svt_benefits
    entity: Person
    dtype: Boolean
    period: Month
  - name: same_product_contents_intentionally_discarded
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: trafficking
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2800, trafficking definition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-3
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-3
              excerpt: "Trafficking means:"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          ((activity == "exchanging 3SVT benefits" or activity == "exchanging EBT cards")
            and (consideration == "non-food items" or consideration == "cash"))
          or (activity == "exchanging 3SVT benefits"
            and (consideration == "firearms" or consideration == "ammunition"
              or consideration == "explosives" or consideration == "Controlled Substance"))
          or (activity == "returning a container for a deposit"
            and same_product_purchased_with_3svt_benefits
            and same_product_contents_intentionally_discarded)
          or (activity == "reselling a product"
            and same_product_purchased_with_3svt_benefits
            and (consideration == "non-food items" or consideration == "cash"))
