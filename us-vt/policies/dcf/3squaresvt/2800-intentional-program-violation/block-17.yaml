format: rulespec/v1
module:
  summary: |-
    When a household loses categorical eligibility because a household member has received an IPV the following steps will be taken:
    Apply the IPV to the household member's MBR2 panel in ACCESS.
    Change the EITC flag on STAT/C/STAT to "N".
    Enter a WARN stating the household is not eligible to receive the "Y" in the EITC field until the IPV has expired. Include the expiration date in the warn.
    When a household loses categorical eligibility, ACCESS will automatically re-screen the household using standard eligibility requirements.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-17
    source_sha256: 8f82a5ea7964914aa0e4fce20d9c775993ac6d2c10a0a0f92160dbd99b843362
  proof_validation:
    required: true
inputs:
  - name: household_loses_categorical_eligibility_because_member_received_ipv
    entity: Household
    dtype: Boolean
    period: Month
  - name: ipv_applied_to_affected_members_mbr2_panel
    entity: Household
    dtype: Boolean
    period: Month
  - name: stat_c_stat_eitc_flag_changed_to_n
    entity: Household
    dtype: Boolean
    period: Month
  - name: warn_entered_prohibiting_eitc_y_until_ipv_expiration_and_including_expiration_date
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_loses_categorical_eligibility
    entity: Household
    dtype: Boolean
    period: Month
  - name: access_automatically_rescreens_household_using_standard_eligibility_requirements
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: facu_ipv_actions_compliant
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2800, block-17, opening condition and Actions by the Fraud and Claims Unit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-17
              excerpt: When a household loses categorical eligibility because a household member has received an IPV
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-17
              excerpt: Apply the IPV to the household member's MBR2 panel in ACCESS.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-17
              excerpt: Change the EITC flag on STAT/C/STAT to "N".
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2800-intentional-program-violation/block-17
              excerpt: Enter a WARN stating the household is not eligible to receive the "Y" in the EITC field until the IPV has expired. Include the expiration date in the warn.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not household_loses_categorical_eligibility_because_member_received_ipv
          or (
            ipv_applied_to_affected_members_mbr2_panel
            and stat_c_stat_eitc_flag_changed_to_n
            and warn_entered_prohibiting_eitc_y_until_ipv_expiration_and_including_expiration_date
