format: rulespec/v1
module:
  summary: |-
    Exclude cash donations based on need when the household gets them from one or more private, nonprofit, charitable organizations. Do not exclude more than $300 per federal fiscal quarter. Count any amount over the $300 limit as unearned income.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
    source_sha256: fef1fcebe3f462cf0201c5707d39262aa54b87602e5dbc56624cf3ee33ab179c
  proof_validation:
    required: true
  deferred_outputs:
    - output: us-vt:policies/dcf/3squaresvt/1600-income/block-14#crowdfunding_account_income_treatment
      reason: >-
        "Exception : Crowdfunding accounts are treated differently than cash donations."
        The source does not supply the different income treatment or an exclusion
        amount for crowdfunding accounts. The executable quarterly amounts cover
        ordinary cash donations only and do not determine crowdfunding treatment.
inputs:
  - name: ordinary_need_based_cash_donations_received_from_private_nonprofit_charitable_organizations_in_federal_fiscal_quarter
    entity: Household
    dtype: Money
    unit: USD
    period: Day
rules:
  - name: federal_fiscal_quarter_cash_donation_exclusion_limit
    kind: parameter
    dtype: Money
    unit: USD
    source: Vermont 3SquaresVT Manual, 1600 Income, cash donations exclusion limit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
              excerpt: Do not exclude more than $300 per federal fiscal quarter.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          300
  - name: ordinary_cash_donations_excluded_in_federal_fiscal_quarter
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Day
    source: Vermont 3SquaresVT Manual, 1600 Income, ordinary charitable cash donations
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
              excerpt: Exclude cash donations based on need when the household gets them from one or more private, nonprofit, charitable organizations.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
              excerpt: Do not exclude more than $300 per federal fiscal quarter.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
              excerpt: Crowdfunding accounts are treated differently than cash donations.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          min(max(0, ordinary_need_based_cash_donations_received_from_private_nonprofit_charitable_organizations_in_federal_fiscal_quarter), federal_fiscal_quarter_cash_donation_exclusion_limit)
  - name: ordinary_cash_donation_excess_unearned_income_in_federal_fiscal_quarter
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Day
    source: Vermont 3SquaresVT Manual, 1600 Income, cash donation excess
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
              excerpt: Exclude cash donations based on need when the household gets them from one or more private, nonprofit, charitable organizations.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
              excerpt: Count any amount over the $300 limit as unearned income.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-14
              excerpt: Crowdfunding accounts are treated differently than cash donations.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          max(0, ordinary_need_based_cash_donations_received_from_private_nonprofit_charitable_organizations_in_federal_fiscal_quarter - federal_fiscal_quarter_cash_donation_exclusion_limit)
