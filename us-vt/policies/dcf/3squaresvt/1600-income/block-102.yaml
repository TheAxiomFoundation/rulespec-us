format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-102
    source_sha256: b2980eaede68f7165b225cbeefbaec0cf99acadf45771dc3994ea04fb8d28818
  summary: |-
    Exclude General Assistance or Reach Up vendor payments for the housing and transportation of Migrant Worker and Seasonal Farmworker households while workers are in the job stream.
  deferred_outputs:
    - output: us-vt:policies/dcf/3squaresvt/1600-income/block-102#vendor_payment_excluded
      reason: >-
        Cannot be computed until Legally Obligated Money is encoded.
        The source states "Exclude the following vendor payments:" and
        "E xceptions: See Legally Obligated Money and General Assistance ."
        The missing determination is the effect of legally obligated money
        on the enumerated vendor-payment exclusions.
    - output: us-vt:policies/dcf/3squaresvt/1600-income/block-102#general_assistance_vendor_payment_exception
      reason: >-
        Cannot be computed until General Assistance is encoded.
        The source states "E xceptions: See Legally Obligated Money and General Assistance ."
        The missing determination is the General Assistance exception to
        the enumerated vendor-payment exclusions.
    - output: us-vt:policies/dcf/3squaresvt/1600-income/block-102#vendor_paid_expense_deduction
      reason: >-
        Cannot be computed until Determining Monthly Deductions - Disallowed Expenses is encoded.
        The source states "See Determining Monthly Deductions - Disallowed Expenses on how to handle deductions."
        The missing determination is the deduction treatment of vendor-paid expenses.
inputs:
  - name: is_general_assistance_vendor_payment
    entity: Payment
    dtype: Boolean
    period: Month
  - name: is_reach_up_vendor_payment
    entity: Payment
    dtype: Boolean
    period: Month
  - name: pays_household_housing
    entity: Payment
    dtype: Boolean
    period: Month
  - name: pays_household_transportation
    entity: Payment
    dtype: Boolean
    period: Month
  - name: household_is_migrant_worker_household
    entity: Payment
    dtype: Boolean
    period: Month
  - name: household_is_seasonal_farmworker_household
    entity: Payment
    dtype: Boolean
    period: Month
  - name: household_workers_are_in_job_stream
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: farmworker_vendor_payment_excluded
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-102, final paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-102
              excerpt: "Exclude General Assistance or Reach Up vendor payments for the housing and transportation of Migrant Worker and Seasonal Farmworker households while workers are in the job stream."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (is_general_assistance_vendor_payment or is_reach_up_vendor_payment)
          and (pays_household_housing or pays_household_transportation)
          and (household_is_migrant_worker_household or household_is_seasonal_farmworker_household)
          and household_workers_are_in_job_stream
