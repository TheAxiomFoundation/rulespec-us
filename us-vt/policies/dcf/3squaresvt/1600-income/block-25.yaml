format: rulespec/v1
module:
  summary: |-
    Count the income as the DCP provider’s income. Exception : Exclude room and board payment if made by the DCP recipient.
    Note : DCP recipients are considered a foster adult .
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-25
    source_sha256: 38be859dd59108571c96e55a59a60fad014c52c0f7a18c72bc5332d371107c29
  proof_validation:
    required: true
inputs:
  - name: dcp_recipient_included_in_3svt_household
    entity: Person
    dtype: Boolean
    period: Month
  - name: dcp_stipend
    entity: Person
    dtype: Money
    period: Month
  - name: dcp_room_and_board
    entity: Person
    dtype: Money
    period: Month
  - name: dcp_room_and_board_paid_by_recipient
    entity: Person
    dtype: Boolean
    period: Month
  - name: person_is_dcp_recipient
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: dcp_provider_unearned_income
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, DCP payment inclusion and exclusion paragraphs
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-25
              excerpt: Count the DCP payments (both the stipend and the room and board) as unearned income when the DCP recipient is included in the 3SVT household.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-25
              excerpt: Count the income as the DCP provider’s income.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-25
              excerpt: Exclude room and board payment if made by the DCP recipient.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-25
              excerpt: Exclude the DCP payments (both the stipend and the room and board) to the household member providing the care when the DCP recipient is not included in the 3SVT household.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if dcp_recipient_included_in_3svt_household:
            dcp_stipend + (if dcp_room_and_board_paid_by_recipient: 0 else: dcp_room_and_board)
          else: 0
  - name: treated_as_foster_adult
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, DCP note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-25
              excerpt: DCP recipients are considered a foster adult .
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          person_is_dcp_recipient
