format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-27
    source_sha256: '0bbe1beeb8e7bce0073e148e842662b29367777911444e5a33abdddd614bee22'
  summary: |-
    Exclude disaster and emergency assistance payments provided under the Robert T. Stafford Disaster Relief and Emergency Assistance Act, as amended (Public Law 100-707).
    However, payments made to homeless people to pay rent, mortgage, food and utilities are not excluded under this provision when there is no major disaster or emergency declared by the President.
inputs:
  - name: federal_stafford_assistance_to_directly_affected_person
    entity: Payment
    dtype: Boolean
    period: Month
  - name: comparable_disaster_assistance
    entity: Payment
    dtype: Boolean
    period: Month
  - name: provider_category
    entity: Payment
    dtype: String
    period: Month
  - name: recipient_is_homeless
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_purpose
    entity: Payment
    dtype: String
    period: Month
  - name: presidential_major_disaster_or_emergency_declared
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: disaster_assistance_payment_excluded
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-27, all paragraphs
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-27
              excerpt: "Exclude disaster and emergency assistance payments provided under the Robert T. Stafford Disaster Relief and Emergency Assistance Act"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-27
              excerpt: "federal assistance provided to people directly affected and to comparable disaster assistance provided by states, local government, and disaster assistance organizations."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-27
              excerpt: "payments made to homeless people to pay rent, mortgage, food and utilities are not excluded under this provision when there is no major disaster or emergency declared by the President."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (federal_stafford_assistance_to_directly_affected_person
            or (comparable_disaster_assistance
              and (provider_category == "state"
                or provider_category == "local_government"
                or provider_category == "disaster_assistance_organization")))
          and not (recipient_is_homeless
            and (payment_purpose == "rent"
              or payment_purpose == "mortgage"
              or payment_purpose == "food"
              or payment_purpose == "utilities")
            and not presidential_major_disaster_or_emergency_declared)
