format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-39
    source_sha256: dc21da5adab4e117535762e26f426006d2f90ec65fbced28cab5ac54ea253a45
  summary: |-
    Count the foster care payment as unearned income when a foster child or foster adult is included in the 3SVT household.
    Exclude the foster care payment when a foster child or foster adult is not included in the 3SVT household. This includes payments made to a respite provider.
    Note : DCP recipients are considered a foster adult.
inputs:
  - name: foster_care_payment_amount
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
  - name: care_recipient_is_foster_child
    entity: Payment
    dtype: Boolean
    period: Month
  - name: care_recipient_is_foster_adult
    entity: Payment
    dtype: Boolean
    period: Month
  - name: care_recipient_is_dcp_recipient
    entity: Payment
    dtype: Boolean
    period: Month
  - name: care_recipient_is_in_3svt_household
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: foster_care_recipient
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block 39, including DCP note.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-39
              excerpt: "Note : DCP recipients are considered a foster adult."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-39
              excerpt: "a foster child or foster adult"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          care_recipient_is_foster_child
          or care_recipient_is_foster_adult
          or care_recipient_is_dcp_recipient
  - name: foster_care_payment_unearned_income
    kind: derived
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block 39, counting paragraph.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-39
              excerpt: "Count the foster care payment as unearned income when a foster child or foster adult is included in the 3SVT household."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if foster_care_recipient and care_recipient_is_in_3svt_household: foster_care_payment_amount else: 0
  - name: excluded_foster_care_payment
    kind: derived
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block 39, exclusion paragraph including respite providers.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-39
              excerpt: "Exclude the foster care payment when a foster child or foster adult is not included in the 3SVT household. This includes payments made to a respite provider."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if foster_care_recipient and not care_recipient_is_in_3svt_household: foster_care_payment_amount else: 0
