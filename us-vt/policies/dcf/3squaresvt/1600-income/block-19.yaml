format: rulespec/v1
module:
  summary: |-
    Count CWT payments as earned income for 3SVT.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-19
    source_sha256: 9871f5ab384ffeb91d978d776960657a595248c77236e0bdab6d238e5a8d7107
  proof_validation:
    required: true
inputs:
  - name: program_is_va_therapeutic_vocational_and_rehabilitative_program
    entity: Payment
    dtype: Boolean
    period: Month
  - name: recipient_is_unemployed_or_underemployed_veteran
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payment_is_for_work_in_program_real_work_placement
    entity: Payment
    dtype: Boolean
    period: Month
  - name: payer
    entity: Payment
    dtype: String
    period: Month
  - name: payment_amount
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
rules:
  - name: payment_qualifies_as_cwt
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-19, CWT description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-19
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-19
              excerpt: payments from the VA or through the employer.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          program_is_va_therapeutic_vocational_and_rehabilitative_program
          and recipient_is_unemployed_or_underemployed_veteran
          and payment_is_for_work_in_program_real_work_placement
          and (payer == "VA" or payer == "employer")
  - name: cwt_payment_counted_as_earned_income
    kind: derived
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-19, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-19
              excerpt: Count CWT payments as earned income for 3SVT.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if payment_qualifies_as_cwt: payment_amount else: 0
