format: rulespec/v1
module:
  summary: |-
    Count as earned income WIOA on-the-job training, including Job Corps and YouthBuild earnings.
    Exception : Exclude WIOA on-the-job training earnings of household members under age 19 who are under the Parental Control of an adult household member.
    Apply this exclusion regardless of school attendance or enrollment.
    Exclude all payments for living allowances, education, or other purposes that participants get for participating in WIOA programs.
    Note : The Workforce Innovation and Opportunity Act was formerly known as JTPA .
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
    source_sha256: 361d9683b522f2df6257ec519c3fb9fdddf7909acd67f7abe955d6b688554fad
  proof_validation:
    required: true
inputs:
  - name: age
    entity: Person
    dtype: Integer
    period: Month
  - name: under_parental_control_of_adult_household_member
    entity: Person
    dtype: Boolean
    period: Month
  - name: wioa_paid_on_the_job_training_earnings
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: employer_paid_wioa_on_the_job_training_earnings
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: wioa_participation_living_allowance_payments
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: wioa_participation_education_payments
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: wioa_participation_other_purpose_payments
    entity: Person
    dtype: Money
    unit: USD
    period: Month
rules:
  - name: wioa_youth_earnings_exclusion_age_limit
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual, 1600 Income, WIOA exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: under age 19
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          19
  - name: wioa_youth_earnings_exclusion_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, WIOA exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: Exclude WIOA on-the-job training earnings of household members under age 19 who are under the Parental Control of an adult household member.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: Apply this exclusion regardless of school attendance or enrollment.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          age < wioa_youth_earnings_exclusion_age_limit
          and under_parental_control_of_adult_household_member
  - name: countable_wioa_earned_income
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, WIOA earnings and exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: Count as earned income WIOA on-the-job training, including Job Corps and YouthBuild earnings.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: These earnings include monies paid by WIOA and monies paid by the employer.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: WIOA sets the definition of these programs.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: Exclude WIOA on-the-job training earnings of household members under age 19 who are under the Parental Control of an adult household member.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if wioa_youth_earnings_exclusion_applies: 0 else: wioa_paid_on_the_job_training_earnings + employer_paid_wioa_on_the_job_training_earnings
  - name: excluded_wioa_participation_payments
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, WIOA participation payments
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-110
              excerpt: Exclude all payments for living allowances, education, or other purposes that participants get for participating in WIOA programs.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          wioa_participation_living_allowance_payments + wioa_participation_education_payments + wioa_participation_other_purpose_payments
