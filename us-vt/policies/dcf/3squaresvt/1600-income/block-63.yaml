format: rulespec/v1
module:
  summary: |-
    Exclude $2000 per year from tribal dividend payments.
    Exceptions : Exclude all tribal dividend money deposited into a child’s trust. Count casino profit payments as unearned income in the month received. Do not apply the $2000 exclusion.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-63
    source_sha256: 4bfad16c81a1b38c43c413b65b3160ea1edaf8b4428ef08be6043d4baa47f101
  proof_validation:
    required: true
inputs:
  - name: noncasino_tribal_dividends_outside_child_trust
    entity: Person
    dtype: Money
    unit: USD
    period: Year
  - name: tribal_dividends_deposited_into_child_trust
    entity: Person
    dtype: Money
    unit: USD
    period: Year
  - name: casino_profit_payment_amount
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: casino_profit_payment_received_this_month
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: annual_tribal_dividend_exclusion_limit
    kind: parameter
    dtype: Money
    unit: USD
    period: Year
    source: Vermont 3SquaresVT Manual, 1600 Income, block 63, first sentence.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-63
              excerpt: Exclude $2000 per year from tribal dividend payments.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          2000
  - name: excluded_tribal_dividends
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Year
    source: Vermont 3SquaresVT Manual, 1600 Income, block 63, annual exclusion and child-trust exception.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-63
              excerpt: Exclude $2000 per year from tribal dividend payments.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-63
              excerpt: Exclude all tribal dividend money deposited into a child’s trust.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-63
              excerpt: Count casino profit payments as unearned income in the month received. Do not apply the $2000 exclusion.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          tribal_dividends_deposited_into_child_trust
          + min(max(0, noncasino_tribal_dividends_outside_child_trust), annual_tribal_dividend_exclusion_limit)
  - name: casino_profit_payments_unearned_income
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block 63, casino-profit exception.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-63
              excerpt: Count casino profit payments as unearned income in the month received. Do not apply the $2000 exclusion.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if casino_profit_payment_received_this_month: casino_profit_payment_amount else: 0
