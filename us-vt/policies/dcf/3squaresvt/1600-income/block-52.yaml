format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-52
    source_sha256: f76f0ae5d3a8ade70fae55e30245935740a84a5c59baa30aad9599a282672490
  summary: |-
    Count salary and performance bonuses as earned income for Job Corps participants and former participants who are still receiving Job Corps payments.

    Note : Most Job Corps participants are residents of an ineligible Institution , and therefore, not eligible for 3SVT. See Special Household Situations for eligible institutions.
inputs:
  - name: job_corps_participant
    entity: Person
    dtype: Boolean
    period: Month
  - name: former_participant_still_receiving_job_corps_payments
    entity: Person
    dtype: Boolean
    period: Month
  - name: job_corps_salary
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: job_corps_salary_from_prior_periods_paid_as_one_time_lump_sum
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: job_corps_performance_bonuses
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: job_corps_performance_bonuses_received_after_leaving_and_paid_in_one_payment
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: resident_of_ineligible_institution
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: job_corps_salary_earned_income
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-52, salary inclusion and prior-period lump-sum exclusion.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-52
              excerpt: Count salary and performance bonuses as earned income for Job Corps participants and former participants who are still receiving Job Corps payments.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-52
              excerpt: Exclude any lump sum one-time payment of salary from prior periods as a lump sum (nonrecurring) payment.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if job_corps_participant or former_participant_still_receiving_job_corps_payments:
            job_corps_salary - job_corps_salary_from_prior_periods_paid_as_one_time_lump_sum
          else: 0
  - name: job_corps_performance_bonus_earned_income
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-52, performance-bonus inclusion and post-program lump-sum exclusion.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-52
              excerpt: Count salary and performance bonuses as earned income for Job Corps participants and former participants who are still receiving Job Corps payments.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-52
              excerpt: If a performance bonus is received after the person leaves the program and it is paid out in one payment, exclude it from income as a lump sum (nonrecurring).
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if job_corps_participant or former_participant_still_receiving_job_corps_payments:
            job_corps_performance_bonuses - job_corps_performance_bonuses_received_after_leaving_and_paid_in_one_payment
          else: 0
  - name: job_corps_institutional_ineligibility
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-52, institutional-residence note.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-52
              excerpt: Most Job Corps participants are residents of an ineligible Institution , and therefore, not eligible for 3SVT.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          job_corps_participant
          and resident_of_ineligible_institution
