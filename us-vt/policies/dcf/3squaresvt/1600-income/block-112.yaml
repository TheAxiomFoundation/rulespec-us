format: rulespec/v1
module:
  summary: |-
    Before initial approval, verify all gross countable income.
    Exception : Allow 3SquaresVT in a SNAP households to self-declare income, unless questionable.
    Postpone verification for expedited service month(s), unless verification can be provided in time to meet the seven-day standard of promptness.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-112
    source_sha256: 215146790e4bcf90080c143c6984aecc045bf8260901172433db449f4ea47793
  proof_validation:
    required: true
inputs:
  - name: before_initial_approval
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_is_3squaresvt_in_a_snap
    entity: Household
    dtype: Boolean
    period: Month
  - name: income_is_questionable
    entity: Household
    dtype: Boolean
    period: Month
  - name: expedited_service_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_can_meet_promptness_standard
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: expedited_promptness_days
    kind: parameter
    dtype: Integer
    source: Vermont 3SquaresVT Manual, 1600 Income, block-112, expedited verification sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-112
              excerpt: seven-day standard of promptness
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          7
  - name: income_self_declaration_allowed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-112, self-declaration exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-112
              excerpt: Allow 3SquaresVT in a SNAP households to self-declare income, unless questionable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_is_3squaresvt_in_a_snap
          and not income_is_questionable
  - name: income_verification_postponed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-112, expedited verification sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-112
              excerpt: Postpone verification for expedited service month(s), unless verification can be provided in time to meet the seven-day standard of promptness.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          expedited_service_month
          and not verification_can_meet_promptness_standard
  - name: gross_countable_income_verification_required_before_approval
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1600 Income, block-112, initial verification requirement and exceptions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-112
              excerpt: Before initial approval, verify all gross countable income.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-112
              excerpt: Allow 3SquaresVT in a SNAP households to self-declare income, unless questionable.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-112
              excerpt: Postpone verification for expedited service month(s), unless verification can be provided in time to meet the seven-day standard of promptness.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          before_initial_approval
          and not income_self_declaration_allowed
          and not income_verification_postponed
