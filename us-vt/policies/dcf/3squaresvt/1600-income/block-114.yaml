format: rulespec/v1
module:
  summary: |-
    Benefit increase : Verify changes in gross countable income.

    Benefit decrease : Verify changes at recertification.

    Exception : Allow 3SquaresVT in a SNAP households to self-declare income, unless questionable.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-114
    source_sha256: cb61a2ec95155cf0a52f2515e0b527ab944c8eece7609762ff01d06c4f325f25
  proof_validation:
    required: true
  interpretations:
    - id: self-declaration-and-verification
      status: open
      question: Does the self-declaration exception displace either verification requirement?
      texts:
        - corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-114
          excerpt: "Exception : Allow 3SquaresVT in a SNAP households to self-declare income, unless questionable."
      reading: >-
        Encode permission to self-declare separately from the verification
        requirements. The exception does not expressly identify which verification
        requirement it displaces or establish that self-declaration removes the
        requirement to verify changes at recertification.
      alternatives:
        - id: displaces-both-requirements
          reading: >-
            Permission to self-declare removes both verification requirements
            when the income is not questionable.
        - id: displaces-increase-requirement
          reading: >-
            Permission to self-declare removes only the verification requirement
            for a benefit increase when the income is not questionable.
      basis: >-
        The source expressly permits self-declaration but leaves its relationship
        to the separately stated verification requirements unspecified.
      affects:
        - gross_countable_income_change_verification_required
        - benefit_decrease_change_verification_required
        - income_self_declaration_allowed
inputs:
  - name: benefit_increases
    entity: Household
    dtype: Boolean
    period: Month
  - name: gross_countable_income_changes
    entity: Household
    dtype: Boolean
    period: Month
  - name: benefit_decreases
    entity: Household
    dtype: Boolean
    period: Month
  - name: at_recertification
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_is_3squaresvt_in_a_snap
    entity: Household
    dtype: Boolean
    period: Month
  - name: income_is_questionable
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: gross_countable_income_change_verification_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: "Benefit increase : Verify changes in gross countable income."
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-114
              excerpt: "Benefit increase : Verify changes in gross countable income."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          benefit_increases and gross_countable_income_changes
  - name: benefit_decrease_change_verification_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: "Benefit decrease : Verify changes at recertification."
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-114
              excerpt: "Benefit decrease : Verify changes at recertification."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          benefit_decreases and at_recertification
  - name: income_self_declaration_allowed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: "Exception : Allow 3SquaresVT in a SNAP households to self-declare income, unless questionable."
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1600-income/block-114
              excerpt: "Allow 3SquaresVT in a SNAP households to self-declare income, unless questionable."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_is_3squaresvt_in_a_snap
          and not income_is_questionable
