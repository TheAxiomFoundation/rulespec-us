format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-5
    source_sha256: 7ec607d6e4b86020adddefcc7dfa79e701bfb681834ad2d595c3ea61c656701b
  summary: |-
    The household does not have to report their income changes again until the interim report or the next recertification, whichever comes first.
    Note : Households with income over 130% FPL at application, who are found eligible do not have a reporting requirement until Interim Report .
inputs:
  - name: reported_gross_income_fpl_ratio
    entity: Household
    dtype: Decimal
    period: Month
  - name: income_threshold_crossing_reported
    entity: Household
    dtype: Boolean
    period: Month
  - name: remains_eligible_after_benefits_adjusted
    entity: Household
    dtype: Boolean
    period: Month
  - name: interim_report_reached
    entity: Household
    dtype: Boolean
    period: Month
  - name: next_recertification_reached
    entity: Household
    dtype: Boolean
    period: Month
  - name: application_gross_income_fpl_ratio
    entity: Household
    dtype: Decimal
    period: Month
  - name: found_eligible_at_application
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: gross_income_reporting_threshold
    kind: parameter
    dtype: Rate
    source: Vermont 3SquaresVT Manual 2200, block-5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-5
              excerpt: "gross household income goes over 130% FPL"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1.30
  - name: gross_income_reporting_requirement_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2200, block-5, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-5
              excerpt: "Households that report when their gross household income goes over 130% FPL , and who remain eligible for 3SVT benefits after benefits are adjusted, have met their 130% gross income reporting requirement."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          reported_gross_income_fpl_ratio > gross_income_reporting_threshold
          and income_threshold_crossing_reported
          and remains_eligible_after_benefits_adjusted
  - name: further_income_change_reporting_exemption
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2200, block-5, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-5
              excerpt: "The household does not have to report their income changes again until the interim report or the next recertification, whichever comes first."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          gross_income_reporting_requirement_met
          and not interim_report_reached
          and not next_recertification_reached
  - name: application_reporting_exemption
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 2200, block-5, Note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-5
              excerpt: "Households with income over 130% FPL at application, who are found eligible do not have a reporting requirement until Interim Report ."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          application_gross_income_fpl_ratio > gross_income_reporting_threshold
          and found_eligible_at_application
          and not interim_report_reached
