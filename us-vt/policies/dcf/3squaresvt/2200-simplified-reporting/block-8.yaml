format: rulespec/v1
module:
  summary: 'Households must report: When Residency changes. When Shelter Expenses
    change. When Household Composition changes.

    When Unearned Income changes by more than $100.

    Note : Categorically eligible households do not need to report resources.

    When a time limited customers work hours are less than 80 hours per month (20
    hours per week averaged monthly).'
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
    source_sha256: 99881d37daf6ae33828c86ab9122f2deff0a2b7240a07ab634a4aeffd0a81020
  proof_validation:
    required: true
inputs:
- name: change_category
  entity: Household
  dtype: String
  period: Month
- name: employment_change_results_in_income_change
  entity: Household
  dtype: Boolean
  period: Month
- name: earned_income_change_due_to_employment_change
  entity: Household
  dtype: Boolean
  period: Month
- name: earned_income_change_meets_reduced_reporting_requirements
  entity: Household
  dtype: Boolean
  period: Month
- name: unearned_income_change_magnitude
  entity: Household
  dtype: Money
  unit: USD
  period: Month
- name: categorically_eligible
  entity: Household
  dtype: Boolean
  period: Month
- name: time_limited_customer
  entity: Person
  dtype: Boolean
  period: Month
- name: monthly_work_hours
  entity: Person
  dtype: Decimal
  period: Month
- name: weekly_work_hours_averaged_monthly
  entity: Person
  dtype: Decimal
  period: Month
rules:
- name: unearned_income_change_reporting_threshold
  kind: parameter
  dtype: Money
  unit: USD
  period: Month
  source: '2200 Simplified Reporting: When Unearned Income changes by more than $100.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When Unearned Income changes by more than $100.
  versions:
  - effective_from: '2026-08-01'
    formula: "100"
- name: monthly_work_hours_reporting_threshold
  kind: parameter
  dtype: Decimal
  period: Month
  source: '2200 Simplified Reporting: less than 80 hours per month'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: less than 80 hours per month
  versions:
  - effective_from: '2026-08-01'
    formula: "80"
- name: averaged_weekly_work_hours_reporting_threshold
  kind: parameter
  dtype: Decimal
  period: Month
  source: '2200 Simplified Reporting: 20 hours per week averaged monthly'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When a time limited customers work hours are less than 80 hours
            per month (20 hours per week averaged monthly).
  versions:
  - effective_from: '2026-08-01'
    formula: "20"
- name: change_must_be_reported
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: '2200 Simplified Reporting: Households must report; residency, shelter,
    composition, employment, earned income, unearned income, resources, and vehicles
    clauses and notes.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When Residency changes. When Shelter Expenses change. When Household
            Composition changes.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When there is a change in employment that results in a change in
            income.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: A change in earned income does not need to be reported unless due
            to a change in employment or the income change meets the reduced reporting
            requirements
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When Unearned Income changes by more than $100.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When Resources or Vehicles change.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: Categorically eligible households do not need to report resources.
  versions:
  - effective_from: '2026-08-01'
    formula: "change_category == \"Residency\"\nor change_category == \"Shelter Expenses\"\
      \nor change_category == \"Household Composition\"\nor change_category == \"\
      Vehicles\"\nor (change_category == \"Employment\" and employment_change_results_in_income_change)\n\
      or (change_category == \"Earned Income\" and (earned_income_change_due_to_employment_change\
      \ or earned_income_change_meets_reduced_reporting_requirements))\nor (change_category\
      \ == \"Unearned Income\" and unearned_income_change_magnitude > unearned_income_change_reporting_threshold)\n\
      or (change_category == \"Resources\"\n    and not categorically_eligible)"
- name: low_monthly_work_hours_must_be_reported
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: '2200 Simplified Reporting: When a time limited customers work hours are
    less than 80 hours per month'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When a time limited customers work hours are less than 80 hours
            per month
  versions:
  - effective_from: '2026-08-01'
    formula: time_limited_customer and monthly_work_hours < monthly_work_hours_reporting_threshold
- name: low_averaged_weekly_work_hours_must_be_reported
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: '2200 Simplified Reporting: When a time limited customers work hours are
    less than 80 hours per month (20 hours per week averaged monthly).'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2200-simplified-reporting/block-8
          excerpt: When a time limited customers work hours are less than 80 hours
            per month (20 hours per week averaged monthly).
  versions:
  - effective_from: '2026-08-01'
    formula: time_limited_customer and weekly_work_hours_averaged_monthly < averaged_weekly_work_hours_reporting_threshold
