format: rulespec/v1
module:
  summary: |-
    Household Type Resource Limit Senior/Disabled Households with Gross Income Over 185% $4,500 Senior/Disabled Households with Gross Income Over 185% if the Only Senior/Disabled Member is Disqualified $3,000 All Other Households N/A
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
    source_sha256: 8ab7d08a72a4b97106f624605a9a4bab8ad7b09e643f7d32fc6a6143868f9954
  proof_validation:
    required: true
inputs:
  - name: household_is_senior_or_disabled
    entity: Household
    dtype: Boolean
    period: Month
  - name: gross_income_ratio
    entity: Household
    dtype: Rate
    period: Month
  - name: only_senior_or_disabled_member_is_disqualified
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: resource_limit_gross_income_threshold
    kind: parameter
    dtype: Rate
    source: 3100 Tables, resource limit table, gross income threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: Gross Income Over 185%
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1.85
  - name: senior_or_disabled_resource_limit
    kind: parameter
    dtype: Money
    unit: USD
    source: 3100 Tables, senior/disabled household resource limit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: Senior/Disabled Households with Gross Income Over 185% $4,500
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          4500
  - name: disqualified_only_senior_or_disabled_member_resource_limit
    kind: parameter
    dtype: Money
    unit: USD
    source: 3100 Tables, only senior/disabled member disqualified row
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: Senior/Disabled Households with Gross Income Over 185% if the Only Senior/Disabled Member is Disqualified $3,000
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          3000
  - name: resource_limit_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 3100 Tables, resource limit table, household types and All Other Households
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: Senior/Disabled Households with Gross Income Over 185%
          - path: versions[0].formula
            kind: default
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: All Other Households N/A
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_is_senior_or_disabled
          and gross_income_ratio > resource_limit_gross_income_threshold
  - name: applicable_resource_limit
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 3100 Tables, resource limit table
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: Senior/Disabled Households with Gross Income Over 185% $4,500
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: if the Only Senior/Disabled Member is Disqualified $3,000
          - path: versions[0].formula
            kind: default
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/3100-tables/block-15
              excerpt: All Other Households N/A
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if resource_limit_applies:
            if only_senior_or_disabled_member_is_disqualified:
              disqualified_only_senior_or_disabled_member_resource_limit
            else:
              senior_or_disabled_resource_limit
          else: 0
