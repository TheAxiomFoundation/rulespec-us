format: rulespec/v1
module:
  summary: |-
    The average weekly amount is multiplied by 4.3. The average bi-weekly amount is multiplied by 2.15. Expenses billed twice a month are multiplied by 2.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-25
    source_sha256: db062dd6c3c3bda2a0cd12eea9c5371f82fe901746d6cc0f5a814979db588e80
  proof_validation:
    required: true
inputs:
  - name: average_weekly_expense_paid
    entity: Expense
    dtype: Decimal
    period: Month
  - name: average_biweekly_expense_paid
    entity: Expense
    dtype: Decimal
    period: Month
  - name: expense_billed_twice_monthly
    entity: Expense
    dtype: Decimal
    period: Month
rules:
  - name: weekly_expense_monthly_conversion_factor
    kind: parameter
    dtype: Decimal
    source: Vermont 3SquaresVT Manual, block-25, weekly conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-25
              excerpt: The average weekly amount is multiplied by 4.3.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          4.3
  - name: biweekly_expense_monthly_conversion_factor
    kind: parameter
    dtype: Decimal
    source: Vermont 3SquaresVT Manual, block-25, bi-weekly conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-25
              excerpt: The average bi-weekly amount is multiplied by 2.15.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          2.15
  - name: twice_monthly_expense_conversion_factor
    kind: parameter
    dtype: Decimal
    source: Vermont 3SquaresVT Manual, block-25, twice-monthly conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-25
              excerpt: Expenses billed twice a month are multiplied by 2.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          2
  - name: monthly_expense_from_weekly_payments
    kind: derived
    entity: Expense
    dtype: Decimal
    period: Month
    source: Vermont 3SquaresVT Manual, block-25, weekly conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-25
              excerpt: The average weekly amount is multiplied by 4.3.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          average_weekly_expense_paid * weekly_expense_monthly_conversion_factor
  - name: monthly_expense_from_biweekly_payments
    kind: derived
    entity: Expense
    dtype: Decimal
    period: Month
    source: Vermont 3SquaresVT Manual, block-25, bi-weekly conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-25
              excerpt: The average bi-weekly amount is multiplied by 2.15.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          average_biweekly_expense_paid * biweekly_expense_monthly_conversion_factor
  - name: monthly_expense_from_twice_monthly_bills
    kind: derived
    entity: Expense
    dtype: Decimal
    period: Month
    source: Vermont 3SquaresVT Manual, block-25, twice-monthly conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-25
              excerpt: Expenses billed twice a month are multiplied by 2.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          expense_billed_twice_monthly * twice_monthly_expense_conversion_factor
