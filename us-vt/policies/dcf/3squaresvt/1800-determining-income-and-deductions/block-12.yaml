format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-12
    source_sha256: 9866265ac38b587130da65697f357139dd11b927c22fa4626e9ad6ea1b3bbc72
  summary: |-
    Income paid weekly or Bi-Weekly must be converted to a monthly amount.
    The average weekly amount is multiplied by 4.3.
    The average bi-weekly amount is multiplied by 2.15.
    Income received twice a month is multiplied by 2.
inputs:
  - name: average_weekly_income
    entity: Person
    dtype: Money
    period: Month
    unit: USD
  - name: average_biweekly_income
    entity: Person
    dtype: Money
    period: Month
    unit: USD
  - name: twice_monthly_income_per_payment
    entity: Person
    dtype: Money
    period: Month
    unit: USD
rules:
  - name: weekly_monthly_conversion_factor
    kind: parameter
    dtype: Decimal
    source: Vermont 3SquaresVT Manual 1800, block 12, weekly conversion.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-12
              excerpt: The average weekly amount is multiplied by 4.3.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          4.3
  - name: biweekly_monthly_conversion_factor
    kind: parameter
    dtype: Decimal
    source: Vermont 3SquaresVT Manual 1800, block 12, bi-weekly conversion.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-12
              excerpt: The average bi-weekly amount is multiplied by 2.15.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          2.15
  - name: twice_monthly_conversion_factor
    kind: parameter
    dtype: Decimal
    source: Vermont 3SquaresVT Manual 1800, block 12, twice-monthly conversion.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-12
              excerpt: Income received twice a month is multiplied by 2.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          2
  - name: monthly_income_from_weekly_pay
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    source: Vermont 3SquaresVT Manual 1800, block 12, weekly income converted to a monthly amount.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-12
              excerpt: The average weekly amount is multiplied by 4.3.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          average_weekly_income * weekly_monthly_conversion_factor
  - name: monthly_income_from_biweekly_pay
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    source: Vermont 3SquaresVT Manual 1800, block 12, bi-weekly income converted to a monthly amount.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-12
              excerpt: The average bi-weekly amount is multiplied by 2.15.
    versions:
