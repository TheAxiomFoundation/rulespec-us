  - name: monthly_income_from_twice_monthly_pay
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    source: Vermont 3SquaresVT Manual 1800, block 12, income received twice a month.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-12
              excerpt: Income received twice a month is multiplied by 2.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          twice_monthly_income_per_payment * twice_monthly_conversion_factor
