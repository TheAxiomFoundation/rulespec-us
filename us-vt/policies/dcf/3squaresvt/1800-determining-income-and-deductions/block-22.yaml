format: rulespec/v1
module:
  summary: |-
    Do not allow expenses paid by someone outside of the household.
    Exception : Utility expenses are allowed if paid by the $21 Seasonal Fuel Assistance .
    Do not allow an expense if the service is provided by someone residing in the household.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-22
    source_sha256: 27bdd3272137c471dd460ac05314de9c0c8a2986f770a226bfa579e7003b3d49
  proof_validation:
    required: true
inputs:
  - name: expense_paid_by_someone_outside_household
    entity: Expense
    dtype: Boolean
    period: Month
  - name: expense_is_utility
    entity: Expense
    dtype: Boolean
    period: Month
  - name: expense_paid_by_seasonal_fuel_assistance
    entity: Expense
    dtype: Boolean
    period: Month
  - name: service_provider_resides_in_household
    entity: Expense
    dtype: Boolean
    period: Month
rules:
  - name: seasonal_fuel_assistance_amount
    kind: parameter
    dtype: Money
    unit: USD
    source: Vermont 3SquaresVT Manual 1800, block-22, utility exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-22
              excerpt: "$21 Seasonal Fuel Assistance"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          21
  - name: expense_disallowed
    kind: derived
    entity: Expense
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1800, block-22, both expense prohibitions and utility exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-22
              excerpt: "Do not allow expenses paid by someone outside of the household."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-22
              excerpt: "Utility expenses are allowed if paid by the $21 Seasonal Fuel Assistance"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1800-determining-income-and-deductions/block-22
              excerpt: "Do not allow an expense if the service is provided by someone residing in the household."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          service_provider_resides_in_household
          or (
            expense_paid_by_someone_outside_household
            and not (expense_is_utility and expense_paid_by_seasonal_fuel_assistance)
          )
