format: rulespec/v1
module:
  summary: |-
    SCE or ECE simplified reporting households are not required to report any income changes when: the household reported income over the 130% gross income limit , and remained eligible.
    The household has fulfilled their income reporting requirement until completing the interim report or recertification , whichever comes first.
    SCE or ECE households are not required to report changes in resources .
    See Reduced Reporting Requirements for further reporting requirements.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-14
    source_sha256: 66ebe32b17f32b44323d6465dbc1f450d064e55f7d2d4801b95078854bcc2c64
  proof_validation:
    required: true
inputs:
  - name: household_is_sce
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_is_ece
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_uses_simplified_reporting
    entity: Household
    dtype: Boolean
    period: Month
  - name: reported_income_ratio_to_gross_limit_base
    entity: Household
    dtype: Decimal
    period: Month
  - name: household_remained_eligible
    entity: Household
    dtype: Boolean
    period: Month
  - name: interim_report_completed_since_income_report
    entity: Household
    dtype: Boolean
    period: Month
  - name: recertification_completed_since_income_report
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: gross_income_limit_ratio
    kind: parameter
    dtype: Rate
    source: Vermont 3SquaresVT Manual 1400, block-14, income reporting threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-14
              excerpt: "130% gross income limit"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1.30
  - name: income_change_reporting_exemption
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1400, block-14, income exemption and its duration
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-14
              excerpt: "SCE or ECE simplified reporting households are not required to report any income changes"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-14
              excerpt: "the household reported income over the 130% gross income limit , and remained eligible."
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-14
              excerpt: "until completing the interim report or recertification , whichever comes first."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (household_is_sce or household_is_ece)
          and household_uses_simplified_reporting
          and reported_income_ratio_to_gross_limit_base > gross_income_limit_ratio
          and household_remained_eligible
          and not interim_report_completed_since_income_report
          and not recertification_completed_since_income_report
  - name: resource_change_reporting_exemption
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1400, block-14, resource reporting; further requirements cross-reference
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-14
              excerpt: "SCE or ECE households are not required to report changes in resources ."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_is_sce or household_is_ece
