format: rulespec/v1
module:
  summary: |-
    Verification is waived for the following eligibility factors for SCE households: SSN Residency Sponsored non-citizen information

    Verify the following factors: Each member of a potential SCE household receives one of the qualifying programs , Household’s countable gross income does not exceed 185% for ECE households. Eligibility factors not waived for SCE or ECE, if required.

    Note : SCE and ECE households applying for or receiving other benefit programs in addition to 3SVT must follow those programs’ information and verification requirements.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
    source_sha256: 49e6eff63eaa3539a7bea660d660bb73cc42ec2a6bdf3c4af8f5af78690e7f02
  proof_validation:
    required: true
inputs:
  - name: household_is_sce
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_is_ece
    entity: Household
    dtype: Boolean
    period: Month
  - name: eligibility_factor
    entity: Household
    dtype: String
    period: Month
  - name: household_is_potential_sce
    entity: Household
    dtype: Boolean
    period: Month
  - name: each_member_qualifying_program_receipt_verified
    entity: Household
    dtype: Boolean
    period: Month
  - name: countable_gross_income_ratio
    entity: Household
    dtype: Decimal
    period: Month
  - name: gross_income_limit_verified
    entity: Household
    dtype: Boolean
    period: Month
  - name: eligibility_factor_not_waived
    entity: Household
    dtype: Boolean
    period: Month
  - name: eligibility_factor_required
    entity: Household
    dtype: Boolean
    period: Month
  - name: eligibility_factor_verified
    entity: Household
    dtype: Boolean
    period: Month
  - name: applying_for_or_receiving_other_benefit_programs
    entity: Household
    dtype: Boolean
    period: Month
  - name: other_program_information_requirements_followed
    entity: Household
    dtype: Boolean
    period: Month
  - name: other_program_verification_requirements_followed
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: sce_factor_verification_waived
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1400, verification-waiver paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
              excerpt: "Verification is waived for the following eligibility factors for SCE households: SSN Residency Sponsored non-citizen information"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          household_is_sce
          and (eligibility_factor == "SSN"
          or eligibility_factor == "Residency"
          or eligibility_factor == "Sponsored non-citizen information")
  - name: sce_program_receipt_verification_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1400, qualifying-program verification
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
              excerpt: "Each member of a potential SCE household receives one of the qualifying programs"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not household_is_potential_sce
          or each_member_qualifying_program_receipt_verified
  - name: ece_gross_income_limit
    kind: parameter
    dtype: Rate
    source: Vermont 3SquaresVT Manual 1400, ECE gross-income verification
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
              excerpt: "Household’s countable gross income does not exceed 185% for ECE households."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          1.85
  - name: ece_gross_income_verification_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1400, ECE gross-income verification
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
              excerpt: "Verify the following factors:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
              excerpt: "Household’s countable gross income does not exceed 185% for ECE households."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not household_is_ece
          or (countable_gross_income_ratio <= ece_gross_income_limit
          and gross_income_limit_verified)
  - name: remaining_factor_verification_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1400, remaining eligibility factors
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
              excerpt: "Eligibility factors not waived for SCE or ECE, if required."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not ((household_is_sce or household_is_ece)
          and eligibility_factor_not_waived
          and eligibility_factor_required)
          or eligibility_factor_verified
  - name: other_program_requirements_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual 1400, other-benefit-program note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-10
              excerpt: "SCE and ECE households applying for or receiving other benefit programs in addition to 3SVT must follow those programs’ information and verification requirements."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          not ((household_is_sce or household_is_ece)
          and applying_for_or_receiving_other_benefit_programs)
          or (other_program_information_requirements_followed
          and other_program_verification_requirements_followed)
