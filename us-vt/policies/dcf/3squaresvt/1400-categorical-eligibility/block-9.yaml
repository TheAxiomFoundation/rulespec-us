    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1400-categorical-eligibility/block-9
    source_sha256: 447b1abe87502c32afe5d3a288053b28fd25a24ce58f83b7abae9e47c59c0513
  proof_validation:
    required: true
