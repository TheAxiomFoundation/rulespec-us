format: rulespec/v1
module:
  summary: |-
    Ineligible resource transfers occur at application if the: resources are transferred within the three-month period before the date of applying for 3SVT, and the transfer was done solely to qualify for 3SVT, or during the current certification period if done solely to remain eligible for 3SVT.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-60
    source_sha256: 915d11034edb13803caa7ee83e6382b8888e186627f2eb1c6a368db8268ae901
  proof_validation:
    required: true
inputs:
  - name: transferred_within_three_months_before_application
    entity: Asset
    dtype: Boolean
    period: Month
  - name: transfer_done_solely_to_qualify
    entity: Asset
    dtype: Boolean
    period: Month
  - name: transferred_during_current_certification_period
    entity: Asset
    dtype: Boolean
    period: Month
  - name: transfer_done_solely_to_remain_eligible
    entity: Asset
    dtype: Boolean
    period: Month
rules:
  - name: ineligible_resource_transfer
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1500 Resources, block-60
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-60
              excerpt: "resources are transferred within the three-month period before the date of applying for 3SVT, and the transfer was done solely to qualify for 3SVT"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-60
              excerpt: "or during the current certification period if done solely to remain eligible for 3SVT."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (transferred_within_three_months_before_application and transfer_done_solely_to_qualify)
          or (transferred_during_current_certification_period and transfer_done_solely_to_remain_eligible)
