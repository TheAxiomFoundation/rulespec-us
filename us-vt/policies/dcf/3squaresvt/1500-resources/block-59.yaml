format: rulespec/v1
module:
  summary: |-
    Allowable resource transfers are those that: Are made by categorically eligible households.
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-59
    source_sha256: 8e08a582ed82af5c97fdddb12d3fdc39d46a26fd2f7f00775526951ff585b185
  proof_validation:
    required: true
inputs:
  - name: transferring_household_is_categorically_eligible
    entity: ResourceTransfer
    dtype: Boolean
    period: Month
  - name: transfer_would_not_affect_eligibility
    entity: ResourceTransfer
    dtype: Boolean
    period: Month
  - name: resource_is_sold_or_traded_at_or_near_fair_market_value
    entity: ResourceTransfer
    dtype: Boolean
    period: Month
  - name: transfer_is_between_household_members_including_ineligible_and_disqualified_people
    entity: ResourceTransfer
    dtype: Boolean
    period: Month
  - name: transfer_is_for_reasons_other_than_qualifying_or_attempting_to_qualify_for_3svt
    entity: ResourceTransfer
    dtype: Boolean
    period: Month
rules:
  - name: resource_transfer_is_allowable
    kind: derived
    entity: ResourceTransfer
    dtype: Judgment
    period: Month
    source: Vermont 3SquaresVT Manual, 1500 Resources, allowable resource transfers
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-59
              excerpt: "Allowable resource transfers are those that: Are made by categorically eligible households."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-59
              excerpt: "Would not affect eligibility, such as excluded personal property."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-59
              excerpt: "Are sold or traded at or near Fair Market Value ."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-59
              excerpt: "Are transferred between members of the household, including ineligible and disqualified people."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-vt/manual/dcf/3squaresvt/1500-resources/block-59
              excerpt: "Are transferred for reasons other than to qualify or attempt to qualify for 3SVT, such as putting money in a student income account."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          transferring_household_is_categorically_eligible
          or transfer_would_not_affect_eligibility
          or resource_is_sold_or_traded_at_or_near_fair_market_value
          or transfer_is_between_household_members_including_ineligible_and_disqualified_people
          or transfer_is_for_reasons_other_than_qualifying_or_attempting_to_qualify_for_3svt
