format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-vt/manual/dcf/3squaresvt/2000-self-employment/block-5
    source_sha256: 3d9bbf297e2bfecb6107bd1a6a96a287e6d38fc1641a2203ea1a92acabc71a24
  summary: 'Add all self-employment and Capital Gain Income , subtract allowable self-employment
    expenses . This is net self-employment income.

    Verbal self-declaration may be used in the income determination. CATN the customer''s
    statement.'
inputs:
- name: self_employment_income
  entity: Person
  dtype: Money
  unit: USD
  period: Month
- name: capital_gain_income
  entity: Person
  dtype: Money
  unit: USD
  period: Month
- name: allowable_self_employment_expenses
  entity: Person
  dtype: Money
  unit: USD
  period: Month
- name: income_is_annualized
  entity: Person
  dtype: Boolean
  period: Month
- name: months_income_is_intended_to_cover
  entity: Person
  dtype: Decimal
  period: Month
rules:
- name: annualization_months
  kind: parameter
  dtype: Count
  source: Vermont 3SquaresVT Manual, 2000 Self Employment, block-5, paragraph 1.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2000-self-employment/block-5
          excerpt: dividing by 12 months for annualized income
  versions:
  - effective_from: '2026-08-01'
    formula: "12"
- name: net_self_employment_income
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: "Vermont 3SquaresVT Manual, 2000 Self Employment, block-5, paragraphs 1\u2013\
    3: net income determination; optional ESD 204 B, ESD204F, and ESD 204R fact sheets;\
    \ verbal self-declaration permitted, with the customer's statement recorded in\
    \ CATN."
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2000-self-employment/block-5
          excerpt: Add all self-employment and Capital Gain Income , subtract allowable
            self-employment expenses .
  versions:
  - effective_from: '2026-08-01'
    formula: self_employment_income + capital_gain_income - allowable_self_employment_expenses
- name: monthly_net_self_employment_income
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: Vermont 3SquaresVT Manual, 2000 Self Employment, block-5, paragraph 1.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-vt/manual/dcf/3squaresvt/2000-self-employment/block-5
          excerpt: Determine the monthly net by dividing by 12 months for annualized
            income or dividing by the number of months the income is intended to cover.
  versions:
  - effective_from: '2026-08-01'
    formula: 'if income_is_annualized: net_self_employment_income / annualization_months
      else: net_self_employment_income / months_income_is_intended_to_cover'
