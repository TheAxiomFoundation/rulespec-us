format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/12/1005/6
    source_sha256: f07a6d198d703a89205fa4b60a8fa0f337535de35b30a5054c5cd662f7b5ce0a
  summary: A consumer may be held liable only if the required disclosures have been
    provided and, for a transfer involving an access device, the device is accepted
    and a means of identifying its consumer has been provided. Liability is limited
    by notice timing, periodic-statement reporting, and any state law or agreement
    imposing less liability.
