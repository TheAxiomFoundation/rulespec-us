rules:
- name: timely_notice_liability
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: 12 CFR 1005.6(b)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: If the consumer notifies the financial institution within two business
            days
  versions:
  - effective_from: '0001-01-01'
    formula: "if consumer_notified_institution_within_two_business_days_after_learning_of_loss_or_theft:\n\
      \  min(timely_notice_liability_cap, unauthorized_transfers_before_notice)\n\
      else: 0"
- name: untimely_notice_liability
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: 12 CFR 1005.6(b)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: If the consumer fails to notify the financial institution within
            two business days
  versions:
  - effective_from: '0001-01-01'
    formula: "if consumer_notified_institution_within_two_business_days_after_learning_of_loss_or_theft:\n\
      \  0\nelse: min(untimely_notice_total_cap, untimely_notice_initial_liability\
      \ + untimely_notice_later_liability)"
- name: applicable_two_day_notice_period_met
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(b)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: due to extenuating circumstances, the institution shall extend
            the times specified above
  versions:
  - effective_from: '0001-01-01'
    formula: "consumer_notified_institution_within_two_business_days_after_learning_of_loss_or_theft\n\
      or (delay_due_to_extenuating_circumstances\n    and consumer_notified_within_reasonably_extended_two_day_period)"
- name: liability_under_paragraph_b
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: 12 CFR 1005.6(b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: A consumer's liability for an unauthorized electronic fund transfer
            or a series of related unauthorized transfers shall be determined as follows
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: When an access device is involved in the unauthorized transfer
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: If state law or an agreement between the consumer and the financial
            institution imposes less liability
  versions:
  - effective_from: '0001-01-01'
    formula: "if consumer_may_be_held_liable:\n  (if state_law_or_agreement_imposes_less_liability:\n\
      \    min(\n      (if unauthorized_transfer_involved_access_device:\n       \
      \ (if applicable_two_day_notice_period_met:\n          min(timely_notice_liability_cap,\
      \ unauthorized_transfers_before_notice)\n        else:\n          min(untimely_notice_total_cap,\
      \ untimely_notice_initial_liability + untimely_notice_later_liability))\n  \
      \    else: 0)\n      + (if applicable_statement_notice_period_met: 0 else: periodic_statement_subsequent_liability),\n\
      \      state_law_or_agreement_liability_amount)\n  else:\n    (if unauthorized_transfer_involved_access_device:\n\
      \      (if applicable_two_day_notice_period_met:\n        min(timely_notice_liability_cap,\
      \ unauthorized_transfers_before_notice)\n      else:\n        min(untimely_notice_total_cap,\
      \ untimely_notice_initial_liability + untimely_notice_later_liability))\n  \
      \  else: 0)\n    + (if applicable_statement_notice_period_met: 0 else: periodic_statement_subsequent_liability))\n\
      else: 0"
- name: consumer_may_be_held_liable
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: If the unauthorized transfer involved an access device, it must
            be an accepted access device
  versions:
  - effective_from: '0001-01-01'
    formula: "required_disclosures_provided\nand (\n  not unauthorized_transfer_involved_access_device\n\
      \  or (\n    access_device_is_accepted\n    and financial_institution_provided_consumer_identification_means\n\
      \  )\n)"
- name: untimely_notice_later_liability
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: 12 CFR 1005.6(b)(2)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: provided the institution establishes that these transfers would
            not have occurred
  versions:
  - effective_from: '0001-01-01'
    formula: "if institution_establishes_later_transfers_would_not_have_occurred_with_timely_notice:\n\
      \  unauthorized_transfers_after_two_business_days_before_notice\nelse: 0"
- name: periodic_statement_subsequent_liability
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Month
  source: 12 CFR 1005.6(b)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: unauthorized transfers that occur after the close of the 60 days
            and before notice
  versions:
  - effective_from: '0001-01-01'
    formula: "if unauthorized_transfer_appeared_on_periodic_statement\n   and not\
      \ consumer_reported_statement_transfer_within_applicable_sixty_day_period\n\
      \   and institution_establishes_subsequent_transfers_would_not_have_occurred_with_timely_statement_notice:\n\
      \  unauthorized_transfers_after_sixty_days_before_notice\nelse: 0"
- name: applicable_statement_notice_period_met
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(b)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: the institution shall extend the times specified above to a reasonable
            period
  versions:
  - effective_from: '0001-01-01'
    formula: "consumer_reported_statement_transfer_within_applicable_sixty_day_period\n\
      or (\n  delay_due_to_extenuating_circumstances\n  and consumer_reported_within_reasonably_extended_sixty_day_period\n\
      )"
- name: written_notice_given_by_transmission
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(b)(5)(iii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: at the time the consumer mails the notice or delivers it for transmission
  versions:
  - effective_from: '0001-01-01'
    formula: written_notice_mailed_or_delivered_for_usual_transmission
- name: constructive_notice
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(b)(5)(iii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: institution becomes aware of circumstances leading to the reasonable
            belief
  versions:
  - effective_from: '0001-01-01'
    formula: institution_aware_of_circumstances_supporting_reasonable_belief_of_unauthorized_transfer
- name: notice_given_to_financial_institution
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(b)(5)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: Notice to a financial institution is given when a consumer takes
            steps reasonably necessary
  versions:
  - effective_from: '0001-01-01'
    formula: 'timely_notice_steps_reasonably_necessary

      or written_notice_given_by_transmission

      or constructive_notice'
- name: timely_notice_days
  kind: parameter
  dtype: Integer
  source: 12 CFR 1005.6(b)(1)-(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: within two business days
  versions:
  - effective_from: '0001-01-01'
    formula: "2"
- name: timely_notice_liability_cap
  kind: parameter
  dtype: Money
  unit: USD
  source: 12 CFR 1005.6(b)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: lesser of $50
  versions:
  - effective_from: '0001-01-01'
    formula: "50"
- name: untimely_notice_initial_cap
  kind: parameter
  dtype: Money
  unit: USD
  source: 12 CFR 1005.6(b)(2)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: $50 or the amount of unauthorized transfers that occur within the
            two business days
  versions:
  - effective_from: '0001-01-01'
    formula: "50"
- name: untimely_notice_total_cap
  kind: parameter
  dtype: Money
  unit: USD
  source: 12 CFR 1005.6(b)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: lesser of $500
  versions:
  - effective_from: '0001-01-01'
    formula: "500"
- name: periodic_statement_notice_days
  kind: parameter
  dtype: Integer
  source: 12 CFR 1005.6(b)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: within 60 days
  versions:
  - effective_from: '0001-01-01'
    formula: "60"
- name: untimely_notice_initial_liability
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: USD
  source: 12 CFR 1005.6(b)(2)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: $50 or the amount of unauthorized transfers that occur within the
            two business days, whichever is less
  versions:
  - effective_from: '0001-01-01'
    formula: min(untimely_notice_initial_cap, unauthorized_transfers_within_two_business_days)
- name: timely_notice_steps_reasonably_necessary
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(b)(5)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: takes steps reasonably necessary to provide the institution with
            the pertinent information
  versions:
  - effective_from: '0001-01-01'
    formula: consumer_took_steps_reasonably_necessary_to_provide_pertinent_information
- name: notice_method_permitted
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.6(b)(5)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: in person, by telephone, or in writing
  versions:
  - effective_from: '0001-01-01'
    formula: 'consumer_notified_in_person

      or consumer_notified_by_telephone

      or consumer_notified_in_writing'
- name: state_law_or_agreement_liability
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: USD
  source: 12 CFR 1005.6(b)(6)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/12/1005/6
          excerpt: If state law or an agreement between the consumer and the financial
            institution imposes less liability than is provided by this section, the
            consumer's liability shall not exceed the amount imposed under the state
            law or agreement.
  versions:
  - effective_from: '0001-01-01'
    formula: 'if state_law_or_agreement_imposes_less_liability: min(liability_under_this_section,
      state_law_or_agreement_liability_amount) else: liability_under_this_section'
