format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/12/1005/11
    source_sha256: 451ab33f50a556d0e6748cb1402c6b57d1e468b65ed3b793c6c27f5d081683a7
  summary: “The term ‘error’ means” the listed transfers and inquiries. The section
    also prescribes notice, investigation, provisional-credit, reporting, correction,
    and reassertion procedures.
  deferred_outputs:
  - output: us:regulations/12-cfr/1005/11/c#investigation_deadlines_and_correction
    reason: us/regulation/12/1005/11(c) requires an event-indexed business-day calendar
      linking notice receipt, investigation completion, determination, credit posting,
      reporting, and correction; that linked deadline computation is not represented
      by this output.
  - output: us:regulations/12-cfr/1005/11/c/1#investigation_and_correction_deadlines
    reason: us/regulation/12/1005/11(c)(1) requires deadlines sequenced from notice
      receipt and investigation completion; the available runtime cannot represent
      those event-dependent business-day deadlines.
  - output: us:regulations/12-cfr/1005/11/c/2#extended_investigation_procedures
    reason: us/regulation/12/1005/11(c)(2) requires sequencing investigation, provisional
      credit, consumer notice, correction, and results reporting; the available runtime
      cannot represent those event-dependent deadlines.
  - output: us:regulations/12-cfr/1005/11/c/2/iv#investigation_results_report
    reason: us/regulation/12/1005/11(c)(2)(iv) requires sequencing investigation completion,
      results reporting, and any final-credit notice within three business days; the
      available runtime cannot represent that event-dependent deadline.
  - output: us:regulations/12-cfr/1005/11/c/3#extended_deadline_applicability
    reason: us/regulation/12/1005/11(c)(3) requires evaluating transfer initiation
      location, transaction type, first-deposit timing, and the applicable investigation
      route; the available runtime cannot represent these event-dependent timing conditions.
  - output: us:regulations/12-cfr/1005/11/c/4#record_review_sufficiency
    reason: us/regulation/12/1005/11(c)(4) makes record-review sufficiency depend
      on third-party transfer and agreement facts and excludes transfers covered by
      § 1005.14; that referenced provision is not supplied as executable context.
  - output: us:regulations/12-cfr/1005/11/d#no_error_or_different_error_procedures
    reason: us/regulation/12/1005/11(d) requires investigation-result notices, document
      provision upon request, and post-debit protections sequenced from provisional-credit
      events; the available runtime cannot represent those event-dependent procedures.
rules:
- name: error
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.11(a); 12 CFR 1005.11(a)(1); 12 CFR 1005.11(a)(1)(i); 12 CFR
    1005.11(a)(1)(ii); 12 CFR 1005.11(a)(1)(iii); 12 CFR 1005.11(a)(1)(iv); 12 CFR
    1005.11(a)(1)(v); 12 CFR 1005.11(a)(1)(vi); 12 CFR 1005.11(a)(1)(vii); 12 CFR
    1005.11(a)(2); 12 CFR 1005.11(a)(2)(i); 12 CFR 1005.11(a)(2)(ii); 12 CFR 1005.11(a)(2)(iii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/12/1005/11
          excerpt: The term “error” means
  versions:
  - effective_from: '0001-01-01'
    formula: '(unauthorized_electronic_fund_transfer

      or incorrect_electronic_fund_transfer

      or electronic_fund_transfer_omitted_from_periodic_statement

      or financial_institution_computational_or_bookkeeping_error

      or consumer_received_incorrect_terminal_amount

      or electronic_fund_transfer_not_identified_as_required

      or consumer_requested_documentation_or_clarification_about_electronic_fund_transfer)

      and not routine_account_balance_inquiry

      and not tax_or_recordkeeping_information_request

      and not duplicate_documentation_request'
- name: ordinary_notice_period_days
  kind: parameter
  dtype: Integer
  source: 12 CFR 1005.11(b)(1)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/regulation/12/1005/11
          excerpt: no later than 60 days after the institution sends the periodic
            statement
  versions:
  - effective_from: '0001-01-01'
    formula: "60"
- name: ordinary_notice_timely
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.11(b)(1)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/11
  versions:
  - effective_from: '0001-01-01'
    formula: days_after_first_reflecting_statement_or_passbook_at_notice_receipt <=
      ordinary_notice_period_days
- name: consumer_identifiable_from_notice
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.11(b)(1)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/11
  versions:
  - effective_from: '0001-01-01'
    formula: notice_enables_identification_of_consumer_name_and_account_number
- name: type_date_and_amount_required
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.11(b)(1)(iii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/12/1005/11
          excerpt: except for requests described in paragraph (a)(1)(vii)
  versions:
  - effective_from: '0001-01-01'
    formula: not request_described_in_paragraph_a_1_vii
- name: notice_content_satisfied
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.11(b)(1)(iii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/11
  versions:
  - effective_from: '0001-01-01'
    formula: 'notice_indicates_why_consumer_believes_error_exists

      and (notice_includes_type_date_and_amount_to_extent_possible or not type_date_and_amount_required)'
- name: notice_requirements_satisfied
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.11(b); 12 CFR 1005.11(b)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1005/11
          excerpt: any oral or written notice of error from the consumer that
  versions:
  - effective_from: '0001-01-01'
    formula: 'ordinary_notice_timely

      and consumer_identifiable_from_notice

      and notice_content_satisfied'
- name: written_confirmation_information_required
  kind: derived
  entity: FinancialInstitution
  dtype: Judgment
  period: Month
  source: 12 CFR 1005.11(b)(2)
  metadata:
    proof:
