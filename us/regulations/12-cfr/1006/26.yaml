format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/12/1006/26
    source_sha256: c2e2cd7e37acbf513cb211afe5fc230890a6c845d11ed0e0def4c9d57c62e431
  summary: “Statute of limitations” means the period prescribed by applicable law
    for bringing a legal action against the consumer to collect a debt. “Time-barred
    debt” means a debt for which the applicable statute of limitations has expired.
    A debt collector must not bring or threaten a legal action against a consumer
    to collect a time-barred debt; paragraph (b) does not apply to proofs of claim
    filed in connection with a bankruptcy proceeding.
rules:
- name: statute_of_limitations_expired
  kind: derived
  entity: DebtCollectionAction
