format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/12/1006/38
    source_sha256: 137736829f3dbd2d7071830e25acb7f4f899995d052927db6c9e2ce2b9367a0f
  summary: “During the validation period,” a debt collector must not engage in collection
    activities or communications that overshadow or are inconsistent with disclosure
    of dispute and original-creditor-information rights. Written, in-period requests
    and disputes require collection to cease until the specified response. Failure
    to dispute is not a legal admission.
rules:
- name: duplicative_dispute
  kind: derived
  entity: Business
  dtype: Judgment
  period: Day
  source: 12 CFR 1006.38(a); 12 CFR 1006.38(a)(1); 12 CFR 1006.38(a)(1)(i); 12 CFR
    1006.38(a)(1)(ii); 12 CFR 1006.38(a)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: 'Definitions. For purposes of this section, the following definitions
            apply:'
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Duplicative dispute means a dispute submitted by the consumer in
            writing within the validation period
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Is substantially the same as a dispute previously submitted by
            the consumer in writing within the validation period
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Does not include new and material information to support the dispute.
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Validation period has the same meaning given to it in § 1006.34(b)(5).
  versions:
  - effective_from: '0001-01-01'
    formula: 'dispute_is_in_writing

      and dispute_is_within_validation_period

      and dispute_is_substantially_the_same_as_earlier_written_in_period_dispute

      and earlier_dispute_requirements_of_paragraph_d_2_i_satisfied

      and not dispute_includes_new_and_material_supporting_information'
- name: collection_overshadows_disclosed_rights
  kind: derived
  entity: Business
  dtype: Judgment
  period: Day
  source: 12 CFR 1006.38(b); 12 CFR 1006.38(b)(1); 12 CFR 1006.38(b)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Overshadowing of rights to dispute or request original-creditor
            information
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: must not engage in any collection activities or communications
            that overshadow or are inconsistent with the disclosure
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: A debt collector who uses Model Form B-1 in appendix B to this
            part in a manner described in § 1006.34(d)(2) has not thereby violated
  versions:
  - effective_from: '0001-01-01'
    formula: 'collection_activity_or_communication_during_validation_period

      and activity_or_communication_overshadows_or_is_inconsistent_with_disclosed_rights

      and not activity_is_use_of_model_form_b_1_in_manner_described_in_section_1006_34_d_2'
- name: original_creditor_request_collection_must_cease
  kind: derived
  entity: Business
  dtype: Judgment
  period: Day
  source: 12 CFR 1006.38(c); 12 CFR 1006.38(c)(1); 12 CFR 1006.38(c)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Upon receipt of a request for the name and address of the original
            creditor submitted by the consumer in writing within the validation period
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Sends the name and address of the original creditor to the consumer
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: reasonably determines that the original creditor is the same as
            the current creditor
  versions:
  - effective_from: '0001-01-01'
    formula: "written_original_creditor_information_request_received_within_validation_period\n\
      and not (\n  original_creditor_information_sent\n  or (\n    current_and_original_creditor_same\n\
      \    and reasonably_determined_same_creditor\n    and consumer_notified_same_creditor_in_writing_or_electronically\n\
      \    and consumer_referred_to_previous_validation_information\n  )\n)"
- name: dispute_collection_must_cease
  kind: derived
  entity: Business
  dtype: Judgment
  period: Day
  source: 12 CFR 1006.38(d); 12 CFR 1006.38(d)(2); 12 CFR 1006.38(d)(2)(i); 12 CFR
    1006.38(d)(2)(ii); 12 CFR 1006.38(d)(2)(ii)(A); 12 CFR 1006.38(d)(2)(ii)(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Disputes—
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Upon receipt of a dispute submitted by the consumer in writing
            within the validation period
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Sends a copy either of verification of the debt or of a judgment
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: a dispute that the debt collector reasonably determines is a duplicative
            dispute
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: provides a brief statement of the reasons for the determination,
            and refers the consumer to the debt collector's response to the earlier
            dispute
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: Satisfies paragraph (d)(2)(i) of this section.
  versions:
  - effective_from: '0001-01-01'
    formula: "written_dispute_received_within_validation_period\nand not (\n  verification_or_judgment_sent\n\
      \  or (\n    debt_collector_reasonably_determined_dispute_is_duplicative\n \
      \   and duplicative_dispute_notice_with_reasons_and_earlier_response_reference_sent\n\
      \  )\n)"
- name: failure_to_dispute_is_legal_admission
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: 12 CFR 1006.38(d)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/12/1006/38
          excerpt: The failure of a consumer to dispute the validity of a debt does
            not constitute a legal admission of liability by the consumer.
  versions:
  - effective_from: '0001-01-01'
    formula: "false"
