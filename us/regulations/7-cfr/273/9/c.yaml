        formula: |-
          if (
            payment_intended_for_care_and_maintenance_of_nonhousehold_beneficiary
            and payment_used_for_care_and_maintenance_of_nonhousehold_beneficiary
          ):
            if nonhousehold_beneficiary_payment_portion_is_identifiable:
              min(
                income_payment_amount,
                min(
                  identifiable_nonhousehold_beneficiary_payment_amount,
                  amount_actually_used_for_nonhousehold_beneficiary
                )
              )
            else:
              if total_intended_beneficiary_count > 0:
                min(
                  income_payment_amount
                  * nonhousehold_intended_beneficiary_count
                  / total_intended_beneficiary_count,
                  amount_actually_used_for_nonhousehold_beneficiary
                )
              else: 0
          else: 0

