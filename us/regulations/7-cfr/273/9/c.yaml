            and (
              income_recipient_attends_elementary_or_secondary_school
              or income_recipient_attends_district_recognized_operated_or_supervised_ged_classes
              or income_recipient_attends_district_recognized_or_supervised_home_school
              or (
                income_recipient_on_temporary_semester_or_vacation_break
                and income_recipient_enrollment_will_resume_after_break
                and income_recipient_was_in_qualifying_elementary_secondary_ged_or_home_school_enrollment_before_break
              )
            )
            and income_recipient_lives_with_parent_or_under_household_member_parental_control
          ):
            if recipient_earnings_differentiable_from_other_household_members:
              income_payment_amount
            else:
              if household_members_sharing_undifferentiated_earnings_count > 0:
                min(
                  income_payment_amount,
                  undifferentiated_household_earnings_amount
                  / household_members_sharing_undifferentiated_earnings_count
                )
              else: 0
          else: 0

