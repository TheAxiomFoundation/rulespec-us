format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/9
  summary: |-
    7 CFR 273.9(c) is a closed list of income exclusions. This module classifies
    atomic income payments under each enumerated exclusion and sums the excluded
    amount once per payment, so overlapping legal routes (for example, an E&T
    reimbursement under both paragraphs (c)(5) and (c)(14)) do not double-count.
    A caller must split a payment into separate relation rows when distinct
    portions have different legal purposes and must not reuse an expense amount
    across rows. Educational-expense allocations must apply allowable expenses
    to unearned educational income before earned educational income and must
    coordinate dependent-care expenses with paragraph (c)(5)(i)(C).
    Paragraph (c)(3)(ii)(A)'s printed “20 CFR 1087uu” reference is treated as
    the standalone Federal student-aid route described by that subparagraph;
    the ordinary education route requires qualifying enrollment and allowable
    educational use. The explicit State-plan choices are the Medicaid-aligned
    education exclusion in (c)(3)(v), the alternative child-support deduction
    election in (c)(17), complementary assistance in (c)(18), and
    TANF/Medicaid-aligned income in (c)(19). Paragraph (c)(8) also permits State
    treatment of a qualifying TANF diversion payment as a nonrecurring lump
    sum. A qualifying school-clothing allowance under (c)(5)(i)(E) is mandatory
    exclusion treatment, not a SNAP State option.
rules:
