  - name: snap_reimbursement_exclusion_amount
    kind: derived
    entity: Payment
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.9(c)(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/9
              excerpt: Reimbursements for past or future expenses, to the extent they do not exceed actual expenses, and do not represent a gain or benefit to the household
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if (
            (
              payment_is_title_iv_a_benefit_adjustment_for_work_or_child_care_expense
              and not payment_is_post_1988_title_iv_a_employment_education_training_reimbursement
            )
            or payment_is_educational_assistance_for_room_and_board
          ):
            0
          else:
            max(
              if snap_school_clothing_allowance_exclusion_applies:
                income_payment_amount
              else: 0,
              if (
                snap_general_reimbursement_exclusion_applies
                or snap_job_or_training_reimbursement_exclusion_applies
                or snap_volunteer_expense_reimbursement_exclusion_applies
                or snap_medical_dependent_care_reimbursement_exclusion_applies
                or snap_title_xx_services_reimbursement_exclusion_applies
                or snap_et_education_component_reimbursement_exclusion_applies
              ):
                if reimbursement_provider_or_household_indicates_amount_exceeds_actual_expense:
                  min(income_payment_amount, actual_identified_nonliving_expense_amount)
                else:
                  income_payment_amount
              else: 0
            )

  - name: snap_third_party_beneficiary_care_exclusion_amount
    kind: derived
    entity: Payment
    dtype: Money
    period: Month
    unit: USD
