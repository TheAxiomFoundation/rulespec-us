        formula: |-
          max(
            if (
              snap_in_kind_benefit_exclusion_applies
              or snap_pa_vendor_payment_exclusion_applies
              or snap_ga_vendor_payment_exclusion_applies
              or snap_hud_vendor_payment_exclusion_applies
              or snap_demonstration_vendor_payment_exclusion_applies
              or snap_other_third_party_payment_exclusion_applies
            ): income_payment_amount else: 0,
            if snap_educational_assistance_vendor_payment_exclusion_applies:
              snap_educational_assistance_exclusion_amount
            else: 0,
            if snap_reimbursement_vendor_payment_exclusion_applies:
              snap_reimbursement_exclusion_amount
            else: 0
          )

