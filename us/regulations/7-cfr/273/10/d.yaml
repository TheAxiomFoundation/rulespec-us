format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/10
  deferred_outputs:
    - output: us:regulations/7-cfr/273/10/d/4#snap_federal_medical_expense_change_verification_execution_and_notice_workflow
      blocked_by:
        - us:regulations/7-cfr/273/2/f/8#snap_federal_medical_expense_change_verification
        - us:regulations/7-cfr/273/12/c#snap_federal_reported_change_case_action
      reason: >-
        This module encodes paragraph (d)(4)'s increase/decrease branches and
        whether verification is due before action, before the second normal
        monthly allotment, or before recertification. Performing verification,
        adjusting the allotment, and issuing any required notice remain in the
        cross-referenced verification and change-processing workflows.
    - output: us:regulations/7-cfr/273/10/d/4#snap_federal_dependent_care_age_two_adjustment
      blocked_by:
        - us:regulations/7-cfr/273/9/d/4#snap_federal_current_dependent_care_deduction_parameters
      reason: >-
        Paragraph (d)(4) retains a cross-reference to a $200 dependent-care
        maximum when a child turns two. The current deductible-expense
        parameters and any superseding amendments in section 273.9 must be
        resolved before that age-triggered adjustment can be encoded without
        reviving a superseded cap.
    - output: us:regulations/7-cfr/273/10/d/7#snap_federal_ssi_linked_restored_medical_and_shelter_deductions
      blocked_by:
        - us:regulations/7-cfr/271/2#snap_federal_disabled_member_status
        - us:regulations/7-cfr/273/2/j#snap_federal_ssi_categorical_eligibility_and_restored_benefit_period
      reason: >-
        Paragraph (d)(7) ties retroactive medical and uncapped shelter
        deductions to SSI authorization, disability definitions, categorical
        eligibility, NPA determinations, and restored-benefit periods. Those
        cross-section eligibility and restoration dates are not available in
        this expense-timing module.
    - output: us:regulations/7-cfr/273/10/d/8#snap_federal_optional_child_support_retrospective_budgeting_method
      blocked_by:
        - us:regulations/7-cfr/273/21#snap_federal_retrospective_budgeting_context
      reason: >-
        This module encodes the paragraph (d)(8) prospective-method selection
        and the component paragraph (d)(2)-(5) rules. The alternative
        retrospective calculation remains deferred because it requires the
        section 273.21 retrospective-budgeting workflow.
    - output: us:regulations/7-cfr/273/10/d/8#snap_federal_optional_child_support_end_to_end_prospective_deduction
      blocked_by:
        - us:regulations/7-cfr/273/9/d/5#snap_federal_allowable_optional_child_support_deduction_amount
      reason: >-
        This module exposes the prospective-method selection and the paragraph
        (d)(2)-(5) timing, anticipation, and conversion components. Composing
        those components into an end-to-end optional child-support deduction
        remains blocked on the current section 273.9(d)(5) allowable-payment
        base and its State-option contract.
  summary: |-
    7 CFR 273.10(d) governs the timing and budgeting of deductible SNAP
    expenses. Covered or reimbursed amounts are disallowed, and a service
    expense requires an outside provider and a money payment. Except when an
    averaging election applies, an expense is deducted only when billed or due;
    arrearages carried from earlier billing periods are excluded and no expense
    may be deducted twice. Households may average fluctuating expenses,
    less-than-monthly bills, one-time expenses, and one-time medical expenses
    over the periods specified in paragraph (d)(3). Anticipated expenses
    generally use the most recent bill unless a change is reasonably certain,
    while special utility estimates may be used instead of averaging past
    bills. Weekly and biweekly expenses use the paragraph (c)(2) conversion
    procedures, and energy-assistance payments are prorated over the intended
    heating or cooling season, including multi-season HCSUA potential.
    For prospective child support, this module exposes method selection; the
    generic paragraph (d)(2)-(5) timing, anticipation, and conversion
    components remain separate pending composition with the section
    273.9(d)(5) allowable-payment base. Medical-change verification deadlines
    are exposed as federal judgments; their cross-section execution workflow,
    the dependent-care age-two cap adjustment, SSI restoration, and end-to-end
    child-support composition remain narrowly deferred.
rules:
  - name: snap_federal_weekly_expense_conversion_factor
    kind: parameter
    dtype: Decimal
    source: 7 CFR 273.10(c)(2)(i), (d)(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: multiplying weekly amounts by 4.3 and biweekly amounts by 2.15
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          4.3

  - name: snap_federal_biweekly_expense_conversion_factor
    kind: parameter
    dtype: Decimal
    source: 7 CFR 273.10(c)(2)(i), (d)(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: multiplying weekly amounts by 4.3 and biweekly amounts by 2.15
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          2.15

  - name: snap_federal_expense_amount_after_excluded_payment_coverage
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(1)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Any expense, in whole or part, covered by educational income which has been excluded pursuant to the provisions of § 273.9(c)(3) shall not be deductible.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Deductible expenses include only certain dependent care, shelter, medical and, at State agency option, child support costs as described in § 273.9.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: the portion of rent covered by excluded vendor payments shall not be calculated as part of the household's shelter cost.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: an expense which is covered by an excluded vendor payment that has been converted to a direct cash payment under the approval of a federally authorized demonstration project
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: A dependent care expense which is reimbursed or paid for by the Job Opportunities and Basic Skills Training (JOBS) program under title IV-F of the Social Security Act (42 U.S.C. 681) or the Transitional Child Care (TCC) program shall not be deductible.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: A utility expense which is reimbursed or paid by an excluded payment, including HUD or FmHA utility reimbursements, shall not be deductible.
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          max(
              0,
              snap_federal_expense_amount_eligible_for_deduction_under_section_273_9
              - snap_federal_expense_amount_covered_by_excluded_educational_income
              - snap_federal_shelter_expense_amount_covered_by_excluded_vendor_payment
              - snap_federal_expense_amount_covered_by_excluded_vendor_payment_converted_to_demonstration_direct_cash
              - snap_federal_dependent_care_expense_amount_reimbursed_or_paid_by_jobs_or_transitional_child_care_program
              - snap_federal_utility_expense_amount_reimbursed_or_paid_by_excluded_payment
          )

  - name: snap_federal_expense_service_and_payment_requirement_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.10(d)(1)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Expenses shall only be deductible if the service is provided by someone outside of the household and the household makes a money payment for the service.
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          snap_federal_expense_service_provided_by_person_outside_household
          and snap_federal_household_obligation_for_expense_service_is_money_payment

  - name: snap_federal_deductible_expense_after_disallowances
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Expenses shall only be deductible if the service is provided by someone outside of the household and the household makes a money payment for the service.
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if snap_federal_expense_service_and_payment_requirement_met:
              snap_federal_expense_amount_after_excluded_payment_coverage
          else:
              0

  - name: snap_federal_nonreimbursable_medical_expense_considered_for_deduction
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(1)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: that portion of an allowable medical expense which is not reimbursable shall be included
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: considered at the time the amount of the expense or reimbursement is reported and verified
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if (
              snap_federal_medical_expense_and_reimbursement_reported_and_verified
              or (
                  snap_federal_allowable_medical_expense_reported_at_certification
                  and snap_federal_medical_expense_reasonably_anticipated_from_available_information
              )
          ):
              max(
                  0,
                  snap_federal_allowable_medical_expense_amount
                  - snap_federal_medical_expense_reimbursable_amount
              )
          else:
              0

  - name: snap_federal_billed_expense_deduction_for_budget_month
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: a deduction shall be allowed only in the month the expense is billed or otherwise becomes due
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Amounts carried forward from past billing periods are not deductible
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: a particular expense may only be deducted once
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if (
              snap_federal_expense_billed_or_due_in_budget_month
              and not snap_federal_expense_previously_deducted
          ):
              max(
                  0,
                  snap_federal_deductible_expense_after_disallowances
                  - snap_federal_expense_amount_carried_forward_from_past_billing_period
              )
          else:
              0

  - name: snap_federal_expense_budget_amount_after_fluctuating_averaging
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Households may elect to have fluctuating expenses averaged.
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if snap_federal_household_elects_fluctuating_expense_averaging:
              if snap_federal_expense_previously_deducted_outside_current_averaging_election:
                  0
              elif (
                  snap_federal_current_month_within_fluctuating_expense_averaging_period
                  and snap_federal_fluctuating_expense_averaging_period_months > 0
              ):
                  snap_federal_total_fluctuating_deductible_expenses_after_disallowances_over_averaging_period
                  / snap_federal_fluctuating_expense_averaging_period_months
              else:
                  0
          else:
              snap_federal_billed_expense_deduction_for_budget_month

  - name: snap_federal_expense_budget_amount_after_less_than_monthly_averaging
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: expenses which are billed less often than monthly averaged forward over the interval between scheduled billings
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: if there is no scheduled interval, averaged forward over the period the expense is intended to cover
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if (
              snap_federal_expense_billed_less_often_than_monthly
              and snap_federal_household_elects_less_than_monthly_expense_averaging
          ):
              if snap_federal_expense_previously_deducted_outside_current_averaging_election:
                  0
              elif not snap_federal_current_month_within_less_than_monthly_expense_averaging_interval:
                  0
              else:
                  if snap_federal_expense_has_scheduled_billing_interval:
                      if snap_federal_scheduled_billing_interval_months > 0:
                          snap_federal_less_than_monthly_deductible_expense_amount_after_disallowances
                          / snap_federal_scheduled_billing_interval_months
                      else:
                          0
                  else:
                      if snap_federal_expense_intended_coverage_months > 0:
                          snap_federal_less_than_monthly_deductible_expense_amount_after_disallowances
                          / snap_federal_expense_intended_coverage_months
                      else:
                          0
          else:
              snap_federal_expense_budget_amount_after_fluctuating_averaging

  - name: snap_federal_one_time_expense_budget_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: one-time only expenses averaged over the entire certification period in which they are billed
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if (
              snap_federal_expense_is_one_time_only
              and snap_federal_household_elects_one_time_expense_averaging
              and snap_federal_one_time_expense_billed_during_certification_period
          ):
              if snap_federal_expense_previously_deducted_outside_current_averaging_election:
                  0
              elif (
                  snap_federal_current_month_within_one_time_expense_averaging_period
                  and snap_federal_certification_period_months > 0
              ):
                  snap_federal_one_time_deductible_expense_amount_after_disallowances
                  / snap_federal_certification_period_months
              else:
                  0
          else:
              snap_federal_expense_budget_amount_after_less_than_monthly_averaging

  - name: snap_federal_twenty_four_month_first_twelve_month_medical_option_context
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.10(d)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: In averaging any one-time medical expense incurred by a household during the first 12 months
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: One-time expenses reported after the 12th month of the certification period will be deducted in one month or averaged over the remaining months in the certification period
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          snap_federal_household_certified_for_twenty_four_months
          and snap_federal_one_time_medical_expense_incurred_during_first_twelve_months
          and not snap_federal_one_time_medical_expense_reported_after_twelfth_month

  - name: snap_federal_one_time_medical_expense_election_valid
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.10(d)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: the option of deducting the expense for one month, averaging the expense over the remainder of the first 12 months of the certification period, or averaging the expense over the remaining months in the certification period.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Households reporting one-time only medical expenses during their certification period
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          snap_federal_one_time_medical_expense_reported_during_certification_period
          and (
              (
                  snap_federal_twenty_four_month_first_twelve_month_medical_option_context
                  and snap_federal_household_elects_one_month_medical_expense_deduction
                  and not snap_federal_household_elects_medical_expense_average_over_remainder_of_first_twelve_months
                  and not snap_federal_household_elects_medical_expense_average_over_remaining_certification_period
              )
              or (
                  snap_federal_twenty_four_month_first_twelve_month_medical_option_context
                  and not snap_federal_household_elects_one_month_medical_expense_deduction
                  and snap_federal_household_elects_medical_expense_average_over_remainder_of_first_twelve_months
                  and not snap_federal_household_elects_medical_expense_average_over_remaining_certification_period
                  and snap_federal_months_remaining_in_first_twelve_months_when_medical_expense_averaging_begins > 0
              )
              or (
                  snap_federal_twenty_four_month_first_twelve_month_medical_option_context
                  and not snap_federal_household_elects_one_month_medical_expense_deduction
                  and not snap_federal_household_elects_medical_expense_average_over_remainder_of_first_twelve_months
                  and snap_federal_household_elects_medical_expense_average_over_remaining_certification_period
                  and snap_federal_months_remaining_in_certification_period_when_medical_expense_averaging_begins > 0
              )
              or (
                  not snap_federal_twenty_four_month_first_twelve_month_medical_option_context
                  and snap_federal_household_elects_one_month_medical_expense_deduction
                  and not snap_federal_household_elects_medical_expense_average_over_remainder_of_first_twelve_months
                  and not snap_federal_household_elects_medical_expense_average_over_remaining_certification_period
              )
              or (
                  not snap_federal_twenty_four_month_first_twelve_month_medical_option_context
                  and not snap_federal_household_elects_one_month_medical_expense_deduction
                  and not snap_federal_household_elects_medical_expense_average_over_remainder_of_first_twelve_months
                  and snap_federal_household_elects_medical_expense_average_over_remaining_certification_period
                  and snap_federal_months_remaining_in_certification_period_when_medical_expense_averaging_begins > 0
              )
          )

  - name: snap_federal_one_time_medical_expense_budget_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: one-time deduction or to have the expense averaged over the remaining months of their certification period
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Averaging would begin the month the change would become effective.
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if (
              not snap_federal_expense_is_one_time_medical
              or not snap_federal_one_time_medical_expense_election_valid
              or not snap_federal_current_month_is_medical_expense_change_effective_month_or_later
              or snap_federal_expense_previously_deducted_outside_current_averaging_election
          ):
              0
          else:
              if snap_federal_household_elects_one_month_medical_expense_deduction:
                  if snap_federal_current_month_is_selected_one_time_medical_deduction_month:
                      snap_federal_one_time_medical_deductible_expense_amount_after_disallowances
                  else:
                      0
              else:
                  if not snap_federal_current_month_within_selected_medical_expense_averaging_period:
                      0
                  else:
                      if snap_federal_household_elects_medical_expense_average_over_remainder_of_first_twelve_months:
                          snap_federal_one_time_medical_deductible_expense_amount_after_disallowances
                          / snap_federal_months_remaining_in_first_twelve_months_when_medical_expense_averaging_begins
                      else:
                          snap_federal_one_time_medical_deductible_expense_amount_after_disallowances
                          / snap_federal_months_remaining_in_certification_period_when_medical_expense_averaging_begins

  - name: snap_federal_deductible_expense_for_budget_month
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(2)-(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Except as provided in paragraph (d)(3) of this section a deduction shall be allowed only in the month the expense is billed
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Households reporting one-time only medical expenses during their certification period may elect to have a one-time deduction or to have the expense averaged
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if snap_federal_expense_is_one_time_medical:
              snap_federal_one_time_medical_expense_budget_amount
          else:
              snap_federal_one_time_expense_budget_amount

  - name: snap_federal_optional_child_support_uses_prospective_budgeting_method
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.10(d)(8)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: If the State agency opts to provide households with an income deduction rather than an income exclusion for legally obligated child support payments
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: the State agency may budget such payments in accordance with paragraphs (d)(2) through (d)(5) of this section
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          snap_federal_state_opts_for_child_support_deduction_instead_of_income_exclusion
          and snap_federal_state_uses_prospective_child_support_budgeting_under_paragraphs_d_2_through_d_5

  - name: snap_federal_anticipated_nonutility_expense_for_budget_month
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.10(d)(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: Anticipation of the expense shall be based on the most recent month's bills, unless the household is reasonably certain a change will occur.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/10
              excerpt: The State agency shall calculate a household's expenses based on the expenses the household expects to be billed for during the certification period.
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          if not snap_federal_expense_expected_to_be_billed_during_certification_period:
              0
          else:
              if (
                  snap_federal_household_reasonably_certain_expense_change_will_occur
                  and snap_federal_current_budget_month_is_on_or_after_reasonably_certain_expense_change
              ):
