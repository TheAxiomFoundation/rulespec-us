  - name: resource_excluded_under_paragraph_e_19
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(19)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: any resources that the State agency excludes when determining eligibility or benefits for TANF cash assistance
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: do not evaluate the financial circumstances of adults in the household and programs grandfathered under Section 404(a)(2)
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: licensed vehicles not excluded under Section 5(g)(2)(C) or (D)
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: cash on hand, amounts in any account in a financial institution that are readily available
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: State agencies may exclude deposits in individual development accounts
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          state_paragraph_e_19_resource_option_validly_selected
          and resource_excluded_by_tanf_cash_or_section_1931_program
          and source_program_evaluates_financial_circumstances_of_adults
          and not source_program_grandfathered_under_ssa_section_404_a_2
          and (
            resource_is_individual_development_account_deposit
            or (
              not resource_is_cash_on_hand
              and not resource_is_readily_available_financial_account_or_instrument
              and (
                not resource_is_licensed_vehicle
                or licensed_vehicle_excluded_under_food_and_nutrition_act_section_5_g_2_c_or_d
              )
            )
          )

