format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/8
  summary: |-
    7 CFR 273.8(e) provides the exhaustive federal list of resources excluded
    from SNAP resource determinations. The exclusions cover qualifying homes
    and personal property; retirement and education accounts; specified
    vehicles and income-producing property; inaccessible resources and
    qualifying trusts; certain government, tax-credit, and energy-assistance
    payments; resources of SSI or public-assistance recipients; and a bounded
    State option for TANF or section 1931 exclusions. Most qualifying resources
    are excluded in full. Paragraph (e)(16) excludes only the portion of
    property directly related to maintaining or using a qualifying vehicle.
rules:
  - name: farm_self_employment_resource_exclusion_months
    kind: parameter
    dtype: Count
    source: 7 CFR 273.8(e)(3)(i)(A), 7 CFR 273.8(e)(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: must continue to be excluded as a resource for one year
    versions:
      - effective_from: '2025-10-01'
        formula: '12'

  - name: resource_significant_return_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: 7 CFR 273.8(e)(18)(i)-(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: more than $1,500
    versions:
      - effective_from: '2025-10-01'
        formula: '1500'

  - name: eitc_resource_exclusion_months
    kind: parameter
    dtype: Count
    source: 7 CFR 273.8(e)(12)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: shall be excluded for 12 months
    versions:
      - effective_from: '2025-10-01'
        formula: '12'

  - name: resource_excluded_under_paragraph_e_1
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: The home and surrounding property which is not separated from the home by intervening property owned by others
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: remain exempt when temporarily unoccupied for reasons of employment, training for future employment, illness, or uninhabitability caused by casualty or natural disaster, if the household intends to return
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: own or are purchasing a lot on which they intend to build or are building a permanent home
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          (
            (
              resource_is_home
              or resource_is_surrounding_property_not_separated_by_property_owned_by_others
              or resource_is_surrounding_property_separated_only_by_public_right_of_way
            )
            and (
              household_occupies_home
              or (
                home_temporarily_unoccupied_for_allowed_reason
                and household_intends_to_return_to_home
              )
            )
          )
          or (
            household_currently_owns_no_home
            and resource_is_owned_or_purchased_lot_or_partially_completed_home
            and household_intends_to_build_or_complete_permanent_home
          )

  - name: resource_excluded_under_paragraph_e_2
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Household goods, personal effects, the cash value of life insurance policies, one burial plot per household member, and the value of one funeral agreement per household member
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: The cash value of pension plans or funds shall be excluded.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Sections 401(a), 403(a), 403(b), 408, 408A, 457(b), or 501(c)(18)
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Funds in a Section 529A
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Funds in the Federal Thrift Savings Fund
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Any other retirement plan or arrangement that is designated as tax-exempt under a successor or similar provision
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Any other retirement account determined by FNS to be appropriate for exclusion
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_is_household_good
          or resource_is_personal_effect
          or resource_is_cash_value_of_life_insurance_policy
          or resource_is_one_burial_plot_per_household_member
          or resource_is_one_funeral_agreement_per_household_member
          or resource_is_cash_value_of_pension_plan_or_fund
          or resource_is_retirement_account_under_irc_401_a
          or resource_is_retirement_account_under_irc_403_a
          or resource_is_retirement_account_under_irc_403_b
          or resource_is_retirement_account_under_irc_408
          or resource_is_retirement_account_under_irc_408_a
          or resource_is_retirement_account_under_irc_457_b
          or resource_is_retirement_account_under_irc_501_c_18
          or resource_is_qualified_able_program_account_under_irc_529_a
          or resource_is_federal_thrift_savings_fund
          or resource_is_tax_exempt_successor_or_similar_retirement_arrangement
          or resource_is_other_retirement_account_fns_determined_appropriate

  - name: vehicle_income_or_employment_exclusion_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(3)(i)(A)-(C), 7 CFR 273.8(e)(3)(iii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Used for income-producing purposes
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Annually producing income consistent with its fair market value
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Necessary for long-distance travel, other than daily commuting, that is essential to the employment
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: apply when the vehicle is not in use because of temporary unemployment
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/8/e#farm_self_employment_resource_exclusion_months
              output: farm_self_employment_resource_exclusion_months
              hash: sha256:local
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          vehicle_used_for_income_producing_purpose
          or vehicle_annually_produces_income_consistent_with_fair_market_value
          or vehicle_necessary_for_long_distance_noncommuting_employment_travel
          or (
            vehicle_previously_used_by_self_employed_farmer
            and farm_self_employment_terminated
            and months_since_farm_self_employment_terminated
                <= farm_self_employment_resource_exclusion_months
          )
          or (
            vehicle_temporarily_not_in_use_due_to_temporary_unemployment
            and vehicle_normally_meets_paragraph_e_3_i_a_b_or_c
          )

  - name: vehicle_excluded_under_paragraph_e_3
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Licensed vehicles that meet the following conditions
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Used as the household's home
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Necessary to transport a physically disabled household member
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Necessary to carry fuel for heating or water for home use
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: sale would produce an estimated return of not more than $1,500
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: vehicles driven by tribal members
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/8/e#resource_significant_return_threshold
              output: resource_significant_return_threshold
              hash: sha256:local
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_is_vehicle
          and (
            vehicle_is_licensed
            or (
              vehicle_driven_by_tribal_member_on_reservation
              and reservation_does_not_require_tribal_vehicle_license
            )
          )
          and (
            vehicle_income_or_employment_exclusion_applies
            or vehicle_used_as_household_home
            or vehicle_is_one_necessary_for_transport_of_physically_disabled_counted_person
            or (
              vehicle_necessary_to_carry_heating_fuel_or_water_for_home_use
              and transported_fuel_or_water_is_anticipated_primary_household_source
            )
            or (
              vehicle_inaccessible_sale_return_condition_established
              and vehicle_estimated_return_from_sale
                  <= resource_significant_return_threshold
            )
          )

  - name: resource_excluded_under_paragraph_e_4
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Property which annually produces income consistent with its fair market value, even if only used on a seasonal basis
    versions:
      - effective_from: '2025-10-01'
        formula: property_annually_produces_income_consistent_with_fair_market_value

  - name: resource_excluded_under_paragraph_e_5
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Property, such as farm land or work related equipment, such as the tools of a tradesman or the machinery of a farmer, which is essential to the employment or self-employment
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/8/e#farm_self_employment_resource_exclusion_months
              output: farm_self_employment_resource_exclusion_months
              hash: sha256:local
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          property_essential_to_employment_or_self_employment_of_counted_person
          or (
            property_was_essential_to_terminated_farm_self_employment
            and months_since_farm_self_employment_terminated
                <= farm_self_employment_resource_exclusion_months
          )

  - name: resource_excluded_under_paragraph_e_6
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Installment contracts for the sale of land or buildings if the contract or agreement is producing income consistent with its fair market value
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: property sold under the installment contract, or held as security in exchange for a purchase price consistent with the fair market value
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          installment_contract_produces_income_consistent_with_fair_market_value
          and (
            resource_is_installment_contract_for_sale_of_land_or_building
            or resource_is_property_sold_or_held_as_security_for_installment_contract_at_fair_market_value
          )

  - name: resource_excluded_under_paragraph_e_7
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(7)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: governmental payments which are designated for the restoration of a home damaged in a disaster, if the household is subject to a legal sanction if the funds are not used as intended
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_is_governmental_payment
          and payment_designated_for_restoration_of_disaster_damaged_home
          and household_subject_to_legal_sanction_if_payment_not_used_as_intended

  - name: qualifying_trust_resource_inaccessible
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(8)(i)-(iv)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: The trust arrangement is not likely to cease during the certification period and no household member has the power to revoke
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: trustee administering the funds is either
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Trust investments made on behalf of the trust do not directly involve or assist any business or corporation under the control
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Established from the household's own funds
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: established from non-household funds by a nonhousehold member
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_is_trust
          and trust_arrangement_not_likely_to_cease_during_certification_period
          and no_household_member_can_revoke_trust_or_change_beneficiary
          and (
            trustee_is_court_or_independent_institution_corporation_or_organization
            or trustee_is_court_appointed_individual_with_court_imposed_use_limitations
          )
          and trust_investments_do_not_assist_household_controlled_business
          and (
            (
              trust_established_from_household_funds
              and trustee_uses_funds_only_for_investment_or_named_person_education_or_medical_expenses
            )
            or trust_established_from_nonhousehold_funds_by_nonhousehold_member
          )

  - name: resource_excluded_under_paragraph_e_8
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(8)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Resources having a cash value which is not accessible to the household
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: irrevocable trust funds, security deposits on rental property or utilities, property in probate, and real property which the household is making a good faith effort to sell at a reasonable price
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_cash_value_otherwise_inaccessible_to_household
          or resource_is_security_deposit_on_rental_property_or_utilities
          or resource_is_property_in_probate
          or real_property_subject_to_good_faith_sale_effort_at_reasonable_price
          or qualifying_trust_resource_inaccessible

  - name: resource_excluded_under_paragraph_e_9
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(9)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Resources, such as those of students or self-employed persons, which have been prorated as income
    versions:
      - effective_from: '2025-10-01'
        formula: resource_has_been_prorated_and_is_still_counted_as_income

  - name: resource_excluded_under_paragraph_e_10
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(10)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Indian lands held jointly with the Tribe, or land that can be sold only with the approval of the Department of the Interior's Bureau of Indian Affairs
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_is_indian_land_held_jointly_with_tribe
          or resource_is_land_sale_restricted_to_bia_approval

  - name: resource_excluded_under_paragraph_e_11
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(11)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Resources which are excluded for SNAP purposes by express provision of Federal statute
    versions:
      - effective_from: '2025-10-01'
        formula: resource_expressly_excluded_for_snap_by_federal_statute

  - name: resource_excluded_under_paragraph_e_12
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(12)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: A Federal earned income tax credit received either as a lump sum or as payments under section 3507 of the Internal Revenue Code for the month of receipt and the following month
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Any Federal, State or local earned income tax credit received by any household member shall be excluded for 12 months
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Breaks in participation of one month or less due to administrative reasons
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/8/e#eitc_resource_exclusion_months
              output: eitc_resource_exclusion_months
              hash: sha256:local
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          (
            resource_is_federal_earned_income_tax_credit
            and eitc_month_number_since_receipt_including_receipt_month <= 2
          )
          or (
            resource_is_federal_state_or_local_earned_income_tax_credit
            and household_was_participating_in_snap_when_eitc_received
            and eitc_month_number_since_receipt_including_receipt_month
                <= eitc_resource_exclusion_months
            and (
              household_participated_continuously_since_eitc_receipt
              or (
                snap_participation_break_was_for_administrative_reason
                and snap_participation_break_months <= 1
              )
            )
          )

  - name: resource_excluded_under_paragraph_e_13
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(13)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: exclusion shall also apply when the resource is being used by or for an ineligible alien or disqualified person whose resources are being counted
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_used_by_or_for_counted_ineligible_alien_or_disqualified_person
          and same_resource_use_would_qualify_for_exclusion_for_household_member

  - name: resource_excluded_under_paragraph_e_14
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(14)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Energy assistance payments or allowances excluded as income under § 273.9(c)(11)
    versions:
      - effective_from: '2025-10-01'
        formula: resource_is_energy_assistance_excluded_as_income_under_section_273_9_c_11

  - name: resource_excluded_under_paragraph_e_15
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(15)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Non-liquid asset(s) against which a lien has been placed as a result of taking out a business loan and the household is prohibited by the security or lien agreement
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_is_nonliquid_asset
          and resource_has_lien_from_business_loan
          and security_or_lien_agreement_prohibits_household_from_selling_resource

  - name: resource_excluded_under_paragraph_e_16
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(16)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Property, real or personal, to the extent that it is directly related to the maintenance or use of a vehicle excluded under paragraphs (e)(3)(i)(A), (e)(3)(i)(B) or (e)(3)(i)(C)
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Only that portion of real property determined necessary for maintenance or use is excludable
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_is_real_or_personal_property
          and property_directly_related_to_maintenance_or_use_of_vehicle
          and related_vehicle_excluded_under_paragraph_e_3_i_a_b_or_c

  - name: resource_excluded_under_paragraph_e_17
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(17)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: resources of a household member who receives SSI or PA benefits
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: benefits have been authorized but not received, if the benefits are suspended or recouped, or if the benefits are not paid because they are less than a minimum amount
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: Individuals entitled to Medicaid benefits only are not considered recipients of SSI or PA
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          resource_owned_by_household_member
          and not resource_owner_entitled_to_medicaid_only
          and (
            resource_owner_receives_ssi_or_pa_benefits
            or resource_owner_ssi_or_pa_authorized_but_not_received
            or resource_owner_ssi_or_pa_suspended_or_recouped
            or resource_owner_ssi_or_pa_not_paid_because_below_minimum
            or resource_owner_receives_qualifying_non_cash_or_in_kind_public_assistance
          )

  - name: resource_excluded_under_paragraph_e_18
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(e)(18)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: household is unable to sell for any significant return because the household's interest is relatively slight or the costs of selling the household's interest would be relatively great
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: does not apply to financial instruments such as stocks, bonds, and negotiable financial instruments
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: determination of whether any part of the value of a vehicle is included as a resource must be made in accordance with the provisions of paragraphs (e)(3) and (f)
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/8/e#resource_significant_return_threshold
              output: resource_significant_return_threshold
              hash: sha256:local
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          not resource_is_vehicle
          and not resource_is_stock_bond_or_negotiable_financial_instrument
          and resource_unable_to_sell_for_significant_return_because_interest_slight_or_costs_great
          and estimated_return_after_sale_costs_and_household_ownership_interest
              <= resource_significant_return_threshold

  - name: state_paragraph_e_19_resource_option_validly_selected
    kind: derived
