    source: 7 CFR 273.8(h)(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: $0 to 249.99 | 1
    versions:
