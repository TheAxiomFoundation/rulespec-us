format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/8
  deferred_outputs:
    - output: us:regulations/7-cfr/273/8/h#transfer_disqualification_start_after_fair_hearing
      blocked_by:
        - us:regulations/7-cfr/273/15#continued_benefits_and_fair_hearing_outcome_context
      reason: >-
        Paragraph (h)(3) says only that the ordinary post-notice effective date
        does not apply when the household requests a fair hearing and continued
        benefits. It does not specify the replacement effective date. That date
        depends on the fair-hearing and continued-benefits workflow.
  summary: |-
    7 CFR 273.8(h) disqualifies a non-categorically-exempt household that
    knowingly transfers resources to qualify or attempt to qualify for SNAP
    during the three months before application or after eligibility. Transfers
    that would not affect eligibility, occur at or near fair market value,
    occur within the same household, or have another purpose do not affect
    eligibility. The amount by which the transferred nonexempt resources plus
    other countable resources exceed the applicable limit determines a
    disqualification of 1, 3, 6, 9, or 12 months. Applicants must receive a
    denial notice and participants must receive an adverse-action notice; both
    notices explain the reason and length. Applicant disqualifications begin
    in the application month; the ordinary participant start is the first
    allotment after the adverse-action notice period.
rules:
  - name: transfer_resource_application_lookback_months
    kind: parameter
    dtype: Count
    source: 7 CFR 273.8(h)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/8
              excerpt: within the 3-month period immediately preceding the date of application
    versions:
      - effective_from: '2025-10-01'
        formula: '3'

  - name: transfer_disqualification_one_month_period
    kind: parameter
