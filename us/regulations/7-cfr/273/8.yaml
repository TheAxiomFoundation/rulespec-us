format: rulespec/v1
module:
  deferred_outputs:
    - output: us:regulations/7-cfr/273/8/d#jointly_owned_resource_household_composition
      blocked_by:
        - us:regulations/7-cfr/273/8#household_countable_resource_composition
      reason: >-
        Paragraph (d)'s asset-level full, partial, and inaccessible attribution
        is encoded. Relating those Asset outputs to a Household total remains
        part of the frozen countable-resource composition.
    - output: us:regulations/7-cfr/273/8/e#household_resource_exclusion_composition
      blocked_by:
        - us:regulations/7-cfr/273/8#household_countable_resource_composition
      reason: >-
        Paragraph (e)'s per-asset exclusion judgments and excluded amount are
        encoded. Applying them across a Household's resource collection remains
        part of the frozen countable-resource composition.
    - output: us:regulations/7-cfr/273/8/f#household_non_excluded_vehicle_resource_total
      blocked_by:
        - us:regulations/7-cfr/273/8#household_vehicle_collection_context
      reason: >-
        Paragraph (f)'s per-vehicle fair-market-value, equity, and optional TANF
        attribution are encoded. Summing the resulting Asset values across a
        Household remains part of the frozen countable-resource composition.
    - output: us:regulations/7-cfr/273/8/h#transfer_disqualification_active_for_evaluation_month
      blocked_by:
        - us:regulations/7-cfr/273/8/h#transfer_disqualification_timeline_context
        - us:regulations/7-cfr/273/15#continued_benefits_and_fair_hearing_outcome_context
      reason: >-
        Paragraph (h)'s disqualification predicate, duration, notices, and
        ordinary start points are encoded. Applying the period to an evaluation
        month still requires a dated participation timeline and the unresolved
        fair-hearing start exception.
  summary: |-
    7 CFR 273.8 sets SNAP resource eligibility standards. Categorically
    eligible households do not have to meet the resource limits or definitions
    in the section. Other households are resource eligible when countable
    liquid and non-liquid financial resources do not exceed the federally
    adjusted SNAP asset limit.
  source_verification:
    corpus_citation_path: us/regulation/7/273/8
imports:
  - us:policies/usda/snap/fy-2026-cola/deductions
rules:
  - name: snap_resource_limit_categorical_exemption_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(a)
    versions:
      - effective_from: '2025-10-01'
        formula: snap_categorically_eligible_for_resource_exemption
  - name: snap_financial_resources_within_limit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(b)
    versions:
      - effective_from: '2025-10-01'
        formula: snap_countable_financial_resources <= snap_asset_limit
  - name: snap_resource_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.8(a), 7 CFR 273.8(b)
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          snap_resource_limit_categorical_exemption_applies
          or snap_financial_resources_within_limit
