format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/4
    corpus_citation_paths:
      - us/regulation/7/273/4
      - us/guidance/usda/fns/snap-fy2026-income-eligibility-standards/page-1
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us/regulation/7/273/4
      rationale: >-
        Paragraph (c)(2)(i)(B) directs use of the Program's monthly gross
        income eligibility limit. USDA's fiscal-year income-eligibility table
        is the official parameter source for that annually changing limit and
        is imported rather than restated here.
  summary: |-
    7 CFR 273.4(c)(1)-(3) governs income and resource deeming for an eligible
    alien sponsored through Form I-864 or I-864A. Deeming continues until the
    alien gains U.S. citizenship, has worked or can receive credit for forty
    qualifying quarters, or the sponsor dies. The normal income calculation
    combines the sponsor's income with a spouse's income only when the spouse
    executed an affidavit, subtracts the section 273.9(c) exclusions already
    reflected in the resolved inputs, subtracts twenty percent of earned
    income, and subtracts the SNAP gross-income limit for the sponsor reference
    unit. Actual sponsor or spouse payments are added only to the extent they
    exceed the paragraph (c)(2)(i) amount. Resources resolved under section
    273.8 are reduced by $1,500. The resulting amounts are allocated across all
    aliens sponsored by the same sponsor when the required information is
    demonstrated.

    The sponsor reference-unit size is distinct from the sponsored alien's
    SNAP household size used for the indigence test. An accepted indigence
    determination replaces normal deeming with the adjudicated amount actually
    provided for a renewable twelve-month period. A qualifying battery or
    extreme-cruelty determination prevents deeming for the first twelve
    months; afterward, only a court- or USCIS-recognized batterer's income and
    resources are excluded. Sponsor and spouse components therefore remain
    separate until that source-person exclusion is applied.

    Paragraph (c)(2)(v) is internally imprecise when it refers to income and
    resources under paragraphs (c)(2)(i) and (c)(2)(iii), although resources
    are specified in paragraph (c)(2)(iv). This encoding applies the allocation
    to the paragraph (c)(2)(i), (iii), and (iv) amounts, calculating the actual
    payment excess before allocation. Because negative income or resources
    cannot be available to a household, the post-reduction amounts are floored
    at zero. No rounding is imposed because paragraph (c) supplies none.
