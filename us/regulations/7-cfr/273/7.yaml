  versions:
  - effective_from: '2025-10-01'
    formula: |-
      snap_member_job_change_within_voluntary_quit_review_period
      and member_voluntarily_reduced_work_effort
      and member_pre_reduction_weekly_work_hours >= snap_voluntary_quit_weekly_hours_threshold
      and member_post_reduction_weekly_work_hours < snap_voluntary_quit_weekly_hours_threshold
      and member_post_reduction_weekly_earnings < federal_minimum_wage * snap_voluntary_quit_weekly_hours_threshold
      and not state_agency_determined_reduction_was_minor_variation
      and not snap_member_work_requirement_good_cause_applies
