- name: snap_voluntary_quit_retirement_maximum_age_exclusive
  kind: parameter
  dtype: Count
  source: 7 CFR 273.7(i)(3)(v), incorporated by 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(i)(3)(v)
  versions:
  - effective_from: '2025-10-01'
    formula: '60'
- name: snap_state_voluntary_quit_lookback_period_valid
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(1)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      state_agency_voluntary_quit_lookback_days >= snap_voluntary_quit_lookback_minimum_days
      and state_agency_voluntary_quit_lookback_days <= snap_voluntary_quit_lookback_maximum_days
- name: snap_member_job_change_within_voluntary_quit_review_period
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(1), 7 CFR 273.7(j)(2), 7 CFR 273.7(j)(3)(ii)-(iv)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(1)-(3)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      snap_state_voluntary_quit_lookback_period_valid
      and (
          (
              member_job_change_occurred_before_application
              and member_job_change_days_before_application >= 0
              and member_job_change_days_before_application <= state_agency_voluntary_quit_lookback_days
          )
          or member_job_change_occurred_on_or_after_application
      )
- name: snap_member_work_requirement_good_cause_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(i)(1)-(2), 7 CFR 273.7(i)(4), incorporated by 7 CFR 273.7(f)(1) and 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(i)(1)-(2), (4)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      state_agency_determined_other_good_cause
      or member_illness_prevented_work_requirement_compliance
      or other_household_member_illness_required_member_presence
      or household_emergency_prevented_work_requirement_compliance
      or transportation_unavailable_for_work_requirement
      or (
          adequate_child_care_unavailable_for_child
          and child_needing_care_age >= snap_work_requirement_good_cause_child_care_minimum_age
          and child_needing_care_age < snap_work_requirement_good_cause_child_care_maximum_age_exclusive
      )
      or (
          member_failed_mandatory_et_requirement
          and appropriate_and_available_et_opening_unavailable
      )
- name: snap_member_voluntary_quit_good_cause_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(i)(2)-(3), incorporated by 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(i)(2)-(3)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      snap_member_work_requirement_good_cause_applies
      or member_left_employment_determined_unsuitable_under_273_7_h
      or employer_discriminated_against_member_on_protected_basis
      or work_demands_or_conditions_made_continued_employment_unreasonable
      or member_accepted_other_employment_requiring_departure
      or member_enrolled_at_least_half_time_requiring_departure
      or household_moved_for_another_members_employment_or_half_time_enrollment
      or (
          member_age < snap_voluntary_quit_retirement_maximum_age_exclusive
          and employer_recognized_resignation_as_retirement
      )
      or qualifying_bona_fide_employment_offer_failed_beyond_member_control
      or member_left_job_as_part_of_customary_mobile_employment_pattern
- name: snap_member_prior_quit_exception_after_comparable_job_loss
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(3)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(3)(ii)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      member_secured_new_employment_at_comparable_wages_or_hours
      and member_lost_new_employment_through_no_fault
- name: snap_member_government_strike_dismissal_counts_as_voluntary_quit_without_good_cause
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(3)(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(3)(ii)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      member_was_federal_state_or_local_government_employee
      and member_participated_in_strike_against_that_government
      and member_was_dismissed_for_participating_in_strike
- name: snap_member_voluntary_quit_without_good_cause
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(2)(i), 7 CFR 273.7(j)(3)(ii), 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(2)(i), (3)(ii), (3)(v)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      snap_member_job_change_within_voluntary_quit_review_period
      and (
          member_pre_quit_weekly_work_hours >= snap_voluntary_quit_weekly_hours_threshold
          or member_pre_quit_weekly_earnings >= federal_minimum_wage * snap_voluntary_quit_weekly_hours_threshold
      )
      and not snap_member_prior_quit_exception_after_comparable_job_loss
      and (
          snap_member_government_strike_dismissal_counts_as_voluntary_quit_without_good_cause
          or (
              member_voluntarily_quit_job
              and not member_terminated_self_employment_enterprise
              and not member_resigned_at_employer_demand
              and not snap_member_voluntary_quit_good_cause_applies
          )
      )
- name: snap_member_voluntary_work_effort_reduction_without_good_cause
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(2)(ii), 7 CFR 273.7(j)(3)(iii), 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(2)(ii), (3)(iii), (3)(v)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      snap_member_job_change_within_voluntary_quit_review_period
      and member_voluntarily_reduced_work_effort
      and member_pre_reduction_weekly_work_hours >= snap_voluntary_quit_weekly_hours_threshold
      and member_post_reduction_weekly_work_hours < snap_voluntary_quit_weekly_hours_threshold
      and member_post_reduction_weekly_earnings < federal_minimum_wage * snap_voluntary_quit_weekly_hours_threshold
      and not state_agency_determined_reduction_was_minor_variation
      and not snap_member_work_requirement_good_cause_applies
- name: snap_member_voluntary_quit_or_work_effort_reduction_without_good_cause
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(2)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      snap_member_voluntary_quit_without_good_cause
      or snap_member_voluntary_work_effort_reduction_without_good_cause
- name: snap_member_voluntary_quit_or_work_effort_reduction_disqualification_required
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(2), 7 CFR 273.7(j)(3)(iv)-(vii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(2)-(3)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      not snap_member_general_work_requirement_exempt
      and snap_member_voluntary_quit_or_work_effort_reduction_without_good_cause
