format: rulespec/v1
module:
  deferred_outputs:
  - output: us:regulations/7-cfr/273/7/c#state_agency_work_registration_responsibilities
    blocked_by:
    - us:regulations/7-cfr/273/7#state_agency_work_registration_workflow
    reason: Paragraph (c) governs State agency registration, notices, screening, and
      referral responsibilities. This module encodes person-level work requirement
      exemptions and compliance; registration administration is deferred until the
      State agency workflow is encoded.
  - output: us:regulations/7-cfr/273/7/d#employment_and_training_federal_financial_participation
    blocked_by:
    - us:regulations/7-cfr/273/7#state_agency_et_grant_administration
    reason: Paragraph (d) governs Federal financial participation and grants for E&T
      programs. This module does not encode grant allocation or State administrative
      funding rules.
  - output: us:regulations/7-cfr/273/7/e#employment_and_training_program_requirements
    blocked_by:
    - us:regulations/7-cfr/273/7#state_agency_et_program_design
    reason: Paragraph (e) governs State E&T program components, participant screening,
      and provider responsibilities. This module treats E&T participation as an input
      to person-level compliance; detailed E&T program administration is deferred.
  - output: us:regulations/7-cfr/273/7/f#work_requirement_noncompliance_disqualification
    blocked_by:
    - us:regulations/7-cfr/273/7#work_requirement_sanction_and_good_cause_context
    reason: Paragraph (f) governs refusal or failure to comply, good cause, and disqualification
      periods. This module encodes current compliance as a predicate; sanction timing
      and good-cause adjudication are deferred.
  - output: us:regulations/7-cfr/273/7/g#ending_work_requirement_disqualification
    blocked_by:
    - us:regulations/7-cfr/273/7#work_requirement_disqualification_reentry_context
    reason: Paragraph (g) governs when participation may resume after a work requirement
      disqualification. This reentry workflow is deferred until disqualification period
      tracking is encoded.
  - output: us:regulations/7-cfr/273/7/k#employment_initiatives_program
    blocked_by:
    - us:regulations/7-cfr/273/7#state_agency_employment_initiatives_program_context
    reason: Paragraph (k) governs optional State employment initiatives programs.
      This module does not encode that program election or its cash-equivalent benefit
      administration.
  - output: us:regulations/7-cfr/273/7/m#optional_workfare_program
    blocked_by:
    - us:regulations/7-cfr/273/7#state_agency_optional_workfare_program_context
    reason: Paragraph (m) governs optional SNAP workfare program operation. This module
      consumes workfare participation as a compliance input; program operation and
      assignment rules are deferred.
  - output: us:regulations/7-cfr/273/7/n#workforce_partnership_requirements
    blocked_by:
    - us:regulations/7-cfr/273/7#state_agency_workforce_partnership_context
    reason: Paragraph (n) governs workforce partnership requirements and reporting.
      This module does not encode workforce partnership administration.
  summary: |-
    7 CFR 273.7 makes non-exempt SNAP household members comply with general
    work requirements and exempts specified persons. Paragraph (j) makes a
    non-exempt person ineligible for voluntarily quitting qualifying work or
    voluntarily reducing work below 30 hours without good cause during a
    State-selected 30-to-60-day pre-application lookback or afterward. The
    paragraph (j) determinations below incorporate the good-cause grounds in
    paragraph (i), the qualifying-work and wage-equivalent thresholds, and the
    express quit and reduced-effort exceptions.
  source_verification:
    corpus_citation_path: us/regulation/7/273/7
rules:
