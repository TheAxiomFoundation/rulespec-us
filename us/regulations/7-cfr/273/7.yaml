      member_was_federal_state_or_local_government_employee
      and member_participated_in_strike_against_that_government
      and member_was_dismissed_for_participating_in_strike
- name: snap_member_voluntary_quit_without_good_cause
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(2)(i), 7 CFR 273.7(j)(3)(ii), 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(j)(2)(i), (3)(ii), (3)(v)
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      snap_member_job_change_within_voluntary_quit_review_period
      and (
          member_pre_quit_weekly_work_hours >= snap_voluntary_quit_weekly_hours_threshold
          or member_pre_quit_weekly_earnings >= federal_minimum_wage * snap_voluntary_quit_weekly_hours_threshold
      )
      and not snap_member_prior_quit_exception_after_comparable_job_loss
      and (
          snap_member_government_strike_dismissal_counts_as_voluntary_quit_without_good_cause
          or (
              member_voluntarily_quit_job
              and not member_terminated_self_employment_enterprise
              and not member_resigned_at_employer_demand
              and not snap_member_voluntary_quit_good_cause_applies
          )
      )
- name: snap_member_voluntary_work_effort_reduction_without_good_cause
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(2)(ii), 7 CFR 273.7(j)(3)(iii), 7 CFR 273.7(j)(3)(v)
