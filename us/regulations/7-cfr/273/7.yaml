    formula: |-
      (
          snap_state_voluntary_quit_lookback_period_valid
          and member_job_change_occurred_before_application
          and member_job_change_days_before_application >= 0
          and member_job_change_days_before_application <= state_agency_voluntary_quit_lookback_days
      )
      or member_job_change_occurred_on_or_after_application
- name: snap_member_work_requirement_good_cause_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(i)(1)-(2), 7 CFR 273.7(i)(4), incorporated by 7 CFR 273.7(f)(1) and 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
