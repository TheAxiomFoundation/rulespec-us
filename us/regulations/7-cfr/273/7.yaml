          member_work_requirement_noncompliance_occurrence_count == 2
          and state_agency_selected_work_requirement_disqualification_months >= snap_second_work_requirement_disqualification_minimum_months
          and state_agency_selected_work_requirement_disqualification_months <= snap_second_work_requirement_disqualification_maximum_months
      )
