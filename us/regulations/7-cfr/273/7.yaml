- name: snap_member_job_change_within_voluntary_quit_review_period
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.7(j)(1), 7 CFR 273.7(j)(2), 7 CFR 273.7(j)(3)(ii)-(iv)
  metadata:
