- name: snap_work_requirement_good_cause_child_care_maximum_age_exclusive
  kind: parameter
  dtype: Count
  source: 7 CFR 273.7(i)(2), incorporated by 7 CFR 273.7(j)(3)(v)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/regulation/7/273/7
          span: 7 CFR 273.7(i)(2)
  versions:
  - effective_from: '2025-10-01'
