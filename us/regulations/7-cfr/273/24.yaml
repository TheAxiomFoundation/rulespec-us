format: rulespec/v1
module:
  deferred_outputs:
  - output: us:regulations/7-cfr/273/24/j#snap_eligibility_subject_to_other_program_rules
    blocked_by:
    - us:regulations/7-cfr/273#snap_eligibility_under_other_program_rules
    reason: Paragraph (j) confirms that satisfying this ABAWD time-limit section does
      not independently make an individual eligible under other SNAP provisions. This
      module returns work-requirement eligibility only; full SNAP eligibility composition
      across all other program rules is deferred.
  summary: |-
    7 CFR 273.24 limits SNAP eligibility for able-bodied adults unless they
    fulfill the ABAWD work requirement, qualify for an exception, waiver, or
    State discretionary exemption, have not exceeded the countable-month
    limit, or have regained eligibility. Paragraph (g) permits a State agency
    to provide a covered individual a discretionary exemption, limits the
    fiscal-year average monthly exemptions in effect to 8 percent of FNS's
    adjusted estimate of covered individuals, and prohibits discriminatory
    administration. This module composes the time-limit rule with the general
    work requirement in 7 CFR 273.7.
  source_verification:
    corpus_citation_path: us/regulation/7/273/24
imports:
- us:regulations/7-cfr/273/7
