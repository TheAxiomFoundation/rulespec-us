format: rulespec/v1
module:
  deferred_outputs:
    - output: us:regulations/7-cfr/273/4/c/2#snap_multiple_affidavit_sponsor_income_and_resource_combination
      blocked_by:
        - us:regulations/7-cfr/273/4#multiple_affidavit_sponsor_combination_context
      reason: >-
        Paragraph (c)(2) states its formula for one sponsor and a qualifying
        spouse and supplies no ordering or combination rule when more than one
        person has executed an affidavit for the same alien. The child module
        therefore evaluates one sponsor-affidavit unit; multi-sponsor
        aggregation remains deferred rather than inferred.
    - output: us:regulations/7-cfr/273/4/c/3/iv#snap_indigence_notification_consent_and_nondisclosure_process
      blocked_by:
        - us:regulations/7-cfr/273/4#state_agency_sponsor_case_management_context
        - us:regulations/7-cfr/273/11/c#snap_nonhousehold_member_treatment_context
      reason: >-
        Paragraph (c)(3)(iv)'s indigence computation and twelve-month deeming
        rule are encoded in the child module. Attorney General notification,
        an optional consent-based nondisclosure process, and the ineligibility
        and remaining-household consequences of withheld consent require
        agency workflow and section 273.11(c) household-treatment context.
    - output: us:regulations/7-cfr/273/4/c/4#snap_eligible_sponsored_alien_information_and_change_reporting_compliance
      blocked_by:
        - us:regulations/7-cfr/273/4#state_agency_sponsor_case_management_context
      reason: >-
        Paragraph (c)(4)'s entire-attribution consequence while information
        about other sponsored aliens is missing is encoded in the child
        computation module. The alien's duties to obtain sponsor cooperation,
        provide documentation at application and recertification, and report
        sponsor changes require certification case-management state.
    - output: us:regulations/7-cfr/273/4/c/5#snap_sponsored_alien_awaiting_verification_ineligibility_and_remaining_household_treatment
      blocked_by:
        - us:regulations/7-cfr/273/4#state_agency_sponsor_case_management_context
        - us:regulations/7-cfr/273/11/c#snap_nonhousehold_member_treatment_context
      reason: >-
        Paragraph (c)(5) makes a sponsored alien awaiting required information
        or verification ineligible and governs the resulting treatment of the
        remaining household. It requires verification workflow and ineligible-
        alien household-composition rules outside the deeming computation.
    - output: us:regulations/7-cfr/273/4/c/6#snap_participating_sponsor_restitution_demand_exclusion
      blocked_by:
        - us:regulations/7-cfr/273/4#snap_sponsor_restitution_demand_context
      reason: >-
        Paragraph (c)(6) excludes a sponsor who participates in SNAP from an
        8 CFR 213a.4(a) demand for the value of benefits issued to the sponsored
        alien. That restitution-demand workflow is outside this computation.
  summary: |-
    7 CFR 273.4 makes a person eligible for SNAP only if the person is a U.S.
    citizen, U.S. non-citizen national, an enumerated eligible noncitizen, or
    a qualified alien satisfying the applicable immediate-eligibility or
    five-year-status criteria. A person who cannot or will not document alien
    status is classified as ineligible. Paragraph (c) sponsored-alien income
    and resource deeming is encoded in the child module at 273/4/c; the
    remaining State-agency procedure and restitution duties are deferred.
  source_verification:
    corpus_citation_path: us/regulation/7/273/4
rules:
  - name: snap_member_citizen_or_national_status_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.4(a)(1)-(2)
    versions:
      - effective_from: '2025-10-01'
        formula: member_is_us_citizen or member_is_us_noncitizen_national
  - name: snap_member_special_nonqualified_alien_status_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.4(a)(3)-(5)
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          member_is_american_indian_born_in_canada_or_recognized_indian_tribe_member
          or member_is_hmong_or_highland_laotian_qualifying_person_or_family_member
          or member_is_trafficking_victim_or_qualifying_family_member
  - name: snap_member_qualified_alien_immediately_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.4(a)(6)(ii)
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          member_is_qualified_alien_with_forty_qualifying_quarters
          or member_is_refugee
          or member_is_asylee
          or member_has_deportation_or_removal_withheld
          or member_is_cuban_or_haitian_entrant
          or member_is_amerasian_immigrant
          or member_has_eligible_military_connection
          or member_receives_blindness_or_disability_benefits
          or member_was_lawfully_residing_on_1996_08_22_and_born_on_or_before_1931_08_22
          or member_is_under_age_eighteen
  - name: snap_member_qualified_alien_after_wait_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.4(a)(6)(iii)
    versions:
      - effective_from: '2025-10-01'
        formula: member_is_qualified_alien_subject_to_five_year_wait and qualified_alien_five_year_status_period_met
  - name: snap_member_qualified_alien_status_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.4(a)(6)
    versions:
      - effective_from: '2025-10-01'
        formula: snap_member_qualified_alien_immediately_eligible or snap_member_qualified_alien_after_wait_eligible
  - name: snap_member_alien_status_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.4(a), 7 CFR 273.4(b)(2)
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          (
              snap_member_special_nonqualified_alien_status_eligible
              or snap_member_qualified_alien_status_eligible
          )
          and not alien_status_documentation_missing_or_unwilling
  - name: snap_member_citizenship_or_alien_status_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.4(a), 7 CFR 273.4(b)(2)
    versions:
      - effective_from: '2025-10-01'
        formula: snap_member_citizen_or_national_status_eligible or snap_member_alien_status_eligible
