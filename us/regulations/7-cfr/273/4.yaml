          corpus_citation_path: us/regulation/7/273/4
          excerpt: A U.S. non-citizen national
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: classify that person as an ineligible alien
  versions:
  - effective_from: '0001-01-01'
