format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/4
    source_sha256: 846140bd0e210be0f69a81dc1006c3914c81b0dd7faebedcdd978be7526601b3
  summary: 'No person is eligible to participate in the Program unless that person

    meets citizenship or alien-status requirements. A person unable or

    unwilling to document alien status must be classified as an ineligible

    alien. Paragraph (c) governs sponsored-alien income and resource deeming.'
  deferred_outputs:
  - output: us:regulations/7-cfr/273/4/b#reporting_illegal_aliens
    reason: Paragraph (b)(1) requires immediate notification to the local USCIS office
      after a State-agency certification or recertification determination. The State-agency
      case-action, determination, and notification workflow is not represented by
      an available executable RuleSpec entity or dependency.
  - output: us:regulations/7-cfr/273/4/c#deferred_c
    reason: Generated module encodes the supported rules from this source, but this
      source subparagraph depends on policy surfaces or entities that are not available
      in the current RuleSpec context. It is deferred instead of being modeled as
      a caller-supplied input or an unsupported local entity.
rules:
- name: snap_member_citizen_or_national_status_eligible
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 7 CFR 273.4(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: A U.S. citizen
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/7/273/4
          excerpt: A U.S. non-citizen national
  versions:
  - effective_from: '2025-10-01'
    formula: 'member_is_us_citizen

      or member_is_us_noncitizen_national'
- name: legacy_citizenship_or_alien_status_eligible
