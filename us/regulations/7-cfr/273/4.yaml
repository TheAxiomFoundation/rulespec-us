format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/4
    source_sha256: 846140bd0e210be0f69a81dc1006c3914c81b0dd7faebedcdd978be7526601b3
  summary: '“No person is eligible to participate in the Program unless that person”
    is

    a U.S. citizen, a U.S. non-citizen national, or satisfies an eligible alien

    path. A person unable or unwilling to provide alien-status documentation is

    classified as an ineligible alien. Paragraph (c) defines sponsored aliens

    and requires sponsor income and resource deeming subject to listed exemptions.'
  deferred_outputs:
  - output: us:regulations/7-cfr/273/4/b#illegal-alien-reporting-and-documentation-administration
    reason: Paragraph (b) imposes State-agency reporting, classification, and documentation-handling
      duties. The person-level documentation consequence is consumed by the eligibility
      rules; reporting and case-administration workflow require a State-agency certification
      context not represented here.
  - output: us:regulations/7-cfr/273/4/c#sponsored-alien-income-and-resource-deeming
    reason: Paragraph (c) requires household-level sponsor-income and resource deeming,
      allocation among sponsored aliens, indigence determinations, verification handling,
      notices, and restitution administration. The required household, sponsor, and
      certification-process relations are not available in this source slice.
  - output: us:regulations/7-cfr/273/4/c#deferred_c
    reason: Generated module encodes the supported rules from this source, but this
      source subparagraph depends on policy surfaces or entities that are not available
      in the current RuleSpec context. It is deferred instead of being modeled as
      a caller-supplied input or an unsupported local entity.
