format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/4
    source_sha256: 846140bd0e210be0f69a81dc1006c3914c81b0dd7faebedcdd978be7526601b3
  summary: '“No person is eligible to participate in the Program unless that person”

    is a U.S. citizen, U.S. non-citizen national, or has a qualifying status.

    A person unable or unwilling to provide alien-status documentation must be

    classified as an ineligible alien. Paragraph (c) prescribes sponsored-alien

    sponsor-income and resource deeming.'
  deferred_outputs:
  - output: us:regulations/7-cfr/273/4/b#illegal_alien_reporting_and_documentation_administration
    reason: Paragraph (b) imposes State-agency reporting, classification, and documentation-processing
      duties. The member-level documentation bar is applied in the encoded eligibility
      rules, but the State-agency workflow, immediate USCIS notification, and no-further-documentation-efforts
      process are not computable person-level outputs.
  - output: us:regulations/7-cfr/273/4/c#sponsored_alien_income_and_resource_deeming
    reason: Paragraph (c) requires household-level sponsor income and resource attribution,
      affidavit-of-support verification, allocation among other sponsored aliens,
      and integration with the income and resource rules in 7 CFR 273.8, 273.9, 273.11,
      273.12, and 273.21. Those household budgeting and administrative dependencies
      are not available in the supplied RuleSpec context.
  - output: us:regulations/7-cfr/273/4/c#deferred_c
    reason: Generated module encodes the supported rules from this source, but this
      source subparagraph depends on policy surfaces or entities that are not available
      in the current RuleSpec context. It is deferred instead of being modeled as
      a caller-supplied input or an unsupported local entity.
