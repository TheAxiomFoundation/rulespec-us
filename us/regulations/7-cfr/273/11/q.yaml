format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(q) permits a State agency to disqualify an individual who is
    delinquent on a court-ordered child-support payment. A State may limit the
    option to non-custodial parents. The disqualification does not apply while
    a court permits delayed payment, the individual complies with a qualifying
    payment plan, or the State agency finds good cause for non-support.
    Collection actions and household notices are not encoded.
rules:
  - name: snap_child_support_arrears_disqualification_applies_to_member
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(q)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                At the option of a State agency, no individual shall be eligible
                to participate in SNAP as a member of any household during any
                month that the individual is delinquent in any payment due under
                a court order for the support of a child of the individual.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State agency may opt to apply this provision to only
                non-custodial parents.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          state_agency_elected_child_support_arrears_disqualification
          and (
            not state_agency_limits_child_support_arrears_disqualification_to_non_custodial_parents
            or member_is_non_custodial_parent
          )

  - name: snap_child_support_arrears_exception_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(q)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                A disqualification under paragraph (q)(1) of this section shall
                not apply if:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: A court is allowing the individual to delay payment;
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The individual is complying with a payment plan approved by a
                court or the State agency designated under Part D of Title IV of
                the Social Security Act
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State agency determines the individual has good cause for
                non-support.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          court_allows_member_to_delay_child_support_payment
          or member_complies_with_court_or_iv_d_approved_child_support_payment_plan
          or state_agency_determined_member_has_good_cause_for_non_support

  - name: member_disqualified_under_section_273_11_paragraph_q
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(q)(1)-(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                during any month that the individual is delinquent in any
                payment due under a court order for the support of a child of
                the individual.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the State agency has elected to implement this provision and
                determines that the individual should be disqualified for child
                support arrears, then that individual shall be ineligible to
                participate in SNAP.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/q#snap_child_support_arrears_disqualification_applies_to_member
              output: snap_child_support_arrears_disqualification_applies_to_member
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/q#snap_child_support_arrears_exception_applies
              output: snap_child_support_arrears_exception_applies
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_child_support_arrears_disqualification_applies_to_member
          and member_delinquent_in_court_ordered_child_support_payment
          and not snap_child_support_arrears_exception_applies

  - name: member_eligible_under_section_273_11_paragraph_q
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(q)(1)-(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                no individual shall be eligible to participate in SNAP as a
                member of any household during any month that the individual is
                delinquent in any payment due under a court order for the
                support of a child of the individual.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/q#member_disqualified_under_section_273_11_paragraph_q
              output: member_disqualified_under_section_273_11_paragraph_q
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          not member_disqualified_under_section_273_11_paragraph_q
