format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(s) excludes an individual convicted as an adult of one of
    five specified offense categories when the conviction concerns conduct
    after February 7, 2014, and the individual is currently out of compliance
    with either the terms of the sentence or the restrictions in
    7 CFR 273.11(n). The qualifying categories are aggravated sexual abuse
    under 18 U.S.C. 2241, murder under 18 U.S.C. 1111, an offense under
    chapter 110 of title 18, a Federal or State offense involving sexual
    assault under the cited Violence Against Women Act definition, or a State
    offense the Attorney General determines is substantially similar to the
    first three categories.
imports:
  - us:regulations/7-cfr/273/11/n
rules:
  - name: snap_section_273_11_s_effective_indicator
    kind: parameter
    dtype: Integer
    source: 7 CFR 273.11(s)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                An individual shall not be eligible for SNAP benefits if:
          - path: versions[1].formula
            kind: effective_period
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                An individual shall not be eligible for SNAP benefits if:
    versions:
      - effective_from: '2008-10-01'
        formula: '0'
      - effective_from: '2019-06-14'
        formula: '1'

  - name: snap_member_has_section_273_11_s_qualifying_adult_conviction
