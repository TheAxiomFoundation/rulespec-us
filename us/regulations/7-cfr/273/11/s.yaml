                States Code;
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Murder under section 1111 of title 18, United States Code;
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                An offense under chapter 110 of title 18, United States Code;
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                A Federal or State offense involving sexual assault, as defined
                in section 40002(a) of the Violence Against Women Act of 1994
                (42 U.S.C. 13925(a)); or
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
