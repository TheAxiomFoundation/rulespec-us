format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(o) permits a State agency to disqualify a qualifying
    custodial parent, and at further State option another individual exercising
    parental control, for failure to cooperate with the State Child Support
    Agency. A person already found to be cooperating or to have good cause
    through TANF, Medicaid, or child-support assistance is treated as
    cooperating for SNAP, as is a person whom the Child Support Agency finds
    to be cooperating in good faith. Good cause includes applicable TANF or
    title IV-D criteria, domestic-violence circumstances, and other State
    criteria. The disqualification applies only while the State option and
    member-level conditions hold. Notice, referral, evidence-review, agency
    consultation, processing, fee, and requalification procedures are not
    encoded.
rules:
  - name: snap_custodial_parent_cooperation_requirement_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(o)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                At the option of a State agency, subject to paragraphs (o)(2)
                and (o)(4) of this section, no natural or adoptive parent or, at
                State agency option, other individual
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                who is living with and exercising parental control over a child
                under the age of 18 who has an absent parent
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          state_agency_elected_custodial_parent_cooperation_disqualification
          and member_lives_with_and_exercises_parental_control_over_child_under_age_18_with_absent_parent
          and (
            member_is_natural_or_adoptive_parent
            or (
              state_agency_elected_to_apply_custodial_parent_requirement_to_other_individuals
              and member_is_other_individual_exercising_parental_control
            )
          )

  - name: snap_custodial_parent_considered_cooperating
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(o)(1)(iii), (o)(1)(v)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the individual is receiving TANF or Medicaid, or assistance
                from the State Child Support Agency, and has already been
                determined to be cooperating, or has been determined to have
                good cause for not cooperating, then the State agency shall
                consider the individual to be cooperating for SNAP purposes.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                whether or not it has determined that the individual is
                cooperating in good faith.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          (
            member_receives_tanf_medicaid_or_child_support_agency_assistance
            and (
              member_already_determined_cooperating_for_tanf_medicaid_or_child_support
              or member_already_determined_good_cause_for_tanf_medicaid_or_child_support
            )
          )
          or state_child_support_agency_determined_member_cooperating_in_good_faith

  - name: snap_custodial_parent_good_cause_for_noncooperation
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(o)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Paragraph (o)(1) of this section shall not apply to the
                individual if good cause is found for refusing to cooperate, as
                determined by the State agency:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The individual meets the good cause criteria established under
                the State program funded under Part A of Title IV or Part D of
                Title IV of the Social Security Act
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Cooperating with the State Child Support Agency would make it
                more difficult for the individual to escape domestic violence
                or unfairly penalize the individual who is or has been
                victimized by such violence, or the individual who is at risk
                of further domestic violence.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The individual meets any other good cause criteria identified
                by the State agency.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          state_agency_determined_member_meets_tanf_or_iv_d_good_cause_criteria
          or state_agency_determined_cooperation_would_impede_escape_from_domestic_violence_or_penalize_victim_or_risk_further_violence
          or state_agency_determined_member_meets_other_good_cause_criteria

  - name: member_disqualified_under_section_273_11_paragraph_o
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(o)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the State agency has elected to implement this provision and
                determines that the individual has not cooperated without good
                cause, then that individual shall be ineligible to participate
                in SNAP.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/o#snap_custodial_parent_cooperation_requirement_applies
              output: snap_custodial_parent_cooperation_requirement_applies
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/o#snap_custodial_parent_considered_cooperating
              output: snap_custodial_parent_considered_cooperating
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/o#snap_custodial_parent_good_cause_for_noncooperation
              output: snap_custodial_parent_good_cause_for_noncooperation
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_custodial_parent_cooperation_requirement_applies
          and state_agency_determined_member_has_not_cooperated
          and not snap_custodial_parent_considered_cooperating
          and not snap_custodial_parent_good_cause_for_noncooperation

  - name: member_eligible_under_section_273_11_paragraph_o
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(o)(1), (o)(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                shall be eligible to participate in SNAP unless the individual
                cooperates with the agency administering a State Child Support
                Enforcement Program
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The period of disqualification ends once it has been determined
                that the individual is cooperating with the State Child Support
                Agency.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/o#member_disqualified_under_section_273_11_paragraph_o
              output: member_disqualified_under_section_273_11_paragraph_o
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          not member_disqualified_under_section_273_11_paragraph_o
