format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(j) prevents a SNAP allotment from increasing when a current
    SNAP member's means-tested public-assistance benefits are reduced for fraud
    or refusal to perform a substantive required action. The rule excludes
    initial applications, benefit time limits, family caps, reapplication
    failures, inability rather than refusal, and purely procedural failures.
    A State may also impose a penalty not exceeding 25 percent of the regular
    SNAP allotment calculated using actual reduced income. The prohibition
    follows an individual within a State but not to a new State and ends when
    the assistance reduction ends, the person becomes ineligible for the
    assistance program for another reason, or the assistance case closes.
    Paragraph (j)(4) also limits the reduction produced by a State's Title IV-A
    budgeting procedure to 25 percent of the regular SNAP allotment.
rules:
  - name: snap_public_assistance_violation_maximum_penalty_rate
    kind: parameter
    dtype: Rate
    source: 7 CFR 273.11(j)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the State agency may impose a penalty on the household that
                represents a percentage of the SNAP allotment that does not
                exceed 25 percent
    versions:
      - effective_from: '2008-10-01'
        formula: '0.25'

  - name: snap_public_assistance_reduction_rule_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(j), (j)(2), (j)(5)-(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the benefits of a household that is receiving public
                assistance are reduced under a Federal, State, or local
                means-tested public assistance program because of the failure
                of a SNAP household member to perform an action required under
                the assistance program or for fraud
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State agency shall not apply this provision to individuals
                who fail to perform a required action at the time the
                individual initially applies for assistance.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Reaching a time limit for time-limited benefits, having a child
                that is not eligible because of a family cap, failing to
                reapply or complete the application process for continued
                assistance ... or failing to comply with a purely procedural
                requirement, shall not be considered a failure
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If such individual moves to a new State the prohibition on
                increasing benefits shall not be applied.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State agency must lift the ban on increasing SNAP benefits
                if ... the person's assistance case is closed.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          household_receiving_means_tested_public_assistance_when_reduction_imposed
          and individual_certified_for_snap_at_time_of_required_action_failure
          and assistance_reduction_was_for_fraud_or_refusal_of_substantive_required_action
          and not assistance_reduction_was_for_time_limit
          and not assistance_reduction_was_for_family_cap
          and not assistance_reduction_was_for_reapplication_or_continued_assistance_application_failure
          and not assistance_reduction_was_for_inability_rather_than_refusal
          and not assistance_reduction_was_for_purely_procedural_requirement
          and not required_action_failure_occurred_at_initial_assistance_application
          and public_assistance_reduction_or_sanction_currently_active
          and person_remains_eligible_for_assistance_program_for_other_reasons
          and not assistance_case_closed
          and not individual_moved_to_new_state_after_assistance_reduction

  - name: snap_public_assistance_reduction_no_increase_maximum_allotment
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(j)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the State agency shall not increase the household's SNAP
                allotment as the result of the decrease in income
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_public_assistance_reduction_rule_applies:
            min(
              max(0, snap_allotment_before_public_assistance_reduction),
              max(0, regular_snap_allotment_using_actual_reduced_income)
            )
          else: max(0, regular_snap_allotment_using_actual_reduced_income)

  - name: snap_title_iv_a_maximum_allotment_reduction_rate
    kind: parameter
    dtype: Rate
    source: 7 CFR 273.11(j)(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the SNAP allotment may not be reduced by more than 25 percent
    versions:
      - effective_from: '2008-10-01'
        formula: '0.25'

  - name: snap_title_iv_a_minimum_allotment_under_reduction_cap
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(j)(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the SNAP allotment may not be reduced by more than 25 percent
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if (
            snap_public_assistance_reduction_rule_applies
            and assistance_reduction_is_under_title_iv_a
            and state_uses_title_iv_a_no_increase_budgeting_procedure
          ):
            (
              1 - snap_title_iv_a_maximum_allotment_reduction_rate
            ) * max(0, regular_snap_allotment_using_actual_reduced_income)
          else: 0

  - name: snap_public_assistance_reduction_allotment_before_optional_penalty
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(j)(3)-(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State agency shall determine how to prevent an increase in
                SNAP benefits.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the State agency may use the same procedures that apply under
                Title IV-A to prevent an increase in SNAP benefits ... but the
                SNAP allotment may not be reduced by more than 25 percent
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if (
            snap_public_assistance_reduction_rule_applies
            and assistance_reduction_is_under_title_iv_a
            and state_uses_title_iv_a_no_increase_budgeting_procedure
          ):
            min(
              snap_public_assistance_reduction_no_increase_maximum_allotment,
              max(
                snap_title_iv_a_minimum_allotment_under_reduction_cap,
                state_calculated_allotment_under_title_iv_a_no_increase_budgeting_procedure
              )
            )
          else:
            if (
              snap_public_assistance_reduction_rule_applies
              and state_uses_paragraph_j_3_no_increase_method
            ):
              min(
                snap_public_assistance_reduction_no_increase_maximum_allotment,
                max(
                  0,
                  state_calculated_allotment_under_paragraph_j_3_no_increase_method
                )
              )
            else: snap_public_assistance_reduction_no_increase_maximum_allotment

  - name: snap_public_assistance_violation_penalty_rate_applied
    kind: derived
    entity: Household
    dtype: Rate
    period: Month
    source: 7 CFR 273.11(j)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the State agency may impose a penalty on the household that
                represents a percentage of the SNAP allotment that does not
                exceed 25 percent
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if (
            snap_public_assistance_reduction_rule_applies
            and state_elects_optional_public_assistance_violation_snap_penalty
          ):
            min(
              snap_public_assistance_violation_maximum_penalty_rate,
              max(0, state_public_assistance_violation_snap_penalty_rate)
            )
          else: 0

  - name: snap_public_assistance_violation_penalty_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(j)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The 25 percent reduction in SNAP benefits must be based on the
                amount of SNAP benefits the household should have received
                under the regular SNAP benefit formula, taking into account its
                actual (reduced) income.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_public_assistance_violation_penalty_rate_applied
          * max(0, regular_snap_allotment_using_actual_reduced_income)

  - name: snap_allotment_after_public_assistance_reduction_rule
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(j)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                In addition to prohibiting an increase in SNAP benefits, the
                State agency may impose a penalty on the household
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          max(
            0,
            snap_public_assistance_reduction_allotment_before_optional_penalty
            - snap_public_assistance_violation_penalty_amount
          )
