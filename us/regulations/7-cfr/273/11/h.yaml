format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(h) permits a homeless SNAP household to use SNAP benefits for
    prepared meals when the meal provider is authorized by FNS under
    7 CFR 278.1(h).
rules:
  - name: snap_homeless_household_prepared_meal_purchase_allowed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(h)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Homeless SNAP households shall be permitted to use their SNAP
                benefits to purchase prepared meals from homeless meal
                providers authorized by FNS under § 278.1(h).
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          household_is_homeless_snap_household
          and homeless_meal_provider_fns_authorized_under_section_278_1_h
