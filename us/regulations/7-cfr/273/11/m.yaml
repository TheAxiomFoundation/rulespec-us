format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(m) excludes a household member convicted under Federal or
    State law of a jurisdiction-classified felony having possession, use, or
    distribution of a controlled substance as an element when the conviction
    is based on behavior after August 22, 1996. The exclusion does not apply
    when legislation in the member's State of domicile exempts the member. If
    applicable State legislation instead limits the disqualification period,
    the exclusion applies only while that State-law period remains active.
rules:
  - name: member_ineligible_for_felony_drug_conviction
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(m)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                An individual convicted (under Federal or State law) of any
                offense which is classified as a felony by the law of the
                jurisdiction involved and which has as an element the
                possession, use, or distribution of a controlled substance
                (as defined in section 102(6) of the Controlled Substance Act,
                21 U.S.C. 802(6)) shall not be considered an eligible household
                member unless the State legislature of the State where the
                individual is domiciled has enacted legislation exempting
                individuals domiciled in the State from the above exclusion.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the State legislature has enacted legislation limiting the
                period of disqualification, the period of ineligibility shall
                be equal to the length of the period provided under such
                legislation.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Ineligibility under this provision is only limited to
                convictions based on behavior which occurred after August 22,
                1996.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          member_convicted_under_federal_or_state_law
          and conviction_offense_is_classified_as_felony_by_jurisdiction
          and conviction_offense_has_element_of_possession_use_or_distribution_of_controlled_substance
          and conviction_is_based_on_behavior_after_1996_08_22
          and not applicable_state_legislation_exempts_member_from_drug_felony_exclusion
          and (
            not applicable_state_legislation_limits_drug_felony_disqualification_period
            or member_is_within_applicable_state_drug_felony_disqualification_period
          )

