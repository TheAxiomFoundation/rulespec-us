format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(f) permits blind or disabled residents of qualifying group
    living arrangements to apply through the arrangement, through a
    representative of their choice, or on their own behalf when the arrangement
    determines that they can handle their affairs. Residents applying through
    the arrangement's representative are treated as one-person households;
    other applicants use the ordinary household definition. FNS
    disqualification suspends the arrangement's representative status, while
    qualifying residents applying on their own behalf can continue if
    otherwise eligible. On departure, unspent debited benefits are returned in
    full. When benefits
    were spent, a resident leaving before the sixteenth receives half the
    monthly allotment, or a pro rata share of half for a member of residents
    certified as one household; a resident leaving on or after the sixteenth
    receives no additional benefits.
rules:
  - name: snap_gla_departure_day_half_allotment_cutoff
    kind: parameter
    dtype: Count
    source: 7 CFR 273.11(f)(6)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the household leaves the GLA prior to the 16th day of the
                month
    versions:
      - effective_from: '2008-10-01'
        formula: '16'

  - name: snap_gla_departure_half_allotment_rate
    kind: parameter
    dtype: Rate
    source: 7 CFR 273.11(f)(6)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the facility shall provide the household with its EBT card (if
                applicable) and one-half of its monthly benefit allotment
    versions:
      - effective_from: '2008-10-01'
        formula: '0.5'

  - name: snap_gla_resident_special_application_allowed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(f)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                may apply either through use of an authorized representative
                employed and designated by the group living arrangement or on
                their own behalf or through an authorized representative of
                their choice.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The GLA must determine if a resident may apply on his or her own
                behalf based on the resident's physical and mental ability to
                handle his or her own affairs.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          resident_is_disabled_or_blind
          and residence_meets_group_living_arrangement_definition
          and (
            resident_applies_through_gla_authorized_representative
            or resident_applies_through_authorized_representative_of_choice
            or (
              resident_applies_on_own_behalf
              and gla_determined_resident_can_handle_own_affairs
            )
          )

  - name: snap_gla_qualifies_for_resident_certification
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(f)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                the State agency must verify that the GLA is authorized by FNS
                or is certified by the appropriate agency of the State ...
                including the agency's determination that the center is a
                nonprofit organization
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          gla_fns_authorized
          or (
            gla_certified_by_appropriate_state_agency
            and state_agency_determined_gla_is_nonprofit
          )

  - name: snap_gla_resident_special_certification_conditions_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(f)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Prior to certifying any residents, the State agency must verify
                that the GLA is authorized by FNS or is certified by the
                appropriate agency of the State
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If FNS disqualifies the GLA as an authorized retail food store,
                the State agency must suspend its authorized representative
                status for the same time; but residents applying on their own
                behalf will still be able to participate if otherwise eligible.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_gla_resident_special_application_allowed
          and (
            (
              resident_applies_through_gla_authorized_representative
              and snap_gla_qualifies_for_resident_certification
              and not gla_fns_disqualified
            )
            or (
              not resident_applies_through_gla_authorized_representative
              and resident_applies_through_authorized_representative_of_choice
              and snap_gla_qualifies_for_resident_certification
            )
            or (
              not resident_applies_through_gla_authorized_representative
              and resident_applies_on_own_behalf
              and not gla_fns_disqualified
              and snap_gla_qualifies_for_resident_certification
            )
            or (
              not resident_applies_through_gla_authorized_representative
              and snap_independently_applying_gla_resident_may_continue_after_gla_fns_disqualification
            )
          )

  - name: snap_gla_resident_certification_household_size
    kind: derived
    entity: Household
    dtype: Count
    period: Month
    source: 7 CFR 273.11(f)(1)(i)-(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the residents apply on their own behalf, the household size
                must be in accordance with the definition in § 273.1.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the residents apply through the use of the GLA's authorized
                representative, their eligibility must be determined as a
                one-person household.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_gla_resident_special_certification_conditions_satisfied:
            if resident_applies_through_gla_authorized_representative:
              1
            else: max(0, resident_household_size_under_section_273_1)
          else: 0

  - name: snap_independently_applying_gla_resident_may_continue_after_gla_fns_disqualification
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(f)(1)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                residents applying on their own behalf will still be able to
                participate if otherwise eligible
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          resident_is_disabled_or_blind
          and residence_meets_group_living_arrangement_definition
          and not resident_applies_through_gla_authorized_representative
          and resident_applies_on_own_behalf
          and gla_determined_resident_can_handle_own_affairs
          and gla_fns_disqualified
          and resident_otherwise_snap_eligible

  - name: snap_gla_unspent_benefits_returned_at_departure
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(f)(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If, at the time the household leaves, no benefits have been
                spent on behalf of that individual household, the facility
                must return the full value of any benefits already debited
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if (
            not household_departed_from_group_living_arrangement
            or any_current_month_gla_benefits_spent_on_household_behalf
          ):
            0
          else: max(0, current_month_benefits_already_debited_by_gla)

  - name: snap_gla_spent_benefits_provided_at_departure
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(f)(6)(i)-(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the household leaves the GLA prior to the 16th day of the
                month, the facility shall provide the household with ... one-half
                of its monthly benefit allotment.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The facility shall return a pro rata share of one-half of the
                household's benefit allotment
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                leaves on or after the 16th day of the month and the benefits
                have already been debited and used, the household or individual
                does not receive any benefits
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if (
            household_departed_from_group_living_arrangement
            and any_current_month_gla_benefits_spent_on_household_behalf
            and gla_household_departure_day_of_month < snap_gla_departure_day_half_allotment_cutoff
          ):
            if (
              departing_resident_is_member_of_group_certified_as_one_household
              and certified_group_household_member_count > 0
            ):
              snap_gla_departure_half_allotment_rate
              * gla_household_monthly_allotment
              / certified_group_household_member_count
            else:
              snap_gla_departure_half_allotment_rate
              * gla_household_monthly_allotment
          else: 0

  - name: snap_gla_departure_benefits_returned_or_provided
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(f)(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                no benefits have been spent ... return the full value ... prior
                to the 16th day ... one-half of its monthly benefit allotment
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_gla_unspent_benefits_returned_at_departure
          + snap_gla_spent_benefits_provided_at_departure
