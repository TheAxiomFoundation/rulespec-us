format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(d) governs other nonhousehold members who are not subject to
    paragraph (c). Their own income and resources are unavailable to the SNAP
    household, while cash payments they make to the household count as income
    and vendor payments do not. A household may deduct the identifiable amount
    it pays toward a shared deductible expense; if contributions cannot be
    differentiated, only the household's evenly prorated share is deductible.
    Similarly, a household's identified share of a wage combined with a
    nonhousehold member's wage counts as earned income, or the combined wage is
    evenly prorated when the shares cannot be identified. Other nonhousehold
    members are excluded from household size for benefit, income-standard, and
    resource-limit purposes.
imports:
  - us:regulations/7-cfr/273/11/c#snap_member_is_specifically_mentioned_in_paragraph_c
rules:
  - name: snap_other_nonhousehold_member_treatment_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: For all other nonhousehold members defined in § 273.1 (b)(1) and (b)(2) who are not specifically mentioned in paragraph (c) of this section
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/c#snap_member_is_specifically_mentioned_in_paragraph_c
              output: snap_member_is_specifically_mentioned_in_paragraph_c
              hash: sha256:a8cada663af98c9bfc67bed37507817d607c5551ab1162334cc4a3c81106a3f4
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          member_is_other_nonhousehold_member_under_section_273_1_b_1_or_b_2
          and not snap_member_is_specifically_mentioned_in_paragraph_c

