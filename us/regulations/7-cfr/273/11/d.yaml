            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Cash payments from the nonhousehold member
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/d#snap_other_nonhousehold_member_treatment_applies
              output: snap_other_nonhousehold_member_treatment_applies
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_other_nonhousehold_member_treatment_applies:
            cash_payment_from_evaluated_other_nonhousehold_member_to_household
          else: 0

  - name: snap_other_nonhousehold_member_cash_payment_countable_income
