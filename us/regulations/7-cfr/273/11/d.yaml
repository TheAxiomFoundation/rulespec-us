  - name: snap_household_share_of_shared_deductible_expenses
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(d)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: only the amount actually paid or contributed by the household shall be deducted as a household expense
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: If the payments or contributions cannot be differentiated, the expenses shall be prorated evenly among persons actually paying or contributing to the expense and only the household's pro rata share deducted
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if not snap_other_nonhousehold_member_treatment_applies:
            0
          else:
            if shared_expense_contributions_can_be_differentiated:
              household_actual_payment_or_contribution_to_shared_deductible_expenses
            else:
              if shared_expense_payer_or_contributor_count > 0:
                total_shared_deductible_expenses
                * household_shared_expense_payer_or_contributor_count
                / shared_expense_payer_or_contributor_count
              else: 0

  - name: snap_household_share_of_combined_wage_earned_income
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(d)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: If the household's share can be identified, the State agency shall count that portion due to the household as earned income
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: If the household's share cannot be identified the State agency shall prorate the earned income among all those whom it was intended to cover and count that prorated portion to the household
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if not snap_other_nonhousehold_member_treatment_applies:
            0
          else:
            if combined_wage_household_share_can_be_identified:
              combined_wage_amount_due_to_household_members
            else:
              if combined_wage_person_count > 0:
                total_combined_wage_earned_income
                * combined_wage_household_member_count
                / combined_wage_person_count
              else: 0

  - name: snap_household_size_excluding_other_nonhousehold_members
    kind: derived
    entity: Household
    dtype: Count
    period: Month
    source: 7 CFR 273.11(d)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Such nonhousehold members shall not be included when determining the size of the household
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_other_nonhousehold_member_treatment_applies:
            max(
              0,
              household_person_count_including_other_nonhousehold_members
              - other_nonhousehold_member_count
            )
          else:
            household_person_count_including_other_nonhousehold_members
