format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(d) governs other nonhousehold members who are not subject to
    paragraph (c). Applicability and cash-payment contributions are evaluated
    for each related person, then aggregated to the household through the
    household-membership relation. Their own income and resources are
    unavailable to the SNAP household, while cash payments they make to the
    household count as income and vendor payments do not. A household may
    deduct the identifiable amount it pays toward a shared deductible expense;
    if contributions cannot be differentiated, only the household's evenly
    prorated share is deductible. Similarly, a household's identified share of
    a wage combined with a nonhousehold member's wage counts as earned income,
    or the combined wage is evenly prorated when the shares cannot be
    identified. Other nonhousehold members are excluded from household size
    for benefit, income-standard, and resource-limit purposes.
imports:
  - us:regulations/7-cfr/273/11/c#snap_member_is_specifically_mentioned_in_paragraph_c
rules:
  - name: member_of_household
    kind: data_relation
    data_relation:
      predicate: member_of_household
      arity: 2
      arguments:
        - Person
        - Household

  - name: snap_other_nonhousehold_member_treatment_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: For all other nonhousehold members defined in § 273.1 (b)(1) and (b)(2) who are not specifically mentioned in paragraph (c) of this section
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/c#snap_member_is_specifically_mentioned_in_paragraph_c
              output: snap_member_is_specifically_mentioned_in_paragraph_c
              hash: sha256:b327c045844b129fc8ec0066ca829901b8b7caa09bef04e43a470861f0d766e4
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          member_is_other_nonhousehold_member_under_section_273_1_b_1_or_b_2
          and not snap_member_is_specifically_mentioned_in_paragraph_c

  - name: snap_household_has_other_nonhousehold_member_subject_to_paragraph_d
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: For all other nonhousehold members defined in § 273.1 (b)(1) and (b)(2) who are not specifically mentioned in paragraph (c) of this section
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/d#snap_other_nonhousehold_member_treatment_applies
              output: snap_other_nonhousehold_member_treatment_applies
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          count_where(
            member_of_household,
            snap_other_nonhousehold_member_treatment_applies
          ) > 0

