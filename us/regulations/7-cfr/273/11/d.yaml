              corpus_citation_path: us/regulation/7/273/11
              excerpt: the income and resources of such individuals shall not be considered available to the household with whom the individual resides
    versions:
      - effective_from: '2008-10-01'
        formula: '0'

  - name: snap_other_nonhousehold_members_countable_own_resources
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(d)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: the income and resources of such individuals shall not be considered available to the household with whom the individual resides
