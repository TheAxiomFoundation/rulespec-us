    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Cash payments from the nonhousehold member to the household will be considered income under the normal income standards set in § 273.9(b)
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/d#snap_other_nonhousehold_member_cash_payment_countable_income_contribution
              output: snap_other_nonhousehold_member_cash_payment_countable_income_contribution
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/d#snap_other_nonhousehold_member_treatment_applies
              output: snap_other_nonhousehold_member_treatment_applies
              hash: sha256:local
