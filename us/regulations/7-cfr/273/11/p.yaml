format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(p) permits a State agency to disqualify a putative or
    identified non-custodial parent for refusing to cooperate with the State
    Child Support Agency. Refusal requires a Child Support Agency
    noncooperation finding and a State agency determination that the conduct
    demonstrates unwillingness rather than inability. Existing cooperation or
    good cause through TANF, Medicaid, or child-support assistance, and a
    current good-faith cooperation determination, prevent the disqualification.
    Notice, referral, fee, privacy, and requalification procedures are not
    encoded.
rules:
  - name: snap_non_custodial_parent_cooperation_requirement_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(p), (p)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                a “non-custodial parent” is a putative or identified parent who
                does not live with his or her child who is under the age of 18.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                At the option of a State agency, subject to paragraphs (p)(2)
                and (p)(4) of this section
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          state_agency_elected_non_custodial_parent_cooperation_disqualification
          and member_is_putative_or_identified_parent
          and member_does_not_live_with_child_under_age_18

  - name: snap_non_custodial_parent_considered_cooperating
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(p)(1)(ii), (p)(1)(v)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the individual is receiving TANF, Medicaid, or assistance
                from the State Child Support Agency, and has already been
                determined to be cooperating, or has been determined to have
                good cause for not cooperating, then the State agency shall
                consider the individual is cooperating for SNAP purposes.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                whether or not it has determined that the individual is
                cooperating in good faith.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          (
            member_receives_tanf_medicaid_or_child_support_agency_assistance
            and (
              member_already_determined_cooperating_for_tanf_medicaid_or_child_support
              or member_already_determined_good_cause_for_tanf_medicaid_or_child_support
            )
          )
          or state_child_support_agency_determined_member_cooperating_in_good_faith

  - name: snap_non_custodial_parent_refused_to_cooperate
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(p)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the State Child Support Agency determines that the individual
                is not cooperating in good faith, then the State agency will
                determine whether the non-cooperation constitutes a refusal to
                cooperate.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Refusal to cooperate is when an individual has demonstrated an
                unwillingness to cooperate as opposed to an inability to
                cooperate.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          state_child_support_agency_determined_member_not_cooperating_in_good_faith
          and state_agency_determined_noncooperation_constitutes_refusal
          and member_demonstrated_unwillingness_to_cooperate
          and not member_noncooperation_due_to_inability

  - name: member_disqualified_under_section_273_11_paragraph_p
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(p)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the State agency determines that the non-custodial parent has
                refused to cooperate, then that individual shall be ineligible
                to participate in SNAP.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/p#snap_non_custodial_parent_cooperation_requirement_applies
              output: snap_non_custodial_parent_cooperation_requirement_applies
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/p#snap_non_custodial_parent_considered_cooperating
              output: snap_non_custodial_parent_considered_cooperating
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/p#snap_non_custodial_parent_refused_to_cooperate
              output: snap_non_custodial_parent_refused_to_cooperate
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_non_custodial_parent_cooperation_requirement_applies
          and snap_non_custodial_parent_refused_to_cooperate
          and not snap_non_custodial_parent_considered_cooperating

  - name: member_eligible_under_section_273_11_paragraph_p
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(p)(1), (p)(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                shall not be eligible to participate in SNAP if the individual
                refuses to cooperate with the State agency administering the
                program established under Part D of Title IV of the Social
                Security Act
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The period of disqualification ends once it has been determined
                that the individual is cooperating with the child support
                agency.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/p#member_disqualified_under_section_273_11_paragraph_p
              output: member_disqualified_under_section_273_11_paragraph_p
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          not member_disqualified_under_section_273_11_paragraph_p
