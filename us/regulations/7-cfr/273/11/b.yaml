              corpus_citation_path: us/regulation/7/273/11
              excerpt: a standard amount based on estimated per-meal costs
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          max(
            0,
            state_estimated_per_meal_standard_amount_for_enterprises_assigned_day_care_expense_method
          )

  - name: snap_day_care_expense_method_option_selection_valid
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(b)(3)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                For income from day care, use the current reimbursement amounts
                used in the Child and Adult Care Food Program or a standard
                amount based on estimated per-meal costs.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          self_employment_enterprises_assigned_day_care_expense_method_count <= 0
          or (
            all_enterprises_assigned_day_care_expense_method_derive_income_from_day_care
            and (
              (
                state_uses_cacfp_reimbursement_for_day_care_expense_method
                and not state_uses_estimated_per_meal_standard_for_day_care_expense_method
              )
              or (
                not state_uses_cacfp_reimbursement_for_day_care_expense_method
                and state_uses_estimated_per_meal_standard_for_day_care_expense_method
              )
            )
          )

  - name: snap_boarder_expense_method_option_selection_valid
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(b)(3)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                For income from boarders, other than those in commercial
                boarding houses or from foster care boarders, use
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                provided that the method used to determine the flat amount or
                fixed percentage is objective and justifiable and is stated in
                the State's SNAP manual.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          self_employment_enterprises_assigned_boarder_expense_method_count <= 0
          or (
            all_enterprises_assigned_boarder_expense_method_are_noncommercial_nonfoster_boarders
            and (
              (
                state_uses_maximum_allotment_for_boarder_expense_method
                and not state_uses_flat_amount_for_boarder_expense_method
                and not state_uses_fixed_percentage_for_boarder_expense_method
              )
              or (
                not state_uses_maximum_allotment_for_boarder_expense_method
                and state_uses_flat_amount_for_boarder_expense_method
                and not state_uses_fixed_percentage_for_boarder_expense_method
                and state_boarder_flat_or_percentage_method_is_objective_and_justifiable
                and state_boarder_flat_or_percentage_method_is_stated_in_snap_manual
              )
              or (
                not state_uses_maximum_allotment_for_boarder_expense_method
                and not state_uses_flat_amount_for_boarder_expense_method
                and state_uses_fixed_percentage_for_boarder_expense_method
                and state_boarder_flat_or_percentage_method_is_objective_and_justifiable
                and state_boarder_flat_or_percentage_method_is_stated_in_snap_manual
              )
            )
          )

  - name: snap_self_employment_expense_method_assignment_valid
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(b)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                State agencies may elect to use actual costs for allowable
                expenses in accordance with paragraphs (b)(1) and (b)(2) of
                this section or determine self-employment expenses as follows
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Different methods may be proposed for different types of
                self-employment.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          self_employment_enterprise_count >= 0
          and every_self_employment_enterprise_has_exactly_one_assigned_expense_method
          and self_employment_enterprises_assigned_actual_cost_method_count >= 0
          and self_employment_enterprises_assigned_day_care_expense_method_count >= 0
          and self_employment_enterprises_assigned_boarder_expense_method_count >= 0
          and self_employment_enterprises_assigned_tanf_expense_method_count >= 0
          and self_employment_enterprises_assigned_fns_approved_expense_method_count >= 0
          and foster_care_boarder_self_employment_enterprise_count >= 0
          and (
            self_employment_enterprises_assigned_actual_cost_method_count
            + self_employment_enterprises_assigned_day_care_expense_method_count
            + self_employment_enterprises_assigned_boarder_expense_method_count
            + self_employment_enterprises_assigned_tanf_expense_method_count
            + self_employment_enterprises_assigned_fns_approved_expense_method_count
            + foster_care_boarder_self_employment_enterprise_count
            <= self_employment_enterprise_count
          )
          and (
            self_employment_enterprises_assigned_actual_cost_method_count
            + self_employment_enterprises_assigned_day_care_expense_method_count
            + self_employment_enterprises_assigned_boarder_expense_method_count
            + self_employment_enterprises_assigned_tanf_expense_method_count
            + self_employment_enterprises_assigned_fns_approved_expense_method_count
            + foster_care_boarder_self_employment_enterprise_count
            >= self_employment_enterprise_count
          )
          and snap_day_care_expense_method_option_selection_valid
          and snap_boarder_expense_method_option_selection_valid
          and (
            self_employment_enterprises_assigned_fns_approved_expense_method_count <= 0
            or fns_approved_expense_method_covers_all_assigned_self_employment_types
          )

  - name: snap_self_employment_expense_determination_complete
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(b)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                State agencies may elect to use actual costs for allowable
                expenses in accordance with paragraphs (b)(1) and (b)(2) of
                this section or determine self-employment expenses as follows
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                For income from foster care boarders, refer to § 273.1(c)(6).
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_self_employment_expense_method_assignment_valid
          and foster_care_boarder_self_employment_enterprise_count <= 0

  - name: snap_day_care_self_employment_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                For income from day care, use the current reimbursement amounts
                used in the Child and Adult Care Food Program or a standard
                amount based on estimated per-meal costs.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if (
            self_employment_enterprises_assigned_day_care_expense_method_count > 0
            and snap_day_care_expense_method_option_selection_valid
          ):
            if state_uses_cacfp_reimbursement_for_day_care_expense_method:
              snap_day_care_cacfp_reimbursement_method_expense
            else:
              snap_day_care_estimated_per_meal_method_expense
          else: 0

