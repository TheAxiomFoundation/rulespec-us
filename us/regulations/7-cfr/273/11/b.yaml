format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  deferred_outputs:
    - output: us:regulations/7-cfr/273/11/b/3/iii#snap_foster_care_boarder_self_employment_expense
      reason: >-
        Paragraph (b)(3)(iii) refers foster-care-boarder income treatment to
        7 CFR 273.1(c)(6), but the current 273.1 has no paragraph (c)(6).
        The stale cross-reference does not supply a current computational
        expense rule, so this branch is deferred rather than inferred.
  summary: |-
    7 CFR 273.11(b) defines allowable costs of producing SNAP
    self-employment income. Actual allowable costs include identifiable labor,
    stock, raw-material, seed and fertilizer, principal, interest, insurance,
    tax, and other business costs. Prior-period losses, income taxes,
    retirement set-asides and personal work expenses, and depreciation are
    not allowable. Boarder lodging and meal costs may not exceed the payments
    received from boarders. In place of actual costs, a State agency may use
    day-care reimbursement or per-meal standards, a maximum-allotment or
    flat/percentage method for noncommercial non-foster boarders, a TANF
    standard, or an FNS-approved amount.
rules:
  - name: snap_identifiable_allowable_nonboarder_self_employment_costs
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: identifiable costs of labor; stock; raw material; seed and fertilizer
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: payments on the principal of the purchase price of income-producing real estate and capital assets
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: interest paid to purchase income-producing property; insurance premiums; and taxes paid on income-producing property
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          self_employment_labor_costs
          + self_employment_stock_and_raw_material_costs
          + self_employment_seed_and_fertilizer_costs
          + self_employment_principal_payments_for_income_producing_property_and_assets
          + self_employment_interest_paid_to_purchase_income_producing_property
          + self_employment_insurance_premiums
          + self_employment_taxes_paid_on_income_producing_property
          + other_identifiable_allowable_self_employment_costs

  - name: snap_allowable_boarder_lodging_and_meal_cost_actual_method
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(iv)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Any amount that exceeds the payment a household receives from a boarder for lodging and meals.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          min(
            actual_boarder_lodging_and_meal_costs,
            boarder_payments_received_for_lodging_and_meals
          )

  - name: snap_actual_allowable_self_employment_costs
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Allowable costs of producing self-employment income include, but are not limited to
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Any amount that exceeds the payment a household receives from a boarder for lodging and meals.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_identifiable_allowable_nonboarder_self_employment_costs
          + snap_allowable_boarder_lodging_and_meal_cost_actual_method

  - name: snap_allowable_previous_period_net_loss_cost
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Net losses from previous periods
    versions:
      - effective_from: '2008-10-01'
        formula: '0'

  - name: snap_allowable_income_tax_retirement_and_personal_work_expense_cost
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Federal, State, and local income taxes, money set aside for retirement purposes, and other work-related personal expenses
    versions:
      - effective_from: '2008-10-01'
        formula: '0'

  - name: snap_allowable_depreciation_cost
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(iii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Depreciation
    versions:
      - effective_from: '2008-10-01'
        formula: '0'

  - name: snap_boarder_maximum_allotment_method_cost
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(iv), (b)(3)(ii)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: The maximum SNAP allotment for a household size that is equal to the number of boarders
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Any amount that exceeds the payment a household receives from a boarder for lodging and meals.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          min(
            maximum_snap_allotment_for_household_size_equal_to_number_of_boarders,
            boarder_payments_received_for_lodging_and_meals
          )

  - name: snap_boarder_flat_or_percentage_method_cost
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(iv), (b)(3)(ii)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: A flat amount or fixed percentage of the gross income
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Any amount that exceeds the payment a household receives from a boarder for lodging and meals.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          min(
            boarder_payments_received_for_lodging_and_meals,
            if state_uses_boarder_fixed_percentage_method:
              boarder_payments_received_for_lodging_and_meals
              * state_boarder_fixed_expense_rate
            else:
              state_boarder_flat_expense_amount
          )

  - name: snap_day_care_self_employment_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: use the current reimbursement amounts used in the Child and Adult Care Food Program or a standard amount based on estimated per-meal costs
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if state_uses_cacfp_day_care_expense_method:
            current_cacfp_reimbursement_amount_for_day_care
          else:
            state_day_care_expense_standard_based_on_estimated_per_meal_costs

  - name: snap_tanf_standard_self_employment_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)(iv)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Use the standard amount the State uses for its TANF program.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          state_tanf_self_employment_expense_standard

  - name: snap_fns_approved_self_employment_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)(v)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Use an amount approved by FNS.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          fns_approved_self_employment_expense_amount

  - name: snap_allowable_self_employment_costs_under_state_elected_method
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: State agencies may elect to use actual costs for allowable expenses
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: or determine self-employment expenses as follows
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if state_uses_actual_self_employment_expense_method:
            snap_actual_allowable_self_employment_costs
          else:
            if state_uses_day_care_self_employment_expense_method:
              snap_day_care_self_employment_expense
            else:
              if state_uses_noncommercial_nonfoster_boarder_expense_method:
                if state_uses_boarder_maximum_allotment_method:
                  snap_boarder_maximum_allotment_method_cost
                else:
                  snap_boarder_flat_or_percentage_method_cost
              else:
                if state_uses_tanf_self_employment_expense_method:
                  snap_tanf_standard_self_employment_expense
                else:
                  if state_uses_fns_approved_self_employment_expense_method:
                    snap_fns_approved_self_employment_expense
                  else:
                    0
