            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                For income from boarders, other than those in commercial
                boarding houses or from foster care boarders, use
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if (
            self_employment_enterprises_assigned_boarder_expense_method_count > 0
            and snap_boarder_expense_method_option_selection_valid
          ):
            if state_uses_maximum_allotment_for_boarder_expense_method:
              snap_boarder_maximum_allotment_method_cost
            else:
              if state_uses_flat_amount_for_boarder_expense_method:
                snap_boarder_flat_amount_method_cost
              else:
                snap_boarder_fixed_percentage_method_cost
          else: 0

  - name: snap_tanf_standard_self_employment_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)(iv)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Use the standard amount the State uses for its TANF program.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if self_employment_enterprises_assigned_tanf_expense_method_count > 0:
            max(
              0,
              state_tanf_standard_allowable_expense_for_assigned_enterprises_after_applying_boarder_payment_cap
            )
          else: 0

  - name: snap_fns_approved_self_employment_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)(v)
    metadata:
