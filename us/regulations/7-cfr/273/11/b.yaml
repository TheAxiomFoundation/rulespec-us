          )

  - name: snap_boarder_fixed_percentage_method_cost
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(iv), (b)(3)(ii)(B)
    metadata:
