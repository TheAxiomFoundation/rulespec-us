        formula: |-
          min(
            max(0, boarder_method_payments_received_for_lodging_and_meals)
            * max(0, state_boarder_fixed_expense_rate),
            max(0, boarder_method_payments_received_for_lodging_and_meals)
          )

  - name: snap_day_care_cacfp_reimbursement_method_expense
