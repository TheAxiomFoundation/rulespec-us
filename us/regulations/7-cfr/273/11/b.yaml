            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                For income from day care, use the current reimbursement amounts
                used in the Child and Adult Care Food Program
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          max(
            0,
            current_cacfp_reimbursement_amount_for_enterprises_assigned_day_care_expense_method
          )

  - name: snap_day_care_estimated_per_meal_method_expense
    kind: derived
