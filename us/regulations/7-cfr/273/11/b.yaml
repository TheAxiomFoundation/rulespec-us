  - name: snap_allowable_self_employment_costs_under_state_elected_method
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                State agencies may elect to use actual costs for allowable
                expenses in accordance with paragraphs (b)(1) and (b)(2) of
                this section or determine self-employment expenses as follows
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Different methods may be proposed for different types of
                self-employment.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_self_employment_expense_determination_complete:
            snap_actual_allowable_self_employment_costs
            + snap_day_care_self_employment_expense
            + snap_boarder_self_employment_expense
            + snap_tanf_standard_self_employment_expense
            + snap_fns_approved_self_employment_expense
          else: 0
