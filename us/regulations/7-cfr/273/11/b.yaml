format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  deferred_outputs:
    - output: us:regulations/7-cfr/273/11/b/3/iii#snap_foster_care_boarder_self_employment_expense
      reason: >-
        Paragraph (b)(3)(iii) refers foster-care-boarder income treatment to
        7 CFR 273.1(c)(6), but the current 273.1 has no paragraph (c)(6).
        The stale cross-reference does not supply a current computational
        expense rule, so a household with this enterprise type has an
        incomplete expense determination rather than an inferred zero expense.
  summary: |-
    7 CFR 273.11(b) defines allowable costs of producing SNAP
    self-employment income. Actual allowable costs include identifiable labor,
    stock, raw-material, seed and fertilizer, principal, interest, insurance,
    tax, and other business costs. Prior-period losses, income taxes,
    retirement set-asides and personal work expenses, and depreciation are
    not allowable. Boarder lodging and meal costs may not exceed payments
    received from boarders. A State may instead use specified day-care,
    noncommercial non-foster-boarder, TANF, or FNS-approved methods. Because
    the regulation makes methods applicable to particular self-employment
    types and expressly permits different methods for different types, this
    module assigns each enterprise to one method and adds the resulting
    type-specific expenses. Explicit validity and completeness outputs prevent
    missing methods, multiple methods, invalid sub-options, inapplicable
    type-specific methods, or the stale foster-boarder cross-reference from
    being treated as an ordinary zero expense.
rules:
  - name: snap_identifiable_allowable_nonboarder_self_employment_costs
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                identifiable costs of labor; stock; raw material; seed and
                fertilizer
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                payments on the principal of the purchase price of
                income-producing real estate and capital assets
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                interest paid to purchase income-producing property; insurance
                premiums; and taxes paid on income-producing property
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          max(0, actual_method_nonboarder_self_employment_labor_costs)
          + max(0, actual_method_nonboarder_self_employment_stock_and_raw_material_costs)
          + max(0, actual_method_nonboarder_self_employment_seed_and_fertilizer_costs)
          + max(
            0,
            actual_method_nonboarder_self_employment_principal_payments_for_income_producing_property_and_assets
          )
          + max(
            0,
            actual_method_nonboarder_self_employment_interest_paid_to_purchase_income_producing_property
          )
          + max(0, actual_method_nonboarder_self_employment_insurance_premiums)
          + max(
            0,
            actual_method_nonboarder_self_employment_taxes_paid_on_income_producing_property
          )
          + max(
            0,
            actual_method_other_identifiable_allowable_nonboarder_self_employment_costs
          )

  - name: snap_allowable_boarder_lodging_and_meal_cost_actual_method
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(2)(iv)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Any amount that exceeds the payment a household receives from a
                boarder for lodging and meals.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          min(
            max(0, actual_method_boarder_lodging_and_meal_costs),
            max(0, actual_method_boarder_payments_received_for_lodging_and_meals)
          )

  - name: snap_actual_allowable_self_employment_costs
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(b)(1)-(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                State agencies may elect to use actual costs for allowable
                expenses in accordance with paragraphs (b)(1) and (b)(2)
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if self_employment_enterprises_assigned_actual_cost_method_count > 0:
            snap_identifiable_allowable_nonboarder_self_employment_costs
            + snap_allowable_boarder_lodging_and_meal_cost_actual_method
          else: 0

