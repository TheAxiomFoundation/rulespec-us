format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(g) lets a resident of a qualifying battered-women-and-children
    shelter participate as a separate household even when still included in a
    certified former household containing the abuser. The resident may receive
    an additional separate-household allotment only once in a month. A shelter
    resident applying separately is tested using only the resident household's
    own income, accessible resources, and responsible expenses; former-household
    finances are disregarded, jointly held resources are inaccessible, and room
    payments to the shelter are shelter expenses.
rules:
  - name: snap_battered_shelter_additional_allotment_monthly_limit
    kind: parameter
    dtype: Count
    source: 7 CFR 273.11(g)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Shelter residents who are included in such certified households
                may receive an additional allotment as a separate household
                only once a month.
    versions:
      - effective_from: '2008-10-01'
        formula: '1'

  - name: snap_battered_shelter_meets_definition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(g)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Shelters having FNS authorization to redeem at wholesalers
                shall be considered as meeting the definition
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          shelter_independently_meets_section_271_2_battered_shelter_definition
          or shelter_fns_authorized_to_redeem_at_wholesalers

  - name: snap_battered_shelter_separate_household_exception_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(g)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Shelter residents who are included in such certified households
                may nevertheless apply for and (if otherwise eligible)
                participate in the Program as separate households if such
                certified household which includes them is the household
                containing the person who subjected them to abuse.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_battered_shelter_meets_definition
          and resident_currently_in_battered_women_and_children_shelter
          and resident_included_in_certified_former_household
          and former_household_contains_person_who_subjected_resident_to_abuse

  - name: snap_battered_shelter_additional_allotment_allowed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(g)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                may receive an additional allotment as a separate household
                only once a month
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_battered_shelter_separate_household_exception_applies
          and shelter_resident_separate_household_is_otherwise_eligible_for_snap
          and separate_household_additional_allotments_received_this_month
              < snap_battered_shelter_additional_allotment_monthly_limit

  - name: snap_battered_shelter_separate_household_financial_treatment_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(g)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Shelter residents who apply as separate households shall be
                certified solely on the basis of their income and resources
                and the expenses for which they are responsible.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_battered_shelter_meets_definition
          and resident_currently_in_battered_women_and_children_shelter
          and shelter_resident_applies_as_separate_household

  - name: snap_battered_shelter_separate_household_countable_income
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(g)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                They shall be certified without regard to the income ...
                of their former household.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_battered_shelter_separate_household_financial_treatment_applies:
            max(0, resident_separate_household_income)
          else: 0

  - name: snap_battered_shelter_separate_household_countable_resources
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(g)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                They shall be certified without regard to the ... resources ...
                of their former household. Jointly held resources shall be
                considered inaccessible
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_battered_shelter_separate_household_financial_treatment_applies:
            max(
              0,
              resident_resources_before_joint_resource_exclusion
              - jointly_held_resources_with_former_household
            )
          else: 0

  - name: snap_battered_shelter_separate_household_allowable_expenses
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(g)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: the expenses for which they are responsible
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_battered_shelter_separate_household_financial_treatment_applies:
            max(0, other_deductible_expenses_resident_is_responsible_for)
            + snap_battered_shelter_room_payment_shelter_expense
          else: 0

  - name: snap_battered_shelter_room_payment_shelter_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: 7 CFR 273.11(g)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Room payments to the shelter shall be considered as shelter
                expenses.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          if snap_battered_shelter_separate_household_financial_treatment_applies:
            max(0, room_payment_to_battered_shelter)
          else: 0
