  - name: snap_member_is_fleeing_felon
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State shall specify in its State plan of operation which
                fleeing felon test it has adopted as required at §
                272.2(d)(1)(xvii) of this chapter.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_member_meets_four_part_fleeing_felon_test
              output: snap_member_meets_four_part_fleeing_felon_test
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
