format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(n) excludes fleeing felons and probation or parole violators
    from the household. A State selects either the four-part fleeing-felon
    test or the alternative test based on presentation of a warrant bearing
    NCIC code 4901, 4902, or 4999. The four-part test requires a qualifying
    outstanding warrant, actual or reasonably expected awareness, an action
    to avoid arrest or jail, and active law-enforcement pursuit. A probation
    or parole violation requires an impartial determination and active
    pursuit. Law-enforcement pursuit may arise from a stated 20-day intent,
    presentation of a qualifying warrant, or a stated 30-day intent following
    a State request; the last path can support current adverse action only
    after the 30-day period expires and law enforcement has attempted
    execution or arrest. If the State must act on an application before that
    status can be determined to meet ordinary or expedited processing
    deadlines, the application is processed without considering the
    individual's fleeing-felon or probation-or-parole-violator status.
