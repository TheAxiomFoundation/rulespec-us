  - name: snap_qualifying_alternative_fleeing_felon_warrant_presented
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)(1)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Alternatively, a State agency may establish that an individual
                is a fleeing felon when a Federal, State, or local law
                enforcement officer acting in his or her official capacity
                presents an outstanding felony arrest warrant that conforms to
                one of the following National Crime Information Center Uniform
                Offense Classification Codes, to the State agency to obtain
                information on the location of and other information about the
                individual named in the warrant:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Escape (4901);
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Flight to Avoid (prosecution, confinement, etc.) (4902); or
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: Flight-Escape (4999).
    versions:
      - effective_from: '2015-11-09'
        formula: |-
          official_capacity_law_enforcement_officer_presented_outstanding_felony_arrest_warrant_to_obtain_member_location_information
          and (
            presented_warrant_has_ncic_code_4901_escape
            or presented_warrant_has_ncic_code_4902_flight_to_avoid
            or presented_warrant_has_ncic_code_4999_flight_escape
          )

  - name: snap_law_enforcement_actively_seeking_under_section_273_11_n
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                A Federal, State, or local law enforcement agency informs a
                State agency that it intends to enforce an outstanding felony
                warrant or to arrest an individual for a probation or parole
                violation within 20 days of submitting a request for
                information about the individual to the State agency;
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                A Federal, State, or local law enforcement agency presents a
                felony arrest warrant as provided in paragraph (n)(1)(ii) of
                this section; or
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                A Federal, State, or local law enforcement agency states that
                it intends to enforce an outstanding felony warrant or to
                arrest an individual for a probation or parole violation within
                30 days of the date of a request from a State agency about a
                specific outstanding felony warrant or probation or parole
                violation.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_qualifying_alternative_fleeing_felon_warrant_presented
              output: snap_qualifying_alternative_fleeing_felon_warrant_presented
              hash: sha256:local
    versions:
      - effective_from: '2015-11-09'
        formula: |-
          law_enforcement_intends_enforcement_or_arrest_within_20_days_of_its_information_request
          or snap_qualifying_alternative_fleeing_felon_warrant_presented
          or law_enforcement_intends_enforcement_or_arrest_within_30_days_of_state_request

  - name: snap_law_enforcement_activity_permits_current_adverse_action_under_section_273_11_n
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)(3)-(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the law enforcement agency indicates that it does intend to
                enforce the felony warrant or arrest the individual for the
                probation or parole violation within 30 days of the date of the
                State agency's request for information, the State agency will
                postpone taking any action on the case until the 30-day period
                has expired.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Once the 30-day period has expired, the State agency shall
                verify with the law enforcement agency whether it has attempted
                to execute the felony warrant or arrest the probation or parole
                violator.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If it has, the State agency shall take appropriate action to
                deny an applicant or terminate a participant who has been
                determined to be a fleeing felon or a probation or parole
                violator.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the law enforcement agency has not taken any action within
                30 days, the State agency shall not consider the individual a
                fleeing felon or probation or parole violator, shall document
                the case file accordingly, and take no further action.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_qualifying_alternative_fleeing_felon_warrant_presented
              output: snap_qualifying_alternative_fleeing_felon_warrant_presented
              hash: sha256:local
    versions:
      - effective_from: '2015-11-09'
        formula: |-
          law_enforcement_intends_enforcement_or_arrest_within_20_days_of_its_information_request
          or snap_qualifying_alternative_fleeing_felon_warrant_presented
          or (
            law_enforcement_intends_enforcement_or_arrest_within_30_days_of_state_request
            and thirty_day_state_request_period_has_expired
            and law_enforcement_attempted_warrant_execution_or_probation_parole_arrest_during_thirty_day_period
          )

  - name: snap_member_meets_four_part_fleeing_felon_test
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)(1)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                There is an outstanding felony warrant for the individual by a
                Federal, State, or local law enforcement agency, and the
                underlying cause for the warrant is for committing or
                attempting to commit a crime that is a felony under the law of
                the place from which the individual is fleeing or a high
                misdemeanor under the law of New Jersey;
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The individual is aware of, or should reasonably have been able
                to expect that, the felony warrant has already or would have
                been issued;
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The individual has taken some action to avoid being arrested or
                jailed; and
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The Federal, State, or local law enforcement agency is actively
                seeking the individual as provided in paragraph (n)(3) of this
                section.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_law_enforcement_activity_permits_current_adverse_action_under_section_273_11_n
              output: snap_law_enforcement_activity_permits_current_adverse_action_under_section_273_11_n
              hash: sha256:local
    versions:
      - effective_from: '2015-11-09'
        formula: |-
          member_has_outstanding_warrant_for_felony_or_new_jersey_high_misdemeanor
          and member_knew_or_reasonably_should_have_expected_felony_warrant
          and member_took_action_to_avoid_arrest_or_jail
          and snap_law_enforcement_activity_permits_current_adverse_action_under_section_273_11_n

