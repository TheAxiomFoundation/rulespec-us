  - name: snap_member_is_probation_or_parole_violator
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)(2)-(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                An individual determined a parole or probation violator shall
                not be considered to be an eligible household member. To be
                considered a probation or parole violator, an impartial party,
                as designated by the State agency, must determine that the
                individual violated a condition of his or her probation or
                parole imposed under Federal or State law and that Federal,
                State, or local law enforcement authorities are actively
                seeking the individual to enforce the conditions of the
                probation or parole, as provided in paragraph (n)(3) of this
                section.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_law_enforcement_activity_permits_current_adverse_action_under_section_273_11_n
              output: snap_law_enforcement_activity_permits_current_adverse_action_under_section_273_11_n
              hash: sha256:local
    versions:
      - effective_from: '2015-11-09'
        formula: |-
          impartial_party_determined_member_violated_federal_or_state_probation_or_parole_condition
          and snap_law_enforcement_activity_permits_current_adverse_action_under_section_273_11_n

  - name: snap_section_273_11_n_status_disregarded_for_application_processing
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)(5)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the State agency is required to act on the case without
                being able to determine fleeing felon or probation or parole
                violator status in order to meet the time standards in §
                273.2(g) or § 273.2(i)(3), the State agency shall process the
                application without consideration of the individual's fleeing
                felon or probation or parole violator status.
    versions:
      - effective_from: '2015-11-09'
        formula: |-
          state_agency_required_to_process_application_without_section_273_11_n_status_to_meet_time_standards

  - name: snap_member_ineligible_under_section_273_11_n
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(n)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Individuals who are fleeing to avoid prosecution or custody for
                a crime, or an attempt to commit a crime, that would be
                classified as a felony (or in the State of New Jersey, a high
                misdemeanor) or who are violating a condition of probation or
                parole under a Federal or State law shall not be considered
                eligible household members.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_member_is_fleeing_felon
              output: snap_member_is_fleeing_felon
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_member_is_probation_or_parole_violator
              output: snap_member_is_probation_or_parole_violator
              hash: sha256:local
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If the State agency is required to act on the case without
                being able to determine fleeing felon or probation or parole
                violator status in order to meet the time standards in §
                273.2(g) or § 273.2(i)(3), the State agency shall process the
                application without consideration of the individual's fleeing
                felon or probation or parole violator status.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/n#snap_section_273_11_n_status_disregarded_for_application_processing
              output: snap_section_273_11_n_status_disregarded_for_application_processing
              hash: sha256:local
    versions:
      - effective_from: '2015-11-09'
        formula: |-
          snap_section_273_11_n_current_regime_effective_indicator == 1
          and not snap_section_273_11_n_status_disregarded_for_application_processing
          and (
            snap_member_is_fleeing_felon
            or snap_member_is_probation_or_parole_violator
          )

