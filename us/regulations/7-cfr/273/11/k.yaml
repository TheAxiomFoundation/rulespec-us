format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/7/273/11
  summary: |-
    7 CFR 273.11(k) lets a State impose on an individual the same
    disqualification imposed by a selected means-tested public-assistance
    program for refusing a substantive required action. The option applies
    only when the individual was receiving both assistance and SNAP at the
    relevant time, excludes specified non-substantive or application-related
    reasons, and ends with the selected SNAP period, the other-program
    sanction, or the assistance case. Separately, a current FDPIR intentional
    program violation disqualification must be mirrored in SNAP. In either
    branch only the individual who committed the violation is disqualified.
rules:
  - name: snap_state_option_comparable_disqualification_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(k)(1)-(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                If a disqualification is imposed on a member of a household
                for failure to perform an action required under a Federal,
                State or local means-tested public assistance program, the
                State agency may impose the same disqualification on the
                member of the household under SNAP.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State agency shall not apply this provision to individuals
                who are disqualified at the time the individual initially
                applies for assistance benefits. It may apply the provision if
                the person was receiving such assistance at the time the
                disqualification in the assistance program was imposed and to
                disqualifications imposed at the time of application for
                continued assistance benefits if there is no break in
                participation
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Reaching a time limit for time-limited benefits, having a child
                that is not eligible because of a family cap, failing to
                reapply or complete the application process for continued
                assistance, failing to perform an action that the individual
                is unable to perform as opposed to refusing to perform, and
                failing to perform purely procedural requirements, shall not
                be considered failures
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The individual must be receiving SNAP at the time of the
                disqualification in the assistance program to be disqualified
                from SNAP under this provision.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                The State agency must stop the SNAP disqualification when it
                becomes aware that the person has become ineligible for
                assistance for some other reason, or the assistance case is
                closed.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Only the individual who committed the violation in the
                assistance program may be disqualified for SNAP purposes
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          state_elected_comparable_snap_disqualification_for_this_program_and_violation_type
          and other_program_is_federal_state_or_local_means_tested_public_assistance
          and assistance_disqualification_is_for_failure_to_perform_required_action
          and person_was_receiving_assistance_when_disqualification_was_imposed_or_at_continued_application_without_break
          and person_was_receiving_snap_when_assistance_disqualification_was_imposed
          and person_committed_the_assistance_program_violation
          and not assistance_disqualification_was_imposed_at_initial_assistance_application
          and not assistance_disqualification_was_for_time_limit
          and not assistance_disqualification_was_for_family_cap
          and not assistance_disqualification_was_for_failure_to_reapply_or_complete_continued_assistance_application
          and not assistance_disqualification_was_for_inability_rather_than_refusal
          and not assistance_disqualification_was_for_purely_procedural_requirement
          and assistance_program_disqualification_currently_active
          and state_selected_comparable_snap_disqualification_period_currently_active
          and not person_became_ineligible_for_assistance_for_another_reason
          and not assistance_case_closed

  - name: snap_fdpir_intentional_program_violation_reciprocal_disqualification_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(k), (k)(5)-(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                In the case of disqualification from the Food Distribution
                Program on Indian Reservations (FDPIR) for an intentional
                program violation as described under § 253.8 of this chapter,
                the State agency shall impose the same disqualification on the
                member of the household under SNAP.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                Only the individual who committed the violation in the
                assistance program may be disqualified for SNAP purposes
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                In instances where the disqualification is a reciprocal action
                based on disqualification from the Food Distribution Program
                on Indian Reservations, the length of disqualification shall
                mirror the period prescribed by the Food Distribution Program
                on Indian Reservations.
    versions:
      - effective_from: '2013-03-25'
        formula: |-
          fdpir_disqualification_is_for_intentional_program_violation
          and fdpir_disqualification_currently_active
          and person_committed_the_fdpir_violation

  - name: snap_fdpir_reciprocal_disqualification_effective_indicator
    kind: parameter
    dtype: Integer
    source: 7 CFR 273.11(k)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                In the case of disqualification from the Food Distribution
                Program on Indian Reservations (FDPIR) for an intentional
                program violation as described under § 253.8 of this chapter,
                the State agency shall impose the same disqualification on the
                member of the household under SNAP.
          - path: versions[1].formula
            kind: effective_period
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                In the case of disqualification from the Food Distribution
                Program on Indian Reservations (FDPIR) for an intentional
                program violation as described under § 253.8 of this chapter,
                the State agency shall impose the same disqualification on the
                member of the household under SNAP.
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          0
      - effective_from: '2013-03-25'
        formula: |-
          1

  - name: member_disqualified_under_section_273_11_paragraph_k
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(k)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/k#snap_state_option_comparable_disqualification_applies
              output: snap_state_option_comparable_disqualification_applies
              hash: sha256:local
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/regulation/7/273/11
              excerpt: >-
                In the case of disqualification from the Food Distribution
                Program on Indian Reservations (FDPIR) for an intentional
                program violation as described under § 253.8 of this chapter,
                the State agency shall impose the same disqualification on the
                member of the household under SNAP.
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/k#snap_fdpir_intentional_program_violation_reciprocal_disqualification_applies
              output: snap_fdpir_intentional_program_violation_reciprocal_disqualification_applies
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          snap_state_option_comparable_disqualification_applies
          or (
            snap_fdpir_reciprocal_disqualification_effective_indicator == 1
            and snap_fdpir_intentional_program_violation_reciprocal_disqualification_applies
          )

  - name: snap_member_eligible_under_section_273_11_paragraph_k
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 CFR 273.11(k)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/7-cfr/273/11/k#member_disqualified_under_section_273_11_paragraph_k
              output: member_disqualified_under_section_273_11_paragraph_k
              hash: sha256:local
    versions:
      - effective_from: '2008-10-01'
        formula: |-
          not member_disqualified_under_section_273_11_paragraph_k
