format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/regulation/42/435/554
  summary: 'An individual is a specified excluded individual if he or she meets one
    of the following:

    Community engagement is not a condition of eligibility for specified excluded
    individuals.'
rules:
- name: family_caregiver_exclusion_criteria_met
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 42 CFR 435.554(c)(3), (c)(3)(i)
  description: The reference to paragraphs (c)(1)(i)(A) through (C) means (c)(3)(i)(A)
    through (C), because (c)(1) has no subdivisions.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: for family caregivers, meets one of the criteria identified at
            paragraphs
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: '(c)(1)(i)(A) through (C) of this section. For purposes of this
            exclusion:'
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: 'An individual who is a family caregiver as defined in this section
            is a specified excluded individual if he or she meets one of the following
            criteria:'
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/42-cfr/435/554#family_caregiver_criteria_met_count
          output: family_caregiver_criteria_met_count
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/42-cfr/435/554#family_caregiver_required_criteria_count
          output: family_caregiver_required_criteria_count
          hash: sha256:local
  versions:
  - effective_from: '2026-07-31'
    formula: 'family_caregiver

      and family_caregiver_criteria_met_count >= family_caregiver_required_criteria_count'
- name: family_caregiver_criteria_met_count
  kind: derived
  entity: Person
  dtype: Count
  period: Month
  source: 42 CFR 435.554(c)(3)(i)(A)-(C)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: meets one of the following criteria
  versions:
  - effective_from: '2026-07-31'
    formula: '(if resident_family_caregiver_criterion: 1 else: 0)

      + (if nonresident_relative_caregiver_criterion: 1 else: 0)

      + (if nonresident_nonrelative_caregiver_criterion: 1 else: 0)'
- name: state_unlisted_condition_request_requirement_met
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 42 CFR 435.554(c)(5)(ii)(C)
  description: The requirement is satisfied when the individual's condition is listed
    or all three request-process facts hold. The reference to paragraphs (a)(5)(i)(A)
    through (E) means (c)(5)(i)(A) through (E).
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: If an individual does not have a disease, diagnosis, disorder,
            or health condition on this list
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: the State must have reasonable processes
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: and criteria in place
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: for such individual to request consideration for the exclusion
            for individuals who are medically frail or otherwise have special medical
            needs.
  versions:
  - effective_from: '2026-07-31'
    formula: "(not individual_has_condition_absent_from_state_list)\nor (\n  state_has_reasonable_processes_for_unlisted_condition_requests\n\
      \  and state_has_criteria_for_unlisted_condition_requests\n  and state_processes_and_criteria_allow_individual_to_request_medically_frail_exclusion\n\
      )"
