- name: medically_frail_or_special_medical_needs
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 42 CFR 435.554(c)(5), (c)(5)(i)
  description: 'This version encodes the IFR text as published. Paragraph (E) is one
    input standing for the full definition in 435.554(c)(5)(i)(E). Not encoded: on
    October 29, 2026, Commonwealth of Massachusetts v. Oz, No. 1:26-cv-12962-RGS (D.
    Mass.), Dkt. 147, vacated the ''significantly impairs the individual''s ability
    to comply'' language; the order is not in the corpus, so this module encodes the
    published text.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: '(5) The individual is medically frail or otherwise has special
            medical needs. For purposes of this exclusion:'
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: significantly impairs the individual's ability to comply with the
            community engagement requirement
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: With a serious or complex medical condition which is a medical
            condition that is life threatening, seriously disabling without necessarily
            being life threatening
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: excluding an individual in stable recovery
  versions:
  - effective_from: '2026-07-31'
    formula: "physical_mental_or_behavioral_health_condition_significantly_impairs_ability_to_comply_with_community_engagement_requirement\n\
      and (\n  blindness_or_disability_medical_category\n  or substance_use_disorder_medical_category\n\
      \  or disabling_mental_disorder_medical_category\n  or daily_living_disability_medical_category\n\
      \  or serious_or_complex_medical_category\n)"
