- name: caretaker_relative
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 42 CFR 435.554(a), Caretaker relative, (i)-(iv)
  description: Each relationship input represents its listed branch. The optional
    relationship includes the State election, including elections carried over from
    435.110. The spouse branch includes marriages terminated by death or divorce.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: with whom the child or disabled individual is living, who assumes
            primary responsibility
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: The dependent child's or disabled individual's father, mother,
            grandfather, grandmother, brother, sister, stepfather, stepmother, stepbrother,
            stepsister, uncle, aunt, first cousin, nephew, or niece.
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: The disabled individual's husband, wife, son, daughter, stepson,
            stepdaughter, grandson, or granddaughter.
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: The spouse of such parent or relative, even after the marriage
            is terminated by death or divorce.
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/regulation/42/435/554
          excerpt: At State option, another relative
  versions:
  - effective_from: '2026-07-31'
    formula: "individual_lives_with_dependent_child_or_disabled_individual\nand individual_assumes_primary_responsibility_for_dependent_child_or_disabled_individual_care\n\
      and (\n  relationship_is_parent_grandparent_sibling_stepparent_stepsibling_uncle_aunt_first_cousin_nephew_or_niece\n\
      \  or relationship_is_husband_wife_son_daughter_stepchild_grandchild_of_disabled_individual\n\
      \  or individual_is_spouse_of_such_parent_or_relative_even_after_marriage_termination\n\
      \  or state_elected_optional_caretaker_relationship_for_section_435_110_and_this_definition\n\
      )"
