- id: 42-cfr-435-551
  label: 42 CFR 435.551
  document_type: regulation
  jurisdiction: us
  corpus_citation_path: us/regulation/42/435/551
  module: us/regulations/42-cfr/435/551.yaml
  outputs:
  - us:regulations/42-cfr/435/551#applicable_individual
  combine: any
  note: The statute's 'equivalent minimum essential coverage waiver' is one input; the regulation splits
    it into a section 1115(a)(2) demonstration and its coverage meeting minimum essential coverage. The
    fact maps to the demonstration input and the coverage input is held true. Medicare Part A or B is
    one statute input; it maps to the Part A input and Part B is held false.
  inputs:
    adult_group: us:regulations/42-cfr/435/551#input.eligible_to_enroll_or_enrolled_under_state_plan_section_435_119
    mec_demonstration: us:regulations/42-cfr/435/551#input.otherwise_eligible_to_enroll_or_enrolled_in_section_1115_a_2_demonstration_project
    pregnant: us:regulations/42-cfr/435/551#input.individual_is_pregnant
    medicare_part_a_or_b: us:regulations/42-cfr/435/551#input.individual_is_entitled_to_or_enrolled_for_title_xviii_part_a_benefits
    otherwise_eligible_under_state_plan: us:regulations/42-cfr/435/551#input.individual_is_otherwise_eligible_to_enroll_under_state_plan
  fixed:
    us:regulations/42-cfr/435/551#input.demonstration_project_coverage_meets_minimum_essential_coverage_requirements:
      kind: bool
      value: true
    us:regulations/42-cfr/435/551#input.individual_age:
      kind: integer
      value: 30
    us:regulations/42-cfr/435/551#input.individual_is_enrolled_for_title_xviii_part_b_benefits:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_specified_excluded_individual_under_section_435_554:
      kind: bool
      value: false
