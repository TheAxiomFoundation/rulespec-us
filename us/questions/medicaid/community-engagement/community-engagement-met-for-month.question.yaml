      kind: decimal
      value: '7.25'
    us:regulations/42-cfr/435/552#input.agency_uses_reasonable_method_to_allocate_work_hours_between_household_members:
      kind: bool
      value: true
    us:regulations/42-cfr/435/552#input.individual_enrolled_in_educational_program_less_than_half_time:
      kind: bool
      value: false
    us:regulations/42-cfr/435/552#input.educational_program_uses_credit_hours:
      kind: bool
      value: false
    us:regulations/42-cfr/435/552#input.educational_program_credit_hours_of_instruction:
