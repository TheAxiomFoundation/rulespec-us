format: axiom-source-question/v1
id: us:medicaid/community-engagement-met-for-month
question: Does an individual demonstrate community engagement for a month?
entity: Person
period:
  period_kind: month
  start: '2027-01-01'
  end: '2027-02-01'
facts:
  work_hours:
    kind: decimal
  community_service_hours:
    kind: decimal
  work_program_hours:
    kind: decimal
  monthly_income:
    kind: decimal
  enrolled_half_time:
    kind: bool
  agency_converts_income_to_hours:
    kind: bool
  agency_lacks_hours_documentation:
    kind: bool
constraints:
- rule: monthly_income >= work_hours * 7.25
  note: Work hours are paid at least the federal minimum wage, so income is at least hours times $7.25.
answers:
- id: 42-usc-1396a-xx
  label: 42 USC 1396a(xx)(2)
  document_type: statute
  jurisdiction: us
  corpus_citation_path: us/statute/42/1396a/xx
  module: us/statutes/42/1396a/xx.yaml
  outputs:
  - us:statutes/42/1396a/xx#community_engagement_met_by_activity_or_income
  combine: any
  inputs:
    work_hours: us:statutes/42/1396a/xx#input.monthly_work_hours
    community_service_hours: us:statutes/42/1396a/xx#input.monthly_community_service_hours
    work_program_hours: us:statutes/42/1396a/xx#input.monthly_work_program_hours
    monthly_income: us:statutes/42/1396a/xx#input.monthly_income
    enrolled_half_time: us:statutes/42/1396a/xx#input.enrolled_in_educational_program_at_least_half_time
  derived:
    us:statutes/42/1396a/xx#input.monthly_combined_engagement_activity_hours:
      kind: decimal
      op: sum
      of:
      - work_hours
      - community_service_hours
      - work_program_hours
      note: The statute takes combined hours as an input. The link defines it as the sum of the actual
        activity hours.
  fixed:
    us:statutes/42/1396a/xx#input.applicable_minimum_wage_hourly_rate:
      kind: decimal
      value: '7.25'
    us:statutes/42/1396a/xx#input.seasonal_worker:
      kind: bool
      value: false
    us:statutes/42/1396a/xx#input.average_monthly_income_over_preceding_6_months:
      kind: decimal
      value: '0'
    us:statutes/42/1396a/xx#input.enrolled_in_career_and_technical_education_program:
      kind: bool
      value: false
- id: 42-cfr-435-552
  label: 42 CFR 435.552(a)
  document_type: regulation
  jurisdiction: us
  corpus_citation_path: us/regulation/42/435/552
  module: us/regulations/42-cfr/435/552.yaml
  outputs:
  - us:regulations/42-cfr/435/552#work_hours_path_demonstrates_community_engagement
  - us:regulations/42-cfr/435/552#community_service_hours_path_demonstrates_community_engagement
  - us:regulations/42-cfr/435/552#work_program_hours_path_demonstrates_community_engagement
  - us:regulations/42-cfr/435/552#half_time_educational_enrollment_path_demonstrates_community_engagement
  - us:regulations/42-cfr/435/552#combined_activity_hours_path_demonstrates_community_engagement
  - us:regulations/42-cfr/435/552#monthly_income_path_demonstrates_community_engagement
  combine: any
  note: 435.552 defers its one-or-more rule (community_engagement_demonstrated_for_month) because the
    seasonal-worker path is deferred; this link ORs the six encoded paths and turns the statute's seasonal
    path off.
  inputs:
