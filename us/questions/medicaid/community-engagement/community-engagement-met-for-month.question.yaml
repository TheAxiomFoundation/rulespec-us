    us:regulations/42-cfr/435/551#input.individual_is_pregnant:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_entitled_to_or_enrolled_for_title_xviii_part_a_benefits:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_enrolled_for_title_xviii_part_b_benefits:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_specified_excluded_individual_under_section_435_554:
