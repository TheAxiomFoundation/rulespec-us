    work_program_hours: us:regulations/42-cfr/435/552#input.work_program_participation_hours
    monthly_income: us:regulations/42-cfr/435/552#input.individual_monthly_income
    enrolled_half_time: us:regulations/42-cfr/435/552#input.individual_enrolled_in_educational_program_at_least_half_time
    agency_converts_income_to_hours: us:regulations/42-cfr/435/552#input.agency_uses_income_based_work_hours_calculation
    agency_lacks_hours_documentation: us:regulations/42-cfr/435/552#input.agency_lacks_documentation_of_hours_worked
  fixed:
