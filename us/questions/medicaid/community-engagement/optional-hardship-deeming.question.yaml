format: axiom-source-question/v1
id: us:medicaid/community-engagement-optional-hardship-deeming
question: Is the individual deemed to meet the community engagement requirement for the month because
  of a short-term hardship (the state option)?
entity: Person
period:
  period_kind: month
  start: '2027-01-01'
  end: '2027-02-01'
facts:
  state_elects_option:
    kind: bool
  high_acuity_services:
    kind: bool
  acuity_request_made:
    kind: bool
  county_disaster:
    kind: bool
  county_unemployment_rate:
    kind: decimal
    values:
    - '0.07'
    - '0.075'
    - '0.08'
    - '0.09'
  national_unemployment_rate:
    kind: decimal
    values:
    - '0.04'
    - '0.05'
    - '0.06'
  state_requested_unemployment_exception:
    kind: bool
  medical_travel:
    kind: bool
  travel_request_made:
    kind: bool
  individual_requested_deeming:
    kind: bool
constraints:
- rule: acuity_request_made == individual_requested_deeming
  note: The statute has one 'individual requested' input; the regulation asks for a request per event
    type. One request is read as both.
- rule: travel_request_made == individual_requested_deeming
  note: As above, for the medical-travel request.
answers:
- id: 42-usc-1396a-xx
  label: 42 USC 1396a(xx)(3)(B)
  document_type: statute
  jurisdiction: us
  corpus_citation_path: us/statute/42/1396a/xx
  effective_from: '2026-12-31'
  module: us/statutes/42/1396a/xx.yaml
  outputs:
  - us:statutes/42/1396a/xx#optional_hardship_deeming_applies
  combine: any
  inputs:
    state_elects_option: us:statutes/42/1396a/xx#input.state_plan_provides_optional_short_term_hardship_deeming
    high_acuity_services: us:statutes/42/1396a/xx#input.received_high_acuity_services_for_part_or_all_of_month
    county_disaster: us:statutes/42/1396a/xx#input.county_has_presidential_emergency_or_disaster_for_part_or_all_of_month
    county_unemployment_rate: us:statutes/42/1396a/xx#input.county_unemployment_rate
    national_unemployment_rate: us:statutes/42/1396a/xx#input.national_unemployment_rate
    medical_travel: us:statutes/42/1396a/xx#input.individual_or_dependent_must_travel_outside_community_for_extended_medically_necessary_services
    individual_requested_deeming: us:statutes/42/1396a/xx#input.individual_requested_hardship_deeming
- id: 42-cfr-435-555
  label: 42 CFR 435.555(a)
  document_type: regulation
  jurisdiction: us
  corpus_citation_path: us/regulation/42/435/555
  module: us/regulations/42-cfr/435/555.yaml
  outputs:
  - us:regulations/42-cfr/435/555#community_engagement_deemed_demonstrated_for_short_term_hardship
  combine: any
  note: High acuity maps to inpatient hospital, nursing facility or ICF services (psychiatric and other
    similar-acuity held false). A county disaster maps to a Stafford Act disaster with the month inside
    the exception period (national emergency held false). Unemployment data is held to come from BLS.
    Medical travel is the individual's own travel, with the services necessary and not available locally.
    The 435.551 inputs are held so that the individual is an applicable individual.
  inputs:
    state_elects_option: us:regulations/42-cfr/435/555#input.state_elected_short_term_hardship_exception_option
    high_acuity_services: us:regulations/42-cfr/435/555#input.individual_received_inpatient_hospital_nursing_facility_intermediate_care_facility_services_for_all_or_part_of_month
    acuity_request_made: us:regulations/42-cfr/435/555#input.request_for_inpatient_or_similar_acuity_hardship_exception_made_by_applicable_individual_or_representative
    county_disaster: us:regulations/42-cfr/435/555#input.individual_resides_in_county_or_equivalent_with_presidential_stafford_disaster_or_emergency
    county_unemployment_rate: us:regulations/42-cfr/435/555#input.county_or_equivalent_unemployment_rate
    national_unemployment_rate: us:regulations/42-cfr/435/555#input.national_unemployment_rate
    state_requested_unemployment_exception: us:regulations/42-cfr/435/555#input.state_requested_cms_unemployment_rate_hardship_exception
    medical_travel: us:regulations/42-cfr/435/555#input.individual_must_travel_outside_community_for_extended_period_to_receive_necessary_medical_services
    travel_request_made: us:regulations/42-cfr/435/555#input.request_for_outside_community_medical_travel_hardship_exception_made_by_applicable_individual_or_representative
  fixed:
    ? us:regulations/42-cfr/435/555#input.individual_received_inpatient_psychiatric_hospital_services_for_under_age_service_category_for_all_or_part_of_month
    : kind: bool
      value: false
    us:regulations/42-cfr/435/555#input.individual_received_other_services_of_similar_acuity_for_all_or_part_of_month:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_age:
      kind: integer
      value: 30
    us:regulations/42-cfr/435/555#input.individual_resides_in_county_or_equivalent_with_presidential_national_emergency:
      kind: bool
      value: false
    ? us:regulations/42-cfr/435/555#input.national_emergency_affects_ability_to_demonstrate_community_engagement_in_relevant_area
    : kind: bool
      value: false
    us:regulations/42-cfr/435/555#input.stafford_incident_period_month_is_within_required_exception_duration:
      kind: bool
      value: true
    us:regulations/42-cfr/435/555#input.cms_approved_extended_stafford_exception_duration_based_on_persistent_barriers:
      kind: bool
      value: false
    us:regulations/42-cfr/435/555#input.unemployment_rate_data_is_from_us_bls_or_other_reliable_source:
      kind: bool
      value: true
    us:regulations/42-cfr/435/555#input.medical_services_are_necessary_to_treat_serious_or_complex_medical_condition:
      kind: bool
      value: true
    us:regulations/42-cfr/435/555#input.necessary_medical_services_are_not_available_within_community_of_residence:
      kind: bool
      value: true
    ? us:regulations/42-cfr/435/555#input.dependent_of_applicable_individual_must_travel_outside_community_for_extended_period_to_receive_necessary_medical_services
    : kind: bool
      value: false
    us:regulations/42-cfr/435/555#input.applicable_individual_travels_with_dependent:
      kind: bool
      value: false
    ? us:regulations/42-cfr/435/555#input.applicable_individual_took_leave_or_absented_from_community_engagement_activities_for_dependent_condition_or_travel
    : kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_otherwise_eligible_to_enroll_under_state_plan:
      kind: bool
      value: true
    us:regulations/42-cfr/435/551#input.eligible_to_enroll_or_enrolled_under_state_plan_section_435_119:
      kind: bool
      value: true
    us:regulations/42-cfr/435/551#input.otherwise_eligible_to_enroll_or_enrolled_in_section_1115_a_2_demonstration_project:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.demonstration_project_coverage_meets_minimum_essential_coverage_requirements:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_pregnant:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_entitled_to_or_enrolled_for_title_xviii_part_a_benefits:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_enrolled_for_title_xviii_part_b_benefits:
      kind: bool
      value: false
    us:regulations/42-cfr/435/551#input.individual_is_specified_excluded_individual_under_section_435_554:
      kind: bool
      value: false
  guards:
  - us:regulations/42-cfr/435/551#applicable_individual
