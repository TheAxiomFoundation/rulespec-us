format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/26/b
      - us/statute/26/55/a
      - us/statute/26/55/b/1
      - us/statute/26/55/b/3
      - us/statute/26/55/c/1
      - us/statute/26/55/d/1
      - us/statute/26/55/d/2
      - us/statute/26/55/d/4
      - us/statute/26/56/b/1
      - us/statute/26/58
      - us/statute/26/59
      - us/statute/26/68/a
      - us/statute/26/151/d/5
      - us/statute/26/911/f
  summary: |-
    Bounded tax-year-2026 individual alternative minimum tax under Internal
    Revenue Code section 55. Alternative minimum taxable income starts from
    taxable income, restores the disallowed standard or itemized deductions
    (including reversal of the overall itemized-deduction reduction), restores
    both section 151 deductions, and adds the guarded section 57 preference plus completed
    signed section 58 and section 59 adjustments.

    The section 59(j) child exemption limit is inoperative after 2017. The
    tentative-minimum-tax side subtracts only the alternative minimum tax
    foreign tax credit, while the regular-tax side subtracts only the ordinary
    foreign tax credit from one completed section 26(b) regular-tax-liability
    total. Form 4972 tax and the section 911(a) exclusion must both be zero
    because their special computations are outside this bounded module.
    Every monetary output fails closed when a named domain condition fails.

