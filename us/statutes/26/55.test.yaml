        us:statutes/26/933#input.amounts_received_for_services_performed_as_employee_of_united_states_or_agency: 0
        us:statutes/26/933#input.individual_is_citizen_of_united_states: false
        us:statutes/26/933#input.individual_changes_residence_from_puerto_rico_during_taxable_year: false
        us:statutes/26/933#input.bona_fide_resident_of_puerto_rico_years_before_change: 0
        ? us:statutes/26/933#input.puerto_rico_source_income_attributable_to_puerto_rican_residence_period_before_change
        : 0
        ? us:statutes/26/933#input.amounts_received_for_services_performed_as_employee_of_united_states_or_agency_attributable_to_period_before_change
        : 0
      - &zero_section_911_inputs
        us:statutes/26/911/a#input.individual_is_qualified_individual: false
        us:statutes/26/911/a#input.election_made_for_foreign_earned_income: false
        us:statutes/26/911/a#input.election_made_for_housing_cost_amount: false
        us:statutes/26/911/a#input.foreign_earned_income_of_individual: 0
        us:statutes/26/911/a#input.housing_cost_amount_of_individual: 0
      - &empty_section_151_relations
        us:statutes/26/151#relation.exemption_individual_of_tax_unit: []
        us:statutes/26/151#relation.senior_deduction_individual_of_tax_unit: []
      - &valid_zero_section_57
        ? us:statutes/26/57#input.completed_section_57_a_5_specified_private_activity_bond_interest
        : 0
        ? us:statutes/26/57#input.section_57_a_5_completed_interest_domain_is_satisfied
        : true
        us:statutes/26/57#input.section_57_a_1_depletion_preference_is_zero: true
        ? us:statutes/26/57#input.section_57_a_2_intangible_drilling_cost_preference_is_zero
        : true
        ? us:statutes/26/57#input.section_57_a_6_pre_1987_depreciation_or_amortization_preference_is_zero
        : true
        ? us:statutes/26/57#input.section_57_a_7_small_business_stock_preference_is_zero
        : true
      - &valid_zero_section_59
        ? us:statutes/26/59#input.completed_alternative_minimum_tax_foreign_tax_credit
        : 0
        ? us:statutes/26/59#input.section_59_a_completed_credit_domain_is_satisfied
        : true
        ? us:statutes/26/59#input.completed_section_59_e_qualified_expenditure_adjustment
        : 0
        ? us:statutes/26/59#input.section_59_e_completed_adjustment_domain_is_satisfied
        : true
        ? us:statutes/26/59#input.completed_section_59_g_tax_benefit_rule_adjustment
        : 0
        ? us:statutes/26/59#input.section_59_g_completed_adjustment_domain_is_satisfied
        : true
        ? us:statutes/26/59#input.completed_section_59_h_limitation_coordination_adjustment
        : 0
        ? us:statutes/26/59#input.section_59_h_completed_adjustment_domain_is_satisfied
        : true
        ? us:statutes/26/59#input.no_other_section_59_special_rule_affects_completed_individual_amt
        : true
      - &valid_zero_section_58
        ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
        : 0
        ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_after_insolvency
        : 0
        ? us:statutes/26/58#input.section_58_a_completed_loss_domain_is_satisfied
        : true
        ? us:statutes/26/58#input.section_58_b_completed_loss_domain_is_satisfied
        : true
        ? us:statutes/26/58#input.section_58_c_1_completed_insolvency_domain_is_satisfied
        : true
        ? us:statutes/26/58#input.section_58_c_2_completed_disposition_domain_is_satisfied
        : true
      - &valid_section_55_domain_inputs
        us:statutes/26/55#input.no_other_section_56_adjustment: true
        us:statutes/26/55#input.form_4972_lumpsum_distributions: 0
      - &baseline_section_55_amounts
        us:statutes/26/55#input.filing_status: 0
        us:statutes/26/55#input.taxable_income: 50000
        us:statutes/26/55#input.tax_unit_itemizes: false
        us:statutes/26/55#input.standard_deduction: 16100
        us:statutes/26/55#input.salt_deduction: 0
        us:statutes/26/55#input.misc_deduction: 0
        us:statutes/26/55#input.section_68_reduction: 0
        us:statutes/26/55#input.amt_part_iii_required: false
        us:statutes/26/55#input.amt_tax_including_capital_gains: 0
        us:statutes/26/55#input.section_26_b_regular_tax_liability_before_credits: 5000
        us:statutes/26/55#input.ordinary_foreign_tax_credit: 0
    us:statutes/26/151#input.adjusted_gross_income: 50000
  output:
    us:statutes/26/55#section_55_verified_domain_is_satisfied: holds
    us:statutes/26/59#section_59_j_kiddie_exemption_limit_applies: not_holds
    us:statutes/26/151#section_151_exemption_deduction: 0
    us:statutes/26/151#senior_deduction: 0
    us:statutes/26/55#amt_lower_rate: 0.26
    us:statutes/26/55#amt_higher_rate: 0.28
    us:statutes/26/55#amt_exemption_phaseout_rate: 0.50
