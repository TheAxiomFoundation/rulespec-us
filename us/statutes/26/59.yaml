format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/55/d/4
      - us/statute/26/59
      - us/statute/26/59/a/1
      - us/statute/26/59/a/2
      - us/statute/26/59/e
      - us/statute/26/59/g
      - us/statute/26/59/h
      - us/statute/26/59/j
  summary: |-
    Bounded 2026 individual-AMT surfaces from Internal Revenue Code section
    59. The AMT foreign tax credit and the signed subsection (e), (g), and
    (h) adjustments are completed-return amounts rather than locally derived
    worksheets. They are exposed only when every named completion attestation
    holds and the completed AMT foreign tax credit is nonnegative.

    Section 55(d)(4) makes the section 59(j) minor-child exemption limit
    inapplicable for taxable years beginning after December 31, 2017. The
    resulting applicability judgment is statutory and does not depend on the
    completed-return boundary.
rules:
  - name: section_59_completed_special_rule_domain_is_satisfied
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: 26 USC 59(a), (e), (g), and (h), bounded completed-return domain
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/59/a/1
              excerpt: >-
                The alternative minimum tax foreign tax credit for any taxable
                year shall be the credit which would be determined under
                section 27
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/59/e
              excerpt: >-
                any qualified expenditure to which an election under this
                paragraph applies shall be allowed as a deduction ratably over
                the 10-year period
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/59/g
              excerpt: differently treated items shall be properly adjusted
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/59/h
              excerpt: >-
                shall be applied for purposes of computing the alternative
                minimum taxable income
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/59
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            completed_alternative_minimum_tax_foreign_tax_credit >= 0
            and section_59_a_completed_credit_domain_is_satisfied
            and section_59_e_completed_adjustment_domain_is_satisfied
            and section_59_g_completed_adjustment_domain_is_satisfied
            and section_59_h_completed_adjustment_domain_is_satisfied
            and no_other_section_59_special_rule_affects_completed_individual_amt
          )

  - name: alternative_minimum_tax_foreign_tax_credit
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 59(a), guarded completed AMT foreign tax credit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/59#section_59_completed_special_rule_domain_is_satisfied
              output: section_59_completed_special_rule_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/59/a/1
              excerpt: >-
                The alternative minimum tax foreign tax credit for any taxable
                year shall be the credit which would be determined under
                section 27
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us/statute/26/59/a/2
              excerpt: >-
                the term “pre-credit tentative minimum tax” means the amount
                determined under the first sentence of section 55(b)(1)(A)
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_59_completed_special_rule_domain_is_satisfied:
            completed_alternative_minimum_tax_foreign_tax_credit
          else:
            0

  - name: section_59_e_qualified_expenditure_adjustment
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 59(e), guarded signed completed adjustment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/59#section_59_completed_special_rule_domain_is_satisfied
              output: section_59_completed_special_rule_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/59/e
              excerpt: >-
                any qualified expenditure to which an election under this
                paragraph applies shall be allowed as a deduction ratably over
                the 10-year period
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_59_completed_special_rule_domain_is_satisfied:
            completed_section_59_e_qualified_expenditure_adjustment
          else:
            0

  - name: section_59_g_tax_benefit_rule_adjustment
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 59(g), guarded signed completed adjustment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/59#section_59_completed_special_rule_domain_is_satisfied
              output: section_59_completed_special_rule_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/59/g
              excerpt: differently treated items shall be properly adjusted
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_59_completed_special_rule_domain_is_satisfied:
            completed_section_59_g_tax_benefit_rule_adjustment
          else:
            0

  - name: section_59_h_limitation_coordination_adjustment
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 59(h), guarded signed completed adjustment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/59#section_59_completed_special_rule_domain_is_satisfied
              output: section_59_completed_special_rule_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/59/h
              excerpt: >-
                shall be applied for purposes of computing the alternative
                minimum taxable income
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_59_completed_special_rule_domain_is_satisfied:
            completed_section_59_h_limitation_coordination_adjustment
          else:
            0

  - name: section_59_j_kiddie_exemption_limit_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: 26 USC 55(d)(4)(A)(iii) and 59(j)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/26/55/d/4
              excerpt: subsection (j) of section 59 shall not apply
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/59/j
              excerpt: In the case of a child to whom section 1(g) applies
    versions:
      - effective_from: '2018-01-01'
        formula: |-
          false

inputs:
  - name: completed_alternative_minimum_tax_foreign_tax_credit
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Completed section 59(a) AMT foreign tax credit. It is never consumed
      directly by section 55; only the guarded public output is.
  - name: section_59_a_completed_credit_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when the completed credit applies section 27 and section 904
      using the section 59(a) AMT substitutions.
  - name: completed_section_59_e_qualified_expenditure_adjustment
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Signed completed AMTI adjustment required by applicable section 59(e)
      elections and writeoffs.
  - name: section_59_e_completed_adjustment_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when every applicable section 59(e) election and writeoff is
      reflected in the signed completed adjustment.
  - name: completed_section_59_g_tax_benefit_rule_adjustment
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Signed completed AMTI adjustment required by the section 59(g) tax
      benefit rule.
  - name: section_59_g_completed_adjustment_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when every applicable section 59(g) differently treated item
      is reflected in the signed completed adjustment.
  - name: completed_section_59_h_limitation_coordination_adjustment
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Signed completed AMTI adjustment required by the limitations coordinated
      under section 59(h).
  - name: section_59_h_completed_adjustment_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when the completed adjustment applies every limitation named
      by section 59(h) with the sections 56 through 58 adjustments.
  - name: no_other_section_59_special_rule_affects_completed_individual_amt
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when no other section 59 definition or special rule changes
      this bounded individual AMT computation.
