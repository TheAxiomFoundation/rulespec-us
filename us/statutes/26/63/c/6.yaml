        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/26/63/c/6
              excerpt: "the standard deduction shall be zero"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/63/c/6/A
