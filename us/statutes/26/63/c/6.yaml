format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/63/c/6
      - us/statute/26/63/c/6/A
      - us/statute/26/63/c/6/B
      - us/statute/26/63/c/6/C
      - us/statute/26/63/c/6/D
  summary: >-
    A married individual filing separately where either spouse itemizes, a
    nonresident alien individual, an individual making a short-period return
    under section 443(a)(1) because of an annual-accounting-period change, and
    an estate or trust, common trust fund, or partnership are not eligible for
    the standard deduction.
imports:
  - us:statutes/26/443/a/1#annual_accounting_period_change_with_secretary_approval
rules:
  - name: standard_deduction_ineligible
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
