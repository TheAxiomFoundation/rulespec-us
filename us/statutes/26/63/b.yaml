module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/26/63/b
  summary: |-
    In the case of an individual who does not elect to itemize deductions for the taxable year, “taxable income” means adjusted gross income minus the standard deduction, section 151 deductions (including the temporary senior deduction), section 199A deduction, section 170(p) deduction, section 224 deduction, section 225 deduction, and so much of the section 163(a) deduction as is attributable to the section 163(h)(4)(A) exception.
