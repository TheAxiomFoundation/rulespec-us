- name: positive_farm_adjustment_and_zero_passive_adjustment
  period: &tax_year_2026
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    <<:
      - &valid_section_58_attestations
        ? us:statutes/26/58#input.section_58_a_completed_loss_domain_is_satisfied
        : true
        ? us:statutes/26/58#input.section_58_b_completed_loss_domain_is_satisfied
        : true
        ? us:statutes/26/58#input.section_58_c_1_completed_insolvency_domain_is_satisfied
        : true
        ? us:statutes/26/58#input.section_58_c_2_completed_disposition_domain_is_satisfied
        : true
      - &positive_zero_section_58_amounts
        ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
        : 1200
        ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
        : 0
        ? us:statutes/26/58#input.completed_section_58_a_insolvency_reduction
        : 0
        ? us:statutes/26/58#input.completed_section_58_b_insolvency_reduction
        : 0
  output:
    us:statutes/26/58#section_58_completed_loss_domain_is_satisfied: holds
    ? us:statutes/26/58#section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    : 1200
    ? us:statutes/26/58#section_58_b_passive_activity_loss_adjustment_after_insolvency
    : 0

- name: partial_insolvency_reductions_preserve_both_remainders
  period: *tax_year_2026
  input:
    <<: *valid_section_58_attestations
    ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
    : 1000
    ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
    : 500
    ? us:statutes/26/58#input.completed_section_58_a_insolvency_reduction
    : 400
    ? us:statutes/26/58#input.completed_section_58_b_insolvency_reduction
    : 200
  output:
    us:statutes/26/58#section_58_completed_loss_domain_is_satisfied: holds
    ? us:statutes/26/58#section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    : 600
    ? us:statutes/26/58#section_58_b_passive_activity_loss_adjustment_after_insolvency
    : 300

- name: full_insolvency_reductions_zero_both_adjustments
  period: *tax_year_2026
  input:
    <<: *valid_section_58_attestations
    ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
    : 1000
    ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
    : 500
    ? us:statutes/26/58#input.completed_section_58_a_insolvency_reduction
    : 1000
    ? us:statutes/26/58#input.completed_section_58_b_insolvency_reduction
    : 500
  output:
    us:statutes/26/58#section_58_completed_loss_domain_is_satisfied: holds
    ? us:statutes/26/58#section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    : 0
    ? us:statutes/26/58#section_58_b_passive_activity_loss_adjustment_after_insolvency
    : 0

- name: negative_pre_insolvency_loss_adjustment_fails_closed
  period: *tax_year_2026
  input:
    <<: *valid_section_58_attestations
    ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
    : -1
    ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
    : 200
    ? us:statutes/26/58#input.completed_section_58_a_insolvency_reduction
    : 0
    ? us:statutes/26/58#input.completed_section_58_b_insolvency_reduction
    : 0
  output: &failed_section_58_outputs
    us:statutes/26/58#section_58_completed_loss_domain_is_satisfied: not_holds
    ? us:statutes/26/58#section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    : 0
    ? us:statutes/26/58#section_58_b_passive_activity_loss_adjustment_after_insolvency
    : 0

- name: all_zero_completed_loss_surface_is_valid
  period: *tax_year_2026
  input:
    <<: *valid_section_58_attestations
    ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
    : 0
    ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
    : 0
    ? us:statutes/26/58#input.completed_section_58_a_insolvency_reduction
    : 0
    ? us:statutes/26/58#input.completed_section_58_b_insolvency_reduction
    : 0
  output:
    us:statutes/26/58#section_58_completed_loss_domain_is_satisfied: holds
    ? us:statutes/26/58#section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    : 0
    ? us:statutes/26/58#section_58_b_passive_activity_loss_adjustment_after_insolvency
    : 0

- name: negative_insolvency_reduction_fails_closed
  period: *tax_year_2026
  input:
    <<: *valid_section_58_attestations
    ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
    : 1200
    ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
    : 0
    ? us:statutes/26/58#input.completed_section_58_a_insolvency_reduction
    : -1
    ? us:statutes/26/58#input.completed_section_58_b_insolvency_reduction
    : 0
  output: *failed_section_58_outputs

- name: insolvency_reduction_above_leg_magnitude_fails_closed
  period: *tax_year_2026
  input:
    <<: *valid_section_58_attestations
    ? us:statutes/26/58#input.completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
    : 1200
    ? us:statutes/26/58#input.completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
    : 0
    ? us:statutes/26/58#input.completed_section_58_a_insolvency_reduction
    : 1201
    ? us:statutes/26/58#input.completed_section_58_b_insolvency_reduction
    : 0
  output: *failed_section_58_outputs

- name: subsection_a_completion_attestation_false_fails_closed
  period: *tax_year_2026
  input:
    <<: *positive_zero_section_58_amounts
    ? us:statutes/26/58#input.section_58_a_completed_loss_domain_is_satisfied
    : false
    ? us:statutes/26/58#input.section_58_b_completed_loss_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_c_1_completed_insolvency_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_c_2_completed_disposition_domain_is_satisfied
    : true
  output: *failed_section_58_outputs

- name: subsection_b_completion_attestation_false_fails_closed
  period: *tax_year_2026
  input:
    <<: *positive_zero_section_58_amounts
    ? us:statutes/26/58#input.section_58_a_completed_loss_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_b_completed_loss_domain_is_satisfied
    : false
    ? us:statutes/26/58#input.section_58_c_1_completed_insolvency_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_c_2_completed_disposition_domain_is_satisfied
    : true
  output: *failed_section_58_outputs

- name: subsection_c_1_insolvency_attestation_false_fails_closed
  period: *tax_year_2026
  input:
    <<: *positive_zero_section_58_amounts
    ? us:statutes/26/58#input.section_58_a_completed_loss_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_b_completed_loss_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_c_1_completed_insolvency_domain_is_satisfied
    : false
    ? us:statutes/26/58#input.section_58_c_2_completed_disposition_domain_is_satisfied
    : true
  output: *failed_section_58_outputs

- name: subsection_c_2_disposition_attestation_false_fails_closed
  period: *tax_year_2026
  input:
    <<: *positive_zero_section_58_amounts
    ? us:statutes/26/58#input.section_58_a_completed_loss_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_b_completed_loss_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_c_1_completed_insolvency_domain_is_satisfied
    : true
    ? us:statutes/26/58#input.section_58_c_2_completed_disposition_domain_is_satisfied
    : false
  output: *failed_section_58_outputs
