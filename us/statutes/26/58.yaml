format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/58/a
      - us/statute/26/58/b
      - us/statute/26/58/c/1
      - us/statute/26/58/c/2
  summary: |-
    Bounded tax-year-2026 individual-AMT loss adjustments under Internal
    Revenue Code section 58.

    The subsection (a) tax-shelter-farm and subsection (b) passive-activity
    surfaces are signed completed-return adjustments after application of the
    subsection (c)(1) insolvency reduction. The module does not infer an
    allocation or ordering for the single statutory insolvency amount.

    The signed adjustments are exposed only when the caller attests that the
    subsection (a) and (b) worksheets, the statutory insolvency definition and
    reduction, and the subsection (c)(2) entire-interest disposition rule are
    complete. Otherwise every public surface fails closed.
rules:
  - name: section_58_completed_loss_domain_is_satisfied
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: 26 USC 58(a), (b), and (c), bounded completed-loss domain
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/58/a
              excerpt: >-
                In determining the amount of the loss from any tax shelter
                farm activity, the adjustments of sections 56 and 57 shall
                apply.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/58/b
              excerpt: the adjustments of sections 56 and 57 shall apply
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/58/b
              excerpt: >-
                the passive activity loss of a taxpayer shall be computed
                without regard to qualified housing interest
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                the term “insolvent” means the excess of liabilities over the
                fair market value of assets
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                The amount of losses to which subsection (a) or (b) applies
                shall be reduced by the amount (if any) by which the taxpayer
                is insolvent
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/26/58/c/2
              excerpt: >-
                shall (to the extent otherwise allowable) be allowed for such
                taxable year in computing alternative minimum taxable income
                and not treated as a loss from a tax shelter farm activity
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            section_58_a_completed_loss_domain_is_satisfied
            and section_58_b_completed_loss_domain_is_satisfied
            and section_58_c_1_completed_insolvency_domain_is_satisfied
            and section_58_c_2_completed_disposition_domain_is_satisfied
          )

  - name: section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 58(a) and (c), guarded signed completed adjustment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/58#section_58_completed_loss_domain_is_satisfied
              output: section_58_completed_loss_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/a
              excerpt: >-
                No loss of the taxpayer for such taxable year from any tax
                shelter farm activity shall be allowed.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                The amount of losses to which subsection (a) or (b) applies
                shall be reduced by the amount (if any) by which the taxpayer
                is insolvent
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/26/58/c/2
              excerpt: >-
                the amount of the loss attributable to such activity
                (determined after carryovers under subsection (a)(1)(B))
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_58_completed_loss_domain_is_satisfied:
            completed_section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
          else:
            0

  - name: section_58_b_passive_activity_loss_adjustment_after_insolvency
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 58(b) and (c)(1), guarded signed completed adjustment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/58#section_58_completed_loss_domain_is_satisfied
              output: section_58_completed_loss_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/b
              excerpt: >-
                In computing the alternative minimum taxable income of the
                taxpayer for any taxable year, section 469 shall apply
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                The amount of losses to which subsection (a) or (b) applies
                shall be reduced by the amount (if any) by which the taxpayer
                is insolvent
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_58_completed_loss_domain_is_satisfied:
            completed_section_58_b_passive_activity_loss_adjustment_after_insolvency
          else:
            0

inputs:
  - name: completed_section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Signed completed subsection (a) AMTI adjustment after fully applying the
      subsection (c)(1) insolvency reduction and subsection (c)(2) disposition
      rule. It is never consumed outside this module without the guarded
      public alias.
  - name: completed_section_58_b_passive_activity_loss_adjustment_after_insolvency
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Signed completed subsection (b) AMTI adjustment after fully applying the
      subsection (c)(1) insolvency reduction. It is never consumed outside
      this module without the guarded public alias.
  - name: section_58_a_completed_loss_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when the subsection (a) amount completely reflects the tax-
      shelter-farm classification, current-year disallowance, succeeding-year
      carryover, and sections 56 and 57 adjustments.
  - name: section_58_b_completed_loss_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when the subsection (b) amount completely applies section 469
      with the sections 56 and 57 adjustments and without qualified housing
      interest.
  - name: section_58_c_1_completed_insolvency_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when the completed signed adjustments use subsection
      (c)(1)(B)'s close-of-year excess-of-liabilities definition and completely
      apply the single subsection (c)(1)(A) reduction without omission or
      duplication.
  - name: section_58_c_2_completed_disposition_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when every entire-interest tax-shelter-farm disposition is
      reflected after carryovers, allowed to the extent otherwise allowable,
      and excluded from tax-shelter-farm loss treatment for that year.
