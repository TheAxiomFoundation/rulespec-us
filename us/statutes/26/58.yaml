format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/58/a
      - us/statute/26/58/b
      - us/statute/26/58/c/1
      - us/statute/26/58/c/2
  summary: |-
    Bounded tax-year-2026 individual-AMT loss adjustments under Internal
    Revenue Code section 58.

    The subsection (a) tax-shelter-farm and subsection (b) passive-activity
    amounts are completed nonnegative AMTI loss adjustments immediately before
    the subsection (c)(1) insolvency reduction. Separate completed nonnegative
    reductions apply the insolvency rule to each leg without imposing an
    unstated ordering between subsections. A reduction may not exceed its
    pre-insolvency loss adjustment.

    The caller separately attests the subsection (a) and (b) worksheet
    boundaries, the statutory insolvency definition and complete,
    nonduplicative reduction, and treatment of entire-interest farm-shelter
    dispositions under subsection (c)(2). Every public amount returns zero
    unless all four attestations and the numeric reduction checks hold.
rules:
  - name: section_58_completed_loss_domain_is_satisfied
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: 26 USC 58(a), (b), and (c), bounded completed-loss domain
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/58/a
              excerpt: >-
                In determining the amount of the loss from any tax shelter
                farm activity, the adjustments of sections 56 and 57 shall
                apply.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/58/b
              excerpt: >-
                the adjustments of sections 56 and 57 shall apply
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/58/b
              excerpt: >-
                the passive activity loss of a taxpayer shall be computed
                without regard to qualified housing interest
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                the term “insolvent” means the excess of liabilities over the
                fair market value of assets
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                The amount of losses to which subsection (a) or (b) applies
                shall be reduced by the amount (if any) by which the taxpayer
                is insolvent
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/26/58/c/2
              excerpt: >-
                shall (to the extent otherwise allowable) be allowed for such
                taxable year in computing alternative minimum taxable income
                and not treated as a loss from a tax shelter farm activity
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency >= 0
          and completed_section_58_b_passive_activity_loss_adjustment_before_insolvency >= 0
          and completed_section_58_a_insolvency_reduction >= 0
          and completed_section_58_b_insolvency_reduction >= 0
          and completed_section_58_a_insolvency_reduction
            <= completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
          and completed_section_58_b_insolvency_reduction
            <= completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
          and section_58_a_completed_loss_domain_is_satisfied
          and section_58_b_completed_loss_domain_is_satisfied
          and section_58_c_1_completed_insolvency_domain_is_satisfied
          and section_58_c_2_completed_disposition_domain_is_satisfied

  - name: section_58_a_tax_shelter_farm_loss_adjustment_after_insolvency
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 58(a) and (c), guarded completed loss adjustment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/58#section_58_completed_loss_domain_is_satisfied
              output: section_58_completed_loss_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/a
              excerpt: >-
                No loss of the taxpayer for such taxable year from any tax
                shelter farm activity shall be allowed.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                The amount of losses to which subsection (a) or (b) applies
                shall be reduced by the amount (if any) by which the taxpayer
                is insolvent
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/26/58/c/2
              excerpt: >-
                the amount of the loss attributable to such activity
                (determined after carryovers under subsection (a)(1)(B))
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_58_completed_loss_domain_is_satisfied:
            completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
            - completed_section_58_a_insolvency_reduction
          else:
            0

  - name: section_58_b_passive_activity_loss_adjustment_after_insolvency
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 58(b) and (c)(1), guarded completed loss adjustment
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/58#section_58_completed_loss_domain_is_satisfied
              output: section_58_completed_loss_domain_is_satisfied
              hash: sha256:local
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/b
              excerpt: >-
                In computing the alternative minimum taxable income of the
                taxpayer for any taxable year, section 469 shall apply
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/58/c/1
              excerpt: >-
                The amount of losses to which subsection (a) or (b) applies
                shall be reduced by the amount (if any) by which the taxpayer
                is insolvent
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if section_58_completed_loss_domain_is_satisfied:
            completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
            - completed_section_58_b_insolvency_reduction
          else:
            0

inputs:
  - name: completed_section_58_a_tax_shelter_farm_loss_adjustment_before_insolvency
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Completed nonnegative AMTI loss adjustment for subsection (a)
      immediately before the subsection (c)(1) insolvency reduction.
  - name: completed_section_58_b_passive_activity_loss_adjustment_before_insolvency
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Completed nonnegative AMTI loss adjustment for subsection (b)
      immediately before the subsection (c)(1) insolvency reduction.
  - name: completed_section_58_a_insolvency_reduction
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Completed nonnegative subsection (c)(1) insolvency reduction applied to
      the subsection (a) loss adjustment.
  - name: completed_section_58_b_insolvency_reduction
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: >-
      Completed nonnegative subsection (c)(1) insolvency reduction applied to
      the subsection (b) loss adjustment.
  - name: section_58_a_completed_loss_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when the subsection (a) amount completely reflects the tax-
      shelter-farm classification, current-year disallowance, succeeding-year
      carryover, and sections 56 and 57 adjustments.
  - name: section_58_b_completed_loss_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when the subsection (b) amount completely applies section 469
      with the sections 56 and 57 adjustments and without qualified housing
      interest.
  - name: section_58_c_1_completed_insolvency_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when both completed reductions use subsection (c)(1)(B)'s
      close-of-year excess-of-liabilities definition and completely apply
      subsection (c)(1)(A) without omission or duplication.
  - name: section_58_c_2_completed_disposition_domain_is_satisfied
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: >-
      Holds only when every entire-interest tax-shelter-farm disposition is
      reflected after carryovers, allowed to the extent otherwise allowable,
      and excluded from tax-shelter-farm loss treatment for that year.
