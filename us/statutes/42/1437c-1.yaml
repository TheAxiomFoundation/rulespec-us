format: rulespec/v1
module:
  status: deferred
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/42/1437c–1
    source_sha256: 3205f146c607eab854ceb1c7f7c8007e408e9d6334315a2434241e71ea8bde17
  summary: '"Effective beginning upon October 1, 1999, each public housing agency
    shall submit to the Secretary an annual public housing agency plan"; annual plans
    must contain the enumerated information for the upcoming fiscal year; and agencies
    shall submit initial plans and annual updates at times and in forms required by
    the Secretary.'
  deferred_outputs:
  - output: us:statutes/42/1437c-1/b#annual_public_housing_agency_plan_requirement
    reason: Annual-plan applicability is displaced for qualified public housing agencies.
      The qualified-agency definition depends on troubled-agency designation under
      section 1437d(j)(2) and a failing Section 8 Management Assessment Program score,
      neither of which is available as an executable RuleSpec dependency.
  - output: us:statutes/42/1437c-1/d#annual_public_housing_agency_plan_contents
    reason: Subsection (d) imposes a documentary annual-plan content checklist involving
      agency policies, plans, certifications, audits, and numerous cross-referenced
      public-housing program requirements. The current RuleSpec runtime does not provide
      a faithful document-content and administrative-compliance surface for the complete
      checklist.
  - output: us:statutes/42/1437c-1/h#public_housing_agency_plan_submission_deadlines
    reason: Initial-plan timing and form are prescribed by the Secretary, and annual
      submission timing depends on each public housing agency's fiscal-year start
      and filing event. The current RuleSpec runtime lacks a faithful administrative
      filing-event and agency fiscal-calendar representation.
rules: []
