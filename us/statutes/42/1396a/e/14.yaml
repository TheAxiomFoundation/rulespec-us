- name: lottery_lump_sum_second_band_months
  kind: parameter
  dtype: Count
  source: 42 USC 1396a(e)(14)(K)(i)(II)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
