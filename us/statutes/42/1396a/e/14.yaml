    formula: '2'
- name: lottery_lump_sum_third_band_months
  kind: parameter
  dtype: Count
  source: 42 USC 1396a(e)(14)(K)(i)(III)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/1396a/e/14
          excerpt: over a period of 3 months if the amount of such winnings or income
            (as applicable) is greater than or equal to $90,000
  versions:
  - effective_from: '2018-01-01'
    formula: '3'
- name: lottery_lump_sum_additional_months_per_increment
  kind: parameter
  dtype: Count
  source: 42 USC 1396a(e)(14)(K)(i)(IV)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/1396a/e/14
          excerpt: 1 additional month for each increment of $10,000
  versions:
  - effective_from: '2018-01-01'
    formula: '1'
- name: lottery_lump_sum_income_counting_months
  kind: derived
  entity: Person
  dtype: Count
  period: Month
  source: 42 USC 1396a(e)(14)(K)(i)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/1396a/e/14
          excerpt: include such winnings or income (as applicable) as income received
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/1396a/e/14
          excerpt: over a period of 3 months plus 1 additional month for each increment
            of $10,000
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/1396a/e/14
          excerpt: not to exceed a period of 120 months
  versions:
  - effective_from: '2018-01-01'
    formula: 'if qualified_winnings_or_lump_sum_amount < lottery_lump_sum_first_threshold:
      lottery_lump_sum_receipt_month_count else: if qualified_winnings_or_lump_sum_amount
      < lottery_lump_sum_second_threshold: lottery_lump_sum_second_band_months else:
      if qualified_winnings_or_lump_sum_amount < lottery_lump_sum_third_threshold:
      lottery_lump_sum_third_band_months else: if qualified_winnings_or_lump_sum_amount
      >= lottery_lump_sum_maximum_trigger: lottery_lump_sum_maximum_months else: min(lottery_lump_sum_maximum_months,
      lottery_lump_sum_third_band_months + lottery_lump_sum_additional_months_per_increment
      * floor((qualified_winnings_or_lump_sum_amount - lottery_lump_sum_second_threshold)
      / lottery_lump_sum_increment))'
