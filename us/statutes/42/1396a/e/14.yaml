    formula: ((upper_income_limit_poverty_line_rate + magi_standard_increase_percentage_points)
      - upper_income_limit_poverty_line_rate) * poverty_line_amount
- name: lottery_lump_sum_receipt_month_count
  kind: parameter
  dtype: Count
  source: 42 USC 1396a(e)(14)(K)(i)(I)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
