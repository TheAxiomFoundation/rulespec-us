format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/42/1396a/e/14
  summary: The paragraph requires States to use modified adjusted gross income and
    household income, as defined in 26 U.S.C. 36B(d)(2), without income disregards
    or an assets test, except for the groups in (D). It applies the home equity limit
    of 42 U.S.C. 1396p(f) to long-term care eligibility from July 4, 2025. It protected
    transition enrollees through the later of March 31, 2014 and their next regular
    redetermination. Subparagraph (I) subtracts 5 percent of the poverty line from
    MAGI. Qualified lottery winnings and lump-sum gambling income are counted over
    1 to 120 months. Six-month redeterminations apply to specified adult-expansion
    enrollees for redeterminations scheduled on or after January 1, 2027. Administrative
    determinations under (E), (F), (H), and (J), the unavailable incorporated income
    definitions in (G), and the final income computation dependent on those definitions
    are deferred.
  deferred_outputs:
  - output: us:statutes/42/1396a/e/14/G#modified_adjusted_gross_income
    reason: Subparagraph (G) incorporates the definition in 26 U.S.C. 36B(d)(2). No
      copied executable export supplies that definition. A local amount input and
      a pass-through rule would recreate the unavailable incorporated definition.
  - output: us:statutes/42/1396a/e/14/G#household_income
    reason: Subparagraph (G) incorporates the household income definition in 26 U.S.C.
      36B(d)(2). No copied executable export supplies that definition. A local amount
      input and a pass-through rule would recreate the unavailable incorporated definition.
  - output: us:statutes/42/1396a/e/14/I#applicable_magi_income_after_disregard
    reason: The dollar equivalent of the five-percentage-point disregard is executable,
      but the final subtraction requires the incorporated modified adjusted gross
      income definition in 26 U.S.C. 36B(d)(2), for which no executable copied export
      is available.
    source_values:
    - us:statutes/42/1396a/e/14#magi_standard_increase_percentage_points
    blocked_by:
    - us:statutes/42/1396a/e/14/G#modified_adjusted_gross_income
  - output: us:statutes/42/1396a/e/14/E#transition_threshold_approval
    reason: 42 U.S.C. 1396a(e)(14)(E) requires Secretary approval and comparison against
      March 23, 2010 child eligibility. Executable approval requires a runtime representation
      of proposed State thresholds, historical eligibility cohorts, and the Secretary's
      approval determination.
  - output: us:statutes/42/1396a/e/14/F#secretarial_waiver_of_paragraph_requirements
    reason: 42 U.S.C. 1396a(e)(14)(F) cannot be computed until the Secretary's waiver
      determination for coordinating eligibility requirements for dual eligible individuals
      is supplied as a runtime input.
  - output: us:statutes/42/1396a/e/14/H#point_in_time_and_countable_income_source_rules
    reason: 42 U.S.C. 1396a(e)(14)(H) cannot be computed until the State plan rules
      regarding sources of countable income and the point-in-time application processing
      date are supplied as runtime inputs.
  - output: us:statutes/42/1396a/e/14/J#parent_mentor_compensation_disregarded
    reason: 42 U.S.C. 1396a(e)(14)(J) cannot be computed until the parent mentor status
      determination under section 1397mm(f)(5) and the fact of participation in a
      grant-funded program are supplied as runtime inputs.
