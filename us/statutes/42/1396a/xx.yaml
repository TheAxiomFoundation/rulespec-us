rules:
- name: applicant_lookback_minimum_months
  kind: parameter
  dtype: Count
  source: 42 USC 1396a(xx)(1)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: for 1 or more but not more than 3
  versions:
  - effective_from: '2027-01-01'
    formula: '1'
- name: applicant_lookback_maximum_months
  kind: parameter
  dtype: Count
  source: 42 USC 1396a(xx)(1)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: for 1 or more but not more than 3
  versions:
  - effective_from: '2027-01-01'
    formula: '3'
- name: applicant_lookback_selection_within_statutory_limits
  kind: derived
  entity: StateAgency
  dtype: Judgment
  period: Month
  source: 42 USC 1396a(xx)(1)(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: for 1 or more but not more than 3 (as specified by the State) consecutive
            months immediately preceding the month
  versions:
  - effective_from: '2027-01-01'
    formula: 'state_specified_applicant_lookback_months >= applicant_lookback_minimum_months

      and state_specified_applicant_lookback_months <= applicant_lookback_maximum_months'
- name: monthly_activity_hours_requirement
  kind: parameter
  dtype: Decimal
  source: 42 USC 1396a(xx)(2)(A)-(E)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: not less than 80 hours
  versions:
  - effective_from: '2027-01-01'
    formula: '80'
- name: seasonal_worker_income_lookback_months
  kind: parameter
  dtype: Count
  source: 42 USC 1396a(xx)(2)(G)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: average monthly income over the preceding 6 months
  versions:
  - effective_from: '2027-01-01'
    formula: '6'
- name: hardship_unemployment_rate_threshold
  kind: parameter
  dtype: Rate
  source: 42 USC 1396a(xx)(3)(B)(ii)(II)(bb)(AA)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: 8 percent
  versions:
  - effective_from: '2027-01-01'
    formula: '0.08'
- name: hardship_national_unemployment_rate_multiplier
  kind: parameter
  dtype: Decimal
  source: 42 USC 1396a(xx)(3)(B)(ii)(II)(bb)(BB)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: 1.5 times the national unemployment rate
  versions:
  - effective_from: '2027-01-01'
    formula: '1.5'
- name: educational_program
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 42 USC 1396a(xx)(9)(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: The term ‘ educational program ’ includes
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: an institution of higher education (as defined in section 101 of
            the Higher Education Act of 1965)
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: a program of career and technical education (as defined in section
            3 of the Carl D. Perkins Career and Technical Education Act of 2006)
  versions:
  - effective_from: '2027-01-01'
    formula: 'enrolled_in_institution_of_higher_education

      or enrolled_in_career_and_technical_education_program

      or enrolled_in_high_school_or_state_approved_high_school_equivalency_program'
- name: community_engagement_met_by_activity_or_income
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 42 USC 1396a(xx)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: meets 1 or more of the following conditions
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: The individual is enrolled in an educational program at least half-time
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: average monthly income over the preceding 6 months
  versions:
  - effective_from: '2027-01-01'
    formula: 'monthly_work_hours >= monthly_activity_hours_requirement

      or monthly_community_service_hours >= monthly_activity_hours_requirement

      or monthly_work_program_hours >= monthly_activity_hours_requirement

      or (educational_program and educational_enrollment_is_at_least_half_time)

      or monthly_combined_engagement_activity_hours >= monthly_activity_hours_requirement

      or monthly_income >= applicable_minimum_wage_hourly_rate * monthly_activity_hours_requirement

      or (seasonal_worker and total_income_over_preceding_seasonal_worker_lookback_months
      / seasonal_worker_income_lookback_months >= applicable_minimum_wage_hourly_rate
      * monthly_activity_hours_requirement)'
- name: medically_frail_or_has_special_medical_needs
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 42 USC 1396a(xx)(9)(A)(ii)(V)
  description: 'The statute lists (aa)–(ee) and leaves the definition to the Secretary;
    this rule applies the five categories in 42 CFR 435.554(c)(5)(i), including (B)''s
    exclusion of an individual in stable recovery for 5 or more years.

    It omits the condition that the health condition “significantly impairs the individual''s
    ability to comply”: Commonwealth of Massachusetts v. Oz, No. 1:26-cv-12962-RGS
    (D. Mass. Oct. 29, 2026), Dkt. 147, vacated that language, although the opinion
    is not in the corpus.

    The court did not vacate (B), which no party challenged.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: who is medically frail or otherwise has special medical needs (as
            defined by the Secretary), including an individual
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: who is blind or disabled (as defined in section 1614)
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/42-cfr/435/554#blindness_or_disability_medical_category
          output: blindness_or_disability_medical_category
          hash: sha256:0bb92da0d232db362aab05908ed025ba0aeea83675fcd283aa6621b47c75831d
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: with a substance use disorder
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/42-cfr/435/554#substance_use_disorder_medical_category
          output: substance_use_disorder_medical_category
          hash: sha256:0bb92da0d232db362aab05908ed025ba0aeea83675fcd283aa6621b47c75831d
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: with a disabling mental disorder
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/42-cfr/435/554#disabling_mental_disorder_medical_category
          output: disabling_mental_disorder_medical_category
          hash: sha256:0bb92da0d232db362aab05908ed025ba0aeea83675fcd283aa6621b47c75831d
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: with a physical, intellectual or developmental disability that
            significantly impairs their ability to perform 1 or more activities of
            daily living
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/42-cfr/435/554#daily_living_disability_medical_category
          output: daily_living_disability_medical_category
          hash: sha256:0bb92da0d232db362aab05908ed025ba0aeea83675fcd283aa6621b47c75831d
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/statute/42/1396a/xx
          excerpt: with a serious or complex medical condition
      - path: versions[0].formula
        kind: import
        import:
          target: us:regulations/42-cfr/435/554#serious_or_complex_medical_category
          output: serious_or_complex_medical_category
          hash: sha256:0bb92da0d232db362aab05908ed025ba0aeea83675fcd283aa6621b47c75831d
  versions:
  - effective_from: '2027-01-01'
    formula: 'blindness_or_disability_medical_category

      or substance_use_disorder_medical_category

      or disabling_mental_disorder_medical_category

      or daily_living_disability_medical_category

      or serious_or_complex_medical_category'
