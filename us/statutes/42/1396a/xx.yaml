format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/42/1396a/xx
  summary: '“for 1 or more but not more than 3 (as specified by the State) consecutive
    months immediately preceding the month during which such individual applies for
    such medical assistance”

    The eligibility condition is required not later than January 1, 2027;

    earlier implementation is permitted at State option under the State plan

    or a section 1115 demonstration. A State exempted by the Secretary under

    paragraph (11) may start later, but not later than December 31, 2028.

    This encoding does not evaluate months before January 2027, including

    the 1–3 look-back months before a January 2027 application.

    Paragraphs (2), (3), and (9) supply monthly compliance, deeming,

    hardship, educational-program, exclusion, and applicability conditions.

    Paragraphs (4)–(8), (10), and (11) govern verification, available

    information, notice and cure, other eligibility determinations, hearings,

    FMAP and coverage treatment, outreach, non-waiver, and implementation exemptions.

    This repair adds the input state_specified_applicant_lookback_months.

    It removes or renames no inputs from the rejected candidate.'
  deferred_outputs:
  - output: us:statutes/42/1396a/xx#state_must_apply_community_engagement_requirement
    reason: The full state implementation obligation depends on paragraph (11) special
      implementation exemptions, waiver/demonstration project timing under section
      1315, Secretary regulations, and state plan choices not fully executable from
      this source slice alone.
  - output: us:statutes/42/1396a/xx#noncompliant_individual_denial_or_disenrollment_required
    reason: The final denial or disenrollment procedure depends on other bases for
      Medicaid eligibility, other insurance affordability programs, and fair-hearing
      procedure under subsection (a)(3), which are not provided as executable RuleSpec
      dependencies.
