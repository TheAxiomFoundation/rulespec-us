format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/8/1613/b/1
    authority_level: statute
    unsupported_period_behavior: missing_dated_snapshot_support_parameter
    runtime_validity_guard:
      parameter: statute_8_1613_b_1_snapshot_supported
      reason: pinned_compiler_discards_single_derived_version_dates
      engineering_support_marker_not_legal_condition: true
    supported_snapshot_from: '2025-07-04'
    validity_basis: supported_post_obbb_snapshot_not_original_enactment_date
    historical_amendment_versions_encoded: false
  summary: |-
    The subsection (a) five-year limitation does not apply when any one or
    more of the independently represented subsection (b)(1) status facts
    holds: refugee admission, asylum grant, legacy deportation withholding,
    removal withholding, Cuban and Haitian entrant status, or Amerasian
    immigrant admission.
    Only the post-July 4, 2025 snapshot is supported; earlier amendments and
    their transition rules are not encoded by this version boundary.
rules:
  - name: statute_8_1613_b_1_snapshot_supported
    kind: parameter
    dtype: Count
    source: Encoding support boundary for the post-OBBB snapshot; not a statutory eligibility condition
    metadata:
      private: true
      engineering_support_marker: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/statute/8/1613/b/1
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          1

  - name: subsection_b_1_status_exception_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 8 USC 1613(b)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/8/1613/b/1
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/8/1613/b/1
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_8_1613_b_1_snapshot_supported == 1
          and (
            refugee_admitted_to_united_states_under_section_207_of_immigration_and_nationality_act
            or alien_granted_asylum_under_section_208_of_immigration_and_nationality_act
            or alien_deportation_or_removal_withheld_under_listed_immigration_and_nationality_act_provisions
            or alien_is_cuban_and_haitian_entrant_as_defined_in_refugee_education_assistance_act_section_501_e
            or alien_admitted_to_united_states_as_amerasian_immigrant_described_in_section_1612_a_2_A_i_V
          )
