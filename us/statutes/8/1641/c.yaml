format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/8/1641/c
    authority_level: statute
    unsupported_period_behavior: missing_dated_snapshot_support_parameter
    runtime_validity_guard:
      parameter: statute_8_1641_c_snapshot_supported
      reason: pinned_compiler_discards_single_derived_version_dates
      engineering_support_marker_not_legal_condition: true
    supported_snapshot_from: '2025-07-04'
    validity_basis: supported_post_obbb_snapshot_not_original_enactment_date
    historical_amendment_versions_encoded: false
    official_source_url: https://www.govinfo.gov/content/pkg/USCODE-2024-title8/html/USCODE-2024-title8-chap14-subchapIV-sec1641.htm
    runtime_input_contract:
      agency_substantial_connection_findings_are_program_specific: true
      approved_and_pending_prima_facie_petition_routes_are_separate: true
      generic_battered_status_is_not_sufficient: true
      household_exclusion_is_evaluated_for_current_period: true
      input_temporal_semantics:
        spouse_or_parent_family_perpetrator_resides_in_alien_household: household_relationship_at_time_of_abuse
        alien_child_family_perpetrator_resides_in_alien_household: household_relationship_at_time_of_abuse
        parent_spouse_family_perpetrator_resides_in_parent_household: household_relationship_at_time_of_abuse
        alien_child_resides_with_battered_parent: current_period_household_relationship
        battery_or_cruelty_perpetrator_resides_with_victim_in_same_household: current_period_household_relationship
        battery_or_cruelty_perpetrator_is_in_victim_family_eligibility_unit: current_period_family_eligibility_unit
  summary: |-
    Subsection (c) extends the qualified-alien definition beyond subsection
    (b). The direct victim, parent-of-victim, and child-of-victim routes each
    require their own statutory abuse relationships and an agency finding
    connecting the abuse to the need for the benefits, plus an approved or
    pending prima-facie petition under one of the enumerated provisions.
    Paragraph (4) separately includes granted T nonimmigrant status or a
    pending application establishing a prima-facie case. The final household
    exclusion applies to this subsection, not to independent subsection (b)
    qualification. Petition and agency determinations are source facts; a
    generic battered classification is never sufficient.
    This encoding supports only the post-July 4, 2025 statutory snapshot.
    Its version start is a support boundary, not a claim that subsection (c)
    was first enacted on that date. Earlier historical versions are unencoded.
