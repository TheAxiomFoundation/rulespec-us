format: rulespec/v1
module:
  kind: composition
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/8/1641
    authority_level: statutory_definition_composition
    unsupported_period_behavior: missing_dated_snapshot_support_parameter
    runtime_validity_guard:
      parameter: statute_8_1641_definition_snapshot_supported
      reason: pinned_compiler_discards_single_derived_version_dates
      engineering_support_marker_not_legal_condition: true
    supported_snapshot_from: '2025-07-04'
    validity_basis: supported_post_obbb_snapshot_not_original_enactment_date
    historical_amendment_versions_encoded: false
    predecessor_subsection_b_artifact_preserved_byte_for_byte: true
  summary: |-
    The chapter-wide definition includes both the enumerated statuses in
    subsection (b) and the additional qualified aliens in subsection (c).
    Subsection (c)'s abuse, petition, agency-finding and household conditions
    are evaluated in its own atomic module; its exclusion does not remove an
    independent subsection (b) basis. This explicit post-July 4, 2025 snapshot
    leaves the existing subsection (b) artifact unchanged and makes no claim
    to reconstruct earlier amendments, including the scope of the COFA basis.
