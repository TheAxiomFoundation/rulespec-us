format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/8/1612/a/2
    authority_level: statute
    supported_snapshot_from: '2025-07-04'
    validity_basis: supported_post_obbb_snapshot_not_original_enactment_date
    unsupported_period_behavior: missing_dated_snapshot_support_parameter
    historical_amendment_versions_encoded: false
    runtime_validity_guard:
      parameter: statute_8_1612_a_2_snapshot_supported
      reason: pinned_compiler_discards_single_derived_version_dates
      engineering_support_marker_not_legal_condition: true
    runtime_input_contract:
      month_index_convention: year_times_12_plus_month_minus_1
      evaluation_month_index_source: materialization_period
      exact_event_dates_module: us:statutes/8/1612/a/2-dates
      imputed_event_months_are_explicitly_flagged: true
  summary: |-
    Current SNAP-relevant exceptions to 8 USC 1612(a)(1) are represented as
    separate judgments for each statutory basis. No cross-subparagraph SNAP
    aggregate is exposed because current eligibility must compose each legal
    basis with the independently amended status limits in 7 USC 2015(f).
    Waiting windows are derived from evaluation and event month indexes inside
    Axiom; callers do not supply frozen completed-year counts. Exact event dates
    remain available in the separate 2-dates observational module so dense
    eligibility execution does not acquire Date roots. An explicit imputation
    diagnostic identifies decisions whose month index was imputed.
    Only the post-July 4, 2025 snapshot is supported. The version start is an
    encoding support boundary, not the original enactment date of each
    exception; earlier amendments and transition periods are not reconstructed.
  deferred_outputs:
    - output: us:statutes/8/1612/a/2#exact_day_five_year_anniversary_determination
      blocked_by:
        - axiom-rules-engine#calendar-year-date-addition-and-dense-date-inputs
      reason: |-
        The monthly runtime derives the five-year boundary from 60 elapsed
        month indexes. Exact within-month anniversary evaluation requires
        calendar-year date addition plus dense Date input binding. The exact
        qualified-status start date is retained separately rather than
        pretending year subtraction is exact.
    - output: us:statutes/8/1612/a/2#exact_day_seven_year_humanitarian_exception_determination
      blocked_by:
        - axiom-rules-engine#calendar-year-date-addition-and-dense-date-inputs
      reason: |-
        The monthly runtime derives each seven-year boundary from 84 elapsed
        month indexes. Exact event dates are retained separately, but exact
        within-month anniversary evaluation requires calendar-year date
        addition plus dense Date input binding.
imports:
  - us:statutes/8/1641/qualified-alien#qualified_alien_under_subsections_b_or_c
rules:
