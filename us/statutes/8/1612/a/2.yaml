    kind: parameter
    dtype: Count
    source: Encoding support boundary for the post-OBBB snapshot; not a statutory eligibility condition
    metadata:
      private: true
      engineering_support_marker: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/statute/8/1612/a/2
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          1

