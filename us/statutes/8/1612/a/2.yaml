              excerpt: "has resided in the United States with a status within the meaning of the term “qualified alien” for a period of 5 years or more beginning on the date of the alien’s entry into the United States"
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_8_1612_a_2_snapshot_supported * (
            benefit_evaluation_month_index - first_qualified_alien_status_start_month_index
          )

  - name: five_year_wait_is_at_sixtieth_month_boundary
