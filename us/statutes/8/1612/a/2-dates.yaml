format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/8/1612/a/2
    authority_level: statute
    unsupported_period_behavior: missing_dated_snapshot_support_parameter
    runtime_validity_guard:
      parameter: statute_8_1612_a_2_dates_snapshot_supported
      reason: pinned_compiler_discards_single_derived_version_dates
      engineering_support_marker_not_legal_condition: true
    supported_snapshot_from: '2025-07-04'
    validity_basis: supported_post_obbb_snapshot_not_original_enactment_date
    historical_amendment_versions_encoded: false
    module_role: exact_date_observation
    excluded_from_dense_eligibility_dependency_graph: true
  summary: |-
    Exact statutory event dates underlying the seven-year humanitarian
    windows. These observations are intentionally separate from the monthly
    eligibility module because the current dense Python binding cannot supply
    Date roots. The executable sibling uses month indexes and explicit
    imputation flags, and defers exact within-month anniversary decisions.
    The rules share the sibling's post-July 4, 2025 support boundary and do
    not purport to reconstruct the historical versions of these exceptions.
rules:
  - name: statute_8_1612_a_2_dates_snapshot_supported
    kind: parameter
    dtype: Count
    source: Encoding support boundary for the post-OBBB snapshot; not a statutory eligibility condition
    metadata:
      private: true
      engineering_support_marker: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/statute/8/1612/a/2
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          1

  - name: refugee_seven_year_exception_start_date
    kind: derived
    entity: Person
    dtype: Date
    period: Month
    source: 8 USC 1612(a)(2)(A)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us/statute/8/1612/a/2
              excerpt: "an alien is admitted to the United States as a refugee under section 207"
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          if statute_8_1612_a_2_dates_snapshot_supported == 1:
            refugee_admission_date
          else:
            refugee_admission_date

