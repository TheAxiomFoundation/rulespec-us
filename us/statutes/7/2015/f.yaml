format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/7/2015/f
    source_sha256: 239cc65999d115055d13b7b3a72ef1a4c83da4fdbab9ab71d0ea33536d2b96c2
    authority_level: statute
    unsupported_period_behavior: missing_dated_snapshot_support_parameter
    runtime_validity_guard:
      parameter: statute_7_2015_f_snapshot_supported
      reason: pinned_compiler_discards_single_derived_version_dates
      engineering_support_marker_not_legal_condition: true
    expression_date: '2025-07-04'
    known_from: '2025-07-04'
    legal_effective_from: '2025-07-04'
  summary: |-
    Under the current 7 U.S.C. 2015(f), an individual in a household otherwise
    eligible for SNAP may participate only if the individual resides in the
    United States and has at least one listed current basis: U.S. citizenship
    or nationality, lawful permanent residence as an immigrant, Cuban and
    Haitian entrant status, or qualifying Compact of Free Association
    residence. The listed bases are independent facts rather than mutually
    exclusive statuses.
  deferred_outputs:
    - output: us:statutes/7/2015/f#countable_income_and_financial_resources_of_individual_rendered_ineligible
      reason: |-
        The final sentence requires the income, subject to a State option for a
        pro rata share, and financial resources of an individual rendered
        ineligible under this subsection to be considered in the household
        determination. Computing those amounts requires household composition,
        the State option, and income and resource amounts outside this atomic
        alien-eligibility rule.
rules:
  - name: statute_7_2015_f_snapshot_supported
    kind: parameter
    dtype: Count
    source: Encoding support boundary for the post-OBBB snapshot; not a statutory eligibility condition
    metadata:
      private: true
      engineering_support_marker: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          1

  - name: snap_subsection_f_citizen_or_national_basis_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)(2)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            person_is_citizen_of_united_states
            or person_is_national_of_united_states
          )

  - name: snap_subsection_f_current_lawful_permanent_resident_basis_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)(2)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            alien_lawfully_admitted_for_permanent_residence_under_immigration_and_nationality_act
          )

  - name: snap_subsection_f_current_cuban_haitian_entrant_basis_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)(2)(C)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            alien_is_cuban_and_haitian_entrant_as_defined_in_refugee_education_assistance_act_section_501_e
          )

  - name: snap_subsection_f_current_qualifying_cofa_resident_basis_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)(2)(D)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            individual_lawfully_resides_in_united_states_in_accordance_with_compact_of_free_association_referred_to_in_section_1612_b_2_G
          )

  - name: listed_current_citizenship_or_alien_basis_for_snap
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            snap_subsection_f_citizen_or_national_basis_met
            or snap_subsection_f_current_lawful_permanent_resident_basis_met
            or snap_subsection_f_current_cuban_haitian_entrant_basis_met
            or snap_subsection_f_current_qualifying_cofa_resident_basis_met
          )

  - name: snap_subsection_f_residence_and_status_requirement_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            person_is_resident_of_united_states
            and listed_current_citizenship_or_alien_basis_for_snap
          )

  - name: individual_eligible_to_participate_in_snap_under_subsection_f
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            person_is_member_of_household_otherwise_eligible_to_participate_under_this_section
            and snap_subsection_f_residence_and_status_requirement_met
          )

  - name: individual_rendered_ineligible_to_participate_in_snap_under_subsection_f
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            person_is_member_of_household_otherwise_eligible_to_participate_under_this_section
            and not snap_subsection_f_residence_and_status_requirement_met
          )

  - name: ineligible_individual_income_and_financial_resources_subject_to_household_consideration
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 7 U.S.C. 2015(f)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/7/2015/f
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          statute_7_2015_f_snapshot_supported == 1
          and (
            individual_rendered_ineligible_to_participate_in_snap_under_subsection_f
          )
