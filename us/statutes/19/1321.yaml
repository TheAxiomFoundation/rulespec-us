format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/19/1321
  summary: |-
    The Secretary may disregard small duty/fee/tax differences, admit qualifying articles free of duty and importation tax subject to value limits and a separated-lots anti-abuse rule, waive collection under a small-amount threshold, prescribe exceptions to exemptions, and assess civil penalties up to $5,000 for a first violation and $10,000 for subsequent violations.
rules:
  - name: minimum_disregarded_difference_amount
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(a)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "but not less than $20"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          20

  - name: minimum_gift_exemption_amount
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(a)(2)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "$100 in the case of articles sent as bona fide gifts"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          100

  - name: minimum_territory_gift_exemption_amount
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(a)(2)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "$200 in the case of articles sent as bona fide gifts from persons in the Virgin Islands, Guam, and American Samoa"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          200

  - name: minimum_arriving_person_exemption_amount
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(a)(2)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "$200 in the case of articles accompanying, and for the personal or household use of, persons arriving in the United States"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          200

  - name: minimum_other_case_exemption_amount
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(a)(2)(C)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "$800 in any other case"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          800

  - name: waiver_collection_amount_floor
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(a)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "less than $20 or such greater amount as may be specified"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          20

  - name: first_violation_civil_penalty_cap
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "up to $5,000 for the first violation"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          5000

  - name: subsequent_violation_civil_penalty_cap
    kind: parameter
    dtype: Money
    unit: USD
    source: 19 U.S.C. 1321(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "up to $10,000 for each subsequent violation"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          10000

  - name: applicable_article_free_duty_exemption_minimum
    kind: derived
    entity: Importation
    dtype: Money
    period: Day
    unit: USD
    source: 19 U.S.C. 1321(a)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "not less than— (A) $100 ... ($200 ... Virgin Islands, Guam, and American Samoa) ... (B) $200 ... or (C) $800"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if articles_sent_as_bona_fide_gifts_from_virgin_islands_guam_or_american_samoa_to_persons_in_united_states: minimum_territory_gift_exemption_amount else: if articles_sent_as_bona_fide_gifts_from_foreign_countries_to_persons_in_united_states: minimum_gift_exemption_amount else: if articles_accompany_arriving_person_for_personal_or_household_use_and_no_9804_exemption: minimum_arriving_person_exemption_amount else: minimum_other_case_exemption_amount

  - name: articles_may_be_admitted_free_of_duty
    kind: derived
    entity: Importation
    dtype: Judgment
    period: Day
    source: 19 U.S.C. 1321(a)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "aggregate fair retail value in the country of shipment of articles imported by one person on one day"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "shall not be granted ... merchandise covered by a single order or contract is forwarded in separate lots"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          aggregate_fair_retail_value_in_country_of_shipment <= applicable_article_free_duty_exemption_minimum
          and not merchandise_covered_by_single_order_or_contract_forwarded_in_separate_lots_to_secure_privilege

  - name: duties_fees_taxes_and_interest_collection_may_be_waived
    kind: derived
    entity: CustomsEntry
    dtype: Judgment
    period: Day
    source: 19 U.S.C. 1321(a)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "waive the collection of duties, fees, taxes, and interest due on entered merchandise when such duties, fees, taxes, or interest are less than $20"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          duties_fees_taxes_or_interest_due_on_entered_merchandise < waiver_collection_amount_floor

  - name: civil_penalty_cap_for_privilege_violation
    kind: derived
    entity: CustomsViolation
    dtype: Money
    period: Day
    unit: USD
    source: 19 U.S.C. 1321(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/19/1321
              excerpt: "up to $5,000 for the first violation and up to $10,000 for each subsequent violation"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if violation_is_first_violation: first_violation_civil_penalty_cap else: subsequent_violation_civil_penalty_cap
