  source_verification:
    corpus_citation_path: us/statute/19/1401a
  summary: |-
    Imported merchandise is appraised using transaction value, then identical or similar merchandise value, deductive value, computed value, and fallback value. Transaction value includes the price actually paid or payable plus specified additions when supported by sufficient information. Deductive value uses selected United States resale unit prices with specified reductions and additions. The section defines assist, identical merchandise, packing costs, similar merchandise, and sufficient information.
  deferred_outputs:
    - output: us:statutes/19/1401a/b#transaction_value_of_imported_merchandise
      reason: The subsection defines a customs merchandise valuation formula that depends on merchandise-sale facts, related-party acceptability, sufficient-information determinations, exclusions, and customs appraisement concepts not faithfully represented by the available RuleSpec entity schema in this artifact.
    - output: us:statutes/19/1401a/d#deductive_value
      reason: The subsection defines deductive value through merchandise resale timing, condition after importation, greatest aggregate quantity, importer elections, processing value, tax, insurance, transportation, profit, and assist-supplier sale exclusions that require a customs merchandise-sale relation model not available in this artifact.
    - output: us:statutes/19/1401a/h#definitions
      reason: The subsection supplies definitions for assist, identical merchandise, packing costs, similar merchandise, and sufficient information; these definitions are cross-cutting customs valuation concepts requiring a merchandise/component/service ontology and same-production/same-country comparison relations not available in this artifact.
