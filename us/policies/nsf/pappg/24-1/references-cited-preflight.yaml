format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/nsf/pappg/24-1/chapter-ii/block-28
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us/regulation/2/200/204/page-2
      rationale: 2 CFR 200.204 addresses notices of funding opportunities and application information generally; NSF PAPPG 24-1 Chapter II is the direct operative proposal-preparation source for References Cited citation content and preflight review.
  summary: |-
    Reference information is required. Each reference must include all authors in publication order and applicable bibliographic fields. Website addresses are optional, and missing URLs do not violate NSF proposal preparation guidelines. The section must include bibliographic citations only and must not provide parenthetical information outside of the 15-page Project Description.
rules:
  - name: references_cited_source_requirements_hold
    kind: derived
    entity: Proposal
    dtype: Judgment
    period: Day
    source: NSF PAPPG 24-1 Chapter II, References Cited
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/guidance/nsf/pappg/24-1/chapter-ii/block-28
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/guidance/nsf/pappg/24-1/chapter-ii/block-28
              excerpt: Each reference must include the names of all authors (in the same sequence in which they appear in the publication)
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/guidance/nsf/pappg/24-1/chapter-ii/block-28
              excerpt: inclusion of a website address is optional
    versions:
      - effective_from: '2024-05-20'
        formula: |-
          reference_information_is_provided
          and every_reference_includes_all_authors_in_publication_order
          and every_journal_article_reference_includes_article_title
          and every_journal_article_reference_includes_journal_title
          and every_book_reference_includes_book_title
          and every_reference_includes_applicable_volume_number
          and every_reference_includes_applicable_page_numbers
          and every_reference_includes_year_of_publication
          and citations_follow_accepted_scholarly_practices_for_source_materials_relied_upon
          and references_cited_section_includes_bibliographic_citations_only
          and references_cited_section_does_not_provide_parenthetical_information_outside_project_description

  - name: references_cited_adapter_evidence_reconciles
    kind: derived
    entity: Proposal
    dtype: Judgment
    period: Day
    source: NSF PAPPG 24-1 Chapter II, References Cited preflight evidence reconciliation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/guidance/nsf/pappg/24-1/chapter-ii/block-28
              excerpt: Reference information is required
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/guidance/nsf/pappg/24-1/chapter-ii/block-28
    versions:
      - effective_from: '2024-05-20'
        formula: |-
          reference_count_reconciles_to_parsed_citation_records
          and all_author_attestations_reconcile_to_parsed_citation_records
          and applicable_field_attestations_reconcile_to_parsed_citation_records
          and citations_only_scan_reconciles_to_uploaded_references_cited_section

  - name: pappg_references_cited_preflight_requirements_hold
    kind: derived
    entity: Proposal
    dtype: Judgment
    period: Day
    source: NSF PAPPG 24-1 Chapter II, References Cited
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/guidance/nsf/pappg/24-1/chapter-ii/block-28
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/nsf/pappg/24-1/references-cited-preflight#references_cited_source_requirements_hold
              output: references_cited_source_requirements_hold
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/nsf/pappg/24-1/references-cited-preflight#references_cited_adapter_evidence_reconciles
              output: references_cited_adapter_evidence_reconciles
              hash: sha256:local
    versions:
      - effective_from: '2024-05-20'
        formula: |-
          references_cited_source_requirements_hold
          and references_cited_adapter_evidence_reconciles
