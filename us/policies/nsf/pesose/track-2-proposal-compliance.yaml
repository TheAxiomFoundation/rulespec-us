format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/nsf/pesose/nsf-26-506/block-15
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us/regulation/2/200/204/page-2
      rationale: 2 CFR 200.204 requires an openly competed funding opportunity to be announced in a public notice and specifies required notice content. NSF 26-506 is the operative program-specific notice, so its proposal preparation instructions are the direct source for these applicant compliance checks.
  summary: |-
    Proposal titles must begin with "PESOSE: " followed by the track and title. The last line of the Project Summary must have a prioritized list of 2-5 keywords or phrases. Tracks 2 and 3 have a 15 page Project Description maximum. All PESOSE proposals must include an existing open-source product pointer, current product status details, the problem being addressed, and team qualifications. Track 2 proposals should address ecosystem growth, organization and governance, continuous development, risk analysis and security, community building, sustainability, and an evaluation plan. Track 2 budgets must not exceed $1,500,000 for up to 2 years. A minimum of three and up to five letters of collaboration are required, and the list of project personnel, collaborators, and partner organizations is required.
rules:
  - name: minimum_project_summary_keywords
    kind: parameter
    dtype: Count
    source: NSF 26-506 Proposal Preparation Instructions, Project Summary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/guidance/nsf/pesose/nsf-26-506/block-15
              excerpt: "prioritized list of 2-5 keywords or phrases"
    versions:
      - effective_from: '2026-02-19'
        formula: |-
          2

  - name: maximum_project_summary_keywords
    kind: parameter
    dtype: Count
    source: NSF 26-506 Proposal Preparation Instructions, Project Summary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
