            source:
              corpus_citation_path: us/guidance/nsf/pesose/nsf-26-506/block-15
              excerpt: "$1,500,000 for up to 2 years for Track 2 and Track 3 proposals"
    versions:
      - effective_from: '2026-02-19'
        formula: |-
          1500000

