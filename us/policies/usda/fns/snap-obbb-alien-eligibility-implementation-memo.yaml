      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
          excerpt: Were lawfully residing in the U.S. and 65 or older on August 22,
            1996
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
          excerpt: Have a U.S. military connection
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
          excerpt: admitted to the United States as an Amerasian immigrant
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
          excerpt: Are an American Indian born abroad
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
          excerpt: Certain Hmong or Highland Laotian tribal members
  versions:
  - effective_from: '0001-01-01'
    formula: "person_is_lawful_permanent_resident\nand (\n  person_age < lpr_child_age_limit\n\
      \  or person_qualifying_work_quarters >= qualifying_work_quarters_required_for_lpr_exception\n\
      \  or person_is_blind_or_disabled\n  or (\n    person_was_lawfully_residing_on_statutory_reference_date\n\
      \    and person_age_on_statutory_reference_date >= statutory_reference_age_for_lpr_exception\n\
      \  )\n  or person_has_us_military_connection\n  or person_is_admitted_as_amerasian_immigrant\n\
      \  or person_is_american_indian_born_abroad\n  or person_is_hmong_or_highland_laotian_tribal_member\n\
      )"
