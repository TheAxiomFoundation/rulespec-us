format: rulespec/v1
module:
  summary: '“Section 10108 of the OBBB was effective upon enactment, July 4, 2025.”

    SNAP eligibility is limited to citizens, U.S. nationals, LPRs, Cuban and

    Haitian entrants, and COFA citizens; LPRs remain subject to the 5-year

    waiting period unless a listed PRWORA exemption applies.'
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
    source_sha256: 0be8e3e6891999b0f1e4a6dca6dc459063797d22a7b8f9fd5a8294213b7d655c
rules:
- name: trafficking_victim_lpr_path_applies
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Attachment 1, page 7
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: Victims of Severe Trafficking and Certain Family Members Eligible
            immediately Not eligible unless an LPR.
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: Section 10108 of the OBBB was effective upon enactment, July 4,
            2025.
