- name: lpr_snap_eligibility_without_waiting_period
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: SNAP Alien Eligibility, page 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
