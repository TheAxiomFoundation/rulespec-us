          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-3
          excerpt: will not apply if the State agency does not implement the new provision
            in accordance with 7 CFR 275.12(d)(2)(vii)(D)
  versions:
