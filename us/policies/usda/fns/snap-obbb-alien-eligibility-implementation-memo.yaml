      or lpr_is_blind_or_disabled

      or lpr_was_lawfully_residing_and_65_or_older_on_august_22_1996

      or lpr_has_us_military_connection

      or lpr_is_admitted_amerasian_immigrant

      or lpr_is_american_indian_born_abroad

      or lpr_is_hmong_or_highland_laotian_tribal_member'
- name: lpr_snap_eligibility
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: SNAP Alien Eligibility, pages 2 and 8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: Eligible Alien Groups Under the OBBB Eligibility Timing x Non-citizen
            U.S. nationals x Cuban and Haitian entrants x Compacts of Free Association
            (COFA) citizens Eligible immediately, with no waiting period, as long
            as they meet all other SNAP financial and non-financial eligibility requirements.
            x Lawful permanent residents (LPR) (also known as Green Card holders)
            Eligible after a 5-year waiting period, as long as they meet all other
            SNAP financial and non-financial eligibility requirements.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: LPRs may still be eligible for SNAP without a waiting period
  versions:
  - effective_from: '2025-07-04'
    formula: "person_is_lawful_permanent_resident\nand (\n  lpr_waiting_period_years_completed\
      \ >= lpr_waiting_period_years\n  or lpr_waiting_period_exempt\n)"
- name: alien_snap_eligibility
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: SNAP Alien Eligibility; Attachment 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: 'SNAP Alien Eligibility Section 10108 of the OBBB amends section
            6(f) of the Food and Nutrition Act of 2008 (FNA), limiting eligibility
            for SNAP to the following groups: U.S. citizens, U.S. nationals, lawful
            permanent residents (LPRs), Cuban and Haitian entrants1, and Compact of
            Free Association (COFA) citizens.'
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: as long as they meet all other SNAP financial and non-financial
            eligibility requirements.
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: Section 10108 of the OBBB was effective upon enactment, July 4,
            2025.
  versions:
  - effective_from: '2025-07-04'
    formula: "person_meets_other_snap_financial_and_nonfinancial_requirements\nand\
      \ (\n  person_is_us_citizen\n  or person_is_non_citizen_us_national\n  or person_is_cuban_or_haitian_entrant\n\
      \  or person_is_cofa_citizen\n  or lpr_snap_eligibility\n)"
