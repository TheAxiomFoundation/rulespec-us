- name: trafficking_victim_lpr_path_applies
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Attachment 1, page 7
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: Victims of Severe Trafficking and Certain Family Members Eligible
            immediately Not eligible unless an LPR
  versions:
