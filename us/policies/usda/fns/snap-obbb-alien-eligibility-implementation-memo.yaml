- name: lawful_permanent_resident_snap_eligibility_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Attachment 1, pages 5-6
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-5
          excerpt: Eligible after a 5-year waiting period
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-5
          excerpt: LPRs may still be eligible for SNAP without a waiting period
  versions:
  - effective_from: '0001-01-01'
    formula: "person_is_lawful_permanent_resident\nand (\n  person_years_as_lawful_permanent_resident\
      \ >= lawful_permanent_resident_waiting_period_years\n  or person_age < lpr_child_age_limit\n\
      \  or person_qualifying_work_quarters >= qualifying_work_quarters_required_for_lpr_exception\n\
      \  or person_is_blind_or_disabled\n  or (\n    person_was_lawfully_residing_on_statutory_reference_date\n\
      \    and person_age_on_statutory_reference_date >= statutory_reference_age_for_lpr_exception\n\
      \  )\n  or person_has_us_military_connection\n  or person_is_admitted_as_amerasian_immigrant\n\
      \  or person_is_american_indian_born_abroad\n  or person_is_hmong_or_highland_laotian_tribal_member\n\
      )"
