format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
    source_sha256: 0be8e3e6891999b0f1e4a6dca6dc459063797d22a7b8f9fd5a8294213b7d655c
  summary: '“Section 10108 of the OBBB amends section 6(f) of the Food and Nutrition

    Act of 2008 (FNA), limiting eligibility for SNAP” to the listed groups,

    and “was effective upon enactment, July 4, 2025.” Attachment 1 identifies

    pre- and post-OBBB eligibility, LPR pathways, alternative-status review,

    and the quality-control exclusion ending November 1, 2025.'
rules:
- name: quality_control_variance_exclusion_applies
  kind: derived
  entity: StateAgency
  dtype: Judgment
  period: Day
  source: Quality Control and Technical Assistance, pages 3-4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-4
          excerpt: A 120-day variance exclusion is permitted
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-4
          excerpt: until the exclusionary period end date on November 1, 2025
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-3
          excerpt: will not apply if the State agency does not implement the new provision
      - path: versions[1].formula
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-4
          excerpt: until the exclusionary period end date on November 1, 2025
  versions:
  - effective_from: '2025-07-04'
    effective_to: '2025-10-31'
    formula: 'state_agency_implemented_new_provision_in_accordance_with_7_cfr_275_12_d_2_vii_d

      and state_agency_days_since_required_implementation_date <= quality_control_variance_exclusion_days

      and quality_control_variance_exclusion_period_has_not_ended'
  - effective_from: '2025-11-01'
    formula: 'false'
- name: trafficking_victim_lpr_path_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Attachment 1, page 7
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: See “Post- OBBB Eligibility” for LPR Victims of Severe Trafficking
            and Certain Family Members Eligible immediately Not eligible unless an
            LPR.
  versions:
  - effective_from: '2025-07-04'
    formula: 'person_is_trafficking_victim_or_covered_family_member

      and lawful_permanent_resident_snap_eligibility_applies'
- name: alternative_eligible_status_must_be_determined
  kind: derived
  entity: StateAgency
  dtype: Judgment
  period: Month
  source: Attachment 1, page 5
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-5
          excerpt: If eligibility expires under one eligible alien status, the State
            agency must determine if eligibility exists under another status.
  versions:
  - effective_from: '2025-07-04'
    formula: state_agency_has_case_with_eligibility_expiring_under_one_eligible_alien_status
- name: alien_snap_eligibility
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: SNAP Alien Eligibility; Implementation, pages 1-3; Attachment 1, pages 5-8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: Prior to the OBBB, certain lawfully present aliens
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-11
          excerpt: Paroled into the U.S. under §212(d)(5) of the INA for a period
            of at least 1 year.
      - path: versions[1].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: limiting eligibility for SNAP to the following groups
      - path: versions[1].formula
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-3
          excerpt: effective upon enactment, July 4, 2025
  versions:
  - effective_from: '0001-01-01'
    effective_to: '2025-07-03'
    formula: "person_meets_other_snap_financial_and_nonfinancial_requirements\nand\
      \ person_meets_snap_residence_requirement\nand (\n  person_is_us_citizen\n \
      \ or person_is_non_citizen_us_national\n  or (\n    person_has_required_immigration_documentation\n\
      \    and (\n      lawful_permanent_resident_snap_eligibility_applies\n     \
      \ or person_is_cuban_or_haitian_entrant\n      or person_is_cofa_citizen\n \
      \     or person_is_deportation_or_removal_withheld\n      or person_is_iraqi_or_afghan_special_immigrant\n\
      \      or person_is_conditional_entrant\n      or person_is_battered_alien\n\
      \      or person_is_trafficking_victim_or_covered_family_member\n      or person_is_refugee\n\
      \      or person_is_granted_asylum\n      or person_is_covered_afghan_parolee\n\
      \      or person_is_covered_ukrainian_parolee\n      or person_is_american_indian_born_abroad\n\
      \      or person_is_hmong_or_highland_laotian_tribal_member\n      or (\n  \
      \      person_is_parolee\n        and person_authorized_parole_period_years\
      \ >= minimum_parole_period_years\n        and (\n          person_age < lpr_child_age_limit\n\
      \          or person_is_blind_or_disabled\n          or person_years_in_parolee_status\
      \ >= lawful_permanent_resident_waiting_period_years\n        )\n      )\n  \
      \  )\n  )\n)"
  - effective_from: '2025-07-04'
    formula: "person_meets_other_snap_financial_and_nonfinancial_requirements\nand\
      \ person_meets_snap_residence_requirement\nand (\n  person_is_us_citizen\n \
      \ or person_is_non_citizen_us_national\n  or (\n    person_has_required_immigration_documentation\n\
      \    and (\n      lawful_permanent_resident_snap_eligibility_applies\n     \
      \ or person_is_cuban_or_haitian_entrant\n      or person_is_cofa_citizen\n \
      \   )\n  )\n)"
