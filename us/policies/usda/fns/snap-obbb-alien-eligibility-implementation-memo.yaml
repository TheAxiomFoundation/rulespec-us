format: rulespec/v1
rules:
- name: trafficking_victim_lpr_path_applies
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Attachment 1, page 7
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: Victims of Severe Trafficking and Certain Family Members Eligible
            immediately Not eligible unless an LPR
  versions:
  - effective_from: '2025-07-04'
    formula: 'person_is_trafficking_victim_or_covered_family_member

      and person_is_lawful_permanent_resident'
- name: alien_snap_eligibility
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: SNAP Alien Eligibility; Implementation, pages 1-3; Attachment 1, pages 5-8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: Prior to the OBBB, certain lawfully present aliens, as defined
            by the Personal Responsibility and Work Opportunity Act (PRWORA)2 were
            eligible to receive SNAP benefits, provided they met all other SNAP eligibility
            requirements and completed a 5-year waiting period, unless exempted by
            PRWORA.
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: Deportation Withheld Eligible immediately
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: Conditional Entrants Eligible immediately
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: Battered Aliens Eligible immediately
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: Victims of Severe Trafficking and Certain Family Members Eligible
            immediately
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
          excerpt: Refugees Eligible immediately
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-8
          excerpt: Individuals Granted Asylum Eligible immediately
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-8
          excerpt: Parolees Eligible after a 5-year waiting period
      - path: versions[1].formula
        kind: formula
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
          excerpt: limiting eligibility for SNAP to the following groups
      - path: versions[1].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
          excerpt: as long as they meet all other SNAP financial and non-financial
            eligibility requirements
      - path: versions[1].formula
        kind: effective_period
        source:
          corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-3
          excerpt: Section 10108 of the OBBB was effective upon enactment, July 4,
            2025.
  versions:
  - effective_from: '0001-01-01'
    effective_to: '2025-07-03'
    formula: "person_meets_other_snap_financial_and_nonfinancial_requirements\nand\
      \ person_meets_snap_residence_requirement\nand person_has_required_immigration_documentation\n\
      and (\n  person_is_us_citizen\n  or person_is_non_citizen_us_national\n  or\
      \ person_is_cuban_or_haitian_entrant\n  or person_is_cofa_citizen\n  or lawful_permanent_resident_snap_eligibility_applies\n\
      \  or person_is_deportation_or_removal_withheld\n  or person_is_iraqi_or_afghan_special_immigrant\n\
      \  or person_is_conditional_entrant\n  or person_is_battered_alien\n  or person_is_trafficking_victim_or_covered_family_member\n\
      \  or person_is_refugee\n  or person_is_granted_asylum\n  or (\n    person_is_parolee\n\
      \    and person_years_in_parolee_status >= lawful_permanent_resident_waiting_period_years\n\
      \  )\n  or person_is_covered_afghan_parolee\n  or person_is_covered_ukrainian_parolee\n\
      \  or person_is_american_indian_born_abroad\n  or person_is_hmong_or_highland_laotian_tribal_member\n\
      )"
  - effective_from: '2025-07-04'
    formula: "person_meets_other_snap_financial_and_nonfinancial_requirements\nand\
      \ person_meets_snap_residence_requirement\nand person_has_required_immigration_documentation\n\
      and (\n  person_is_us_citizen\n  or person_is_non_citizen_us_national\n  or\
      \ person_is_cuban_or_haitian_entrant\n  or person_is_cofa_citizen\n  or lawful_permanent_resident_snap_eligibility_applies\n\
      )"
