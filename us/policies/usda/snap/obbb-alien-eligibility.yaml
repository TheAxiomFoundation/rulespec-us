      rationale: |-
        The amended 7 U.S.C. 2015(f) controls from July 4, 2025 and supplies
        the closed list of current statuses. The atomic title 8 modules supply
        the five-year rule and encoded statutory exceptions. The existing 7
        CFR 273.4 encoding is preserved as pre-amendment regulatory provenance
        but cannot expand the later statute. The October memorandum and the
        December revised Q&A remain separate historical guidance layers. For
        this December 9 federal-baseline snapshot, the revised Q&A's later
        clarification controls the conflict over LPR adjustees; it does not
        change the statute's July 4 effective date.
  summary: |-
    Federal-baseline SNAP citizenship and alien-eligibility composition using
    authority issued through December 9, 2025, after section 10108 of Public
    Law 119-21. It does not encode USDA's April 2026 select-state,
    litigation-related overlay and must not be read as an August 2026
    nationwide determination. A citizen or national, a Cuban or
    Haitian entrant, or a qualifying COFA resident has an immediate current-
    status path. A current LPR qualifies after five years residing with
    qualified-alien status or through a no-wait exception. The later revised
    Q&A correctly preserves no-new-wait treatment for LPR adjustees with
    refugee, asylum, withholding, and other listed histories. A humanitarian
    history alone does not satisfy the amended current-status list, but it is
    retained and can affect an LPR's waiting-period treatment.
