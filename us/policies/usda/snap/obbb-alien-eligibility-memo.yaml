              output: permanent_resident_forty_qualifying_quarters_exception_applies
              hash: sha256:edb825318e49cc0d379d3e0910695e06161b56ea037618fe2c9cd7ea0865f8c7
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/8/1612/a/2#veteran_or_active_duty_exception_applies
              output: veteran_or_active_duty_exception_applies
              hash: sha256:edb825318e49cc0d379d3e0910695e06161b56ea037618fe2c9cd7ea0865f8c7
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/8/1612/a/2#snap_blindness_or_disability_benefit_exception_applies
              output: snap_blindness_or_disability_benefit_exception_applies
              hash: sha256:edb825318e49cc0d379d3e0910695e06161b56ea037618fe2c9cd7ea0865f8c7
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/8/1612/a/2#certain_indian_exception_applies
              output: certain_indian_exception_applies
              hash: sha256:edb825318e49cc0d379d3e0910695e06161b56ea037618fe2c9cd7ea0865f8c7
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/8/1612/a/2#snap_elderly_1996_grandfather_exception_applies
              output: snap_elderly_1996_grandfather_exception_applies
              hash: sha256:edb825318e49cc0d379d3e0910695e06161b56ea037618fe2c9cd7ea0865f8c7
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/8/1612/a/2#snap_child_exception_applies
