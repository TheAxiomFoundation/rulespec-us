            kind: exception
            source:
              corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-2
              excerpt: "LPRs may still be eligible for SNAP without a waiting period if they meet one or more of the following conditions"
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/8/1612/a/2#amerasian_immigrant_seven_year_exception_applies
              output: amerasian_immigrant_seven_year_exception_applies
              hash: sha256:edb825318e49cc0d379d3e0910695e06161b56ea037618fe2c9cd7ea0865f8c7
          - path: versions[0].formula
