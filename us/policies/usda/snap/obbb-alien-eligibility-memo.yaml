format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo
    authority_level: guidance
    unsupported_period_behavior: missing_dated_snapshot_support_parameter
    runtime_validity_guard:
      parameter: snap_obbb_memo_snapshot_supported
      reason: pinned_compiler_discards_single_derived_version_dates
      engineering_support_marker_not_legal_condition: true
    issued_on: '2025-10-31'
    expression_date: '2025-10-31'
    known_from: '2025-10-31'
    legal_effective_from: '2025-07-04'
    bitemporal_runtime_selection:
      assessment_date_selects_known_authority: false
      status: metadata_only_pending_engine_support
      blocker: axiom-rules-engine/docs/bitemporal.md
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us/statute/7/2015/f
        - us/statute/8/1612/a/2
        - us/regulation/7/273/4
      rationale: |-
        This module preserves the October 31, 2025 memorandum as issued. The
        amended statute controls from July 4, 2025. The still-published
        pre-amendment regulation is retained as regulatory provenance, not used
        to expand the amended statutory status list. A later revised Q&A is
        encoded in its own module rather than rewriting this historical layer.
  summary: |-
    USDA/FNS's October 31, 2025 implementation memorandum as issued. It states
    the amended closed status list, records statuses removed as standalone SNAP
    bases, and lists the LPR no-wait exceptions the memorandum identified. This
    module intentionally preserves that contemporaneous interpretation even
    where the December 9 revised Q&A later clarified the treatment of people
    who adjusted to LPR from humanitarian statuses.
imports:
  - us:statutes/8/1612/a/2#amerasian_immigrant_seven_year_exception_applies
  - us:statutes/8/1612/a/2#permanent_resident_forty_qualifying_quarters_exception_applies
  - us:statutes/8/1612/a/2#veteran_or_active_duty_exception_applies
  - us:statutes/8/1612/a/2#snap_blindness_or_disability_benefit_exception_applies
  - us:statutes/8/1612/a/2#certain_indian_exception_applies
  - us:statutes/8/1612/a/2#snap_elderly_1996_grandfather_exception_applies
  - us:statutes/8/1612/a/2#snap_child_exception_applies
  - us:statutes/8/1612/a/2#snap_hmong_or_highland_laotian_exception_applies
rules:
  - name: snap_obbb_memo_snapshot_supported
    kind: parameter
    dtype: Count
    source: Encoding support boundary for the post-OBBB snapshot; not a statutory eligibility condition
    metadata:
      private: true
      engineering_support_marker: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-1
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          1

  - name: october_2025_memo_implements_amended_section_6_f
    kind: source_relation
    source: USDA/FNS OBBB alien eligibility implementation memorandum, October 31, 2025
    source_relation:
      type: cites
      target: us:statutes/7/2015/f#listed_current_citizenship_or_alien_basis_for_snap

  - name: october_2025_memo_preserves_pre_amendment_regulation_provenance
    kind: source_relation
    source: USDA/FNS OBBB alien eligibility implementation memorandum, attachment 1, page 5
    source_relation:
      type: cites
      target: us:regulations/7-cfr/273/4#snap_member_citizenship_or_alien_status_eligible

  - name: october_2025_memo_removed_or_unlisted_status_observed
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: USDA/FNS OBBB alien eligibility implementation memorandum attachment 1, pages 7-8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-7
              excerpt: "Refugees Eligible immediately Not eligible"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/guidance/usda/fns/snap-obbb-alien-eligibility-implementation-memo/page-8
              excerpt: "Individuals Granted Asylum Eligible immediately Not eligible"
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          snap_obbb_memo_snapshot_supported == 1
          and (
            member_has_refugee_admission_or_status
            or member_has_asylum_grant
            or member_has_deportation_or_removal_withheld
            or member_has_conditional_entrant_status
            or member_has_battered_alien_status
            or member_has_severe_trafficking_victim_or_derivative_status
            or member_has_iraqi_or_afghan_special_immigrant_history
            or member_has_parole_under_ina_212_d_5
            or member_has_qualifying_afghan_humanitarian_parole_history
            or member_has_qualifying_ukrainian_humanitarian_parole_history
            or member_has_temporary_protected_status
            or member_has_deferred_action_for_childhood_arrivals
          )

  - name: october_2025_memo_lpr_immediate_wait_exemption_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: USDA/FNS OBBB alien eligibility implementation memorandum pages 2 and 5-7
