              hash: sha256:edb825318e49cc0d379d3e0910695e06161b56ea037618fe2c9cd7ea0865f8c7
    versions:
      - effective_from: '2025-07-04'
        formula: |-
          snap_obbb_memo_snapshot_supported == 1
          and (
            snap_child_exception_applies
            or amerasian_immigrant_seven_year_exception_applies
            or permanent_resident_forty_qualifying_quarters_exception_applies
            or veteran_or_active_duty_exception_applies
            or snap_blindness_or_disability_benefit_exception_applies
            or certain_indian_exception_applies
