      rationale: |-
        The December 9, 2025 revised Q&A says it provides additional
        information on the amended statute and that guidance lacks the force
        and effect of law. It therefore does not amend the statute. It later
        clarifies the October memorandum's treatment of people who adjust to
        LPR from specified humanitarian groups. The statutory modules remain
        controlling and independently executable.
  summary: |-
    USDA/FNS's December 9, 2025 revised Q&A as a separate later-knowledge
    layer that provides additional information on, rather than replacing, the
    October memorandum. USDA says this Q&A revision corrected a typo in
    Question 5. It confirms that the five-year clock begins when a person first
    obtains qualified-alien status or enters in a qualifying status, and that
    an LPR adjustee from specified exempt groups does not begin a new five-year
    wait on adjustment. Special-immigrant, qualifying Afghan/Ukrainian parole,
    severe-trafficking, and historical COFA facts are encoded only as the Q&A's
    own classifications because no corresponding atomic RuleSpec statute
    modules currently exist in this repository.
