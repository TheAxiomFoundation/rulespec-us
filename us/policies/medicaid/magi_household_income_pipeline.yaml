format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/regulation/42/435/603/b
      - us/regulation/42/435/603/c
      - us/regulation/42/435/603/d
      - us/regulation/42/435/603/e
      - us/regulation/42/435/603/f
      - us/regulation/42/435/603/h
      - us/regulation/42/435/603/i
      - us/regulation/42/435/603/j
      - us/regulation/42/435/603/k
      - us/regulation/42/435/110
      - us/regulation/42/435/119
      - us/statute/26/36B
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us/regulation/42/435/603/b
        - us/regulation/42/435/603/c
        - us/regulation/42/435/603/d
        - us/regulation/42/435/603/e
        - us/regulation/42/435/603/f
        - us/regulation/42/435/603/h
        - us/regulation/42/435/603/i
        - us/regulation/42/435/603/j
        - us/regulation/42/435/603/k
        - us/regulation/42/435/110
        - us/regulation/42/435/119
        - us/statute/26/36B
      rationale: |-
        This policy composition owns the applicant-to-member execution
        relation because the imported paragraph-(d) relation's documentary
        argument order is opposite the pinned engine's member-first slot
        convention. The raw candidate-row relation is therefore wrapped by an
        executable derived relation with current_slot 1 (the applicant) and
        related_slot 0 (the candidate member), matching both the compiled sums
        and runtime tuples.

        Each relation row represents one person, not one payment. The caller
        therefore supplies completed current-month and projected-annual
        paragraph-(e) MAGI amounts for that person and attests that both
        streams are complete. This avoids silently treating one payment as
        the person's total MAGI.

        Paragraph (d)(2)(ii) is scoped to the claiming taxpayer's household,
        while paragraph (d)(3) is scoped to the paragraph-(f)(2)(i)
        applicant's household. Counted member MAGI is therefore summed
        separately from applicant-level cash support. Paragraph (f)(5)'s
        mandatory fallback applies the paragraph-(f)(3) relationship body
        when a filer cannot substantiate a claimed candidate.

        Paragraph (h) supplies two distinct budget bases. Current-month and
        projected-annual money remain separate; only their dimensionless FPL
        ratios feed the common eligibility comparison. Applicants and new
        enrollees use the required current-month route. A current beneficiary
        must have a resolved, exclusive State-plan election before either
        route is usable. Paragraph-(b) family-size elections, paragraph-(h)(3)
        future-change treatment, and the section 435.119(c)(2) dependent-child
        age election are also explicit inputs; no federal maximum or optional
        treatment is assumed.

        Paragraph (c) makes paragraph-(d) results subject to paragraphs (i),
        (j), and (k). This module does not implement those alternative
        methodologies. It therefore fails closed when any applies, when their
        classification is unresolved, or when a State option needed by the
        selected route is unresolved.
  summary: |-
    Fail-closed applicant-scoped Medicaid MAGI household-income composition.
    The module constructs the paragraph-(f) household for each applicant,
    including the mandatory paragraph-(f)(5) fallback; applies the
    applicant-specific paragraph-(d)(2) exclusions; adds paragraph-(d)(3)
    cash support only to the paragraph-(f)(2)(i) applicant's own household
    under a resolved State election; and applies the five-percentage-point
    subtraction only at the highest applicable MAGI standard.

    Current-month and projected-annual amounts are published on separate
    period surfaces. Public numeric outputs return zero and public Judgments
    return not_holds unless relation structure, State elections, budget
    basis, FPL correspondence, standard selection, and the paragraph-(c)
    exception route are all resolved and valid.
  deferred_outputs:
    - output: us:regulations/42-cfr/435/603/b#family_size
      reason: |-
        The caller supplies the completed applicable family size and annual
        FPL amount. This module requires an exclusive explicit State election
        for counting another pregnant household member plus attestations that
        paragraph-(b) pregnancy counting and the family-size, year, region,
        and selected-budget-basis correspondence are complete.
    - output: us:regulations/42-cfr/435/603/i#alternative_financial_eligibility_result
      reason: |-
        When paragraph (i) requires the 26 CFR 1.36B-1(e) methodology, this
        paragraph-(d) pipeline fails closed instead of publishing an ordinary
        MAGI denial or inventing the alternative result.
    - output: us:regulations/42-cfr/435/603/j#non_magi_financial_eligibility_result
      reason: |-
        Paragraph-(j) groups require sections 435.601 and 435.602. This MAGI
        pipeline fails closed for those groups.
    - output: us:regulations/42-cfr/435/603/k#section_435_214_special_methodology_result
      reason: |-
        This pipeline detects resolved paragraph-(k) State options but does
        not implement their special household, income, or family-size
        treatment; any elected treatment fails closed.

imports:
  - us:regulations/42-cfr/435/603/d#fpl_five_percentage_point_disregard_rate
  - us:regulations/42-cfr/435/603/f#state_plan_child_age_threshold
  - us:regulations/42-cfr/435/603/f#state_plan_full_time_student_age_threshold
  - us:regulations/42-cfr/435/603/h#current_monthly_budget_period_required_for_applicant_or_new_enrollee
  - us:regulations/42-cfr/435/603/h#current_beneficiary_current_monthly_budget_period_available
  - us:regulations/42-cfr/435/603/h#current_beneficiary_projected_annual_budget_period_available
  - us:regulations/42-cfr/435/603/i#fpl_threshold_for_alternative_household_income_method
  - us:regulations/42-cfr/435/119#adult_group_minimum_age
  - us:regulations/42-cfr/435/119#adult_group_maximum_age
  - us:regulations/42-cfr/435/119#adult_group_income_limit_fpl_ratio
  - us:regulations/42-cfr/435/119#dependent_child_default_age_threshold
  - us:statutes/26/36B/b#required_contribution_annual_to_monthly_divisor

rules:
  - name: medicaid_household_candidate_row_for_applicant
    kind: data_relation
    source: 42 CFR 435.603(d)(1)
    data_relation:
      predicate: medicaid_household_candidate_row_for_applicant
      arity: 2

  - name: medicaid_household_member_of_applicant
    kind: derived_relation
    source: 42 CFR 435.603(d)(1), executable member-first applicant traversal
    derived_relation:
      arity: 2
      source_relation: us:policies/medicaid/magi_household_income_pipeline#relation.medicaid_household_candidate_row_for_applicant
      current_slot: 1
      related_slot: 0
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/d
    versions:
      - effective_from: '2014-01-01'
        formula: household_row_candidate_is_the_applicant or not household_row_candidate_is_the_applicant

  - name: medicaid_applicant_under_state_plan_age
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(3)(iv), resolved State-plan age election
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/f
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/42-cfr/435/603/f#state_plan_child_age_threshold
              output: state_plan_child_age_threshold
              hash: sha256:82e4fc9da0d9256ad56169ef0aa6db2687601b4223ca9cb0846cfc1b25f24832
          - path: versions[0].formula
            kind: import
            import:
              target: us:regulations/42-cfr/435/603/f#state_plan_full_time_student_age_threshold
              output: state_plan_full_time_student_age_threshold
              hash: sha256:82e4fc9da0d9256ad56169ef0aa6db2687601b4223ca9cb0846cfc1b25f24832
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          medicaid_household_age_state_election_is_known
          and (
            medicaid_applicant_age < state_plan_child_age_threshold
            or (
              medicaid_state_plan_elects_full_time_student_age_21
              and medicaid_applicant_is_full_time_student
              and medicaid_applicant_age
                < state_plan_full_time_student_age_threshold
            )
          )

  - name: household_row_candidate_under_state_plan_age
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(3)(iv), candidate age under resolved State election
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          household_row_age_state_election_is_known
          and (
            household_row_candidate_age < state_plan_child_age_threshold
            or (
              household_row_state_plan_elects_full_time_student_age_21
              and household_row_candidate_is_full_time_student
              and household_row_candidate_age
                < state_plan_full_time_student_age_threshold
            )
          )

  - name: household_row_applicant_under_state_plan_age
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(3)(iv), applicant age copied onto relation row
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          household_row_age_state_election_is_known
          and (
            household_row_applicant_age < state_plan_child_age_threshold
            or (
              household_row_state_plan_elects_full_time_student_age_21
              and household_row_applicant_is_full_time_student
              and household_row_applicant_age
                < state_plan_full_time_student_age_threshold
            )
          )

  - name: household_row_applicant_uses_non_filer_household_rules
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(2)-(3)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          (
            not household_row_applicant_expects_to_file_federal_tax_return
            and not household_row_applicant_expects_to_be_claimed_as_tax_dependent
          )
          or household_row_applicant_is_described_in_paragraph_f_2_i
          or household_row_applicant_is_described_in_paragraph_f_2_ii
          or household_row_applicant_is_described_in_paragraph_f_2_iii

  - name: household_row_matches_paragraph_f_3_relationship_body
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(3)(i)-(iii)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          household_row_candidate_is_the_applicant
          or (
            household_row_candidate_lives_with_applicant
            and household_row_candidate_is_applicants_spouse
          )
          or (
            household_row_candidate_lives_with_applicant
            and household_row_candidate_is_applicants_child
            and household_row_candidate_under_state_plan_age
          )
          or (
            household_row_applicant_under_state_plan_age
            and household_row_candidate_lives_with_applicant
            and household_row_candidate_is_applicants_parent
          )
          or (
            household_row_applicant_under_state_plan_age
            and household_row_candidate_lives_with_applicant
            and household_row_candidate_is_applicants_sibling
            and household_row_candidate_under_state_plan_age
          )

  - name: household_row_paragraph_f_5_fallback_member
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(5), mandatory fallback to paragraph (f)(3)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/42/435/603/f
              excerpt: "the inclusion of such individual in the household of the taxpayer is determined in accordance with paragraph (f)(3) of this section."
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          household_row_applicant_expects_to_file_federal_tax_return
          and not household_row_applicant_expects_to_be_claimed_as_tax_dependent
          and not household_row_candidate_is_the_applicant
          and household_row_applicant_expects_to_claim_candidate_as_tax_dependent
          and household_row_candidate_tax_dependency_substantiation_is_resolved
          and not household_row_taxpayer_can_reasonably_establish_candidate_as_tax_dependent
          and household_row_matches_paragraph_f_3_relationship_body

  - name: household_row_internal_medicaid_household_member
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(1)-(5)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          (
            household_row_applicant_expects_to_file_federal_tax_return
            and not household_row_applicant_expects_to_be_claimed_as_tax_dependent
            and (
              household_row_candidate_is_the_applicant
              or (
                household_row_applicant_expects_to_claim_candidate_as_tax_dependent
                and household_row_candidate_tax_dependency_substantiation_is_resolved
                and household_row_taxpayer_can_reasonably_establish_candidate_as_tax_dependent
              )
            )
          )
          or (
            household_row_applicant_expects_to_be_claimed_as_tax_dependent
            and not household_row_applicant_uses_non_filer_household_rules
            and household_row_candidate_is_in_household_of_taxpayer_claiming_applicant
          )
          or (
            household_row_applicant_uses_non_filer_household_rules
            and household_row_matches_paragraph_f_3_relationship_body
          )
          or (
            household_row_candidate_is_applicants_spouse
            and household_row_candidate_lives_with_applicant
          )
          or household_row_paragraph_f_5_fallback_member

  - name: household_row_magi_excluded_from_this_applicant_household
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(d)(2), applicant-scoped child and dependent exclusions
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/regulation/42/435/603/d
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          (
            household_row_candidate_is_in_household_of_natural_adopted_or_step_parent
            and not household_row_candidate_expected_required_to_file_return_under_6012_a_1
          )
          or (
            household_row_applicant_expects_to_file_federal_tax_return
            and not household_row_applicant_expects_to_be_claimed_as_tax_dependent
            and not household_row_candidate_is_the_applicant
            and household_row_applicant_expects_to_claim_candidate_as_tax_dependent
            and household_row_candidate_is_described_in_paragraph_f_2_i
            and not household_row_candidate_expected_required_to_file_return_under_6012_a_1
          )

  - name: household_row_current_month_counted_magi
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    source: 42 CFR 435.603(d)(1)-(2) and (e), current-month counted member MAGI
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/d
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/603/e
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          if household_row_magi_excluded_from_this_applicant_household:
            0
          else:
            household_row_current_month_magi_based_income

  - name: household_row_projected_annual_counted_magi
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    source: 42 CFR 435.603(d)(1)-(2) and (h)(2), projected-annual counted member MAGI
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/d
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/603/h
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          if household_row_magi_excluded_from_this_applicant_household:
            0
          else:
            household_row_projected_annual_magi_based_income

  - name: household_row_inputs_valid
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(d) and (f), structurally valid applicant/member row
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          household_row_age_state_election_is_known
          and household_row_magi_based_income_streams_are_complete
          and household_row_applicant_age >= 0
          and household_row_candidate_age >= 0
          and (
            not household_row_applicant_expects_to_claim_candidate_as_tax_dependent
            or (
              household_row_applicant_expects_to_file_federal_tax_return
              and not household_row_applicant_expects_to_be_claimed_as_tax_dependent
            )
          )
          and (
            not (
              household_row_applicant_is_described_in_paragraph_f_2_i
              or household_row_applicant_is_described_in_paragraph_f_2_ii
              or household_row_applicant_is_described_in_paragraph_f_2_iii
            )
            or household_row_applicant_expects_to_be_claimed_as_tax_dependent
          )
          and not (
            household_row_applicant_is_described_in_paragraph_f_2_i
            and household_row_applicant_is_described_in_paragraph_f_2_ii
          )
          and not (
            household_row_applicant_is_described_in_paragraph_f_2_i
            and household_row_applicant_is_described_in_paragraph_f_2_iii
          )
          and not (
            household_row_applicant_is_described_in_paragraph_f_2_ii
            and household_row_applicant_is_described_in_paragraph_f_2_iii
          )
          and (
            not (
              household_row_applicant_is_described_in_paragraph_f_2_ii
              or household_row_applicant_is_described_in_paragraph_f_2_iii
            )
            or household_row_applicant_under_state_plan_age
          )
          and (
            not household_row_candidate_is_the_applicant
            or (
              household_row_candidate_age == household_row_applicant_age
              and not household_row_applicant_expects_to_claim_candidate_as_tax_dependent
              and (
                household_row_candidate_is_described_in_paragraph_f_2_i
                == household_row_applicant_is_described_in_paragraph_f_2_i
              )
              and not household_row_candidate_is_applicants_spouse
              and not household_row_candidate_is_applicants_child
              and not household_row_candidate_is_applicants_parent
              and not household_row_candidate_is_applicants_sibling
            )
          )
          and (
            not household_row_candidate_is_described_in_paragraph_f_2_i
            or (
              not household_row_candidate_is_applicants_spouse
              and not household_row_candidate_is_applicants_child
            )
          )
          and (
            not (
              household_row_applicant_expects_to_claim_candidate_as_tax_dependent
              and not household_row_candidate_is_the_applicant
            )
            or (
              household_row_candidate_tax_dependency_substantiation_is_resolved
              and (
                household_row_taxpayer_can_reasonably_establish_candidate_as_tax_dependent
                or not household_row_taxpayer_can_reasonably_establish_candidate_as_tax_dependent
              )
            )
          )

  - name: medicaid_household_member_for_applicant
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(1)-(5), row-level fail-closed membership result
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          household_row_inputs_valid
          and household_row_internal_medicaid_household_member

  - name: household_row_is_valid_applicant_member
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f)(1)-(4), valid self membership
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          household_row_inputs_valid
          and household_row_candidate_is_the_applicant
          and household_row_internal_medicaid_household_member

  - name: medicaid_household_relation_has_exactly_one_applicant_row
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f), every applicant household includes the individual
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          count_where(
            medicaid_household_member_of_applicant,
            household_row_candidate_is_the_applicant
          ) == 1
          and count_where(
            medicaid_household_member_of_applicant,
            household_row_is_valid_applicant_member
          ) == 1

  - name: medicaid_household_relation_rows_valid
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(d) and (f), every supplied candidate row is valid
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          len(medicaid_household_member_of_applicant) > 0
          and count_where(
            medicaid_household_member_of_applicant,
            household_row_inputs_valid
          ) == len(medicaid_household_member_of_applicant)

  - name: medicaid_household_relation_applicant_facts_consistent
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: 42 CFR 435.603(f), one applicant classification across all candidate rows
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/603/f
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          (
            (
              medicaid_applicant_expects_to_file_federal_tax_return
              and count_where(
                medicaid_household_member_of_applicant,
                household_row_applicant_expects_to_file_federal_tax_return
              ) == len(medicaid_household_member_of_applicant)
            )
            or (
              not medicaid_applicant_expects_to_file_federal_tax_return
              and count_where(
                medicaid_household_member_of_applicant,
                household_row_applicant_expects_to_file_federal_tax_return
              ) == 0
            )
