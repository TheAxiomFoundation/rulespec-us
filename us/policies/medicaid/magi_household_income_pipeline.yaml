            and medicaid_applicant_lives_with_dependent_child_under_state_selected_age
            and not medicaid_dependent_child_receives_medicaid
            and not medicaid_dependent_child_receives_chip
            and not medicaid_dependent_child_has_minimum_essential_coverage
          )

  - name: medicaid_parent_or_caretaker_relative_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 42 CFR 435.110(b), locally recomposed with actual State-plan standard
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/regulation/42/435/110
              excerpt: "The agency must provide Medicaid to parents and other caretaker relatives"
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          medicaid_magi_household_runtime_inputs_valid
          and (
            medicaid_applicant_is_parent_or_caretaker_relative
            or medicaid_applicant_is_spouse_of_parent_or_caretaker_relative_living_with_them
          )
          and parent_or_caretaker_applicant_income_at_or_below_state_plan_standard

inputs:
  # Applicant-level scalar, classification, and attestation facts.
  - name: applicable_family_size
    entity: Person
    dtype: Count
    period: Year
    description: Applicable paragraph-(b) family size for the selected budget basis.
  - name: annual_federal_poverty_level_for_applicable_family_size
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    description: Annual FPL for the applicable family size, year, and region; current-month calculations divide this amount by 12.
  - name: authoritative_fpl_lookup_family_size
    entity: Person
    dtype: Count
    period: Year
    description: Family-size key returned by the authoritative HHS poverty-guideline lookup for the determination year and region; it must equal the applicable family size.
  - name: authoritative_fpl_lookup_annual_guideline_amount
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    description: Annual poverty-guideline amount returned by the authoritative HHS lookup for its family-size key, determination year, and region; it must equal the supplied annual FPL.
  - name: applicable_family_size_fpl_year_region_and_budget_correspondence_attested
    entity: Person
    dtype: Boolean
    period: Year
    description: Required attestation that family size and annual FPL correspond to each other and to the determination year, region, and selected paragraph-(h) basis.
  - name: medicaid_paragraph_b_family_size_computation_is_complete
    entity: Person
    dtype: Boolean
    period: Year
    description: Required attestation that applicable family size applies paragraph (b), including pregnancy counting, to the complete household.
  - name: medicaid_paragraph_b_family_size_state_elections_are_known
    entity: Person
    dtype: Boolean
    period: Year
    description: Whether the State election for counting another pregnant household member is resolved.
  - name: medicaid_state_elects_count_other_pregnant_household_member_as_one
    entity: Person
    dtype: Boolean
    period: Year
    description: State elects to count another pregnant household member as one person.
  - name: medicaid_state_elects_count_other_pregnant_household_member_as_two
    entity: Person
    dtype: Boolean
    period: Year
    description: State elects to count another pregnant household member as two persons.
  - name: medicaid_state_elects_count_other_pregnant_household_member_as_self_plus_expected_children
    entity: Person
    dtype: Boolean
    period: Year
    description: State elects to count another pregnant household member as herself plus the children she expects to deliver.
  - name: highest_applicable_magi_income_standard_fpl_ratio
    entity: Person
    dtype: Rate
    period: Year
    description: Highest applicable unadjusted MAGI Medicaid standard; never include the five-point subtraction in this input.
  - name: highest_applicable_magi_standard_selection_complete_and_unadjusted
    entity: Person
    dtype: Boolean
    period: Year
    description: Required attestation that all applicable MAGI groups were considered and the selected highest standard is unadjusted.
  - name: state_plan_parent_or_caretaker_income_standard_fpl_ratio
    entity: Person
    dtype: Rate
    period: Year
    description: Actual State-plan parent/caretaker standard, not a federal maximum.
  - name: medicaid_household_relation_candidates_are_complete_and_unique
    entity: Person
    dtype: Boolean
    period: Year
    description: Required attestation that relation IDs enumerate every candidate once; exactly one applicant row is also checked structurally.
  - name: medicaid_applicant_age
    entity: Person
    dtype: Integer
    period: Year
    description: Applicant age.
  - name: medicaid_applicant_is_full_time_student
    entity: Person
    dtype: Boolean
    period: Year
    description: Applicant full-time-student status for the State-plan age election.
  - name: medicaid_household_age_state_election_is_known
    entity: Person
    dtype: Boolean
    period: Year
    description: Whether the paragraph-(f)(3)(iv) State-plan age election is resolved.
  - name: medicaid_state_plan_elects_full_time_student_age_21
    entity: Person
    dtype: Boolean
    period: Year
    description: Resolved State-plan election for the full-time-student age-21 alternative.
  - name: medicaid_applicant_expects_to_file_federal_tax_return
    entity: Person
    dtype: Boolean
    period: Year
    description: Single canonical applicant filing expectation used across all candidate rows.
  - name: medicaid_applicant_expects_to_be_claimed_as_tax_dependent
    entity: Person
    dtype: Boolean
    period: Year
