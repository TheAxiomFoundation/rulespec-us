# Hand-computed Medicaid MAGI household-income fixtures.
#
# 2026 HHS annual poverty guidelines used here:
#   family 1: $15,960; monthly FPL = $1,330.00
#   family 2: $21,640; monthly FPL = $1,803.333333...
#
# Family 1: 133% monthly = $1,768.90; 5% = $66.50;
# effective 138% = $1,835.40.
# Family 2: 133% annual = $28,781.20; 5% = $1,082.00;
# effective 138% = $29,863.20. Monthly values are $2,398.433333...,
# $90.166666..., and $2,488.60.
#
# Source: https://aspe.hhs.gov/topics/poverty-economic-mobility/poverty-guidelines

- name: member_first_relation_orientation_is_observable_and_public_outputs_are_gated
  # The raw tuple is [candidate row, applicant]. The executable derived
  # relation traverses current_slot 1 -> related_slot 0. Explicit IDs form:
  #   [member-self-1330, applicant-orientation]
  #   [nonmember-sentinel-9876, applicant-orientation]
  # Only the $1,330 self row is a household member. The nonmember's
  # independently nonzero $9,876.54 cannot be silently substituted.
  period: &january_2026 2026-01
  input:
    <<:
      - &family_one_scalars
        us:policies/medicaid/magi_household_income_pipeline#input.applicable_family_size: 1
        us:policies/medicaid/magi_household_income_pipeline#input.annual_federal_poverty_level_for_applicable_family_size: 15960
