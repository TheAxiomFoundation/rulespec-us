        us:policies/medicaid/magi_household_income_pipeline#input.state_plan_parent_or_caretaker_income_standard_fpl_ratio: 1
      - &paragraph_b_option_one
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_paragraph_b_family_size_computation_is_complete: true
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_paragraph_b_family_size_state_elections_are_known: true
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_state_elects_count_other_pregnant_household_member_as_one: true
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_state_elects_count_other_pregnant_household_member_as_two: false
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_state_elects_count_other_pregnant_household_member_as_self_plus_expected_children: false
      - &relation_complete
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_household_relation_candidates_are_complete_and_unique: true
      - &root_tax_filer_adult_30
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_applicant_age: 30
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_applicant_is_full_time_student: false
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_applicant_expects_to_file_federal_tax_return: true
