- name: executable_relation_slot_reversal_surfaces_nonzero_opposite_side_value
  # Both traversal sides carry nonzero, unequal row values: the included
  # member row has $1,330, while the applicant-side nonmember row has
  # $9,876.54. The declared current_slot 1 -> related_slot 0 traversal yields
  # $1,330. Reversing those executable slots severs the applicant's traversal
  # and yields $0, so the mutation cannot pass this companion.
  period: *january_2026
  input:
    <<:
      - *family_one_scalars
      - *paragraph_b_option_one
      - *relation_complete
      - *root_tax_filer_adult_30
      - *paragraph_f_age_19
      - *paragraph_h_3_option_off
      - *section_435_119_default_age_no_child
      - *zero_outgoing_support
      - *applicant_current_month_budget
      - *router_core
      - *paragraph_i_resolved_nontrigger
      - *paragraph_j_clear
      - *paragraph_k_clear
      - *consumer_common
      - *parent_true
      - *row_streams_complete
