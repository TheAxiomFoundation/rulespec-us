        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_current_month_actually_available_cash_support: 0
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_projected_annual_actually_available_cash_support: 0
      - &paragraph_f_age_19
