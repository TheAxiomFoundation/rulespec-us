        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_applicant_is_described_in_paragraph_f_2_iii: false
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_cash_support_state_election_is_known: true
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_state_option_includes_actually_available_cash_support: false
        us:policies/medicaid/magi_household_income_pipeline#input.medicaid_cash_support_nominal_amount_determination_is_resolved: true
