format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/manual/ssa/poms/si/01120.210
    source_sha256: 0210b47833f3d6de1326892cf9f10aa16345a58a5422b5a214f261eb65589d36
  summary: If an ineligible spouse, parent, or spouse of parent owns a retirement
    fund, we exclude it from the deeming process (SI 01330.120 and 01330.220).
  deferred_outputs:
  - output: us:policies/ssa/poms/si/01120/210#ssi_retirement_periodic_countability
    reason: SI 01120.210 B says a fund for a person eligible for periodic payments
      “may not be a countable resource,” and D.1 directs determining eligibility under
      SI 00510.001 ff.; that referenced determination is not supplied here, so a final
      countability result cannot be established.
rules:
- name: deeming_reference_si_01330_220
  kind: parameter
  dtype: Decimal
  source: us/manual/ssa/poms/si/01120.210, E.4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-13
          excerpt: SI 01330.120 and 01330.220
  versions:
  - effective_from: '2012-12-04'
    formula: "1330.22"
- name: retirement_fund_is_work_related_or_individual_retirement_plan
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-1
          excerpt: Retirement funds are annuities or work- related plans for providing
            income when employment ends
  versions:
  - effective_from: '2012-12-04'
    formula: 'is_annuity_or_work_related_plan_providing_income_when_employment_ends

      or funds_are_held_in_an_individual_retirement_account

      or is_plan_for_self_employed_individual

      or employer_requirements_establish_profit_sharing_plan_as_retirement_fund'
- name: periodic_retirement_benefit_is_regular_payment_from_fund
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-2
          excerpt: Periodic retirement benefits are payments made to an individual
            at some regular interval
  versions:
  - effective_from: '2012-12-04'
    formula: 'payment_is_made_at_regular_interval

      and payment_results_from_entitlement_under_retirement_fund'
- name: ssi_retirement_fund_value
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: USD
  source: us/manual/ssa/poms/si/01120.210(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-3
          excerpt: If there is a penalty for early withdrawal, the fund's value is
            the amount available to an individual after penalty deduction.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-3
          excerpt: However, any taxes due are not deductible in determining the fund's
            value.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-9
          excerpt: If the individual can withdraw any of the retirement fund, it is
            a resource in the amount that is currently available.
  versions:
  - effective_from: '2012-12-04'
    formula: max(0, retirement_fund_currently_withdrawable_amount - early_withdrawal_penalty)
- name: ssi_retirement_fund_is_resource
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-4
          excerpt: A retirement fund owned by an eligible individual is a resource
            if he/she has the option of withdrawing a lump sum even though he/she
            is not eligible for periodic payments.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-5
          excerpt: A retirement fund is not a resource if an individual must terminate
            employment in order to obtain any payment.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-15
          excerpt: Since Mr. Grant can withdraw the retirement funds without terminating
            employment, they are a resource in the amount available after penalty
            deduction.
  versions:
  - effective_from: '2012-12-04'
    formula: 'retirement_fund_owned_by_eligible_individual

      and can_withdraw_retirement_fund_lump_sum

      and not employment_must_terminate_to_obtain_any_payment

      and not eligible_for_periodic_retirement_payments'
- name: ssi_retirement_fund_first_counted_month
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210, B and C.2-C.3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-4
          excerpt: The fund is subject to resources counting rules in the month following
            the month in which it first becomes available.
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-7
          excerpt: include the fund's lump sum value in the resources determination
            for the month following that in which the individual receives the denial
            notice.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-6
          excerpt: A delay in payment for reasons beyond the individual's control
            (e.g., an organization's processing time) does not mean that the fund
            is not a resource since the individual is legally able to obtain the money.
  versions:
  - effective_from: '2012-12-04'
    formula: 'retirement_fund_became_available_in_prior_month

      or periodic_claim_denial_notice_received_in_prior_month'
- name: ssi_retirement_fund_availability_is_not_income
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210, B
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-4
          excerpt: A previously unavailable retirement fund is not income to its recipient
            when the fund becomes available.
  versions:
  - effective_from: '2012-12-04'
    formula: previously_unavailable_retirement_fund_became_available
- name: ssi_retirement_fund_is_nonliquid
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210, C.2 and E.2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: default
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-6
          excerpt: It is a nonliquid resource.
      - path: versions[0].formula
        kind: default
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-11
          excerpt: Absent evidence to the contrary, assume that resources in the form
            of retirement funds are nonliquid ( SI 01110.300 B. ).
  versions:
  - effective_from: '2012-12-04'
    formula: not evidence_retirement_fund_is_liquid
- name: ssi_retirement_fund_conditional_benefits_may_apply
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210, E.3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-12
          excerpt: An individual with excess nonliquid resources, such as retirement
            funds, may qualify for conditional benefits while awaiting payment ( SI
            01150.200 ff.).
  versions:
  - effective_from: '2012-12-04'
    formula: 'individual_has_excess_nonliquid_resources

      and awaiting_payment'
- name: ssi_retirement_periodic_benefit_obligations
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210, E.1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-10
          excerpt: If an individual is eligible for periodic retirement benefits,
            he/she must apply for those benefits to be eligible for SSI.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-10
          excerpt: If he/she has a choice between periodic benefits and a lump sum,
            he/she must choose the periodic benefits.
  versions:
  - effective_from: '2012-12-04'
    formula: 'not eligible_for_periodic_retirement_payments

      or (has_applied_for_periodic_retirement_benefits

      and (not has_choice_between_periodic_benefits_and_lump_sum

      or chose_periodic_benefits))'
- name: ssi_deemor_retirement_fund_excluded
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210, E.4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-13
          excerpt: If an ineligible spouse, parent, or spouse of parent owns a retirement
            fund,we exclude it from the deeming process
  versions:
  - effective_from: '2012-12-04'
    formula: 'retirement_fund_owned_by_ineligible_spouse

      or retirement_fund_owned_by_ineligible_parent

      or retirement_fund_owned_by_spouse_of_ineligible_parent'
- name: retirement_fund_example_workdays_per_week
  kind: parameter
  dtype: Count
  source: us/manual/ssa/poms/si/01120.210, example 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-14
          excerpt: currently works 3 days a week
  versions:
  - effective_from: '2012-12-04'
    formula: "3"
- name: retirement_fund_example_employment_years
  kind: parameter
  dtype: Count
  source: us/manual/ssa/poms/si/01120.210, example 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-14
          excerpt: employed full-time for 20 years
  versions:
  - effective_from: '2012-12-04'
    formula: "20"
- name: retirement_fund_example_balance
  kind: parameter
  dtype: Money
  unit: USD
  source: us/manual/ssa/poms/si/01120.210, example 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-14
          excerpt: has a $4,000 retirement fund
  versions:
  - effective_from: '2012-12-04'
    formula: "4000"
- name: ssi_retirement_periodic_countability_unresolved
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: us/manual/ssa/poms/si/01120.210, B and D.1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-4
          excerpt: However, if the individual is eligible for periodic payments, the
            fund may not be a countable resource.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/manual/ssa/poms/si/01120.210/block-8
          excerpt: If an individual has a retirement fund,determine and document whether
            he/she is eligible for periodic payments per SI 00510.001 ff.
  versions:
  - effective_from: '2012-12-04'
    formula: eligible_for_periodic_retirement_payments
