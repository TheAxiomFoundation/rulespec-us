format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/rulemaking/federal-register/2026-06-24/2026-12670
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us:policies/cbp/us-tariff-duty/de-minimis/statutory-threshold
        - us:policies/cbp/us-tariff-duty/de-minimis/continued-suspension
      rationale: |-
        The interim final rule is the operative CBP regulatory source for the nonpostal indefinite suspension under 19 CFR 10.151(b), while the copied context confirms related de minimis threshold and executive-order suspension precedent.
  summary: |-
    Effective June 24, 2026, CBP revises 19 CFR 10.151. Paragraph (a) covers shipments imported by one person on one day with fair retail value not exceeding $800. Paragraph (b) provides: "The exemption provided in paragraph (a) of this section is suspended for merchandise arriving via all modes other than through the international postal network" until CBP modifies or revokes the suspension by Federal Register notice.
rules:
  - name: nonpostal_de_minimis_suspension_value_limit
    kind: parameter
    dtype: Money
    unit: USD
    period: Day
    source: 19 CFR 10.151(a), as revised by CBP Dec. 26-12
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-06-24/2026-12670
              excerpt: "having a fair retail value ... not exceeding $800"
    versions:
      - effective_from: '2026-06-24'
        formula: |-
          800

  - name: nonpostal_de_minimis_exemption_suspension_applies
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: 19 CFR 10.151(b), as revised by CBP Dec. 26-12
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-06-24/2026-12670
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-06-24/2026-12670
              excerpt: "not exceeding $800"
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-06-24/2026-12670
              excerpt: "effective on June 24, 2026"
    versions:
      - effective_from: '2026-06-24'
        formula: |-
          merchandise_imported_by_one_person_on_one_day
          and fair_retail_value_in_country_of_shipment <= nonpostal_de_minimis_suspension_value_limit
          and not shipment_arrives_through_international_postal_network
          and not cbp_has_modified_or_revoked_nonpostal_suspension
