format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
  summary: |-
    "The duty-free de minimis exemption provided under 19 U.S.C. 1321(a)(2)(C) shall not apply to any shipment of articles not covered by 50 U.S.C. 1702(b), regardless of value, country of origin, mode of transportation, or method of entry." "International postal shipments not covered by 50 U.S.C. 1702(b) shall be subject to the duty rates described in section 3 of this order." The modifications are effective for goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern standard time on February 24, 2026.
rules:
  - name: de_minimis_exemption_suspended_for_shipment
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: Executive Order 14388 section 2(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "shall not apply to any shipment of articles not covered by 50 U.S.C. 1702(b)"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          not articles_covered_by_50_usc_1702_b
  - name: nonpostal_shipment_subject_to_applicable_import_charges
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: Executive Order 14388 section 2(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "all such shipments, except those sent through the international postal network, shall be subject to all applicable duties, taxes, fees, exactions, and charges"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          not articles_covered_by_50_usc_1702_b
          and not shipment_sent_through_international_postal_network
  - name: international_postal_shipment_subject_to_section_3_duty_rates
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: Executive Order 14388 section 2(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "International postal shipments not covered by 50 U.S.C. 1702(b) shall be subject to the duty rates described in section 3 of this order."
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          not articles_covered_by_50_usc_1702_b
          and shipment_sent_through_international_postal_network
  - name: postal_shipment_entry_preparation_deferred_until_new_entry_process
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: Executive Order 14388 section 2(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "without the preparation of an entry by CBP, until the effective date for the new entry process for postal shipments established by CBP and published in the Federal Register"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          shipment_sent_through_international_postal_network
          and shipment_would_otherwise_qualify_for_de_minimis_exemption
          and not cbp_new_entry_process_for_postal_shipments_effective
  - name: postal_duty_collection_remittance_required
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: Executive Order 14388 section 3(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "Transportation carriers delivering shipments sent to the United States through the international postal network, or other parties if qualified in lieu of such transportation carriers, as approved by CBP, must collect and remit duties to CBP"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          shipment_sent_through_international_postal_network
          and shipment_delivered_to_united_states
          and carrier_or_other_party_qualified_to_collect_postal_duties
  - name: postal_origin_and_value_declaration_required
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: Executive Order 14388 section 3(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "the country of origin of the article and its value must be declared to CBP"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          international_postal_shipment_subject_to_section_3_duty_rates
  - name: postal_shipment_must_use_ace_entry_for_adcvd_or_quota
    kind: derived
    entity: Shipment
    dtype: Judgment
    period: Day
    source: Executive Order 14388 section 3(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "Shipments sent through the international postal network that are subject to antidumping and countervailing duties or a quota must continue to be entered under an appropriate entry type in ACE"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          shipment_sent_through_international_postal_network
          and (shipment_subject_to_antidumping_or_countervailing_duties or shipment_subject_to_quota)
