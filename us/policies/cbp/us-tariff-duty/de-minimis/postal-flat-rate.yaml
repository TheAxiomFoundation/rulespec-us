format: rulespec/v1
imports:
  - us:policies/cbp/us-tariff-duty/de-minimis/continued-suspension#international_postal_shipment_subject_to_section_3_duty_rates
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
  summary: |-
    "A duty equal to the rate provided in the Proclamation of February 20, 2026 (Imposing a Temporary Import Surcharge to Address Fundamental International Payments Problems), shall be assessed on the value of each dutiable postal item containing goods entered for consumption. This duty rate shall be assessed until the expiration date of the temporary import surcharge established by the Proclamation of February 20, 2026, or until the effective date of the new entry process for postal shipments established by CBP, whichever date occurs first." The modifications are effective for goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern standard time on February 24, 2026.
  deferred_outputs:
    - output: us:policies/cbp/us-tariff-duty/de-minimis/postal-flat-rate#postal_item_section_3_duty_amount
      reason: |-
        Section 3(b) sets the duty equal to the rate provided in the Proclamation of February 20 2026, but no copied RuleSpec export for that proclamation's temporary import surcharge rate is available. The numeric duty amount is therefore deferred while the source-stated applicability of the postal rate is encoded.
