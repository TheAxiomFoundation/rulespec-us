  - name: us_tariff_duty
    kind: derived
    entity: CustomsEntry
    dtype: Money
    unit: USD
    period: Day
    source: Composition duty on customs value or postal flat duty on shipment value
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "Executive Order 14324 of July 30, 2025 (Suspending Duty-Free De Minimis Treatment for All Countries)"
          - path: versions[1].formula
            kind: formula
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03829
              excerpt: "shall be assessed on the value of each dutiable postal item containing goods entered for consumption"
          - path: versions[2].formula
            kind: formula
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-06-24/2026-12669
              excerpt: "establishes a new postal informal entry process"
    versions:
