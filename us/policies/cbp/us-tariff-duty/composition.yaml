             elif origin_is_column_2_country: unwrought_aluminum_coil_column_2_rate_of_duty
             elif line_b_special_rate_applies: unwrought_aluminum_coil_special_rate_of_duty
             else: unwrought_aluminum_coil_general_rate_of_duty)
          elif entry_is_line_c:
            (if origin_is_column_2_country: footballs_and_soccer_balls_column_2_rate_of_duty
             else: footballs_and_soccer_balls_general_rate_of_duty)
          else: 0

