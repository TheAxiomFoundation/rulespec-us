  - name: mfn_ad_valorem_rate
    kind: derived
    entity: CustomsEntry
    dtype: Rate
    period: Day
    source: HTS General Note 3(a) column 1 and column 2 rate selection, with the heading 9903.90.09 rate in lieu of column 2 for Russian Federation products of HTS 7601.10.30
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/general-note-3/page-1
              excerpt: "the rates of duty in column 1 are rates which are applicable to all products other than those of countries enumerated in paragraph (b) of this note"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/chapter-99/page-508
              excerpt: "articles that are the product of the Russian Federation, as provided for in subdivisions (c) and (d) of this note, shall be subject to a 70 percent ad valorem rate of duty in lieu of the rates of duty provided for such articles in column 2 of the HTSUS in chapters 1 to 97"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.90.09
              excerpt: "Rates of duty (2): 70%"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/chapter-99/page-509
              excerpt: "7601.10.30"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if entry_is_line_a:
            (if origin_is_column_2_country: column_2_rate_of_duty
             elif line_a_special_rate_applies: special_rate_of_duty
             else: general_rate_of_duty)
          elif entry_is_line_b:
            (if origin_is_russia: russia_heading_9903_90_09_rate_of_duty
             elif origin_is_column_2_country: unwrought_aluminum_coil_column_2_rate_of_duty
             elif line_b_special_rate_applies: unwrought_aluminum_coil_special_rate_of_duty
             else: unwrought_aluminum_coil_general_rate_of_duty)
          elif entry_is_line_c:
            (if origin_is_column_2_country: footballs_and_soccer_balls_column_2_rate_of_duty
