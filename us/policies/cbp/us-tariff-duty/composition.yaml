        formula: |-
          mfn_ad_valorem_rate
          + ieepa_component_rate
          + section_122_component_rate
          + section_232_aluminum_component_rate
          + china_section_301_component_rate
          + brazil_section_301_component_rate
          + forced_labor_section_301_component_rate

