        effective_to: '2026-02-23'
        formula: |-
          customs_value * us_tariff_total_ad_valorem_rate
      - effective_from: '2026-02-24'
        effective_to: '2026-07-23'
        formula: |-
          if postal_flat_rate_applies: temporary_import_surcharge_rate * shipment_value
          else: customs_value * us_tariff_total_ad_valorem_rate
      - effective_from: '2026-07-24'
        formula: |-
          customs_value * us_tariff_total_ad_valorem_rate
