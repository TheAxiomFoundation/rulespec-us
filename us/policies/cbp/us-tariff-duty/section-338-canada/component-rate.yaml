    - output: us:policies/cbp/us-tariff-duty/section-338-canada/component-rate#section_338_dairy_component_rate
      reason: |-
        The signed us-rulespec-2026-08-23-canada-338-suspension-union selector has no citable Annex II page provisions for Proclamation 11047 or 11048. Their retained Federal Register text substitutes graphic-omission markers for the lists, and Rev-15 predates U.S. note 51. Verbatim membership/rate proof atoms require a newly ingested and signed corpus successor.
    - output: us:policies/cbp/us-tariff-duty/section-338-canada/component-rate#section_338_motor_vehicle_component_rate
      reason: |-
        The signed us-rulespec-2026-08-23-canada-338-suspension-union selector has no citable Annex II page provisions for Proclamation 11047 or 11048. Their retained Federal Register text substitutes graphic-omission markers for the lists, and Rev-15 predates U.S. note 51. Verbatim membership/rate proof atoms require a newly ingested and signed corpus successor.
  summary: |-
    Proclamation 11046 scheduled a 50-percent additional duty for listed Canadian alcohol-family articles on August 19, 2026. The August 18 successor moved collection to August 22. The scalar remains the July-proclaimed amount, while the component is explicitly zero August 19–21 and active from August 22 for listed Canadian articles outside the U.S. note 51(c) Section 232 carveout.
rules:
  - name: section_338_alcohol_additional_duty_rate
    kind: parameter
    dtype: Rate
    source: Proclamation 11046 heading 9903.03.12 additional duty amount
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-23/2026-14991/annex-ii/page-6
              excerpt: The duty provided in the applicable subheading + 50%
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-23/2026-14991/annex-ii/page-1
              excerpt: Effective with respect to goods entered for consumption, or withdrawn from warehouse
                for consumption, on or after 12:01 a.m. eastern time on August 19, 2026
    versions:
      - effective_from: '2026-08-19'
        formula: |-
          0.50
  - name: section_338_alcohol_component_rate
    kind: derived
    entity: CustomsEntry
    dtype: Rate
    period: Day
    source: Proclamation 11046 alcohol component with the August 18 effective-date successor and U.S.
      note 51(c) carveout
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/white-house/2026-08-18/canada-338-suspension/clause-1
              excerpt: Accordingly, the chapeau of Annex II of each of Proclamations 11046, 11047, and
                11048, is amended by deleting the effective date “August 19, 2026” and inserting “August
                22, 2026” in lieu thereof.
          - path: versions[1].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/white-house/2026-08-18/canada-338-suspension/clause-1
              excerpt: The effective date of the additional ad valorem duties imposed in Proclamations
                11046, 11047, and 11048 shall be 12:01 a.m. eastern time on August 22, 2026.
          - path: versions[1].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-23/2026-14991/annex-ii/page-1
              excerpt: heading 9903.03.12 imposes an additional ad valorem rate of duty on imports of
                products of Canada enumerated in subdivision (b) of this note
          - path: versions[1].formula
            kind: exception
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-23/2026-14991/annex-ii/page-2
              excerpt: 'the additional duties imposed by heading 9903.03.12 shall not apply to:'
    versions:
      - effective_from: '2026-08-19'
        effective_to: '2026-08-21'
        formula: |-
          0
      - effective_from: '2026-08-22'
        formula: |-
          if article_product_of_canada
             and section_338_alcohol_annex_ii_membership
             and not article_is_section_232_carveout_under_note_51_c:
            section_338_alcohol_additional_duty_rate
          else: 0
