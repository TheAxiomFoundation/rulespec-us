format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/guidance/cms/smd/26-006
  summary: 'This CMS State Medicaid Director letter of November 13, 2026 offers every
    State and the District of Columbia an optional hold harmless period through June
    30, 2027 for the community engagement requirement of section 1902(xx) of the Social
    Security Act. A State uses the period by requesting it in its community engagement
    mitigation plan and obtaining CMS approval before implementing it. A State may
    implement it for a shorter duration, so the period documented in its plan may
    start later or end earlier.


    During the period CMS will not take enforcement action against a State that suspends
    denials and disenrollments based on a potentially applicable individual''s failure
    to show compliance, deemed compliance or an exclusion, for applications received
    and renewals initiated through June 30, 2027 or the end of the State''s shorter
    period. This is enforcement discretion; section 1902(xx)(1) and 42 CFR 435.559
    are unchanged. A State may use the period only if it assesses every relevant application
    and renewal. The period does not reach any other part of implementing community
    engagement or any denial or disenrollment for another factor of eligibility, such
    as age or household income.


    For applications submitted and renewals initiated after the State''s period ends,
    the State must deny or terminate eligibility when an individual is determined
    ineligible for Medicaid because the individual has not met the community engagement
    requirement, after following 42 CFR 435.558 and the other applicable rules. 42
    USC 1396a(xx) states that duty, and its module defers the final denial or disenrollment
    procedure. The 42 CFR 435.558 module encodes the response period and when a State
    may deny an application through state_may_deny_application_after_no_satisfactory_showing
    or must disenroll a beneficiary through state_must_disenroll_beneficiary_after_no_satisfactory_showing
    after no satisfactory showing. This module does not encode that duty.


    Determinations for applicable individuals who did not demonstrate community engagement,
    for applications filed or renewals initiated during a period documented in a CMS-approved
    mitigation plan, are not errors for PERM, MEQC or other CMS Medicaid beneficiary
    eligibility audits on that account. The letter also says that a State implementing
    other mitigations documented in an approved mitigation plan, and complying with
    the plan''s parameters, will not be considered in violation of the Medicaid statute
    and regulations for purposes of those reviews. This module does not encode other
    mitigations.


    This module does not encode the request that States intending to start the hold
    harmless period on January 1, 2027 notify CMS by December 11, 2026. States that
    already submitted a mitigation plan or a good faith effort exemption request may
    update it. A State must comply with its approved plan to avoid compliance action
    under section 1904. States using the period are expected to work towards full
    compliance. The letter''s footnote on vacated regulations says that obligation
    does not include implementing the portion of the regulations a court recently
    vacated, citing Massachusetts v. Oz. The letter does not say which portion was
    vacated, and this module does not either. Footnote markers, page numbers, statutory
    and regulatory citation numbers, case identifiers and reporter pincites are documentary
    references, not amounts, rates, thresholds, caps or limits, and are not parameters.


    The State''s plan and assessment are facts supplied per person and month. The
    date of the application or renewal being determined enters as two yes/no facts,
    whether it is through June 30, 2027 and whether it is outside the period documented
    in the State''s approved plan, because RuleSpec formulas have no date literals.
    The module treats an application as filed and submitted on the date the State
    received it. Whether the State verified the individual from its own data, whether
    the individual made a satisfactory showing, and whether the individual is an applicable
    individual are facts too. The letter does not address a disenrollment after a
    more frequent verification between renewals.


    Composition requires callers to supply the same satisfactory_showing_made value
    to this module and the 42 CFR 435.558 module. Inputs are keyed by module, so sharing
    a name does not join them. Read state_may_suspend_community_engagement_denial_or_disenrollment
    next to the two named 42 CFR 435.558 outputs and the 42 USC 1396a(a)(10) module''s
    is_medicaid_eligible output.'
inputs:
- name: state_approved_mitigation_plan_includes_hold_harmless_period
  entity: Person
  dtype: Boolean
  period: Month
  description: The State requested the hold harmless period as an optional strategy
    in its community engagement mitigation plan, and CMS approved the plan with it
    before the State began using the period; the letter requires CMS approval prior
    to implementing the hold harmless period. False when the State has no such plan,
    when CMS has not approved it, and when the State began using the period before
    CMS approved the plan. Only whether the State may use the period reads this fact.
- name: state_assesses_community_engagement_for_all_relevant_applications_and_renewals
  entity: Person
  dtype: Boolean
  period: Month
  description: The State assesses whether individuals meet the community engagement
    requirement (including through deemed compliance) or are excluded from it, for
    all relevant applications received and renewals initiated during its hold harmless
    period.
- name: application_received_or_renewal_initiated_through_end_of_hold_harmless_period
  entity: Person
  dtype: Boolean
  period: Month
  description: 'The application the State is determining in this month was received,
    or the renewal it is determining was initiated, on or before June 30, 2027, the
    last day of the hold harmless period CMS offers. It refers to that application
    or renewal, not an earlier one: for a renewal initiated after June 30, 2027 it
    is false even if the individual first applied earlier. The letter says applications
    received (p. 2), filed (p. 3, on PERM) and submitted (p. 3, after the period);
    this module treats an application as filed and submitted on the date the State
    received it, and does not model a case where those dates differ. The letter speaks
    of applications received and renewals initiated; it does not address a disenrollment
    after a more frequent verification between renewals, and this input does not decide
    that case.'
- name: application_or_renewal_outside_state_hold_harmless_period
  entity: Person
  dtype: Boolean
  period: Month
  description: No hold harmless period documented in a CMS-approved mitigation plan
    of the State covers the date the State received the application, or initiated
    the renewal, that it is determining in this month. True when the State has no
    approved period, when the State's period began after that date or ended before
    it, and for every date after June 30, 2027. False only when the State's documented
    period covers that date.
- name: satisfactory_showing_made
  entity: Person
  dtype: Boolean
  period: Month
  description: The individual made a satisfactory showing, in the response period,
    either of compliance with the community engagement requirement (including deemed
    compliance) or that the requirement does not apply to them, including that they
    qualify for an exclusion. 42 CFR 435.558 reads the same fact under the same name;
    supply both modules the same value.
- name: potentially_applicable_individual_not_verified_by_state
  entity: Person
  dtype: Boolean
  period: Month
  description: The individual is a potentially applicable individual, an applicant
    or beneficiary who may be subject to the community engagement requirement (for
    example, one in the adult group or in equivalent coverage under a section 1115
    demonstration), and the State has not verified, from the information the individual
    provided and the reliable information available to it, that the individual meets
    the requirement, including through deemed compliance, or is excluded from it.
    False for an individual the State verified from that information, and for one
    who cannot be subject to the requirement.
- name: individual_is_applicable_individual
  entity: Person
  dtype: Boolean
  period: Month
  description: 'The individual is an applicable individual as 42 CFR 435.551 defines
    the term: subject to the community engagement requirement and not excluded from
    it. False for a potentially applicable individual who in fact qualifies for an
    exclusion, even if the exclusion has not yet been shown. 42 CFR 435.551''s applicable_individual
    decides the same fact.'
- name: fails_eligibility_factor_other_than_community_engagement
  entity: Person
  dtype: Boolean
  period: Month
  description: The individual fails a factor of Medicaid eligibility other than community
    engagement, for example age or household income, so a denial or disenrollment
    does not rest on community engagement alone.
rules:
- name: community_engagement_compliance_or_nonapplicability_not_shown
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: CMS SMD# 26-006 (Nov. 13, 2026), p. 2, Hold Harmless Period
  description: True when the individual is a potentially applicable individual whom
    the State has not verified as meeting, deemed to meet or excluded from the community
    engagement requirement, and the individual has made no satisfactory showing of
    compliance (including deemed compliance) or that the requirement does not apply
    to them. 42 CFR 435.558 reads the showing fact under the same name, satisfactory_showing_made.
    An individual the State verified from its own data, or who has shown an exclusion,
    is not someone whose denial the letter lets a State suspend.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: The hold harmless period applies to applicants and beneficiaries
            who are potentially applicable individuals
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: failure to show either that they meet the community engagement
            requirement through qualifying activities or an exception (i.e., deemed
            compliance) or that they qualify for an exclusion from the requirement
  versions:
  - effective_from: '2026-11-13'
    formula: 'potentially_applicable_individual_not_verified_by_state

      and not satisfactory_showing_made'
- name: application_or_renewal_within_state_hold_harmless_dates
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: CMS SMD# 26-006 (Nov. 13, 2026), p. 2, Hold Harmless Period
  description: 'True when the application the State is determining was received, or
    the renewal initiated, through and including June 30, 2027 and within the hold
    harmless period documented in the State''s approved mitigation plan, which may
    start later or end earlier than the period CMS offers. It tests dates only; whether
    the State may use the period at all is state_may_use_hold_harmless_period. The
    date of that application or renewal decides this, not the month evaluated: a renewal
    initiated in June 2027 stays covered when the State acts on it later, and a later
    renewal is judged by its own date. The letter says applications "received" (p.
    2), "filed" (p. 3, on PERM) and "submitted" (p. 3, after the period); this module
    keys all three to the date the State received the application.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: This applies to applications received and renewals initiated through
            and including June 30, 2027
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: or shorter hold harmless period implemented by the state
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: states that choose to implement the hold harmless period are not
            required to use the option for the entire period through June 30, 2027
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: implement the option for a shorter duration
  versions:
  - effective_from: '2026-11-13'
    formula: 'application_received_or_renewal_initiated_through_end_of_hold_harmless_period

      and not application_or_renewal_outside_state_hold_harmless_period'
- name: state_may_use_hold_harmless_period
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: CMS SMD# 26-006 (Nov. 13, 2026), pp. 2-3
  description: True when the State's CMS-approved community engagement mitigation
    plan includes the hold harmless period and the State assesses, for every relevant
    application and renewal in the period, whether individuals meet the requirement
    (including through deemed compliance) or are excluded from it. A State that does
    not assess may not use the period.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: States that wish to use the hold harmless period should request
            it as an optional strategy in their mitigation plans
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: must obtain CMS approval prior to implementing the hold harmless
            period or other mitigations
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: States will not be permitted to use the hold harmless period unless
            they assess whether individuals meet the requirement (including through
            deemed compliance) or are excluded from it, for all relevant applications
            received or renewals initiated during the hold harmless period
  versions:
  - effective_from: '2026-11-13'
    formula: 'state_approved_mitigation_plan_includes_hold_harmless_period

      and state_assesses_community_engagement_for_all_relevant_applications_and_renewals'
- name: state_may_suspend_community_engagement_denial_or_disenrollment
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: CMS SMD# 26-006 (Nov. 13, 2026), p. 2, Hold Harmless Period
  description: 'True when a State using the hold harmless period may suspend this
    potentially applicable individual''s denial of eligibility or disenrollment for
    failing to show compliance, deemed compliance or an exclusion. This is CMS enforcement
    discretion: CMS will not take enforcement action against the State for the suspension.
    It changes neither section 1902(xx)(1) of the Social Security Act nor 42 CFR 435.559,
    which still make community engagement a condition of eligibility, and it covers
    no denial or disenrollment for another factor of eligibility, such as age or household
    income. Read it with 42 CFR 435.558: where state_may_deny_application_after_no_satisfactory_showing
    or state_must_disenroll_beneficiary_after_no_satisfactory_showing holds for the
    same application or renewal and this output holds, a State using the period may
    withhold that denial or disenrollment. Where this output does not hold, including
    for applications received and renewals initiated after the State''s period ends,
    those outputs apply unchanged.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: states that elect the option may suspend denials of eligibility
            and disenrollments when applicable individuals do not demonstrate compliance
            with community engagement
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: CMS will not take enforcement action if a state suspends eligibility
            denials and disenrollments
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: applies only to the requirement at section 1902(xx)(1) of the Act
            and 42 C.F.R. § 435.559 to condition initial or continued eligibility
            on demonstration of community engagement
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: States may not suspend denials or disenrollments if an applicable
            individual fails to meet factors of eligibility other than community engagement
            during the hold harmless period
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/cms/smd/26-006#state_may_use_hold_harmless_period
          output: state_may_use_hold_harmless_period
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/cms/smd/26-006#application_or_renewal_within_state_hold_harmless_dates
          output: application_or_renewal_within_state_hold_harmless_dates
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/cms/smd/26-006#community_engagement_compliance_or_nonapplicability_not_shown
          output: community_engagement_compliance_or_nonapplicability_not_shown
          hash: sha256:local
  versions:
  - effective_from: '2026-11-13'
    formula: 'state_may_use_hold_harmless_period

      and application_or_renewal_within_state_hold_harmless_dates

      and community_engagement_compliance_or_nonapplicability_not_shown

      and not fails_eligibility_factor_other_than_community_engagement'
- name: unmet_community_engagement_not_perm_or_meqc_error
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: CMS SMD# 26-006 (Nov. 13, 2026), p. 3, State Mitigation Plans
  description: 'True when, under the letter, this applicable individual''s eligibility
    determination is not an error for Payment Error Rate Measurement (PERM) reviews,
    Medicaid Eligibility Quality Control (MEQC) reviews or other CMS Medicaid beneficiary
    eligibility audits on account of the individual not demonstrating community engagement,
    because the application was filed or the renewal initiated during the hold harmless
    period documented in the State''s CMS-approved mitigation plan. The letter''s
    sentence covers applicable individuals, so a potentially applicable individual
    who in fact qualifies for an exclusion is outside it, although rule d may still
    let the State suspend that individual''s denial. The approved-plan condition comes
    through rule b: application_or_renewal_outside_state_hold_harmless_period is false
    only when a period documented in the State''s CMS-approved plan covers the date.
    The sentence sets no assessment condition and does not ask when CMS approved the
    plan, so this rule reads neither state_may_use_hold_harmless_period, the assessment
    fact nor state_approved_mitigation_plan_includes_hold_harmless_period; whether
    the State may suspend denials is rule d''s question. It says nothing about errors
    on other factors of eligibility, so it does not read fails_eligibility_factor_other_than_community_engagement.'
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: Eligibility determinations for applicable individuals who did not
            demonstrate community engagement and whose applications are filed or renewals
            are initiated during the hold harmless period
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: us/guidance/cms/smd/26-006
          excerpt: approved mitigation plan will not be considered an error for purposes
            of the Payment Error Rate Measurement (PERM) reviews, Medicaid Eligibility
            Quality Control (MEQC) reviews, or other CMS Medicaid beneficiary eligibility
            audits
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/cms/smd/26-006#application_or_renewal_within_state_hold_harmless_dates
          output: application_or_renewal_within_state_hold_harmless_dates
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us:policies/cms/smd/26-006#community_engagement_compliance_or_nonapplicability_not_shown
          output: community_engagement_compliance_or_nonapplicability_not_shown
          hash: sha256:local
  versions:
  - effective_from: '2026-11-13'
    formula: 'application_or_renewal_within_state_hold_harmless_dates

      and individual_is_applicable_individual

      and community_engagement_compliance_or_nonapplicability_not_shown'
