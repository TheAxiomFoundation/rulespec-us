    us:statutes/26/3101/b/2#input.filing_status: 0
    us:policies/payroll/employee_fica_tax_pipeline#input.tax_unit_medicare_wages_and_tips: 300000
  output:
    us:policies/payroll/employee_fica_tax_pipeline#employee_fica_tax_unit_wage_domain_is_valid: not_holds
