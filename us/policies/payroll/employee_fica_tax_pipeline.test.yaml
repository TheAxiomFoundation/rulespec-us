    us:policies/payroll/employee_fica_tax_pipeline#input.oasdi_wages_before_contribution_and_benefit_base: 100000
    us:policies/payroll/employee_fica_tax_pipeline#input.person_medicare_wages_and_tips: 100000
  output:
