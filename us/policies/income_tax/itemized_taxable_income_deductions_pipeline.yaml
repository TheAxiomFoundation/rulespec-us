rules:
  - name: itemized_taxable_income_deductions_verified_domain_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: 26 USC 63(d)-(e), 67(h), and 68(a)-(b), fail-closed six-component aggregate boundary
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us/statute/26/63
              excerpt: "the term “itemized deductions” means the deductions allowable under this chapter other than"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/68
              excerpt: "In the case of an individual"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/2
              excerpt: "the term “surviving spouse” means a taxpayer"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/7703
              excerpt: "the determination of whether an individual is married shall be made as of the close of his taxable year"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/salt_deduction_pipeline#salt_deduction_pipeline_verified_domain_applies
              output: salt_deduction_pipeline_verified_domain_applies
              hash: sha256:81d049791e96d949b63b0b7599f88b4767ab4c68d5e05389d49ead70afb063b8
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/67/h#miscellaneous_itemized_deduction_allowed_for_individual
              output: miscellaneous_itemized_deduction_allowed_for_individual
              hash: sha256:9c506b698ed2573df3d8a15421d56edf821049d122bb216b21d97f1a5ddcb851
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/68/b#section_68_applied_after_other_itemized_deduction_limitations
              output: section_68_applied_after_other_itemized_deduction_limitations
              hash: sha256:b414ea74c35ae01658716b730dec1427c8db0e9ae0b7e0be3f4c8f08a8ec5906
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            filing_status == 0
            or filing_status == 1
            or filing_status == 2
            or filing_status == 3
            or filing_status == 4
          )
          and taxpayer_is_individual
          and salt_deduction_pipeline_verified_domain_applies
          and charitable_deduction >= 0
          and interest_deduction >= 0
          and federal_salt_deduction >= 0
          and medical_expense_deduction >= 0
          and casualty_loss_deduction >= 0
          and misc_deduction == 0
          and not miscellaneous_itemized_deduction_allowed_for_individual
          and no_other_component_in_pe_six_item_itemized_aggregate
          and section_68_applied_after_other_itemized_deduction_limitations

  - name: itemized_deductions_otherwise_allowable_after_other_limitations
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 63(d), completed six-component aggregate before section 68
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us/statute/26/63
              excerpt: "the term “itemized deductions” means the deductions allowable under this chapter other than"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/63
              excerpt: "the determination of whether a deduction is allowable under this chapter shall be made without regard to the preceding sentence"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/163
              excerpt: "There shall be allowed as a deduction all interest paid or accrued within the taxable year on indebtedness."
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/salt_deduction_pipeline#federal_salt_deduction
              output: federal_salt_deduction
              hash: sha256:81d049791e96d949b63b0b7599f88b4767ab4c68d5e05389d49ead70afb063b8
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/164
              excerpt: "State and local personal property taxes."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/165
              excerpt: "There shall be allowed as a deduction any loss sustained during the taxable year and not compensated for by insurance or otherwise."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/165
              excerpt: "shall be allowed as a deduction under subsection (a) only to the extent it is attributable to a Federally declared disaster"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/170
              excerpt: "There shall be allowed as a deduction any charitable contribution"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/213
              excerpt: "to the extent that such expenses exceed 7.5 percent of adjusted gross income"
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: us/statute/26/68
              excerpt: "This section shall be applied after the application of any other limitation on the allowance of any itemized deduction."
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/itemized_taxable_income_deductions_pipeline#itemized_taxable_income_deductions_verified_domain_applies
              output: itemized_taxable_income_deductions_verified_domain_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if itemized_taxable_income_deductions_verified_domain_applies:
            charitable_deduction
            + interest_deduction
            + federal_salt_deduction
            + medical_expense_deduction
            + casualty_loss_deduction
            + misc_deduction
          else:
            0

