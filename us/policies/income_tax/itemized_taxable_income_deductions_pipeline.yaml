inputs:
  - name: taxpayer_is_individual
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: Required section 68(a) individual-taxpayer boundary.
  - name: charitable_deduction
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Completed allowable charitable deduction after all section 170 entitlement, percentage, carryover, and substantiation rules.
  - name: interest_deduction
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Completed allowable itemized interest deduction after all section 163 classification and limitation rules.
  - name: medical_expense_deduction
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Completed allowable medical-expense deduction after the section 213 floor and all other applicable limitations.
  - name: casualty_loss_deduction
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Completed allowable casualty-loss deduction after section 165 basis, insurance, disaster, claim, and floor rules.
  - name: misc_deduction
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Completed miscellaneous itemized deduction; must be zero consistently with the imported section 67(h) judgment for 2026.
  - name: no_other_component_in_pe_six_item_itemized_aggregate
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Holds only when the supplied six components exhaust the bounded PE six-item itemized aggregate; it does not exclude deductions modeled elsewhere in taxable income.
