        - us/guidance/irs/rev-proc-2025-32/page-12
      rationale: |-
        Section 63 supplies the itemized-deduction definition and confirms
        that deduction allowability is determined without regard to the
        downstream election. Sections 163, 164, 165, 170, and 213 anchor the
        completed interest, SALT, casualty, charitable, and medical
        components. The imported section 67(h) judgment disallows the
        miscellaneous component in 2026. The imported section 68 final and
        reduction apply the exact 2/37 computation after all other itemized
        limitations, using the imported Revenue Procedure 2025-32 top-bracket
        thresholds for the five caller-resolved filing-status categories.
  summary: |-
    Fail-closed federal itemized taxable-income deduction composition for tax
    year 2026.

    The first five components are completed nonnegative amounts after their
    own entitlement, floor, ceiling, disaster, and substantiation rules. The
    imported SALT pipeline supplies its guarded final. The sixth component,
    miscellaneous itemized deductions, must be zero consistently with the
    imported section 67(h) judgment. The
    `no_other_component_in_pe_six_item_itemized_aggregate` attestation is
    deliberately limited to the six-item aggregate represented here; it does
    not assert that no other section 63(d) deduction exists.

    This module constructs only the completed pre-section-68 aggregate. It
    supplies that amount and the completed
    `taxable_income_determined_without_section_68` boundary to the imported
    section 68 module. It does not duplicate the section 68 base, lesser-of,
    2/37, or final subtraction formulas. The two public outputs are guarded
    aliases of the imported section 68 reduction and final. Section 63(e)'s
    itemization election remains a downstream taxable-income decision.

    Filing status is the exact TaxUnit input declared by the imported SALT
    pipeline: 0 single, 1 joint, 2 married filing separately, 3 head of
    household, and 4 surviving spouse. The same input resolves the imported
    Revenue Procedure filing-status table. An invalid status, nonindividual,
    negative completed component, nonzero miscellaneous component, false
    aggregate attestation, invalid imported SALT domain, inconsistent section
    67(h) judgment, or failed section 68 ordering judgment makes every local
    amount fail closed to zero.
imports:
  - us:policies/income_tax/salt_deduction_pipeline#federal_salt_deduction
