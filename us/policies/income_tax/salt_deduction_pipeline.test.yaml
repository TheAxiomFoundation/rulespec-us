- name: salt-magi-911-addback
  # Two related Persons make the 10,000 section 911 aggregate and exercise the
  # declared (TaxUnit, Person) relation order. MAGI = 510,000, so the cap is
  # 40,400 - 0.30 * 5,000 = 38,900.
  period: *tax_year_2026
  input:
    <<: [*valid_salt_attestations, *neutral_possession_exclusions]
    us:policies/income_tax/salt_deduction_pipeline#input.filing_status: 0
    us:policies/income_tax/salt_deduction_pipeline#input.adjusted_gross_income: 500000
    us:policies/income_tax/salt_deduction_pipeline#input.state_and_local_sales_or_income_tax: 50000
    us:policies/income_tax/salt_deduction_pipeline#input.state_and_local_personal_property_tax: 0
    us:policies/income_tax/salt_deduction_pipeline#input.real_estate_taxes: 0
    us:policies/income_tax/salt_deduction_pipeline#relation.salt_section_911_individual_of_tax_unit:
      - us:statutes/26/911/a#input.individual_is_qualified_individual: true
        us:statutes/26/911/a#input.election_made_for_foreign_earned_income: true
        us:statutes/26/911/a#input.foreign_earned_income_of_individual: 4000
        us:statutes/26/911/a#input.election_made_for_housing_cost_amount: false
        us:statutes/26/911/a#input.housing_cost_amount_of_individual: 0
      - us:statutes/26/911/a#input.individual_is_qualified_individual: true
        us:statutes/26/911/a#input.election_made_for_foreign_earned_income: true
        us:statutes/26/911/a#input.foreign_earned_income_of_individual: 6000
        us:statutes/26/911/a#input.election_made_for_housing_cost_amount: false
        us:statutes/26/911/a#input.housing_cost_amount_of_individual: 0
  output:
    us:policies/income_tax/salt_deduction_pipeline#federal_section_911_exclusion_for_salt_magi: '10000'
    us:policies/income_tax/salt_deduction_pipeline#federal_salt_deduction: '38900'

