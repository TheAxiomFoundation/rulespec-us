# Hand-computed tax-year-2026 fixtures for the bounded 26 USC 164 SALT
# composition. Every adopted grid case carries the statutory expected value;
# no expected amount comes from PolicyEngine. The common boundary declares
# completed personal taxes and a complete section 911 Person relation.

- name: salt-single-base
  period: &tax_year_2026
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    <<:
      - &valid_salt_attestations
        us:policies/income_tax/salt_deduction_pipeline#input.completed_personal_tax_amounts_exclude_business_and_section_212_taxes: true
        us:policies/income_tax/salt_deduction_pipeline#input.completed_personal_tax_amounts_exclude_acquisition_capitalized_taxes: true
        us:policies/income_tax/salt_deduction_pipeline#input.completed_personal_tax_amounts_are_net_of_refunds: true
        us:policies/income_tax/salt_deduction_pipeline#input.completed_personal_tax_amounts_exclude_nondeductible_taxes: true
        us:policies/income_tax/salt_deduction_pipeline#input.section_911_exclusion_relation_includes_every_tax_unit_individual: true
      - &empty_section_911_relation
        us:policies/income_tax/salt_deduction_pipeline#relation.salt_section_911_individual_of_tax_unit:
          - us:statutes/26/911/a#input.individual_is_qualified_individual: false
            us:statutes/26/911/a#input.election_made_for_foreign_earned_income: false
            us:statutes/26/911/a#input.foreign_earned_income_of_individual: 0
            us:statutes/26/911/a#input.election_made_for_housing_cost_amount: false
            us:statutes/26/911/a#input.housing_cost_amount_of_individual: 0
      - &neutral_possession_exclusions
        us:statutes/26/931#input.bona_fide_resident_of_specified_possession_during_entire_taxable_year: false
        us:statutes/26/931#input.income_derived_from_sources_within_specified_possessions: 0
        us:statutes/26/931#input.income_effectively_connected_with_trade_or_business_within_specified_possessions: 0
        us:statutes/26/931#input.amounts_paid_for_services_as_employee_of_united_states_or_agency: 0
        us:statutes/26/933#input.individual_is_bona_fide_resident_of_puerto_rico_during_entire_taxable_year: false
        us:statutes/26/933#input.income_derived_from_sources_within_puerto_rico: 0
        us:statutes/26/933#input.amounts_received_for_services_performed_as_employee_of_united_states_or_agency: 0
        us:statutes/26/933#input.individual_is_citizen_of_united_states: false
        us:statutes/26/933#input.individual_changes_residence_from_puerto_rico_during_taxable_year: false
        us:statutes/26/933#input.bona_fide_resident_of_puerto_rico_years_before_change: 0
        us:statutes/26/933#input.puerto_rico_source_income_attributable_to_puerto_rican_residence_period_before_change: 0
        us:statutes/26/933#input.amounts_received_for_services_performed_as_employee_of_united_states_or_agency_attributable_to_period_before_change: 0
    us:policies/income_tax/salt_deduction_pipeline#input.filing_status: 0
    us:policies/income_tax/salt_deduction_pipeline#input.adjusted_gross_income: 100000
    us:policies/income_tax/salt_deduction_pipeline#input.state_and_local_sales_or_income_tax: 8000
    us:policies/income_tax/salt_deduction_pipeline#input.state_and_local_personal_property_tax: 0
    us:policies/income_tax/salt_deduction_pipeline#input.real_estate_taxes: 2000
  output:
    us:policies/income_tax/salt_deduction_pipeline#salt_deduction_pipeline_verified_domain_applies: holds
    us:policies/income_tax/salt_deduction_pipeline#federal_section_911_exclusion_for_salt_magi: '0'
    us:policies/income_tax/salt_deduction_pipeline#federal_salt_deduction: '10000'

