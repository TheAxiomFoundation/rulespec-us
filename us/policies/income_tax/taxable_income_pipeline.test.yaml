# Hand-computed tax-year-2026 fixtures for the bounded federal taxable-income
# composition. The first fourteen cases are the complete adopted
# `us-taxable-income-grid` case set from SPINE-PLAN section 6.3. Every
# component is either an imported lawful result or an explicit completed
# worksheet boundary. No expected taxable-income value comes from
# PolicyEngine.

- name: ti-single-standard
  # 100,000 AGI - 16,100 standard deduction = 83,900.
  period: &tax_year_2026
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    <<: &valid_taxable_income_domain
      <<:
        - &common_taxable_income_inputs
          <<:
            - &common_taxable_income_inputs_without_section_931_addback
              # Shared section 911/931/933 facts keep imported MAGI equal to
              # AGI unless a case supplies separate section 931 addback facts.
