              us:statutes/26/911/a#input.election_made_for_foreign_earned_income: false
              us:statutes/26/911/a#input.election_made_for_housing_cost_amount: false
              us:statutes/26/911/a#input.foreign_earned_income_of_individual: 0
              us:statutes/26/911/a#input.housing_cost_amount_of_individual: 0
              us:statutes/26/931#input.income_effectively_connected_with_trade_or_business_within_specified_possessions: 0
              us:statutes/26/931#input.amounts_paid_for_services_as_employee_of_united_states_or_agency: 0
              us:statutes/26/933#input.individual_is_bona_fide_resident_of_puerto_rico_during_entire_taxable_year: false
              us:statutes/26/933#input.income_derived_from_sources_within_puerto_rico: 0
              us:statutes/26/933#input.amounts_received_for_services_performed_as_employee_of_united_states_or_agency: 0
