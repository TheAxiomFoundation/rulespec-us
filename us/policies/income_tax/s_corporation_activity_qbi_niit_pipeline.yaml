inputs:
  # Retained imported TaxUnit facts are explicit in this focus-file contract
  # for axiom-api#208. No defaults: the corresponding domain must verify them.
  - name: filing_status
    entity: TaxUnit
    dtype: Integer
    period: Year
    description: "Filing-status code; 0 single/other, 1 joint, 2 married filing separately, 3 head of household, 4 surviving spouse."
  - name: taxable_income_computed_without_section_199A
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Taxable income computed without the section 199A deduction. Completed-return boundary includes this activity's ordinary income exactly once; its construction is not derived here."
  - name: qualified_business_income_allocable_to_qualified_cooperative_payments
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Resolved QBI allocable to qualified cooperative payments."
  - name: w2_wages_allocable_to_qualified_cooperative_payments
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Resolved W-2 wages allocable to qualified cooperative payments."
  - name: qualified_reit_dividends
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Aggregate qualified REIT dividends."
  - name: qualified_publicly_traded_partnership_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Aggregate qualified publicly traded partnership income after applicable classification."
  - name: taxpayer_is_corporation
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: "Whether the taxpayer is a corporation and therefore outside section 199A(a)."
  - name: qualified_production_activities_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Specified agricultural or horticultural cooperative qualified production activities income."
  - name: taxpayer_is_specified_agricultural_or_horticultural_cooperative
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: "Whether the taxpayer is a specified agricultural or horticultural cooperative."
  - name: cooperative_w2_wages
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. W-2 wages used for the separate cooperative production deduction."
  - name: net_capital_gain_taken_into_account_as_investment_income_under_section_163_d_4_B_iii
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Net-capital-gain component treated as investment income under section 163(d)(4)(B)(iii)."
  - name: long_term_capital_gains
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Long-term capital gains used by the imported section 1(h) net-capital-gain rule."
  - name: short_term_capital_gains
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Short-term capital gains used by the imported section 1(h) net-capital-gain rule."
  - name: qualified_dividend_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Qualified dividend income used by the imported section 1(h) net-capital-gain rule."
  - name: adjusted_gross_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Completed-return adjusted gross income before the encoded section 1411(d) modification. Completed-return boundary includes this activity's ordinary income exactly once; its construction is not derived here."
  - name: elected_foreign_earned_income_exclusion_amount
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Runtime fact consumed by the encoded section 911(a)(1) exclusion."
  - name: deduction_under_subtitle_before_section_911_double_benefit_denial
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Runtime fact consumed by the encoded section 911(d)(6) disallowance."
  - name: deduction_properly_allocable_or_chargeable_to_amounts_excluded_under_subsection_a
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Runtime fact consumed by the encoded section 911(d)(6) disallowance."
  - name: exclusion_from_gross_income_under_subtitle_before_section_911_double_benefit_denial
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Runtime fact consumed by the encoded section 911(d)(6) disallowance."
  - name: exclusion_properly_allocable_or_chargeable_to_amounts_excluded_under_subsection_a
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Runtime fact consumed by the encoded section 911(d)(6) disallowance."
  - name: taxable_interest_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Post-classification section 1411(c)(1)(A)(i) taxable interest, including working-capital interest, disjoint from every other supplied income category."
  - name: dividend_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Post-classification section 1411(c)(1)(A)(i) dividends, including working-capital dividends, disjoint from every other supplied income category."
  - name: annuity_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Post-classification section 1411(c)(1)(A)(i) annuities, disjoint from every other supplied income category."
  - name: royalty_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Post-classification section 1411(c)(1)(A)(i) royalties, disjoint from every other supplied income category."
  - name: rental_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Post-classification section 1411(c)(1)(A)(i) rents after the ordinary-course exception, disjoint from every other supplied income category."
  - name: financial_trading_business_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Post-classification section 1411(c)(1)(A)(ii) financial-instrument or commodity trading income, disjoint from every other supplied income category."
  - name: investment_of_working_capital_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Must equal zero in the verified domain; section 1411(c)(3) working-capital income is classified once into the applicable named interest, dividend, annuity, royalty, rent, business, or gain input."
  - name: taxable_net_gain_from_dispositions_after_active_partnership_s_corporation_exception
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Post-classification section 1411(c)(1)(A)(iii) taxable net gain after the subsection (c)(4) exception, including applicable working-capital gain, disjoint from every other supplied income category."
  - name: allocable_investment_deductions
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Section 1411(c)(1)(B) deductions properly allocable to included income and gain."
  - name: qualified_plan_distributions
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Must equal zero in the verified domain because the imported section 1411(c)(5) encoding incorrectly treats this excluded category as an offset."
  - name: self_employment_income_subject_to_1401_b
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: "Retained boundary; must be explicitly zero for the corresponding QBI or NIIT output in this ordinary-income-only slice. Must equal zero in the verified domain because the imported section 1411(c)(6) encoding incorrectly treats this excluded category as an offset."
  - name: is_nonresident_alien
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: "Section 1411(e)(1) nonapplication fact."
  - name: trust_all_unexpired_interests_devoted_to_section_170_c_2_B_purposes
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: "Section 1411(e)(2) nonapplication fact."
  - name: is_individual
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: "Section 1411(a)(1) individual-applicability fact."
  - name: ownership_interest_relation_contains_taxpayers_only_activity_and_owner
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: "Required residual completeness attestation: the relation contains the taxpayer's only modeled owner-interest in its only relevant activity, with no omitted owner-interest, other business, or aggregation group. One modeled owner is not a claim that the S corporation has only one shareholder."
  - name: activity_entity_type_code
    entity: OwnerBusinessActivity
    dtype: Integer
    period: Year
    description: "Legal entity type of this ownership interest: code 1 is a recognized but deferred partnership; code 2 is the only supported S-corporation form. Every other code is invalid and outside the slice."
  - name: activity_ownership_share
    entity: OwnerBusinessActivity
    dtype: Rate
    period: Year
    description: "Taxpayer's ownership share of this S corporation. This exact-one first slice admits only 1.0; every partial, zero, negative, or greater-than-one share fails closed rather than applying an unproved allocation."
  - name: activity_is_trade_or_business
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Explicit legal fact that this is an operating section 162 trade or business qualifying as a business under both sections 199A and 1411. An activity covered only by the broader section 469(c)(5)-(6) definition does not satisfy this fact. Not inferred from entity type, income, SSTB status, or participation."
  - name: owner_materially_participates_under_section_469
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Explicit owner-specific section 469 material-participation fact, including applicable section 469(h) and regulatory special rules; not an hours-only proxy."
  - name: ordinary_business_income_or_loss
    entity: OwnerBusinessActivity
    dtype: Money
    period: Year
    unit: USD
    description: "This owner's allocable distributive/pro rata share of ordinary taxable business income net of allowed, properly allocable entity-level ordinary deductions. It is not entity total income or a precomputed QBI/NIIT amount. Embedded expenses are not subtracted again in NIIT. Additional owner-level loss, deduction, or NIIT adjustments are excluded by explicit domain facts."
  - name: activity_is_publicly_traded_partnership
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Explicit section 199A(e)(4) publicly traded partnership status. True is inconsistent with the S-corporation-only entity row and therefore closes both native output domains. That entity-consistency closure does not establish or determine NIIT passivity."
  - name: ordinary_income_is_included_in_taxable_income
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether the ordinary-income amount is included in the owner's taxable income for this year."
  - name: activity_is_specified_service_trade_or_business
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Explicit section 199A(d)(2) SSTB status. This is not a section 469 passive-activity fact."
  - name: activity_is_employee_services
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether the represented activity is performing services as an employee, rather than the admitted pass-through ordinary-income activity."
  - name: ordinary_income_is_effectively_connected_with_us_business
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Section 199A(c)(3)(A)(i) effectively connected US-business item qualification, supplied as a legal fact."
  - name: ordinary_income_contains_section_199A_c3_excluded_items
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether the ordinary amount contains any section 199A(c)(3)(B) excluded item; true defers QBI rather than subtracting an invented amount."
  - name: ordinary_income_contains_section_199A_c4_excluded_items
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether the ordinary amount contains reasonable compensation, guaranteed/service payments, or any other section 199A(c)(4) exclusion; true defers QBI."
  - name: qbi_loss_carryovers_or_other_owner_adjustments_present
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether QBI loss carryovers, suspended losses, or other owner-level income/deduction adjustments remain to be applied. This slice does not derive them."
  - name: activity_w2_wages
    entity: OwnerBusinessActivity
    dtype: Money
    period: Year
    unit: USD
    description: "Owner's allocable share of activity W-2 wages under section 199A(f)(1)(A)(iii), not an unallocated entity-wide total."
  - name: activity_ubia
    entity: OwnerBusinessActivity
    dtype: Money
    period: Year
    unit: USD
    description: "Owner's allocable share of unadjusted basis immediately after acquisition of activity property under section 199A(f)(1)(A)(iii), not an entity-wide total."
  - name: w2_wages_meet_section_199A_b4_requirements
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Explicit legal fact that the supplied wages are properly allocable to QBI and meet section 199A(b)(4)'s wage definition and timely-reporting conditions."
  - name: ubia_meets_section_199A_b6_and_h_requirements
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Explicit legal fact that the supplied UBIA is for qualified property and respects section 199A(b)(6) and (h). Asset-by-asset qualification and anti-abuse rules remain deferred."
  - name: activity_is_rental
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Rental activity requiring separate section 162/199A and section 469(c)(2)/(7) treatment; true places both legs outside this slice."
  - name: activity_is_financial_instrument_or_commodity_trading
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Trading activity requiring section 475/199A classification and the separate section 1411(c)(2)(B) branch, which may enter NIIT without passivity; true places both legs outside this slice."
  - name: activity_is_former_passive
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Former-passive activity requiring section 469(f) treatment; true defers NIIT."
  - name: activity_is_grouped_for_section_469
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether section 469 grouping applies beyond this single activity; true defers NIIT."
  - name: ordinary_income_requires_other_section_1411_adjustments
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether recharacterization, suspended losses, additional owner-level allocable deductions, working-capital items, or another section 1411 adjustment remains. True defers NIIT."
  - name: activity_has_current_or_prior_oil_or_gas_working_interest
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Whether the activity involves a current or prior working interest in oil/gas property, including successor-basis property under section 469(c)(3)(B). True defers NIIT: liability limitations, prior nonpassive losses, and succeeding-year treatment are not inferred from participation."
  - name: ordinary_income_is_taken_into_account_for_section_1401_b
    entity: OwnerBusinessActivity
    dtype: Boolean
    period: Year
    description: "Explicit section 1411(c)(6) classification of this ordinary-income item. True defers NIIT without using material participation as a self-employment-tax proxy."
