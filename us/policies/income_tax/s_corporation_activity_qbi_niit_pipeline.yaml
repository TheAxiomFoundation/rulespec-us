              excerpt: "any specified service trade or business of the taxpayer shall not fail to be treated as a qualified trade or business"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          activity_qbi_record_is_in_domain
          and activity_is_specified_service_trade_or_business

  - name: activity_niit_record_is_in_domain
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: 26 USC 1411(c)(1)-(6); ordinary nonrental, nontrading, unrecharacterized pass-through slice
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
