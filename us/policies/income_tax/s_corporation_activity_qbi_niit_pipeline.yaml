          and not activity_is_employee_services
          and not activity_is_rental
          and not activity_is_financial_instrument_or_commodity_trading
          and not activity_is_former_passive
          and not activity_is_grouped_for_section_469
          and not activity_has_current_or_prior_oil_or_gas_working_interest
          and not ordinary_income_requires_other_section_1411_adjustments
          and not ordinary_income_is_taken_into_account_for_section_1401_b

  - name: activity_niit_record_is_outside_domain
    kind: derived
