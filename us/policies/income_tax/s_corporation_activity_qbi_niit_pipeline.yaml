              output: activity_record_is_in_common_domain
              hash: sha256:local
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/1411
              excerpt: "a passive activity (within the meaning of section 469) with respect to the taxpayer"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/1411
              excerpt: "a trade or business of trading in financial instruments or commodities"
          - path: versions[0].formula
