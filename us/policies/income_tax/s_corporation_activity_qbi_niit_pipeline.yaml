format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/199A
      - us/statute/26/1411
      - us/statute/26/469/c/1
      - us/statute/26/469/c/3
      - us/guidance/irs/rev-proc-2025-32/page-22
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us/statute/26/199A
        - us/statute/26/1411
        - us/statute/26/469/c/1
        - us/statute/26/469/c/3
        - us/guidance/irs/rev-proc-2025-32/page-22
      rationale: |-
        Section 199A(c)-(f) supplies item qualification, the SSTB exclusion,
        and partner/shareholder allocation. Section 1411(c)(2)(A) instead
        invokes the owner-specific section 469 passive-activity predicate.
        The two predicates are deliberately separate. The existing QBI
        composition supplies the corrected 2026 Revenue Procedure parameters
        and deduction arithmetic; the existing NIIT composition supplies the
        tax arithmetic and its fail-closed section 1411/911 repair boundary.
        This slice consumes declared section 162/SSTB/participation facts; it
        does not claim to derive the full classification layer from the corpus.
  summary: |-
    First executable one-owner/one-activity S-corporation QBI and NIIT slice
    for tax year 2026. One OwnerBusinessActivity row carries an explicitly
    typed S-corporation interest, business/SSTB/participation facts, 100-percent
    ownership, and ordinary-income, W-2-wage, and UBIA amounts. Partnerships
    and every other entity form fail closed pending section 1402 coordination
    and the general-partner/limited-partner rules.
    The shared business fact means an operating section 162 business that
    meets both sections 199A and 1411, not only section 469's broader scope.
    The binary relation is at owner-interest grain, not an enterprise-wide
    record: participation belongs to this owner, and one modeled owner does not
    imply that the S corporation has only one shareholder.

    This composition derives qualified ordinary income, wages, and UBIA from
    the supplied qualified-item facts across the official 2026 SSTB regions. SSTB status has no effect
    at or below the applicable threshold, proportionally reduces those items
    within the phase-in range, and excludes them at or above the range end.
    Material participation remains absent from pre-minimum QBI classification,
    but the same section 469 fact used for NIIT passivity also derives the
    active-qualified-business aggregate used by the section 199A(i) minimum.
    SSTB status, W-2 wages, and UBIA remain absent from the passive-income and
    public NIIT dependency path.

    Section 199A(i)'s 2026 active-business minimum is composed rather than
    bypassed. Participation does not change pre-minimum QBI, but it can raise
    a qualifying taxpayer's final deduction to $400 when active QBI is at
    least $1,000. Post-2026 indexed minimum and threshold amounts remain
    outside this tax-year-2026 slice and fail closed explicitly.

    QBI item exclusions, owner-level adjustments, qualified wage/property
    determinations, and section 469 participation remain explicit legal facts
    or fail-closed boundaries. Ordinary income is owner-allocable taxable net
    business income after allowed, properly allocable entity-level deductions;
    additional owner-level adjustments are not silently inferred. The nominal
    gross-income slot in the NIIT atom therefore carries this net business
    contribution, with no second subtraction of the embedded expenses. NIIT
    covers nonrental, nontrading, nongrouped, non-former-passive ordinary income
    with no oil/gas working-interest history, unresolved recharacterization,
    or section 1401(b) item. A publicly traded partnership flag is inconsistent
    with this S-corporation-only row, so it closes both native domains; that
    consistency closure does not classify NIIT passivity. All unrelated
    inherited income/gain/deduction slots must be explicitly zero.

    Completed-return AGI and taxable income remain inputs. Their construction,
    including the ordinary-income amount exactly once, is not duplicated.
    Relation completeness remains a required residual attestation: exactly one observed
    row cannot prove that no other activity was omitted. Invalid or
    out-of-domain facts produce not_holds/zero; omitted required facts remain
    unevaluable. The native compiled amount outputs must be read with their separate
    verified-domain judgments. Existing direct QBI/NIIT modules are unchanged.
    Native compiler/runtime execution is in scope; API serving of the activity
    entity is explicitly out of scope pending axiom-rules-engine issue 155.
  deferred_outputs:
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#post_2026_qbi_parameters
      reason: |-
        Section 199A(i)(3) indexes the active-QBI threshold and minimum after
        2026, and the annual SSTB thresholds also change. This slice has no
        2027 parameter source and explicitly closes its native output domains after
        2026 rather than silently reusing 2026 amounts.
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#complete_qbi_item_and_allocation_composition
      reason: |-
        Section 199A(c), (b)(4), (b)(6), (f), and (h) require item exclusions,
        loss adjustments, eligible wages/property, owner allocation, and
        anti-abuse determinations. Owner-allocable ordinary income, wages,
        UBIA, and explicit legal qualification facts are retained boundaries;
        unresolved adjustments fail closed. Publicly traded partnerships use
        the separate section 199A(b)(1)(B)/(e)(4) component, not this ordinary
        wage/UBIA-limited QBI branch, and are deferred here.
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#complete_section_469_activity_classification
      reason: |-
        The imported atom derives only section 469(c)(1)'s business-and-no-
        material-participation predicate. Participation tests, rentals,
        grouping, former-passive treatment, section 469(c)(3) current or prior
        oil/gas working-interest treatment, and recharacterization are not
        inferred from SSTB status or entity type. Working-interest histories
        are deferred, including successor-basis property.
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#niit_with_nonzero_exclusions_or_section_911_adjustments
      blocked_by:
        - us:statutes/26/1411#net_investment_income
        - us:statutes/26/1411#niit_modified_adjusted_gross_income
      reason: |-
        Open atomic defect rulespec-us#1052 remains behind the existing
        NIIT composition's verified domain. All plan/1401(b)/911 amounts
        must be zero; raw section 911 facts must also be zero, not merely
        cancel in an imported derived amount.
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#multiple_owners_activities_losses_or_dispositions
      reason: |-
        Multiple owner-interests/activities, loss netting, dispositions,
        tiered entities, and arbitrary aggregation are outside the exact-one
        relation contract. No financial-income item is inferred from an
        owner label or from an ordinary-income amount.
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#partnership_activity_classification
      blocked_by:
        - rulespec-us#1052
      reason: |-
        Partnerships are outside this slice until section 1411(c)(6) is
        repaired and general-partner, limited-partner, section 1402, and
        section 469(h)(2) distinctions are encoded from the required sources.
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#business_entity_api_serving
      blocked_by:
        - axiom-rules-engine#155
      reason: |-
        Compiled native relation execution is covered. The serving artifact
        does not yet declare the entity roster and input interface needed for
        axiom-api to serve OwnerBusinessActivity safely.
    - output: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#full_source_derived_activity_classification
      reason: |-
        A full classification layer requires resolver-addressable carriers for
        26 USC 162, 469, and 475; 26 CFR 1.199A-1 through -6; 1.1411-1 through
        -10; 1.469-4; and 1.469-5T. The current corpus has no complete extracted
        carrier set. This slice therefore consumes explicit business, SSTB,
        participation, rental, and trading facts and fails closed on the
        unresolved branches instead of claiming that classification is derived.
imports:
  - us:statutes/26/469/c/1#passive_trade_or_business_activity_with_respect_to_owner
  - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_filing_status_is_enumerated
  - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_applicable_deduction_limit_start_for_return_category
  - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qbi_phasein_range_end
  - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qbi_phasein_range
  - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qbi_deduction_before_minimum_active_qbi
  - us:policies/income_tax/qualified_business_income_deduction_pipeline#federal_qualified_business_income_deduction
  - us:policies/income_tax/net_investment_income_tax_pipeline#niit_verified_domain_applies
  - us:policies/income_tax/net_investment_income_tax_pipeline#federal_net_investment_income_tax
rules:
  - name: s_corporation_ownership_interest_of_tax_unit
    kind: data_relation
    data_relation:
      predicate: s_corporation_ownership_interest_of_tax_unit
      arity: 2
      arguments:
        - OwnerBusinessActivity
        - TaxUnit

  - name: activity_entity_type_is_enumerated
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: Declared entity-form code guard; code 1 identifies a deferred partnership and code 2 identifies the supported S corporation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "In the case of a partnership or S corporation"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          activity_entity_type_code == 1
          or activity_entity_type_code == 2

  - name: activity_entity_form_is_supported_s_corporation
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: Declared first-slice entity boundary; partnerships and all other forms fail closed
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_entity_type_is_enumerated
              output: activity_entity_type_is_enumerated
              hash: sha256:local
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "In the case of a partnership or S corporation"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          activity_entity_type_is_enumerated
          and activity_entity_type_code == 2

  - name: activity_record_is_in_common_domain
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: Declared 100-percent-owned S-corporation ordinary-income slice under 26 USC 199A(f)(1) and 1411(c)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "In the case of a partnership or S corporation"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "each partner or shareholder shall take into account such person’s allocable share of each qualified item of income, gain, deduction, and loss"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/1411
              excerpt: "other gross income derived from a trade or business described in paragraph (2)"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_entity_form_is_supported_s_corporation
              output: activity_entity_form_is_supported_s_corporation
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          activity_entity_form_is_supported_s_corporation
          and not activity_is_publicly_traded_partnership
          and activity_is_trade_or_business
          and activity_ownership_share == 1
          and not activity_is_rental
          and not activity_is_financial_instrument_or_commodity_trading
          and ordinary_business_income_or_loss >= 0
          and ordinary_income_is_included_in_taxable_income

  - name: activity_record_is_outside_common_domain
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: Inverse of the declared common activity boundary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_in_common_domain
              output: activity_record_is_in_common_domain
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          not activity_record_is_in_common_domain

  - name: activity_slice_has_one_supported_owner_activity
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Declared exact-one owner-interest relation boundary; completeness is not inferred from observed rows
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "this section shall be applied at the partner or shareholder level"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "for each qualified trade or business carried on by the taxpayer"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_in_common_domain
              output: activity_record_is_in_common_domain
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_outside_common_domain
              output: activity_record_is_outside_common_domain
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ownership_interest_relation_contains_taxpayers_only_activity_and_owner
          and count_where(s_corporation_ownership_interest_of_tax_unit, activity_record_is_in_common_domain) == 1
          and count_where(s_corporation_ownership_interest_of_tax_unit, activity_record_is_outside_common_domain) == 0

  - name: activity_qbi_record_is_in_domain
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: 26 USC 199A(c), (d)(1)(B), (b)(4), (b)(6), and (h); explicit unresolved item and property boundaries
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_in_common_domain
              output: activity_record_is_in_common_domain
              hash: sha256:local
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "effectively connected with the conduct of a trade or business within the United States"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "The following items shall not be taken into account as a qualified item of income, gain, deduction, or loss"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "Qualified business income shall not include"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "the trade or business of performing services as an employee"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "Such term shall not include any amount which is not properly allocable to qualified business income"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "The term “qualified property” means"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "qualified REIT dividends and qualified publicly traded partnership income"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          activity_record_is_in_common_domain
          and not activity_is_publicly_traded_partnership
          and not activity_is_employee_services
          and ordinary_income_is_effectively_connected_with_us_business
          and not ordinary_income_contains_section_199A_c3_excluded_items
          and not ordinary_income_contains_section_199A_c4_excluded_items
          and not qbi_loss_carryovers_or_other_owner_adjustments_present
          and activity_w2_wages >= 0
          and activity_ubia >= 0
          and w2_wages_meet_section_199A_b4_requirements
          and ubia_meets_section_199A_b6_and_h_requirements

  - name: activity_qbi_record_is_outside_domain
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: Inverse of the declared section 199A item boundary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_qbi_record_is_in_domain
              output: activity_qbi_record_is_in_domain
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          not activity_qbi_record_is_in_domain

  - name: activity_is_qualified_non_sstb_business
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: 26 USC 199A(d)(1); non-SSTB classification independent of section 469 participation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_qbi_record_is_in_domain
              output: activity_qbi_record_is_in_domain
              hash: sha256:local
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "The term “qualified trade or business” means any trade or business other than"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "a specified service trade or business"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          activity_qbi_record_is_in_domain
          and not activity_is_specified_service_trade_or_business

  - name: activity_is_sstb_business_before_taxable_income_limit
    kind: derived
    entity: OwnerBusinessActivity
    dtype: Judgment
    period: Year
    source: 26 USC 199A(d)(2)-(3); SSTB item set before the taxpayer-level applicable percentage
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_qbi_record_is_in_domain
              output: activity_qbi_record_is_in_domain
              hash: sha256:local
