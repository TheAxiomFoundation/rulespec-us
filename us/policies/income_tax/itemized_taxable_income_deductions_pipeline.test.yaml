# Hand-computed tax-year-2026 fixtures for the bounded six-component
# itemized-deduction aggregate. The first 17 cases are the complete adopted
# `us-itemized-taxable-income-deductions-grid` case set from SPINE-PLAN §6.2.
# Every component is a completed post-limitation amount. No expected value
# comes from PolicyEngine.

