    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_is_qualified_non_sstb_business: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_is_sstb_business_before_taxable_income_limit: "holds"
