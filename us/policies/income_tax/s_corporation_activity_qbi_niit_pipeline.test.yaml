      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.qualified_production_activities_income: 0
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.cooperative_w2_wages: 0
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.net_capital_gain_taken_into_account_as_investment_income_under_section_163_d_4_B_iii: 0
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.long_term_capital_gains: 0
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.short_term_capital_gains: 0
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.qualified_dividend_income: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.adjusted_gross_income: 500000
      us:policies/income_tax/net_investment_income_tax_pipeline#input.is_individual: true
      us:policies/income_tax/net_investment_income_tax_pipeline#input.is_nonresident_alien: false
