      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.taxable_income_computed_without_section_199A: 500000
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.taxpayer_is_corporation: false
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.taxpayer_is_specified_agricultural_or_horticultural_cooperative: false
      us:policies/income_tax/qualified_business_income_deduction_pipeline#input.qualified_business_income_allocable_to_qualified_cooperative_payments: 0
