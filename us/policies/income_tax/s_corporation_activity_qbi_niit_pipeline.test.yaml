  output:
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_entity_type_is_enumerated: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_entity_form_is_supported_s_corporation: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_in_common_domain: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_outside_common_domain: "holds"


