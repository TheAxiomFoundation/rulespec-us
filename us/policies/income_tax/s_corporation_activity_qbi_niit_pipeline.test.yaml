  period: *tax_year_2026
  input:
    <<: *base_tax_unit
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#relation.s_corporation_ownership_interest_of_tax_unit:
      - <<: *base_activity
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_publicly_traded_partnership: true
  output:
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_has_one_supported_owner_activity: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_qbi_verified_domain_applies: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_niit_verified_domain_applies: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#qualified_business_income: "0"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#passive_activity_business_income: "0"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_federal_qbi_deduction: "0"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_federal_niit: "0"

