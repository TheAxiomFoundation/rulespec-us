# Source-grounded 2026 one-owner-interest/one-activity S-corporation cases.
# 26 USC 199A(c)-(f): QBI item/SSTB classification and owner allocation.
# 26 USC 469(c)(1) and 1411(c)(2)(A): owner-specific passive income.
# Rev. Proc. 2025-32 section 4.26 supplies the 2026 phase-out ends.
#
# At/above that end: QBI deduction before section 199A(i) is the lesser of
# 20% QBI, max(50% W-2, 25% W-2 + 2.5% UBIA), and 20% taxable income
# (net capital gain is zero). NIIT is 3.8% of the lesser of included passive
# ordinary income and positive MAGI excess. Expected values are independent
# decimal arithmetic from these sources, never another policy evaluator.
#
# Every executable activity is a 100%-owned S corporation. Partnerships and
# other entity forms fail closed. One section 469 material-participation fact
# drives both NIIT passivity and section 199A(i)'s active-business minimum while
# leaving the section 199A(c)-(f) item classification and pre-minimum amount
# unchanged.

- name: activity-row-non-sstb-nonparticipant
  period: &tax_year_2026
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input: &base_activity
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_entity_type_code: 2
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_ownership_share: 1
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_trade_or_business: true
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.owner_materially_participates_under_section_469: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_business_income_or_loss: 100000
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_income_is_included_in_taxable_income: true
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_specified_service_trade_or_business: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_publicly_traded_partnership: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_employee_services: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_income_is_effectively_connected_with_us_business: true
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_income_contains_section_199A_c3_excluded_items: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_income_contains_section_199A_c4_excluded_items: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.qbi_loss_carryovers_or_other_owner_adjustments_present: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_w2_wages: 100000
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_ubia: 0
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.w2_wages_meet_section_199A_b4_requirements: true
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ubia_meets_section_199A_b6_and_h_requirements: true
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_rental: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_financial_instrument_or_commodity_trading: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_former_passive: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_grouped_for_section_469: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_has_current_or_prior_oil_or_gas_working_interest: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_income_requires_other_section_1411_adjustments: false
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_income_is_taken_into_account_for_section_1401_b: false
  output:
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_entity_type_is_enumerated: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_entity_form_is_supported_s_corporation: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_is_qualified_non_sstb_business: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_is_included_passive_business: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_in_common_domain: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_record_is_outside_common_domain: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_qbi_record_is_in_domain: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_qbi_record_is_outside_domain: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_niit_record_is_in_domain: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_niit_record_is_outside_domain: "not_holds"


