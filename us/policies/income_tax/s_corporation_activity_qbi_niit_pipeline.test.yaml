      us:policies/income_tax/net_investment_income_tax_pipeline#input.dividend_income: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.annuity_income: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.royalty_income: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.rental_income: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.financial_trading_business_income: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.taxable_net_gain_from_dispositions_after_active_partnership_s_corporation_exception: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.allocable_investment_deductions: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.investment_of_working_capital_income: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.qualified_plan_distributions: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.self_employment_income_subject_to_1401_b: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.elected_foreign_earned_income_exclusion_amount: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.deduction_under_subtitle_before_section_911_double_benefit_denial: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.deduction_properly_allocable_or_chargeable_to_amounts_excluded_under_subsection_a: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.exclusion_from_gross_income_under_subtitle_before_section_911_double_benefit_denial: 0
      us:policies/income_tax/net_investment_income_tax_pipeline#input.exclusion_properly_allocable_or_chargeable_to_amounts_excluded_under_subsection_a: 0
