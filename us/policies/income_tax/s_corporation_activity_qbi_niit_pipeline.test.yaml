    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_is_included_passive_business: "not_holds"


- name: activity-row-sstb-only-change
  period: *tax_year_2026
  input:
    <<: *base_activity
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_specified_service_trade_or_business: true
