    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#qualified_trade_or_business_unadjusted_basis: "0"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_has_one_supported_owner_activity: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#supplied_amounts_are_for_taxpayers_only_qualified_trade_or_business: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#niit_income_categories_are_disjoint_post_classification_amounts: "holds"

- name: minimum-sensitive-positive-deduction-nonparticipant
  # Pre-minimum deduction is 200. No active QBI means the 400 floor does not apply.
  period: *tax_year_2026
  input:
    <<: *base_tax_unit
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#relation.s_corporation_ownership_interest_of_tax_unit:
      - <<: *base_activity
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_business_income_or_loss: 1000
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_w2_wages: 400
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.owner_materially_participates_under_section_469: false
  output:
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_qbi_classification_domain_applies: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_qbi_verified_domain_applies: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_niit_verified_domain_applies: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#qualified_business_income: "1000"
    us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qbi_deduction_before_minimum_active_qbi: "200"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#aggregate_qualified_business_income_from_active_qualified_trades_or_businesses: "0"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#passive_activity_business_income: "1000"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_federal_qbi_deduction: "200"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_federal_niit: "38"

- name: minimum-sensitive-positive-deduction-participant
  # The same participation fact removes NIIT passivity and activates the 400 floor.
  period: *tax_year_2026
  input:
    <<: *base_tax_unit
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#relation.s_corporation_ownership_interest_of_tax_unit:
      - <<: *base_activity
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.ordinary_business_income_or_loss: 1000
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_w2_wages: 400
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.owner_materially_participates_under_section_469: true
  output:
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_qbi_classification_domain_applies: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_qbi_verified_domain_applies: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_niit_verified_domain_applies: "holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#qualified_business_income: "1000"
    us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qbi_deduction_before_minimum_active_qbi: "200"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#aggregate_qualified_business_income_from_active_qualified_trades_or_businesses: "1000"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#passive_activity_business_income: "0"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_federal_qbi_deduction: "400"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_federal_niit: "0"

- name: publicly-traded-partnership-fails-whole-slice-closed
  # Partnerships remain recognizable but are not supported by this first slice.
  period: *tax_year_2026
  input:
    <<: *base_tax_unit
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#relation.s_corporation_ownership_interest_of_tax_unit:
      - <<: *base_activity
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_entity_type_code: 1
        us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#input.activity_is_publicly_traded_partnership: true
  output:
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_qbi_verified_domain_applies: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#activity_slice_niit_verified_domain_applies: "not_holds"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#qualified_business_income: "0"
    us:policies/income_tax/s_corporation_activity_qbi_niit_pipeline#passive_activity_business_income: "0"
