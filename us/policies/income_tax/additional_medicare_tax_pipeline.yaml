format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/3101
      - us/statute/26/1401
      - us/statute/26/1402
    upstream_source_check:
      status: composed_from_grounded_modules
      checked_paths:
        - us/statute/26/3101
        - us/statute/26/1401
        - us/statute/26/1402
      rationale: |-
        Section 3101(b)(2) supplies the imported wage leg. The sibling
        self-employment-tax pipeline supplies aggregated section 1402(b)
        self-employment income after deriving the paragraph-(12) adjustment
        from each Person's gross-self-employment-profit boundary. The current
        corpus pin supports section 1401(b)(2)(A)'s rate and filing-status
        thresholds, but its section 1401(b)(2)(B) coordination sentence
        incorrectly names section 3121(b)(2) instead of section 3101(b)(2).
        A targeted re-ingest is pending under axiom-corpus#514. Until that
        repaired release is pinned, the locally authored coordination and
        self-employment tax outputs fail closed. Section 1401(c)'s
        international-agreement relief calculation also remains deferred with
        the sibling pipeline's upstream
        `self_employment_tax_after_international_agreement_exemption` output.
  summary: |-
    Federal additional Medicare tax composition under 26 USC 3101(b)(2) and
    1401(b)(2). The wage leg remains an identity over the encoded section
    3101(b)(2) final tax. At the current corpus pin, the public
    self-employment leg is a fail-closed zero and the combined surface is valid
    only for tax units whose imported federal self-employment income is zero.
    These guarded surfaces are scoped to tax year 2026 because that is the
    imported SE pipeline's currently executable version.

    The self-employment leg accepts the same per-Person
    `gross_self_employment_profit` boundary declared by the sibling ordinary
    self-employment-tax pipeline: completed-return section 1402(a) net
    trade-or-business profit after all applicable section 1402(a) machinery
    except paragraph (12), never gross receipts. That imported pipeline
    applies the encoded paragraph-(12) deduction and section 1402(b) floor and
    exclusions, then aggregates Person amounts through
    `self_employed_individual_of_tax_unit`. The supported section
    1401(b)(2)(A) rate and filing-status primitives remain encoded for the
    post-repair restore, but no positive self-employment result is published
    while the pinned section 1401(b)(2)(B) text is corrupted.

    The required `no_foreign_system_exclusive_se_income` boundary and the
    zero-self-employment-income restriction are exposed together as
    `additional_medicare_tax_pipeline_self_employment_domain_is_valid`. When
    that Judgment is `not_holds`, the coordination helper, public
    self-employment leg, and public combined tax fail closed to zero; the
    independently valid imported wage leg remains observable. The section
    1401(c) relief pathway is not modeled as zero: the former generic exemption
    and taxable-income helpers remain explicit deferred outputs below.

    Root `us:statutes/26/1401` is deliberately not imported. RuleSpec concept
    fragments merge complete modules, and that root's implicit TaxUnit
    `self_employment_income` boundary collides with the Person-level rule
    imported by the sibling pipeline. Filing status uses the encoded
    convention: 0 single, 1 joint, 2 married filing separately, 3 head of
    household, and 4 surviving spouse. The public combined and per-leg output
    names remain unchanged.
  deferred_outputs:
    - output: us:statutes/26/1402/a#net_earnings_from_self_employment_before_paragraph_12
      reason: |-
        Section 1402(a)'s complete partnership, trade-or-business, deduction,
        exclusion, community-income, and special-rule assembly remains
        deferred upstream. The imported SE pipeline therefore accepts the
        completed-return amount immediately before paragraph (12) through its
        `gross_self_employment_profit` input.
    - output: us:statutes/26/1402/b#church_employee_income_special_rules_for_paragraph_2
      reason: |-
        The imported SE pipeline's ordinary-case section 1402(b)(2) threshold
        path does not implement the separate subsection 1402(j)(2)
        church-employee floor machinery.
    - output: us:policies/income_tax/additional_medicare_tax_pipeline#pipeline_additional_medicare_self_employment_income_exempt_under_international_agreement
      blocked_by:
        - us:statutes/26/1401#self_employment_tax_after_international_agreement_exemption
      reason: |-
        The imported self-employment pipeline leaves the section 1401(c)
        result unresolved at
        `self_employment_tax_after_international_agreement_exemption`. Until
        that upstream output is executable, this composition cannot derive a
        generic foreign-covered income amount from the imported pre-relief
        `federal_self_employment_income`.
    - output: us:policies/income_tax/additional_medicare_tax_pipeline#pipeline_taxable_self_employment_income_for_additional_medicare_tax
      blocked_by:
        - us:statutes/26/1401#self_employment_tax_after_international_agreement_exemption
      reason: |-
        The generic taxable aggregate would require subtracting the unresolved
        section 1401(c) foreign-covered income amount. It remains blocked with
        the upstream
        `self_employment_tax_after_international_agreement_exemption`; the
        executable alias below is expressly limited to the ordinary case.
    - output: us:policies/income_tax/additional_medicare_tax_pipeline#wages_taken_into_account_for_additional_medicare_tax
      reason: |-
        The current corpus pin's section 1401(b)(2)(B) coordination sentence
        names the tax imposed under section 3121(b)(2), while the lawful
        sentence names section 3101(b)(2). axiom-corpus#514 tracks the defect
        and its pending targeted re-ingest. Until the repaired release is
        pinned, this stable output returns the wage boundary only when imported
        tax-unit self-employment income is zero and otherwise fails closed to
        zero.
    - output: us:policies/income_tax/additional_medicare_tax_pipeline#federal_additional_medicare_self_employment_tax
      reason: |-
        A positive section 1401(b)(2) tax requires the unsupported
        section 1401(b)(2)(B) wage coordination. The current pinned record
        incorrectly names section 3121(b)(2) instead of section 3101(b)(2);
        axiom-corpus#514 and its pending targeted re-ingest track the repair.
        The stable public output therefore fails closed to zero until the
        repaired corpus release is pinned.
imports:
  - us:statutes/26/3101/b/2#additional_medicare_tax
  - us:policies/income_tax/self_employment_tax_pipeline#federal_self_employment_income
rules:
  - name: additional_medicare_tax_pipeline_self_employment_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: 26 USC 1401(b)(2)(B) and 1401(c), fail-closed current-pin applicability boundary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "During any period in which there is in effect an agreement entered into pursuant to section 233 of the Social Security Act with any foreign country, the self-employment income of an individual shall be exempt from the taxes imposed by this section to the extent that such self-employment income is subject under such agreement exclusively to the laws applicable to the social security system of such foreign country."
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/self_employment_tax_pipeline#federal_self_employment_income
              output: federal_self_employment_income
              hash: sha256:3668c1e3e86ff0625cab484bc1a1623ac233a0c401bdef71fd2a2832a51af72b
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          no_foreign_system_exclusive_se_income
          and federal_self_employment_income == 0

  # The lawful coordination sentence is absent from the current corpus pin:
  # the record names section 3121(b)(2), not section 3101(b)(2).
  # axiom-corpus#514 and a pending targeted re-ingest track the repair. This
  # helper therefore exposes wages only in the harmless zero-SE domain.
  - name: wages_taken_into_account_for_additional_medicare_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 1401(b)(2)(B), deferred fail-closed wage-coordination boundary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/additional_medicare_tax_pipeline#additional_medicare_tax_pipeline_self_employment_domain_is_valid
              output: additional_medicare_tax_pipeline_self_employment_domain_is_valid
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if additional_medicare_tax_pipeline_self_employment_domain_is_valid:
            wages
          else:
            0

  - name: pipeline_additional_medicare_self_employment_tax_rate
    kind: parameter
    dtype: Rate
    source: 26 USC 1401(b)(2)(A), additional self-employment tax rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "a tax equal to 0.9 percent of the self-employment income"
    versions:
      - effective_from: '2013-01-01'
        formula: '0.009'

  - name: pipeline_additional_medicare_self_employment_joint_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: 26 USC 1401(b)(2)(A)(i), joint-return threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "in the case of a joint return, $250,000"
    versions:
      - effective_from: '2013-01-01'
        formula: '250000'

  - name: pipeline_additional_medicare_self_employment_other_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: 26 USC 1401(b)(2)(A)(iii), threshold for any other filing status
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "in any other case, $200,000"
    versions:
      - effective_from: '2013-01-01'
        formula: '200000'

  - name: pipeline_additional_medicare_self_employment_separate_threshold_fraction
    kind: parameter
    dtype: Decimal
    source: 26 USC 1401(b)(2)(A)(ii), separate-return fraction of joint threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "½ of the dollar amount determined under clause (i)"
    versions:
      - effective_from: '2013-01-01'
        formula: 1 / 2

  - name: pipeline_additional_medicare_self_employment_separate_threshold
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 1401(b)(2)(A)(ii), married-filing-separately threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "in the case of a married taxpayer (as defined in section 7703) filing a separate return, ½ of the dollar amount determined under clause (i)"
    versions:
      - effective_from: '2013-01-01'
        formula: |-
          pipeline_additional_medicare_self_employment_joint_threshold
          * pipeline_additional_medicare_self_employment_separate_threshold_fraction

  - name: pipeline_additional_medicare_self_employment_threshold
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 1401(b)(2)(A)(i)-(iii), filing-status threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "self-employment income for such taxable year which is in excess of"
    versions:
      - effective_from: '2013-01-01'
        formula: |-
          match filing_status:
              1 => pipeline_additional_medicare_self_employment_joint_threshold
              2 => pipeline_additional_medicare_self_employment_separate_threshold
              0 => pipeline_additional_medicare_self_employment_other_threshold
              3 => pipeline_additional_medicare_self_employment_other_threshold
              4 => pipeline_additional_medicare_self_employment_other_threshold

  - name: pipeline_reduced_additional_medicare_self_employment_threshold
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 1401(b)(2)(B), threshold using the fail-closed coordination boundary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/additional_medicare_tax_pipeline#wages_taken_into_account_for_additional_medicare_tax
              output: wages_taken_into_account_for_additional_medicare_tax
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          max(
            0,
            pipeline_additional_medicare_self_employment_threshold
            - wages_taken_into_account_for_additional_medicare_tax
          )

  - name: pipeline_federal_self_employment_income_for_additional_medicare_tax_ordinary_case
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 1401(b)(2), imported federal self-employment income for the ordinary no-agreement case
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/self_employment_tax_pipeline#federal_self_employment_income
              output: federal_self_employment_income
              hash: sha256:3668c1e3e86ff0625cab484bc1a1623ac233a0c401bdef71fd2a2832a51af72b
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: federal_self_employment_income

  - name: pipeline_additional_medicare_self_employment_tax_base
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 1401(b)(2)(A)-(B), ordinary-case self-employment income above coordinated threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "self-employment income for such taxable year which is in excess of"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          max(
            0,
            pipeline_federal_self_employment_income_for_additional_medicare_tax_ordinary_case
            - pipeline_reduced_additional_medicare_self_employment_threshold
          )

  - name: federal_additional_medicare_wage_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 3101(b)(2), imported encoded wage-leg tax
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/3101/b/2#additional_medicare_tax
              output: additional_medicare_tax
              hash: sha256:f06b93b281a9f04e380d545bbc6f6484b0ae591237831b84051b57d05aa661fa
    versions:
      - effective_from: '2013-01-01'
        formula: additional_medicare_tax

  - name: federal_additional_medicare_self_employment_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 1401(b)(2), deferred fail-closed self-employment leg
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "a tax equal to 0.9 percent of the self-employment income"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/additional_medicare_tax_pipeline#additional_medicare_tax_pipeline_self_employment_domain_is_valid
              output: additional_medicare_tax_pipeline_self_employment_domain_is_valid
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if additional_medicare_tax_pipeline_self_employment_domain_is_valid:
            pipeline_additional_medicare_self_employment_tax_base
            * pipeline_additional_medicare_self_employment_tax_rate
          else:
            0

  - name: federal_additional_medicare_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 3101(b)(2) and 1401(b)(2), combined tax-unit surtax
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/3101/b/2#additional_medicare_tax
              output: additional_medicare_tax
              hash: sha256:f06b93b281a9f04e380d545bbc6f6484b0ae591237831b84051b57d05aa661fa
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/1401
              excerpt: "In addition to the tax imposed by paragraph (1) and the preceding subsection"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/income_tax/additional_medicare_tax_pipeline#additional_medicare_tax_pipeline_self_employment_domain_is_valid
              output: additional_medicare_tax_pipeline_self_employment_domain_is_valid
              hash: sha256:local
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if additional_medicare_tax_pipeline_self_employment_domain_is_valid:
            additional_medicare_tax
            + federal_additional_medicare_self_employment_tax
          else:
            0

inputs:
  - name: filing_status
    entity: TaxUnit
    dtype: Integer
    period: Year
    description: Filing-status code consumed by the imported wage leg and locally composed self-employment threshold.
  - name: wages
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: |-
      Tax-unit wages supplied to the imported section 3101(b)(2) wage leg,
      including both spouses' wages on a joint return. Their use in section
      1401(b)(2)(B) self-employment coordination remains deferred until the
      axiom-corpus#514 targeted re-ingest is released and pinned.
  - name: no_foreign_system_exclusive_se_income
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: Required attestation that no self-employment income of the tax unit is exempt from section 1401 under subsection (c) because it is subject exclusively to a foreign social-security system under a section 233 agreement.
