          and taxable_year_begins_before_senior_deduction_termination
          and not taxable_year_begins_after_termination_date
          and taxable_year_is_in_temporary_effective_window
          and (
            (resolved_itemization_election and not individual_does_not_elect_to_itemize_deductions_for_taxable_year)
