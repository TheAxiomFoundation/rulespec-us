      rationale: |-
        Sections 61 and 62 establish the completed adjusted-gross-income
        boundary. Section 63 supplies the itemizer and nonitemizer taxable-
        income definitions and makes itemization a return election. The
        imported itemized, standard, personal-exemption, senior, section 199A,
        nonitemizer-charity, tips, overtime, and vehicle-interest modules
        supply the component amounts. Section 165 supplies the completed
        wagering-loss boundary used only for itemizers. Section 63(c)(6) and
        section 443(a)(1) supply the imported standard-deduction disqualifier.
  summary: |-
    Fail-closed federal individual taxable-income composition for tax year
    2026 under 26 USC 63.

    Adjusted gross income is a completed-return boundary supplied through the
    imported itemized-deduction pipeline. `resolved_itemization_election` is
    the taxpayer's resolved legal return election under section 63(e); this
    module does not encode a tax-minimizing simulation heuristic. The imported
    section 170(p) nonitemizer fact must describe the same election. The
    itemized branch adds the imported itemized aggregate, section 199A
    deduction, completed section 165(d) wagering-loss deduction, tips,
    overtime, senior, and qualified-vehicle-interest deductions. The
    nonitemizer branch substitutes the imported Revenue Procedure standard
    deduction and section 170(p) deduction and excludes wagering losses.

    The Revenue Procedure module supplies the 2026 standard-deduction dollar
    mechanics. This composition separately imports section 63(c)(6) and makes
    the standard amount zero for an MFS return where either spouse itemizes, a
    nonresident alien, a qualifying section 443(a)(1) short-period return, or
    an estate, trust, common trust fund, or partnership. It deliberately does
    not import `us:statutes/26/63/c`, whose standard-deduction surface collides
    with the Revenue Procedure final.

    Filing status is the shared federal TaxUnit input: 0 single, 1 joint,
    2 married filing separately, 3 head of household, and 4 surviving spouse.
    The verified domain also requires the imported itemized and section 199A
    boundaries, complete 2026 temporal facts, consistent branch facts,
    nonnegative completed amounts, and an individual taxpayer. Invalid status,
    a false component attestation, an inconsistent election, or a negative
    completed amount makes the local deduction total and final taxable income
    return zero. The imported section 151 exemption deduction remains explicit
    and distinct from the separate senior deduction even though the exemption
    amount is zero in 2026.
