  # The lawful SE arithmetic is 0.009 * (138,525 - 100,000) = 346.725.
  # At the current corpus pin, the coordination helper and public SE/combined
  # outputs fail closed to zero because tax-unit SE income is nonzero.
  period: *tax_year_2026
