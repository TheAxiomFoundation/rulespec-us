format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/26/199A
      - us/guidance/irs/rev-proc-2025-32/page-21
      - us/guidance/irs/rev-proc-2025-32/page-22
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us/statute/26/199A
        - us/guidance/irs/rev-proc-2025-32/page-21
        - us/guidance/irs/rev-proc-2025-32/page-22
      rationale: |-
        Section 199A supplies the deduction rate, taxable-income/net-capital-
        gain ceiling, W-2-wage/UBIA limitation, REIT/PTP component, cooperative
        reduction, and active-QBI minimum. Revenue Procedure 2025-32 section
        4.26 supplies the tax-year-2026 threshold amounts: $403,500 joint,
        $201,775 married filing separately, and $201,750 for all other returns.
        Its published upper ends of $553,500, $276,775, and $276,750 confirm
        the current statutory phase-in widths of $150,000 joint and $75,000
        otherwise.
  summary: |-
    Federal qualified business income deduction composition under 26 USC
    199A for tax year 2026. The encoded section derives the final deduction,
    but its internal `threshold_amount_base` remains the unindexed statutory
    base of $157,500. This module imports all nine tax-year-2026 threshold,
    range-end, and width parameters from the dedicated Revenue Procedure
    2025-32 qualified-business-income module. It selects the applicable
    parameters at this pipeline's declared filing-status boundary, imports the
    encoded deduction components, and repeats only the threshold-dependent
    phase-in and final combination in locally proofed rules.

    The current section 199A text and Revenue Procedure 2025-32 use $75,000
    and $150,000 phase-in widths for 2026, not the pre-amendment $50,000 and
    $100,000 widths. The companion fixtures follow the current encoded statute
    and official revenue procedure. Filing status 1 selects the joint
    parameters, status 2 selects the married-filing-separately parameters, and
    statuses 0, 3, and 4 select the all-other parameters. Because the engine
    lowers the final `match` arm as a fallback, a separate enumerated-status
    judgment permits only statuses 0 through 4 and guards the final result
    against any unrecognized status.

    Qualified business income, W-2 wages, UBIA, cooperative amounts, REIT
    dividends, PTP income, and taxable income before this deduction are
    completed-return TaxUnit boundaries. QBI classification under section
    199A(c)-(d), including specified-service-business determinations, remains
    upstream as in the encoded section. Because the scalar trade-or-business
    leg cannot perform the paragraph-(2) sum across nonaggregable businesses,
    the final output requires an attestation that the supplied amounts form
    the taxpayer's only qualified-trade-or-business aggregation group and
    that no other qualified business exists. A false attestation returns zero;
    omission leaves the required boundary unevaluable. All fixtures use
    resolved non-SSTB QBI, zero UBIA, zero PTP income, zero cooperative
    amounts, and no net capital gain. The no-wage above-band fixture also has
    zero active-QBI aggregate, so section 199A(i)'s new $400 active-business
    minimum does not replace the zero wage-limited result.
  deferred_outputs:
    - output: us:statutes/26/199A#qualified_business_income_deduction
      reason: |-
        The encoded final output closes over an unindexed $157,500 threshold
        parameter. The corrected pipeline below instead selects the imported
        tax-year-2026 Revenue Procedure threshold, range end, and width while
        retaining the encoded component rules.
      source_values:
        - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qualified_business_income_threshold_amount
        - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qbi_phasein_range_end
        - us:policies/income_tax/qualified_business_income_deduction_pipeline#pipeline_qbi_phasein_range
    - output: us:statutes/26/199A/c#qualified_business_income_definition
      reason: |-
        The encoded section consumes resolved qualified business income and
        defers the subsection (c) item composition. This pipeline preserves
        that completed-return boundary.
    - output: us:statutes/26/199A/d#qualified_trade_or_business_definition
      reason: |-
        The encoded section consumes resolved trade-or-business
        classifications, including SSTB treatment. This pipeline preserves
        that upstream classification boundary and does not treat an unknown
        SSTB determination as false.
imports:
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_threshold_joint
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_range_end_joint
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_threshold_separate
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_range_end_separate
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_threshold_all_other
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_range_end_all_other
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_width_joint
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_width_separate
  - us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_width_all_other
  - us:statutes/26/199A#trade_or_business_wage_property_limit
  - us:statutes/26/199A#trade_or_business_qbi_amount_before_limits
  - us:statutes/26/199A#trade_or_business_excess_amount
  - us:statutes/26/199A#cooperative_reduction
  - us:statutes/26/199A#qualified_reit_and_ptp_component
  - us:statutes/26/199A#qbi_taxable_income_limit
  - us:statutes/26/199A#active_qbi_minimum_threshold_base
  - us:statutes/26/199A#minimum_active_qbi_deduction_base
rules:
  - name: pipeline_qualified_business_income_threshold_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Rev. Proc. 2025-32 section 4.26, applicable tax-year-2026 section 199A threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_threshold_joint
              output: qualified_business_income_threshold_joint
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_threshold_separate
              output: qualified_business_income_threshold_separate
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_threshold_all_other
              output: qualified_business_income_threshold_all_other
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-22
              excerpt: "Filing Status Threshold amount Phase-in range amount Married Individuals Filing Joint Returns $403,500 $553,500 Married Individuals Filing Separate Returns $201,775 $276,775 All Other Returns $201,750 $276,750"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          match filing_status:
              0 => qualified_business_income_threshold_all_other
              1 => qualified_business_income_threshold_joint
              2 => qualified_business_income_threshold_separate
              3 => qualified_business_income_threshold_all_other
              4 => qualified_business_income_threshold_all_other

  - name: pipeline_filing_status_is_enumerated
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Declared pipeline filing-status boundary mapped to the Rev. Proc. 2025-32 section 4.26 return categories
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-22
              excerpt: "Filing Status Threshold amount Phase-in range amount Married Individuals Filing Joint Returns $403,500 $553,500 Married Individuals Filing Separate Returns $201,775 $276,775 All Other Returns $201,750 $276,750"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          filing_status == 0
          or filing_status == 1
          or filing_status == 2
          or filing_status == 3
          or filing_status == 4

  - name: pipeline_qbi_phasein_range_end
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Rev. Proc. 2025-32 section 4.26, applicable tax-year-2026 section 199A phase-in range end
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_range_end_joint
              output: qualified_business_income_phase_in_range_end_joint
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_range_end_separate
              output: qualified_business_income_phase_in_range_end_separate
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_range_end_all_other
              output: qualified_business_income_phase_in_range_end_all_other
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-22
              excerpt: "Filing Status Threshold amount Phase-in range amount Married Individuals Filing Joint Returns $403,500 $553,500 Married Individuals Filing Separate Returns $201,775 $276,775 All Other Returns $201,750 $276,750"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          match filing_status:
              0 => qualified_business_income_phase_in_range_end_all_other
              1 => qualified_business_income_phase_in_range_end_joint
              2 => qualified_business_income_phase_in_range_end_separate
              3 => qualified_business_income_phase_in_range_end_all_other
              4 => qualified_business_income_phase_in_range_end_all_other

  - name: pipeline_qbi_phasein_range
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Rev. Proc. 2025-32 section 4.26 and 26 USC 199A(b)(3)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_width_joint
              output: qualified_business_income_phase_in_width_joint
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_width_separate
              output: qualified_business_income_phase_in_width_separate
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/irs/rev-proc-2025-32/qualified-business-income#qualified_business_income_phase_in_width_all_other
              output: qualified_business_income_phase_in_width_all_other
              hash: sha256:1220ffc5b3b22f28c7c64bdf518e2968b286d3d8d8c8a340da5ca408da9ffc32
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "threshold amount plus $75,000 ($150,000 in the case of a joint return)"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          match filing_status:
              0 => qualified_business_income_phase_in_width_all_other
              1 => qualified_business_income_phase_in_width_joint
              2 => qualified_business_income_phase_in_width_separate
              3 => qualified_business_income_phase_in_width_all_other
              4 => qualified_business_income_phase_in_width_all_other

  - name: pipeline_trade_or_business_phasein_reduction
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 199A(b)(3)(B)(ii), reduction over the applicable 2026 phase-in range
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "bears the same ratio to the excess amount as"
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#trade_or_business_excess_amount
              output: trade_or_business_excess_amount
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          trade_or_business_excess_amount
          * min(
              1,
              max(
                  0,
                  taxable_income_computed_without_section_199A
                  - pipeline_qualified_business_income_threshold_amount
              )
              / pipeline_qbi_phasein_range
          )

  - name: pipeline_trade_or_business_deductible_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 199A(b)(2), (b)(3), and (b)(7), using the official 2026 threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "Modifications to limit based on taxable income"
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#trade_or_business_qbi_amount_before_limits
              output: trade_or_business_qbi_amount_before_limits
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#trade_or_business_wage_property_limit
              output: trade_or_business_wage_property_limit
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#cooperative_reduction
              output: cooperative_reduction
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          max(
              0,
              (
                  if taxable_income_computed_without_section_199A
                      <= pipeline_qualified_business_income_threshold_amount:
                      trade_or_business_qbi_amount_before_limits
                  else:
                      if taxable_income_computed_without_section_199A
                          <= pipeline_qbi_phasein_range_end:
                          trade_or_business_qbi_amount_before_limits
                          - pipeline_trade_or_business_phasein_reduction
                      else:
                          min(
                              trade_or_business_qbi_amount_before_limits,
                              trade_or_business_wage_property_limit
                          )
              )
              - cooperative_reduction
          )

  - name: pipeline_combined_qualified_business_income_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 199A(b)(1), corrected trade-or-business amount plus the separate REIT/PTP component
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "plus 20 percent of the aggregate amount of the qualified REIT dividends"
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#qualified_reit_and_ptp_component
              output: qualified_reit_and_ptp_component
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          pipeline_trade_or_business_deductible_amount
          + qualified_reit_and_ptp_component

  - name: pipeline_qbi_deduction_before_minimum_active_qbi
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 199A(a), lesser of corrected combined QBI and taxable-income/net-capital-gain limit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "In the case of a taxpayer other than a corporation"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "the lesser of"
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#qbi_taxable_income_limit
              output: qbi_taxable_income_limit
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if taxpayer_is_corporation:
              0
          else:
              max(
                  0,
                  min(
                      pipeline_combined_qualified_business_income_amount,
                      qbi_taxable_income_limit
                  )
              )

  - name: pipeline_applicable_taxpayer_for_minimum_active_qbi_deduction
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: 26 USC 199A(i)(2)-(3), unadjusted active-QBI threshold for tax year 2026
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "aggregate qualified business income with respect to all active qualified trades or businesses ... is at least $1,000"
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#active_qbi_minimum_threshold_base
              output: active_qbi_minimum_threshold_base
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
          - path: versions[0].effective_to
            kind: effective_period
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "In the case of any taxable year beginning after 2026, the $400 amount ... and the $1,000 amount ... shall each be increased"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          aggregate_qualified_business_income_from_active_qualified_trades_or_businesses
          >= active_qbi_minimum_threshold_base

  - name: federal_qualified_business_income_deduction
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 26 USC 199A(a), (i), final tax-unit deduction using the official 2026 threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "In the case of a taxpayer other than a corporation"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "equal to the greater of"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "the sum of the amounts determined under paragraph (2) for each qualified trade or business carried on by the taxpayer"
          - path: versions[0].formula
            kind: import
            import:
              target: us:statutes/26/199A#minimum_active_qbi_deduction_base
              output: minimum_active_qbi_deduction_base
              hash: sha256:caa63943baa5fef539a7ae78ccf13c729149915e079f252cc44c97a7aa9db816
          - path: versions[0].effective_to
            kind: effective_period
            source:
              corpus_citation_path: us/statute/26/199A
              excerpt: "In the case of any taxable year beginning after 2026, the $400 amount ... and the $1,000 amount ... shall each be increased"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if (
              taxpayer_is_corporation
              or not supplied_amounts_are_for_taxpayers_only_qualified_trade_or_business
              or not pipeline_filing_status_is_enumerated
          ):
              0
          else:
              if pipeline_applicable_taxpayer_for_minimum_active_qbi_deduction:
                  max(
                      pipeline_qbi_deduction_before_minimum_active_qbi,
                      minimum_active_qbi_deduction_base
                  )
              else:
                  pipeline_qbi_deduction_before_minimum_active_qbi

inputs:
  - name: filing_status
    entity: TaxUnit
    dtype: Integer
    period: Year
    description: Filing-status code; 0 single/other, 1 joint, 2 married filing separately, 3 head of household, 4 surviving spouse.
  - name: supplied_amounts_are_for_taxpayers_only_qualified_trade_or_business
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: Required attestation that the scalar QBI, W-2 wage, UBIA, and cooperative amounts form one permitted aggregation group constituting the taxpayer's only qualified trade or business, with no other qualified business outside the group; false makes the final output zero and omission is unevaluable.
  - name: qualified_trade_or_business_w2_wages
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Resolved W-2 wages for the represented qualified trade or business.
  - name: qualified_trade_or_business_unadjusted_basis
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Resolved UBIA of qualified property for the represented qualified trade or business.
  - name: qualified_business_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Completed-return qualified business income after subsection (c)-(d) classification, loss netting, and SSTB treatment.
  - name: taxable_income_computed_without_section_199A
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Taxable income computed without the section 199A deduction.
  - name: qualified_business_income_allocable_to_qualified_cooperative_payments
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Resolved QBI allocable to qualified cooperative payments.
  - name: w2_wages_allocable_to_qualified_cooperative_payments
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Resolved W-2 wages allocable to qualified cooperative payments.
  - name: qualified_reit_dividends
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Aggregate qualified REIT dividends.
  - name: qualified_publicly_traded_partnership_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Aggregate qualified publicly traded partnership income after applicable classification.
  - name: taxpayer_is_corporation
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: Whether the taxpayer is a corporation and therefore outside section 199A(a).
  - name: aggregate_qualified_business_income_from_active_qualified_trades_or_businesses
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Aggregate QBI from active qualified trades or businesses for the section 199A(i) minimum deduction.
