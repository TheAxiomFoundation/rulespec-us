  summary: |-
    Articles of aluminum, steel, copper, derivative aluminum or steel articles, vehicles and parts, wood products, and semiconductor articles, of any country, as provided in subdivision (aa)(v) of U.S. note 2 to this subchapter. Rates of duty: The duty provided in the applicable subheading.
