- name: surcharge applies to non-exempt import during temporary period
  period:
    period_kind: custom
    name: day
    start: '2026-03-15'
    end: '2026-03-15'
  input:
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.article_is_imported_into_the_united_states: true
    ? us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.entry_is_within_temporary_surcharge_effective_period
    : true
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.article_listed_in_annex_i_paragraph_2_or_annex_ii: false
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.import_part_is_subject_to_section_232_tariff: false
    ? us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.import_was_loaded_and_in_final_transit_before_surcharge_effective_time
    : false
    ? us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.import_entered_for_consumption_before_transit_exception_deadline
    : false
    ? us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.import_admitted_into_united_states_foreign_trade_zone_on_or_after_effective_date
    : true
    ? us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#input.article_eligible_for_domestic_status_under_19_cfr_146_43
    : false
  output:
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#goods_in_transit_exception_applies: not_holds
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#import_part_exempt_from_surcharge: not_holds
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#temporary_import_surcharge_applies: holds
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#temporary_import_surcharge_duty_rate: 0.1
    us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#ftz_privileged_foreign_status_required: holds
