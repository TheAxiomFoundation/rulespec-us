format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
  summary: |-
    Proclamation 11012 imposes, for a period of 150 days, a temporary import surcharge of 10 percent ad valorem on articles imported into the United States, effective February 24, 2026. The surcharge does not apply to listed exceptions in Annexes I and II, goods in transit as defined, imports or parts of imports subject to section 232 tariffs, and other stated categories; it is in addition to other duties and treated as a regular customs duty.
rules:
  - name: temporary_import_surcharge_rate
    kind: parameter
    dtype: Rate
    source: Proclamation 11012 paragraphs 13 and clause (1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "a temporary import surcharge of 10 percent ad valorem"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          0.10

  - name: temporary_import_surcharge_maximum_duration_days
    kind: parameter
    dtype: Count
    period: Day
    source: Proclamation 11012 paragraphs 13 and 17
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "for a period of 150 days"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          150

  - name: section_122_authorized_maximum_surcharge_rate
    kind: parameter
    dtype: Rate
    source: Proclamation 11012 paragraph 17
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "a temporary import surcharge up to 15 percent ad valorem"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          0.15

  - name: goods_in_transit_exception_applies
    kind: derived
    entity: Import
    dtype: Judgment
    period: Day
    source: Proclamation 11012 paragraph 15
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "goods that (i) were loaded onto a vessel... before 12:01 a.m. eastern standard time on February 24, 2026; and (ii) are entered... before 12:01 a.m. eastern standard time, February 28, 2026"
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          import_was_loaded_and_in_final_transit_before_surcharge_effective_time
          and import_entered_for_consumption_before_transit_exception_deadline

  - name: import_part_exempt_from_surcharge
    kind: derived
    entity: Import
    dtype: Judgment
    period: Day
    source: Proclamation 11012 paragraphs 14-15 and clauses (2), (4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "shall not apply to imports of articles listed in paragraph 2 of Annex I... and as enumerated in Annex II"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "shall not apply in addition to tariffs imposed under section 232"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#goods_in_transit_exception_applies
              output: goods_in_transit_exception_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          article_listed_in_annex_i_paragraph_2_or_annex_ii
          or import_part_is_subject_to_section_232_tariff
          or goods_in_transit_exception_applies

  - name: temporary_import_surcharge_applies
    kind: derived
    entity: Import
    dtype: Judgment
    period: Day
    source: Proclamation 11012 clauses (1), (2), (4), and (7)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "all articles imported into the United States shall be subject to a 10 percent ad valorem duty rate"
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "on or after 12:01 a.m. eastern standard time on February 24, 2026, and shall continue in effect through 12:01 a.m. eastern daylight time on July 24, 2026"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#import_part_exempt_from_surcharge
              output: import_part_exempt_from_surcharge
              hash: sha256:local
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          article_is_imported_into_the_united_states
          and entry_is_within_temporary_surcharge_effective_period
          and not import_part_exempt_from_surcharge

  - name: temporary_import_surcharge_duty_rate
    kind: derived
    entity: Import
    dtype: Rate
    period: Day
    source: Proclamation 11012 clauses (1), (2), and (4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "Except as otherwise provided... all articles imported into the United States shall be subject to a 10 percent ad valorem duty rate"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#temporary_import_surcharge_rate
              output: temporary_import_surcharge_rate
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#temporary_import_surcharge_applies
              output: temporary_import_surcharge_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          if temporary_import_surcharge_applies: temporary_import_surcharge_rate else: 0

  - name: ftz_privileged_foreign_status_required
    kind: derived
    entity: Import
    dtype: Judgment
    period: Day
    source: Proclamation 11012 clause (6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03824
              excerpt: "admitted into a United States foreign trade zone on or after the effective date... must be admitted as privileged foreign status"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-122/proclamation#temporary_import_surcharge_applies
              output: temporary_import_surcharge_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-02-24'
        formula: |-
          temporary_import_surcharge_applies
          and import_admitted_into_united_states_foreign_trade_zone_on_or_after_effective_date
          and not article_eligible_for_domestic_status_under_19_cfr_146_43
