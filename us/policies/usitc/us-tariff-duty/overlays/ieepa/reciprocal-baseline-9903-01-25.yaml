format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.01.25
  summary: |-
    Articles the product of any country, except for products described in specified headings and except as provided in headings 9903.01.34 and 9903.02.01, receive the applicable subheading duty plus 10% for Rates of duty (1-General) and (1-Special); Rates of duty (2) remains the duty provided in the applicable subheading.
rules:
  - name: reciprocal_baseline_additional_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.01.25 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 10%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.10

  - name: reciprocal_baseline_additional_duty_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.01.25 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "Articles the product of any country"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "except for products described in headings 9903.01.26–9903.01.33, 9903.02.02–9903.02.91, 9903.96.01, and 9903.96.02"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "except as provided for in headings 9903.01.34 and 9903.02.01"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          not article_described_in_headings_9903_01_26_through_9903_01_33
          and not article_described_in_headings_9903_02_02_through_9903_02_91
          and not article_described_in_heading_9903_96_01
          and not article_described_in_heading_9903_96_02
          and not heading_9903_01_34_provides_otherwise_for_article
          and not heading_9903_02_01_provides_otherwise_for_article

  - name: reciprocal_baseline_additional_duty
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.25 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "The duty provided in the applicable subheading + 10%"
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if reciprocal_baseline_additional_duty_applies: reciprocal_baseline_additional_duty_rate else: 0

  - name: reciprocal_baseline_general_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.25 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 10%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          applicable_subheading_general_duty_rate + reciprocal_baseline_additional_duty

  - name: reciprocal_baseline_special_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.25 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "Rates of duty (1-Special): The duty provided in the applicable subheading + 10%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          applicable_subheading_special_duty_rate + reciprocal_baseline_additional_duty

  - name: reciprocal_baseline_column_2_duty_change
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.25 Rates of duty (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.25
              excerpt: "Rates of duty (2): The duty provided in the applicable subheading"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0
