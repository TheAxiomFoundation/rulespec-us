format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.01.77
  summary: |-
    Except for products described in headings 9903.01.78-9903.01.83 and 9903.01.90, articles the product of Brazil entered for consumption or withdrawn from warehouse for consumption after the effective time receive the applicable subheading duty plus 40% for Rates of duty (1-General) and (1-Special); Rates of duty (2) remains the duty provided in the applicable subheading.
rules:
  - name: brazil_ieepa_additional_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.01.77 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 40%"
    versions:
      - effective_from: '2025-08-06'
        formula: |-
          0.40

  - name: brazil_ieepa_heading_exception_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.01.77 heading exceptions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "Except for products described in headings 9903.01.78-9903.01.83 and 9903.01.90"
    versions:
      - effective_from: '2025-08-06'
        formula: |-
          article_described_in_heading_9903_01_78
          or article_described_in_heading_9903_01_79
          or article_described_in_heading_9903_01_80
          or article_described_in_heading_9903_01_81
          or article_described_in_heading_9903_01_82
          or article_described_in_heading_9903_01_83
          or article_described_in_heading_9903_01_90

  - name: brazil_ieepa_additional_duty_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.01.77 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "articles the product of Brazil"
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "became effective on August 6, 2025"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "Except for products described in headings 9903.01.78-9903.01.83 and 9903.01.90"
    versions:
      - effective_from: '2025-08-06'
        formula: |-
          article_is_product_of_brazil
          and not brazil_ieepa_heading_exception_applies

  - name: brazil_ieepa_additional_duty
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.77 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "The duty provided in the applicable subheading + 40%"
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
    versions:
      - effective_from: '2025-08-06'
        formula: |-
          if brazil_ieepa_additional_duty_applies: brazil_ieepa_additional_duty_rate else: 0

  - name: brazil_ieepa_general_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.77 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 40%"
    versions:
      - effective_from: '2025-08-06'
        formula: |-
          applicable_subheading_general_duty_rate + brazil_ieepa_additional_duty

  - name: brazil_ieepa_special_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.77 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "Rates of duty (1-Special): The duty provided in the applicable subheading + 40%"
    versions:
      - effective_from: '2025-08-06'
        formula: |-
          applicable_subheading_special_duty_rate + brazil_ieepa_additional_duty

  - name: brazil_ieepa_column_2_duty_change
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.77 Rates of duty (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.77
              excerpt: "Rates of duty (2): The duty provided in the applicable subheading"
    versions:
      - effective_from: '2025-08-06'
        formula: |-
          0
