format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/9903.01.33
      - us/rulemaking/federal-register/2025-04-07/2025-06063
  summary: |-
    Articles of iron or steel; derivative articles of iron or steel; articles of aluminum; derivative articles of aluminum; wood products; vehicles and vehicle parts; semiconductor articles; semi-finished copper; and intensive copper derivative products, of any country, as provided in subdivisions (v)(vi) through (v)(xvi) of U.S. note 2 to this subchapter. Rates of duty are the duty provided in the applicable subheading.

    Effective from 2025-04-05: Executive Order 14257 (90 FR 15041, FR doc 2025-06063) imposed the reciprocal ad valorem duties effective 12:01 a.m. eastern daylight time on April 5, 2025, and Sec. 3(b)(ii)-(iii) simultaneously excluded articles subject to Section 232 duties (steel, aluminum, automobiles and automotive parts) from those duties. Heading 9903.01.33 is the HTS carrier of that sectoral exclusion. The enumeration of covered subdivisions in U.S. note 2 was amended during the heading's effective window (the range grew across HTS revisions as further Section 232 sectors were proclaimed, reaching its current (v)(vi) through (v)(xvi) form in later revisions); whether an article falls within the covered subdivisions as they stood on the entry date is delegated to the declared input fact, so the judgment formula is invariant across those amendments.
rules:
  - name: reciprocal_metals_exclusion_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.01.33 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.33
              excerpt: "as provided in subdivisions (v)(vi) through (v)(xvi) of U.S. note 2"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.33
              excerpt: "of any country"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2025-04-07/2025-06063
              excerpt: "Such rates of duty shall apply with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on April 5, 2025"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2025-04-07/2025-06063
              excerpt: "(ii) all articles and derivatives of steel and aluminum subject to the duties imposed pursuant to section 232 of the Trade Expansion Act of 1962"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2025-04-07/2025-06063
              excerpt: "(iii) all automobiles and automotive parts subject to the additional duties imposed pursuant to section 232 of the Trade Expansion Act of 1962, as amended, and proclaimed in Proclamation 10908 of March 26, 2025 (Adjusting Imports of Automobiles and Automobile Parts Into the United States);"
    versions:
      - effective_from: '2025-04-05'
        formula: |-
          article_provided_in_us_note_2_v_vi_through_v_xvi

