format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.01.24
  summary: |-
    Except for products described in headings 9903.01.21, 9903.01.22, 9903.01.23, articles the product of China and Hong Kong are subject to the applicable subheading duty plus 10% for Rates of duty (1-General) and (1-Special); Rates of duty (2): No Change.
rules:
  - name: fentanyl_china_note_u_additional_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.01.24 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 10%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.10

  - name: fentanyl_china_note_u_additional_duty_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.01.24 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          (article_is_product_of_china or article_is_product_of_hong_kong)
          and not article_described_in_heading_9903_01_21
          and not article_described_in_heading_9903_01_22
          and not article_described_in_heading_9903_01_23

  - name: fentanyl_china_note_u_additional_duty
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.24 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
              excerpt: "The duty provided in the applicable subheading + 10%"
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if fentanyl_china_note_u_additional_duty_applies: fentanyl_china_note_u_additional_duty_rate else: 0

  - name: fentanyl_china_note_u_general_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.24 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 10%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          applicable_subheading_general_duty_rate + fentanyl_china_note_u_additional_duty

  - name: fentanyl_china_note_u_special_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.24 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
              excerpt: "Rates of duty (1-Special): The duty provided in the applicable subheading + 10%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          applicable_subheading_special_duty_rate + fentanyl_china_note_u_additional_duty

  - name: fentanyl_china_note_u_column_2_duty_change
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.01.24 Rates of duty (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.01.24
              excerpt: "Rates of duty (2): No Change"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0
