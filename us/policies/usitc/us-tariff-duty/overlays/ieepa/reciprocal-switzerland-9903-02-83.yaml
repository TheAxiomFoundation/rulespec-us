  summary: Except for products described in headings 9903.01.30-9903.01.33, 9903.02.78,
    and 9903.02.84-9903.02.86, and except as provided for in headings 9903.01.34 and
    9903.02.01, articles the product of Switzerland with a column 1-General ad valorem
    duty rate less than 15 percent have Rates of duty (1-General) and (1-Special)
    of 15%; Rates of duty (2) remains the duty provided in the applicable subheading.
