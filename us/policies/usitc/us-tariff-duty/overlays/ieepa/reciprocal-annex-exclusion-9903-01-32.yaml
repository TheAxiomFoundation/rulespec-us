format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.01.32
  summary: |-
    Articles the product of any country, classified in the subheadings enumerated in subdivision (v)(iii)(a) of U.S. note 2 to this subchapter. Rates of duty are the duty provided in the applicable subheading.
rules:
  - name: reciprocal_annex_exclusion_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.01.32 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.32
              excerpt: "classified in the subheadings enumerated in subdivision (v)(iii)(a) of U.S. note 2"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.32
              excerpt: "Articles the product of any country"
    versions:
