format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/9903.01.32
      - us/rulemaking/federal-register/2025-04-07/2025-06063
  summary: |-
    Articles the product of any country, classified in the subheadings enumerated in subdivision (v)(iii)(a) of U.S. note 2 to this subchapter. Rates of duty are the duty provided in the applicable subheading.

    Effective from 2025-04-05: Executive Order 14257 (90 FR 15041, FR doc 2025-06063) imposed the reciprocal ad valorem duties effective 12:01 a.m. eastern daylight time on April 5, 2025, and Sec. 3(b)(iv) simultaneously excluded the products enumerated in Annex II to the order from those duties. Heading 9903.01.32 is the HTS carrier of that Annex II product exclusion. The enumeration of excluded subheadings in U.S. note 2 was amended during the heading's effective window (the subdivision was restructured across HTS revisions, reaching its current (v)(iii)(a) form in later revisions); classification of an article within the enumerated subheadings as they stood on the entry date is delegated to the declared input fact, so the judgment formula is invariant across those amendments.
rules:
  - name: reciprocal_annex_exclusion_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.01.32 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.32
              excerpt: "classified in the subheadings enumerated in subdivision (v)(iii)(a) of U.S. note 2"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.01.32
              excerpt: "Articles the product of any country"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2025-04-07/2025-06063
              excerpt: "Such rates of duty shall apply with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on April 5, 2025"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2025-04-07/2025-06063
              excerpt: "(iv) other products enumerated in Annex II to this order, including copper, pharmaceuticals, semiconductors, lumber articles, certain critical minerals, and energy and energy products;"
    versions:
      - effective_from: '2025-04-05'
        formula: |-
          article_classified_in_subheadings_enumerated_in_us_note_2_v_iii_a

