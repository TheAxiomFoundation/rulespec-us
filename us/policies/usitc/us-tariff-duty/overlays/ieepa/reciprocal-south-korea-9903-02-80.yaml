format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
    - us/statute/hts/9903.02.80
    - us/statute/hts/9903.02.56
  summary: Except for products described in headings 9903.01.30-9903.01.33, 9903.02.78,
    and 9903.02.81, and except as provided for in headings 9903.01.34, 9903.02.01,
    articles the product of South Korea, as provided for in subdivision (v)(xxiv)(a)
    of U.S. note 2, with an ad valorem (or ad valorem equivalent) rate of duty under
    column 1-General or column 1-Special less than 15 percent receive Rates of duty
    (1-General) and (1-Special) of 15%; Rates of duty (2) remains the duty provided
    in the applicable subheading. The below-threshold condition is encoded as the
    complement of sibling heading 9903.02.79 (both column rates below 15 percent),
    so the 9903.02.79/9903.02.80 pair partitions South Korea articles without
    overlap.
    Effective from 2025-11-14, the date predecessor heading 9903.02.56 was
    terminated per its compiler's note (90 Fed. Reg. 55964); the successor
    headings 9903.02.79-9903.02.80 govern from that handoff date with no
    gap.
