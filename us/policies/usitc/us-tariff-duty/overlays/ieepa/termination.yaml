format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/rulemaking/federal-register/2026-02-25/2026-03832
  summary: |-
    The additional ad valorem duties imposed pursuant to IEEPA in the listed Executive Orders "shall no longer be in effect and, as soon as practicable, shall no longer be collected." This order affects only those additional ad valorem duties and does not affect other duties.
rules:
