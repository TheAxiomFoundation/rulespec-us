format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.02.87
  summary: Except for products described in headings 9903.01.30-9903.01.33, 9903.02.78,
    and 9903.02.89-9903.02.91, and except as provided for in headings 9903.01.34 and
    9903.02.01, articles the product of Liechtenstein with a column 1-General ad valorem
    rate equal to or greater than 15 percent receive the duty provided in the applicable
    subheading.
imports:
- us:policies/usitc/us-tariff-duty/overlays/ieepa/reciprocal-annex-exclusion-9903-01-32#reciprocal_annex_exclusion_applies
- us:policies/usitc/us-tariff-duty/overlays/ieepa/reciprocal-metals-exclusion-9903-01-33#reciprocal_metals_exclusion_applies
rules:
