format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
    - us/statute/hts/9903.02.87
    - us/rulemaking/federal-register/2025-12-18/2025-23316
  summary: Except for products described in headings 9903.01.30-9903.01.33, 9903.02.78,
    and 9903.02.89-9903.02.91, and except as provided for in headings 9903.01.34 and
    9903.02.01, articles the product of Liechtenstein with a column 1-General ad valorem
    rate equal to or greater than 15 percent receive the duty provided in the applicable
    subheading.
    Effective from 2025-11-14 per Annex II of the implementing notice (90
    Fed. Reg. 59281), which inserts new headings 9903.02.82-9903.02.91
    effective with respect to goods entered for consumption on or after
    12:01 a.m. eastern time on November 14, 2025.
imports:
