  kind: parameter
  dtype: Rate
  source: HTS 9903.02.87 article scope
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us/statute/hts/9903.02.87
          excerpt: equal to or greater than 15 percent
  versions:
  - effective_from: '2026-02-15'
    formula: '0.15'
