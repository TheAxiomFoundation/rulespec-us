          target: us:policies/usitc/us-tariff-duty/overlays/ieepa/reciprocal-metals-exclusion-9903-01-33#reciprocal_metals_exclusion_applies
          output: reciprocal_metals_exclusion_applies
          hash: sha256:99bf89b76e7d22176ce30f4a2bc2b59f024f403f73eb077c5a951b964200d64e
