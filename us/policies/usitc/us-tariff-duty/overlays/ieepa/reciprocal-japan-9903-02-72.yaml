format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.02.72
  summary: |-
    Except for qualifying in-transit goods, products described in headings 9903.01.30-9903.01.33 and 9903.02.78, and articles otherwise provided for in headings 9903.01.34, 9903.02.01, and 9903.96.02, articles the product of Japan with a column 1 ad valorem or equivalent duty rate equal to or greater than 15 percent receive the duty provided in the applicable subheading for Rates of duty (1-General) and (1-Special); Rates of duty (2) has no change.
imports:
  - us:policies/usitc/us-tariff-duty/overlays/ieepa/reciprocal-annex-exclusion-9903-01-32#reciprocal_annex_exclusion_applies
  - us:policies/usitc/us-tariff-duty/overlays/ieepa/reciprocal-metals-exclusion-9903-01-33#reciprocal_metals_exclusion_applies
rules:
  - name: reciprocal_japan_column_1_floor_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.02.72 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "rate of duty under column 1 equal to or greater than 15 percent"
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          0.15

  - name: reciprocal_japan_floor_in_transit_exception_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.02.72 in-transit exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "goods loaded onto a vessel at the port of loading and in transit on the final mode of transit before 12:01 a.m. eastern daylight time on August 7, 2025"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "entered for consumption or withdrawn from warehouse for consumption before 12:01 a.m. eastern daylight time on October 5, 2025"
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          goods_loaded_onto_vessel_at_port_of_loading_and_in_transit_on_final_mode_before_effective_time
          and goods_entered_for_consumption_or_withdrawn_from_warehouse_before_transition_deadline

  - name: reciprocal_japan_floor_heading_product_exception_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.02.72 heading product exceptions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "except for products described in headings 9903.01.30-9903.01.33 and 9903.02.78"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/ieepa/reciprocal-annex-exclusion-9903-01-32#reciprocal_annex_exclusion_applies
              output: reciprocal_annex_exclusion_applies
              hash: sha256:bba87ac41936db0898ffb2c5e1683c13ea37007b08b96fec4a087f61fde8cd85
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/ieepa/reciprocal-metals-exclusion-9903-01-33#reciprocal_metals_exclusion_applies
              output: reciprocal_metals_exclusion_applies
              hash: sha256:c0ab0a6e46c9981dc64843f957f2d91745319cc6fa1b31c342096f08f17cba07
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          article_described_in_heading_9903_01_30
          or article_described_in_heading_9903_01_31
          or reciprocal_annex_exclusion_applies
          or reciprocal_metals_exclusion_applies
          or article_described_in_heading_9903_02_78

  - name: reciprocal_japan_floor_otherwise_provision_exception_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.02.72 otherwise provided exceptions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "except as provided for in headings 9903.01.34, 9903.02.01, and 9903.96.02"
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          heading_9903_01_34_provides_otherwise_for_article
          or heading_9903_02_01_provides_otherwise_for_article
          or heading_9903_96_02_provides_otherwise_for_article

  - name: reciprocal_japan_floor_met_or_exceeded_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.02.72 article scope
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "articles the product of Japan"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "with an ad valorem (or ad valorem equivalent) rate of duty under column 1 equal to or greater than 15 percent"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          article_is_product_of_japan_as_provided_for_in_us_note_2_v
          and applicable_subheading_general_duty_rate >= reciprocal_japan_column_1_floor_rate
          and not reciprocal_japan_floor_in_transit_exception_applies
          and not reciprocal_japan_floor_heading_product_exception_applies
          and not reciprocal_japan_floor_otherwise_provision_exception_applies

  - name: reciprocal_japan_floor_general_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.02.72 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading"
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          applicable_subheading_general_duty_rate

  - name: reciprocal_japan_floor_special_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.02.72 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "Rates of duty (1-Special): The duty provided in the applicable subheading"
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          applicable_subheading_special_duty_rate

  - name: reciprocal_japan_floor_column_2_duty_change
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.02.72 Rates of duty (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.02.72
              excerpt: "Rates of duty (2): No change."
    versions:
      - effective_from: '2025-08-07'
        formula: |-
          0
