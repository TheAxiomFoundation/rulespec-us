            source:
              corpus_citation_path: us/rulemaking/federal-register/2025-12-18/2025-23316
              excerpt: "Effective with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern time on November 14, 2025, subchapter III of chapter 99 of the Harmonized Tariff Schedule of the United States (HTSUS) is modified as follows:"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us/rulemaking/federal-register/2025-12-18/2025-23316
              excerpt: "New headings 9903.02.82-9903.02.91 shall be inserted in numerical sequence"
