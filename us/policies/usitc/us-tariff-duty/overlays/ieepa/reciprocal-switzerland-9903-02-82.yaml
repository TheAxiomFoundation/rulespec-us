    corpus_citation_paths:
    - us/statute/hts/9903.02.82
    - us/rulemaking/federal-register/2025-12-18/2025-23316
  summary: |-
    Articles the product of Switzerland, except for listed headings and headings 9903.01.34 and 9903.02.01, with column 1-General duty equal to or greater than 15 percent; rates of duty are the duty provided in the applicable subheading.
    Effective from 2025-11-14 per Annex II of the implementing notice (90 Fed. Reg. 59281), which inserts new headings 9903.02.82-9903.02.91 effective with respect to goods entered for consumption on or after 12:01 a.m. eastern time on November 14, 2025.
