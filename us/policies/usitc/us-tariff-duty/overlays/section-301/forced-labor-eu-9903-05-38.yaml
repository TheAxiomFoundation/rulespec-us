format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.05.38
  summary: |-
    Except for products described in headings 9903.05.85-9903.05.92 and 9903.05.97, articles the product of a member state of the European Union, with an ad valorem (or ad valorem equivalent) rate of duty under column 1 equal to or greater than 10 percent, as provided for in U.S. note 52 to this subchapter. Rates of duty (1-General) and (1-Special): The duty provided in the applicable subheading.
rules:
  - name: forced_labor_eu_column_1_rate_threshold
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.38 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.38
              excerpt: "equal to or greater than 10 percent"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          0.10

  - name: forced_labor_eu_heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.38 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.38
              excerpt: "articles the product of a member state of the European Union"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.38
              excerpt: "rate of duty under column 1 equal to or greater than 10 percent"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-eu-9903-05-38#forced_labor_eu_column_1_rate_threshold
              output: forced_labor_eu_column_1_rate_threshold
              hash: sha256:local
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.05.38
              excerpt: "Except for products described in headings 9903.05.85-9903.05.92 and 9903.05.97"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          article_is_product_of_member_state_of_european_union
          and applicable_subheading_general_duty_rate >= forced_labor_eu_column_1_rate_threshold
          and not article_described_in_headings_9903_05_85_through_9903_05_92
          and not article_described_in_heading_9903_05_97
