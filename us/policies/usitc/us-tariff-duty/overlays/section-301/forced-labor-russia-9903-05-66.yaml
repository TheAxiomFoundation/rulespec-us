format: rulespec/v1
imports:
  - us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-presidential-action#forced_labor_section_301_twelve_and_one_half_percent_rate
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.05.66
  summary: |-
    Except for products described in headings 9903.05.85–9903.05.92, articles the product of Russia, as provided for in U.S. note 52 to this subchapter. Rates of duty (1-General), (1-Special), and (2): the duty provided in the applicable subheading + 12.5%.
rules:
  - name: forced_labor_russia_heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.66 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.66
              excerpt: "articles the product of Russia"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.05.66
              excerpt: "Except for products described in headings 9903.05.85–9903.05.92"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          article_is_product_of_russia
          and not article_described_in_headings_9903_05_85_through_9903_05_92

