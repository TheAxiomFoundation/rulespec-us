format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.05.73
  summary: |-
    Except for products described in headings 9903.05.85-9903.05.92 and 9903.05.98, articles the product of Switzerland, with a column 1 ad valorem rate equal to or greater than 12.5 percent. Rates of duty (1-General) and (1-Special): the duty provided in the applicable subheading; Rates of duty (2): No change.
rules:
  - name: switzerland_column_1_rate_threshold
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.73 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.73
              excerpt: "equal to or greater than 12.5 percent"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          0.125

  - name: forced_labor_switzerland_heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.73 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.73
              excerpt: "articles the product of Switzerland"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.73
              excerpt: "rate of duty under column 1 equal to or greater than 12.5 percent"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-switzerland-9903-05-73#switzerland_column_1_rate_threshold
              output: switzerland_column_1_rate_threshold
              hash: sha256:local
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.05.73
              excerpt: "Except for products described in headings 9903.05.85-9903.05.92 and 9903.05.98"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          article_is_product_of_switzerland
          and applicable_subheading_general_duty_rate >= switzerland_column_1_rate_threshold
          and not article_described_in_headings_9903_05_85_through_9903_05_92
          and not article_described_in_heading_9903_05_98

  - name: general_duty_rate_after_forced_labor_switzerland_overlay
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.05.73 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.73
              excerpt: "The duty provided in the applicable subheading"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-switzerland-9903-05-73#forced_labor_switzerland_heading_applies
              output: forced_labor_switzerland_heading_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          if forced_labor_switzerland_heading_applies: applicable_subheading_general_duty_rate else: applicable_subheading_general_duty_rate

  - name: special_duty_rate_after_forced_labor_switzerland_overlay
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.05.73 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.73
              excerpt: "The duty provided in the applicable subheading"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-switzerland-9903-05-73#forced_labor_switzerland_heading_applies
              output: forced_labor_switzerland_heading_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          if forced_labor_switzerland_heading_applies: applicable_subheading_special_duty_rate else: applicable_subheading_special_duty_rate
