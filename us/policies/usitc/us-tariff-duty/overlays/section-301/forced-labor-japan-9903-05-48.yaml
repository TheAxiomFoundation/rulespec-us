format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.05.48
  summary: |-
    Except for products described in headings 9903.05.85-9903.05.92, articles the product of Japan, with an ad valorem (or ad valorem equivalent) rate of duty under column 1 equal to or greater than 12.5 percent. Rates of duty (1-General) and (1-Special): The duty provided in the applicable subheading; Rates of duty (2): No change.
rules:
  - name: forced_labor_japan_column_1_floor_threshold_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.48 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
              excerpt: "equal to or greater than 12.5 percent"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          0.125

  - name: forced_labor_japan_heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.48 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
              excerpt: "articles the product of Japan"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
              excerpt: "with an ad valorem (or ad valorem equivalent) rate of duty under column 1 equal to or greater than 12.5 percent"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
              excerpt: "Except for products described in headings 9903.05.85-9903.05.92"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-japan-9903-05-48#forced_labor_japan_column_1_floor_threshold_rate
              output: forced_labor_japan_column_1_floor_threshold_rate
              hash: sha256:local
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          article_is_product_of_japan
          and applicable_subheading_general_duty_rate >= forced_labor_japan_column_1_floor_threshold_rate
          and not article_described_in_headings_9903_05_85_through_9903_05_92

  - name: general_duty_rate_after_forced_labor_japan_overlay
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.05.48 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          applicable_subheading_general_duty_rate

  - name: special_duty_rate_after_forced_labor_japan_overlay
    kind: derived
    entity: Asset
