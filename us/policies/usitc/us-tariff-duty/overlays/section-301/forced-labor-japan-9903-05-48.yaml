    period: Day
    source: HTS 9903.05.48 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
              excerpt: "Rates of duty (1-Special): The duty provided in the applicable subheading"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.48
    versions:
