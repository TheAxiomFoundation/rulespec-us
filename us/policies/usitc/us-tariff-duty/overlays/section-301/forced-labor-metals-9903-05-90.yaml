format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.05.90
  summary: |-
    Articles of aluminum, steel, copper, derivative aluminum or steel articles, vehicles and parts, wood products, patented pharmaceutical articles, and semiconductor articles, as provided in subdivision (f) of U.S. note 52. Rates of duty: the duty provided in the applicable subheading.
rules:
  - name: forced_labor_metals_heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.90 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.90
              excerpt: "as provided in subdivision (f) of U.S. note 52"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.90
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          article_provided_for_in_subdivision_f_of_us_note_52
          and (
            article_is_aluminum_steel_copper_or_derivative_aluminum_or_steel_article
            or article_is_passenger_vehicle_or_light_truck
            or article_is_part_of_passenger_vehicle_or_light_truck
            or article_is_medium_or_heavy_duty_vehicle
            or article_is_part_of_medium_or_heavy_duty_vehicle
            or article_is_wood_product
            or article_is_patented_pharmaceutical_article
            or article_is_semiconductor_article
          )
