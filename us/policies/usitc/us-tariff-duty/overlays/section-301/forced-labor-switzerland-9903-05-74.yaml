format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/9903.05.74
      - us/statute/hts/9903.05.73
  summary: |-
    Except for products described in headings 9903.05.85–9903.05.92 and 9903.05.98, articles the product of Switzerland, with an ad valorem (or ad valorem equivalent) rate of duty under column 1 less than 12.5 percent, as provided for in U.S. note 52 to this subchapter. Rates of duty (1-General) and (1-Special): 12.5%; Rates of duty (2): No change.
rules:
  - name: forced_labor_switzerland_floor_column_1_rate_threshold
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.74 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.74
              excerpt: "less than 12.5 percent"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          0.125

  - name: forced_labor_switzerland_floor_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.74 Rates of duty (1-General) and (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.74
              excerpt: "Rates of duty (1-General): 12.5%"
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.74
              excerpt: "Rates of duty (1-Special): 12.5%"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          0.125

  - name: forced_labor_switzerland_floor_heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.74 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.74
              excerpt: "articles the product of Switzerland"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.74
              excerpt: "with an ad valorem (or ad valorem equivalent) rate of duty under column 1 less than 12.5 percent"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.05.74
              excerpt: "Except for products described in headings 9903.05.85–9903.05.92 and 9903.05.98"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-switzerland-9903-05-74#forced_labor_switzerland_floor_column_1_rate_threshold
              output: forced_labor_switzerland_floor_column_1_rate_threshold
              hash: sha256:local
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          article_is_product_of_switzerland
          and applicable_subheading_general_duty_rate < forced_labor_switzerland_floor_column_1_rate_threshold
          and not article_described_in_headings_9903_05_85_through_9903_05_92
          and not article_described_in_heading_9903_05_98

