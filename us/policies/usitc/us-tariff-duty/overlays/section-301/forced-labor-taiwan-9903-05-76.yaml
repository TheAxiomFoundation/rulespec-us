format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/9903.05.76
      - us/statute/hts/9903.05.75
  summary: |-
    Except for products described in headings 9903.05.85–9903.05.92 and 9903.06.14–9903.06.15, articles the product of Taiwan, with an ad valorem (or ad valorem equivalent) rate of duty under column 1 less than 10 percent, as provided for in U.S. note 52 to this subchapter. Rates of duty (1-General) and (1-Special): 10%; Rates of duty (2): No change.
rules:
  - name: forced_labor_taiwan_floor_column_1_rate_threshold
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.76 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "less than 10 percent"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          0.10

  - name: forced_labor_taiwan_floor_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.76 Rates of duty (1-General) and (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "Rates of duty (1-General): 10%"
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "Rates of duty (1-Special): 10%"
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          0.10

  - name: forced_labor_taiwan_floor_heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.76 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "articles the product of Taiwan"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "with an ad valorem (or ad valorem equivalent) rate of duty under column 1 less than 10 percent"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "Except for products described in headings 9903.05.85–9903.05.92 and 9903.06.14–9903.06.15"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-taiwan-9903-05-76#forced_labor_taiwan_floor_column_1_rate_threshold
              output: forced_labor_taiwan_floor_column_1_rate_threshold
              hash: sha256:local
    versions:
      - effective_from: '2026-07-24'
        formula: |-
          article_is_product_of_taiwan
          and applicable_subheading_general_duty_rate < forced_labor_taiwan_floor_column_1_rate_threshold
          and not article_described_in_headings_9903_05_85_through_9903_05_92
          and not article_described_in_headings_9903_06_14_through_9903_06_15

  - name: general_duty_rate_after_forced_labor_taiwan_floor_overlay
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.05.76 Rates of duty (1-General)
