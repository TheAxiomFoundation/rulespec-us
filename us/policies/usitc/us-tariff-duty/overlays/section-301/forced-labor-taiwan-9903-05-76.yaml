        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "Rates of duty (1-General): 10%"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.76
              excerpt: "with an ad valorem (or ad valorem equivalent) rate of duty under column 1 less than 10 percent"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.75
              excerpt: "with an ad valorem (or ad valorem equivalent) rate of duty under column 1 equal to or greater than 10 percent"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.75
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-taiwan-9903-05-76#forced_labor_taiwan_floor_heading_applies
              output: forced_labor_taiwan_floor_heading_applies
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-taiwan-9903-05-76#forced_labor_taiwan_floor_duty_rate
              output: forced_labor_taiwan_floor_duty_rate
              hash: sha256:local
    versions:
