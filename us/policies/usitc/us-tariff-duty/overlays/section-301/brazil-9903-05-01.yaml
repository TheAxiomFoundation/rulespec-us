format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.05.01
  summary: |-
    Except for products described in headings 9903.05.02–9903.05.09 articles the product of Brazil receive the applicable subheading duty plus 25% for 1-General and 1-Special rates.
rules:
  - name: brazil_section_301_additional_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.05.01 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.05.01
              excerpt: "The duty provided in the applicable subheading + 25%"
    versions:
      - effective_from: '2026-07-22'
        formula: |-
          0.25

  - name: heading_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.05.01 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.01
              excerpt: "articles the product of Brazil"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.05.01
              excerpt: "Except for products described in headings 9903.05.02–9903.05.09"
    versions:
      - effective_from: '2026-07-22'
        formula: |-
          article_is_product_of_brazil
          and not article_described_in_headings_9903_05_02_through_9903_05_09

  - name: general_duty_rate_after_brazil_section_301_overlay
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.05.01 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.01
              excerpt: "The duty provided in the applicable subheading + 25%"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.01
    versions:
      - effective_from: '2026-07-22'
        formula: |-
          if heading_applies: applicable_subheading_general_duty_rate + brazil_section_301_additional_duty_rate else: applicable_subheading_general_duty_rate

  - name: special_duty_rate_after_brazil_section_301_overlay
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.05.01 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.05.01
              excerpt: "The duty provided in the applicable subheading + 25%"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.05.01
    versions:
      - effective_from: '2026-07-22'
        formula: |-
          if heading_applies: applicable_subheading_special_duty_rate + brazil_section_301_additional_duty_rate else: applicable_subheading_special_duty_rate
