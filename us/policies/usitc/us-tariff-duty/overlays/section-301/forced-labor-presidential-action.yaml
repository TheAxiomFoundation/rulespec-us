format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
  summary: |-
    Section 1 directs section 301 tariffs of 10 percent on goods of listed economies; tariffs net of MFN to a 10 percent total for products of the European Union or Taiwan and to a 12.5 percent total for products of Japan Korea or Switzerland; and 12.5 percent for goods of all other investigated economies. Products identified in the Annex are exempt. Section 2 directs 3-year TRQs for Bangladesh Cambodia Indonesia and Malaysia allowing covered textiles and apparel to enter free of the section 301 tariffs.
rules:
  - name: forced_labor_section_301_ten_percent_rate
    kind: parameter
    dtype: Rate
    source: Memorandum of July 23 2026 section 1(a)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "10 percent tariff rate"
    versions:
      - effective_from: '2026-07-23'
        formula: |-
          0.10

  - name: forced_labor_section_301_twelve_and_one_half_percent_rate
    kind: parameter
    dtype: Rate
    source: Memorandum of July 23 2026 section 1(a)(iii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "12.5 percent tariff rate"
    versions:
      - effective_from: '2026-07-23'
        formula: |-
          0.125

  - name: forced_labor_section_301_zero_rate
    kind: parameter
    dtype: Rate
    source: Memorandum of July 23 2026 section 1(a)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "shall impose a section 301 tariff of zero"
    versions:
      - effective_from: '2026-07-23'
        formula: |-
          0

  - name: forced_labor_textile_trq_initial_duration_years
    kind: parameter
    dtype: Count
    source: Memorandum of July 23 2026 section 2(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "with an initial duration of 3 years"
    versions:
      - effective_from: '2026-07-23'
        formula: |-
          3

  - name: forced_labor_section_301_exclusion_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: Memorandum of July 23 2026 sections 1(b) and 2(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "exempt from the tariffs imposed as directed in subsection (a)"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "to enter the United States free of the section 301 tariffs"
    versions:
      - effective_from: '2026-07-23'
        formula: |-
          article_identified_in_annex_for_economy
          or article_covered_by_established_textile_or_apparel_trq_for_economy

  - name: forced_labor_section_301_tariff_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: Memorandum of July 23 2026 section 1(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "on all goods of the economy for which an act, policy, or practice was found actionable"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "Except as otherwise provided in this memorandum"
    versions:
      - effective_from: '2026-07-23'
        formula: |-
          (article_is_good_of_10_percent_economy
          or article_is_product_of_european_union_or_taiwan
          or article_is_product_of_japan_korea_or_switzerland
          or article_is_good_of_other_investigated_economy)
          and not forced_labor_section_301_exclusion_applies

  - name: forced_labor_section_301_additional_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: Memorandum of July 23 2026 section 1(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "so that the sum of the MFN tariff and the section 301 tariff shall be 10 percent"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/rulemaking/federal-register/2026-07-28/2026-15274
              excerpt: "so that the sum of the MFN tariff and the tariff imposed pursuant to these investigations shall be 12.5 percent"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-presidential-action#forced_labor_section_301_tariff_applies
              output: forced_labor_section_301_tariff_applies
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-presidential-action#forced_labor_section_301_ten_percent_rate
              output: forced_labor_section_301_ten_percent_rate
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-presidential-action#forced_labor_section_301_twelve_and_one_half_percent_rate
              output: forced_labor_section_301_twelve_and_one_half_percent_rate
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-301/forced-labor-presidential-action#forced_labor_section_301_zero_rate
              output: forced_labor_section_301_zero_rate
              hash: sha256:local
    versions:
      - effective_from: '2026-07-23'
        formula: |-
          if forced_labor_section_301_tariff_applies: if article_is_good_of_10_percent_economy: forced_labor_section_301_ten_percent_rate else: if article_is_product_of_european_union_or_taiwan: if applicable_mfn_tariff_rate < forced_labor_section_301_ten_percent_rate: forced_labor_section_301_ten_percent_rate - applicable_mfn_tariff_rate else: forced_labor_section_301_zero_rate else: if article_is_product_of_japan_korea_or_switzerland: if applicable_mfn_tariff_rate < forced_labor_section_301_twelve_and_one_half_percent_rate: forced_labor_section_301_twelve_and_one_half_percent_rate - applicable_mfn_tariff_rate else: forced_labor_section_301_zero_rate else: if article_is_good_of_other_investigated_economy: forced_labor_section_301_twelve_and_one_half_percent_rate else: forced_labor_section_301_zero_rate else: forced_labor_section_301_zero_rate
