      source_values:
        - us:policies/usitc/us-tariff-duty/overlays/china-301/2024-action-9903-91-01#china_301_action_additional_ad_valorem_rate
    - output: us:policies/usitc/us-tariff-duty/overlays/china-301/2024-action-9903-91-01#duty_rate_for_articles_under_heading_9903_91_01
