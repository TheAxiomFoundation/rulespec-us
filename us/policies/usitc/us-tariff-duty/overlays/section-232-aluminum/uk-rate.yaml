  source_verification:
    corpus_citation_path: us/statute/hts/9903.85.12
  summary: |-
    Products of aluminum of the United Kingdom provided for in subdivision (o) of note 19, except as provided in headings 9903.85.67 or 9903.85.69, are subject to the duty provided in the applicable subheading + 25%.
