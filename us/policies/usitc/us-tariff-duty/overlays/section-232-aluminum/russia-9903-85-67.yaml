format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.85.67
  summary: |-
    Aluminum articles that are the product of Russia, use any primary aluminum smelted in Russia, or are cast in Russia, under note 19(a)(vii)(A) and note 19(b), except Commerce exclusions: duty provided in the applicable subheading + 200%.
rules:
  - name: russia_aluminum_additional_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.85.67, Rates of duty
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 200%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          2.00

  - name: section_232_aluminum_russia_duty_applies
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Day
    source: HTS 9903.85.67, article scope and Commerce exclusion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "except any exclusions that may be determined and announced by the Department of Commerce"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          (aluminum_article_is_product_of_russia
          or any_primary_aluminum_used_in_manufacture_smelted_in_russia
          or aluminum_article_cast_in_russia)
          and aluminum_article_under_note_19_a_vii_A
          and aluminum_article_provided_for_in_headings_or_subheadings_enumerated_in_note_19_b
          and not department_of_commerce_exclusion_determined_and_announced_for_aluminum_article

  - name: section_232_aluminum_russia_additional_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.85.67, Rates of duty
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "The duty provided in the applicable subheading + 200%"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-232-aluminum/russia-9903-85-67#russia_aluminum_additional_duty_rate
              output: russia_aluminum_additional_duty_rate
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-232-aluminum/russia-9903-85-67#section_232_aluminum_russia_duty_applies
              output: section_232_aluminum_russia_duty_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if section_232_aluminum_russia_duty_applies: russia_aluminum_additional_duty_rate else: 0

  - name: section_232_aluminum_russia_total_duty_rate
    kind: derived
    entity: Asset
    dtype: Rate
    period: Day
    source: HTS 9903.85.67, Rates of duty
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "The duty provided in the applicable subheading + 200%"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-232-aluminum/russia-9903-85-67#russia_aluminum_additional_duty_rate
              output: russia_aluminum_additional_duty_rate
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-232-aluminum/russia-9903-85-67#section_232_aluminum_russia_duty_applies
              output: section_232_aluminum_russia_duty_applies
              hash: sha256:local
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if section_232_aluminum_russia_duty_applies: applicable_subheading_duty_rate + russia_aluminum_additional_duty_rate else: applicable_subheading_duty_rate
