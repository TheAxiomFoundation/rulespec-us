format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/9903.85.67
  summary: |-
    Aluminum articles that are the product of Russia, use any primary aluminum smelted in Russia, or are cast in Russia, except Commerce-announced exclusions; rates of duty are the applicable subheading duty + 200%.
rules:
  - name: section_232_aluminum_russia_statutory_additional_duty_rate
    kind: parameter
    dtype: Rate
    source: HTS 9903.85.67, rates of duty
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "Rates of duty (1-General): The duty provided in the applicable subheading + 200%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          2.00

  - name: section_232_aluminum_russia_additional_duty_applies
    kind: derived
    entity: AluminumArticle
    dtype: Judgment
    period: Day
    source: HTS 9903.85.67, article scope and Commerce exclusion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "Aluminum articles that are the product of Russia"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "any amount of primary aluminum used in the manufacture of the aluminum articles is smelted in Russia"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "the aluminum articles are cast in Russia"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "except any exclusions that may be determined and announced by the Department of Commerce"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          (
            aluminum_article_is_product_of_russia_under_applicable_note_19_terms
            or any_primary_aluminum_used_in_aluminum_article_was_smelted_in_russia_under_applicable_note_19_terms
            or aluminum_article_was_cast_in_russia_under_applicable_note_19_terms
          )
          and not department_of_commerce_exclusion_applies_to_aluminum_article

  - name: section_232_aluminum_russia_additional_duty_rate
    kind: derived
    entity: AluminumArticle
    dtype: Rate
    period: Day
    source: HTS 9903.85.67, rates of duty applied to covered aluminum articles
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/9903.85.67
              excerpt: "The duty provided in the applicable subheading + 200%"
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-232-aluminum/russia-9903-85-67#section_232_aluminum_russia_additional_duty_applies
              output: section_232_aluminum_russia_additional_duty_applies
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us:policies/usitc/us-tariff-duty/overlays/section-232-aluminum/russia-9903-85-67#section_232_aluminum_russia_statutory_additional_duty_rate
              output: section_232_aluminum_russia_statutory_additional_duty_rate
              hash: sha256:local
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if section_232_aluminum_russia_additional_duty_applies: section_232_aluminum_russia_statutory_additional_duty_rate else: 0
