format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/1301.20.00.00
      - us/statute/hts/1301.90.40.00
      - us/statute/hts/1301.90.91
      - us/statute/hts/1302.11.00.00
      - us/statute/hts/1302.12.00.00
      - us/statute/hts/1302.13.00.00
