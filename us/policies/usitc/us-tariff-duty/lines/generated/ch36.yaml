format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/3601.00.00.00
      - us/statute/hts/3602.00.00
      - us/statute/hts/3603.10.00.00
      - us/statute/hts/3603.20.00.00
