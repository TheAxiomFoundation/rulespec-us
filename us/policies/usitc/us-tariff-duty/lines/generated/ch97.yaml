format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/9701.21.00.00
      - us/statute/hts/9701.22.00.00
      - us/statute/hts/9701.29.00.00
