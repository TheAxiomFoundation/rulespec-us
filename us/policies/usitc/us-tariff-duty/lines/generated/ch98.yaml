              corpus_citation_path: us/statute/hts/9801.00.70.00
              excerpt: "Rates of duty (1-General): A duty equal to the duty upon the importation of like articles not previously exported, but in no case in excess of the sum of (a) any customs drawback proved to have been allowed upon such exportation, and (b) the duty which would have been payable on any articles used in the manufacture or production of such aircraft had they not been entered and exported under heading 9813.00.05"
          - path: versions[0].values
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9801.00.80
              excerpt: "Rates of duty (1-General): A duty (in lieu of any other duty or tax) equal to the sum of any duty and internal- revenue tax imposed upon the importation of like articles not previously exported, but in no case in excess of the sum of (a) any customs drawback proved to have been allowed upon such exportation of the article, and (b) any internal- revenue tax imposed, at the time such article is entered, upon the importation of like articles not previously exported"
          - path: versions[0].values
