format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/5001.00.00.00
      - us/statute/hts/5002.00.00.00
      - us/statute/hts/5003.00.10.00
      - us/statute/hts/5003.00.90.00
      - us/statute/hts/5004.00.00.00
      - us/statute/hts/5005.00.00
      - us/statute/hts/5006.00.10.00
