format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/6701.00.30.00
      - us/statute/hts/6701.00.60.00
      - us/statute/hts/6702.10.20.00
      - us/statute/hts/6702.10.40.00
      - us/statute/hts/6702.90.10.00
