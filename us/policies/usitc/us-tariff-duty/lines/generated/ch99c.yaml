              excerpt: "Notwithstanding heading 9903.91.14, effective with respect to entries, on or after November 10, 2026, of ship-to-shore gantry cranes, configured as a high- or low-profile steel superstructure and designed to unload intermodal containers from vessels with coupling devices for containers, including spreaders or twist-locks (provided for in subheading 8426.19.00), attested by the importer that the ship-to-shore gantry cranes: (1) are not products of China; (2) are not manufactured, assembled, or made using components, assemblies or subassemblies that are products of China, as specified in subdivision (l)(ii) of note 31 to this subchapter; and (3) are not manufactured by a company or other entity that is owned or controlled by a Chinese person or legal entity, as specified by subdivision (l)(v) of note 31 to this subchapter."
          - path: versions[0].values
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/9903.91.16
              excerpt: "Notwithstanding heading 9903.91.14, effective with respect to entries, on or after November 10, 2026, of ship-to-shore gantry cranes, configured as a high- or low-profile steel superstructure and designed to unload intermodal containers from vessels with coupling devices for containers, including spreaders or twist-locks (provided for in subheading 8426.19.00), that: (1) are products of China; (2) that are manufactured, assembled or made using components, assemblies or subassemblies that are products of China; or (3) that are manufactured by a company or other entity that is owned or controlled by a Chinese person or legal entity, as specified by subdivision (l) of U.S. note 31 to this subchapter, that are attested by the importer as fulfilling in whole or in part an executed contract for sale dated prior to April 17, 2025 for goods that are entered for consumption, or withdrawn from warehouse for consumption, in the United States prior to April 18, 2027."
