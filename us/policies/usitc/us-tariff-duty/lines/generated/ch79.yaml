format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/7901.11.00.00
      - us/statute/hts/7901.12.10.00
      - us/statute/hts/7901.12.50.00
      - us/statute/hts/7901.20.00.00
      - us/statute/hts/7902.00.00.00
      - us/statute/hts/7903.10.00.00
