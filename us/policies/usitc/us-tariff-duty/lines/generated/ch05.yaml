format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/0501.00.00.00
      - us/statute/hts/0502.10.00.00
      - us/statute/hts/0502.90.00.00
