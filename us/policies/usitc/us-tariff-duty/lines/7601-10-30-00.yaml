format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/7601.10.30.00
  summary: |-
    Of uniform cross section throughout its length, the least cross-sectional dimension of which is not greater than 9.5 mm, in coils; Unit of quantity: kg; Rates of duty: 1-General 2.6%, 1-Special Free, 2 18.5%; Footnotes: See 9903.90.09 and 9903.91.01.
rules:
  - name: least_cross_sectional_dimension_upper_bound_mm
    kind: parameter
    dtype: Decimal
    source: HTS 7601.10.30.00 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "least cross-sectional dimension of which is not greater than 9.5 mm"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          9.5

  - name: unwrought_aluminum_coil_general_rate_of_duty
    kind: parameter
    dtype: Rate
    source: HTS 7601.10.30.00 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "Rates of duty (1-General): 2.6%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.026

  - name: unwrought_aluminum_coil_special_rate_of_duty
    kind: parameter
    dtype: Rate
    source: HTS 7601.10.30.00 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "Rates of duty (1-Special): Free"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0

  - name: unwrought_aluminum_coil_column_2_rate_of_duty
    kind: parameter
    dtype: Rate
    source: HTS 7601.10.30.00 Rates of duty (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "Rates of duty (2): 18.5%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.185

  - name: unwrought_aluminum_coil_line_applies
    kind: derived
    entity: ImportLine
    dtype: Judgment
    period: Day
    source: HTS 7601.10.30.00 article description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "Of uniform cross section throughout its length"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "least cross-sectional dimension of which is not greater than 9.5 mm"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "in coils"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          import_line_has_uniform_cross_section_throughout_length
          and least_cross_sectional_dimension_mm <= least_cross_sectional_dimension_upper_bound_mm
          and import_line_in_coils

  - name: unwrought_aluminum_coil_applicable_rate_of_duty
    kind: derived
    entity: ImportLine
    dtype: Rate
    period: Day
    source: HTS 7601.10.30.00 Rates of duty
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "Rates of duty (1-General): 2.6%; Rates of duty (1-Special): Free; Rates of duty (2): 18.5%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if column_2_rate_applies: unwrought_aluminum_coil_column_2_rate_of_duty else: if special_rate_applies: unwrought_aluminum_coil_special_rate_of_duty else: unwrought_aluminum_coil_general_rate_of_duty

  - name: other_rate_9903_90_09_footnote_applies
    kind: derived
    entity: ImportLine
    dtype: Judgment
    period: Day
    source: HTS 7601.10.30.00 Footnote [other]
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "Footnote [other]: See 9903.90.09."
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          unwrought_aluminum_coil_line_applies

  - name: general_rate_9903_91_01_footnote_applies
    kind: derived
    entity: ImportLine
    dtype: Judgment
    period: Day
    source: HTS 7601.10.30.00 Footnote [general]
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/7601.10.30.00
              excerpt: "Footnote [general]: See 9903.91.01."
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          unwrought_aluminum_coil_line_applies
