format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us/statute/hts/7202.11.10.00
  summary: |-
    Containing by weight more than 2 percent but not more than 4 percent of carbon; Unit of quantity: kg, Mn kg; Rates of duty: 1-General 1.4%, 1-Special Free, 2 6.5%; Footnote [general]: See 9903.88.03.
rules:
  - name: carbon_weight_fraction_lower_bound
    kind: parameter
    dtype: Rate
    source: HTS 7202.11.10.00 carbon content description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "more than 2 percent"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.02

  - name: carbon_weight_fraction_upper_bound
    kind: parameter
    dtype: Rate
    source: HTS 7202.11.10.00 carbon content description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "not more than 4 percent"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.04

  - name: general_rate_of_duty
    kind: parameter
    dtype: Rate
    source: HTS 7202.11.10.00 Rates of duty (1-General)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "Rates of duty (1-General): 1.4%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.014

  - name: special_rate_of_duty
    kind: parameter
    dtype: Rate
    source: HTS 7202.11.10.00 Rates of duty (1-Special)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "Rates of duty (1-Special): Free"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0

  - name: column_2_rate_of_duty
    kind: parameter
    dtype: Rate
    source: HTS 7202.11.10.00 Rates of duty (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "Rates of duty (2): 6.5%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          0.065

  - name: line_applies
    kind: derived
    entity: ImportLine
    dtype: Judgment
    period: Day
    source: HTS 7202.11.10.00 carbon content description
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "Containing by weight more than 2 percent but not more than 4 percent of carbon"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          carbon_weight_fraction > carbon_weight_fraction_lower_bound
          and carbon_weight_fraction <= carbon_weight_fraction_upper_bound

  - name: applicable_rate_of_duty
    kind: derived
    entity: ImportLine
    dtype: Rate
    period: Day
    source: HTS 7202.11.10.00 Rates of duty
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "Rates of duty (1-General): 1.4%; Rates of duty (1-Special): Free; Rates of duty (2): 6.5%"
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          if column_2_rate_applies: column_2_rate_of_duty else: if special_rate_applies: special_rate_of_duty else: general_rate_of_duty

  - name: general_rate_9903_88_03_footnote_applies
    kind: derived
    entity: ImportLine
    dtype: Judgment
    period: Day
    source: HTS 7202.11.10.00 Footnote [general]
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us/statute/hts/7202.11.10.00
              excerpt: "Footnote [general]: See 9903.88.03."
    versions:
      - effective_from: '2026-02-15'
        formula: |-
          line_applies
