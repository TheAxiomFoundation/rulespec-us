format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us/statute/hts/chapter-99/page-511
      - us/statute/hts/chapter-99/page-512
      - us/statute/hts/chapter-99/page-513
  summary: |-
    Generated by b1.6-incidence-3 deterministically from the corpus-pinned USITC Rev-15 chapter-99 notes; hand edits prohibited. U.S. note 31(b) and 31(c) enumerate the article coverage of headings 9903.91.01 and 9903.91.02, which apply to products of China classified in the enumerated subheadings, effective with respect to goods entered for consumption, or withdrawn from warehouse for consumption, on or after 12:01 a.m. eastern daylight time on September 27, 2024. Each list is gated against the census printed with it: subdivision (b) against its compiler's-note numbering range, subdivision (c) against its printed ordinal enumeration. Each table leads with its printed chapeau as an evidence_role atom; only the (b) census is additionally quoted as an evidence_role atom, because (c)'s census is the printed ordinals on its own enumerated codes and is enforced at generation time rather than restated in the proof. These tables are code incidence only - the products-of-China origin condition remains an entry-preparation fact. effective_from is the Rev-15 codification date rather than the 2024 statutory effective date, because a single pinned Rev-15 snapshot cannot attest a historical vintage. Note 31(a)'s chapter 98 and 9802 partial-value treatment and note 31(d) through 31(l) are outside this slice.
