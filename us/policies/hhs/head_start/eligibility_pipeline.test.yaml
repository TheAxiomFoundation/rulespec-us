    us:regulations/45-cfr/1302/12#input.poverty_line_amount: 10000
    us:regulations/45-cfr/1302/12#input.program_additional_allowance_participant_share_after_enrollment: 1.01
    ? us:regulations/45-cfr/1302/12#input.program_establishes_and_implements_required_outreach_and_enrollment_policies_before_serving_non_paragraph_c_participants
    : true
    ? us:regulations/45-cfr/1302/12#input.program_establishes_criteria_serving_paragraph_c_eligible_pregnant_women_and_children_first
    : true
  output:
    us:policies/hhs/head_start/eligibility_pipeline#head_start_runtime_inputs_valid: not_holds
    us:policies/hhs/head_start/eligibility_pipeline#head_start_additional_allowance_path_satisfied: not_holds
    us:policies/hhs/head_start/eligibility_pipeline#head_start_eligible: not_holds

- name: negative_child_age_fails_closed
  # -1 < 0 violates the child-age domain, even though -1 < 3 makes the raw
  # infant/toddler age formula hold.
  period:
    period_kind: custom
    name: calendar_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    <<: *ordinary_income_child_age_context
    us:regulations/45-cfr/1302/12/b#input.child_transitioning_to_head_start_preschool: false
    us:regulations/45-cfr/1302/12/b#input.child_is_infant_or_toddler: true
    us:regulations/45-cfr/1302/12/b#input.child_age_years: -1
    us:regulations/45-cfr/1302/12/b#input.child_turns_threshold_age_by_public_school_eligibility_date: false
    us:regulations/45-cfr/1302/12/b#input.child_no_older_than_age_required_to_attend_school: false
    us:regulations/45-cfr/1302/12/b#input.child_younger_than_compulsory_school_age_by_public_school_eligibility_date: true
  output:
    us:regulations/45-cfr/1302/12/b#early_head_start_age_requirement: holds
    us:policies/hhs/head_start/eligibility_pipeline#head_start_runtime_inputs_valid: not_holds
    us:policies/hhs/head_start/eligibility_pipeline#head_start_ordinary_or_tribal_age_requirement_met: not_holds
    us:policies/hhs/head_start/eligibility_pipeline#head_start_paragraph_c_path_satisfied: not_holds
    us:policies/hhs/head_start/eligibility_pipeline#early_head_start_eligible: not_holds
