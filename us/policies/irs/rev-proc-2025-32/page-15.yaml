            (2) $3,953,600
  versions:
  - effective_from: '2026-01-01'
    effective_to: '2026-12-31'
    formula: "max(\n    housing_credit_ceiling_population_amount * state_population,\n\
      \    housing_credit_ceiling_minimum_amount\n)"
