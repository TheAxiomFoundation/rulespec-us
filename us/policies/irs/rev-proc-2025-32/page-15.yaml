      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
          excerpt: earned income tax credit is not allowed under § 32(i) if the aggregate
            amount of certain investment income exceeds $12,200
