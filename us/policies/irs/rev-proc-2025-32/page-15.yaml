  source_verification:
    corpus_citation_path: us/guidance/irs/rev-proc-2025-32/page-15
    source_sha256: b48dc019bca26a248de96d991ee68655d0aae255a8929c0953447a6ce29affec
  summary: 'For taxable years beginning in 2026, the earned income credit table specifies

    earned-income amounts, maximum credits, phaseout thresholds, and completed

    phaseout amounts by number of qualifying children; the credit is not allowed

    if certain investment income exceeds $12,200. For calendar year 2026, the

    rehabilitation qualified-basis amount is $8,700 per low-income unit, and the

    State housing credit ceiling is the greater of $3.416 times State population

    or $3,953,600.'
