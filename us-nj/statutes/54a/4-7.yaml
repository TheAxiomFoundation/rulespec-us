format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-nj/statute/54a:4-7
    source_sha256: 16853e45d63af82bf4307a8f6066cdb09a19d57afc78debc1be843e2210830c7
  summary: A resident individual eligible for the federal earned income tax credit
    is allowed a New Jersey credit equal to the applicable percentage of the federal
    credit. A part-year resident's credit is prorated by qualifying residency months
    over 12, and 15 days or more constitutes a month. Excess credit is an overpayment,
    and the credit and overpayment are treated as gross income tax credit or overpayment.
rules:
- name: nj_earned_income_tax_credit_percentage
  kind: parameter
  dtype: Rate
  period: Year
  source: N.J.S.54A:4-7(a)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 10% for the taxable year beginning on or after January 1, 2000,
            but before January 1, 2001
      - path: versions[1].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 15% for the taxable year beginning on or after January 1, 2001,
            but before January 1, 2002
      - path: versions[2].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 17.5% for the taxable year beginning on or after January 1, 2002,
            but before January 1, 2003
      - path: versions[3].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 20% for taxable years beginning on or after January 1, 2003, but
            before January 1, 2008
      - path: versions[4].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 22.5% for taxable years beginning on or after January 1, 2008 but
            before January 1, 2009
      - path: versions[5].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 25% for taxable years beginning on or after January 1, 2009 but
            before January 1, 2010
      - path: versions[6].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 20% for taxable years beginning on or after January 1, 2010, but
            before January 1, 2015
      - path: versions[7].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 30% for taxable years beginning on or after January 1, 2015, but
            before January 1, 2016
      - path: versions[8].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 35% for taxable years beginning on or after January 1, 2016, but
            before January 1, 2018
      - path: versions[9].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 37% for the taxable year beginning on or after January 1, 2018,
            but before January 1, 2019
      - path: versions[10].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 39% for the taxable year beginning on or after January 1, 2019,
            but before January 1, 2020
      - path: versions[11].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 40% for taxable years beginning on or after January 1, 2020
  versions:
  - effective_from: '2000-01-01'
    formula: '0.10'
  - effective_from: '2001-01-01'
    formula: '0.15'
  - effective_from: '2002-01-01'
    formula: '0.175'
  - effective_from: '2003-01-01'
    formula: '0.20'
  - effective_from: '2008-01-01'
    formula: '0.225'
  - effective_from: '2009-01-01'
    formula: '0.25'
  - effective_from: '2010-01-01'
    formula: '0.20'
  - effective_from: '2015-01-01'
    formula: '0.30'
  - effective_from: '2016-01-01'
    formula: '0.35'
  - effective_from: '2018-01-01'
    formula: '0.37'
  - effective_from: '2019-01-01'
    formula: '0.39'
  - effective_from: '2020-01-01'
    formula: '0.40'
- name: minimum_age_for_age_modified_credit
  kind: parameter
  dtype: Integer
  period: Year
  source: N.J.S.54A:4-7(a)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: at least 18 years of age or older
  versions:
  - effective_from: '2020-01-01'
    formula: '18'
- name: age_modified_credit_path_indicator
  kind: parameter
  dtype: Integer
  period: Year
  source: N.J.S.54A:4-7(a)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: for each taxable year beginning on and after January 1, 2020
      - path: versions[1].formula
        kind: effective_period
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: for each taxable year beginning on and after January 1, 2020
  versions:
  - effective_from: '2000-01-01'
    formula: '0'
  - effective_from: '2020-01-01'
    formula: '1'
- name: resident_days_required_for_residency_month
  kind: parameter
  dtype: Count
  period: Year
  source: N.J.S.54A:4-7(b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: 15 days or more shall constitute a month
  versions:
  - effective_from: '2000-01-01'
    formula: '15'
- name: residency_proration_denominator_months
  kind: parameter
  dtype: Count
  period: Year
  source: N.J.S.54A:4-7(b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: the total number of months of the claimant's residency in the taxable
            year bears to 12
  versions:
  - effective_from: '2000-01-01'
    formula: '12'
- name: regular_nj_earned_income_tax_credit_eligible
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: N.J.S.54A:4-7(a)(1), (a)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: A resident individual who is eligible for a credit under section
            32
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: the claimant shall file a joint return or claim for the credit
  versions:
  - effective_from: '2000-01-01'
    formula: 'claimant_is_resident_individual

      and eligible_for_federal_earned_income_tax_credit_under_section_32

      and married_claimant_joint_return_requirement_satisfied'
- name: age_modified_nj_earned_income_tax_credit_eligible
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: N.J.S.54A:4-7(a)(3), (a)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: A resident individual who is at least 18 years of age or older,
            but cannot claim a qualifying child
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: ineligible to claim the federal earned income tax credit due to
            age requirements
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: shall meet all qualifications, except for the minimum or maximum
            age
  versions:
  - effective_from: '2020-01-01'
    formula: 'claimant_is_resident_individual

      and married_claimant_joint_return_requirement_satisfied

      and resident_individual_age >= minimum_age_for_age_modified_credit

      and not resident_individual_can_claim_qualifying_child_for_federal_eitc

      and resident_individual_is_ineligible_for_federal_eitc_due_to_age_requirements

      and resident_individual_meets_all_federal_eitc_qualifications_except_age'
- name: claimant_residency_months_in_taxable_year
  kind: derived
  entity: Person
  dtype: Count
  period: Year
  source: N.J.S.54A:4-7(b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: For this purpose, 15 days or more shall constitute a month.
  versions:
  - effective_from: '2000-01-01'
    formula: '(if residency_days_in_january >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_february >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_march >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_april >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_may >= resident_days_required_for_residency_month: 1
      else: 0)

      + (if residency_days_in_june >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_july >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_august >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_september >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_october >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_november >= resident_days_required_for_residency_month:
      1 else: 0)

      + (if residency_days_in_december >= resident_days_required_for_residency_month:
      1 else: 0)'
- name: nj_earned_income_tax_credit_before_proration
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: N.J.S.54A:4-7(a)(1), (a)(2), (a)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: '(2) For the purposes of the calculation of the New Jersey earned
            income tax credit, the percentage of the federal earned income tax credit
            referred to in paragraph (1) of this subsection shall be: (a) 10% for
            the taxable year beginning on or after January 1, 2000, but before January
            1, 2001;'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: Calculation of the New Jersey earned income tax credit available
            to individuals pursuant to this paragraph shall be predicated on the federal
            maximum amount for taxpayers with no qualifying child
  versions:
  - effective_from: '2000-01-01'
    formula: "if regular_nj_earned_income_tax_credit_eligible:\n  nj_earned_income_tax_credit_percentage\
      \ * max(0, federal_earned_income_tax_credit_that_would_be_allowed)\nelse:\n\
      \  if age_modified_credit_path_indicator == 1 and age_modified_nj_earned_income_tax_credit_eligible:\n\
      \    nj_earned_income_tax_credit_percentage * max(0, federal_maximum_eitc_for_taxpayers_with_no_qualifying_child)\n\
      \  else:\n    0"
- name: nj_earned_income_tax_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: N.J.S.54A:4-7(b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: the amount of the credit allowed pursuant to this section shall
            be pro-rated, based upon that proportion which the total number of months
            of the claimant's residency in the taxable year bears to 12
  versions:
  - effective_from: '2000-01-01'
    formula: 'if claimant_is_part_year_resident: max(0, nj_earned_income_tax_credit_before_proration)
      * claimant_residency_months_in_taxable_year / residency_proration_denominator_months
      else: max(0, nj_earned_income_tax_credit_before_proration)'
- name: nj_earned_income_tax_credit_against_tax_due
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: N.J.S.54A:4-7(c)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: The amount of the credit allowed pursuant to this section shall
            be applied against the tax otherwise due
  versions:
  - effective_from: '2000-01-01'
    formula: "min(\n  max(0, nj_earned_income_tax_credit),\n  max(0, tax_otherwise_due_after_all_other_credits_and_payments)\n\
      )"
- name: nj_earned_income_tax_credit_overpayment
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: N.J.S.54A:4-7(c)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: If the credit exceeds the amount of tax otherwise due, that amount
            of excess shall be an overpayment
  versions:
  - effective_from: '2000-01-01'
    formula: "max(\n  0,\n  max(0, nj_earned_income_tax_credit)\n  - max(0, tax_otherwise_due_after_all_other_credits_and_payments)\n\
      )"
- name: subsection_f_of_overpayment_statute_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: N.J.S.54A:4-7(c)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: subsection (f) of N.J.S.54A:9-7 shall not apply
  versions:
  - effective_from: '2000-01-01'
    formula: 'false'
- name: credit_treated_as_gross_income_tax_credit_or_overpayment
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: N.J.S.54A:4-7(c)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: shall be treated as a credit towards or overpayment of gross income
            tax
  versions:
  - effective_from: '2000-01-01'
    formula: 'true'
- name: nj_earned_income_tax_credit_disregarded_for_benefit_income
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: N.J.S.54A:4-7(e)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-nj/statute/54a:4-7
          excerpt: shall not be taken into account as income or receipts
  versions:
  - effective_from: '2000-01-01'
    formula: 'true'
