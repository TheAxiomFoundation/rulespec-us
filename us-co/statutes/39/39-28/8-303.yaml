format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-303
  summary: |-
    Every retail marijuana cultivation facility shall keep complete and accurate electronic records and itemized invoices; retail marijuana stores shall keep records showing received marijuana was purchased from a cultivation facility and provide copies to the department when requested.
rules:
  - name: retail_marijuana_cultivation_facility_recordkeeping_complies
    kind: derived
    entity: Business
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.8-303(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-303
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          keeps_complete_accurate_electronic_records_at_each_licensed_place
          and keeps_itemized_invoices_for_all_retail_marijuana_handled
          and records_unprocessed_marijuana_recipient_names_and_addresses
          and records_unprocessed_marijuana_inventory_and_pertinent_documents

  - name: controlled_store_unprocessed_marijuana_invoice_recordkeeping_complies
    kind: derived
    entity: Business
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.8-303(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-303
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          keeps_itemized_invoices_for_all_unprocessed_marijuana_transferred_to_controlled_retail_stores

  - name: retail_marijuana_store_recordkeeping_complies
    kind: derived
    entity: Business
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.8-303(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-303
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          keeps_complete_accurate_records_at_store_showing_all_received_marijuana_was_purchased_from_cultivation_facility
          and (not department_requested_store_records or provided_requested_store_records_to_department)
