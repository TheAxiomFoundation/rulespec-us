format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-307
  summary: |-
    Revenues generated by the voter-approved retail marijuana excise tax may be collected and spent as voter-approved revenue changes and shall not require subsequent voter approval.
rules:
  - name: retail_marijuana_excise_tax_revenue_is_voter_approved_revenue
    kind: derived
    entity: RetailMarijuanaExciseTaxRevenue
    dtype: Judgment
    period: Year
    source: Colo. Rev. Stat. § 39-28.8-307
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-307
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          revenue_is_generated_by_retail_marijuana_excise_tax
          and retail_marijuana_excise_tax_is_imposed_pursuant_to_part_3
          and retail_marijuana_excise_tax_was_approved_at_required_statewide_election
  - name: subsequent_voter_approval_is_not_required
    kind: derived
    entity: RetailMarijuanaExciseTaxRevenue
    dtype: Judgment
    period: Year
    source: Colo. Rev. Stat. § 39-28.8-307
