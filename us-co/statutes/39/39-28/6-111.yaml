format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.6-111
  summary: |-
    “Beginning January 1, 2021, it is unlawful for any distributor to sell and distribute any nicotine products in this state without a license.” A missing return when no tax is due incurs “a penalty in the amount of twenty-five dollars”; late payment incurs “ten percent of the tax plus one-half of one percent per month.”
  deferred_outputs:
    - output: us-co:statutes/39/39-28/6-111#delinquent_tax_interest
      reason: The interest rate is computed under section 39-21-110.5, whose executable RuleSpec output is not available in copied context.
rules:
  - name: missing_return_when_no_nicotine_product_tax_due_penalty_amount
    kind: parameter
    dtype: Money
    unit: USD
    source: C.R.S. § 39-28.6-111(2)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "a penalty in the amount of twenty-five dollars"
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          25

  - name: late_nicotine_product_tax_payment_initial_penalty_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. § 39-28.6-111(2)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "a penalty equal to ten percent of the tax"
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          0.10

  - name: late_nicotine_product_tax_payment_monthly_penalty_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. § 39-28.6-111(2)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "one-half of one percent per month"
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          0.005

  - name: unlicensed_nicotine_product_sale_is_unlawful
    kind: derived
    entity: Business
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.6-111(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "it is unlawful for any distributor to sell and distribute any nicotine products in this state without a license"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "Beginning January 1, 2021"
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          distributor_sells_and_distributes_nicotine_products_in_state
          and distributor_lacks_license_required_under_section_39_28_6_105

  - name: willful_false_nicotine_product_tax_return_is_unlawful
    kind: derived
    entity: Business
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.6-111(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "to willfully make any false or fraudulent return or false statement on any return"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "Beginning January 1, 2021"
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          distributor_willfully_makes_false_or_fraudulent_return_or_statement

  - name: willful_nicotine_product_tax_evasion_is_unlawful
    kind: derived
    entity: Business
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.6-111(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "to willfully evade the payment of the tax, or any part thereof"
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "Beginning January 1, 2021"
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          distributor_willfully_evades_nicotine_product_tax_payment

  - name: missing_return_when_no_nicotine_product_tax_due_penalty
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    source: C.R.S. § 39-28.6-111(2)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "If a person neglects or refuses to make a return as required by this article 28.6 and no amount of tax is due"
          - path: versions[0].formula
            kind: import
            import:
              target: us-co:statutes/39/39-28/6-111#missing_return_when_no_nicotine_product_tax_due_penalty_amount
              output: missing_return_when_no_nicotine_product_tax_due_penalty_amount
              hash: sha256:local
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          if person_neglects_or_refuses_to_make_required_nicotine_product_tax_return and no_nicotine_product_tax_is_due: missing_return_when_no_nicotine_product_tax_due_penalty_amount else: 0

  - name: late_nicotine_product_tax_payment_penalty
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: USD
    source: C.R.S. § 39-28.6-111(2)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "If a person fails to pay the tax in the time allowed"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-111
              excerpt: "ten percent of the tax plus one-half of one percent per month from the date when due"
          - path: versions[0].formula
            kind: import
            import:
              target: us-co:statutes/39/39-28/6-111#late_nicotine_product_tax_payment_initial_penalty_rate
              output: late_nicotine_product_tax_payment_initial_penalty_rate
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us-co:statutes/39/39-28/6-111#late_nicotine_product_tax_payment_monthly_penalty_rate
              output: late_nicotine_product_tax_payment_monthly_penalty_rate
              hash: sha256:local
    versions:
      - effective_from: '2021-01-01'
        formula: |-
          if nicotine_product_tax_payment_was_not_made_in_time_allowed: nicotine_product_tax_amount_due * (late_nicotine_product_tax_payment_initial_penalty_rate + (late_nicotine_product_tax_payment_monthly_penalty_rate * months_since_nicotine_product_tax_was_due)) else: 0
