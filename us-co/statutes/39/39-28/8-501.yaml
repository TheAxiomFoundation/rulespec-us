format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-501
  summary: |-
    “The marijuana tax cash fund is created in the state treasury.” Subject to the reserve limitation, the general assembly may appropriate money in the fund for specified purposes. On August 1, 2021, and each August 1 thereafter, the state treasurer shall transfer $13,000, $311,000, and $274,000 to specified funds. The fund reserve may not be less than fifteen percent of annual appropriations.
