format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.6-110
  summary: |-
    This article 28.6 does not prevent a statutory or home rule municipality, county, or city and county from imposing, levying, and collecting any special sales tax upon sales of cigarettes, tobacco products, or nicotine products, or upon the occupation or privilege of selling cigarettes, tobacco products, or nicotine products.
  deferred_outputs:
    - output: us-co:statutes/39/39-28/6-110#existing_local_special_sales_tax_authority_is_unaffected
      reason: Determining existing authority to impose a special sales tax in accordance with section 39-28-112 requires the missing cited RuleSpec source.
rules:
  - name: local_cigarette_tobacco_or_nicotine_special_sales_tax_is_not_prevented
    kind: derived
    entity: LocalGovernment
    dtype: Judgment
    period: Year
    source: Colo. Rev. Stat. § 39-28.6-110
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-110
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          (local_government_is_statutory_or_home_rule_municipality
          or local_government_is_county
          or local_government_is_city_and_county)
          and special_sales_tax_is_on_cigarettes_tobacco_products_or_nicotine_products
          and (special_sales_tax_is_on_sales
          or special_sales_tax_is_on_occupation_or_privilege_of_selling_products)
