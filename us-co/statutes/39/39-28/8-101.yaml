format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-101
  summary: |-
    “Retail marijuana does not include hemp, nor does it include fiber produced from the stalks, oil, cake made from the seeds of the plant, sterilized seed of the plant that is incapable of germination, or the weight of any other ingredient combined with marijuana to prepare topical or oral administrations, food, drink, or other product.”
rules:
  - name: excluded_from_retail_marijuana
    kind: derived
    entity: Asset
    dtype: Judgment
    source: 39-28.8-101(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-101
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          item_is_hemp
          or item_is_fiber_produced_from_cannabis_stalks
          or item_is_oil_produced_from_cannabis_stalks
          or item_is_cake_made_from_cannabis_seeds
          or item_is_sterilized_cannabis_seed_incapable_of_germination
          or item_is_weight_of_other_ingredient_combined_with_marijuana_to_prepare_topical_or_oral_administration_food_drink_or_other_product
