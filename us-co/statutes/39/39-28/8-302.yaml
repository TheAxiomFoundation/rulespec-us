format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-302
  summary: |-
    A tax is levied on the first sale or transfer of unprocessed retail marijuana by a retail marijuana cultivation facility. The fifteen percent rate is the maximum rate. A transfer exclusively for microbial control is not a first transfer, and tax is not levied on a transfer to a medical marijuana center.
  deferred_outputs:
    - output: us-co:statutes/39/39-28/8-302#retail_marijuana_excise_tax_amount
      reason: The applicable rate may be lowered or increased by a later enacted bill, and the historical September 2015 reduction depends on the unavailable constitutional rate specified in section 20(3)(c) of article X.
      source_values:
        - us-co:statutes/39/39-28/8-302#retail_marijuana_excise_tax_maximum_rate
        - us-co:statutes/39/39-28/8-302#fiscal_year_spending_reduction_threshold
        - us-co:statutes/39/39-28/8-302#retail_marijuana_tax_revenue_reduction_threshold
rules:
  - name: retail_marijuana_excise_tax_maximum_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. 39-28.8-302(1)(a)(I), (1)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "at a rate of fifteen percent"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          0.15

  - name: fiscal_year_spending_reduction_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: C.R.S. 39-28.8-302(1)(a)(II)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "fiscal year spending is greater than twelve billion eighty million dollars"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          12080000000

  - name: retail_marijuana_tax_revenue_reduction_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: C.R.S. 39-28.8-302(1)(a)(II)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "revenue from retail marijuana taxes is greater than sixty-seven million dollars"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          67000000

  - name: retail_marijuana_excise_tax_applies
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Day
    source: C.R.S. 39-28.8-302(1)(a)(I), (1)(c), (2)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "tax on the first sale or transfer of unprocessed retail marijuana by a retail marijuana cultivation facility"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "exclusively for microbial control is deemed to not be the first transfer"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "shall not be levied on the sale or transfer ... to a medical marijuana center"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          first_sale_or_transfer_of_unprocessed_retail_marijuana_by_retail_cultivation_facility
          and (transfer_to_retail_marijuana_product_manufacturing_facility
            or transfer_to_retail_marijuana_store
            or (retail_marijuana_harvested_for_retail_sale_or_extraction
              and transfer_between_unaffiliated_retail_marijuana_cultivation_facilities))
          and (transaction_is_between_affiliated_retail_marijuana_business_licensees
            or transaction_is_between_unaffiliated_retail_marijuana_business_licensees)
          and not transfer_of_unprocessed_retail_marijuana_exclusively_for_microbial_control
          and not transfer_of_unprocessed_marijuana_to_medical_marijuana_center

  - name: retail_marijuana_excise_tax_base
    kind: derived
    entity: Payment
    dtype: Money
    period: Day
    unit: USD
    source: C.R.S. 39-28.8-302(1)(a)(I)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "average market rate ... if the transaction is between affiliated retail marijuana business licensees"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-302
              excerpt: "contract price ... if the transaction is between unaffiliated retail marijuana business licensees"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if retail_marijuana_excise_tax_applies:
            if transaction_is_between_affiliated_retail_marijuana_business_licensees:
              average_market_rate_of_unprocessed_retail_marijuana
            else:
              contract_price_for_unprocessed_retail_marijuana
          else:
            0
