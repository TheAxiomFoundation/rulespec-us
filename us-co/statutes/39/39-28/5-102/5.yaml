format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-102.5
  summary: "\u201CThere is levied, in addition to the tax levied pursuant to section\
    \ 39-28.5-102, a tax ... at a rate of twenty percent of the manufacturer's list\
    \ price.\u201D"
rules:
- name: additional_tobacco_products_tax_rate
  kind: parameter
  dtype: Rate
  source: "Colo. Rev. Stat. \xA7 39-28.5-102.5"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-102.5
          excerpt: at a rate of twenty percent of the manufacturer's list price
  versions:
  - effective_from: '0001-01-01'
    formula: '0.20'
- name: additional_tobacco_products_tax
  kind: derived
  entity: Business
  dtype: Money
  period: Year
  unit: USD
  source: "Colo. Rev. Stat. \xA7 39-28.5-102.5"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-102.5
          excerpt: a tax on the sale, use, consumption, handling, or distribution
            of tobacco products by distributors and remote retail sellers
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-102.5
          excerpt: at a rate of twenty percent of the manufacturer's list price
  versions:
  - effective_from: '0001-01-01'
    formula: 'if (business_is_distributor or business_is_remote_retail_seller) and
      (tobacco_products_are_sold or tobacco_products_are_used or tobacco_products_are_consumed
      or tobacco_products_are_handled or tobacco_products_are_distributed): additional_tobacco_products_tax_rate
      * manufacturer_list_price_of_tobacco_products else: 0'
