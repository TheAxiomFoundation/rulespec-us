format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-108
  summary: |-
    “Fifteen percent to the general fund and eighty-five percent to the old age pension fund.” Money collected pursuant to section 39-28.5-102.5 is deposited in the tobacco tax cash fund.
rules:
  - name: general_fund_distribution_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. 39-28.5-108(1)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108
              excerpt: Fifteen percent to the general fund.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          0.15

  - name: old_age_pension_fund_distribution_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. 39-28.5-108(1)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108
              excerpt: eighty-five percent to the old age pension fund.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          0.85

  - name: general_fund_direct_distribution
    kind: derived
    entity: StateTreasurer
    dtype: Money
    unit: USD
    period: Year
    source: C.R.S. 39-28.5-108(1)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108
              excerpt: Fifteen percent to the general fund.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          general_fund_distribution_rate * money_subject_to_subsection_1_a_distribution

  - name: old_age_pension_fund_distribution
    kind: derived
    entity: StateTreasurer
    dtype: Money
    unit: USD
    period: Year
    source: C.R.S. 39-28.5-108(1)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108
              excerpt: eighty-five percent to the old age pension fund.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          old_age_pension_fund_distribution_rate * money_subject_to_subsection_1_a_distribution

  - name: old_age_pension_fund_net_revenue_transferred_to_general_fund
    kind: derived
    entity: StateTreasurer
    dtype: Money
    unit: USD
    period: Year
    source: C.R.S. 39-28.5-108(1)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108
              excerpt: The net revenue that is credited to the old age pension fund ... is transferred to the general fund.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          net_revenue_credited_to_old_age_pension_fund

  - name: tax_increase_revenue_transferred_to_2020_tax_holding_fund
    kind: derived
    entity: StateTreasurer
    dtype: Money
    unit: USD
    period: Year
    source: C.R.S. 39-28.5-108(1)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108
              excerpt: transfer an amount equal to the total revenue that is attributable to the tax increase set forth in section 39-28.5-102.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          total_revenue_attributable_to_voter_approved_tax_increase

  - name: tobacco_tax_cash_fund_deposit
    kind: derived
    entity: StateTreasurer
    dtype: Money
    unit: USD
    period: Year
    source: C.R.S. 39-28.5-108(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108
              excerpt: shall be transmitted to the state treasurer for deposit in the tobacco tax cash fund.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          money_collected_pursuant_to_section_39_28_5_102_5
