  summary: |-
    Revenues generated by the voter-approved retail marijuana sales tax may be collected and spent as voter-approved revenue changes and require no subsequent voter approval.
rules:
  - name: retail_marijuana_sales_tax_revenue_may_be_collected_and_spent_as_voter_approved_revenue
    kind: derived
    entity: Asset
    dtype: Judgment
    period: Year
    source: C.R.S. 39-28.8-204
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-204
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          revenue_is_generated_by_retail_marijuana_sales_tax_imposed_pursuant_to_part_2_and_approved_by_voters
