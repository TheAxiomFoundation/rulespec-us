format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-107
  summary: |-
    “Bad debt means the taxes attributable to any portion of a debt that is related to a sale of tobacco products subject to tax under this article 28.5,” subject to the stated qualification and exclusion conditions.
  deferred_outputs:
    - output: us-co:statutes/39/39-28/5-107/1#distributor_tobacco_products_tax_credit
      reason: The credit depends on department-prescribed regulations governing its calculation and administration, which are not supplied in the source or copied context.
    - output: us-co:statutes/39/39-28/5-107/2/a#bad_debt_tax_credit
      reason: Computing the credit and subsequent remittance liability requires transaction-level tax payments, charge-offs, recoveries, and department-payment relations not supplied by the source.
    - output: us-co:statutes/39/39-28/5-107/2/b#bad_debt_credit_claim_supported
      reason: Claim support depends on invoice, delivery, nonpayment, and reasonable-collection-practice evidence records that cannot be represented faithfully by the available scalar schema.
    - output: us-co:statutes/39/39-28/5-107/2/c#nonpaying_purchaser_tax_liability
      reason: The liability and its reduction require relations among the purchaser, credited debt, subsequent recovery, and distributor or remote-retail-seller payment to the department.
rules:
  - name: bad_debt
    kind: derived
    entity: Asset
    dtype: Money
    unit: USD
    period: Year
    source: 39-28.5-107(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-107
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-107
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if debt_portion_is_related_to_sale_of_tobacco_products_subject_to_article_tax
          and debt_portion_is_not_otherwise_deductible_or_excludable
          and debt_portion_became_worthless_or_uncollectible_after_tax_was_paid_under_section_39_28_5_106
          and debt_portion_is_eligible_for_deduction_under_internal_revenue_code_section_166
          and not debt_portion_is_interest_on_wholesale_price_of_tobacco_products
          and not debt_portion_is_uncollectible_amount_on_property_retained_until_full_purchase_price_is_paid
          and not debt_portion_is_collection_expense
          and not debt_portion_was_recovered
          and not account_receivable_was_sold_to_third_party_for_collection
          and not debt_portion_is_repossessed_property: taxes_attributable_to_debt_portion else: 0
