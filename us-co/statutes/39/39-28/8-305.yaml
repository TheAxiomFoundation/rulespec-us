format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-305
  summary: |-
    For fiscal years beginning July 1, 2019 and thereafter except the fiscal year beginning July 1, 2020, all money received and collected is transferred to the public school capital construction assistance fund. For the fiscal year beginning July 1, 2020, the lesser of the first forty million dollars or all money collected is transferred to that fund, and the remainder is transferred to the state public school fund.
rules:
  - name: public_school_capital_construction_assistance_fund_transfer_cap
    kind: parameter
    dtype: Money
    unit: USD
    source: C.R.S. 39-28.8-305(1)(a)(IV)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-305
              excerpt: "the lesser of the first forty million dollars received and collected"
    versions:
      - effective_from: '2020-07-01'
        formula: |-
          40000000
  - name: public_school_capital_construction_assistance_fund_transfer
    kind: derived
    entity: StateTreasurer
    dtype: Money
    period: Year
    unit: USD
    source: C.R.S. 39-28.8-305(1)(a)(III)-(IV)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-305
              excerpt: "all of the money received and collected annually shall be transferred"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-305
              excerpt: "the lesser of the first forty million dollars received and collected or all of the money received and collected"
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-305
              excerpt: "except for the state fiscal year commencing July 1, 2020"
    versions:
      - effective_from: '2019-07-01'
        formula: |-
          if special_fiscal_year_distribution_applies:
            min(money_received_and_collected_annually, public_school_capital_construction_assistance_fund_transfer_cap)
          else: money_received_and_collected_annually
  - name: state_public_school_fund_transfer
    kind: derived
    entity: StateTreasurer
    dtype: Money
    period: Year
    unit: USD
    source: C.R.S. 39-28.8-305(1)(a)(IV)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-305
              excerpt: "the remainder of the money received and collected shall be transferred to the state public school fund"
    versions:
      - effective_from: '2020-07-01'
        formula: |-
          if special_fiscal_year_distribution_applies:
            max(0, money_received_and_collected_annually - public_school_capital_construction_assistance_fund_transfer_cap)
          else: 0
