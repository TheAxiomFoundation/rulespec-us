format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-202
  summary: |-
    “Beginning January 1, 2014, and through June 30, 2017, there is imposed … a tax at the rate of ten percent”; “[b]eginning July 1, 2017” the rate is fifteen percent. The section does not impose tax on sales by a medical marijuana center.
  deferred_outputs:
    - output: us-co:statutes/39/39-28/8-202#temporary_retail_marijuana_sales_tax_rate
      reason: The September 2015 rate reduction is specified by section 20(3)(c) of article X of the state constitution, which is not available in copied context.
    - output: us-co:statutes/39/39-28/8-202#required_retail_marijuana_sales_tax_refund
      reason: The refund amount depends on calculations under sections 39-28.8-602 and 39-28.8-605, which are not available in copied context.
rules:
  - name: standard_retail_marijuana_sales_tax_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. 39-28.8-202(1)(a)(I)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "beginning January 1, 2014, and through June 30, 2017"
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "rate of ten percent"
          - path: versions[1].formula
            kind: effective_period
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "Beginning July 1, 2017"
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "rate of fifteen percent"
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          0.10
      - effective_from: '2017-07-01'
        formula: |-
          0.15

  - name: retail_marijuana_sales_tax_maximum_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. 39-28.8-202(1)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "maximum tax rate that may be imposed pursuant to this section is fifteen percent"
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          0.15

  - name: temporary_retail_marijuana_sales_tax_reduction_rate
    kind: parameter
    dtype: Rate
    source: C.R.S. 39-28.8-202(1)(a)(III)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "reduced to one-tenth of one percent"
    versions:
      - effective_from: '2016-01-01'
        formula: |-
          0.001

  - name: fiscal_year_spending_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: C.R.S. 39-28.8-202(1)(a)(II)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "fiscal year spending is greater than twelve billion eighty million dollars"
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          12080000000

  - name: retail_marijuana_tax_revenue_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: C.R.S. 39-28.8-202(1)(a)(II)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "revenue from retail marijuana taxes is greater than sixty-seven million dollars"
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          67000000

  - name: retail_marijuana_sales_tax_applies
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Day
    source: C.R.S. 39-28.8-202(1)(a)(I), (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "all sales of retail marijuana and retail marijuana products by a retailer"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-202
              excerpt: "Nothing in this section shall be construed to impose a tax on the sale of marijuana or marijuana products to any person by a medical marijuana center."
    versions:
      - effective_from: '2014-01-01'
        formula: |-
          payment_is_sale_of_retail_marijuana_or_retail_marijuana_product
          and payment_is_made_by_retailer
          and not payment_is_sale_by_medical_marijuana_center
