format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-110
  summary: "\u201CIf a person neglects or refuses to make a return as required by\
    \ this article and no amount of tax is due,\u201D a twenty-five-dollar penalty\
    \ applies. A late tax payment incurs a penalty of ten percent plus one-half of\
    \ one percent per month, capped at eighteen percent in the aggregate, together\
    \ with interest computed under section 39-21-110.5."
  deferred_outputs:
  - output: us-co:statutes/39/39-28/5-110#delinquent_tax_interest
    reason: The interest rate must be computed under section 39-21-110.5, whose executable
      RuleSpec output is not available in copied context.
rules:
- name: missing_return_when_no_tax_due_penalty_amount
  kind: parameter
  dtype: Money
  unit: USD
  source: "C.R.S. \xA7 39-28.5-110(2)(a)"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-110
          excerpt: a penalty in the amount of twenty-five dollars
  versions:
  - effective_from: '0001-01-01'
    formula: '25'
- name: late_tax_payment_initial_penalty_rate
  kind: parameter
  dtype: Rate
  source: "C.R.S. \xA7 39-28.5-110(2)(b)"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-110
          excerpt: a penalty equal to ten percent of such tax
  versions:
  - effective_from: '0001-01-01'
    formula: '0.10'
- name: late_tax_payment_monthly_penalty_rate
  kind: parameter
  dtype: Rate
  source: "C.R.S. \xA7 39-28.5-110(2)(b)"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-110
          excerpt: one-half of one percent per month
  versions:
  - effective_from: '0001-01-01'
    formula: '0.005'
- name: late_tax_payment_penalty_rate_cap
  kind: parameter
  dtype: Rate
  source: "C.R.S. \xA7 39-28.5-110(2)(b)"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-110
          excerpt: not to exceed eighteen percent in the aggregate
  versions:
  - effective_from: '0001-01-01'
    formula: '0.18'
- name: missing_return_when_no_tax_due_penalty
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: USD
  source: "C.R.S. \xA7 39-28.5-110(2)(a)"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-110
          excerpt: neglects or refuses to make a return as required by this article
            and no amount of tax is due
      - path: versions[0].formula
        kind: import
        import:
          target: us-co:statutes/39/39-28/5-110#missing_return_when_no_tax_due_penalty_amount
          output: missing_return_when_no_tax_due_penalty_amount
          hash: sha256:local
  versions:
  - effective_from: '0001-01-01'
    formula: 'if person_neglects_or_refuses_to_make_required_return and no_tax_is_due:
      missing_return_when_no_tax_due_penalty_amount else: 0'
- name: late_tax_payment_penalty
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: USD
  source: "C.R.S. \xA7 39-28.5-110(2)(b)"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-110
          excerpt: fails to pay the tax in the time allowed
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-co/statute/39/39-28.5-110
          excerpt: ten percent of such tax plus one-half of one percent per month
            from the date when due, not to exceed eighteen percent in the aggregate
      - path: versions[0].formula
        kind: import
        import:
          target: us-co:statutes/39/39-28/5-110#late_tax_payment_initial_penalty_rate
          output: late_tax_payment_initial_penalty_rate
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-co:statutes/39/39-28/5-110#late_tax_payment_monthly_penalty_rate
          output: late_tax_payment_monthly_penalty_rate
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-co:statutes/39/39-28/5-110#late_tax_payment_penalty_rate_cap
          output: late_tax_payment_penalty_rate_cap
          hash: sha256:local
  versions:
  - effective_from: '0001-01-01'
    formula: 'if tax_payment_was_not_made_in_time_allowed: tax_amount_due * min( late_tax_payment_penalty_rate_cap,
      late_tax_payment_initial_penalty_rate + (late_tax_payment_monthly_penalty_rate
      * months_since_tax_was_due) ) else: 0'
