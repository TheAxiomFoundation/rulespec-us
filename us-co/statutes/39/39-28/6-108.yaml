format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.6-108
  summary: |-
    Credit of reported and paid nicotine-products tax may be made to a distributor when products are shipped to out-of-state retailers for sale, shipped to an out-of-state consumer on or after January 1, 2021, returned to the manufacturer, or destroyed.
rules:
  - name: nicotine_products_tax_credit_may_be_made
    kind: derived
    entity: Distributor
    dtype: Judgment
    period: Month
    source: C.R.S. 39-28.6-108
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-108
              excerpt: "tax ... has been reported and paid"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-108
              excerpt: "shipped or transported ... to retailers without the state"
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-108
              excerpt: "to a consumer without the state on or after January 1, 2021"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-108
              excerpt: "returned to the manufacturer ... or destroyed"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          nicotine_products_tax_was_reported_and_paid
          and (
            nicotine_products_were_shipped_to_out_of_state_retailers_for_sale
            or nicotine_products_were_shipped_to_out_of_state_consumer_on_or_after_effective_date
            or nicotine_products_were_returned_to_manufacturer
            or nicotine_products_were_destroyed
          )
