  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-105
  summary: |-
    "Every distributor shall keep ... complete and accurate records"; required books, records, papers, and documents "shall be preserved for a period of at least three years"; retailers and remote retail sellers also have specified recordkeeping duties.
  deferred_outputs:
    - output: us-co:statutes/39/39-28/5-105#distributor_recordkeeping_compliance
      reason: The administrative recordkeeping and invoice duties cannot be represented faithfully as a computable RuleSpec outcome without a supported records-and-invoices ontology.
      source_values:
        - us-co:statutes/39/39-28/5-105#record_preservation_minimum_years
    - output: us-co:statutes/39/39-28/5-105#retailer_recordkeeping_compliance
      reason: The administrative recordkeeping and department-production duties cannot be represented faithfully as a computable RuleSpec outcome without a supported records-and-invoices ontology.
    - output: us-co:statutes/39/39-28/5-105#remote_retail_seller_recordkeeping_compliance
      reason: The administrative recordkeeping and invoice-validation duties cannot be represented faithfully as a computable RuleSpec outcome without a supported records-and-invoices ontology.
