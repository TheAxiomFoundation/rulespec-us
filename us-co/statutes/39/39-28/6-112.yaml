  summary: |-
    Revenue generated by the article 28.6 tax approved by voters at the November 2020 statewide election may be collected and spent as a voter-approved revenue change.
rules:
  - name: revenue_may_be_collected_and_spent_as_voter_approved_revenue_change
    kind: derived
    entity: StateTaxRevenue
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.6-112
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.6-112
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          revenue_is_generated_by_tax_imposed_by_article_28_6
          and tax_was_approved_by_voters_at_relevant_statewide_election
