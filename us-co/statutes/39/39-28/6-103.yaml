format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.6-103
  summary: A tax is levied on nicotine products, with separate rates for modified
    risk tobacco products. The tax is imposed when a distributor brings products into
    Colorado for sale, manufactures them for in-state sale, ships them to Colorado
    retailers, or makes a delivery sale.
rules:
- name: standard_nicotine_products_tax_rate
  kind: parameter
  dtype: Rate
  source: C.R.S. 39-28.6-103(1)(a)-(e)
  metadata:
    proof:
      atoms:
      - path: versions
        kind: parameter
        source:
          corpus_citation_path: us-co/statute/39/39-28.6-103
          excerpt: Thirty percent ... January 1, 2021 ... Sixty-two percent ... on
            and after July 1, 2027.
  versions:
  - effective_from: '2021-01-01'
    formula: '0.30'
  - effective_from: '2022-01-01'
    formula: '0.35'
  - effective_from: '2023-01-01'
    formula: '0.50'
  - effective_from: '2024-07-01'
    formula: '0.56'
  - effective_from: '2027-07-01'
    formula: '0.62'
- name: modified_risk_nicotine_products_tax_rate
  kind: parameter
  dtype: Rate
  source: C.R.S. 39-28.6-103(2)(a)-(e)
  metadata:
    proof:
      atoms:
      - path: versions
        kind: parameter
        source:
          corpus_citation_path: us-co/statute/39/39-28.6-103
          excerpt: Fifteen percent ... January 1, 2021 ... Thirty-one percent ...
            on and after July 1, 2027.
  versions:
  - effective_from: '2021-01-01'
    formula: '0.15'
  - effective_from: '2022-01-01'
    formula: '0.175'
  - effective_from: '2023-01-01'
    formula: '0.25'
  - effective_from: '2024-07-01'
    formula: '0.28'
  - effective_from: '2027-07-01'
    formula: '0.31'
- name: nicotine_products_tax_rate
  kind: derived
  entity: Distributor
  dtype: Rate
  period: Year
  source: C.R.S. 39-28.6-103(1)-(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-co/statute/39/39-28.6-103
          excerpt: excluding nicotine products that are modified risk tobacco products
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-co/statute/39/39-28.6-103
          excerpt: at the rate of
  versions:
  - effective_from: '2021-01-01'
    formula: 'if nicotine_products_are_modified_risk_tobacco_products: modified_risk_nicotine_products_tax_rate
      else: standard_nicotine_products_tax_rate'
- name: nicotine_products_tax_applies
  kind: derived
  entity: Distributor
  dtype: Judgment
  period: Year
  source: C.R.S. 39-28.6-103(3)(a)-(d)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-co/statute/39/39-28.6-103
          excerpt: imposed at the time the distributor
  versions:
  - effective_from: '2021-01-01'
    formula: 'distributor_brought_nicotine_products_into_state_for_sale

      or distributor_manufactured_nicotine_products_in_state_for_sale

      or distributor_shipped_nicotine_products_to_in_state_retailers

      or distributor_made_delivery_sale'
- name: nicotine_products_tax
  kind: derived
  entity: Distributor
  dtype: Money
  unit: USD
  period: Year
  source: C.R.S. 39-28.6-103(1)-(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-co/statute/39/39-28.6-103
          excerpt: tax upon the sale, use, consumption, handling, or distribution
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-co/statute/39/39-28.6-103
          excerpt: manufacturer's list price of the nicotine products
  versions:
  - effective_from: '2021-01-01'
    formula: 'if nicotine_products_tax_applies: manufacturer_list_price * nicotine_products_tax_rate
      else: 0'
