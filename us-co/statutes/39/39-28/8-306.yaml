format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.8-306
  summary: |-
    "It is unlawful" for a retail marijuana cultivation facility to sell or transfer retail marijuana without the required license, willfully make a false or fraudulent return or false statement on a return, or willfully evade payment of the tax imposed by part 3. A willful part 3 violation is punishable under section 39-21-118.
rules:
  - name: unlicensed_retail_marijuana_sale_or_transfer_is_unlawful
    kind: derived
    entity: RetailMarijuanaCultivationFacility
    dtype: Judgment
    period: Year
    source: C.R.S. 39-28.8-306
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-306
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          facility_sold_or_transferred_retail_marijuana
          and not facility_has_license_required_by_law

  - name: willful_false_or_fraudulent_return_or_statement_is_unlawful
    kind: derived
    entity: RetailMarijuanaCultivationFacility
    dtype: Judgment
    period: Year
    source: C.R.S. 39-28.8-306
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-306
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          facility_willfully_made_false_or_fraudulent_return_or_false_statement_on_return

  - name: willful_tax_payment_evasion_is_unlawful
    kind: derived
    entity: RetailMarijuanaCultivationFacility
    dtype: Judgment
    period: Year
    source: C.R.S. 39-28.8-306
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-306
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          facility_willfully_evaded_payment_of_part_3_tax

  - name: willful_part_3_violation_is_punishable
    kind: derived
    entity: RetailMarijuanaCultivationFacility
    dtype: Judgment
    period: Year
    source: C.R.S. 39-28.8-306
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-306
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.8-306
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          unlicensed_retail_marijuana_sale_or_transfer_is_unlawful
          or willful_false_or_fraudulent_return_or_statement_is_unlawful
          or willful_tax_payment_evasion_is_unlawful
