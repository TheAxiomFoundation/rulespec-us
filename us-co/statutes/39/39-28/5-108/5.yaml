format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-108.5
  summary: |-
    Revenue generated by the voter-approved tax increase may be collected and spent as a voter-approved revenue change, notwithstanding revenue, spending, or appropriation limitations.
rules:
  - name: tax_increase_revenue_may_be_collected_and_spent_as_voter_approved_revenue_change
    kind: derived
    entity: Revenue
    dtype: Judgment
    period: Year
    source: C.R.S. § 39-28.5-108.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108.5
              excerpt: revenue generated by the tax increase set forth in section 39-28.5-102
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108.5
              excerpt: may be collected and spent as a voter-approved revenue change
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-108.5
              excerpt: Notwithstanding any limitations on revenue, spending, or appropriations
    versions:
      - effective_from: '2026-01-01'
