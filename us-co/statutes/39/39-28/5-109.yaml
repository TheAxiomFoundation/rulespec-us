format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-109
  summary: |-
    This article 28.5 does not prevent a statutory or home rule municipality, county, or city and county from imposing, levying, and collecting any special sales tax upon sales of cigarettes, tobacco products, or nicotine products, or upon the occupation or privilege of selling those products.
rules:
  - name: article_does_not_prevent_local_special_sales_tax
    kind: derived
    entity: LocalGovernment
    dtype: Judgment
    period: Year
    source: Colo. Rev. Stat. § 39-28.5-109
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-109
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          (local_government_is_statutory_or_home_rule_municipality
          or local_government_is_county
          or local_government_is_city_and_county)
          and special_sales_tax_is_on_cigarettes_tobacco_products_or_nicotine_products
          and (special_sales_tax_is_on_sales
          or special_sales_tax_is_on_occupation_or_privilege_of_selling_products)
