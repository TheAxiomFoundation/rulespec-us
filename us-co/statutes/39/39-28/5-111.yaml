    kind: derived
    entity: Person
    dtype: Judgment
    period: Day
    source: C.R.S. § 39-28.5-111(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us-co/statute/39/39-28.5-111
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          imported_tobacco_product_violates_federal_package_information_requirement

  - name: sale_of_tobacco_product_with_noncompliant_package_is_prohibited
    kind: derived
    entity: Person
    dtype: Judgment
    period: Day
