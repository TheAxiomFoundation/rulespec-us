format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/statute/39/39-28.5-111
  summary: |-
    “No person shall import” tobacco products violating federal package-information requirements; no person shall sell noncompliant, foreign-use-marked, or concealingly altered packages. Marked packages are contraband, may be seized without warrant, and seized products shall be confiscated and destroyed.
rules:
