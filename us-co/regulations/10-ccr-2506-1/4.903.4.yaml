format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.903.4
  summary: |-
    QA reviews are conducted during the annual federal QA review period, the twelve-month period from October 1 through September 30. QA reviews are federally mandated to measure SNAP caseload validity, determine error rates, provide corrective-action information, and establish liability/funding bases. Reviews are conducted on active cases and negative cases; negative-case review includes case record review, error analysis, client notification, and reporting review findings.
  deferred_outputs:
    - output: us-co:regulations/10-ccr-2506-1/4.903.4#annual_federal_qa_review_period
      reason: >-
        This output must construct the recurring annual interval beginning
        October 1 of one calendar year and ending September 30 of the next.
        The pinned RuleSpec engine supports Date values, period_start,
        period_end, date_add_days, and days_between, but its authoring formula
        surface has no date-literal expression, calendar year/month/day
        extraction, date-from-parts operation, month/year date arithmetic, or
        interval-valued derived output. It therefore cannot derive these
        recurring boundaries from an arbitrary query period. Hard-coding one
        federal fiscal year or accepting preclassified month/day booleans would
        misstate the annually recurring rule.
      source_values:
        - us-co:regulations/10-ccr-2506-1/4.903.4#annual_federal_qa_review_period_length_months
rules:
  - name: annual_federal_qa_review_period_length_months
    kind: parameter
    dtype: Count
    source: 10 CCR 2506-1 section 4.903.4, introductory text
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.903.4
              excerpt: "the twelve (12) month period"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          12

