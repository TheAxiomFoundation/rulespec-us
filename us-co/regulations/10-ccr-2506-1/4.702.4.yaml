format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.702.4
  summary: The local office shall restore household benefits lost because of local-office
    error or SSA joint-processing error, including restoration back to a client's
    public-institution release date when the client jointly applied for SSI and SNAP
    while institutionalized and the local office was not timely notified of release.
rules:
- name: local_or_ssa_joint_processing_error_lost_benefits_restored
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: 10 CCR 2506-1 section 4.702.4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.702.4
  versions:
  - effective_from: '2025-10-01'
    formula: 'household_lost_benefits

      and benefits_lost_as_result_of_local_office_error_or_ssa_joint_processing_error

      and local_office_restored_lost_benefits_to_household'
- name: joint_ssi_snap_public_institution_untimely_release_notice_benefits_restored_to_release_date
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: 10 CCR 2506-1 section 4.702.4, second paragraph
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.702.4
          excerpt: "Benefits shall be restored back to the date of a client’s release from a public institution if, while in the institution, the client jointly applied for SSI and SNAP, but the local office was not notified on a timely basis of the client’s release."
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      client_jointly_applied_for_ssi_and_snap_while_in_public_institution
      and local_office_not_notified_timely_of_client_release
      and benefits_restored_back_to_client_release_date
