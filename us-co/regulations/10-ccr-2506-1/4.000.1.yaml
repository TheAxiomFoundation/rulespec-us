format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.000.1
  summary: "Section 4.000.1 defines SNAP terms, including that an \u201CAble-Bodied\
    \ Adult Without Dependents (ABAWD)\u201D is an individual aged eighteen through\
    \ fifty-four without a physical or mental disability who lives in a household\
    \ with no one under eighteen; \u201CHousehold\u201D means individuals who live\
    \ together and customarily purchase and prepare food together for home consumption;\
    \ and \u201CPerson experiencing homelessness\u201D includes an individual lacking\
    \ a fixed and regular nighttime residence or whose primary residence is a listed\
    \ temporary setting, including temporary accommodation in another individual's\
    \ residence for ninety days or less."
rules:
  - name: abawd_minimum_age
    kind: parameter
    dtype: Count
    source: 10 CCR 2506-1 section 4.000.1, definition of "Able-Bodied Adult Without Dependents (ABAWD)"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.000.1
              excerpt: "aged eighteen (18) through the age of fifty-four (54)"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          18

  - name: abawd_maximum_age
    kind: parameter
    dtype: Count
    source: 10 CCR 2506-1 section 4.000.1, definition of "Able-Bodied Adult Without Dependents (ABAWD)"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.000.1
              excerpt: "aged eighteen (18) through the age of fifty-four (54)"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          54

  - name: homelessness_temporary_accommodation_maximum_days
    kind: parameter
    dtype: Count
    source: 10 CCR 2506-1 section 4.000.1, definition of "Person experiencing homelessness"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.000.1
              excerpt: "a temporary accommodation in the residence of another individual for ninety (90) days or less"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          90

  - name: abawd
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 10 CCR 2506-1 section 4.000.1, definition of "Able-Bodied Adult Without Dependents (ABAWD)"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.000.1
              excerpt: "an individual aged eighteen (18) through the age of fifty-four (54) without a physical or mental disability who lives in a household with no one under the age of eighteen (18)"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          individual_age >= abawd_minimum_age
          and individual_age <= abawd_maximum_age
          and not individual_has_physical_disability
          and not individual_has_mental_disability
          and individual_lives_in_household
          and not household_has_individual_under_age_eighteen

  - name: household
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: 10 CCR 2506-1 section 4.000.1, definition of "Household"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.000.1
              excerpt: "a group of individuals who live together and customarily purchase and prepare food together for home consumption"
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          individuals_live_together
          and individuals_customarily_purchase_and_prepare_food_together_for_home_consumption

  - name: person_experiencing_homelessness
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: 10 CCR 2506-1 section 4.000.1, definition of "Person experiencing homelessness"
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.000.1
    versions:
      - effective_from: '2025-10-01'
        formula: |-
          individual_lacks_fixed_and_regular_nighttime_residence
          or primary_residence_is_supervised_shelter_designed_for_temporary_accommodations
          or primary_residence_is_halfway_house_or_similar_facility_providing_temporary_residence
          or primary_residence_is_place_not_designed_or_ordinarily_used_as_regular_sleeping_accommodation_for_human_beings
          or (
            primary_residence_is_temporary_accommodation_in_another_individuals_residence
            and days_in_temporary_accommodation_in_another_individuals_residence <= homelessness_temporary_accommodation_maximum_days
          )
