format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.903.3
  summary: |-
    The State Department supervises SNAP administration and conducts ME reviews to measure compliance. The ME review system objectives are monitoring county operations, identifying and correcting deficiencies, maintaining information flow among counties, the State Department, and FNS, and reviewing target program areas identified by USDA/FNS.
rules:
  - name: state_department_me_review_administration_responsibilities_satisfied
    kind: derived
    entity: StateAgency
    dtype: Judgment
    period: Month
    source: 10 CCR 2506-1 section 4.903.3, introductory text
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-co/regulation/10-ccr-2506-1/4.903.3
    versions:
