format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-wy/guidance/state-portal/about-wyoming/operative-text
      - us-wy/guidance/lso/2026/gaming-revenue-distribution-and-taxation-rates/document-1
      - us-wy/statute/constitution/article-15/section-18/operative-text
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us-wy/guidance/state-portal/about-wyoming/operative-text
        - us-wy/guidance/lso/2026/gaming-revenue-distribution-and-taxation-rates/document-1
        - us-wy/statute/constitution/article-15/section-18
      rationale: |-
        The current official State of Wyoming portal, captured as of
        2026-07-24, affirmatively states that Wyoming does not possess an
        individual or corporate income tax. The page was updated October 16,
        2025 and displays a 2026 State of Wyoming copyright.

        The Wyoming Legislative Service Office's official May 2026 short
        report independently states that Wyoming does not have a state income
        tax and applies that statement to both operators and players. Together
        these current official sources ground the absence of a tax-year-2026
        resident individual income tax through the pre-credit stage.

        The current official Wyoming Constitution's article 15, section 18 is
        the higher-authority boundary check: if a tax were imposed on income,
        it would require a full credit for sales, use, and ad valorem taxes
        paid by the same taxpayer to a Wyoming taxing authority in the taxable
        year. It does not itself impose an income tax or prove the current
        no-tax statements.

        These sources do not prove that Wyoming has no independently
        refundable credit or otherwise establish a complete signed
        net-liability surface. The downstream credit and net-liability outputs
        therefore remain explicitly deferred behind typed source holds.
  summary: |-
    Wyoming tax-year-2026 full-year-resident individual-income-tax surface.
    Current official State of Wyoming and Legislative Service Office sources
    state that Wyoming has no individual or state income tax, so the
    source-backed individual-income-tax amount before credits is zero. This is
    the legal absence of an individual income tax, not a fictional
    zero-percent bracket or zero-income assumption.

    The pinned authority does not establish the absence of independently
    refundable credits or a complete signed net-liability surface. The
    after-nonrefundable-credit, refundable-credit, and net-liability outputs
    therefore return fail-closed zero sentinels while typed source holds
    remain active. Those sentinels are not substantive claims that the
    corresponding stages equal zero.

    Business and entity taxes, payments, filing administration, local taxes,
    and nonresident allocation are outside this module.
  deferred_outputs:
    - output: us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_individual_income_tax_after_nonrefundable_credits
      reason: |-
        The pinned no-individual-income-tax sources establish the pre-credit
        tax amount but do not provide a complete nonrefundable-credit surface.
      source_values:
        - us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_nonrefundable_credit_source_hold_applies
    - output: us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_refundable_individual_income_tax_credits
      reason: |-
        The pinned no-income-tax sources do not prove the absence of
        independently refundable individual credits.
      source_values:
        - us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_refundable_credit_source_hold_applies
    - output: us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_net_individual_income_tax_liability_before_payments
      reason: |-
        Signed net liability cannot be completed until the nonrefundable and
        refundable credit holds are cleared and their ordering is pinned.
      source_values:
        - us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_net_liability_source_hold_applies
