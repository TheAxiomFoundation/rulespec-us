# Current official State of Wyoming and Legislative Service Office sources
# establish the absence of an individual income tax. These input-free cases
# are named for materially different full-year-resident profiles to make
# explicit that federal income, filing status, deductions, exemptions, and
# surtaxes cannot change the legal pre-credit zero. Credit and net-liability
# amounts below are held fail-closed sentinels, not substantive zeros.
- name: single_low_income_full_year_resident
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input: {}
  output:
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_individual_income_tax_absence_applies: true
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_state_income_tax_absence_current_for_tax_year: true
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_individual_income_tax_imposed: false
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_deduction_and_exemption_stage_applies: false
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_surtax_stage_applies: false
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_individual_income_tax_before_credits: '0'
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_nonrefundable_credit_source_hold_applies: holds
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_individual_income_tax_after_nonrefundable_credits: '0'
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_refundable_credit_source_hold_applies: holds
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_refundable_individual_income_tax_credits: '0'
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_net_liability_source_hold_applies: holds
    us-wy:policies/income_tax/2026_resident_zero_liability#wy_pit_2026_resident_net_individual_income_tax_liability_before_payments: '0'

