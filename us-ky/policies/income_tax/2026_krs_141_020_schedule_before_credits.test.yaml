# Hand-computed tax-year-2026 fixtures for the narrow KRS 141.020 schedule.
# The caller supplies completed Kentucky net income; the module floors it at
# zero and multiplies by 0.035 before allowable credits.
- name: negative_net_income_floors_to_zero
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ky:policies/income_tax/2026_krs_141_020_schedule_before_credits#input.ky_pit_2026_krs_141_020_completed_net_income: -100
  output:
    us-ky:policies/income_tax/2026_krs_141_020_schedule_before_credits#ky_pit_2026_krs_141_020_net_income_boundary: 0
    us-ky:policies/income_tax/2026_krs_141_020_schedule_before_credits#ky_pit_2026_krs_141_020_schedule_before_credits: 0

