format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-sd/guidance/revenue/2026/sales-and-use-tax-guide/document-1
      - us-sd/statute/10/43/2/operative-text
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us-sd/guidance/revenue/2026/sales-and-use-tax-guide
        - us-sd/statute/10/43
        - us-sd/statute/10/43/2
      rationale: |-
        The South Dakota Department of Revenue's official January 2026 tax
        guide affirmatively states that South Dakota does not have a personal
        income tax. The current official South Dakota Codified Laws title
        chapter 10-43 as Income Tax on Banks and Financial Corporations, and
        section 10-43-2 imposes that chapter's annual tax on financial
        institutions. Those higher-authority boundaries keep bank-franchise
        and other business or entity taxes outside personal income tax.

        This authority proves zero natural-person personal income tax before
        credits. It does not prove that South Dakota has no independently
        refundable credit or otherwise establish a complete signed
        net-liability surface. The downstream credit and net-liability outputs
        therefore remain explicitly deferred behind typed source holds.
  summary: |-
    South Dakota tax-year-2026 full-year-resident natural-person
    personal-income-tax surface. The Department of Revenue's official January
    2026 guide states that South Dakota does not have a personal income tax,
    so the source-backed personal-income-tax amount before credits is zero.
    This is the legal absence of a personal income tax, not a fictional
    zero-percent bracket or zero-income assumption.

    The pinned authority does not establish the absence of independently
    refundable credits or a complete signed net-liability surface. The
    after-nonrefundable-credit, refundable-credit, and net-liability outputs
    therefore return fail-closed zero sentinels while typed source holds
    remain active. Those sentinels are not substantive claims that the
    corresponding stages equal zero.

    Bank-franchise and all other business or entity taxes are outside this
    module. Payments, filing administration, local taxes, and nonresident
    allocation are also outside scope.
  deferred_outputs:
    - output: us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_personal_income_tax_after_nonrefundable_credits
      reason: |-
        The pinned no-personal-income-tax authority establishes the pre-credit
        tax amount but does not provide a complete nonrefundable-credit
        surface.
      source_values:
        - us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_nonrefundable_credit_source_hold_applies
    - output: us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_refundable_personal_income_tax_credits
      reason: |-
        The pinned authority does not prove the absence of independently
        refundable natural-person credits.
      source_values:
        - us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_refundable_credit_source_hold_applies
    - output: us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_net_personal_income_tax_liability_before_payments
      reason: |-
        Signed net liability cannot be completed until the nonrefundable and
        refundable credit holds are cleared and their ordering is pinned.
      source_values:
        - us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_net_liability_source_hold_applies
rules:
  - name: sd_pit_2026_personal_income_tax_absence_applies
    kind: derived
    dtype: Boolean
    period: Year
    source: South Dakota Department of Revenue, January 2026 Sales and Use Tax Guide
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-sd/guidance/revenue/2026/sales-and-use-tax-guide/document-1
              excerpt: "South Dakota does not have a corporate, unitary, or personal income tax"
    versions:
      - effective_from: '2026-01-01'
        formula: true

  - name: sd_pit_2026_business_and_entity_taxes_outside_scope
    kind: derived
    dtype: Boolean
    period: Year
    source: South Dakota Department of Revenue, January 2026 Sales and Use Tax Guide
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-sd/statute/10/43/2/operative-text
              excerpt: "An annual tax is hereby imposed on each financial institution doing business in this state or licensed to do business in this state during any part of its tax year."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-sd/guidance/revenue/2026/sales-and-use-tax-guide/document-1
              excerpt: "however, businesses may be subject to one or more of the following taxes."
    versions:
