# The official January 2026 South Dakota Department of Revenue guide states
# that the state has no personal income tax. These input-free cases are named
# for materially different full-year-resident profiles to establish that
# income, filing status, deductions, exemptions, and surtaxes cannot change
# the legal pre-credit zero. Credit and net-liability amounts below are
# fail-closed sentinels guarded by explicit typed source holds, not
# substantive zero-liability assertions.
- name: single_low_income_full_year_resident
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input: {}
  output:
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_personal_income_tax_absence_applies: true
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_business_and_entity_taxes_outside_scope: true
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_personal_income_tax_imposed: false
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_deduction_and_exemption_stage_applies: false
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_surtax_stage_applies: false
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_personal_income_tax_before_credits: '0'
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_nonrefundable_credit_source_hold_applies: holds
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_personal_income_tax_after_nonrefundable_credits: '0'
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_refundable_credit_source_hold_applies: holds
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_refundable_personal_income_tax_credits: '0'
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_net_liability_source_hold_applies: holds
    us-sd:policies/income_tax/2026_resident_zero_liability#sd_pit_2026_resident_net_personal_income_tax_liability_before_payments: '0'

