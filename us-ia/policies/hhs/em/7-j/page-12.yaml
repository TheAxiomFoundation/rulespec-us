format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ia/manual/hhs/em/7-j/page-12
    source_sha256: 0a1652ebacf9d8e06766aec6ede3634ecc1775febb2bee0040a18fe7eb700130
  summary: |-
    This section deals with court hearings initiated by the DIA Investigations Division. It does not relate to judicial reviews of administrative disqualification hearings.
    Refer a person for a court hearing regardless of the current eligibility of the person.
    This referral screen must be completed before submitting the claim, or an error message will be received. Submission of this screen completes the referral process.
    The Investigations Division will send form 427-0500, Overpayment Recovery Case Status, giving the status of the referral. When there are changes in status of the referral, final court decisions, or any necessary action, the Investigations Division will send form 427-0500.
    Review the criteria for initiating a referral for administrative disqualification hearing if the prosecution action has been declined or withdrawn.
inputs:
  - name: snap_claim_amount
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: combined_claims_all_programs
    entity: Person
    dtype: Money
    unit: USD
    period: Month
  - name: intentional_program_violation_believed_possible
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: snap_claim_court_referral_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: Iowa Employees’ Manual, Title 7, Chapter J, Court Referrals, When to Refer a Case for a Court Hearing, SNAP claim bullet.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-j/page-12
              excerpt: Cases where the SNAP claim is over $1,000.
    versions:
      - effective_from: '2021-08-27'
        formula: |-
          1000
  - name: combined_claims_court_referral_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: Iowa Employees’ Manual, Title 7, Chapter J, When to Refer a Case for a Court Hearing, combined claims bullet.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-j/page-12
              excerpt: Cases where the combined claims for all programs are over $1,000 and you believe there may have been an intentional program violation.
    versions:
      - effective_from: '2021-08-27'
        formula: |-
          1000
  - name: court_hearing_referral_required
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: >-
      Iowa Employees’ Manual, Title 7, Chapter J, Court Referrals,
      When to Refer a Case for a Court Hearing, referral chapeau, both
      claim bullets, and current-eligibility paragraph; How to Refer a Case
      for a Court Hearing, WOPR referral submission and case-status procedures.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-j/page-12
              excerpt: Cases where the SNAP claim is over $1,000.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-j/page-12
              excerpt: Cases where the combined claims for all programs are over $1,000 and you believe there may have been an intentional program violation.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-j/page-12
              excerpt: Refer the following types of cases to the DIA Investigations Division for a court hearing
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-j/page-12
              excerpt: Refer a person for a court hearing regardless of the current eligibility of the person.
    versions:
      - effective_from: '2021-08-27'
        formula: |-
          snap_claim_amount > snap_claim_court_referral_threshold
          or (combined_claims_all_programs > combined_claims_court_referral_threshold
              and intentional_program_violation_believed_possible)
