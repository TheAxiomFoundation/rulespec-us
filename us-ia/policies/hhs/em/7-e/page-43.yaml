format: rulespec/v1
module:
  summary: |-
    Households may choose to have fluctuating expenses averaged.
    Households can choose to have one-time-only expenses used once or averaged over the entire certification period in which they are billed.
    Deduct child or dependent care costs that allow a household member to:
    Look for work.
    Attend training or education to prepare the person for work.
    Accept a job or continue working.
  source_verification:
    corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
    source_sha256: e8c16bf30d63d1db09a4149d67a6f0fe0e55843423839f10f1b00010889e74c0
  proof_validation:
    required: true
inputs:
  - name: expense_is_one_time
    entity: Household
    dtype: Boolean
    period: Month
  - name: expense_is_billed
    entity: Household
    dtype: Boolean
    period: Month
  - name: elects_averaging
    entity: Household
    dtype: Boolean
    period: Month
  - name: billed_expense
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: month_is_single_use_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: month_is_in_billing_certification_period
    entity: Household
    dtype: Boolean
    period: Month
  - name: certification_period_months
    entity: Household
    dtype: Count
    period: Month
  - name: ongoing_expense_billed_less_often_than_monthly
    entity: Household
    dtype: Boolean
    period: Month
  - name: has_scheduled_billing_or_due_date
    entity: Household
    dtype: Boolean
    period: Month
  - name: billing_interval_months
    entity: Household
    dtype: Count
    period: Month
  - name: intended_coverage_months
    entity: Household
    dtype: Count
    period: Month
  - name: month_is_in_forward_averaging_period
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_is_homeless
    entity: Household
    dtype: Boolean
    period: Month
  - name: incurs_shelter_or_utility_costs_for_living_arrangement
    entity: Household
    dtype: Boolean
    period: Month
  - name: elects_homeless_standard_deduction
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_cost_is_incurred
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_cost
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: care_allows_member_to_look_for_work
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_allows_member_work_preparation_training_or_education
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_allows_member_to_accept_job_or_continue_working
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_is_child_care
    entity: Household
    dtype: Boolean
    period: Month
  - name: another_household_member_provides_care
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_paid_with_in_kind_benefit
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_covered_by_excluded_reimbursement_including_employment_training
    entity: Household
    dtype: Boolean
    period: Month
  - name: care_covered_by_excluded_vendor_payment
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: example_assessment_certification_months
    kind: parameter
    dtype: Count
    source: Averaging Expenses — local assessment example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: averaged over the three-month certification period
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          3
  - name: example_property_tax_bill
    kind: parameter
    dtype: Money
    unit: USD
    source: Averaging Expenses — property tax example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Mr. T is billed $600 every six months for property taxes.
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          600
  - name: example_property_tax_interval_months
    kind: parameter
    dtype: Count
    source: Averaging Expenses — property tax example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: ($600 ÷ 6 months)
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          6
  - name: example_stated_monthly_property_tax
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Averaging Expenses — property tax example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Allow a deduction of $100 per month
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          100
  - name: one_time_expense_monthly_amount
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Averaging Expenses — choice to average; One-time expenses; local assessments
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Households can choose to have one-time-only expenses used once or averaged over the entire certification period in which they are billed.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: A local assessment is a one-time only expense.
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          if expense_is_one_time and expense_is_billed:
            if elects_averaging:
              if month_is_in_billing_certification_period: billed_expense / certification_period_months else: 0
            else:
              if month_is_single_use_month: billed_expense else: 0
          else: 0
  - name: ongoing_expense_monthly_average
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Averaging Expenses — choice to average; Ongoing expenses
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: average them forward over the interval between the billings
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: When there is no scheduled interval between the billings, average the expense forward over the period of time the expense is intended to cover.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Households may choose to have fluctuating expenses averaged.
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          if elects_averaging and ongoing_expense_billed_less_often_than_monthly and month_is_in_forward_averaging_period:
            if has_scheduled_billing_or_due_date: billed_expense / billing_interval_months
            else: billed_expense / intended_coverage_months
          else: 0
  - name: example_assessment_monthly_average
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Averaging Expenses — local assessment example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: may elect to have that bill averaged over the three-month certification period
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          if expense_is_billed and elects_averaging and month_is_in_billing_certification_period:
            billed_expense / example_assessment_certification_months
          else: 0
  - name: example_property_tax_monthly_average
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Averaging Expenses — property tax example
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Allow a deduction of $100 per month ($600 ÷ 6 months).
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          example_property_tax_bill / example_property_tax_interval_months
  - name: homeless_cost_verification_waived
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Averaging Expenses — homeless household verification
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Homeless households who incur shelter or utility expenses related to their living arrangement, but who opt to receive the homeless standard deduction are not required to provide verification of those costs.
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          household_is_homeless
          and incurs_shelter_or_utility_costs_for_living_arrangement
          and elects_homeless_standard_deduction
  - name: child_and_dependent_care_deduction
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Child and Dependent Care — qualifying purposes and child care exclusions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Deduct child or dependent care costs that allow a household member to
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Look for work.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Attend training or education to prepare the person for work.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Accept a job or continue working.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: Another household member provides the care.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: The care is paid for by some in-kind benefit, such as food.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-e/page-43
              excerpt: The expense is covered by an excluded reimbursement or excluded vendor payment. This includes reimbursement by an employment and training program.
    versions:
      - effective_from: '2026-02-13'
        formula: |-
          if care_is_child_care and (another_household_member_provides_care or care_paid_with_in_kind_benefit or care_covered_by_excluded_reimbursement_including_employment_training or care_covered_by_excluded_vendor_payment): 0
          else:
            if care_cost_is_incurred and (care_allows_member_to_look_for_work or care_allows_member_work_preparation_training_or_education or care_allows_member_to_accept_job_or_continue_working): care_cost
            else: 0
