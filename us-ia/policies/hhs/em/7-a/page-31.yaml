format: rulespec/v1
module:
  summary: |-
    The household may designate a separate authorized representative for each of these activities or may designate a single authorized representative for all activities.
    Always document the name of the authorized representative in the case record.
    People who are disqualified for fraud cannot be authorized representatives during the period of disqualification.
  source_verification:
    corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
    source_sha256: ac52f94d85ae0e6e3620cbff7df774861ab37190e9580854d0777883f7485cc7
  proof_validation:
    required: true
inputs:
  - name: representative_requested_on_application
    entity: Household
    dtype: Boolean
    period: Month
  - name: asked_whether_representative_should_receive_card
    entity: Household
    dtype: Boolean
    period: Month
  - name: wants_representative_card_for_household_account
    entity: Household
    dtype: Boolean
    period: Month
  - name: primary_cardholder_requested_card_in_writing
    entity: Household
    dtype: Boolean
    period: Month
  - name: representative_only_handles_hhs_business
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_informed_of_representative_overissuance_liability
    entity: Household
    dtype: Boolean
    period: Month
  - name: card_issued_to_representative
    entity: Household
    dtype: Boolean
    period: Month
  - name: needs_representative_to_purchase_food
    entity: Household
    dtype: Boolean
    period: Month
  - name: knows_someone_to_act_as_food_purchasing_representative
    entity: Household
    dtype: Boolean
    period: Month
  - name: department_assisted_in_obtaining_food_purchasing_representative
    entity: Household
    dtype: Boolean
    period: Month
  - name: representative_designated
    entity: Household
    dtype: Boolean
    period: Month
  - name: representative_name_documented_in_case_record
    entity: Household
    dtype: Boolean
    period: Month
  - name: overissuance_results_from_representative_wrong_information
    entity: Household
    dtype: Boolean
    period: Month
  - name: department_employee_in_certification_or_snap_authorization
    entity: Person
    dtype: Boolean
    period: Month
  - name: director_approved_employee_designation_in_writing
    entity: Person
    dtype: Boolean
    period: Month
  - name: snap_authorized_retailer
    entity: Person
    dtype: Boolean
    period: Month
  - name: director_approved_retailer_designation_in_writing
    entity: Person
    dtype: Boolean
    period: Month
  - name: homeless_meal_provider
    entity: Person
    dtype: Boolean
    period: Month
  - name: within_fraud_disqualification_period
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: representative_card_inquiry_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Establishing Cardholders — application inquiry
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "When a household asks for an authorized representative on the application form, ask if the household wants the authorized representative to receive an EBT card."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not representative_requested_on_application
          or asked_whether_representative_should_receive_card
  - name: representative_card_written_request_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Establishing Cardholders — primary cardholder written request
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "If a household wants an authorized representative to receive an Iowa EBT card to use on the household’s account, the primary cardholder must make the request in writing."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not wants_representative_card_for_household_account
          or primary_cardholder_requested_card_in_writing
  - name: representative_liability_notice_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Establishing Cardholders — liability notice
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "When a household wants an authorized representative only to handle the household’s business with HHS, inform the household that it is liable for any overissuance that results from wrong information given by the authorized representative."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not representative_only_handles_hhs_business
          or household_informed_of_representative_overissuance_liability
  - name: household_liable_for_representative_overissuance
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Establishing Cardholders — liability for wrong information
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "When a household wants an authorized representative only to handle the household’s business with HHS, inform the household that it is liable for any overissuance that results from wrong information given by the authorized representative."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          representative_only_handles_hhs_business
          and overissuance_results_from_representative_wrong_information
  - name: business_only_representative_card_restriction_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Establishing Cardholders — business-only card restriction
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "Do not issue an EBT card when the authorized representative’s responsibilities are limited to handling business for the household with HHS."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not representative_only_handles_hhs_business
          or not card_issued_to_representative
  - name: food_purchasing_representative_assistance_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Establishing Cardholders — assistance obtaining a food purchaser
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "The Department is required to assist households in obtaining an authorized representative to purchase the household’s food when the household needs one but does not know someone to act in that capacity."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not needs_representative_to_purchase_food
          or knows_someone_to_act_as_food_purchasing_representative
          or department_assisted_in_obtaining_food_purchasing_representative
  - name: representative_name_documentation_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Establishing Cardholders — case record documentation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "Always document the name of the authorized representative in the case record."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not representative_designated
          or representative_name_documented_in_case_record
  - name: authorized_representative_prohibited
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Who Cannot Be an Authorized Representative — all four listed categories
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "Department employees involved in the certification or SNAP authorization process (unless the Field Eligibility Determination Director approves the designation in writing)."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "Retailers authorized to accept SNAP (unless the Field Eligibility Determination Director approves the designation in writing)."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "Homeless meal providers."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-31
              excerpt: "People who are disqualified for fraud cannot be authorized representatives during the period of disqualification."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          (department_employee_in_certification_or_snap_authorization
            and not director_approved_employee_designation_in_writing)
          or (snap_authorized_retailer
            and not director_approved_retailer_designation_in_writing)
          or homeless_meal_provider
          or within_fraud_disqualification_period
