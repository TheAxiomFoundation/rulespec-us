format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
    source_sha256: 44f2a02fd720b428b90b7fc6ee05d5f5a882227e736aa3f99782563af85737d1
  summary: |-
    “IVR” means interactive voice response. An IVR is a dial-in inquiry system.
    “Liquid resources” means resources that can readily be converted into cash.
    “Manual voucher” is a paper form that is used to complete a SNAP transaction when a retailer’s equipment is not working.
    Retailers that do not have equipment to accept an EBT card use only manual vouchers.
    Only FNS authorized retailers can use manual voucher forms.
    “Maximum allotment” means the maximum amount of benefits a household can be authorized to receive during a month. The allotment is based on the Thrifty Food Plan.
    “Meal service” is a firm authorized by FNS to accept SNAP as payment for prepared meals.
    “Means-tested program” means a program that uses income and resource guidelines to determine eligibility.
    “Medicaid” means medical assistance administered by the state.
    “Migrant” means a person who moves on a regular basis to find work in harvesting crops or other agricultural activities.
inputs:
  - name: moves_regularly
    entity: Person
    dtype: Boolean
    period: Month
  - name: moves_to_find_crop_harvesting_or_other_agricultural_work
    entity: Person
    dtype: Boolean
    period: Month
  - name: uses_income_guidelines_to_determine_eligibility
    entity: Program
    dtype: Boolean
    period: Month
  - name: uses_resource_guidelines_to_determine_eligibility
    entity: Program
    dtype: Boolean
    period: Month
  - name: program_name
    entity: Program
    dtype: String
    period: Month
  - name: provider_is_political_subdivision
    entity: MealDeliveryService
    dtype: Boolean
    period: Month
  - name: provider_is_private_nonprofit
    entity: MealDeliveryService
    dtype: Boolean
    period: Month
  - name: provider_is_private_establishment_contracted_by_state_or_local_government
    entity: MealDeliveryService
    dtype: Boolean
    period: Month
  - name: prepares_and_delivers_meals_at_concessional_prices
    entity: MealDeliveryService
    dtype: Boolean
    period: Month
  - name: serves_elderly_people_or_their_spouses
    entity: MealDeliveryService
    dtype: Boolean
    period: Month
  - name: serves_people_unable_to_prepare_all_meals_adequately_due_to_disability_or_their_spouses
    entity: MealDeliveryService
    dtype: Boolean
    period: Month
rules:
  - name: migrant
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Iowa HHS Employees’ Manual, Title 7, Chapter A, Definitions, “Migrant”
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: '“Migrant” means a person who moves on a regular basis to find work in harvesting crops or other agricultural activities.'
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          moves_regularly
          and moves_to_find_crop_harvesting_or_other_agricultural_work
  - name: means_tested_program
    kind: derived
    entity: Program
    dtype: Judgment
    period: Month
    source: Iowa HHS Employees’ Manual, Title 7, Chapter A, Definitions, “Means-tested program”
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: '“Means-tested program” means a program that uses income and resource guidelines to determine eligibility.'
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: SSI and FIP are examples of means-tested programs.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: Social Security benefits and Unemployment Compensation are not means-tested programs.
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not (program_name == "Social Security benefits")
          and not (program_name == "Unemployment Compensation")
          and (
            program_name == "SSI"
            or program_name == "FIP"
            or (
              uses_income_guidelines_to_determine_eligibility
              and uses_resource_guidelines_to_determine_eligibility
            )
          )
  - name: meal_delivery_service
    kind: derived
    entity: MealDeliveryService
    dtype: Judgment
    period: Month
    source: Iowa HHS Employees’ Manual, Title 7, Chapter A, Definitions, “Meal delivery service”, including both recipient bullets
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: a service provided by a political subdivision, a private nonprofit organization, or a private establishment with which the state or local government has contracted
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: for the preparation and delivery of meals at concessional prices
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: Elderly people and their spouses
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-9
              excerpt: Persons who are physically or mentally handicapped or otherwise disabled such that the person is unable to prepare all meals adequately, and those persons’ spouses.
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          (
            provider_is_political_subdivision
            or provider_is_private_nonprofit
            or provider_is_private_establishment_contracted_by_state_or_local_government
          )
          and prepares_and_delivers_meals_at_concessional_prices
          and (
            serves_elderly_people_or_their_spouses
            or serves_people_unable_to_prepare_all_meals_adequately_due_to_disability_or_their_spouses
          )
