rules:
  - name: elderly_minimum_age
    kind: parameter
    dtype: Integer
    source: Title 7 Chapter A, Definitions, “Elderly person”
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
              excerpt: a person 60 years of age or older
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          60
  - name: elderly_person
    kind: derived
    entity: Person
    dtype: Judgment
    period: Day
    source: Title 7 Chapter A, Definitions, “Elderly person”
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
              excerpt: '“Elderly person” means a person 60 years of age or older.'
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          age >= elderly_minimum_age
  - name: communal_dining_facility
    kind: derived
    entity: Establishment
    dtype: Judgment
    period: Day
    source: Title 7 Chapter A, Definitions, “Communal dining facility”, opening definition and all five inclusion bullets
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
              excerpt: approved by FNS, which prepares and serves meals for elderly people or for Supplemental Security Income (SSI) recipients and their spouses.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          establishment_is_fns_approved
          and establishment_prepares_and_serves_meals_for_elderly_people_or_ssi_recipients_and_spouses
          and (
            establishment_is_public
            or establishment_is_private_nonprofit
            or establishment_is_senior_citizen_center
            or establishment_is_apartment_building_occupied_primarily_by_elderly_people_or_ssi_households
            or establishment_is_federally_subsidized_elderly_housing_serving_resident_meals
            or establishment_is_private_with_agency_contract_for_concessional_meals_to_elderly_people_or_ssi_recipients_and_spouses
          )
  - name: current_day_is_due_date
    kind: derived
    entity: Paperwork
    dtype: Judgment
    period: Day
    source: Title 7 Chapter A, Definitions, “Due date”
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
              excerpt: If the normal due date lands on a weekend or state holiday, the due date is the next business day.
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          (
            (normal_due_date_is_weekend or normal_due_date_is_state_holiday)
            and current_day_is_next_business_day_after_normal_due_date
          )
          or (
            not normal_due_date_is_weekend
            and not normal_due_date_is_state_holiday
            and current_day_is_normal_due_date
          )
  - name: emergency_service_receipt_limit_days
    kind: parameter
    dtype: Integer
    source: Title 7 Chapter A, Definitions, “Emergency service”
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
              excerpt: within seven days after the date of application
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          7
  - name: emergency_service_receipt_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: Title 7 Chapter A, Definitions, “Emergency service”, benefit receipt requirement
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
              excerpt: Households eligible for emergency service must receive their benefits within seven days after the date of application.
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not household_is_eligible_for_emergency_service
          or (
            household_has_received_benefits
            and days_after_application_when_benefits_received <= emergency_service_receipt_limit_days
          )
