format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
    source_sha256: d1e3b288311aa1ccaaa9858956de8e03f1cb0803251d8f638508ecdd59a364cb
  summary: |-
    “Elderly person” means a person 60 years of age or older.
    “Due date” means the date paperwork is due to HHS. If the normal due date lands on a weekend or state holiday, the due date is the next business day.
    Households eligible for emergency service must receive their benefits within seven days after the date of application.

    “Communal dining facility” means a public or nonprofit private establishment, approved by FNS, which prepares and serves meals for elderly people or for Supplemental Security Income (SSI) recipients and their spouses. It includes:
     Senior citizen centers.
     Apartment buildings occupied primarily by elderly people or SSI households.
     Public or private nonprofit establishments (eating or otherwise) that feed elderly people or SSI recipients and their spouses.
     Federally subsidized housing for the elderly at which meals are prepared for and served to the residents.
     Private establishments that contract with a state or local agency to offer meals at concessional prices to elderly people or SSI recipients and their spouses.

    “Date of entry” or “date of admission” means the date an alien was lawfully admitted for permanent residence in the United States, as established by the federal government.
    “EBT” means electronic benefits transfer, the method the Department uses to issue SNAP benefits.
    “EBT card” means the magnetic plastic swipe card that SNAP participants use to access their benefits at retail outlets.
    “EBT customer service” in Iowa is accessed for cardholders by calling 1-800-359-5802. Retailers access customer service by calling 1-800-414-1422.
    “Emergency service” means faster processing. Households must meet certain criteria to be eligible for emergency service.
  deferred_outputs:
    - output: us-ia:policies/hhs/em/7-a/page-6#disabled
      reason: 'Cannot be computed until Disabled Member later in Title 7 Chapter A is encoded.'
  interpretations:
    - id: contracted-private-dining-establishments
      status: open
      question: Does the express inclusion of contracted private establishments extend the definition beyond nonprofit private establishments?
      texts:
        - corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
          excerpt: '“Communal dining facility” means a public or nonprofit private establishment, approved by FNS'
        - corpus_citation_path: us-ia/manual/hhs/em/7-a/page-6
          excerpt: Private establishments that contract with a state or local agency to offer meals at concessional prices to elderly people or SSI recipients and their spouses.
      reading: The expressly included contracted private establishments qualify without a separate nonprofit requirement; FNS approval and the meal-service requirement remain shared conditions.
      alternatives:
        - id: nonprofit-required-for-all-private-establishments
          reading: Every private establishment, including a contracted establishment, must also be nonprofit.
      basis: The final inclusion expressly says private establishments without repeating the nonprofit limitation.
      affects:
        - communal_dining_facility
