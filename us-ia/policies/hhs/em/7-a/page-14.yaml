rules:
- name: surviving_veteran_child_definition_path
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Definitions, surviving child of a veteran bullet and its two sub-bullets
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
          excerpt: Is a surviving child of a veteran who, under Title 38 of the U.S.
            Code, either
  versions:
  - effective_from: '2025-06-20'
    formula: "surviving_child_of_veteran\nand (\n  permanently_incapable_of_self_support_under_title_38\n\
      \  or (\n    (\n      receives_or_approved_for_service_connected_death_compensation_under_title_38\n\
      \      or receives_or_approved_for_nonservice_connected_death_pension_under_title_38\n\
      \    )\n    and permanent_disability_under_section_221_i\n  )\n)"
- name: railroad_annuitant_definition_path
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Definitions, Railroad Retirement Act annuity bullet
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
          excerpt: Receives an annuity payment under Section 2(a)(1)(iv) of the Railroad
            Retirement Act of 1974
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
          excerpt: receives an annuity payment under Section 2(a)(i)(v)
  versions:
  - effective_from: '2025-06-20'
    formula: "(\n  receives_annuity_under_section_2_a_1_iv\n  and railroad_retirement_board_determined_medicare_eligible\n\
      )\nor (\n  receives_annuity_under_section_2_a_i_v\n  and determined_disabled_under_title_xvi\n\
      )"
- name: interim_assistance_definition_path
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Definitions, interim assistance bullet
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
          excerpt: Receives interim assistance benefits pending the receipt of SSI,
            disability- related Medicaid, or state general assistance disability.
  versions:
  - effective_from: '2025-06-20'
    formula: "receives_interim_assistance_benefits\nand (\n  awaiting_ssi\n  or awaiting_disability_related_medicaid\n\
      \  or awaiting_state_general_assistance_disability\n)"
- name: same_month_recomputation_advance_notice_days
  kind: parameter
  dtype: Integer
  period: Month
  source: Adjustments Due to Changes in FIP or Federal Benefits, advance knowledge
    bullet
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
          excerpt: at least 30 days advance knowledge of the amount of the adjustment
  versions:
  - effective_from: '2025-06-20'
    formula: "30"
- name: snap_recomputation_effective_in_public_assistance_change_month_required
  kind: derived
  entity: StateAgency
  dtype: Judgment
  period: Month
  source: Responsibilities of the Department; Adjustments Due to Changes in FIP or
    Federal Benefits, chapeau and advance knowledge bullet
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
          excerpt: When the state makes an adjustment to public assistance
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
          excerpt: the Department must recompute SNAP benefits to be effective in
            the same month as the change in public assistance.
  versions:
