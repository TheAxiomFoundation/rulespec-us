format: rulespec/v1
module:
  source_verification:
    corpus_citation_path: us-ia/manual/hhs/em/7-a/page-14
    source_sha256: 510782bed6a2fa5846d7e5a5842876f6936ffc1f896555620fedf85d0d50277d
  proof_validation:
    required: true
  summary: 'Receives interim assistance benefits pending the receipt of SSI, disability-related
    Medicaid, or state general assistance disability.

    When the state makes an adjustment to public assistance:

    If the Department has at least 30 days advance knowledge of the amount of the
    adjustment, the Department must recompute SNAP benefits to be effective in the
    same month as the change in public assistance.'
