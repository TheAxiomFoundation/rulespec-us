format: rulespec/v1
module:
  summary: |-
    If the Department does not have enough notice, the adjustment in SNAP benefits must be effective no later than the month after the change in public assistance.
    When there is a federal benefit payment overall adjustment, such as social security cost-of-living increases, the change must be implemented no later than the second allotment after the month the change occurs.
    If the household requests a hearing, benefits are continued at the former level only if the issue appealed is that the calculation is wrong.
  source_verification:
    corpus_citation_path: us-ia/manual/hhs/em/7-a/page-15
    source_sha256: 9b0dace59fdd109bb584ba655e588e19fa3088ed0de4ed0ac132c0dbe34e4ac9
  proof_validation:
    required: true
inputs:
  - name: department_has_insufficient_notice_of_public_assistance_change
    entity: Household
    dtype: Boolean
    period: Month
  - name: snap_adjustment_effective_by_month_after_public_assistance_change
    entity: Household
    dtype: Boolean
    period: Month
  - name: federal_benefit_payment_overall_adjustment_occurs
    entity: Household
    dtype: Boolean
    period: Month
  - name: change_implemented_by_second_allotment_after_change_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: household_requests_hearing
    entity: Household
    dtype: Boolean
    period: Month
  - name: appealed_issue_is_incorrect_calculation
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: public_assistance_change_adjustment_timing_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Iowa HHS Employees’ Manual, Title 7, Chapter A, Adjustment Due to Changes in FIP; insufficient-notice deadline and ABC mass-change notices.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-15
              excerpt: "If the Department does not have enough notice, the adjustment in SNAP benefits must be effective no later than the month after the change in public assistance."
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-15
              excerpt: "Typically, these adjustments are done through a mass change to the ABC system, which automatically generates notices of decision to notify households of the change."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not department_has_insufficient_notice_of_public_assistance_change
          or snap_adjustment_effective_by_month_after_public_assistance_change
  - name: federal_benefit_adjustment_timing_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Iowa HHS Employees’ Manual, Title 7, Chapter A, federal benefit payment overall adjustments; COLA Processing reference.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-15
              excerpt: "When there is a federal benefit payment overall adjustment, such as social security cost-of-living increases, the change must be implemented no later than the second allotment after the month the change occurs."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          not federal_benefit_payment_overall_adjustment_occurs
          or change_implemented_by_second_allotment_after_change_month
  - name: former_benefit_level_continuation_allowed
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Iowa HHS Employees’ Manual, Title 7, Chapter A, hearing requests concerning adjustment calculations.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ia/manual/hhs/em/7-a/page-15
              excerpt: "If the household requests a hearing, benefits are continued at the former level only if the issue appealed is that the calculation is wrong."
    versions:
      - effective_from: '2025-06-20'
        formula: |-
          household_requests_hearing
          and appealed_issue_is_incorrect_calculation
