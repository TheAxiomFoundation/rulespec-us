          excerpt: the number of dependents claimed on the taxpayer's return
  versions:
  - effective_from: '0001-01-01'
    formula: federally_lawful_dependents_claimed_count
- name: nm_certain_dependents_deduction
  kind: derived
  entity: TaxUnit
  dtype: Money
  unit: USD
  period: Year
  source: 7-2-39(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-nm/statute/7-2-39
          excerpt: four thousand dollars ($4,000) multiplied by the difference between
            the number of dependents claimed on the taxpayer's return and one
  versions:
  - effective_from: '0001-01-01'
    formula: "if ((not taxpayer_is_section_152_dependent_of_another_individual)\n\
      \    or (spouse_present and not spouse_is_section_152_dependent_of_another_individual))\n\
      and (filing_status_head_of_household or filing_status_married_filing_jointly)\n\
      and federal_section_151_exemption_amount == section151_zero_gate_amount:\n \
      \ deduction_amount_per_additional_dependent\n  * max(0, nm_certain_dependents_qualifying_count\
      \ - dependent_count_subtrahend)\nelse: 0"
