format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-nm/statute/7-2-39
    source_sha256: 66fe019179bda376d429963c0e0468ff6a46fbff131f3d112475dad9a1bb9a27
  summary: A. While the Section 151 exemption amount is zero, an independent taxpayer
    filing as head of household or married filing jointly may deduct $4,000 multiplied
    by the number of dependents claimed minus one. B requires reporting the deduction
    as directed by the department. C requires inclusion in the tax expenditure budget,
    including annual aggregate cost. D defines “dependent” by reference to Section
    152 of the Internal Revenue Code.
