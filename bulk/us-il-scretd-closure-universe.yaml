provisions:
  - citation: us-il/statute/320/30/1
    heading: null
    status: excluded
    reason: no_household_computation
    basis: >-
      Section 1 only provides that the Act "shall be known and may be cited"
      as the Senior Citizens Real Estate Tax Deferral Act. It creates no
      household eligibility or deferral-amount computation.

  - citation: us-il/statute/320/30/2
    heading: null
    status: pending
    partial_coverage: >-
      us-il/statutes/320/30/2.yaml encodes the maximum-income schedule,
      income comparison, qualified-taxpayer judgment, homestead, and
      qualifying-property predicates. It expressly defers tax-deferred
      property, real-estate taxes, equity interest, and household income.
    join_found_module: us-il/statutes/320/30/2.yaml
    note: >-
      The missing definition frontier includes us-il/statute/320/25/3.05,
      us-il/statute/320/25/3.05a, us-il/statute/320/25/3.07, and
      us-il/statute/210/45/1-113. Exact citation-path scans found none of those
      records in the corpus at classification time.

  - citation: us-il/statute/320/30/3
    heading: null
    status: pending
    partial_coverage: >-
      us-il/statutes/320/30/3.yaml encodes the application and agreement
      gates, annual cap, interest rate, remaining-equity capacity, and
      deferral amount. Survivor continuation, repayment/recovery consequences,
      and other post-determination effects are represented only partially or
      as scalar parameters.
    join_found_module: us-il/statutes/320/30/3.yaml
    note: >-
      The assessment-freeze substitution depends on
      us-il/statute/35/200/15-172, which was absent from the corpus at
      classification time. Public Act 104-468's effective June 16, 2026
      lien-priority amendment is also absent from the June 26 corpus § 3 row.

  - citation: us-il/statute/320/30/4
    heading: null
    status: pending
    note: >-
      Section 4 is mostly lien-recording procedure, but it makes the filing
      fee "a part of the deferred taxes due." That amount can affect later
      remaining capacity under § 3's 80% equity ceiling, so a procedural
      exclusion would be unsafe without an encoded or explicitly reviewed
      boundary treatment.

  - citation: us-il/statute/320/30/5
    heading: null
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: >-
      Section 5 directs the collector to send bills for claims that already
      meet § 3 and directs the Department when to pay those bills from the
      revolving fund. It governs billing and payment after the household
      deferral determination, not who qualifies or the amount granted.

  - citation: us-il/statute/320/30/6
    heading: null
    status: excluded
    reason: procedural_no_point_in_time_effect
    basis: >-
      Section 6 permits voluntary payment of taxes and accrued interest that
      are not yet due, supplies notice rules for third-party payment, and
      applies payments first to interest. It expressly says such payments do
      not affect the property's deferred-tax status and does not recalculate
      the original eligibility or deferral amount.

  - citation: us-il/statute/320/30/7
    heading: null
    status: excluded
    reason: no_household_computation
    basis: >-
      Section 7 governs accounting and remittance after deferred taxes and
      interest are collected: local treasurers notify the Department and the
      Department credits accounts and deposits receipts in the revolving
      fund. It contains no household eligibility or deferral formula.

  - citation: us-il/statute/320/30/8
    heading: null
    status: excluded
    reason: no_household_computation
    basis: >-
      Section 8 is a savings clause stating that the Act does not affect
      mortgage tax-payment provisions or eligibility for a separate property
      tax relief grant. It supplies no SCRETD eligibility or amount
      computation.
