- name: la_liheap_band_4_threshold
  kind: parameter
  dtype: Rate
  period: Year
  source: FFY2026 Heating and Cooling - Benefit Matrix (LHC FFY 2026 LIHEAP Model Plan, page 60)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/policy/lhc/liheap/model-plan-ffy2026
          excerpt: "25% and Greater"
  versions:
  - effective_from: '2025-10-01'
    formula: '0.25'
- name: la_liheap_burden_band
  kind: derived
  entity: SpmUnit
  dtype: Count
  period: Year
  source: FFY2026 Heating and Cooling - Benefit Matrix (LHC FFY 2026 LIHEAP Model Plan, page 60)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/policy/lhc/liheap/model-plan-ffy2026
          excerpt: "9.9% and Less; 10% to 17.9%; 18% to 24.9%; 25% and Greater"
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_band_2_threshold
          output: la_liheap_band_2_threshold
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_band_3_threshold
          output: la_liheap_band_3_threshold
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_band_4_threshold
          output: la_liheap_band_4_threshold
          hash: sha256:local
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      if countable_income <= 0:
        4
      else:
        if total_energy_cost / countable_income >= la_liheap_band_4_threshold:
          4
        else:
          if total_energy_cost / countable_income >= la_liheap_band_3_threshold:
            3
          else:
            if total_energy_cost / countable_income >= la_liheap_band_2_threshold:
              2
            else:
              1
- name: la_liheap_matrix_amount
  kind: derived
  entity: SpmUnit
  unit: USD
  dtype: Money
  period: Year
  source: FFY2026 Heating and Cooling - Benefit Matrix (LHC FFY 2026 LIHEAP Model Plan, page 60)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/policy/lhc/liheap/model-plan-ffy2026
          excerpt: "Household Size; Benefit Amount"
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_matrix_amount_sizes_1_to_3
          output: la_liheap_matrix_amount_sizes_1_to_3
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_matrix_amount_sizes_4_or_more
          output: la_liheap_matrix_amount_sizes_4_or_more
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_burden_band
          output: la_liheap_burden_band
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_large_size_group_minimum
          output: la_liheap_large_size_group_minimum
          hash: sha256:local
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      if household_size >= la_liheap_large_size_group_minimum:
        la_liheap_matrix_amount_sizes_4_or_more[la_liheap_burden_band]
      else:
        la_liheap_matrix_amount_sizes_1_to_3[la_liheap_burden_band]
- name: la_liheap_benefit_before_eligibility
  kind: derived
  entity: SpmUnit
  unit: USD
  dtype: Money
  period: Year
  source: FFY2026 Heating and Cooling - Benefit Matrix (LHC FFY 2026 LIHEAP Model Plan, page 60)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/policy/lhc/liheap/model-plan-ffy2026
          excerpt: "one additional $100 payment per household; The maximum benefit will not exceed $800.00"
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_matrix_amount
          output: la_liheap_matrix_amount
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_priority_supplement
          output: la_liheap_priority_supplement
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:policies/lhc/liheap-benefit-matrix/ffy2026#la_liheap_maximum_benefit
          output: la_liheap_maximum_benefit
          hash: sha256:local
  versions:
  - effective_from: '2025-10-01'
    formula: |-
      if has_priority_group_member:
        min(la_liheap_matrix_amount + la_liheap_priority_supplement, la_liheap_maximum_benefit)
      else:
        la_liheap_matrix_amount
