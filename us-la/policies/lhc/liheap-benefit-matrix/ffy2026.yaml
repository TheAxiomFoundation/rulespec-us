format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-la/policy/lhc/liheap/model-plan-ffy2026
  summary: |-
    Louisiana LIHEAP FFY2026 benefit matrix: the heating benefit is read from four energy burden bands (below 10%, 10% to 17.9%, 18% to 24.9%, 25% and greater) by household size group (sizes 1 to 3, sizes 4 or more), plus one $100 supplement per household with a member in a targeted priority group, with zero-income households receiving the maximum for their size. Covers the matrix only; eligibility, countable income, total energy cost and the income limit need sources not yet in the corpus.
rules:
- name: la_liheap_matrix_amount_sizes_1_to_3
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  indexed_by: burden_band
  source: FFY2026 Heating and Cooling - Benefit Matrix (LHC FFY 2026 LIHEAP Model Plan, page 60)
  metadata:
    proof:
      atoms:
      - path: versions[0].values
        kind: parameter_table
        source:
          corpus_citation_path: us-la/policy/lhc/liheap/model-plan-ffy2026
          excerpt: "9.9% and Less 200.00; 10% to 17.9% 350.00; 18% to 24.9% 500.00; 25% and Greater 650.00 (household sizes 1, 2, 3)"
          table:
            header: FFY2026 Heating and Cooling - Benefit Matrix
            row_key: Energy Burden Percent
            column_key: Benefit Amount
  versions:
  - effective_from: '2025-10-01'
    values:
      1: 200
      2: 350
      3: 500
      4: 650
- name: la_liheap_matrix_amount_sizes_4_or_more
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  indexed_by: burden_band
  source: FFY2026 Heating and Cooling - Benefit Matrix (LHC FFY 2026 LIHEAP Model Plan, page 60)
  metadata:
    proof:
      atoms:
      - path: versions[0].values
        kind: parameter_table
        source:
          corpus_citation_path: us-la/policy/lhc/liheap/model-plan-ffy2026
          excerpt: "9.9% and Less 250.00; 10% to 17.9% 400.00; 18% to 24.9% 550.00; 25% and Greater 700.00 (household sizes 4, 5, 6, 7, 8 or More)"
          table:
            header: FFY2026 Heating and Cooling - Benefit Matrix
            row_key: Energy Burden Percent
            column_key: Benefit Amount
  versions:
  - effective_from: '2025-10-01'
    values:
      1: 250
      2: 400
      3: 550
      4: 700
