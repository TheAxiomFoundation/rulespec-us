      eff. Dec. 4, 2024.
  - output: us-la:statutes/47/32/c#corporation_income_tax_amount
    reason: La. R.S. 47:32(C) computes corporation taxable-income tax at rates provided
      for in R.S. 47:287.12; no executable RuleSpec output for those corporation rates
      is supplied in the available context.
