    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    us-la:statutes/47/32#input.individual_net_income: 100000
  output:
    us-la:statutes/47/32#individual_income_tax_rate: 0.03
    us-la:statutes/47/32#individual_income_tax_amount: 3000
