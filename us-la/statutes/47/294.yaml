format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-la/statute/47:294
    source_sha256: 2d7ceb0e2e4f07667becfe83ee45f652b1b793d3b72fb0f47c56a184dc28f17b
  summary: '"For tax year 2025" the standard deduction is "$12,500.00" for "Single

    Individual and Married-Separate"; "Married-Joint Return, a Qualified Surviving

    Spouse, and Head of Household" receive "200% of the dollar amount" provided

    for Single Individuals. Beginning January 1, 2026, the prior year''s deduction

    is adjusted annually by the prior amount multiplied by the prior calendar

    year''s CPI-U percentage increase.'
  deferred_outputs:
  - output: us-la:statutes/47/294#standard_deduction
    reason: The taxpayer-specific standard deduction requires the filing status used
      on the taxpayer's federal income tax return, but no executable upstream filing-status
      RuleSpec export is supplied.
rules:
- name: standard_deduction_single_individual_married_separate_2025
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(A)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Single Individual and Married-Separate $12,500.00
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
