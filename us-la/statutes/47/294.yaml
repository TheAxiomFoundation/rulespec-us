format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-la/statute/47:294
    source_sha256: 2d7ceb0e2e4f07667becfe83ee45f652b1b793d3b72fb0f47c56a184dc28f17b
  summary: '“A standard deduction shall be allowed” using the filing status used on
    the

    taxpayer’s federal income tax return. For tax year 2025, Single Individual

    and Married-Separate receive “$12,500.00”; Married-Joint Return, a Qualified

    Surviving Spouse, and Head of Household receive “200% of the dollar amount”

    provided for Single Individuals. “Beginning January 1, 2026,” the prior

    year’s deduction is adjusted annually using the previous calendar year’s

    CPI-U percentage increase.'
  deferred_outputs:
  - output: us-la:statutes/47/294#standard_deduction
    reason: La. R.S. 47:294(A), including (A)(1) and (A)(2), allows a standard deduction
      in determining a taxpayer's tax liability, requires the same filing status used
      on the taxpayer's federal income tax return, and assigns the applicable amount
      by that status. The taxpayer-specific standard deduction cannot be selected
      without an executable upstream federal filing-status RuleSpec export, which
      is not supplied.
rules:
- name: standard_deduction_single_individual_married_separate
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(A)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Single Individual and Married-Separate $12,500.00
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: '12500'
- name: standard_deduction_joint_surviving_spouse_head_of_household_multiplier
  kind: parameter
  dtype: Rate
  period: Year
  source: La. R.S. 47:294(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: 200% of the dollar amount
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: '2.00'
- name: standard_deduction_joint_surviving_spouse_head_of_household
  kind: derived
  entity: TaxUnit
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: 200% of the dollar amount
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#standard_deduction_single_individual_married_separate
          output: standard_deduction_single_individual_married_separate
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#standard_deduction_joint_surviving_spouse_head_of_household_multiplier
          output: standard_deduction_joint_surviving_spouse_head_of_household_multiplier
          hash: sha256:local
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
  versions:
