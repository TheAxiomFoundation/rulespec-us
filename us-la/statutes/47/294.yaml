format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-la/statute/47:294
    source_sha256: 2d7ceb0e2e4f07667becfe83ee45f652b1b793d3b72fb0f47c56a184dc28f17b
  summary: '"For tax year 2025" the standard deduction is "$12,500.00" for

    "Single Individual and Married-Separate" and "200% of the dollar amount"

    for the listed joint-return filing-status group. "Beginning January 1,

    2026, and thereafter" the prior year''s standard deduction is adjusted

    annually by the prior calendar year''s CPI-U percentage increase.'
rules:
- name: standard_deduction_single_individual_married_separate
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(A)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Single Individual and Married-Separate $12,500.00
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: '12500'
- name: standard_deduction_joint_surviving_spouse_head_of_household_multiplier
  kind: parameter
  dtype: Rate
  period: Year
  source: La. R.S. 47:294(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: 200% of the dollar amount
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: '2.00'
- name: standard_deduction_joint_surviving_spouse_head_of_household
  kind: derived
  entity: TaxUnit
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: 200% of the dollar amount
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#standard_deduction_single_individual_married_separate
          output: standard_deduction_single_individual_married_separate
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#standard_deduction_joint_surviving_spouse_head_of_household_multiplier
          output: standard_deduction_joint_surviving_spouse_head_of_household_multiplier
          hash: sha256:local
      - path: versions[0].effective_to
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: For tax year 2025
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: standard_deduction_single_individual_married_separate * standard_deduction_joint_surviving_spouse_head_of_household_multiplier
- name: applicable_prior_year_standard_deduction
  kind: derived
  entity: TaxUnit
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Taxpayers are required to use the same filing status
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: amount of the prior year's standard deduction
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Beginning January 1, 2026
  versions:
  - effective_from: '2026-01-01'
    formula: 'if federal_return_filing_status_is_single_or_married_separate and not
      federal_return_filing_status_is_joint_surviving_spouse_or_head_of_household:
      prior_year_standard_deduction_single_individual_married_separate else: if federal_return_filing_status_is_joint_surviving_spouse_or_head_of_household
      and not federal_return_filing_status_is_single_or_married_separate: prior_year_standard_deduction_joint_surviving_spouse_head_of_household
      else: 0'
- name: standard_deduction_annual_adjustment_amount
  kind: derived
  entity: TaxUnit
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: multiplying the amount of the prior year's standard deduction by
            the percentage increase
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#applicable_prior_year_standard_deduction
          output: applicable_prior_year_standard_deduction
          hash: sha256:local
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Beginning January 1, 2026
  versions:
  - effective_from: '2026-01-01'
    formula: applicable_prior_year_standard_deduction * previous_calendar_year_cpi_u_percentage_increase
- name: standard_deduction_after_annual_adjustment
  kind: derived
  entity: TaxUnit
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: shall be adjusted annually by an amount
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#applicable_prior_year_standard_deduction
          output: applicable_prior_year_standard_deduction
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#standard_deduction_annual_adjustment_amount
          output: standard_deduction_annual_adjustment_amount
          hash: sha256:local
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Beginning January 1, 2026
  versions:
  - effective_from: '2026-01-01'
    formula: applicable_prior_year_standard_deduction + standard_deduction_annual_adjustment_amount
- name: standard_deduction
  kind: derived
  entity: TaxUnit
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:294(A)-(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Taxpayers are required to use the same filing status
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Single Individual and Married-Separate $12,500.00
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/294#standard_deduction_joint_surviving_spouse_head_of_household
          output: standard_deduction_joint_surviving_spouse_head_of_household
          hash: sha256:local
      - path: versions[1].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:294
          excerpt: Beginning January 1, 2026, and thereafter
      - path: versions[1].formula
        kind: import
        import:
          target: us-la:statutes/47/294#standard_deduction_after_annual_adjustment
          output: standard_deduction_after_annual_adjustment
          hash: sha256:local
  versions:
  - effective_from: '2025-01-01'
    effective_to: '2025-12-31'
    formula: 'if federal_return_filing_status_is_single_or_married_separate and not
      federal_return_filing_status_is_joint_surviving_spouse_or_head_of_household:
      standard_deduction_single_individual_married_separate else: if federal_return_filing_status_is_joint_surviving_spouse_or_head_of_household
      and not federal_return_filing_status_is_single_or_married_separate: standard_deduction_joint_surviving_spouse_head_of_household
      else: 0'
  - effective_from: '2026-01-01'
    formula: standard_deduction_after_annual_adjustment
