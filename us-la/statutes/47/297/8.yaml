- name: louisiana_earned_income_tax_credit
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: USD
  source: La. R.S. 47:297.8(A)(1)-(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.8
          excerpt: amount equal to three and one-half percent of the federal earned
            income tax credit
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-la/statute/47:297.8
          excerpt: amount equal to five percent of the federal earned income tax credit
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/297/8#earned_income_tax_credit_rate
          output: earned_income_tax_credit_rate
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/297/8#earned_income_tax_credit_applies
          output: earned_income_tax_credit_applies
          hash: sha256:local
  versions:
  - effective_from: '2008-01-01'
    formula: 'if earned_income_tax_credit_applies: earned_income_tax_credit_rate *
      max(0, federal_earned_income_tax_credit) else: 0'
- name: earned_income_tax_credit_excess_overpayment
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: USD
  source: La. R.S. 47:297.8(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/statute/47:297.8
          excerpt: credit against Louisiana income tax for resident individuals exceeds
            the amount of such individual's tax liability
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.8
          excerpt: such excess tax credit shall constitute an overpayment
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/297/8#louisiana_earned_income_tax_credit
          output: louisiana_earned_income_tax_credit
          hash: sha256:local
  versions:
  - effective_from: '2008-01-01'
    formula: 'if individual_is_resident: max(0, louisiana_earned_income_tax_credit
      - louisiana_income_tax_liability) else: 0'
- name: earned_income_tax_credit_refund_exempt_from_overpayment_requirements
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: La. R.S. 47:297.8(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/statute/47:297.8
          excerpt: for resident individuals exceeds the amount of such individual's
            tax liability
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.8
          excerpt: right to a refund of any such overpayment shall not be subject
            to the requirements of R.S. 47:1621(B)
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/297/8#earned_income_tax_credit_excess_overpayment
          output: earned_income_tax_credit_excess_overpayment
          hash: sha256:local
  versions:
  - effective_from: '2008-01-01'
    formula: 'individual_is_resident

      and earned_income_tax_credit_excess_overpayment > 0'
