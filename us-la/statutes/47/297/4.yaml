format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-la/statute/47:297.4
    source_sha256: 34c473b9741200f16db2e0eb9e2a15faf38e9e7f111416619273a07a0e6e7528
  summary: '“There shall be a credit from the tax imposed by this Part for child care

    expenses for which a resident individual is eligible pursuant to the federal

    income tax credit provided by Internal Revenue Code Section 21 for the same

    taxable year.” The credit varies by federal adjusted gross income. Low-income

    excess is refundable; excess above $25,000 may be carried forward for no more

    than five years.'
rules:
- name: low_income_federal_adjusted_gross_income_limit
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(1)(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: equal to or less than twenty-five thousand dollars
  versions:
  - effective_from: '2006-01-01'
    formula: '25000'
- name: middle_income_federal_adjusted_gross_income_lower_bound
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: greater than twenty-five thousand dollars
  versions:
  - effective_from: '2006-01-01'
    formula: '25000'
- name: middle_income_federal_adjusted_gross_income_limit
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: less than or equal to thirty-five thousand dollars
  versions:
  - effective_from: '2006-01-01'
    formula: '35000'
- name: upper_middle_income_federal_adjusted_gross_income_lower_bound
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: greater than thirty-five thousand
  versions:
  - effective_from: '2006-01-01'
    formula: '35000'
- name: upper_middle_income_federal_adjusted_gross_income_limit
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: less than or equal to sixty thousand dollars
  versions:
  - effective_from: '2006-01-01'
    formula: '60000'
- name: high_income_federal_adjusted_gross_income_lower_bound
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: greater than sixty thousand dollars
  versions:
  - effective_from: '2006-01-01'
    formula: '60000'
- name: low_income_unreduced_federal_credit_percentage
  kind: parameter
  dtype: Rate
  source: La. R.S. 47:297.4(A)(1)(a)(i)-(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: twenty-five percent of the unreduced federal credit
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: beginning after December 31, 2005 and ending before January 1,
            2007
      - path: versions[1].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: fifty percent of the unreduced federal credit
      - path: versions[1].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: beginning after December 31, 2006
  versions:
  - effective_from: '2006-01-01'
    formula: '0.25'
  - effective_from: '2007-01-01'
    formula: '0.50'
- name: middle_income_claimed_federal_credit_percentage
  kind: parameter
  dtype: Rate
  source: La. R.S. 47:297.4(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: thirty percent of the federal credit for child care expenses claimed
  versions:
  - effective_from: '2006-01-01'
    formula: '0.30'
- name: upper_income_claimed_federal_credit_percentage
  kind: parameter
  dtype: Rate
  source: La. R.S. 47:297.4(A)(3)-(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: ten percent of the federal credit for child care expenses claimed
  versions:
  - effective_from: '2006-01-01'
    formula: '0.10'
- name: high_income_credit_cap
  kind: parameter
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: lesser of twenty-five dollars
  versions:
  - effective_from: '2006-01-01'
    formula: '25'
- name: excess_credit_carryforward_year_limit
  kind: parameter
  dtype: Count
  period: Year
  source: La. R.S. 47:297.4(B)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: period not exceeding five years
  versions:
  - effective_from: '2006-01-01'
    formula: '5'
- name: child_care_expense_credit_eligibility
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: La. R.S. 47:297.4(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: resident individual is eligible pursuant to the federal income
            tax credit
  versions:
  - effective_from: '2006-01-01'
    formula: 'individual_is_resident

      and eligible_for_federal_child_care_credit_under_section_21'
- name: low_income_credit_allowed_without_federal_claim
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: La. R.S. 47:297.4(A)(1)(a)-(b)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: allowed without regard to whether they claimed such federal credit
  versions:
  - effective_from: '2006-01-01'
    formula: 'child_care_expense_credit_eligibility

      and federal_adjusted_gross_income <= low_income_federal_adjusted_gross_income_limit'
- name: low_income_child_care_expense_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(1)(a)(i)-(ii)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: credit shall be calculated based on the federal tax credit before
            it is reduced
  versions:
  - effective_from: '2006-01-01'
    formula: "if low_income_credit_allowed_without_federal_claim:\n  low_income_unreduced_federal_credit_percentage\
      \ * max(0, unreduced_federal_child_care_credit)\nelse: 0"
- name: middle_income_child_care_expense_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: the credit shall be equal to thirty percent of the federal credit
            for child care expenses claimed on the resident individual's federal tax
            return
  versions:
  - effective_from: '2006-01-01'
    formula: "if child_care_expense_credit_eligibility\n  and federal_adjusted_gross_income\
      \ > middle_income_federal_adjusted_gross_income_lower_bound\n  and federal_adjusted_gross_income\
      \ <= middle_income_federal_adjusted_gross_income_limit:\n  middle_income_claimed_federal_credit_percentage\
      \ * max(0, federal_child_care_credit_claimed_on_federal_return)\nelse: 0"
- name: upper_middle_income_child_care_expense_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(3)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: If the resident individual's federal adjusted gross income is greater
            than thirty-five thousand and less than or equal to sixty thousand dollars,
            the credit shall be equal to ten percent of the federal credit for child
            care expenses claimed on the resident individual's federal tax return.
  versions:
  - effective_from: '2006-01-01'
    formula: "if child_care_expense_credit_eligibility\n  and federal_adjusted_gross_income\
      \ > upper_middle_income_federal_adjusted_gross_income_lower_bound\n  and federal_adjusted_gross_income\
      \ <= upper_middle_income_federal_adjusted_gross_income_limit:\n  upper_income_claimed_federal_credit_percentage\
      \ * max(0, federal_child_care_credit_claimed_on_federal_return)\nelse: 0"
- name: high_income_child_care_expense_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: the credit shall be equal to the lesser of twenty-five dollars
            or ten percent of the federal credit for child care expenses claimed
  versions:
  - effective_from: '2006-01-01'
    formula: "if child_care_expense_credit_eligibility\n  and federal_adjusted_gross_income\
      \ > high_income_federal_adjusted_gross_income_lower_bound:\n  min(high_income_credit_cap,\
      \ upper_income_claimed_federal_credit_percentage * max(0, federal_child_care_credit_claimed_on_federal_return))\n\
      else: 0"
- name: child_care_expense_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(1)-(4)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: The credit shall be calculated using the following percentages
  versions:
  - effective_from: '2006-01-01'
    formula: 'low_income_child_care_expense_credit

      + middle_income_child_care_expense_credit

      + upper_middle_income_child_care_expense_credit

      + high_income_child_care_expense_credit'
- name: child_care_expense_credit_refundable_overpayment
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(B)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: exceeds the amount of such individual's tax liability for the taxable
            year, then such excess tax credit shall constitute an overpayment
  versions:
  - effective_from: '2006-01-01'
    formula: "if child_care_expense_credit_eligibility\n  and federal_adjusted_gross_income\
      \ <= low_income_federal_adjusted_gross_income_limit:\n  max(0, child_care_expense_credit\
      \ - louisiana_income_tax_liability)\nelse: 0"
- name: child_care_credit_refund_exempt_from_overpayment_requirements
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: La. R.S. 47:297.4(B)(1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: shall not be subject to the requirements of R.S. 47:1621(B)
  versions:
  - effective_from: '2006-01-01'
    formula: child_care_expense_credit_refundable_overpayment > 0
- name: child_care_expense_credit_carryforward_eligibility
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: La. R.S. 47:297.4(B)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: resident individuals whose federal adjusted gross income is greater
            than twenty-five thousand dollars exceeds the amount of such individual's
            tax liability
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: period not exceeding five years
  versions:
  - effective_from: '2006-01-01'
    formula: 'child_care_expense_credit_eligibility

      and federal_adjusted_gross_income > middle_income_federal_adjusted_gross_income_lower_bound

      and child_care_expense_credit > louisiana_income_tax_liability

      and carryforward_age_in_years <= excess_credit_carryforward_year_limit'
- name: child_care_expense_credit_carryforward
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(B)(2)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: such excess tax credit may be carried forward as a credit against
            any subsequent tax liability
  versions:
  - effective_from: '2006-01-01'
    formula: "if child_care_expense_credit_carryforward_eligibility:\n  max(0, child_care_expense_credit\
      \ - louisiana_income_tax_liability)\nelse: 0"
