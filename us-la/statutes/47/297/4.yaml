- name: low_income_child_care_expense_credit
  kind: derived
  entity: Person
  dtype: Money
  unit: USD
  period: Year
  source: La. R.S. 47:297.4(A)(1)(a)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: credit shall be calculated based on the federal tax credit before
            it is reduced
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: twenty-five percent of the unreduced federal credit
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-la/statute/47:297.4
          excerpt: fifty percent of the unreduced federal credit
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/297/4#low_income_credit_allowed_without_federal_claim
          output: low_income_credit_allowed_without_federal_claim
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: us-la:statutes/47/297/4#low_income_unreduced_federal_credit_percentage
          output: low_income_unreduced_federal_credit_percentage
          hash: sha256:local
  versions:
  - effective_from: '2006-01-01'
    formula: "if low_income_credit_allowed_without_federal_claim:\n  low_income_unreduced_federal_credit_percentage\n\
      \  * max(0, unreduced_federal_child_care_credit)\nelse: 0"
