format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-la/statute/47:295
    source_sha256: 4ed6c1f6ba4d139958048efe17bd95386bb5158911671ea9b02cc3f9254ab959
  summary: '“There is imposed an income tax for each taxable year upon the Louisiana

    income of every individual, whether resident or nonresident.” Beginning

    January 1, 2016, penalty waivers exceeding twenty-five thousand dollars are

    subject to committee oversight, except qualifying voluntary-disclosure

    waivers. The secretary may require a complete federal return copy or a

    requested part to be filed; filed material becomes part of the Louisiana

    return.'
  deferred_outputs:
  - output: us-la:statutes/47/295/a#individual_louisiana_income_tax_amount
    reason: us-la/statute/47:295(a) requires the individual Louisiana income tax amount
      to be determined in accordance with R.S. 47:32, but the available R.S. 47:32
      RuleSpec exports only the individual income tax rate and lacks an executable
      tax-amount computation accepting the applicable Louisiana income or net-income
      tax base.
rules:
- name: individual_louisiana_income_tax_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: R.S. 47:295(A)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-la/statute/47:295
          excerpt: upon the Louisiana income of every individual, whether resident
            or nonresident
  versions:
  - effective_from: '0001-01-01'
    formula: 'true'
- name: penalty_waiver_oversight_threshold
  kind: parameter
  dtype: Money
  unit: USD
  period: Day
  source: R.S. 47:295(B)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-la/statute/47:295
          excerpt: penalties exceeding twenty-five thousand dollars
      - path: versions[0].effective_from
        kind: effective_period
        source:
          corpus_citation_path: us-la/statute/47:295
          excerpt: beginning January 1, 2016
  versions:
  - effective_from: '2016-01-01'
