format: rulespec/v1
module:
  summary: |-
    Simplified Reporting changes must be reported no later than the 10th calendar day from the end of the month in which the increase or change occurred.
    This is a cash prize won in a single game.
  source_verification:
    corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
    source_sha256: edcca2bc0c174cff32d23f11b35655ab59d6f0f2496f0ea337bcf2f7045e640b
  proof_validation:
    required: true
inputs:
  - name: simplified_reporting_change_occurred
    entity: Household
    dtype: Boolean
    period: Month
  - name: change_was_reported
    entity: Household
    dtype: Boolean
    period: Month
  - name: change_report_calendar_days_after_change_month_end
    entity: Household
    dtype: Integer
    period: Month
  - name: household_is_srr
    entity: Household
    dtype: Boolean
    period: Month
  - name: member_received_lottery_gambling_prize_award_or_windfall_cash_prize_in_single_game
    entity: Household
    dtype: Boolean
    period: Month
  - name: single_game_cash_prize_gross_amount
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: winnings_were_reported
    entity: Household
    dtype: Boolean
    period: Month
  - name: winnings_report_calendar_days_after_receipt_month_end
    entity: Household
    dtype: Integer
    period: Month
rules:
  - name: simplified_reporting_deadline_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3720, block-5, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "no later than the 10th calendar day from the end of the month"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: substantial_winnings_threshold
    kind: parameter
    dtype: Money
    unit: USD
    source: Georgia SNAP Manual 3720, block-5, second paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "a gross amount of $4500 or more (before taxes or other amounts are withheld)"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          4500
  - name: winnings_reporting_deadline_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3720, block-5, second paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "no later than 10 calendar days of the end of the month in which the household receives the winnings"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: simplified_reporting_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Manual 3720, block-5, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "Simplified Reporting changes must be reported no later than the 10th calendar day from the end of the month in which the increase or change occurred."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          not simplified_reporting_change_occurred
          or (change_was_reported and change_report_calendar_days_after_change_month_end <= simplified_reporting_deadline_days)
  - name: substantial_winnings_report_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Manual 3720, block-5, second paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "SRR AUs must report when an AU member receives substantial winnings from lottery winnings, gambling winnings, prizes, awards and/or windfalls."
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "This is a cash prize won in a single game."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "with a gross amount of $4500 or more (before taxes or other amounts are withheld)"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          household_is_srr
          and member_received_lottery_gambling_prize_award_or_windfall_cash_prize_in_single_game
          and single_game_cash_prize_gross_amount >= substantial_winnings_threshold
  - name: winnings_reporting_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Manual 3720, block-5, second paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3720/block-5
              excerpt: "the AU must report these winnings no later than 10 calendar days of the end of the month in which the household receives the winnings."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          not substantial_winnings_report_required
          or (winnings_were_reported and winnings_report_calendar_days_after_receipt_month_end <= winnings_reporting_deadline_days)
