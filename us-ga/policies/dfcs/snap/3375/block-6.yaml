format: rulespec/v1
module:
  summary: |-
    Upfront transportation payments are given only to participants who need them to begin participation in SNAP Works Program activities. An upfront payment of $25 may be given to begin participation only for the first month of an activity.
  source_verification:
    corpus_citation_path: us-ga/manual/dfcs/snap/3375/block-6
    source_sha256: 9b55894d8fb3be90b071b8d489f922379e1509267afb5f4bd363b755473c7087
  proof_validation:
    required: true
inputs:
  - name: is_snap_works_participant
    entity: Person
    dtype: Boolean
    period: Month
  - name: needs_upfront_transportation_to_begin_activity
    entity: Person
    dtype: Boolean
    period: Month
  - name: is_first_month_of_activity
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: upfront_transportation_payment_amount
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Georgia SNAP Policy Manual 3375, block-6, sentence 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3375/block-6
              excerpt: An upfront payment of $25 may be given
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          25
  - name: upfront_transportation_payment_available_amount
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Georgia SNAP Policy Manual 3375, block-6, sentences 1–2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3375/block-6
              excerpt: Upfront transportation payments are given only to participants who need them to begin participation in SNAP Works Program activities.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3375/block-6
              excerpt: An upfront payment of $25 may be given to begin participation only for the first month of an activity.
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if is_snap_works_participant and needs_upfront_transportation_to_begin_activity and is_first_month_of_activity: upfront_transportation_payment_amount else: 0
