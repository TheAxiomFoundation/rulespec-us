format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
    source_sha256: b096de2d6b7130f4c11e1091790d597aea887e5db9e724067dc800f39e691907
  summary: |-
    The AU has 10 calendar days from the date verification is requested to provide any required verification.
    The exception to this policy is Expedited Changes.
    Allow 14-day timely notice.
  interpretations:
    - id: shelter-failure-overlap
      status: open
      question: How does retaining the original benefit amount interact with removing an unverified shelter deduction?
      texts:
        - corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
          excerpt: "If the AU fails to provide verification within the 10 days, leave the benefits at the original amount prior to the reported change."
        - corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
          excerpt: "If the AU fails to provide verification within 10 days, remove the shelter or child support deduction, allowing 14 days timely notice."
      reading: The original-benefit instruction governs unverified allowable-deduction increases other than child support; the final sentence separately requires removal of an unverified shelter or child support deduction. Both requirements are exposed without calculating a reconciled benefit amount.
      alternatives:
        - id: shelter-removal-controls
          reading: The final shelter-removal instruction displaces the original-benefit instruction whenever the reported deduction is shelter.
      basis: The source expressly states both instructions but does not explain their overlap for shelter deductions.
      affects:
        - retain_original_benefits
        - remove_unverified_deduction
    - id: expedited-timing-exception
      status: open
      question: Which deadlines are displaced by the Expedited Changes exception?
      texts:
        - corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
          excerpt: "If the verification is provided timely and the change would result in an increase in benefits, the change in the benefit level must be effective no later than the second subsequent month following the month the change was reported."
        - corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
          excerpt: "The exception to this policy is Expedited Changes."
      reading: The exception displaces the ordinary second-subsequent-month increase limit, including its later deduction-specific restatements. This module does not supply the expedited replacement deadline.
      alternatives:
        - id: all-change-processing-deadlines
          reading: The exception also displaces the preceding verification and agency-action periods.
      basis: The exception immediately follows the general benefit-increase timing sentence, while the source supplies no expedited deadline.
      affects:
        - increase_effective_month_limit
        - allowable_deduction_increase_effective_month_limit
        - child_support_increase_effective_month_limit
inputs:
  - name: verification_provided
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_days_after_request
    entity: Household
    dtype: Integer
    period: Month
  - name: agency_days_after_request
    entity: Household
    dtype: Integer
    period: Month
  - name: verification_later_in_request_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: agency_days_after_verification
    entity: Household
    dtype: Integer
    period: Month
  - name: change_increases_benefits
    entity: Household
    dtype: Boolean
    period: Month
  - name: expedited_change
    entity: Household
    dtype: Boolean
    period: Month
  - name: deduction_class
    entity: Household
    dtype: String
    period: Month
  - name: change_requires_closure_if_unverified
    entity: Household
    dtype: Boolean
    period: Month
  - name: closure_pending_for_missing_verification
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_before_closure
    entity: Household
    dtype: Boolean
    period: Month
  - name: deduction_removal_pending_for_missing_verification
    entity: Household
    dtype: Boolean
    period: Month
  - name: verification_before_deduction_change
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: verification_period_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3715, block 11, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "The AU has 10 calendar days from the date verification is requested"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: initial_agency_action_period_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3715, block 11, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "The agency has the same 10-day period to verify and to act on the reported change."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: late_verification_action_period_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3715, block 11, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "the agency has 10 days from the date verification is provided to act on the change."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: increase_month_offset_limit
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3715, block 11, benefit-increase timing sentences
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "no later than the second subsequent month following the month the change was reported."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          2
  - name: timely_notice_period_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3715, block 11, closure and deduction-removal notices
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "Allow 14-day timely notice."
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "allowing 14 days timely notice."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          14
  - name: reinstatement_period_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3715, block 11, closure paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "reinstate the case within 10 days from the date the verification is provided."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: deduction_change_period_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual 3715, block 11, final sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "make the change in the new shelter or child support deduction within 10 days from the date the verification is provided."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: verification_timely
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Manual 3715, block 11, first sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "The AU has 10 calendar days from the date verification is requested to provide any required verification."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          verification_provided
          and verification_days_after_request <= verification_period_days
  - name: initial_agency_action_timely
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Manual 3715, block 11, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "The agency has the same 10-day period to verify and to act on the reported change."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          agency_days_after_request <= initial_agency_action_period_days
  - name: late_verification_action_days_limit
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "If verification is not provided during the 10-day period but is provided at a later date during the month, the agency has 10 days from the date verification is provided to act on the change."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if verification_days_after_request > verification_period_days and verification_later_in_request_month: late_verification_action_period_days else: -1
  - name: increase_effective_month_limit
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, general increase and expedited exception
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "If the verification is provided timely and the change would result in an increase in benefits, the change in the benefit level must be effective no later than the second subsequent month following the month the change was reported."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "The exception to this policy is Expedited Changes."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if verification_timely and change_increases_benefits and not expedited_change: increase_month_offset_limit else: -1
  - name: allowable_deduction_increase_effective_month_limit
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, allowable-deduction increase paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "Reported changes that would result in an increase in benefits and is an allowable deduction (other than child support) and the verification is provided within the 10 days, the change is effective no later than the second subsequent month following the month the change was reported."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "The exception to this policy is Expedited Changes."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if verification_timely and change_increases_benefits and (deduction_class == "allowable_other" or deduction_class == "shelter") and not expedited_change: increase_month_offset_limit else: -1
  - name: child_support_increase_effective_month_limit
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, child-support increase paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "If the change would result in an increase in benefits, the change is in the child support deduction, and the verification is provided within 10 days, make the change effective no later than the second subsequent month following the month the change was reported."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "The exception to this policy is Expedited Changes."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if verification_timely and change_increases_benefits and deduction_class == "child_support" and not expedited_change: increase_month_offset_limit else: -1
  - name: closure_notice_days
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, closure paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "For some changes, failure by the AU to provide verification within 10 days results in the termination of benefits. Allow 14-day timely notice."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if not verification_timely and change_requires_closure_if_unverified: timely_notice_period_days else: -1
  - name: reinstatement_days_limit
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, closure paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "If verification is provided prior to the effective date of the closure, reinstate the case within 10 days from the date the verification is provided."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if closure_pending_for_missing_verification and verification_before_closure: reinstatement_period_days else: -1
  - name: retain_original_benefits
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Manual 3715, block 11, allowable-deduction failure paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "Reported changes that would result in an increase in benefits and is an allowable deduction (other than child support)"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "If the AU fails to provide verification within the 10 days, leave the benefits at the original amount prior to the reported change."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          change_increases_benefits
          and (deduction_class == "allowable_other" or deduction_class == "shelter")
          and not verification_timely
  - name: remove_unverified_deduction
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Manual 3715, block 11, final paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "If the AU fails to provide verification within 10 days, remove the shelter or child support deduction"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          (deduction_class == "shelter" or deduction_class == "child_support")
          and not verification_timely
  - name: deduction_removal_notice_days
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, final paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "remove the shelter or child support deduction, allowing 14 days timely notice."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if remove_unverified_deduction: timely_notice_period_days else: -1
  - name: verified_deduction_change_days_limit
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Georgia SNAP Manual 3715, block 11, final sentence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3715/block-11
              excerpt: "If verification is provided prior to the effective date of the change, make the change in the new shelter or child support deduction within 10 days from the date the verification is provided."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if deduction_removal_pending_for_missing_verification and verification_before_deduction_change: deduction_change_period_days else: -1
# Integer deadline outputs use -1 when this source's particular deadline does
# not apply. Month limits are offsets from the month the change was reported;
# day limits are measured from the event expressly named in each rule.
# There are no printed structural branch markers in this source unit.
# deduction_class distinguishes allowable_other, shelter, child_support, and
# other. The first two denote allowable deductions other than child support.
