format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ga/manual/dfcs/snap/3035/block-11
    source_sha256: 19ae08d035a51b682caa5a4ec4eb1feeab4c3946ffb509b50620d9f26dd47c84
  summary: |-
    All attempts must be made to verify an AU’s eligibility for benefits. Verify gross earned income using Truv (if available), pay stubs, Form 809, or a letter from the employer. Verify self-employment income using SteadyIQ (if available), tax files, business records, receipt bills, or written statements of the self-employment earnings from the customer who has the business. Verify gross unearned income using a letter, statement from the source, or Form 139 for contributions/vendor payments.
    The worker must document the circumstances to explain.
inputs:
  - name: income_verification_unobtainable_due_to_employer_agency_or_organization_noncooperation
    entity: Household
    dtype: Boolean
    period: Month
  - name: all_other_income_verification_sources_unavailable
    entity: Household
    dtype: Boolean
    period: Month
  - name: customer_statement_is_best_available_information_as_last_resort
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: best_available_income_information_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Policy Manual 3035, block-11, income-verification fallback and documentation.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3035/block-11
              excerpt: "If verification of income may not be obtained because an employer, agency, or organization has failed to cooperate with the AU and all other sources are unavailable, use the best available information to determine the amount to use in establishing eligibility."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3035/block-11
              excerpt: "The worker must document the circumstances to explain."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          income_verification_unobtainable_due_to_employer_agency_or_organization_noncooperation
          and all_other_income_verification_sources_unavailable
  - name: customer_statement_acceptable_as_income_verification
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Georgia SNAP Policy Manual 3035, block-11, customer statement as last resort.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3035/block-11
              excerpt: "In such situations, the best available information may be accepting the customer’s statement as a last resort."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          best_available_income_information_required
          and customer_statement_is_best_available_information_as_last_resort
