format: rulespec/v1
module:
  summary: 'Step 1 Add the value of the transferred resource to other countable resources.

    Step 2 Subtract the appropriate resource limit.

    Step 4 Notify the AU of the disqualification, the time period it covers, and when
    the AU may reapply for benefits.'
  source_verification:
    corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
    source_sha256: 66b5a4060f73469973e6c4e289ee2296c934eb68067114f4ce00caf570911a42
  proof_validation:
    required: true
  interpretations:
  - id: nonpositive-resource-excess
    status: open
    question: Does the first table band impose a disqualification when resources do
      not exceed the limit?
    texts:
    - corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
      excerpt: Step 2 Subtract the appropriate resource limit.
    - corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
      excerpt: Amount transferred in excess of the resource limit Period of disqualification
        $0 - $249.99 1 month
    reading: Apply the duration table only to positive excess; resources at or below
      the limit produce no disqualification under this calculation.
    alternatives:
    - id: zero-in-first-band
      reading: Apply the first band at exactly zero excess, producing a one-month
        disqualification.
      effect: Resources exactly at the limit produce a one-month disqualification.
    basis: The instruction refers to an excess over the resource limit, but the printed
      first band explicitly begins at zero. The adopted reading requires positive
      excess.
    affects:
    - excess_resource_band
    - disqualification_months
inputs:
- name: transferred_resource_value
  entity: Household
  dtype: Money
  unit: USD
  period: Month
- name: other_countable_resources
  entity: Household
  dtype: Money
  unit: USD
  period: Month
- name: appropriate_resource_limit
  entity: Household
  dtype: Money
  unit: USD
  period: Month
rules:
- name: excess_band_lower_bounds
  kind: parameter
  dtype: Money
  unit: USD
  indexed_by: excess_resource_band
  source: Georgia SNAP Manual 3405, block-14, Step 3 table
  metadata:
    proof:
      atoms:
      - path: versions[0].values
        kind: parameter
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: $0 - $249.99 1 month $250 - $999.99 3 months $1000 - $2999.99 6
            months $3000 - $4999.99 9 months $5000 and up 12 months
  versions:
  - effective_from: '2026-06-01'
    values:
      0: 0
      1: 250
      2: 1000
      3: 3000
      4: 5000
- name: excess_band_upper_bounds
  kind: parameter
  dtype: Money
  unit: USD
  indexed_by: excess_resource_band
  source: Georgia SNAP Manual 3405, block-14, Step 3 table
  metadata:
    proof:
      atoms:
      - path: versions[0].values
        kind: parameter
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: $0 - $249.99 1 month $250 - $999.99 3 months $1000 - $2999.99 6
            months $3000 - $4999.99 9 months
  versions:
  - effective_from: '2026-06-01'
    values:
      0: 249.99
      1: 999.99
      2: 2999.99
      3: 4999.99
- name: disqualification_months_by_band
  kind: parameter
  dtype: Integer
  indexed_by: excess_resource_band
  source: Georgia SNAP Manual 3405, block-14, Step 3 table
  metadata:
    proof:
      atoms:
      - path: versions[0].values
        kind: parameter
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: $0 - $249.99 1 month $250 - $999.99 3 months $1000 - $2999.99 6
            months $3000 - $4999.99 9 months $5000 and up 12 months
  versions:
  - effective_from: '2026-06-01'
    values:
      0: 1
      1: 3
      2: 6
      3: 9
      4: 12
- name: resources_including_transfer
  kind: derived
  entity: Household
  dtype: Money
  unit: USD
  period: Month
  source: Georgia SNAP Manual 3405, block-14, Step 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: Step 1 Add the value of the transferred resource to other countable
            resources.
  versions:
  - effective_from: '2026-06-01'
    formula: transferred_resource_value + other_countable_resources
- name: resource_excess
  kind: derived
  entity: Household
  dtype: Money
  unit: USD
  period: Month
  source: "Georgia SNAP Manual 3405, block-14, Steps 2\u20133"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: Step 2 Subtract the appropriate resource limit. Step 3 Use the
            excess amount to determine the length of disqualification
  versions:
  - effective_from: '2026-06-01'
    formula: max(0, resources_including_transfer - appropriate_resource_limit)
- name: excess_resource_band
  kind: derived
  entity: Household
  dtype: Integer
  period: Month
  source: Georgia SNAP Manual 3405, block-14, Step 3 table
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: Amount transferred in excess of the resource limit
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: $0 - $249.99 1 month $250 - $999.99 3 months $1000 - $2999.99 6
            months $3000 - $4999.99 9 months $5000 and up 12 months
  versions:
  - effective_from: '2026-06-01'
    formula: 'if resource_excess <= excess_band_lower_bounds[0]: -1

      else: if resource_excess <= excess_band_upper_bounds[0]: 0

      else: if resource_excess >= excess_band_lower_bounds[1] and resource_excess
      <= excess_band_upper_bounds[1]: 1

      else: if resource_excess >= excess_band_lower_bounds[2] and resource_excess
      <= excess_band_upper_bounds[2]: 2

      else: if resource_excess >= excess_band_lower_bounds[3] and resource_excess
      <= excess_band_upper_bounds[3]: 3

      else: if resource_excess >= excess_band_lower_bounds[4]: 4

      else: -1'
- name: disqualification_months
  kind: derived
  entity: Household
  dtype: Integer
  period: Month
  source: "Georgia SNAP Manual 3405, block-14, introductory instruction and Steps\
    \ 3\u20134"
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: 'Follow the steps below to determine the length of a disqualification
            period resulting from a transfer of resources:'
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: Step 3 Use the excess amount to determine the length of disqualification
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-ga/manual/dfcs/snap/3405/block-14
          excerpt: Step 4 Notify the AU of the disqualification, the time period it
            covers, and when the AU may reapply for benefits.
  versions:
  - effective_from: '2026-06-01'
    formula: 'if excess_resource_band == -1: 0 else: disqualification_months_by_band[excess_resource_band]'
