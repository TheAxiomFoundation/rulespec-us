format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ga/manual/dfcs/snap/appendix-b-administrative-disqualification-hearings/block-6
    source_sha256: a2648c84debebcf3bdcd42990fc984b11c1f7a4bb94de700c72e00d0a6c93858
  summary: |-
    The hearing officer postpones the scheduled hearing with the following conditions:
    The individual requested the postponement at least 10 days in advance of the scheduled ADH
    The hearing is not postponed for more than 30 days
    The hearing is postponed one time only.
inputs:
  - name: postponement_request_days_before_scheduled_adh
    entity: Person
    dtype: Integer
    period: Day
  - name: requested_hearing_postponement_days
    entity: Person
    dtype: Integer
    period: Day
  - name: hearing_has_not_previously_been_postponed
    entity: Person
    dtype: Boolean
    period: Day
rules:
  - name: minimum_postponement_request_notice_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual Appendix B, block-6, request timing condition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/appendix-b-administrative-disqualification-hearings/block-6
              excerpt: "at least 10 days in advance of the scheduled ADH"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          10
  - name: maximum_hearing_postponement_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Manual Appendix B, block-6, postponement duration condition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/appendix-b-administrative-disqualification-hearings/block-6
              excerpt: "The hearing is not postponed for more than 30 days"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          30
  - name: scheduled_adh_postponement_conditions_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Day
    source: Georgia SNAP Manual Appendix B, block-6, hearing officer postponement and all three conditions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/appendix-b-administrative-disqualification-hearings/block-6
              excerpt: "The hearing officer postpones the scheduled hearing with the following conditions:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/appendix-b-administrative-disqualification-hearings/block-6
              excerpt: "The individual requested the postponement at least 10 days in advance of the scheduled ADH"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/appendix-b-administrative-disqualification-hearings/block-6
              excerpt: "The hearing is not postponed for more than 30 days"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/appendix-b-administrative-disqualification-hearings/block-6
              excerpt: "The hearing is postponed one time only."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          postponement_request_days_before_scheduled_adh >= minimum_postponement_request_notice_days
          and requested_hearing_postponement_days <= maximum_hearing_postponement_days
          and hearing_has_not_previously_been_postponed
