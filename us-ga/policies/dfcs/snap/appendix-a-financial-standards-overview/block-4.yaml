  summary: |-
    The Basis of Issuance (BOI) tables are issued annually by the USDA Food and Nutrition Service (FNS) based on the Consumer Price Index. The BOI tables are valid for the federal fiscal year (FFY) which runs from October 1 of the current year through September 30 of the following year.

    The income limits are based on the Federal Poverty Level (FPL) income limits and are updated annually.
