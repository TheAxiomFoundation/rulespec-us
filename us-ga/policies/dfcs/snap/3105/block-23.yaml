format: rulespec/v1
module:
  summary: |-
    Determine eligibility and, if eligible, provide the opportunity to participate by the appropriate SOP. Participation is defined as the AU having their EBT card, PIN, and benefits available in their EBT account by the 7 th day for expedited applications and by the 30 th day for non-expedited applications following the date of application.
  source_verification:
    corpus_citation_path: us-ga/manual/dfcs/snap/3105/block-23
    source_sha256: 980ad57adbb7a68d556b53152a257563738718bdfc32aa985ed8065c8d46a946
  proof_validation:
    required: true
inputs:
  - name: application_is_expedited
    entity: Household
    dtype: Boolean
    period: Day
  - name: ebt_card_received_days_after_application
    entity: Household
    dtype: Integer
    period: Day
  - name: pin_received_days_after_application
    entity: Household
    dtype: Integer
    period: Day
  - name: benefits_available_in_ebt_account_days_after_application
    entity: Household
    dtype: Integer
    period: Day
rules:
  - name: expedited_participation_deadline_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Policy Manual 3105, block-23
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3105/block-23
              excerpt: "by the 7 th day for expedited applications"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          7
  - name: nonexpedited_participation_deadline_days
    kind: parameter
    dtype: Integer
    source: Georgia SNAP Policy Manual 3105, block-23
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3105/block-23
              excerpt: "by the 30 th day for non-expedited applications following the date of application."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          30
  - name: participation_deadline_days
    kind: derived
    entity: Household
    dtype: Integer
    period: Day
    source: Georgia SNAP Policy Manual 3105, block-23
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3105/block-23
              excerpt: "by the 7 th day for expedited applications and by the 30 th day for non-expedited applications following the date of application."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if application_is_expedited: expedited_participation_deadline_days else: nonexpedited_participation_deadline_days
  - name: participation_by_processing_deadline
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: Georgia SNAP Policy Manual 3105, block-23
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ga/manual/dfcs/snap/3105/block-23
              excerpt: "Participation is defined as the AU having their EBT card, PIN, and benefits available in their EBT account"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          ebt_card_received_days_after_application <= participation_deadline_days
          and pin_received_days_after_application <= participation_deadline_days
          and benefits_available_in_ebt_account_days_after_application <= participation_deadline_days
