# These fixtures test only the annual O.C.G.A. § 48-7-20 tax on supplied
# completed Georgia taxable net income before nonrefundable credits. They do
# not construct filing status, deductions, exemptions, exclusions, Form 500
# final liability, or estimated tax.
- name: zero_completed_taxable_net_income
  period:
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    us-ga:policies/income_tax/2026_annual_tax_before_nonrefundable_credits#input.ga_pit_2026_completed_georgia_taxable_net_income: 0
  output:
    us-ga:policies/income_tax/2026_annual_tax_before_nonrefundable_credits#ga_pit_2026_annual_input_is_nonnegative: holds
    us-ga:policies/income_tax/2026_annual_tax_before_nonrefundable_credits#ga_pit_2026_annual_tax_before_nonrefundable_credits: '0'

- name: negative_completed_taxable_net_income_fails_closed
  period:
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    us-ga:policies/income_tax/2026_annual_tax_before_nonrefundable_credits#input.ga_pit_2026_completed_georgia_taxable_net_income: -1000
  output:
    us-ga:policies/income_tax/2026_annual_tax_before_nonrefundable_credits#ga_pit_2026_annual_input_is_nonnegative: not_holds
    us-ga:policies/income_tax/2026_annual_tax_before_nonrefundable_credits#ga_pit_2026_annual_tax_before_nonrefundable_credits: '0'

