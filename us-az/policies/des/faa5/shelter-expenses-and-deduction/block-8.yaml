format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-8
    source_sha256: c0d6147e8bda3a55ddf134b7c2e66a27cf685ea5e6274f9ab674c9970bd6bc7c
  summary: |-
    A housing allowance is allowed when a CA budgetary unit pays rent to an NA budgetary unit and both are part of the same NA case. The housing allowance allows the A1 Payment Standard, but does not allow the rent amount as an additional expense for NA.
