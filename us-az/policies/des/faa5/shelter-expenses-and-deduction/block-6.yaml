format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
    source_sha256: 344e7318d19c5fcb5392ce7d7463ba26dc3b2d27b8fdc8240ea71c29a0faf78d
  summary: |-
    Disaster cost expenses, including charges for the repair of a home damaged or destroyed by a natural disaster, such as a fire or flood, are allowable for NA only.
    However, the cost of repair or replacement that has been or is to be reimbursed by relief agencies, insurance companies, or other sources is not an allowable expense.
inputs:
  - name: assistance_is_na
    entity: Household
    dtype: Boolean
    period: Month
  - name: budgetary_unit_shelter_damaged_by_natural_disaster
    entity: Household
    dtype: Boolean
    period: Month
  - name: disaster_cost_expense_incurred_or_billed
    entity: Household
    dtype: Boolean
    period: Month
  - name: disaster_cost_expense_amount
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: repair_or_replacement_portion_reimbursed_or_to_be_reimbursed
    entity: Household
    dtype: Money
    unit: USD
    period: Month
  - name: participant_selects_one_time_deduction
    entity: Household
    dtype: Boolean
    period: Month
  - name: month_is_after_month_expense_incurred_or_billed
    entity: Household
    dtype: Boolean
    period: Month
  - name: month_is_on_or_after_change_effective_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: month_is_on_or_before_na_approval_period_end
    entity: Household
    dtype: Boolean
    period: Month
  - name: months_from_change_effective_month_through_na_approval_period_end
    entity: Household
    dtype: Count
    period: Month
rules:
  - name: monthly_disaster_cost_deduction
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Arizona DES FAA5, Shelter Expenses and Deduction, disaster cost expenses and participant deduction options
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
              excerpt: A disaster cost expense exists when there is damage to the budgetary unit’s shelter caused by a natural disaster.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
              excerpt: Disaster cost expenses, including charges for the repair of a home damaged or destroyed by a natural disaster, such as a fire or flood, are allowable for NA only.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
              excerpt: However, the cost of repair or replacement that has been or is to be reimbursed by relief agencies, insurance companies, or other sources is not an allowable expense.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
              excerpt: Designation of a disaster area by a local, state, or federal agency is not required. Implementation of the Disaster Nutrition Assistance Program (DNAP) is not required.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
              excerpt: "The participant has the option of one of the following:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
              excerpt: A one-time deduction for the month after the month the expense is incurred or billed.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-6
              excerpt: Averaging the expense through the end of the NA approval period starting with the month the change became effective.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if assistance_is_na
          and budgetary_unit_shelter_damaged_by_natural_disaster
          and disaster_cost_expense_incurred_or_billed:
            if participant_selects_one_time_deduction:
              if month_is_after_month_expense_incurred_or_billed:
                max(0, disaster_cost_expense_amount - repair_or_replacement_portion_reimbursed_or_to_be_reimbursed)
              else: 0
            else:
              if month_is_on_or_after_change_effective_month
              and month_is_on_or_before_na_approval_period_end:
                max(0, disaster_cost_expense_amount - repair_or_replacement_portion_reimbursed_or_to_be_reimbursed)
                / months_from_change_effective_month_through_na_approval_period_end
              else: 0
          else: 0
