format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-15
  summary: |-
    Property taxes, (state and local assessments on the structure or the property itself, billed separately from the mortgage), are allowable shelter expense deductions for NA.
    These expenses are averaged over the number of months the bill is intended to cover, no matter how long the approval period is or when it started.
inputs:
  - name: property_tax_bill_amount
    entity: Household
    dtype: Money
    period: Month
    unit: USD
  - name: property_taxes_billed_separately_from_mortgage
    entity: Household
    dtype: Boolean
    period: Month
  - name: months_property_tax_bill_is_intended_to_cover
    entity: Household
    dtype: Count
    period: Month
rules:
  - name: monthly_property_tax_shelter_expense
    kind: derived
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: DES FAA5 Shelter Expenses and Deduction, property taxes and averaging note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-15
              excerpt: "Property taxes, (state and local assessments on the structure or the property itself, billed separately from the mortgage), are allowable shelter expense deductions for NA."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-15
              excerpt: "These expenses are averaged over the number of months the bill is intended to cover, no matter how long the approval period is or when it started."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if property_taxes_billed_separately_from_mortgage:
            property_tax_bill_amount / months_property_tax_bill_is_intended_to_cover
          else: 0
