format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-16
  summary: |-
    Expenses must be verified when any of the following occur:
    ● New application
    ● Renewal application
    ● When a reported change in the expense or address is received (See Effecting Changes for change information)
    ● When the expense amount is questionable(g)
inputs:
  - name: new_application
    entity: Household
    dtype: Boolean
    period: Month
  - name: renewal_application
    entity: Household
    dtype: Boolean
    period: Month
  - name: reported_shelter_expense_change_received
    entity: Household
    dtype: Boolean
    period: Month
  - name: reported_address_change_received
    entity: Household
    dtype: Boolean
    period: Month
  - name: shelter_expense_amount_is_questionable
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: shelter_expense_verification_required
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, Shelter Expenses and Deduction, block-16
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-16
              excerpt: "Expenses must be verified when any of the following occur:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-16
              excerpt: New application
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-16
              excerpt: Renewal application
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-16
              excerpt: When a reported change in the expense or address is received
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-16
              excerpt: When the expense amount is questionable(g)
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          new_application
          or renewal_application
          or reported_shelter_expense_change_received
          or reported_address_change_received
          or shelter_expense_amount_is_questionable
