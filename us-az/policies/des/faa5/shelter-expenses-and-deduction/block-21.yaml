  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-21
    source_sha256: ffc21dc1d0c72aad73427b7df0a4ab5053f98e1d2e6fd0923b39344e9dcc6b9d
  summary: |-
    Examples of verification that can be used for rental space include, and are not limited to, any of the following:

    ● Rental space receipt
    ● Lease
    ● Collateral contact to the rental agent

    NOTE Collateral contact can only be made to clarify documented verification the participant has provided or when the participant asks for assistance.
