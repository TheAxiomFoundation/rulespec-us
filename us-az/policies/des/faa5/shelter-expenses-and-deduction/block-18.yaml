format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-18
  summary: |-
    Examples of verification that can be used for shelter insurance include, and are not limited to, any the following:
    ● Insurance bill
    ● Insurance receipt
    ● Collateral contact to the insurance company
    ● Yearly escrow statement from mortgage lender
    ● Authority To Release Information (FAA-1765A) form completed by the insurance agency
inputs:
  - name: insurance_company_contact_clarifies_documented_verification_provided_by_participant
    entity: Person
    dtype: Boolean
    period: Month
  - name: participant_asks_for_assistance
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: shelter_insurance_collateral_contact_permitted
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 shelter expenses and deduction, shelter insurance verification, NOTE
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-18
              excerpt: Collateral contact can only be made to clarify documented verification the participant has provided or when the participant asks for assistance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          insurance_company_contact_clarifies_documented_verification_provided_by_participant
          or participant_asks_for_assistance
