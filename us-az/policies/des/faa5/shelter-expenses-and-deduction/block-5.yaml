format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-5
    source_sha256: d2c5355e335d601e702fa83f38ba281aca248e3a4e33b3c2b4eb50ddd2108b60
  summary: |-
    Shelter costs of a temporarily unoccupied residence are allowable for NA only when all of the following apply:
    The budgetary unit intends to return to the residence.
    The residence is not leased or rented to others.
    The residence is unoccupied for any of the following reasons:
    Illness
    Employment or training away from home
    Abandonment caused by a natural disaster or casualty loss(g)
inputs:
  - name: residence_is_temporarily_unoccupied
    entity: Household
    dtype: Boolean
    period: Month
  - name: budgetary_unit_intends_to_return_to_residence
    entity: Household
    dtype: Boolean
    period: Month
  - name: residence_is_leased_or_rented_to_others
    entity: Household
    dtype: Boolean
    period: Month
  - name: residence_is_unoccupied_due_to_illness
    entity: Household
    dtype: Boolean
    period: Month
  - name: residence_is_unoccupied_due_to_employment_or_training_away_from_home
    entity: Household
    dtype: Boolean
    period: Month
  - name: residence_is_unoccupied_due_to_abandonment_caused_by_natural_disaster_or_casualty_loss
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: temporarily_unoccupied_residence_shelter_costs_allowable_for_na
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: DES FAA5 Shelter Expenses and Deduction, temporarily unoccupied residence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-5
              excerpt: "Shelter costs of a temporarily unoccupied residence are allowable for NA only when all of the following apply:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-5
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          residence_is_temporarily_unoccupied
          and budgetary_unit_intends_to_return_to_residence
          and not residence_is_leased_or_rented_to_others
          and (
            residence_is_unoccupied_due_to_illness
            or residence_is_unoccupied_due_to_employment_or_training_away_from_home
            or residence_is_unoccupied_due_to_abandonment_caused_by_natural_disaster_or_casualty_loss
          )
