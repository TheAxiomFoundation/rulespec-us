format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-20
  summary: |-
    Examples of verification that can be used for rent include, and are not limited to, any of the following:
    ● Rent receipt
    ● Collateral contact to the landlord
    ● Lease
    ● Verification of a residential fee to live in a Group Living Arrangement (GLA)
    ● Verification of Living Arrangements/Residential Address (FAA-0065A) form
    NOTE Collateral contact can only be made to clarify documented verification the participant has provided or when the participant asks for assistance.
inputs:
  - name: landlord_contact_clarifies_documented_verification_provided_by_participant
    entity: Person
    dtype: Boolean
    period: Month
  - name: participant_asks_for_assistance
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: landlord_collateral_contact_permitted
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, rent verification examples and collateral-contact note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-20
              excerpt: Collateral contact can only be made to clarify documented verification the participant has provided or when the participant asks for assistance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          landlord_contact_clarifies_documented_verification_provided_by_participant
          or participant_asks_for_assistance
