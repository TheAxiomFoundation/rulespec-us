format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
    source_sha256: fe9b0dfedc6e82aaeae20f8298bdd13f8d88652ad849781269d6332934b62bce
  summary: |-
    The following shelter insurance expenses are allowable:
    Fire insurance for the residence itself when billed separate from the mortgage.
    Average fire protection mandatory fees over the number of months the bill is intended to cover, no matter how long the approval period is or when it started.
inputs:
  - name: insurance_category
    entity: Payment
    dtype: String
    period: Month
  - name: billed_separately_from_mortgage
    entity: Payment
    dtype: Boolean
    period: Month
  - name: participant_lives_in_insured_vehicle
    entity: Payment
    dtype: Boolean
    period: Month
  - name: coverage_is_required
    entity: Payment
    dtype: Boolean
    period: Month
  - name: mandatory_fire_protection_bill
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
  - name: months_bill_is_intended_to_cover
    entity: Payment
    dtype: Count
    period: Month
rules:
  - name: shelter_insurance_payment_allowable
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: DES FAA5, shelter insurance allowable and not allowable lists
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: "The following shelter insurance expenses are allowable:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: Fire insurance for the residence itself when billed separate from the mortgage.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: This includes mandatory fees billed by a rural fire department for fire protection.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: Vehicle insurance (comprehensive and collision) when the participant is living in the vehicle.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: Lenders Interest Coverage that is a required part of the insurance coverage on the property.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: Private Mortgage Insurance (PMI) required by the lender for protection in case of foreclosure.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: "The following insurance payments are not allowable:"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          ((insurance_category == "fire insurance for residence"
            or insurance_category == "mandatory rural fire department protection fee")
            and billed_separately_from_mortgage)
          or insurance_category == "flood insurance for residence"
          or ((insurance_category == "comprehensive vehicle insurance"
            or insurance_category == "collision vehicle insurance")
            and participant_lives_in_insured_vehicle)
          or ((insurance_category == "lenders interest coverage"
            or insurance_category == "private mortgage insurance")
            and coverage_is_required)
          or insurance_category == "homeowners insurance for house"
          or insurance_category == "rental insurance for structure"
          or insurance_category == "personal liability insurance portion covering structure"
  - name: monthly_mandatory_fire_protection_fee
    kind: derived
    entity: Payment
    dtype: Money
    unit: USD
    period: Month
    source: DES FAA5, mandatory fire protection fee averaging note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-9
              excerpt: Average fire protection mandatory fees over the number of months the bill is intended to cover, no matter how long the approval period is or when it started.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          mandatory_fire_protection_bill / months_bill_is_intended_to_cover
