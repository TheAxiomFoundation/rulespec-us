format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-19
    source_sha256: 8d679639b63a40a5e23315871599d3ee859ee739d8546ae961a8c8ae45d4a095
  summary: |-
    Examples of verification that can be used for mortgage include, and are not limited to, any the following:
    NOTE Collateral contact can only be made to clarify documented verification the participant has provided or when the participant asks for assistance.
inputs:
  - name: mortgage_verification_type
    entity: Person
    dtype: String
    period: Month
  - name: mortgage_company_contact_clarifies_documented_verification_provided_by_participant
    entity: Person
    dtype: Boolean
    period: Month
  - name: participant_asks_for_assistance
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: listed_mortgage_verification_example
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, Shelter Expenses and Deduction, mortgage verification examples and collateral-contact note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-19
              excerpt: "Examples of verification that can be used for mortgage include, and are not limited to, any the following:"
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-19
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-19
              excerpt: Collateral contact can only be made to clarify documented verification the participant has provided or when the participant asks for assistance.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/shelter-expenses-and-deduction/block-19
              excerpt: "Payment booklet or receipts of payments on a vehicle used as a shelter, for one of the following:"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          mortgage_verification_type == "mortgage_receipt"
          or mortgage_verification_type == "mortgage_record"
          or mortgage_verification_type == "mortgage_agreement"
          or mortgage_verification_type == "mortgage_payment_book"
          or mortgage_verification_type == "loan_payment_booklet_for_vehicle_used_as_shelter"
          or mortgage_verification_type == "loan_payment_receipts_for_vehicle_used_as_shelter"
          or mortgage_verification_type == "lease_payment_booklet_for_vehicle_used_as_shelter"
          or mortgage_verification_type == "lease_payment_receipts_for_vehicle_used_as_shelter"
          or (
            mortgage_verification_type == "collateral_contact_to_mortgage_company"
            and (
              mortgage_company_contact_clarifies_documented_verification_provided_by_participant
              or participant_asks_for_assistance
            )
          )
