rules:
  - name: telephone_expense_verification_example_present
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 19
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-19
              excerpt: "Any of the following are examples of what can be used as verification for the telephone expense obligation:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-19
              excerpt: The telephone bill or proof of payment for minutes attached to a specific device
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-19
              excerpt: A receipt from the cell phone service carrier
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-19
              excerpt: A screenshot from the cell phone (when the customer only makes payments through the device) that includes the participant’s name and bill amount
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-19
              excerpt: An email from the cellular phone service provider verifying the expense
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          telephone_bill_present
          or proof_of_payment_for_minutes_attached_to_specific_device_present
          or cell_phone_service_carrier_receipt_present
          or (
            cell_phone_screenshot_present
            and customer_only_makes_payments_through_that_device
            and screenshot_includes_participant_name
            and screenshot_includes_bill_amount
          )
          or cellular_phone_service_provider_email_verifying_expense_present
