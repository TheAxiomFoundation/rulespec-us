format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
    source_sha256: 9bab68c4c8c38bbe78d9bcfdd0c94c28c249c4298b1af43d7e8145e3ceb8fade
  summary: |-
    The expense for basic service fees of landlines or cell phones are allowable when the budgetary unit is obligated to pay any portion of the telephone expense.
# Coverage: encode the general telephone-expense condition and both Lifeline
# alternatives. Separate/itemized billing and billing to another person do not
# defeat allowability when the participant remains responsible for the charges.
# The version date is the first-full-month evidence floor.
inputs:
  - name: budgetary_unit_obligated_to_pay_telephone_expense
    entity: Household
    dtype: Boolean
    period: Month
  - name: telephone_expense_is_basic_landline_or_cell_phone_service
    entity: Household
    dtype: Boolean
    period: Month
  - name: budgetary_unit_participates_in_lifeline
    entity: Household
    dtype: Boolean
    period: Month
  - name: lifeline_discount_does_not_pay_telephone_expense_in_full
    entity: Household
    dtype: Boolean
    period: Month
  - name: extra_airtime_purchased_after_exhausting_free_minutes
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: snap_telephone_expense_allowable
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 14
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: The expense for basic service fees of landlines or cell phones are allowable when the budgetary unit is obligated to pay any portion of the telephone expense.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: When the expense is billed separate from or itemized with rent or mortgage.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: When the participant is responsible for the charges (even when it is billed to another person).
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: "When the budgetary unit participates in the Lifeline Assistance Program, a telephone expense is allowable when one or more of the following apply:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: The discount program does not pay the expense in full
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-14
              excerpt: Extra airtime is purchased after exhausting free minutes
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          budgetary_unit_obligated_to_pay_telephone_expense
          and (
            (
              telephone_expense_is_basic_landline_or_cell_phone_service
              and not budgetary_unit_participates_in_lifeline
            )
            or (
              budgetary_unit_participates_in_lifeline
              and (
                lifeline_discount_does_not_pay_telephone_expense_in_full
                or extra_airtime_purchased_after_exhausting_free_minutes
              )
            )
          )
