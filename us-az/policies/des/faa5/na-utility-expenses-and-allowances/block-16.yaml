format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-16
    source_sha256: 8465882cc769c527e62f247111beeccc7f789a26582d7464d68621069a7742fa
  summary: |-
    The budgetary unit is eligible for SUA when all of the following occur:
    ● The wood, which is purchased or billed separate from or itemized with rent or mortgage payments
    ● The wood is used to produce heat.
# Coverage inventory: chapeau, both bullets, and the own-wood exception: ENCODE.
# All facts concern the same evaluated wood expense of the budgetary unit.
# This output identifies only the wood-expense qualification path.
# A negative result does not deny qualification through other utility sources.
# 2026-08-01 is the first full Month evidence coverage floor following the
# authenticated snapshot, not a legal commencement date. Earlier coverage
# is unproven.
inputs:
  - name: wood_purchased_or_billed_separately_from_rent_or_mortgage
    entity: Household
    dtype: Boolean
    period: Month
  - name: wood_itemized_with_rent_or_mortgage
    entity: Household
    dtype: Boolean
    period: Month
  - name: same_wood_used_to_produce_heat
    entity: Household
    dtype: Boolean
    period: Month
  - name: participant_cuts_same_wood
    entity: Household
    dtype: Boolean
    period: Month
  - name: same_wood_costs_are_only_direct_cutting_costs
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: wood_expense_sua_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 16
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-16
              excerpt: "The budgetary unit is eligible for SUA when all of the following occur:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-16
              excerpt: "The wood, which is purchased or billed separate from or itemized with rent or mortgage payments"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-16
              excerpt: "The wood is used to produce heat."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-16
              excerpt: "The budgetary unit is not eligible for SUA when the participant cuts their own wood and only incurs costs directly related to cutting wood, such as cutting permits, gas for chain saws or trucks, and equipment for cutting the wood."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (
            wood_purchased_or_billed_separately_from_rent_or_mortgage
            or wood_itemized_with_rent_or_mortgage
          )
          and same_wood_used_to_produce_heat
          and not (
            participant_cuts_same_wood
            and same_wood_costs_are_only_direct_cutting_costs
          )
