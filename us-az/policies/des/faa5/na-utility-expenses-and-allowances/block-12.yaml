format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-12
    source_sha256: 46b086f76ada097ff3684475b3ed09e32de9739b1e6cf81e00334c6eba6ef8f1
  summary: |-
    The cost of oil used as a utility, billed separate from or itemized with rent or mortgage payments, is allowable.

    When oil is used to produce heat, the budgetary unit is eligible for SUA.
# Branch inventory: no explicit structural markers.
# First paragraph: ENCODE oil utility cost allowability.
# Second paragraph: ENCODE the independent oil-heating SUA condition.
# The coverage floor is the first full month after the source snapshot;
# it is not a claimed legal commencement date.
inputs:
  - name: budgetary_unit_has_oil_utility_cost
    entity: Household
    dtype: Boolean
    period: Month
  - name: oil_cost_billed_separately_from_rent_or_mortgage
    entity: Household
    dtype: Boolean
    period: Month
  - name: oil_cost_itemized_with_rent_or_mortgage
    entity: Household
    dtype: Boolean
    period: Month
  - name: budgetary_unit_uses_oil_to_produce_heat
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: snap_oil_utility_cost_allowable
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 12, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-12
              excerpt: The cost of oil used as a utility, billed separate from or itemized with rent or mortgage payments, is allowable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          budgetary_unit_has_oil_utility_cost
          and (
            oil_cost_billed_separately_from_rent_or_mortgage
            or oil_cost_itemized_with_rent_or_mortgage
          )
  - name: oil_heating_sua_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 12, second paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-12
              excerpt: When oil is used to produce heat, the budgetary unit is eligible for SUA.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          budgetary_unit_uses_oil_to_produce_heat
