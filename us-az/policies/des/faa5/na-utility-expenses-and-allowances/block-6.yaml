format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-6
    source_sha256: 28e71f468b91b5271757200445184f737a35743398e62809174f00889d62d7d5
  summary: |-
    The cost of coal used as a utility, which is billed separate from or itemized with rent or mortgage payments, is allowable.

    When coal is used to produce heat, the budgetary unit is eligible for SUA.
# Evidence coverage begins with the first full month after the snapshot.
# This date is not a claimed legal commencement.
# Both unnumbered paragraphs are encoded; there are no structural branch markers.
inputs:
  - name: coal_used_as_utility
    entity: Household
    dtype: Boolean
    period: Month
  - name: coal_cost_billed_separately_from_rent_or_mortgage
    entity: Household
    dtype: Boolean
    period: Month
  - name: coal_cost_itemized_with_rent_or_mortgage
    entity: Household
    dtype: Boolean
    period: Month
  - name: coal_used
    entity: Household
    dtype: Boolean
    period: Month
  - name: coal_use_is_for_producing_heat
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: coal_utility_cost_allowable
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 6, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-6
              excerpt: The cost of coal used as a utility, which is billed separate from or itemized with rent or mortgage payments, is allowable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          coal_used_as_utility
          and (
            coal_cost_billed_separately_from_rent_or_mortgage
            or coal_cost_itemized_with_rent_or_mortgage
          )
  - name: coal_heating_sua_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 6, second paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-6
              excerpt: When coal is used to produce heat, the budgetary unit is eligible for SUA.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          coal_used
          and coal_use_is_for_producing_heat
