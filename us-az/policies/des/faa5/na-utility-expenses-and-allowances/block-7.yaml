format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-7
    source_sha256: d6e28c37f00fe8fa56a544db39aa1fdede0e461826d189bf1c72f37f2ef283cd
  summary: |-
    Electricity service expenses billed separate from or itemized with rent or mortgage payments, are allowable.

    When electricity is used to produce heating or cooling, the budgetary unit is eligible for SUA.
# Both paragraphs are encoded; the source contains no structural branch markers.
# Each entity represents one expense component belonging to a budgetary unit.
# All component facts concern that same expense.
# The heating/cooling output identifies this component's SUA qualifying path.
# Its failure does not deny SUA through another expense or eligibility path.
# 2026-08-01 is the first full Month evidence coverage floor following the
# authenticated snapshot, not a legal commencement date. Earlier coverage is unproven.
inputs:
  - name: component_is_electricity_service_expense
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_billed_separately_from_rent_or_mortgage
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_itemized_with_rent_or_mortgage
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_electricity_used_for_heating
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_electricity_used_for_cooling
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
rules:
  - name: snap_electricity_component_allowable
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 7, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-7
              excerpt: Electricity service expenses billed separate from or itemized with rent or mortgage payments, are allowable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          component_is_electricity_service_expense
          and (
            component_billed_separately_from_rent_or_mortgage
            or component_itemized_with_rent_or_mortgage
          )
  - name: electricity_heating_or_cooling_sua_condition
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 7, both paragraphs
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-7
              excerpt: Electricity service expenses billed separate from or itemized with rent or mortgage payments, are allowable.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-7
              excerpt: When electricity is used to produce heating or cooling, the budgetary unit is eligible for SUA.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          snap_electricity_component_allowable
          and (
            component_electricity_used_for_heating
            or component_electricity_used_for_cooling
          )
