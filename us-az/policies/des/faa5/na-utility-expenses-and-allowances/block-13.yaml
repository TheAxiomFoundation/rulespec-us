format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-13
    source_sha256: a96bbc2708e28591092844d0feda039dfca1042fc2298e5bdc61ca638bc42a72
  summary: |-
    The initial utility installation fee is an allowable NA Utility Expense in the month the expense is billed when all of the following occur:
# Each evaluated entity represents one separately identified expense component.
# Boolean factual inputs are implicit, as supported by the pinned engine.
# 2026-08-01 is the first-full-month evidence coverage floor following the
# authenticated 2026-07-17 snapshot, not a legal commencement date.
# Earlier coverage is unproven.
# This helper determines component admissibility only. Consumer rules remain
# responsible for obligation, verification, and allowance substitution.
rules:
  - name: snap_initial_utility_installation_component_allowable
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 13
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-13
              excerpt: |-
                The initial utility installation fee is an allowable NA Utility Expense in the month the expense is billed when all of the following occur:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-13
              excerpt: The utility installation fee is for an initial installation of a utility.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-13
              excerpt: The utility provider performs the installation.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-13
              excerpt: One-time deposits are not an allowable NA Utility Expense.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-13
              excerpt: |-
                Examples of utility installation fees include the following:

                ● Electrical wiring

                ● Gas pipes

                ● Septic tanks

                ● Solar panels

                ● Water pipes
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          component_is_initial_utility_installation_fee
          and installation_performed_by_utility_provider
          and component_billed_in_evaluated_month
          and not component_is_one_time_deposit
