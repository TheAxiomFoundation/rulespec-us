format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-11
    source_sha256: 020f1870ea062b294cf963a0d74478156424729cc21fec2df955460e49c6b4fa
  summary: |-
    Gas, propane, and propane tank rental utility expenses, which are billed separate from or itemized with rent or mortgage payments, are allowable.
    When gas or propane is used as a fuel to produce heat, the budgetary unit is eligible for SUA.
# Coverage inventory: no numbered structural markers.
# Both paragraphs are encoded.
# 2026-08-01 is the first full Month evidence coverage floor after the
# authenticated snapshot, not a legal commencement date. Earlier coverage
# is unproven.
# Each UtilityExpenseComponent represents one expense; its category and
# billing treatment must describe that same expense.
# The heating output identifies this source's SUA condition only.
# not_holds does not deny SUA through another utility source.
inputs:
  - name: component_utility_category
    entity: UtilityExpenseComponent
    dtype: String
    period: Month
  - name: component_billing_treatment
    entity: UtilityExpenseComponent
    dtype: String
    period: Month
  - name: budgetary_unit_uses_gas_as_fuel_to_produce_heat
    entity: Household
    dtype: Boolean
    period: Month
  - name: budgetary_unit_uses_propane_as_fuel_to_produce_heat
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: gas_propane_component_allowable
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 11, first paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-11
              excerpt: Gas, propane, and propane tank rental utility expenses, which are billed separate from or itemized with rent or mortgage payments, are allowable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (
            component_utility_category == "gas"
            or component_utility_category == "propane"
            or component_utility_category == "propane_tank_rental"
          )
          and (
            component_billing_treatment == "separate_from_rent_or_mortgage"
            or component_billing_treatment == "itemized_with_rent_or_mortgage"
          )
  - name: gas_or_propane_heating_sua_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Utility Expenses and Allowances, block 11, second paragraph
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-11
              excerpt: When gas or propane is used as a fuel to produce heat, the budgetary unit is eligible for SUA.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          budgetary_unit_uses_gas_as_fuel_to_produce_heat
          or budgetary_unit_uses_propane_as_fuel_to_produce_heat
