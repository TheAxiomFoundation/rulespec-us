format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-10
    source_sha256: 0fc39d5bf5595dedb932b2c8e951771c8b0545c0dbb24d6f7a90c5cf5b63d26c
  summary: |-
    The following utility expenses billed separate from or itemized with rent or mortgage payments, are allowable:
    ● Garbage
    ● Sewer
    ● Trash
    ● Portable toilet rental when no bathroom exists
    ● Septic maintenance
inputs:
  - name: component_type
    entity: UtilityExpenseComponent
    dtype: String
    period: Month
  - name: component_billed_separately_from_rent_or_mortgage
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: component_itemized_with_rent_or_mortgage
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
  - name: bathroom_exists
    entity: UtilityExpenseComponent
    dtype: Boolean
    period: Month
rules:
  - name: snap_sanitation_utility_component_allowable
    kind: derived
    entity: UtilityExpenseComponent
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, D NA Utility Expenses and Allowances, block 10
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-10
              excerpt: "The following utility expenses billed separate from or itemized with rent or mortgage payments, are allowable:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-10
              excerpt: "● Garbage"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-10
              excerpt: "● Sewer"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-10
              excerpt: "● Trash"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-10
              excerpt: "● Portable toilet rental when no bathroom exists"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-utility-expenses-and-allowances/block-10
              excerpt: "● Septic maintenance"
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (component_billed_separately_from_rent_or_mortgage
          or component_itemized_with_rent_or_mortgage)
          and (
            component_type == "Garbage"
            or component_type == "Sewer"
            or component_type == "Trash"
            or component_type == "Septic maintenance"
            or (
              component_type == "Portable toilet rental"
              and not bathroom_exists
            )
          )
