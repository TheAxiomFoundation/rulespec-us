format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-categorical-eligibility/block-4
    source_sha256: 0075187d9085d36c53e41a46c19ebdfeb4ccd1f93f263b97181e6fc8a9449c28
  summary: ECE requires gross income not exceeding the current limit, failure to meet
    BCE requirements, and disqualified-participant resources not over the NA resource
    limit. ECE eligibility also requires no participant with a disqualification. Resources
    from certain disqualified participants are counted in full. AZTECS automatically
    considers an ECE budgetary unit to have met Resources and Gross and net income
    tests.
inputs:
- name: gross_income
  entity: Household
  dtype: Money
  period: Month
  unit: USD
- name: current_federal_poverty_level_amount
  entity: Household
  dtype: Money
  period: Month
  unit: USD
- name: budgetary_unit_meets_basic_categorical_eligibility_requirements
  entity: Household
  dtype: Boolean
  period: Month
- name: resources_of_participants_with_certain_disqualifications_are_not_over_na_resource_limit
  entity: Household
  dtype: Boolean
  period: Month
- name: budgetary_unit_has_participant_with_disqualification
  entity: Household
  dtype: Boolean
  period: Month
rules:
- name: expanded_categorical_eligibility_fpl_limit_rate
  kind: parameter
  dtype: Rate
  source: Arizona DES FAA5 NA Categorical Eligibility, Expanded Categorical Eligibility;
    March 23, 2026 change notice
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-az/manual/des/archived-policy/2026-03-23-whats-changed
          excerpt: The gross income limit for the NA ECE has changed from 185% of
            the FPL to 200% of the FPL.
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: us-az/manual/des/archived-policy/2026-03-23-whats-changed
          excerpt: For the benefit month of 03/2026 and ongoing
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: us-az/manual/des/archived-policy/2026-03-23-whats-changed
          excerpt: changed from 185% of the FPL to 200% of the FPL
      - path: versions[1].formula
        kind: parameter
        source:
          corpus_citation_path: us-az/manual/des/archived-policy/2026-03-23-whats-changed
          excerpt: changed from 185% of the FPL to 200% of the FPL
  versions:
  - effective_from: '0001-01-01'
    formula: "1.85"
  - effective_from: '2026-03-01'
    formula: "2.0"
- name: gross_income_within_expanded_categorical_eligibility_fpl_limit
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: Arizona DES FAA5 NA Categorical Eligibility, Expanded Categorical Eligibility
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-az/manual/des/faa5/na-categorical-eligibility/block-4
          excerpt: Gross income does not exceed 200% of the current federal poverty
            level (FPL)
      - path: versions[0].formula
        kind: import
        import:
          target: us-az:policies/des/faa5/na-categorical-eligibility/expanded-categorical-eligibility#expanded_categorical_eligibility_fpl_limit_rate
          output: expanded_categorical_eligibility_fpl_limit_rate
          hash: sha256:local
  versions:
  - effective_from: '0001-01-01'
    formula: gross_income <= expanded_categorical_eligibility_fpl_limit_rate * current_federal_poverty_level_amount
- name: budgetary_unit_does_not_meet_basic_categorical_eligibility_requirements
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: Arizona DES FAA5 NA Categorical Eligibility, Expanded Categorical Eligibility
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-az/manual/des/faa5/na-categorical-eligibility/block-4
          excerpt: The NA budgetary unit does not meet basic categorical eligibility
            (BCE) requirements
  versions:
  - effective_from: '0001-01-01'
    formula: not budgetary_unit_meets_basic_categorical_eligibility_requirements
- name: disqualified_participant_resources_not_over_na_resource_limit
  kind: derived
  entity: Household
  dtype: Judgment
  period: Month
  source: Arizona DES FAA5 NA Categorical Eligibility, Expanded Categorical Eligibility
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-az/manual/des/faa5/na-categorical-eligibility/block-4
          excerpt: The resources of participants with certain disqualifications are
            not over the NA resource limit
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: us-az/manual/des/faa5/na-categorical-eligibility/block-4
          excerpt: Resources from certain disqualified participants are counted in
            full.
  versions:
