format: rulespec/v1
module:
  summary: |-
    The cost of transportation to obtain medical treatment or services, such as doctor or dental visits and supplies, are allowable.
    The actual cost of fare when public transportation or common carrier is used.
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
    source_sha256: b1962a12aa206718e60284eeea8ac59f513cc867db1dd3ec70d1a3381a006cba
  proof_validation:
    required: true
  deferred_outputs:
    - output: us-az:policies/des/faa5/na-medical-expenses-and-deduction/block-10#private_vehicle_medical_transportation_amount
      reason: >-
        Cannot be computed until the mileage standard is encoded.
        "The mileage standard when private vehicles are used. (See mileage standard for the current amount)"
        requires the current mileage standard, which is not supplied.
# Coverage inventory: no printed subsection markers.
# The five illustrative supply bullets are covered by the allowability rule's
# definition proof. Public/common-carrier valuation is encoded; private-vehicle
# valuation is deferred pending the expressly cited mileage standard.
inputs:
  - name: has_transportation_cost
    entity: Person
    dtype: Boolean
    period: Month
  - name: transportation_is_to_obtain_medical_treatment_or_services
    entity: Person
    dtype: Boolean
    period: Month
  - name: uses_public_transportation_or_common_carrier
    entity: Person
    dtype: Boolean
    period: Month
  - name: actual_public_transportation_or_common_carrier_fare
    entity: Person
    dtype: Money
    unit: USD
    period: Month
rules:
  - name: medical_transportation_cost_allowable
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 10, allowable transportation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: The cost of transportation to obtain medical treatment or services, such as doctor or dental visits and supplies, are allowable.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: |-
                Examples of medical treatments or services include, and are not limited to, any of the following:

                ● Prescriptions

                ● Eyeglasses

                ● Dentures

                ● Hearing aids

                ● Sickroom equipment
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          has_transportation_cost
          and transportation_is_to_obtain_medical_treatment_or_services
  - name: allowable_public_medical_transportation_amount
    kind: derived
    entity: Person
    dtype: Money
    unit: USD
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 10, actual fare
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: The cost of transportation to obtain medical treatment or services, such as doctor or dental visits and supplies, are allowable.
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: |-
                The amount of the transportation cost is determined by using one or more of the following:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-10
              excerpt: The actual cost of fare when public transportation or common carrier is used.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          if medical_transportation_cost_allowable:
            if uses_public_transportation_or_common_carrier:
              actual_public_transportation_or_common_carrier_fare
            else: 0
          else: 0
