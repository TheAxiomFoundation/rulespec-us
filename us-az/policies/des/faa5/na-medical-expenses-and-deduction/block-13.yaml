format: rulespec/v1
module:
  summary: |-
    The costs to secure and maintain professionally trained service animals that assist elderly participants or participants with a disability in performing normal living activities are allowable as NA medical expenses.
    NOTE Breeding and whelping fees are not allowable.
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
    source_sha256: bc48156babc06f83300ac9e3b612f608edd864b61d8d41c44e7968d945376f82
  proof_validation:
    required: true
  # The evidence floor is not a finding of legal commencement.
  # Each Payment row describes one cost component for the same animal and participant.
  # Seeing-eye and hearing-ear animals are examples, not an exhaustive classification.
  # Maintenance includes food, veterinary services, kennel fees, and training.
  # Discuss and document the animal's medical necessity and participant-specific training.
inputs:
  - name: cost_is_to_secure_or_maintain_animal
    entity: Payment
    dtype: Boolean
    period: Month
  - name: participant_is_elderly_under_na_requirements
    entity: Payment
    dtype: Boolean
    period: Month
  - name: participant_has_disability_under_na_requirements
    entity: Payment
    dtype: Boolean
    period: Month
  - name: animal_is_professionally_trained
    entity: Payment
    dtype: Boolean
    period: Month
  - name: animal_assists_participant_in_normal_living_activities
    entity: Payment
    dtype: Boolean
    period: Month
  - name: animal_is_required_because_of_medical_issue
    entity: Payment
    dtype: Boolean
    period: Month
  - name: animal_is_specifically_trained_for_participant_work_or_tasks
    entity: Payment
    dtype: Boolean
    period: Month
  - name: component_is_breeding_fee
    entity: Payment
    dtype: Boolean
    period: Month
  - name: component_is_whelping_fee
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: snap_service_animal_expense_component_allowable
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 13
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                The costs to secure and maintain professionally trained service animals that assist elderly participants or participants with a disability in performing normal living activities are allowable as NA medical expenses.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                A service animal is defined as an animal that is trained to do work or perform tasks for elderly participants or participants with a disability.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                Service animals, including any of the following:

                ● Seeing-eye animals

                ● Hearing-ear animals
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                Discuss and document the case file(g) whether the service animal meets all of the following requirements:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                The service animal is required because of a medical issue.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                The service animal is specifically trained to perform work or tasks for the participant.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                Allowable maintenance costs include any of the following:

                ● Purchase of animal food

                ● Veterinary services

                ● Kennel fees

                ● Training
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                NOTE Breeding and whelping fees are not allowable.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          cost_is_to_secure_or_maintain_animal
          and (
            participant_is_elderly_under_na_requirements
            or participant_has_disability_under_na_requirements
          )
          and animal_is_professionally_trained
          and animal_assists_participant_in_normal_living_activities
          and animal_is_required_because_of_medical_issue
          and animal_is_specifically_trained_for_participant_work_or_tasks
          and not component_is_breeding_fee
          and not component_is_whelping_fee
  - name: snap_service_animal_medical_prescription_required
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, block 13, prescription requirement for an elderly participant or participant with a disability under NA requirements
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-13
              excerpt: |-
                It is not a requirement that a physician or medical professional prescribe the need for the animal when the participant is elderly or has a disability in accordance with NA requirements.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          false
