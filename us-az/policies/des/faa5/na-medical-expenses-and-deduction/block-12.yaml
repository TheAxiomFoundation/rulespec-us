format: rulespec/v1
module:
  summary: |-
    Any of the following expenses are allowable deductions:
    Any of the following purchases are not allowed as a deduction:
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
    source_sha256: 18f988ddde33cce8ca2d958d2903d41d98c13969d66fd615845811f85c594418
  proof_validation:
    required: true
inputs:
  - name: component_is_prescription_drug
    entity: Payment
    dtype: Boolean
    period: Month
  - name: component_is_over_the_counter_medication_purchase
    entity: Payment
    dtype: Boolean
    period: Month
  - name: medication_purchase_is_approved
    entity: Payment
    dtype: Boolean
    period: Month
  - name: approving_source_is_us_source
    entity: Payment
    dtype: Boolean
    period: Month
  - name: approving_source_is_medically_qualified
    entity: Payment
    dtype: Boolean
    period: Month
  - name: component_is_shipping_handling_or_postage
    entity: Payment
    dtype: Boolean
    period: Month
  - name: delivery_is_for_prescription_drugs
    entity: Payment
    dtype: Boolean
    period: Month
  - name: prescription_order_is_mail_order_or_online
    entity: Payment
    dtype: Boolean
    period: Month
  - name: component_is_purchasable_with_na_benefits
    entity: Payment
    dtype: Boolean
    period: Month
  - name: component_is_special_diet
    entity: Payment
    dtype: Boolean
    period: Month
  - name: component_is_medicinal_marijuana
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: snap_medication_expense_component_allowable
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block-12
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Any of the following expenses are allowable deductions:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Prescription drugs."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Over-the-counter medication purchases (including insulin) can be allowed as medical deductions when approved by a U.S. medically qualified source(g) ."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Shipping, handling and postage for mail order or online prescription drugs."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Any of the following purchases are not allowed as a deduction:"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Any item that can be purchased with NA benefits."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Any item that is considered as a special diet."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-12
              excerpt: "Medicinal marijuana(g)."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (
            component_is_prescription_drug
            or (
              component_is_over_the_counter_medication_purchase
              and medication_purchase_is_approved
              and approving_source_is_us_source
              and approving_source_is_medically_qualified
            )
            or (
              component_is_shipping_handling_or_postage
              and delivery_is_for_prescription_drugs
              and prescription_order_is_mail_order_or_online
            )
          )
          and not component_is_purchasable_with_na_benefits
          and not component_is_special_diet
          and not component_is_medicinal_marijuana
