              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-9
              excerpt: "NOTE This does not include the cost of special diets."
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          snap_medical_supply_authorized_by_us_medically_qualified_source
          and not snap_medical_supply_is_special_diet_cost
          and (
            snap_medical_supply_category == "syringes"
            or snap_medical_supply_category == "oxygen"
            or snap_medical_supply_category == "sickroom_equipment"
            or (
              snap_medical_supply_category == "other_medical_supply"
              and snap_medical_supply_medically_necessary
              and (
                snap_medical_supply_transaction == "purchase"
                or snap_medical_supply_transaction == "initial_purchase"
              )
            )
            or (
              snap_medical_supply_category == "equipment"
              and snap_medical_supply_prescribed
            )
            or (
              (
                snap_medical_supply_transaction == "initial_purchase"
                or snap_medical_supply_transaction == "replacement"
                or snap_medical_supply_transaction == "repair"
              )
              and (
                snap_medical_supply_category == "dentures"
                or snap_medical_supply_category == "hearing_aids"
                or snap_medical_supply_category == "telephonic_aids_for_hearing_impaired"
                or snap_medical_supply_category == "prostheses"
                or (
                  (
                    snap_medical_supply_category == "eyeglasses"
                    or snap_medical_supply_category == "contact_lenses"
                  )
                  and snap_medical_supply_prescribed
                  and (
                    snap_medical_supply_prescriber_profession == "ophthalmologist"
                    or snap_medical_supply_prescriber_profession == "optometrist"
                  )
                )
              )
            )
          )
