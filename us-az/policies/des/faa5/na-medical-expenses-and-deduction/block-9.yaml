format: rulespec/v1
module:
  summary: |-
    Any of the following medical supply costs are allowable when authorized by a U.S. medically qualified source:
    NOTE This does not include the cost of special diets.

    This module determines component allowability only. Each Payment row represents
    one independent expense component, including an incurred supply cost or rental
    fee. Split mixed invoices into separate rows before classification.

    Category selectors identify the actual item: syringes, oxygen, sickroom_equipment,
    other_medical_supply, equipment, dentures, eyeglasses, contact_lenses, hearing_aids,
    telephonic_aids_for_hearing_impaired, or prostheses. Other strings are outside
    this list. other_medical_supply includes supplies whose specific names are not
    listed. equipment denotes the prescribed-equipment branch. Overlapping factual
    categories should be classified under an applicable source branch.

    Transaction selectors identify purchase, initial_purchase, replacement, repair,
    rental, or another actual transaction. initial_purchase is also a purchase.
    The syringes, oxygen, and sickroom-equipment branches have no additional
    transaction restriction. The equipment branch covers equipment cost and rental
    fees; its selector must describe an actual equipment cost.

    Authorization by a U.S. medically qualified source is an externally established
    fact under the applicable definition, distinct from prescription and necessity.
    Eyewear prescriber selectors are ophthalmologist, optometrist, or another
    actual profession; prescription must concern this same eyewear component.

    Parent elderly/disability classification, ownership and billing, out-of-pocket
    treatment, reimbursement and other parent exclusions, verification, timing,
    aggregation, disregard, and standard-deduction selection remain caller obligations.
    No household deduction or amount is computed here.

    The formula coverage floor is August 1, 2026, the first full month following
    the July 17 evidence snapshot. It is not a legal commencement date.
    Earlier applicability is unproven; July has no formula version.
