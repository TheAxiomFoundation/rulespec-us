rules:
  - name: snap_medical_supply_component_allowable
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block-9
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-9
              excerpt: "Any of the following medical supply costs are allowable when authorized by a U.S. medically qualified source:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-9
              excerpt: "Purchase of other medically necessary medical supplies"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-9
              excerpt: "Cost of or rental fees for prescribed equipment"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-9
              excerpt: "Initial purchase, replacement, or repair of any of the following:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-9
              excerpt: "Eyeglasses or contact lenses, when prescribed by an ophthalmologist or optometrist"
          - path: versions[0].formula
            kind: exception
