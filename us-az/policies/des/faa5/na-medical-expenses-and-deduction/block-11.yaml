format: rulespec/v1
module:
  summary: |-
    Medicare insurance premiums for participants who are eligible to receive Social Security Administration (SSA) benefits are allowable. The premium is not allowed when paid by the State of Arizona.
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-11
    source_sha256: bcca71638873f357d02fd1d309e06fb4061aa724153cb16bfd7d238415a8274a
  proof_validation:
    required: true
inputs:
  - name: snap_medicare_premium_component_is_medicare_insurance
    entity: Payment
    dtype: Boolean
    period: Month
  - name: snap_medicare_premium_participant_social_security_benefit_eligible
    entity: Payment
    dtype: Boolean
    period: Month
  - name: snap_medicare_premium_component_paid_by_state_of_arizona
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: snap_medicare_premium_component_allowable
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: Arizona DES FAA5, NA Medical Expenses and Deduction, block 11
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-11
              excerpt: "Medicare insurance premiums for participants who are eligible to receive Social Security Administration (SSA) benefits are allowable."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-11
              excerpt: "The premium is not allowed when paid by the State of Arizona."
      component_scope: Each Payment row represents a separately identified premium component; mixed invoices require separate component rows. This rule does not allocate mixed premiums.
      caller_obligations: Participant deduction eligibility, billing and ownership, out-of-pocket treatment, verification, timing, and prevention of duplicate counting remain outside this component judgment.
      temporal_scope: August 2026 is the first full month of evidence coverage following the July 17 snapshot, not a legal commencement date.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          snap_medicare_premium_component_is_medicare_insurance
          and snap_medicare_premium_participant_social_security_benefit_eligible
          and not snap_medicare_premium_component_paid_by_state_of_arizona
