format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
  summary: |-
    Expenses must be verified only when any of the following occurs:
    New application
    Renewal application
    When a reported change in the expense or address is received
    When the expense amount is questionable(g)
    Dependent child or incapacitated adult care expense amounts must be verified using documented or collateral contact verification before allowing the expense.
