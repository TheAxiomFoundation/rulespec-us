rules:
  - name: dependent_care_expense_verification_required
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, verification occasions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                Expenses must be verified only when any of the following occurs:

                ● New application

                ● Renewal application

                ● When a reported change in the expense or address is received (See Effecting Changes for change information)

                ● When the expense amount is questionable(g)
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          new_application
          or renewal_application
          or reported_expense_change_received
          or reported_address_change_received
          or expense_amount_questionable

  - name: incapacitated_adult_care_statement_requirement_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, incapacitated adult statement prerequisite
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: A current statement from a physician or psychologist indicating that the incapacitated adult requires supervision or personal care is needed to allow incapacitated adult care expenses.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          current_physician_statement_indicates_adult_requires_supervision_or_personal_care
          or current_psychologist_statement_indicates_adult_requires_supervision_or_personal_care

  - name: dependent_care_collateral_contact_permitted
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, collateral contact limitation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: Collateral contact can only be made to clarify documented verification or when the participant is unable to obtain the verification and asks for assistance.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          contact_to_clarify_documented_verification
          or (participant_unable_to_obtain_verification and participant_requests_verification_assistance)

  - name: dependent_care_provider_documentation_complete
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, required provider documentation information
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                Provider documentation must contain all of the following information:

                Name, address, and telephone number of the provider

                Amount billed

                How often billed

                Period of time it covers

                The name of the participant receiving the care

                The name of the participant being billed
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          provider_document_contains_provider_name_address_and_telephone
          and provider_document_contains_amount_billed
          and provider_document_contains_billing_frequency
          and provider_document_contains_covered_period
          and provider_document_contains_care_recipient_name
          and provider_document_contains_billed_participant_name

  - name: dependent_care_expense_amount_verification_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, amount verification before allowance and accepted evidence
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: Dependent child or incapacitated adult care expense amounts must be verified using documented or collateral contact verification before allowing the expense.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: Verification that can be used for the expense amount includes, and is not limited to, any of the following
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                ● Paid receipt or participant's canceled checks.

                ● Screenshot of verification from the provider’s website or app.

                ● Collateral contact to, or a signed and dated statement from, the provider of the care.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          expense_amount_verified_by_paid_receipt
          or expense_amount_verified_by_participant_canceled_checks
          or expense_amount_verified_by_provider_website_or_app_screenshot
          or expense_amount_verified_by_other_documented_verification
          or (expense_amount_verified_by_signed_dated_provider_statement and dependent_care_provider_documentation_complete)
          or (expense_amount_verified_by_collateral_contact_to_provider and dependent_care_collateral_contact_permitted)

  - name: na_dependent_care_verification_requirements_met
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: DES FAA5 dependent care expense, NA verification requirements
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-6
              excerpt: |-
                For NA, all of the following must be verified:

                ● Transportation to and from a dependent care provider for the NA Dependent Care Transportation Standard.

                ● Information about the participant’s search for employment and about Supplemental Nutrition Assistance Program Career Advancement Network (SNAP) activities.

                ● The dependent child or incapacitated adult care expense amount.
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          transportation_to_and_from_dependent_care_provider_verified
          and employment_search_information_verified
          and snap_activity_information_verified
          and dependent_care_expense_amount_verification_met
