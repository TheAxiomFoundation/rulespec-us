format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
    source_sha256: 40630548b44d6346398dcf9a89908763962f48a1c636d2c1dc6e7e0a1b879c86
  summary: |-
    Dependent care expenses billed for the care of a child or an incapacitated adult are allowable when all of the following apply:
    The expense is required to ensure care is provided for the dependent.
  deferred_outputs:
    - output: us-az:policies/des/faa5/dependent-care-expense/block-5#ca_maximum_dependent_care_amount
      reason: >-
        Cannot be computed until Dependent Care Amount for CA is encoded.
        "The maximum dependent care amount is based on all of the following:"
        "The age of the dependent."
        "The number of hours the participant works."
        The referenced maximum deduction values by dependent age and participant work hours are not supplied.
inputs:
  - name: care_recipient_is_child
    entity: Payment
    dtype: Boolean
    period: Month
  - name: care_recipient_is_adult
    entity: Payment
    dtype: Boolean
    period: Month
  - name: medically_qualified_source_statement_establishes_incapacity
    entity: Payment
    dtype: Boolean
    period: Month
  - name: expense_required_to_ensure_dependent_care
    entity: Payment
    dtype: Boolean
    period: Month
  - name: expense_required_to_seek_accept_or_continue_employment
    entity: Payment
    dtype: Boolean
    period: Month
  - name: expense_required_for_training_or_education_to_prepare_for_employment
    entity: Payment
    dtype: Boolean
    period: Month
  - name: wage_earner_billed_for_expense
    entity: Payment
    dtype: Boolean
    period: Month
  - name: care_recipient_in_same_ca_or_supportive_services_budgetary_unit_as_wage_earner
    entity: Payment
    dtype: Boolean
    period: Month
rules:
  - name: ca_dependent_care_expense_allowable
    kind: derived
    entity: Payment
    dtype: Judgment
    period: Month
    source: DES FAA5 Dependent Care Expense, CA allowance conditions and adult incapacity
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: Dependent care expenses billed for the care of a child or an incapacitated adult are allowable when all of the following apply
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: The expense is required to ensure care is provided for the dependent.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: Seek, accept, or continue employment
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: Attend training or pursue education to prepare for employment
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: The wage earner is billed for the expense.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: The person receiving the care is included in the same CA or CA Supportive Services budgetary unit as the wage earner.
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: Dependent care expenses include payments to a provider caring for an incapacitated adult in the home.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/dependent-care-expense/block-5
              excerpt: Incapacity is determined by a statement from a medically qualified source(g) .
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          (care_recipient_is_child
          or (care_recipient_is_adult and medically_qualified_source_statement_establishes_incapacity))
          and expense_required_to_ensure_dependent_care
          and (expense_required_to_seek_accept_or_continue_employment
          or expense_required_for_training_or_education_to_prepare_for_employment)
          and wage_earner_billed_for_expense
          and care_recipient_in_same_ca_or_supportive_services_budgetary_unit_as_wage_earner
