# Three people (an adult of 40 working 40 hours a week, children 8 and 5),
# $3,600/month earned = 162.1% of the $2,221 three-person 100% FPL: over the
# 130% gross limit ($2,888) and under the ECE limit at either rate
# (1.85 x 2,221 = 4,108.85; 2 x 2,221 = 4,442), so eligible through ECE.
# Net before shelter = 3,600 - 720 - 209 = 2,671; shelter 1,500 + $323
# SUA = 1,823, excess = 1,823 - 1,335.5 rounded = 488; net 2,183;
# benefit = 785 - ceil(654.9) = 130.
