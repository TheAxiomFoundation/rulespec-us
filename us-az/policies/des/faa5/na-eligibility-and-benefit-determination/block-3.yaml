format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-3
    source_sha256: 90ef3cd8c6cf24d94e7fed9507618b5fda64f064ff8a32acde10840a4e269e75
  summary: |-
    A budget is completed to determine gross and net income using all of the following:

    ● All countable income received or expected to be received in the month for which eligibility is being determined

    ● Expenses billed or expected to be billed in the month for which eligibility is being determined
  deferred_outputs:
    - output: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/block-3#income_standards_eligibility
      reason: >-
        "A budgetary unit may only have to meet the appropriate net income
        standards depending on their circumstances." The applicable exceptions
        require Elderly or Have a Disability - NA Special Considerations and
        Categorically Eligible Budgetary Units; their determinations are not
        supplied by the copied context.
    - output: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/block-3#disqualified_participant_benefit_adjustment
      reason: >-
        "When the budgetary unit includes a disqualified participant, see
        Disqualified NA Participant’s Effect on the NA Benefit Amount."
        Cannot be computed until Disqualified NA Participant’s Effect on the
        NA Benefit Amount is encoded.
    - output: us-az:policies/des/faa5/na-eligibility-and-benefit-determination/block-3#thrifty_food_plan_benefit_basis
      reason: >-
        "The amount of NA benefits that a participant may receive is based
        on the U.S. Department of Agriculture (USDA) Thrifty Food Plan (TFP)."
        The source supplies neither the applicable TFP amounts nor their
        determination; the copied benefit calculation consumes a TFP amount
        rather than determining it.
inputs:
  - name: budget_includes_all_countable_income_received_or_expected_in_eligibility_month
    entity: Household
    dtype: Boolean
    period: Month
  - name: budget_includes_expenses_billed_or_expected_in_eligibility_month
    entity: Household
    dtype: Boolean
    period: Month
rules:
  - name: monthly_budget_information_requirements_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: FAA5 NA Eligibility and Benefit Determination, budget preparation and its two bullets
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-3
              excerpt: "A budget is completed to determine gross and net income using all of the following:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-3
              excerpt: "All countable income received or expected to be received in the month for which eligibility is being determined"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-3
              excerpt: "Expenses billed or expected to be billed in the month for which eligibility is being determined"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          budget_includes_all_countable_income_received_or_expected_in_eligibility_month
          and budget_includes_expenses_billed_or_expected_in_eligibility_month
