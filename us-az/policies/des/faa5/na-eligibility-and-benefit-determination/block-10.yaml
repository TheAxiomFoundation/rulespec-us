format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/na-eligibility-and-benefit-determination/block-10
  summary: |-
    The income eligibility tests are performed systematically and include the NA gross income test for regular NA budgetary units, and the NA net income test for both regular and special category budgetary units.
    The final allotment test, which compares allotment income to the applicable Thrifty Food Plan amount is also completed systematically.
    FAA performs all of the following tasks to determine eligibility for the NA income tests:
    Determines whether the case is an expedited NA case.
    Checks all other NA eligibility factors for the case before completing the benefit calculations.
    Totals all countable income.
    Accumulates all allowable NA expenses and deductions and applies these to the total income.
    Compares the resulting calculation to all of the following program limits for the final determination:
    NA gross monthly income eligibility standard.
    NA net monthly income eligibility standard.
    Thrifty Food Plan amount.
