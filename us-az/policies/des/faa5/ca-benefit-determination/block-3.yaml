format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-az/manual/des/faa5/ca-benefit-determination/block-3
    source_sha256: a0bcd926fb12aa0d1dc41afdb780b0a07b1866a907557c088089d625e8b84fe7
  summary: |-
    Participants must apply, complete an interview, and be determined prospectively eligible in order to receive CA benefits.
    When all eligibility factors and income tests are met, participants are considered to be prospectively eligible.
imports:
  - us-az:policies/des/faa5/ca-benefit-determination/needy-family-test#needy_family_criteria_met
  - us-az:policies/des/faa5/ca-benefit-determination/payment-standard-test#ca_payment_standard_test_met
inputs:
  - name: required_eligibility_factors_met
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: participant_budgetary_unit
    kind: data_relation
    source: FAA5 CA Benefit Determination, participant income tests
    data_relation:
      predicate: participant_budgetary_unit
      arity: 2
      arguments: [TanfUnit, Person]

  - name: participant_prospectively_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: FAA5 CA Benefit Determination, prospective eligibility
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-az/manual/des/faa5/ca-benefit-determination/block-3
              excerpt: "Prospective eligibility consists of meeting required eligibility factors along with the following income tests:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-az/manual/des/faa5/ca-benefit-determination/block-3
              excerpt: "When all eligibility factors and income tests are met, participants are considered to be prospectively eligible."
          - path: versions[0].formula
            kind: import
            import:
              target: us-az:policies/des/faa5/ca-benefit-determination/needy-family-test#needy_family_criteria_met
              output: needy_family_criteria_met
              hash: sha256:d568ba8e30c2971415c50262822ecd7f71d2133502d294d1a4eea09832a03988
          - path: versions[0].formula
            kind: import
            import:
              target: us-az:policies/des/faa5/ca-benefit-determination/payment-standard-test#ca_payment_standard_test_met
              output: ca_payment_standard_test_met
              hash: sha256:df9424da3a11fec4139558ba112f41110295e6d68482ba17a94616d8e32d43fe
    versions:
      - effective_from: '2026-08-01'
        formula: |-
          required_eligibility_factors_met
          and count_where(participant_budgetary_unit, needy_family_criteria_met) > 0
          and count_where(participant_budgetary_unit, ca_payment_standard_test_met) > 0
