format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-035-00/1105-035-05/block-1
    source_sha256: 1ce7953b43058fd920a5136587dabfa012428d4959cc900b91c4b762e78e7803
  summary: |-
    The Food and Nutrition Service (FNS) can temporarily waive the ABAWD time limit based on evidence showing that an area has an unemployment rate of over 10 percent or does not have a sufficient number of jobs.

    Staff will be notified when counties in the State of Missouri are waived.
inputs:
  - name: evidenced_unemployment_rate
    entity: AbawdWaiverArea
    dtype: Rate
    period: Month
  - name: evidence_shows_insufficient_jobs
    entity: AbawdWaiverArea
    dtype: Boolean
    period: Month
rules:
  - name: unemployment_rate_waiver_threshold
    kind: parameter
    dtype: Rate
    source: Missouri SNAP Manual 1105.035.05, unemployment-rate threshold
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-035-00/1105-035-05/block-1
              excerpt: "an unemployment rate of over 10 percent"
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          0.10
  - name: temporary_abawd_waiver_basis_satisfied
    kind: derived
    entity: AbawdWaiverArea
    dtype: Judgment
    period: Month
    source: Missouri SNAP Manual 1105.035.05, FNS temporary area waiver and staff notification
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-035-00/1105-035-05/block-1
              excerpt: "an unemployment rate of over 10 percent or does not have a sufficient number of jobs."
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          evidenced_unemployment_rate > unemployment_rate_waiver_threshold
          or evidence_shows_insufficient_jobs
