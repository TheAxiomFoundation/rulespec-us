format: rulespec/v1
module:
  source_verification:
    corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
    source_sha256: 82ce9f58f129049ec1c9c833ed51dde52aa838fc8137e4648e5ea6ab4d2a17a3
  proof_validation:
    required: true
  summary: |-
    American Indians born in Canada meeting the provisions of Section 289 of the Immigration and Nationality Act and members of an Indian tribe as defined in Section 4(e) of the Indian Self-Determination and Education Assistance Act can receive food stamps.
    These individuals can receive food stamp benefits indefinitely as long as they meet other food stamp financial and non-financial requirements.
    Client statement is not an acceptable verification code.
    A cross-border Native American may have USCIS documentation establishing Lawful Permanent Resident status.
    Enter HLC (Hmong/Laotian Hilanders/Crs Brdr Natives) in the status code field and the appropriate verification code on the Non-Citizen Information (FMML) screen in FAMIS.
    Record a comment regarding when the verification was received and any other information not contained on the Non-Citizen Information (FMML) screen.
  interpretations:
    - id: scope-of-relative-and-adoption-limitation
      status: open
      question: Does the final note limit independently qualifying tribal members?
      texts:
        - corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
          excerpt: "American Indians born in Canada meeting the provisions of Section 289 of the Immigration and Nationality Act and members of an Indian tribe as defined in Section 4(e) of the Indian Self-Determination and Education Assistance Act can receive food stamps."
        - corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
          excerpt: "NOTE : This does not include a spouse or child of such Native American nor an immigrant whose membership in a Native American tribe or family is created by adoption unless such person is of at least fifty percent (50%) or more Native American blood."
      reading: The note limits the Canadian-born Section 289 path. Independently qualifying tribal membership remains an alternative path. On the Canadian-born path, the blood threshold permits a person otherwise affected by the relative or adoption limitation.
      alternatives:
        - id: limitation-on-both-paths
          reading: Apply the relative and adoption limitation to both eligibility paths.
          effect: Independently qualifying tribal members could be excluded because of relationship or adoption.
        - id: blood-exception-only-for-adoption
          reading: Apply the blood exception only to adoption-created membership and exclude spouses and children from the Canadian-born path regardless of blood proportion.
      basis: The source separately names tribal members as eligible and describes the relatives as relatives of such Native American. The scope of the final unless clause remains grammatically ambiguous.
      affects:
        - cross_border_native_american_eligible
