rules:
  - name: relative_or_adoption_blood_threshold
    kind: parameter
    dtype: Rate
    source: Missouri SNAP Manual 1105.010.03, final note
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "unless such person is of at least fifty percent (50%) or more Native American blood."
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          0.50
  - name: tribal_record_blood_threshold
    kind: parameter
    dtype: Rate
    source: Missouri SNAP Manual 1105.010.03, acceptable verifications, tribal records
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "Tribal records certifying at least 50% Indian blood"
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          0.50
  - name: cross_border_native_american_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Missouri SNAP Manual 1105.010.03, eligibility paragraphs, border-crossing purpose, final note, and FAMIS recording instructions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "American Indians born in Canada meeting the provisions of Section 289 of the Immigration and Nationality Act and members of an Indian tribe as defined in Section 4(e) of the Indian Self-Determination and Education Assistance Act can receive food stamps."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "indefinitely as long as they meet other food stamp financial and non-financial requirements."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "This does not include a spouse or child of such Native American nor an immigrant whose membership in a Native American tribe or family is created by adoption unless such person is of at least fifty percent (50%) or more Native American blood."
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          meets_other_snap_financial_requirements
          and meets_other_snap_nonfinancial_requirements
          and (
            tribal_member_under_section_4_e
            or (
              american_indian_born_in_canada
              and meets_immigration_and_nationality_act_under_section_289
              and (
                (
                  not spouse_or_child_of_such_native_american
                  and not immigrant_membership_created_by_adoption
                )
                or native_american_blood_proportion >= relative_or_adoption_blood_threshold
              )
            )
          )
  - name: canadian_birth_verification_acceptable
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Missouri SNAP Manual 1105.010.03, client-statement prohibition and acceptable Canadian-birth verification list
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "Acceptable verifications that a Native American was born in Canada are:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "Birth or baptismal certificate issued on a reservation"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "Tribal records certifying at least 50% Indian blood, membership card, or other tribal document establishing membership in an Indian tribe"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "Letter from the Canadian Department of Indian Affairs; or"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "School records"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-mo/manual/dss/snap/1105-000-00/1105-010-00/1105-010-03/block-1
              excerpt: "Client statement is not an acceptable verification code."
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          verification_document_type == "birth_certificate_issued_on_reservation"
          or verification_document_type == "baptismal_certificate_issued_on_reservation"
          or (
            verification_document_type == "tribal_blood_record"
            and tribal_record_certified_indian_blood_proportion >= tribal_record_blood_threshold
          )
          or verification_document_type == "tribal_membership_card"
          or verification_document_type == "other_tribal_document_establishing_membership"
          or verification_document_type == "canadian_department_of_indian_affairs_letter"
          or verification_document_type == "school_records"
