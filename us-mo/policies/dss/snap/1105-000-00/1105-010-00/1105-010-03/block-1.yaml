    period: Month
  - name: meets_immigration_and_nationality_act_under_section_289
    entity: Person
    dtype: Boolean
    period: Month
  - name: tribal_member_under_section_4_e
    entity: Person
    dtype: Boolean
    period: Month
  - name: spouse_or_child_of_such_native_american
    entity: Person
    dtype: Boolean
    period: Month
  - name: immigrant_membership_created_by_adoption
    entity: Person
    dtype: Boolean
    period: Month
  - name: native_american_blood_proportion
    entity: Person
    dtype: Rate
    period: Month
  - name: meets_other_snap_financial_requirements
    entity: Person
    dtype: Boolean
    period: Month
  - name: meets_other_snap_nonfinancial_requirements
    entity: Person
    dtype: Boolean
    period: Month
  - name: verification_document_type
    entity: Person
    dtype: String
    period: Month
  - name: tribal_record_certified_indian_blood_proportion
    entity: Person
    dtype: Rate
