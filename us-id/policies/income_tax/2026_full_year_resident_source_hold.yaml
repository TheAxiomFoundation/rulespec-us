  - name: id_pit_2026_refundable_credit_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Complete tax-year-2026 Idaho refundable-credit inventory, eligibility, and ordering are not pinned
