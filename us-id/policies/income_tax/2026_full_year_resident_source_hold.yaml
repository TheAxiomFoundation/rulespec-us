  - name: id_pit_2026_surtax_surface_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Complete tax-year-2026 Idaho individual surtax and specialty-tax applicability is not pinned
    metadata:
