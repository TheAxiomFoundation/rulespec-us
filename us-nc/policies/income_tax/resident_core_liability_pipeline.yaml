    source_sha256: f40ff33b90f5f23e2ed1a4264d6ae3488f12d85c9d429b91cedb9c981ecc5ada
  summary: “In calculating North Carolina taxable income, a taxpayer may deduct from
    adjusted gross income either the standard deduction amount ... or the itemized
    deduction amount.” “The amount of the deduction is equal to the amount listed
    in the table below based on the taxpayer's adjusted gross income.” The source
    also requires additions and permits other deductions in calculating North Carolina
    taxable income.
  deferred_outputs:
  - output: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_filing_status_index
    reason: The statutory standard-deduction and child-deduction tables require the
      taxpayer's legal federal filing status, including the distinct single, joint-return,
      married-filing-separately, head-of-household, and surviving-spouse classifications.
      No copied RuleSpec source exports the required filing-status classification,
      and local filing-status inputs are prohibited.
  - output: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_standard_deduction
    reason: Calculation depends on the unavailable legal filing-status classification
      required by N.C. Gen. Stat. § 105-153.5(a)(1).
  - output: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_itemized_deduction
    reason: The complete itemized-deduction computation depends on federal deduction
      mechanics and source-stated exceptions under Code sections not supplied as executable
      RuleSpec dependencies, including sections 63, 67, 68, 1341, 163, 164, 170, 213,
      and 408.
  - output: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_deduction_amount
    reason: Selection between the standard deduction and the complete itemized deduction
      cannot be computed faithfully while those component outputs are deferred.
  - output: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_child_deduction_band
    reason: The child-deduction table depends on the unavailable legal filing-status
      classification.
  - output: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_child_deduction_per_child
    reason: The child-deduction amount depends on the unavailable legal filing-status
      classification and the derived child-deduction band.
  - output: us-nc:policies/income_tax/resident_core_liability_pipeline#nc_pit_2026_child_deduction
    reason: Calculation requires the federal child-tax-credit entitlement and qualifying-child
