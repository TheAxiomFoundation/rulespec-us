# Connecticut's complete annual return chain is source held, but section
# 12-704e independently supports a refundable credit equal to forty percent
# of the federal EITC claimed and allowed on an aligned resident return.

- name: valid single return computes the bounded refundable EITC branch
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input:
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_federal_adjusted_gross_income: 24000
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_federal_earned_income_credit: 1000
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_is_full_year_connecticut_resident_return: true
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_federal_and_connecticut_filing_units_are_aligned: true
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_filing_status_single: true
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_filing_status_married_separate: false
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_filing_status_head_of_household: false
    us-ct:policies/income_tax/2026_resident_liability_source_hold#input.ct_pit_2026_filing_status_joint_or_surviving_spouse: false
  output:
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_filing_status_is_valid: holds
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_input_domain_is_valid: holds
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_income_and_modification_source_hold_applies: holds
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_deduction_and_exemption_source_hold_applies: holds
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_tax_and_surtax_source_hold_applies: holds
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_credit_surface_source_hold_applies: holds
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_complete_liability_source_hold_applies: holds
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_encoded_refundable_earned_income_credit: '400'
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_adjusted_gross_income: '0'
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_deductions_and_exemptions: '0'
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_taxable_income: '0'
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_tax_before_credits_including_surtaxes: '0'
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_tax_after_nonrefundable_credits: '0'
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_refundable_credits: '0'
    us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_net_income_tax_liability_before_payments: '0'

