    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: True only for a full-year Connecticut resident individual return.
  - name: ct_pit_2026_ordinary_tax_filing_status_single
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: True only for the unmarried-individual schedule.
  - name: ct_pit_2026_ordinary_tax_filing_status_married_separate
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: True only for the married-filing-separately schedule.
  - name: ct_pit_2026_ordinary_tax_filing_status_head_of_household
    entity: TaxUnit
    dtype: Boolean
    period: Year
    description: True only for the head-of-household schedule.
  - name: ct_pit_2026_ordinary_tax_filing_status_joint_or_surviving_spouse
    entity: TaxUnit
    dtype: Boolean
