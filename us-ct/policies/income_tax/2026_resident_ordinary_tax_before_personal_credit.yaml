  - name: ct_pit_2026_ordinary_schedule_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Conn. Gen. Stat. section 12-700(a)(10)(A)-(D)(i), seven-band resident schedules
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "For taxable years commencing on or after January 1, 2024, in accordance with the following schedule"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "plus 4.5% of the"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "plus 5.5% of the"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "plus 6.99% of the excess over $500,000"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if ct_pit_2026_ordinary_tax_input_domain_is_valid:
            ct_pit_2026_ordinary_tax_schedule_scale * (
              ct_pit_2026_ordinary_tax_rate_1 * min(
                ct_pit_2026_connecticut_taxable_income
                  / ct_pit_2026_ordinary_tax_schedule_scale,
                ct_pit_2026_ordinary_tax_single_floor_2
              )
              + ct_pit_2026_ordinary_tax_rate_2 * min(
                max(
                  0,
                  ct_pit_2026_connecticut_taxable_income
                    / ct_pit_2026_ordinary_tax_schedule_scale
                    - ct_pit_2026_ordinary_tax_single_floor_2
                ),
                ct_pit_2026_ordinary_tax_single_floor_3
                  - ct_pit_2026_ordinary_tax_single_floor_2
              )
              + ct_pit_2026_ordinary_tax_rate_3 * min(
                max(
                  0,
                  ct_pit_2026_connecticut_taxable_income
                    / ct_pit_2026_ordinary_tax_schedule_scale
                    - ct_pit_2026_ordinary_tax_single_floor_3
                ),
                ct_pit_2026_ordinary_tax_single_floor_4
                  - ct_pit_2026_ordinary_tax_single_floor_3
              )
              + ct_pit_2026_ordinary_tax_rate_4 * min(
                max(
                  0,
                  ct_pit_2026_connecticut_taxable_income
                    / ct_pit_2026_ordinary_tax_schedule_scale
                    - ct_pit_2026_ordinary_tax_single_floor_4
                ),
                ct_pit_2026_ordinary_tax_single_floor_5
                  - ct_pit_2026_ordinary_tax_single_floor_4
              )
              + ct_pit_2026_ordinary_tax_rate_5 * min(
                max(
                  0,
                  ct_pit_2026_connecticut_taxable_income
                    / ct_pit_2026_ordinary_tax_schedule_scale
                    - ct_pit_2026_ordinary_tax_single_floor_5
                ),
                ct_pit_2026_ordinary_tax_single_floor_6
                  - ct_pit_2026_ordinary_tax_single_floor_5
              )
              + ct_pit_2026_ordinary_tax_rate_6 * min(
                max(
                  0,
                  ct_pit_2026_connecticut_taxable_income
                    / ct_pit_2026_ordinary_tax_schedule_scale
                    - ct_pit_2026_ordinary_tax_single_floor_6
                ),
                ct_pit_2026_ordinary_tax_single_floor_7
                  - ct_pit_2026_ordinary_tax_single_floor_6
              )
              + ct_pit_2026_ordinary_tax_rate_7 * max(
                0,
                ct_pit_2026_connecticut_taxable_income
                  / ct_pit_2026_ordinary_tax_schedule_scale
                  - ct_pit_2026_ordinary_tax_single_floor_7
              )
            )
          else:
            0

  - name: ct_pit_2026_ordinary_low_rate_phaseout_addback
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Conn. Gen. Stat. section 12-700(a)(10)(A)-(D)(ii), low-rate phaseout
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "exceeds fifty-six thousand five hundred dollars"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "exceeds seventy-eight thousand five hundred dollars"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "exceeds one hundred thousand five hundred dollars"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "exceeds fifty thousand two hundred fifty dollars"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "or fraction thereof"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if ct_pit_2026_ordinary_tax_input_domain_is_valid:
            min(
              ct_pit_2026_ordinary_tax_single_phaseout_maximum
                * ct_pit_2026_ordinary_tax_schedule_scale,
              ct_pit_2026_ordinary_tax_single_phaseout_amount
                * ct_pit_2026_ordinary_tax_schedule_scale
                * ceil(
                  max(
                    0,
                    ct_pit_2026_connecticut_adjusted_gross_income
                      - (
                        if ct_pit_2026_ordinary_tax_filing_status_joint_or_surviving_spouse:
                          ct_pit_2026_ordinary_tax_joint_phaseout_start
                        else:
                          if ct_pit_2026_ordinary_tax_filing_status_head_of_household:
                            ct_pit_2026_ordinary_tax_head_phaseout_start
                          else:
                            if ct_pit_2026_ordinary_tax_filing_status_married_separate:
                              ct_pit_2026_ordinary_tax_separate_phaseout_start
                            else:
                              ct_pit_2026_ordinary_tax_single_phaseout_start
                      )
                  )
                  / (
                    if ct_pit_2026_ordinary_tax_filing_status_head_of_household:
                      ct_pit_2026_ordinary_tax_head_phaseout_increment
                    else:
                      if ct_pit_2026_ordinary_tax_filing_status_married_separate:
                        ct_pit_2026_ordinary_tax_separate_phaseout_increment
                      else:
                        ct_pit_2026_ordinary_tax_single_phaseout_increment
                  )
                )
            )
          else:
            0

