format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-ct/statute/12-700
      - us-ct/statute/12-700/block-1
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us-ct/statute/12-700
        - us-ct/statute/12-700/block-1
      rationale: |-
        The pinned official Connecticut General Assembly Chapter 229 capture
        supplies the complete section 12-700(a)(10) schedules for taxable
        years beginning on or after January 1, 2024. Those provisions specify
        all seven marginal-rate bands for unmarried, head-of-household,
        joint-or-surviving-spouse, and married-separate returns; the low-rate
        phaseout for each status; and all three recapture tiers.

        This narrow tax-year-2026 module accepts completed-return Connecticut
        taxable income and Connecticut adjusted gross income. It validates a
        full-year-resident return and exactly one of the four statutory
        schedule classifications, then computes only ordinary section 12-700
        tax before the section 12-703 personal credit.

        The pinned corpus does not contain final tax-year-2026 Form CT-1040
        instructions, schedules, or a complete annual implementation
        inventory. This module therefore does not construct Connecticut
        adjusted gross income or taxable income and does not compute the
        personal credit, alternative minimum tax, property-tax credit,
        stillborn credit, earned income tax credit, other credits, payments,
        refunds, or final annual liability. Nonresident, part-year-resident,
        trust, and estate returns are outside its domain. Every executable
        version fails closed outside tax year 2026.
  summary: |-
    Canonical Connecticut tax-year-2026 full-year-resident ordinary tax
    schedule component. It validates exactly one filing-status schedule,
    applies the seven section 12-700(a)(10) marginal-rate bands, adds the
    low-rate phaseout, and adds all three statutory recapture tiers.

    Its sole public result is ordinary resident tax before the personal
    credit. It is not complete annual Connecticut income tax, tax after
    credits, or net liability. PolicyEngine parity is not claimed.

rules:
  - name: ct_pit_2026_ordinary_tax_filing_status_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Conn. Gen. Stat. section 12-700(a)(10)(A)-(D), mutually exclusive resident filing-status schedules
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as an unmarried individual"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as a head of household"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as married individuals filing jointly or any person who files a return under the federal income tax for such taxable year as a surviving spouse"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as a married individual filing separately"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            ct_pit_2026_ordinary_tax_filing_status_single
            or ct_pit_2026_ordinary_tax_filing_status_married_separate
            or ct_pit_2026_ordinary_tax_filing_status_head_of_household
            or ct_pit_2026_ordinary_tax_filing_status_joint_or_surviving_spouse
          )
          and not (
            ct_pit_2026_ordinary_tax_filing_status_single
            and (
              ct_pit_2026_ordinary_tax_filing_status_married_separate
              or ct_pit_2026_ordinary_tax_filing_status_head_of_household
              or ct_pit_2026_ordinary_tax_filing_status_joint_or_surviving_spouse
            )
          )
          and not (
            ct_pit_2026_ordinary_tax_filing_status_married_separate
            and (
              ct_pit_2026_ordinary_tax_filing_status_head_of_household
              or ct_pit_2026_ordinary_tax_filing_status_joint_or_surviving_spouse
            )
          )
          and not (
            ct_pit_2026_ordinary_tax_filing_status_head_of_household
            and ct_pit_2026_ordinary_tax_filing_status_joint_or_surviving_spouse
          )

  - name: ct_pit_2026_ordinary_tax_input_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Conn. Gen. Stat. section 12-700(a)(10), bounded full-year-resident completed-return input domain
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Connecticut taxable income of each resident of this state"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Connecticut adjusted gross income"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ct_pit_2026_is_full_year_connecticut_resident_return
          and ct_pit_2026_ordinary_tax_filing_status_is_valid
          and ct_pit_2026_connecticut_taxable_income >= 0

  - name: ct_pit_2026_ordinary_tax_schedule_scale
    kind: derived
    entity: TaxUnit
    dtype: Number
    period: Year
    source: Conn. Gen. Stat. section 12-700(a)(10)(A)-(D), proportional filing-status schedule widths
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Not over $10,000 2.0%"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Not over $16,000 2.0%"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Not over $20,000 2.0%"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if ct_pit_2026_ordinary_tax_filing_status_joint_or_surviving_spouse:
            ct_pit_2026_ordinary_tax_joint_first_ceiling
              / ct_pit_2026_ordinary_tax_single_floor_2
          else:
            if ct_pit_2026_ordinary_tax_filing_status_head_of_household:
              ct_pit_2026_ordinary_tax_head_first_ceiling
                / ct_pit_2026_ordinary_tax_single_floor_2
            else:
              1

