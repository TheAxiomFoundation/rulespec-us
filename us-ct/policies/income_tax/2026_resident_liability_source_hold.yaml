format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-ct/statute/12-700/block-1
      - us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us-ct/statute/12-700
        - us-ct/statute/12-700/block-1
        - us-ct/statute/2026-supplement/12-704e
        - us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
        - us-ct/statute/12-704i
        - us-ct/statute/12-704i/block-1
      rationale: |-
        The pinned official Chapter 229 capture contains Connecticut's
        adjusted-gross-income definition and modification list, exemption
        framework, ordinary resident schedules, low-rate phaseout, recapture,
        alternative minimum tax, personal credit, credit ordering, property-
        tax credit, earned income tax credit, and fetal-death credit.

        The corpus separately pins the official 2026 Supplement text for
        section 12-704e, including P.A. 25-168's amendment applicable to
        taxable years beginning on or after January 1, 2025. Final tax-year-
        2026 Form CT-1040, instructions, schedules, and a complete annual
        implementation inventory are not pinned. The available material
        therefore cannot establish the complete operative 2026 resident base,
        exemption, AMT, specialty-tax, and credit chain.

        Supplement section 12-704e nevertheless supplies a bounded rule that
        is complete on this program's aligned full-year-resident domain: the
        Connecticut earned income tax credit is forty percent of the federal
        earned income credit claimed and allowed for the same taxable year,
        plus $250 when an eligible taxpayer has at least one federal qualifying
        child. Excess credit is refundable. This branch is encoded from the
        allowed federal credit and a raw federal qualifying-child count.

        All other public Money stages are fail-closed zero sentinels while the
        typed source holds remain active. The sentinels are not legal claims
        that Connecticut income or tax is zero. The separately encoded
        schedule pilot remains the source-complete ordinary schedule and
        nonrefundable-credit calculation from completed Connecticut outcomes;
        none of its prohibited state-stage caller inputs is composed here.
  summary: |-
    Tax-year-2026 Connecticut full-year-resident individual-income-tax
    source-held program boundary. It accepts federal adjusted gross income,
    the federal earned income credit claimed and allowed, the raw count of
    federal qualifying children, full-year residency, aligned filing-unit
    status, and raw filing-status facts. It never accepts completed Connecticut
    income, exemption, taxable-income, AMT, surtax, or credit amounts.

    The module computes the bounded section 12-704e Connecticut earned income
    tax credit at forty percent of the allowed federal credit and adds $250
    once when an eligible claimant has at least one federal qualifying child.
    Complete Connecticut adjusted gross income, exemptions, taxable income,
    tax before credits including AMT and surtaxes, tax after nonrefundable
    credits, the complete refundable-credit inventory, and signed net liability
    before payments fail closed while the pinned 2026 source gaps remain. The
    module is intentionally incomplete and makes no annual-liability parity
    claim.

    Withholding, estimated payments, extension payments, penalties, interest,
    refunds of payments, filing and collection administration, local income
    taxes, nonresident sourcing, and part-year allocation are outside scope.
  deferred_outputs:
    - output: us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_adjusted_gross_income
      reason: |-
        The pinned sources contain the statutory modification list and the
        section 12-704e Supplement overlay, but final 2026 CT-1040 modification
        instructions and schedules and a complete annual implementation
        inventory are absent. Federal adjusted gross income therefore cannot
        be transformed into a complete operative Connecticut adjusted gross
        income.
      source_values:
        - us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_income_and_modification_source_hold_applies
    - output: us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_deductions_and_exemptions
      reason: |-
        Connecticut's exemption depends on Connecticut adjusted gross income,
        and the pinned corpus lacks the final resident-return implementation
        needed to establish the complete annual chain.
      source_values:
        - us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_deduction_and_exemption_source_hold_applies
    - output: us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_taxable_income
      reason: |-
        Connecticut taxable income cannot be completed until adjusted gross
        income and the exemption chain are source complete.
      source_values:
        - us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_complete_liability_source_hold_applies
    - output: us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_tax_before_credits_including_surtaxes
      reason: |-
        The pinned chapter supplies the ordinary schedule, but the schedule
        cannot be composed before Connecticut taxable income is complete. The
        complete 2026 AMT, recapture, surtax, and specialty-tax implementation
        is not established without the final return materials and complete
        annual implementation inventory.
      source_values:
        - us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_tax_and_surtax_source_hold_applies
    - output: us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_tax_after_nonrefundable_credits
      reason: |-
        The pinned corpus lacks final CT-1040 credit schedules and a complete
        annual implementation inventory needed to prove the nonrefundable-
        credit eligibility chain, limitations, ordering, and carryforwards.
      source_values:
        - us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_credit_surface_source_hold_applies
    - output: us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_refundable_credits
      reason: |-
        Section 12-704e supports the separately exposed encoded Connecticut
        earned income tax credit. The complete 2026 refundable-credit inventory
        cannot be claimed without final return materials and a complete annual
        implementation inventory.
      source_values:
        - us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_credit_surface_source_hold_applies
    - output: us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_net_income_tax_liability_before_payments
      reason: |-
        Signed annual liability cannot be completed until every upstream
        income, exemption, tax, AMT, surtax, and credit hold is cleared.
      source_values:
        - us-ct:policies/income_tax/2026_resident_liability_source_hold#ct_pit_2026_complete_liability_source_hold_applies

rules:
  - name: ct_pit_2026_filing_status_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Conn. Gen. Stat. section 12-700(a)(10), resident filing-status schedules
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as an unmarried individual"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as a head of household"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as a married individual filing separately"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "as married individuals filing jointly or any person who files a return under the federal income tax for such taxable year as a surviving spouse"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            ct_pit_2026_filing_status_single
            and not ct_pit_2026_filing_status_married_separate
            and not ct_pit_2026_filing_status_head_of_household
            and not ct_pit_2026_filing_status_joint_or_surviving_spouse
          )
          or (
            not ct_pit_2026_filing_status_single
            and ct_pit_2026_filing_status_married_separate
            and not ct_pit_2026_filing_status_head_of_household
            and not ct_pit_2026_filing_status_joint_or_surviving_spouse
          )
          or (
            not ct_pit_2026_filing_status_single
            and not ct_pit_2026_filing_status_married_separate
            and ct_pit_2026_filing_status_head_of_household
            and not ct_pit_2026_filing_status_joint_or_surviving_spouse
          )
          or (
            not ct_pit_2026_filing_status_single
            and not ct_pit_2026_filing_status_married_separate
            and not ct_pit_2026_filing_status_head_of_household
            and ct_pit_2026_filing_status_joint_or_surviving_spouse
          )

  - name: ct_pit_2026_input_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Conn. Gen. Stat. sections 12-700 and 12-704e, aligned full-year resident input domain
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Connecticut taxable income of each resident of this state"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "earned income credit claimed and allowed for the same taxable year"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "has at least one qualifying child for federal income tax purposes"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ct_pit_2026_is_full_year_connecticut_resident_return
          and ct_pit_2026_federal_and_connecticut_filing_units_are_aligned
          and ct_pit_2026_filing_status_is_valid
          and (
            ct_pit_2026_federal_adjusted_gross_income >= 0
            or ct_pit_2026_federal_adjusted_gross_income < 0
          )
          and ct_pit_2026_federal_earned_income_credit >= 0
          and ct_pit_2026_federal_qualifying_child_count >= 0
          and floor(ct_pit_2026_federal_qualifying_child_count) == ct_pit_2026_federal_qualifying_child_count

  - name: ct_pit_2026_income_and_modification_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Missing final CT-1040 income-modification materials and complete annual implementation inventory
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Connecticut adjusted gross income” means adjusted gross income, with the following modifications"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

  - name: ct_pit_2026_deduction_and_exemption_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Connecticut exemption chain cannot execute while adjusted gross income and final 2026 implementation are source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "reduced by the amount of the exemption provided in section 12-702"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: ct_pit_2026_income_and_modification_source_hold_applies

  - name: ct_pit_2026_tax_and_surtax_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Ordinary schedule cannot execute before taxable income and the complete 2026 AMT and specialty-tax implementation is not pinned
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "For taxable years commencing on or after January 1, 2024, in accordance with the following schedule"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "shall pay, in addition to the tax imposed under section 12-700"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ct_pit_2026_income_and_modification_source_hold_applies
          or ct_pit_2026_deduction_and_exemption_source_hold_applies

  - name: ct_pit_2026_credit_surface_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Missing complete operative 2026 Connecticut credit inventory and final return ordering implementation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Whenever a taxpayer is eligible to claim more than one income tax credit under this chapter"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

  - name: ct_pit_2026_complete_liability_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Combined source hold for incomplete 2026 Connecticut resident liability
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "There is hereby imposed on the Connecticut taxable income of each resident of this state a tax"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Order of credits"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ct_pit_2026_income_and_modification_source_hold_applies
          or ct_pit_2026_deduction_and_exemption_source_hold_applies
          or ct_pit_2026_tax_and_surtax_source_hold_applies
          or ct_pit_2026_credit_surface_source_hold_applies

  - name: ct_pit_2026_refundable_eitc_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Conn. Gen. Stat. section 12-704e, applicable percentage for tax years beginning after 2022
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "forty per cent for taxable years commencing on or after January 1, 2023"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0.4'

  - name: ct_pit_2026_refundable_eitc_qualifying_child_addition
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: Conn. Gen. Stat. section 12-704e(b), additional amount for an eligible taxpayer with at least one federal qualifying child
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "shall be allowed an additional two hundred fifty dollars for the amount of the credit"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '250'

  - name: ct_pit_2026_encoded_refundable_earned_income_credit
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Conn. Gen. Stat. section 12-704e, forty percent of federal EITC claimed and allowed plus the qualifying-child addition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "forty per cent for taxable years commencing on or after January 1, 2023"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "has at least one qualifying child for federal income tax purposes"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "shall be allowed an additional two hundred fifty dollars for the amount of the credit"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "shall treat such excess as an overpayment"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if ct_pit_2026_input_domain_is_valid:
            (
              ct_pit_2026_refundable_eitc_rate
              * ct_pit_2026_federal_earned_income_credit
            )
            + (
              if (
                ct_pit_2026_federal_earned_income_credit > 0
                and ct_pit_2026_federal_qualifying_child_count >= 1
              ):
                ct_pit_2026_refundable_eitc_qualifying_child_addition
              else:
                0
            )
          else:
            0

  - name: ct_pit_2026_adjusted_gross_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Connecticut adjusted-gross-income sentinel while the modification chain is source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Connecticut adjusted gross income” means adjusted gross income, with the following modifications"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: ct_pit_2026_deductions_and_exemptions
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Connecticut deduction-and-exemption sentinel while the complete chain is source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "reduced by the amount of the exemption provided in section 12-702"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: ct_pit_2026_taxable_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Connecticut taxable-income sentinel while adjusted gross income and exemptions are source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "Connecticut taxable income of a resident"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: ct_pit_2026_tax_before_credits_including_surtaxes
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Connecticut tax, AMT, and surtax sentinel while the complete annual chain is source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "There is hereby imposed on the Connecticut taxable income of each resident of this state a tax"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: ct_pit_2026_tax_after_nonrefundable_credits
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed Connecticut tax-after-nonrefundable-credits sentinel while the credit surface is source held
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "credits shall be claimed for the taxable year in the following order"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: ct_pit_2026_refundable_credits
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed complete Connecticut refundable-credit sentinel; the separately exposed EITC branch remains encoded
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/2026-supplement/12-704e/earned-income-tax-credit
              excerpt: "shall refund the amount of such excess"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

  - name: ct_pit_2026_net_income_tax_liability_before_payments
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Fail-closed signed Connecticut resident income-tax liability sentinel before payments
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ct/statute/12-700/block-1
              excerpt: "tax liability for purposes of this chapter"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: '0'

inputs:
  - name: ct_pit_2026_federal_adjusted_gross_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Federal adjusted gross income from the aligned federal return; it is not a completed Connecticut income amount.
  - name: ct_pit_2026_federal_earned_income_credit
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Federal earned income credit claimed and allowed for the same taxable year, an allowed federal return output used by section 12-704e.
  - name: ct_pit_2026_federal_qualifying_child_count
    entity: TaxUnit
    dtype: Count
    period: Year
    description: Raw count of qualifying children for federal income tax purposes; it is not a completed Connecticut credit outcome.
  - name: ct_pit_2026_is_full_year_connecticut_resident_return
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Whether the return is within this program's full-year Connecticut resident scope.
  - name: ct_pit_2026_federal_and_connecticut_filing_units_are_aligned
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Whether the federal and Connecticut returns cover the same filing unit, excluding section 12-704e(c)'s joint-federal/separate-state allocation branch.
  - name: ct_pit_2026_filing_status_single
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Raw filing-status fact for an unmarried-individual return.
  - name: ct_pit_2026_filing_status_married_separate
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Raw filing-status fact for a married-filing-separately return.
  - name: ct_pit_2026_filing_status_head_of_household
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Raw filing-status fact for a head-of-household return.
  - name: ct_pit_2026_filing_status_joint_or_surviving_spouse
    entity: TaxUnit
    dtype: Judgment
    period: Year
    description: Raw filing-status fact for a joint or surviving-spouse return, which share the section 12-700 schedule.
