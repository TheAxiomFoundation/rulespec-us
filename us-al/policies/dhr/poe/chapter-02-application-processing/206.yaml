format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
    source_sha256: a486f02e05bd2982423f4449e7c90677251745029d9cd6f5eadae085b88fcdf4
  summary: |-
    The county department shall provide eligible households that complete the initial application process an opportunity to participate as soon as possible, but no later than 30 calendar days following the date the application was filed, unless such households are entitled to expedited services.
    Households that are found to be ineligible are to be sent a notice of denial as soon as possible but not later than 30 days following the date the application was filed.
  interpretations:
    - id: weekend-adjustment-scope
      status: open
      question: Does the weekend or holiday adjustment also govern the specifically stated thirtieth-day denials?
      texts:
        - corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
          excerpt: If the 30th day falls on a weekend or holiday, the application should be denied on the first work day following the weekend or holiday.
        - corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
          excerpt: the household should be issued a notice of denial on the 30th day following the date of application.
      reading: Apply the adjustment to the general ineligibility deadline; retain the expressly stated thirtieth day for missed-interview and missing-verification denials.
      alternatives:
        - id: adjust-all-denials
          reading: Apply the weekend or holiday adjustment to every denial described in B.
      basis: The later sentences independently specify denial on the thirtieth day without repeating the adjustment.
      affects:
        - ineligibility_denial_deadline_days
        - missed_interview_denial_day
        - missing_verification_denial_day
imports:
  - us-al:policies/dhr/poe/chapter-02-application-processing/213#opportunity_to_participate_days
inputs:
  - name: household_eligible
    entity: Household
    dtype: Boolean
    period: Day
  - name: initial_application_process_completed
    entity: Household
    dtype: Boolean
    period: Day
  - name: entitled_to_expedited_services
    entity: Household
    dtype: Boolean
    period: Day
  - name: household_found_ineligible
    entity: Household
    dtype: Boolean
    period: Day
  - name: thirtieth_day_is_weekend_or_holiday
    entity: Household
    dtype: Boolean
    period: Day
  - name: days_from_filing_to_first_workday_after_weekend_or_holiday
    entity: Household
    dtype: Integer
    period: Day
  - name: failed_to_appear_for_scheduled_interview
    entity: Household
    dtype: Boolean
    period: Day
  - name: subsequent_contact_expressing_interest
    entity: Household
    dtype: Boolean
    period: Day
  - name: interview_conducted_and_all_verification_requested_on_filing_day
    entity: Household
    dtype: Boolean
    period: Day
  - name: subsequent_verification_requests_made
    entity: Household
    dtype: Boolean
    period: Day
  - name: department_provided_any_requested_assistance
    entity: Household
    dtype: Boolean
    period: Day
  - name: household_failed_to_provide_requested_verification
    entity: Household
    dtype: Boolean
    period: Day
rules:
  - name: ineligibility_notice_days
    kind: parameter
    dtype: Integer
    source: Alabama SNAP POE Manual 206 B, general denial notice deadline
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: not later than 30 days following the date the application was filed
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          30
  - name: missed_interview_notice_day
    kind: parameter
    dtype: Integer
    source: Alabama SNAP POE Manual 206 B, missed interview
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: the household should be issued a notice of denial on the 30th day following the date of application
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          30
  - name: missing_verification_notice_day
    kind: parameter
    dtype: Integer
    source: Alabama SNAP POE Manual 206 B, missing verification
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: the application shall be denied on the 30th day
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          30
  - name: regular_processing_deadline_days
    kind: derived
    entity: Household
    dtype: Integer
    period: Day
    source: Alabama SNAP POE Manual 206 A, Thirty-Day Processing; -1 denotes this deadline is inapplicable
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: eligible households that complete the initial application process
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: unless such households are entitled to expedited services
          - path: versions[0].formula
            kind: import
            import:
              target: us-al:policies/dhr/poe/chapter-02-application-processing/213#opportunity_to_participate_days
              output: opportunity_to_participate_days
              hash: sha256:b7368399cbf5b379630416faf87901446c521f51d3fdba04238a8ae63d8db180
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if household_eligible
          and initial_application_process_completed
          and not entitled_to_expedited_services:
            opportunity_to_participate_days
          else: -1
  - name: ineligibility_denial_deadline_days
    kind: derived
    entity: Household
    dtype: Integer
    period: Day
    source: Alabama SNAP POE Manual 206 B, general denial deadline and weekend or holiday adjustment; -1 denotes inapplicability
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: Households that are found to be ineligible are to be sent a notice of denial as soon as possible but not later than 30 days following the date the application was filed.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: If the 30th day falls on a weekend or holiday, the application should be denied on the first work day following the weekend or holiday.
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if household_found_ineligible:
            if thirtieth_day_is_weekend_or_holiday:
              days_from_filing_to_first_workday_after_weekend_or_holiday
            else: ineligibility_notice_days
          else: -1
  - name: missed_interview_denial_day
    kind: derived
    entity: Household
    dtype: Integer
    period: Day
    source: Alabama SNAP POE Manual 206 B, missed interview denial and requirement to file a new application to participate; -1 denotes inapplicability
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: If the household has failed to appear for a scheduled interview and has not made subsequent contact with the county department to express interest in pursuing the application
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: The household must file a new application if it wishes to participate.
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if failed_to_appear_for_scheduled_interview
          and not subsequent_contact_expressing_interest:
            missed_interview_notice_day
          else: -1
  - name: missing_verification_denial_day
    kind: derived
    entity: Household
    dtype: Integer
    period: Day
    source: Alabama SNAP POE Manual 206 B, same-day interview and verification request denial; -1 denotes inapplicability
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: conduct an interview and request all the necessary verification on the same day the application was filed
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: no subsequent requests for verification have been made
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-al/manual/dhr/poe/chapter-02-application-processing/206
              excerpt: if the county department provided any assistance the household requested and the household failed to provide the requested verification
    versions:
      - effective_from: '2026-06-01'
        formula: |-
          if interview_conducted_and_all_verification_requested_on_filing_day
          and not subsequent_verification_requests_made
          and department_provided_any_requested_assistance
          and household_failed_to_provide_requested_verification:
            missing_verification_notice_day
          else: -1
