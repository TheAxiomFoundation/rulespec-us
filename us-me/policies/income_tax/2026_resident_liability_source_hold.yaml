inputs:
  - name: me_pit_2026_federal_adjusted_gross_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Federal adjusted gross income from the aligned federal return; not a completed Maine income amount.
  - name: me_pit_2026_is_full_year_maine_resident_return
    entity: TaxUnit
    dtype: Bool
    period: Year
    description: True only for a full-year Maine resident individual return.
  - name: me_pit_2026_federal_and_maine_filing_units_are_aligned
    entity: TaxUnit
    dtype: Bool
    period: Year
    description: Whether the federal and Maine returns cover the same filing unit.
  - name: me_pit_2026_filing_status_single
    entity: TaxUnit
    dtype: Bool
    period: Year
    description: True only for a single filer.
  - name: me_pit_2026_filing_status_married_separate
    entity: TaxUnit
    dtype: Bool
    period: Year
    description: True only for a married individual filing separately.
  - name: me_pit_2026_filing_status_joint_or_surviving_spouse
    entity: TaxUnit
    dtype: Bool
    period: Year
    description: True only for a joint return or qualifying surviving-spouse return.
  - name: me_pit_2026_filing_status_head_of_household
    entity: TaxUnit
    dtype: Bool
    period: Year
    description: True only for a head-of-household return.
