format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
      - us-me/statute/36/5111
      - us-me/statute/36/5124-C
      - us-me/statute/36/5126-A
      - us-me/statute/36/5213-A
      - us-me/statute/36/5219-S
      - us-me/statute/36/5219-SS
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us-me/guidance/revenue/individual-income-tax/2026/rate-schedules
        - us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
        - us-me/statute/36/5111
        - us-me/statute/36/5124-C
        - us-me/statute/36/5126-A
        - us-me/statute/36/5213-A
        - us-me/statute/36/5219-S
        - us-me/statute/36/5219-SS
      rationale: |-
        The pinned official corpus contains Maine Revenue Services' final
        tax-year-2026 rate schedule. It supplies the three ordinary rates,
        filing-status-specific bracket thresholds and base amounts, the
        two-percent surcharge and filing-status-specific thresholds, the 2026
        basic standard-deduction amounts, additional age-or-blindness amounts,
        and the 2026 personal-exemption amount. The pinned corpus also contains
        bounded statutes for the ordinary rate, standard deduction, personal
        exemption, sales-tax-fairness credit, earned-income credit, and
        dependent-exemption credit.

        The corpus does not contain sections 5102 and 5122 or final 2026 Form
        1040ME instructions establishing the complete transformation from
        federal return outputs and raw facts to Maine adjusted gross income.
        It does not establish the complete itemized-deduction choice and
        phaseout chain, every special tax or surtax, the full nonrefundable and
        refundable credit surface, or annual credit ordering. Published
        deduction and exemption amounts therefore do not complete those
        stages. No caller-completed Maine income, deduction, exemption, taxable
        income, tax, surtax, or credit amount is accepted.

        Every public Money stage after the federal/raw-fact boundary is a
        fail-closed zero sentinel while its typed source hold remains active.
        The sentinels are not legal claims that Maine income or tax is zero.
        The separately encoded rate-and-surcharge pilot remains bounded to a
        completed-return Maine taxable-income input and is not composed into
        this annual resident surface.
  summary: |-
    Tax-year-2026 Maine full-year-resident annual individual-income-tax
    source-hold boundary. It accepts federal adjusted gross income, full-year
    Maine residency, aligned filing units, and one filing-status fact. It does
    not accept any completed Maine legal result.

    Maine adjusted gross income after modifications, deductions and
    exemptions, taxable income, tax before credits including surtaxes, tax
    after nonrefundable credits, refundable credits, and signed net liability
    before payments all fail closed while the pinned annual authority gaps
    remain. The module is intentionally incomplete and makes no annual-
    liability or oracle-parity claim.

    Withholding, estimated payments, extension payments, penalties, interest,
    payment refunds, filing and collection administration, local income taxes,
    nonresident sourcing, and part-year allocation are outside scope.
  deferred_outputs:
    - output: us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_state_adjusted_gross_income
      reason: |-
        The pinned corpus lacks sections 5102 and 5122 and the complete 2026
        additions, subtractions, and conformity instructions needed to
        construct Maine adjusted gross income from federal outputs and raw
        facts.
      source_values:
        - us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_income_base_source_hold_applies
    - output: us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_deductions_and_exemptions
      reason: |-
        The official schedule publishes 2026 basic amounts, but the complete
        itemized-deduction choice, phaseouts, spouse branches, and final-return
        instructions are not pinned.
      source_values:
        - us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_deduction_and_exemption_source_hold_applies
    - output: us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_taxable_income
      reason: |-
        Maine taxable income cannot be completed until the state-income,
        deduction, and exemption chains are source complete.
      source_values:
        - us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_complete_liability_source_hold_applies
    - output: us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_tax_before_credits_including_surtaxes
      reason: |-
        The 2026 ordinary schedules and surcharge are pinned, but they cannot
        be composed without Maine taxable income, and the complete annual
        specialty-tax surface is not pinned.
      source_values:
        - us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_tax_and_surtax_source_hold_applies
    - output: us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_tax_after_nonrefundable_credits
      reason: |-
        Complete 2026 nonrefundable-credit eligibility, limitations,
        carryforwards, and ordering are absent from the pinned corpus.
      source_values:
        - us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_credit_surface_source_hold_applies
    - output: us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_refundable_credits
      reason: |-
        The corpus contains bounded refundable-credit statutes but not the
        complete 2026 refundable-credit eligibility, phaseout, limitation, and
        ordering surface.
      source_values:
        - us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_credit_surface_source_hold_applies
    - output: us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_net_income_tax_liability_before_payments
      reason: |-
        Signed annual resident liability cannot be completed until every
        upstream income, deduction, exemption, tax, surtax, and credit hold is
        cleared and annual ordering is pinned.
      source_values:
        - us-me:policies/income_tax/2026_resident_liability_source_hold#me_pit_2026_complete_liability_source_hold_applies

rules:
  - name: me_pit_2026_filing_status_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Maine Revenue Services 2026 individual filing-status schedules
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "Single Individuals and Married Persons Filing Separate Returns"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "Unmarried or Legally Separated Individuals Who Qualify as Heads of Household"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "Married Individuals and Surviving Spouses Filing Joint Returns"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            me_pit_2026_filing_status_single
            and not me_pit_2026_filing_status_married_separate
            and not me_pit_2026_filing_status_joint_or_surviving_spouse
            and not me_pit_2026_filing_status_head_of_household
          )
          or (
            not me_pit_2026_filing_status_single
            and me_pit_2026_filing_status_married_separate
            and not me_pit_2026_filing_status_joint_or_surviving_spouse
            and not me_pit_2026_filing_status_head_of_household
          )
          or (
            not me_pit_2026_filing_status_single
            and not me_pit_2026_filing_status_married_separate
            and me_pit_2026_filing_status_joint_or_surviving_spouse
            and not me_pit_2026_filing_status_head_of_household
          )
          or (
            not me_pit_2026_filing_status_single
            and not me_pit_2026_filing_status_married_separate
            and not me_pit_2026_filing_status_joint_or_surviving_spouse
            and me_pit_2026_filing_status_head_of_household
          )

  - name: me_pit_2026_input_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Full-year Maine resident individual return at the federal/raw-fact boundary
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/statute/36/5111
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "For tax years beginning in 2026"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          me_pit_2026_is_full_year_maine_resident_return
          and me_pit_2026_federal_and_maine_filing_units_are_aligned
          and me_pit_2026_filing_status_is_valid
          and (
            me_pit_2026_federal_adjusted_gross_income >= 0
            or me_pit_2026_federal_adjusted_gross_income < 0
          )

  - name: me_pit_2026_income_base_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Missing Maine adjusted-gross-income construction under sections 5102 and 5122
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "Maine taxable income"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

  - name: me_pit_2026_deduction_and_exemption_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Published 2026 basic amounts do not complete deduction, exemption, and phaseout mechanics
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "Personal Exemption: $5,300"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "Standard Deduction: Single - $15,700"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/statute/36/5124-C
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/statute/36/5126-A
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

  - name: me_pit_2026_tax_and_surtax_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Source-complete 2026 schedules cannot execute before Maine taxable income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "5.8% of Maine taxable income"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "increased by a surcharge of 2%"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          me_pit_2026_income_base_source_hold_applies
          or me_pit_2026_deduction_and_exemption_source_hold_applies

  - name: me_pit_2026_credit_surface_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Missing complete operative 2026 Maine credit eligibility, limitations, and ordering
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/statute/36/5213-A
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/statute/36/5219-S
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/statute/36/5219-SS
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

  - name: me_pit_2026_complete_liability_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Combined source hold for incomplete 2026 Maine resident annual liability
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/guidance/revenue/individual-income-tax/2026/rate-schedules/document-1
              excerpt: "The tax is:"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/statute/36/5219-S
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          me_pit_2026_income_base_source_hold_applies
          or me_pit_2026_deduction_and_exemption_source_hold_applies
          or me_pit_2026_tax_and_surtax_source_hold_applies
          or me_pit_2026_credit_surface_source_hold_applies

  - name: me_pit_2026_state_adjusted_gross_income
