format: rulespec/v1
module:
  summary: |-
    The Department shall process denials —
    A. on the last day of the current certification period if continued eligibility cannot be determined prior to that date, or the household is ineligible and no interview could be completed,
    B. within 30 days after the date the renewal form was filed untimely, if the household is ineligible and no interview could be completed, or
    C. within ten days of determining the household is ineligible, if an interview has been completed and the household fails to provide requested mandatory verifications timely.
  source_verification:
    corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-151
    source_sha256: 3ec632b688c152289c586f00f01b83d9c17441d59cc505be2b606013294d3430
  proof_validation:
    required: true
inputs:
  - name: continued_eligibility_cannot_be_determined_before_certification_end
    entity: Household
    dtype: Boolean
    period: Day
  - name: household_is_ineligible
    entity: Household
    dtype: Boolean
    period: Day
  - name: no_interview_could_be_completed
    entity: Household
    dtype: Boolean
    period: Day
  - name: denial_processed_on_last_day_of_current_certification_period
    entity: Household
    dtype: Boolean
    period: Day
  - name: renewal_form_was_filed_untimely
    entity: Household
    dtype: Boolean
    period: Day
  - name: denial_processed
    entity: Household
    dtype: Boolean
    period: Day
  - name: days_from_untimely_renewal_filing_to_denial_processing
    entity: Household
    dtype: Integer
    period: Day
  - name: interview_has_been_completed
    entity: Household
    dtype: Boolean
    period: Day
  - name: requested_mandatory_verifications_not_provided_timely
    entity: Household
    dtype: Boolean
    period: Day
  - name: days_from_ineligibility_determination_to_denial_processing
    entity: Household
    dtype: Integer
    period: Day
rules:
  - name: untimely_renewal_denial_processing_limit_days
    kind: parameter
    dtype: Integer
    source: us-me/regulation/dhhs/ofi/chapter-301/block-151(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-151
              excerpt: within 30 days after the date the renewal form was filed untimely
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          30
  - name: missing_verification_denial_processing_limit_days
    kind: parameter
    dtype: Integer
    source: us-me/regulation/dhhs/ofi/chapter-301/block-151(C)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-151
              excerpt: within ten days of determining the household is ineligible
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          10
  - name: certification_end_denial_processing_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: us-me/regulation/dhhs/ofi/chapter-301/block-151; block-151(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-151
              excerpt: The Department shall process denials —
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-151
              excerpt: on the last day of the current certification period if continued eligibility cannot be determined prior to that date, or the household is ineligible and no interview could be completed
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          not (
            continued_eligibility_cannot_be_determined_before_certification_end
            or (household_is_ineligible and no_interview_could_be_completed)
          )
          or denial_processed_on_last_day_of_current_certification_period
  - name: untimely_renewal_denial_processing_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: us-me/regulation/dhhs/ofi/chapter-301/block-151; block-151(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-151
              excerpt: within 30 days after the date the renewal form was filed untimely, if the household is ineligible and no interview could be completed
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          not (
            renewal_form_was_filed_untimely
            and household_is_ineligible
            and no_interview_could_be_completed
          )
          or (
            denial_processed
            and days_from_untimely_renewal_filing_to_denial_processing >= 0
            and days_from_untimely_renewal_filing_to_denial_processing <= untimely_renewal_denial_processing_limit_days
          )
  - name: missing_verification_denial_processing_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: us-me/regulation/dhhs/ofi/chapter-301/block-151; block-151(C)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-151
              excerpt: within ten days of determining the household is ineligible, if an interview has been completed and the household fails to provide requested mandatory verifications timely
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          not (
            household_is_ineligible
            and interview_has_been_completed
            and requested_mandatory_verifications_not_provided_timely
          )
          or (
            denial_processed
            and days_from_ineligibility_determination_to_denial_processing >= 0
            and days_from_ineligibility_determination_to_denial_processing <= missing_verification_denial_processing_limit_days
          )
