format: rulespec/v1
module:
  summary: |-
    When any adverse action is called for and is based upon information from BEERS or IRS matches the household shall be sent a written notice at least 30 days prior to taking such adverse action.
  source_verification:
    corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-190
    source_sha256: 638d66401cacb82eaa5721f66f68fb9460c5f4c9659192d07a2237d70aed0091
  proof_validation:
    required: true
inputs:
  - name: adverse_action_called_for
    entity: Household
    dtype: Boolean
    period: Day
  - name: adverse_action_based_on_beers_match
    entity: Household
    dtype: Boolean
    period: Day
  - name: adverse_action_based_on_irs_match
    entity: Household
    dtype: Boolean
    period: Day
  - name: written_notice_sent_to_household
    entity: Household
    dtype: Boolean
    period: Day
  - name: days_between_notice_sent_and_adverse_action
    entity: Household
    dtype: Integer
    period: Day
rules:
  - name: minimum_match_notice_days
    kind: parameter
    dtype: Integer
    source: us-me/regulation/dhhs/ofi/chapter-301/block-190
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-190
              excerpt: at least 30 days prior to taking such adverse action
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          30
  - name: match_adverse_action_notice_requirement_satisfied
    kind: derived
    entity: Household
    dtype: Judgment
    period: Day
    source: us-me/regulation/dhhs/ofi/chapter-301/block-190
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-190
              excerpt: When any adverse action is called for and is based upon information from BEERS or IRS matches
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-190
              excerpt: the household shall be sent a written notice at least 30 days prior to taking such adverse action.
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          not adverse_action_called_for
          or not (adverse_action_based_on_beers_match or adverse_action_based_on_irs_match)
          or (written_notice_sent_to_household
              and days_between_notice_sent_and_adverse_action >= minimum_match_notice_days)
