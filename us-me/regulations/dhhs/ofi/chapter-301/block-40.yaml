format: rulespec/v1
module:
  summary: |-
    If an individual would have worked an average of 20 hours per week but missed some work for Good Cause, the individual is considered to have met the work requirement if the absence from work is temporary and the individual retains their job.
  source_verification:
    corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
    source_sha256: a44b933ea5d93a82d261d29ade23e4dd82e917165779d6d5b43f20af00b42688
  proof_validation:
    required: true
inputs:
  - name: average_weekly_hours_but_for_absence
    entity: Person
    dtype: Decimal
    period: Month
  - name: missed_work
    entity: Person
    dtype: Boolean
    period: Month
  - name: absence_is_temporary
    entity: Person
    dtype: Boolean
    period: Month
  - name: retains_job
    entity: Person
    dtype: Boolean
    period: Month
  - name: absence_due_to_illness
    entity: Person
    dtype: Boolean
    period: Month
  - name: absence_due_to_household_member_illness_requiring_presence
    entity: Person
    dtype: Boolean
    period: Month
  - name: absence_due_to_household_emergency
    entity: Person
    dtype: Boolean
    period: Month
  - name: absence_due_to_unavailable_transportation
    entity: Person
    dtype: Boolean
    period: Month
  - name: absence_due_to_other_circumstances_beyond_individual_control
    entity: Person
    dtype: Boolean
    period: Month
rules:
  - name: required_average_weekly_hours
    kind: parameter
    dtype: Decimal
    source: us-me/regulation/dhhs/ofi/chapter-301/block-40(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: an average of 20 hours per week
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          20
  - name: good_cause_for_absence
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: us-me/regulation/dhhs/ofi/chapter-301/block-40(B), (B)(1), (B)(2), (B)(3), (B)(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: Good Cause includes circumstances beyond the individual's control, such as, but not limited to—
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: (1) illness,
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: (2) illness of another household member requiring the presence of the member,
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: (3) a household emergency, or
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: (4) the unavailability of transportation.
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          absence_due_to_illness
          or absence_due_to_household_member_illness_requiring_presence
          or absence_due_to_household_emergency
          or absence_due_to_unavailable_transportation
          or absence_due_to_other_circumstances_beyond_individual_control
  - name: work_requirement_met_despite_absence
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: us-me/regulation/dhhs/ofi/chapter-301/block-40(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: the individual is considered to have met the work requirement if the absence from work is temporary and the individual retains their job.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-me/regulation/dhhs/ofi/chapter-301/block-40
              excerpt: would have worked an average of 20 hours per week but missed some work for Good Cause
    versions:
      - effective_from: '2026-06-28'
        formula: |-
          average_weekly_hours_but_for_absence >= required_average_weekly_hours
          and missed_work
          and good_cause_for_absence
          and absence_is_temporary
          and retains_job
