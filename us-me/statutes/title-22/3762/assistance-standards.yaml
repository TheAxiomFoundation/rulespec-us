        formula: |-
          60

  - name: pretermination_notice_day_limit
    kind: parameter
    dtype: Count
    source: Title 22, §3762(19)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "No later than 120 days prior to the end of a family's 60th month"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          120

  - name: family_assets_within_tanf_limit
    kind: derived
    entity: Family
    dtype: Judgment
    period: Month
    source: Title 22, §3762(3)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "For the purpose of determining eligibility for TANF, the department shall impose an asset limit of $10,000 per family"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          countable_family_assets <= tanf_family_asset_limit

  - name: vehicle_count_exempt_from_tanf_asset_limit
    kind: derived
    entity: Family
    dtype: Count
    period: Month
    source: Title 22, §3762(3)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "must exempt from the asset limit one vehicle for each licensed driver in the family"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          licensed_drivers_in_family * exempt_vehicles_per_licensed_driver

  - name: child_support_pass_through_excluded_from_tanf_budget
    kind: derived
    entity: Family
    dtype: Money
    unit: USD
    period: Month
    source: Title 22, §3762(3)(B)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "the first $50 per month of current child support collections and the exclusion of the $50 pass-through"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          min(current_child_support_collections, monthly_child_support_pass_through_amount)

  - name: tanf_special_housing_allowance
    kind: derived
    entity: Family
    dtype: Money
    unit: USD
    period: Month
    source: Title 22, §3762(3)(B)(6)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "shelter expenses ... equal or exceed 50% of their monthly income ... limited to $300 per month"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if shelter_expenses_for_housing_allowance >= monthly_income_for_housing_allowance * special_housing_allowance_shelter_expense_income_ratio: special_housing_allowance_monthly_cap else: 0

  - name: additional_snap_benefit_during_tanf_earnings_disregard
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: Title 22, §3762(3)(B)(7-E)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "For any period during which a household's SNAP benefit is reduced ... provide the household with a minimum of $50 in SNAP benefits."
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if snap_benefit_reduced_due_to_tanf_earnings_disregard: max(0, minimum_snap_benefit_with_earnings_disregard - snap_benefit_for_which_household_remains_eligible) else: 0

  - name: transitional_food_benefit
    kind: derived
    entity: Family
    dtype: Money
    unit: USD
    period: Month
    source: Title 22, §3762(8)(F)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "SNAP benefit recipients living with one or more dependent children under 18 years of age who are working at least 30 hours per week or ... 20 hours per week if one or more dependent child is under 6 years of age. The benefit may not exceed $100 per month per family."
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          if family_receives_snap_and_lives_with_dependent_child_under_18 and (weekly_work_hours >= transitional_food_standard_work_hours or (weekly_work_hours >= transitional_food_young_child_work_hours and family_has_dependent_child_under_transitional_food_young_child_age_limit)): min(requested_transitional_food_benefit, transitional_food_benefit_monthly_cap) else: 0

  - name: tanf_not_denied_due_to_drug_related_felony
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: Title 22, §3762(17)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "otherwise eligible to receive TANF may not be denied assistance because the person has been convicted of a drug-related felony"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          person_otherwise_eligible_for_tanf

  - name: family_within_tanf_lifetime_limit
    kind: derived
    entity: Family
    dtype: Judgment
    period: Month
    source: Title 22, §3762(18)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "a family may not receive TANF assistance for longer than 60 months except ... exemption or extension"
    versions:
      - effective_from: '2012-01-01'
        formula: |-
          months_of_tanf_assistance_received <= tanf_lifetime_assistance_month_limit or department_has_determined_exemption_or_extension
