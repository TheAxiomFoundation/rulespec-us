  - name: assistance_notice_day_limit
    kind: parameter
    dtype: Count
    source: Title 22, §3762(9)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "written notice ... within 30 days of application"
