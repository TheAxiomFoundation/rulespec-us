format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
  summary: |-
    The department may administer TANF and must include eligibility criteria, budgeting, benefit calculation and confidentiality rules. For TANF eligibility, the department shall impose a $10,000 asset limit per family and exempt one vehicle for each licensed driver. Funds must support specified assistance including a $50 monthly child support pass-through, pregnant-woman assistance when the expected birth is not more than 90 days away, a special housing allowance capped at $300 when shelter expenses equal or exceed 50% of monthly income, earned-income disregards, minimum SNAP benefits during specified earned-income disregard periods, transitional transportation, child care and food benefits, procedures and notices, and a 60-month lifetime limit subject to exemptions and extensions.
rules:
  - name: tanf_family_asset_limit
    kind: parameter
    dtype: Money
    unit: USD
    period: Month
    source: Title 22, §3762(3)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "asset limit of $10,000 per family"
    versions:
      - effective_from: '0001-01-01'
        formula: |-
          10000

  - name: exempt_vehicles_per_licensed_driver
    kind: parameter
    dtype: Count
    source: Title 22, §3762(3)(A)
    metadata:
      proof:
        atoms:
