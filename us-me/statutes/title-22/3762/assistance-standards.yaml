    kind: parameter
    dtype: Count
    source: Title 22, §3762(18)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-me/statute/title-22/3762/assistance-standards
              excerpt: "may not receive TANF assistance for longer than 60 months"
