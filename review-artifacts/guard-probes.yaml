cases:
  - name: rows_added_to_both_surfaces_keep_counts_equal
    period: 2026-01
    input:
      <<: *common_input
      us:policies/usda/snap/state-plan-composition#relation.member_of_household:
        - _entity_id: eligible_both
          <<: *eligible_member
        - _entity_id: ipv_both
          <<: *eligible_member
          us-ca:policies/cdss/snap/modified-categorical-eligibility#input.member_disqualified_for_intentional_program_violation: true
      us-ca:policies/cdss/snap/modified-categorical-eligibility#relation.calfresh_mce_canonical_member_of_household:
        - _entity_id: eligible_both
        - _entity_id: ipv_both
    output:
      us:policies/usda/snap/state-plan-composition#snap_state_plan_member_of_household_count: 2
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_canonical_membership_integrity_verified: holds
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_household_exclusion_applies: holds
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_status_conferred: not_holds
    member_output:
      ipv_both:
        us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_member_household_exclusion_applies: holds

  - name: equal_supplied_cardinality_membership_swap
    period: 2026-01
    input:
      <<: *common_input
      us:policies/usda/snap/fy-2026-cola/income-eligibility-standards#input.household_size: 1
      us:policies/usda/snap/state-plan-composition#relation.member_of_household:
        - _entity_id: excluded_source
          <<: *excluded_alien_member
      us-ca:policies/cdss/snap/modified-categorical-eligibility#relation.calfresh_mce_canonical_member_of_household:
        - _entity_id: eligible_replacement
          <<: *eligible_member
    output:
      us:policies/usda/snap/state-plan-composition#snap_state_plan_member_of_household_count: 1
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_canonical_membership_integrity_verified: not_holds
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_household_exclusion_applies: holds
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_status_conferred: not_holds
    member_output:
      excluded_source:
        us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_member_eligible: not_holds
      eligible_replacement:
        us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_member_eligible: holds

  - name: inconsistent_rows_fed_directly_to_anchor
    period: 2026-01
    input:
      <<: *common_input
      us:policies/usda/snap/state-plan-composition#relation.member_of_household:
        - _entity_id: eligible_anchor
          <<: *eligible_member
        - _entity_id: ipv_injected_anchor
          <<: *eligible_member
          us-ca:policies/cdss/snap/modified-categorical-eligibility#input.member_disqualified_for_intentional_program_violation: true
    output:
      us:policies/usda/snap/state-plan-composition#snap_state_plan_member_of_household_count: 2
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_canonical_membership_integrity_verified: holds
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_household_exclusion_applies: holds
      us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_status_conferred: not_holds
    member_output:
      ipv_injected_anchor:
        us-ca:policies/cdss/snap/modified-categorical-eligibility#calfresh_mce_member_household_exclusion_applies: holds
