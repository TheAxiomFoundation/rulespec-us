format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-il/statute/35/5/201-current/block-1
      - us-il/statute/35/5/203-current/block-1
      - us-il/statute/35/5/204-current/block-1
      - us-il/statute/35/5/208-current/block-1
      - us-il/statute/35/5/212-current/block-1
      - us-il/statute/35/5/244-current/block-1
      - us-il/statute/35/5/601-current/block-1
      - us-il/statute/public-act/104-0468/page-992
      - us-il/statute/public-act/104-0468/page-1290
      - us-il/statute/public-act/104-0468/page-1333
      - us-il/statute/public-act/104-0468/page-1334
      - us-il/guidance/idor/2026-personal-exemption-allowance/block-1
    upstream_source_check:
      status: checked_higher_authority
      checked_paths:
        - us-il/statute/35/5/201-current/block-1
        - us-il/statute/35/5/203-current/block-1
        - us-il/statute/35/5/204-current/block-1
        - us-il/statute/35/5/208-current/block-1
        - us-il/statute/35/5/212-current/block-1
        - us-il/statute/35/5/244-current/block-1
        - us-il/statute/35/5/601-current/block-1
        - us-il/statute/public-act/104-0468/page-992
        - us-il/statute/public-act/104-0468/page-1290
        - us-il/statute/public-act/104-0468/page-1333
        - us-il/statute/public-act/104-0468/page-1334
        - us-il/guidance/idor/2026-personal-exemption-allowance/block-1
      rationale: |-
        Current official Illinois Income Tax Act sections supply the resident
        individual base-income definition, exemption, 4.95 percent tax,
        residential property-tax credit, earned income credit, child tax
        credit, other-state credit, and specialty branches. Public Act
        104-0468 independently confirms the section 1202 gain addition for tax
        years ending on and after December 31, 2026 and the amended
        pass-through-entity election and refundable-credit surface. IDOR's
        official tax-year-2026 guidance supplies the $2,925 exemption amount.

        This module accepts federal adjusted gross income and separately named
        federal or raw fact categories. It does not accept completed Illinois
        base income, taxable income, exemption, tax, credit, recapture, or
        liability amounts. The directly encoded section 203 profile is limited
        to tax-exempt interest and dividends other than section 305(e) utility
        stock dividends, Illinois income tax deducted in federal AGI, section
        1202 excluded gain, enumerated federally included retirement and
        disability distributions, Social Security and railroad-retirement
        benefits, and United States obligation income included in the section
        203 modified total, including federal-tax-exempt amounts first added
        under paragraph (A).

        Section 203 contains many additional modifications, including the 2026
        bonus-depreciation addition and its property-specific subtraction
        chain. Those branches are typed holds. So are special surcharges and
        recaptures, multi-use residence attribution, expanded Illinois EITC
        eligibility requiring a hypothetical federal credit, education and
        other-state credits, pass-through-entity credits, and all other credit
        surfaces. The pinned corpus does not include final tax-year-2026
        IL-1040 instructions establishing complete return ordering. Candidate
        outputs therefore exist only when every typed hold is absent.
  summary: |-
    Tax-year-2026 Illinois full-year resident individual-income-tax core for
    aligned federal and Illinois filing units. Within a disclosed fail-closed
    profile, it starts from federal adjusted gross income, applies common
    source-grounded additions and subtractions, computes the $2,925 personal
    exemptions plus $1,000 age and blindness additions, applies the federal-AGI
    exemption ceiling, floors taxable income at zero, and applies the 4.95
    percent individual rate.

    The same supported profile computes the 5 percent single-use principal-
    residence property-tax credit, the refundable Illinois earned income
    credit as 20 percent of an actually allowed federal section 32 credit, and
    the refundable child credit as 40 percent of the Illinois EITC when a
    section 152 qualifying child is under age 12. The terminal profile
    candidate is signed and may be negative. It is not represented as complete
    annual liability outside this profile; every omitted legal surface is a
    typed source hold rather than a caller-completed state amount.
  deferred_outputs:
    - output: us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_complete_base_income
      reason: |-
        Section 203 includes many additions and subtractions beyond the common
        federal categories directly encoded here. Bonus depreciation also
        requires a property- and year-specific subtraction chain. The complete
        output remains deferred whenever the base-income source hold applies.
      source_values:
        - us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_base_income_source_hold_applies
        - us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_supported_profile_candidate_base_income
    - output: us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_complete_taxable_income
      reason: |-
        Complete taxable income depends on the complete section 203
        modification surface. The profile candidate is certified only when the
        base-income hold is absent.
      source_values:
        - us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_supported_profile_candidate_taxable_income
    - output: us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_complete_tax_after_nonrefundable_credits
      reason: |-
        Education-expense, other-state, multi-use property attribution, and
        other nonrefundable-credit branches remain held, and the pinned corpus
        lacks final 2026 return ordering.
      source_values:
        - us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_supported_profile_candidate_tax_after_nonrefundable_credits
    - output: us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_complete_net_income_tax_liability_before_payments
      reason: |-
        Complete annual liability additionally requires specialty surcharges
        and recaptures, expanded-EITC hypothetical federal calculations,
        pass-through-entity and other refundable credits, all nonrefundable
        credits, and final tax-year-2026 return ordering.
      source_values:
        - us-il:policies/income_tax/2026_full_year_resident_core#il_pit_2026_supported_profile_candidate_net_income_tax_liability_before_payments

rules:
  - name: il_pit_2026_individual_income_tax_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: 35 ILCS 5/201(b)(5.3)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-il/statute/35/5/201-current/block-1
              excerpt: "for taxable years beginning on or after July 1, 2017, an amount equal to 4.95% of the taxpayer's net income for the taxable year"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '0.0495'}

  - name: il_pit_2026_personal_exemption_amount
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: IDOR Answer 851, tax-year-2026 personal exemption
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-il/guidance/idor/2026-personal-exemption-allowance/block-1
              excerpt: "For tax year beginning January 1, 2026, it is $2,925 per exemption."
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '2925'}

  - name: il_pit_2026_age_or_blindness_exemption_amount
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: 35 ILCS 5/204(c)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-il/statute/35/5/204-current/block-1
              excerpt: "An additional exemption of $1,000 for the taxpayer if he or she has attained the age of 65 before the end of the taxable year."
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '1000'}

  - name: il_pit_2026_joint_exemption_and_property_credit_agi_ceiling
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: 35 ILCS 5/204(d) and 5/208
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-il/statute/35/5/204-current/block-1
              excerpt: "$500,000, in the case of spouses filing a joint federal tax return"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '500000'}

  - name: il_pit_2026_other_exemption_and_property_credit_agi_ceiling
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: 35 ILCS 5/204(d) and 5/208
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-il/statute/35/5/204-current/block-1
              excerpt: "$250,000, in the case of all other taxpayers."
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '250000'}

  - name: il_pit_2026_residential_property_tax_credit_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: 35 ILCS 5/208
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-il/statute/35/5/208-current/block-1
              excerpt: "a tax credit equal to 5% of real property taxes paid by such taxpayer during the taxable year on the principal residence of the taxpayer"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '0.05'}

  - name: il_pit_2026_earned_income_credit_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: 35 ILCS 5/212(a)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-il/statute/35/5/212-current/block-1
              excerpt: "20% of the federal tax credit for each taxable year beginning on or after January 1, 2023"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '0.20'}

  - name: il_pit_2026_child_tax_credit_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: 35 ILCS 5/244(a)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-il/statute/35/5/244-current/block-1
              excerpt: "For tax years beginning on or after January 1, 2025, the amount of the credit shall be equal to 40% of the credit allowed to the taxpayer under Section 212"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '0.40'}

  - name: il_pit_2026_input_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Fail-closed nonnegative-domain guard for unsigned federal and raw fact inputs
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "The adjusted gross income referred to in paragraph (1) shall be modified by adding thereto"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_federal_tax_exempt_interest_and_dividends_other_than_section_305_e_utility_stock_dividends >= 0
          and il_pit_2026_illinois_income_tax_deducted_in_federal_adjusted_gross_income >= 0
          and il_pit_2026_federal_section_1202_excluded_gain >= 0
          and il_pit_2026_federally_included_distributions_under_sections_402_403_406_407_408_or_qualifying_governmental_retirement_plans >= 0
          and il_pit_2026_federally_included_social_security_and_railroad_retirement_benefits >= 0
          and il_pit_2026_united_states_obligation_income_in_section_203_modified_total >= 0
          and il_pit_2026_dependent_count >= 0
          and il_pit_2026_dependent_count == floor(il_pit_2026_dependent_count)
          and il_pit_2026_real_property_taxes_paid_on_single_use_principal_residence >= 0
          and il_pit_2026_federal_section_32_earned_income_credit_allowed >= 0

  - name: il_pit_2026_filing_status_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Exactly one federal filing-status branch must be selected
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-il/statute/35/5/204-current/block-1
              excerpt: "spouses filing a joint federal tax return"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            il_pit_2026_filing_status_single
            and not il_pit_2026_filing_status_joint
            and not il_pit_2026_filing_status_married_separate
            and not il_pit_2026_filing_status_head_of_household
            and not il_pit_2026_filing_status_qualifying_surviving_spouse
          )
          or (
            not il_pit_2026_filing_status_single
            and il_pit_2026_filing_status_joint
            and not il_pit_2026_filing_status_married_separate
            and not il_pit_2026_filing_status_head_of_household
            and not il_pit_2026_filing_status_qualifying_surviving_spouse
          )
          or (
            not il_pit_2026_filing_status_single
            and not il_pit_2026_filing_status_joint
            and il_pit_2026_filing_status_married_separate
            and not il_pit_2026_filing_status_head_of_household
            and not il_pit_2026_filing_status_qualifying_surviving_spouse
          )
          or (
            not il_pit_2026_filing_status_single
            and not il_pit_2026_filing_status_joint
            and not il_pit_2026_filing_status_married_separate
            and il_pit_2026_filing_status_head_of_household
            and not il_pit_2026_filing_status_qualifying_surviving_spouse
          )
          or (
            not il_pit_2026_filing_status_single
            and not il_pit_2026_filing_status_joint
            and not il_pit_2026_filing_status_married_separate
            and not il_pit_2026_filing_status_head_of_household
            and il_pit_2026_filing_status_qualifying_surviving_spouse
          )

  - name: il_pit_2026_base_income_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Typed hold for unencoded section 203 modifications and bonus-depreciation chains
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "for taxable years 2026 and thereafter, an amount equal to the bonus depreciation deduction taken on the taxpayer's federal income tax return"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_has_section_168_k_or_n_bonus_depreciation
          or il_pit_2026_has_other_section_203_addition_or_subtraction

  - name: il_pit_2026_special_tax_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Typed hold for recapture and specialty surcharge branches under section 201
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-il/statute/35/5/201-current/block-1
              excerpt: "the tax imposed under subsections (a) and (b) of this Section for such taxable year shall be increased"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_has_investment_credit_recapture
          or il_pit_2026_has_gaming_or_cannabis_surcharge

  - name: il_pit_2026_credit_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Typed hold for unencoded nonrefundable, refundable, attribution, and expanded-EITC branches
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-il/statute/35/5/601-current/block-1
              excerpt: "The aggregate amount of tax which is imposed upon or measured by income and which is paid by a resident for a taxable year to another state"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-il/statute/35/5/212-current/block-1
              excerpt: "each individual taxpayer filing a return using an individual taxpayer identification number"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-il/statute/public-act/104-0468/page-1334
              excerpt: "amount of the credit allowed under this paragraph exceeds the partner's or shareholder's liability"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_has_education_expense_credit
          or il_pit_2026_has_other_state_income_tax_credit
          or il_pit_2026_has_other_nonrefundable_credit
          or il_pit_2026_has_pass_through_entity_refundable_credit
          or il_pit_2026_has_other_refundable_credit
          or il_pit_2026_has_multi_unit_multi_use_or_farm_principal_residence_property_tax
          or il_pit_2026_requires_section_212_hypothetical_federal_eitc

  - name: il_pit_2026_complete_liability_source_hold_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Combined source hold for every legal surface outside the bounded profile
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/statute/35/5/201-current/block-1
              excerpt: "A tax measured by net income is hereby imposed on every individual"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_base_income_source_hold_applies
          or il_pit_2026_special_tax_source_hold_applies
          or il_pit_2026_credit_source_hold_applies

  - name: il_pit_2026_supported_profile_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Fail-closed status for the bounded full-year resident annual-return profile
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "In the case of an individual, base income means an amount equal to the taxpayer's adjusted gross income for the taxable year"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-il/statute/35/5/204-current/block-1
              excerpt: "For spouse when a joint return is not filed."
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_input_domain_is_valid
          and il_pit_2026_filing_status_is_valid
          and il_pit_2026_is_full_year_illinois_resident_return
          and il_pit_2026_federal_and_illinois_filing_units_are_aligned
          and not il_pit_2026_complete_liability_source_hold_applies
          and (
            il_pit_2026_filing_status_joint
            or (
              not il_pit_2026_spouse_age_65_or_older
              and not il_pit_2026_spouse_blind
            )
          )

  - name: il_pit_2026_directly_encoded_additions
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 35 ILCS 5/203(a)(2)(A), (B), and (D-26)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "An amount equal to all amounts paid or accrued to the taxpayer as interest or dividends during the taxable year to the extent excluded from gross income"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/statute/public-act/104-0468/page-992
              excerpt: "an amount equal to the amount of gain excluded from gross income under Section 1202 of the Internal Revenue Code"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_federal_tax_exempt_interest_and_dividends_other_than_section_305_e_utility_stock_dividends
          + il_pit_2026_illinois_income_tax_deducted_in_federal_adjusted_gross_income
          + il_pit_2026_federal_section_1202_excluded_gain

  - name: il_pit_2026_directly_encoded_subtractions
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 35 ILCS 5/203(a)(2)(F), (L), and (N)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "included in such total as distributions under the provisions of any retirement or disability plan for employees of any governmental agency or unit"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "an amount equal to all social security benefits and railroad retirement benefits included in such total"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "all amounts included in such total which are exempt from taxation by this State"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          il_pit_2026_federally_included_distributions_under_sections_402_403_406_407_408_or_qualifying_governmental_retirement_plans
          + il_pit_2026_federally_included_social_security_and_railroad_retirement_benefits
          + il_pit_2026_united_states_obligation_income_in_section_203_modified_total

  - name: il_pit_2026_supported_profile_candidate_base_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 35 ILCS 5/203(a), supported-profile federal AGI plus additions less subtractions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/statute/35/5/203-current/block-1
              excerpt: "base income means an amount equal to the taxpayer's adjusted gross income for the taxable year as modified by paragraph (2)"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if il_pit_2026_supported_profile_applies:
            il_pit_2026_federal_adjusted_gross_income
            + il_pit_2026_directly_encoded_additions
            - il_pit_2026_directly_encoded_subtractions
          else:
            0

  - name: il_pit_2026_basic_exemption_units
    kind: derived
    entity: TaxUnit
    dtype: Number
    period: Year
    source: 35 ILCS 5/204 and IDOR Answer 851
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-il/guidance/idor/2026-personal-exemption-allowance/block-1
              excerpt: "If someone else can claim you as a dependent and your Illinois base income is $2,925 or less, your exemption allowance is $2,925."
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if il_pit_2026_taxpayer_is_claimed_as_dependent:
            if il_pit_2026_supported_profile_candidate_base_income <= il_pit_2026_personal_exemption_amount:
              1
            else:
              0
          else:
