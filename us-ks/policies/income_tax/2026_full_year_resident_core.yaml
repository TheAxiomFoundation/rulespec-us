format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-ks/statute/2026/79-32-109/block-1
      - us-ks/statute/2026/79-32-110/block-1
      - us-ks/statute/2026/79-32-110c/block-1
      - us-ks/statute/2026/79-32-116/block-1
      - us-ks/statute/2026/79-32-117/block-1
      - us-ks/statute/2026/79-32-119/block-1
      - us-ks/statute/2026/79-32-120/block-1
      - us-ks/statute/2026/79-32-121/block-1
      - us-ks/statute/2026/79-32-121b/block-1
      - us-ks/statute/2026/79-32-205/block-1
      - us-ks/statute/2026/79-32-288/block-1
      - us-ks/statute/session-2026/sb-82/page-1
    upstream_source_check:
      status: checked_higher_authority_with_typed_holds
      checked_paths:
        - us-ks/statute/2026/79-32-109/block-1
        - us-ks/statute/2026/79-32-110/block-1
        - us-ks/statute/2026/79-32-110c/block-1
        - us-ks/statute/2026/79-32-117/block-1
        - us-ks/statute/2026/79-32-119/block-1
        - us-ks/statute/2026/79-32-120/block-1
        - us-ks/statute/2026/79-32-121/block-1
        - us-ks/statute/2026/79-32-121b/block-1
        - us-ks/statute/2026/79-32-205/block-1
        - us-ks/statute/session-2026/sb-82/page-1
      rationale: |-
        The pinned current official Kansas statutes supply the resident
        definition, federal-AGI starting point, directly executable common
        modifications, standard and itemized deductions, personal exemptions,
        ordinary rate schedules, and refundable earned-income credit. Enacted
        2026 Senate Bill 82 identifies a new person-based gun-storage credit
        that must be held when qualifying expenditures are present.

        The two official exemption texts expressly disclose unreconciled
        multiple amendments. They agree for single and joint filers without an
        unborn-child or permanently disabled-veteran branch, so the supported
        profile is limited to that intersection. The statutes do not supply
        the separate-filer standard-deduction split used on annual forms, and
        the tax-year-2026 Form K-40 and credit ordering instructions are not
        yet available. Those filing statuses, exemption branches, specialty
        modifications, other-state and pass-through credits, business and
        agency-certified credits, carryforwards, and return-ordering branches
        are typed holds. The existing K-40ES estimated-tax source is not used
        as a substitute for missing annual-return authority.
  summary: |-
    Bounded tax-year-2026 Kansas full-year-resident individual-income-tax
    pipeline for single and joint returns. It starts from federal adjusted
    gross income and raw modification facts, computes Kansas adjusted gross
    income, standard or itemized deductions, the exemption amount on which
    both official amendment versions agree, taxable income, ordinary tax, and
    the refundable Kansas earned income credit. Nonzero gun-storage
    expenditures fail closed because the enacted credit is stated per
    individual and this module does not replace that person-level base with a
    TaxUnit placeholder. The final supported amount is signed net liability
    before withholding, estimated payments, and other administrative payments.

    Every candidate amount is private. Public stage outputs are transitively
    gated by a source-readiness Judgment and return zero for an invalid or held
    profile. This is not universal Kansas liability: it deliberately holds
    every branch for which current operative authority, annual-return
    ordering, or the raw-fact model is incomplete.
  deferred_outputs:
    - output: us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_complete_kansas_adjusted_gross_income
      reason: |-
        Section 79-32,117 contains numerous business, basis, pension,
        education-account, pass-through, fiduciary, adoption-account, and
        transition modifications whose complete raw-fact model is outside the
        pinned common profile.
      source_values:
        - us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_supported_kansas_adjusted_gross_income
    - output: us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_complete_taxable_income
      reason: |-
        The two official exemption versions differ for unborn-child,
        head-of-household, and disabled-veteran branches, while the unavailable
        2026 K-40 instructions are needed for separate and surviving-spouse
        deduction treatment.
      source_values:
        - us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_supported_taxable_income
    - output: us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_complete_tax_after_nonrefundable_credits
      reason: |-
        Other-state, gun-storage, property, charitable, business,
        agency-certified, transferred, and carryforward credits require
        additional person/entity modeling, source, and return-ordering
        coverage.
      source_values:
        - us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_supported_tax_after_nonrefundable_credits
    - output: us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_net_income_tax_liability
      reason: |-
        Section 79-32,288's refundable pass-through-entity credit and other
        specialty refundable branches require entity-level Kansas tax
        construction and the 2026 annual return order; no caller-completed
        state credit is accepted.
      source_values:
        - us-ks:policies/income_tax/2026_full_year_resident_core#ks_pit_2026_supported_net_income_tax_liability

rules:
  - name: ks_pit_2026_input_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Fail-closed domain for raw federal and Kansas return facts
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-109/block-1
              excerpt: '"Resident individual" means a natural person who is domiciled in this state'
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-117/block-1
              excerpt: "federal adjusted gross income for the taxable year, with the modifications specified in this section"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (
            ks_pit_2026_filing_status_single
            or ks_pit_2026_filing_status_joint
          )
          and not (
            ks_pit_2026_filing_status_single
            and ks_pit_2026_filing_status_joint
          )
          and ks_pit_2026_federal_additional_standard_deduction_count >= 0
          and floor(ks_pit_2026_federal_additional_standard_deduction_count) == ks_pit_2026_federal_additional_standard_deduction_count
          and ks_pit_2026_federal_dependent_count >= 0
          and floor(ks_pit_2026_federal_dependent_count) == ks_pit_2026_federal_dependent_count
          and ks_pit_2026_other_state_local_bond_interest_excluded_from_federal_agi >= 0
          and ks_pit_2026_income_taxes_deducted_in_federal_agi >= 0
          and ks_pit_2026_us_obligation_interest_in_federal_agi >= 0
          and ks_pit_2026_income_tax_refunds_in_federal_agi >= 0
          and ks_pit_2026_federal_civil_service_or_military_retirement_in_federal_agi >= 0
          and ks_pit_2026_federal_charitable_contribution_deduction >= 0
          and ks_pit_2026_federal_medical_expense_deduction >= 0
          and ks_pit_2026_federal_qualified_residence_interest_deduction >= 0
          and ks_pit_2026_federal_real_personal_property_tax_deduction >= 0
          and ks_pit_2026_state_local_income_tax_in_itemized_deductions >= 0
          and ks_pit_2026_disallowed_depreciation_in_itemized_deductions >= 0
          and (
            ks_pit_2026_state_local_income_tax_in_itemized_deductions
            + ks_pit_2026_disallowed_depreciation_in_itemized_deductions
            <=
            ks_pit_2026_federal_charitable_contribution_deduction
            + ks_pit_2026_federal_medical_expense_deduction
            + ks_pit_2026_federal_qualified_residence_interest_deduction
            + ks_pit_2026_federal_real_personal_property_tax_deduction
          )
          and ks_pit_2026_qualifying_gun_storage_expenditures >= 0
          and ks_pit_2026_federal_earned_income_credit >= 0

  - name: ks_pit_2026_base_profile_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Common-profile source readiness through ordinary tax
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-117/block-1
              excerpt: "There shall be added to federal adjusted gross income"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-121/block-1
              excerpt: "an unborn child"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-121b/block-1
              excerpt: "disability compensation at the 100% rate"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ks_pit_2026_input_domain_is_valid
          and ks_pit_2026_is_full_year_resident_individual_return
          and not ks_pit_2026_has_other_kansas_agi_addition
          and not ks_pit_2026_has_other_kansas_agi_subtraction
          and not ks_pit_2026_has_unborn_child_exemption
          and not ks_pit_2026_has_permanently_disabled_veteran_exemption
          and not ks_pit_2026_has_other_kansas_deduction_or_exemption

  - name: ks_pit_2026_supported_profile_applies
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Transitive source-readiness gate through signed net liability
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-ks/statute/session-2026/sb-82/page-1
              excerpt: "there shall be allowed a credit against the tax liability of a resident individual"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-288/block-1
              excerpt: "if any excess credit exists, such amount shall be refundable"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ks_pit_2026_base_profile_applies
          and ks_pit_2026_qualifying_gun_storage_expenditures == 0
          and not ks_pit_2026_has_other_state_income_tax_credit
          and not ks_pit_2026_has_pass_through_entity_tax_credit
          and not ks_pit_2026_has_other_nonrefundable_credit_or_carryforward
          and not ks_pit_2026_has_other_refundable_credit

  - name: ks_pit_2026_lower_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: K.S.A. 79-32,110(a), 2024-and-later lower rate
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-110/block-1
              excerpt: "5.2% of Kansas taxable income"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '0.052'}

  - name: ks_pit_2026_upper_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: K.S.A. 79-32,110(a), 2024-and-later upper rate
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-110/block-1
              excerpt: "5.58% of excess over $46,000"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '0.0558'}

  - name: ks_pit_2026_joint_bracket_ceiling
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,110(a)(1)(B)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-110/block-1
              excerpt: "Not over $46,000"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '46000'}

  - name: ks_pit_2026_single_bracket_ceiling
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,110(a)(2)(B)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-110/block-1
              excerpt: "Not over $23,000"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '23000'}

  - name: ks_pit_2026_single_standard_deduction
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,119(c)(2)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-119/block-1
              excerpt: "Single individual filing status, $3,605"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '3605'}

  - name: ks_pit_2026_joint_standard_deduction
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,119(c)(2)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-119/block-1
              excerpt: "married filing status, $8,240"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '8240'}

  - name: ks_pit_2026_single_additional_standard_deduction
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,119(b)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-119/block-1
              excerpt: "Single individual and head of household filing status, $850"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '850'}

  - name: ks_pit_2026_joint_additional_standard_deduction
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,119(b)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-119/block-1
              excerpt: "married filing status, $700"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '700'}

  - name: ks_pit_2026_single_personal_exemption
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: Shared K.S.A. 79-32,121 and 79-32,121b single amount
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-121/block-1
              excerpt: "a personal exemption of $9,160"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '9160'}

  - name: ks_pit_2026_joint_personal_exemption
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: Shared K.S.A. 79-32,121 and 79-32,121b joint amount
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-121b/block-1
              excerpt: "a personal exemption of $18,320"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '18320'}

  - name: ks_pit_2026_dependent_exemption
    kind: parameter
    dtype: Money
    period: Year
    unit: USD
    source: Shared K.S.A. 79-32,121 and 79-32,121b dependent amount
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-121b/block-1
              excerpt: "a personal exemption of $2,320 for each dependent"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '2320'}

  - name: ks_pit_2026_earned_income_credit_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: K.S.A. 79-32,205(a)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-205/block-1
              excerpt: "17% for tax year 2013, and all tax years thereafter"
    versions:
      - {effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '0.17'}

  - name: ks_pit_2026_standard_deduction
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,119(b)-(c), supported single and joint amounts
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-119/block-1
              excerpt: "Single individual filing status, $3,605; married filing status, $8,240"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-119/block-1
              excerpt: "Single individual and head of household filing status, $850; and married filing status, $700"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if ks_pit_2026_filing_status_joint:
            ks_pit_2026_joint_standard_deduction
            + ks_pit_2026_joint_additional_standard_deduction * ks_pit_2026_federal_additional_standard_deduction_count
          else:
            ks_pit_2026_single_standard_deduction
            + ks_pit_2026_single_additional_standard_deduction * ks_pit_2026_federal_additional_standard_deduction_count

  - name: ks_pit_2026_itemized_deduction
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,120(a)(5)-(b), current allowed components and reductions
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-120/block-1
              excerpt: "100% of charitable contributions"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-120/block-1
              excerpt: "total amount of deductions from federal adjusted gross income shall be reduced"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          max(
            0,
            ks_pit_2026_federal_charitable_contribution_deduction
            + ks_pit_2026_federal_medical_expense_deduction
            + ks_pit_2026_federal_qualified_residence_interest_deduction
            + ks_pit_2026_federal_real_personal_property_tax_deduction
            - ks_pit_2026_state_local_income_tax_in_itemized_deductions
            - ks_pit_2026_disallowed_depreciation_in_itemized_deductions
          )

  - name: ks_pit_2026_candidate_kansas_adjusted_gross_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,117 common additions and subtractions from federal AGI
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-117/block-1
              excerpt: "Interest income less any related expenses directly incurred in the purchase of state or political subdivision obligations"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-117/block-1
              excerpt: "Interest or dividend income on obligations or securities of any authority, commission or instrumentality of the United States"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-117/block-1
              excerpt: "amounts received as retirement benefits in whatever form which were earned for being employed by the federal government or for service in the armed forces"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          ks_pit_2026_federal_adjusted_gross_income
          + ks_pit_2026_other_state_local_bond_interest_excluded_from_federal_agi
          + ks_pit_2026_income_taxes_deducted_in_federal_agi
          - ks_pit_2026_us_obligation_interest_in_federal_agi
          - ks_pit_2026_income_tax_refunds_in_federal_agi
          - ks_pit_2026_federal_civil_service_or_military_retirement_in_federal_agi

  - name: ks_pit_2026_candidate_deduction
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Election between Kansas itemized and standard deduction
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-120/block-1
              excerpt: "may elect to deduct the Kansas itemized deduction in lieu of the Kansas standard deduction"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: "if ks_pit_2026_elects_kansas_itemized_deduction: ks_pit_2026_itemized_deduction else: ks_pit_2026_standard_deduction"

  - name: ks_pit_2026_candidate_personal_exemptions
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Intersection of K.S.A. 79-32,121(a)(1)-(3) and 79-32,121b(a)(1)-(3)
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-121/block-1
              excerpt: "married individuals filing a joint return, a personal exemption of $18,320"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-ks/statute/2026/79-32-121b/block-1
              excerpt: "a personal exemption of $2,320 for each dependent"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if ks_pit_2026_filing_status_joint:
            ks_pit_2026_joint_personal_exemption
            + ks_pit_2026_dependent_exemption * ks_pit_2026_federal_dependent_count
          else:
            ks_pit_2026_single_personal_exemption
            + ks_pit_2026_dependent_exemption * ks_pit_2026_federal_dependent_count

  - name: ks_pit_2026_candidate_taxable_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: K.S.A. 79-32,116
    metadata:
      private: true
      proof:
        atoms:
