  - {name: normally_resides_in_home, entity: Person, dtype: Boolean, period: Month}
  - {name: away_due_to_employment, entity: Person, dtype: Boolean, period: Month}
  - {name: same_economic_unit_and_common_energy_purchase_or_undesignated_energy_rent, entity: Person, dtype: Boolean, period: Month}
  - {name: college_student, entity: Person, dtype: Boolean, period: Month}
  - {name: lives_at_home_full_time, entity: Person, dtype: Boolean, period: Month}
  - {name: has_other_living_facilities, entity: Person, dtype: Boolean, period: Month}
  - {name: lives_in_dormitory, entity: Person, dtype: Boolean, period: Month}
  - {name: paid_live_in_attendant, entity: Person, dtype: Boolean, period: Month}
  - {name: provides_necessary_child_care_medical_or_housekeeper_services_due_to_age_or_illness, entity: Person, dtype: Boolean, period: Month}
  - {name: attendant_is_spouse_or_parent_of_dependent_child, entity: Person, dtype: Boolean, period: Month}
  - {name: receives_care_in_applicants_paid_attendant_home, entity: Person, dtype: Boolean, period: Month}
  - {name: is_paid_attendant_for_applicant_receiving_care, entity: Person, dtype: Boolean, period: Month}
  - {name: attendant_is_applicants_spouse, entity: Person, dtype: Boolean, period: Month}
  - {name: documented_commercial_room_and_board_separate_party, entity: Person, dtype: Boolean, period: Month}
  - {name: us_citizen, entity: Person, dtype: Boolean, period: Month}
  - {name: lawful_permanent_resident, entity: Person, dtype: Boolean, period: Month}
  - {name: refugee, entity: Person, dtype: Boolean, period: Month}
  - {name: asylee, entity: Person, dtype: Boolean, period: Month}
  - {name: paroled_into_us_for_at_least_one_year, entity: Person, dtype: Boolean, period: Month}
  - {name: deportation_withheld, entity: Person, dtype: Boolean, period: Month}
  - {name: granted_conditional_entry, entity: Person, dtype: Boolean, period: Month}
  - {name: qualifying_victim_or_survivor, entity: Person, dtype: Boolean, period: Month}
  - {name: temporary_alien_intending_to_retain_foreign_residence, entity: Person, dtype: Boolean, period: Month}
  - {name: monthly_income, entity: Person, dtype: Money, unit: USD, period: Month}
  - {name: is_or_turns_eighteen_in_application_month, entity: Person, dtype: Boolean, period: Month}
  - {name: age_at_auto_issuance, entity: Person, dtype: Integer, period: Month}
  - {name: receives_ssa_income, entity: Person, dtype: Boolean, period: Month}
  - {name: receives_ssi_income, entity: Person, dtype: Boolean, period: Month}
  - {name: receives_kpers_income, entity: Person, dtype: Boolean, period: Month}
  - {name: has_other_income_source, entity: Person, dtype: Boolean, period: Month}
  - {name: lives_in_kansas_county, entity: Household, dtype: Boolean, period: Year}
  - {name: applicant_legally_capable, entity: Household, dtype: Boolean, period: Year}
  - {name: guardian_or_conservator_applied, entity: Household, dtype: Boolean, period: Year}
  - {name: receives_kansas_tribal_liheap_this_benefit_year, entity: Household, dtype: Boolean, period: Year}
  - {name: regular_lieap_already_received_this_program_year, entity: Household, dtype: Boolean, period: Year}
  - {name: applicant_receives_food_assistance, entity: Household, dtype: Boolean, period: Month}
  - {name: applicant_receives_cash_assistance, entity: Household, dtype: Boolean, period: Month}
  - {name: applicant_receives_medical_assistance, entity: Household, dtype: Boolean, period: Month}
  - {name: congregate_living_without_direct_fuel_vendor_payment, entity: Household, dtype: Boolean, period: Month}
  - {name: residence_has_measured_metered_energy_usage_specific_to_residence, entity: Household, dtype: Boolean, period: Month}
  - {name: adult_member_named_on_commercial_primary_fuel_purchase, entity: Household, dtype: Boolean, period: Month}
  - {name: landlord_paid_for_primary_fuel_in_or_above_rent, entity: Household, dtype: Boolean, period: Month}
  - {name: lease_documents_fuel_included_in_rent, entity: Household, dtype: Boolean, period: Month}
  - {name: commercial_vendor_bills_landlords_account_for_household_fuel, entity: Household, dtype: Boolean, period: Month}
