  - {name: primary_applicant_deceased, entity: Household, dtype: Boolean, period: Year}
  - {name: primary_applicant_address_out_of_state, entity: Household, dtype: Boolean, period: Year}
  - {name: primary_applicant_moved_since_last_season, entity: Household, dtype: Boolean, period: Year}
  - {name: prior_consecutive_auto_issuance_years, entity: Household, dtype: Count, period: Year}
  - {name: benefit_was_auto_issued, entity: Household, dtype: Boolean, period: Year}
