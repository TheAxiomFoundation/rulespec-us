format: rulespec/v1
module:
  source_verification:
    corpus_citation_path: &citation us-ks/manual/dcf/keesm/2026-01-01/keesm13300
    source_sha256: d2302e92c7df547cb7c22e370b3091413224d2af937923e6bb48798fc71930d3
  proof_validation:
    required: true
  summary: |-
    “No person or household may receive a regular LIEAP benefit more than once in a program year.” Household membership, alienage, energy vulnerability, and auto-issuance are governed by KEESM 13310–13350. This edition does not supply an income limit or benefit calculation.
  interpretations:
    - id: qualified-alien-household-size
      status: open
      question: Do qualified aliens who are neither citizens nor lawful permanent residents count toward benefit household size?
      texts:
        - corpus_citation_path: *citation
          excerpt: 'Households must contain at least one member who is a U.S. Citizen or "qualified alien."'
        - corpus_citation_path: *citation
          excerpt: 'Household members who are not citizens or lawful permanent residents will not be considered in determining household size'
      reading: Only citizens and lawful permanent residents count toward benefit household size; the broader qualified-alien list governs the separate household alienage requirement.
      alternatives:
        - id: all-qualified-aliens-count
          reading: Every qualified alien counts toward benefit household size.
          effect: Refugees, asylees, and other listed qualified aliens who are not lawful permanent residents would increase the count.
      basis: The later sentence expressly names citizens and lawful permanent residents for household size.
      affects: [person_counts_toward_benefit_size, benefit_household_size]
    - id: minor-income-scope
      status: open
      question: Does the application-month age sentence exclude income of members under eighteen?
      texts:
        - corpus_citation_path: *citation
          excerpt: 'The income of all household members living together, is used to determine eligibility.'
        - corpus_citation_path: *citation
          excerpt: 'If a household member is or turns eighteen in the month of application, his/her income is countable.'
      reading: Income of all included household members is counted; the age sentence expressly confirms that a member who is or turns eighteen in the application month is included.
      alternatives:
        - id: exclude-younger-minors
          reading: Income of members who remain under eighteen throughout the application month is excluded.
          effect: Household countable income would be lower for those households.
      basis: The unqualified all-members sentence does not state an exclusion for younger minors.
      affects: [countable_household_income, member_income_countable]

