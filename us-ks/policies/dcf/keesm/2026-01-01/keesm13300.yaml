rules:
  - name: member_of_household
    kind: data_relation
    data_relation:
      predicate: member_of_household
      arity: 2
      arguments: [Person, Household]
    source: KEESM 13320

  - name: auto_issuance_minimum_age
    kind: parameter
    dtype: Integer
    source: KEESM 13350
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: *citation, excerpt: 'All household members are 62 or older.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: '62'

  - name: maximum_consecutive_auto_issuance_years
    kind: parameter
    dtype: Count
    source: KEESM 13350
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: *citation, excerpt: 'Auto issuance can be determined for three program years.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: '3'

  - name: attendant_excluded_from_membership
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13320, paid live-in attendants
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: exception, source: {corpus_citation_path: *citation, excerpt: 'Paid live-in attendants are not considered household members if they provide child care, medical services, or housekeeper services for the applicant, necessary due to age or illness'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          (paid_live_in_attendant
           and provides_necessary_child_care_medical_or_housekeeper_services_due_to_age_or_illness
           and not attendant_is_spouse_or_parent_of_dependent_child)
          or (is_paid_attendant_for_applicant_receiving_care
              and not attendant_is_applicants_spouse)

  - name: person_is_household_member
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13320, household definition and exceptions
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'The application shall include all persons that normally reside in the household.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          (normally_resides_in_home or away_due_to_employment)
          and same_economic_unit_and_common_energy_purchase_or_undesignated_energy_rent
          and (not college_student
               or (lives_at_home_full_time and not has_other_living_facilities))
          and not lives_in_dormitory
          and not attendant_excluded_from_membership
          and not receives_care_in_applicants_paid_attendant_home
          and not documented_commercial_room_and_board_separate_party

  - name: person_is_qualified_alien
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13330, qualified-alien categories
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: definition, source: {corpus_citation_path: *citation, excerpt: 'Qualified aliens include: legal permanent residents, refugees, asylees'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          (lawful_permanent_resident
           or refugee
           or asylee
           or paroled_into_us_for_at_least_one_year
           or deportation_withheld
           or granted_conditional_entry
           or qualifying_victim_or_survivor)
          and not temporary_alien_intending_to_retain_foreign_residence

  - name: person_counts_toward_benefit_size
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13330, household-size treatment
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'Household members who are not citizens or lawful permanent residents will not be considered in determining household size'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          person_is_household_member
          and (us_citizen or lawful_permanent_resident)

  - name: benefit_household_size
    kind: derived
    entity: Household
    dtype: Count
    period: Month
    source: KEESM 13320 and 13330
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'will not be considered in determining household size'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          count_where(member_of_household, person_counts_toward_benefit_size)

  - name: member_income_countable
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13320 and 13330
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'the income from such members will be counted in determining total household income'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          person_is_household_member

  - name: countable_household_income
    kind: derived
    entity: Household
    dtype: Money
    unit: USD
    period: Month
    source: KEESM 13320 and 13330
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'The income of all household members living together, is used to determine eligibility.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          sum_where(member_of_household, monthly_income, member_income_countable)

  - name: household_meets_alienage_requirement
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: KEESM 13330
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'Households must contain at least one member who is a U.S. Citizen or "qualified alien."'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          applicant_receives_food_assistance
          or applicant_receives_cash_assistance
          or applicant_receives_medical_assistance
          or count_where(member_of_household, person_is_qualified_alien) > 0
          or count_where(member_of_household, us_citizen) > 0

  - name: household_meets_general_requirements
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: KEESM 13310
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'Recipients must be living in a Kansas county and legally capable of acting on their own behalf.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          lives_in_kansas_county
          and (applicant_legally_capable or guardian_or_conservator_applied)
          and not receives_kansas_tribal_liheap_this_benefit_year
          and not regular_lieap_already_received_this_program_year

  - name: congregate_resident_ineligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: KEESM 13320
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'Individuals in congregate living situations who do not pay a fuel vendor directly for fuel are categorically ineligible'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          congregate_living_without_direct_fuel_vendor_payment

  - name: ordinary_heating_payment_method
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: KEESM 13340, three ordinary payment methods
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'Household pays a commercial fuel vendor for purchases billed to the landlord''s account.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          adult_member_named_on_commercial_primary_fuel_purchase
          or (landlord_paid_for_primary_fuel_in_or_above_rent
              and lease_documents_fuel_included_in_rent)
          or commercial_vendor_bills_landlords_account_for_household_fuel

  - name: deep_subsidy_heating_payment_method
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: KEESM 13340, deep-subsidy alternatives
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'Pays the landlord for the exact amount of a utility''s actual billing.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          pays_current_heating_cost_directly_to_utility
          or pays_landlord_billed_excess_utility_costs
          or pays_landlord_exact_actual_utility_bill

  - name: homeless_prior_debt_vulnerability
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: KEESM 13340, homeless households
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: exception, source: {corpus_citation_path: *citation, excerpt: 'Homeless households currently living in emergency shelters or comparable circumstance meet the vulnerability requirement if they owe a debt for heating costs incurred at a prior Kansas address.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          homeless_in_shelter_or_comparable_circumstance
          and owes_heating_debt_from_prior_kansas_address

  - name: household_energy_vulnerable
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: KEESM 13340
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'the household’s residence must have measurable (metered) energy usage specific to the residence'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          homeless_prior_debt_vulnerability
          or (residence_has_measured_metered_energy_usage_specific_to_residence
              and not household_cuts_own_wood
              and not subsidized_housing_with_heating_fuel_in_rent
              and not congregate_resident_ineligible
              and ((receives_deep_rental_subsidy
                    and deep_subsidy_heating_payment_method)
                   or ((not receives_deep_rental_subsidy
                        or receives_other_fha_limited_rental_assistance)
                       and ordinary_heating_payment_method)))

  - name: member_meets_auto_issuance_age
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13350
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'All household members are 62 or older.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          person_is_household_member
          and age_at_auto_issuance >= auto_issuance_minimum_age

  - name: member_has_permitted_auto_issuance_income
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13350
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'The only income for household members is SSA, SSI, or KPERS, and at least one person has income.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          person_is_household_member
          and (receives_ssa_income or receives_ssi_income or receives_kpers_income)
          and not has_other_income_source

  - name: member_has_disallowed_auto_issuance_income
    kind: derived
    entity: Person
    dtype: Judgment
    period: Month
    source: KEESM 13350
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'The only income for household members is SSA, SSI, or KPERS'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          person_is_household_member and has_other_income_source

  - name: household_meets_auto_issuance_member_tests
    kind: derived
    entity: Household
    dtype: Judgment
    period: Month
    source: KEESM 13350, age and income criteria
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'The only income for household members is SSA, SSI, or KPERS, and at least one person has income.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          count_where(member_of_household, person_is_household_member) > 0
          and count_where(member_of_household, member_meets_auto_issuance_age)
              == count_where(member_of_household, person_is_household_member)
          and count_where(member_of_household, member_has_permitted_auto_issuance_income) > 0
          and count_where(member_of_household, member_has_disallowed_auto_issuance_income) == 0

  - name: auto_issuance_available
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: KEESM 13350, auto-issuance criteria and three-year limit
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: *citation, excerpt: 'Auto issuance can be determined for three program years. After the third year, a household MUST apply in the next LIEAP season'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          household_meets_auto_issuance_member_tests
          and received_lieap_previous_season
          and not primary_applicant_deceased
          and not primary_applicant_address_out_of_state
          and not primary_applicant_moved_since_last_season
          and prior_consecutive_auto_issuance_years < maximum_consecutive_auto_issuance_years

  - name: application_required_after_auto_issuance_limit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: KEESM 13350
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'After the third year, a household MUST apply in the next LIEAP season'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          prior_consecutive_auto_issuance_years >= maximum_consecutive_auto_issuance_years

  - name: incorrect_auto_payment_must_be_cancelled_or_returned
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: KEESM 13350, correction of erroneous auto-issuance
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'If a household is auto-issued a benefit and it is later determined that the household was not eligible for auto-issuance, the payment must be canceled or returned to DCF.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          benefit_was_auto_issued and later_found_ineligible_for_auto_issuance

  - name: correction_may_proceed_without_new_application
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: KEESM 13350, erroneous auto-issuance correction
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'A new application is NOT required; however, the worker must gather current address, household composition, dwelling type, primary heating source in home, vendor name, and account number, and any income changes.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          benefit_was_auto_issued and later_found_ineligible_for_auto_issuance

  - name: current_information_must_be_gathered_after_incorrect_auto_issuance
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: KEESM 13350, erroneous auto-issuance correction
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: *citation, excerpt: 'the worker must gather current address, household composition, dwelling type, primary heating source in home, vendor name, and account number, and any income changes.'}}]}}
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          benefit_was_auto_issued and later_found_ineligible_for_auto_issuance
