format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
    source_sha256: fdbb48548804e2260dd933595d5f334506e259b43f719005687aa4dd6483b557
  summary: '13360 Income Eligibility - The combined gross income of all persons living
    at the residence address shall not exceed 150% of the federal poverty level.

    13361 Exempt Income - Only the following incomes are exempt in determining eligibility.

    13362 Income Guidelines - The gross income (before deductions) of all persons
    living at the residence address is considered in determining household income.'
