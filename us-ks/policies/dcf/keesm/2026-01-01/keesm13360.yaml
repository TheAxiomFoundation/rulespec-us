rules:
- name: payment_of_person
  kind: data_relation
  data_relation:
    predicate: payment_of_person
    arity: 2
    arguments:
    - Payment
    - Person
  source: KEESM 13360, income of persons living at the residence address
- name: member_of_household
  kind: data_relation
  data_relation:
    predicate: member_of_household
    arity: 2
    arguments:
    - Person
    - Household
  source: KEESM 13360 and 13362, persons living at the residence address
- name: poverty_percentage
  kind: parameter
  dtype: Rate
  source: KEESM 13360 and 13362
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: 150% of the federal poverty level
  versions:
  - effective_from: '2026-01-01'
    formula: "1.50"
- name: weekly_conversion_factor
  kind: parameter
  dtype: Decimal
  source: KEESM 13360
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: by 4.30 if paid weekly
  versions:
  - effective_from: '2026-01-01'
    formula: "4.30"
- name: biweekly_conversion_factor
  kind: parameter
  dtype: Decimal
  source: KEESM 13360
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: by 2.15 if paid every two weeks or bi-weekly
  versions:
  - effective_from: '2026-01-01'
    formula: "2.15"
- name: self_employment_expense_rate
  kind: parameter
  dtype: Rate
  source: KEESM 13360
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: gross receipts minus a 25% standard deduction
  versions:
  - effective_from: '2026-01-01'
    formula: "0.25"
- name: child_earned_income_age_limit
  kind: parameter
  dtype: Integer
  source: KEESM 13361, earned income of child household members
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: under age 18
  versions:
  - effective_from: '2026-01-01'
    formula: "18"
- name: training_income_age_limit
  kind: parameter
  dtype: Integer
  source: KEESM 13361, National Community Services Act and WIOA
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: persons age 19 or over
  versions:
  - effective_from: '2026-01-01'
    formula: "19"
- name: charity_quarter_exemption_limit
  kind: parameter
  dtype: Money
  unit: USD
  source: KEESM 13361, Charitable Donations
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: not to exceed $300 in any quarter
  versions:
  - effective_from: '2026-01-01'
    formula: "300"
- name: gift_month_exemption_limit
  kind: parameter
  dtype: Money
  unit: USD
  source: KEESM 13361, Gifts
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: not exceeding $50 per month
  versions:
  - effective_from: '2026-01-01'
    formula: "50"
- name: irregular_interest_quarter_limit
  kind: parameter
  dtype: Money
  unit: USD
  source: KEESM 13361, Interest and Dividends
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: less than $30 in a quarter
  versions:
  - effective_from: '2026-01-01'
    formula: "30"
- name: indian_trust_land_calendar_year_limit
  kind: parameter
  dtype: Money
  unit: USD
  source: KEESM 13361, Indian monies
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: Up to $2,000 per calendar year
  versions:
  - effective_from: '2026-01-01'
    formula: "2000"
- name: monthly_income_limit_table
  kind: parameter
  dtype: Money
  unit: USD
  period: Month
  indexed_by: household_member_count
  source: KEESM 13362, Income Guidelines table
  metadata:
    proof:
      atoms:
      - path: versions[0].values
        kind: parameter_table
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          table:
            header: Number in Household One Month Income at 150% of Poverty Level
            row_key: Number in Household
            column_key: One Month Income at 150% of Poverty Level
  versions:
  - effective_from: '2026-01-01'
    values:
      1: 1956
      2: 2644
      3: 3331
      4: 4019
      5: 4706
      6: 5394
      7: 6081
      8: 6769
- name: additional_person_income_limit
  kind: parameter
  dtype: Money
  unit: USD
  period: Month
  source: KEESM 13362, Income Guidelines
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: For each additional person $688
  versions:
  - effective_from: '2026-01-01'
    formula: "688"
- name: normalized_monthly_payment
  kind: derived
  entity: Payment
  dtype: Money
  unit: USD
  period: Month
  source: KEESM 13360, monthly, weekly, bi-weekly, intermittent and strike income
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: the striker's income is measured using the calendar month prior
            to the strike's onset
  versions:
  - effective_from: '2026-01-01'
    formula: 'if income_kind == "self_employment": self_employment_gross_receipts

      else: if recipient_on_strike and income_kind == "earnings": employment_income_in_month_before_strike

      else: if not income_intended_for_application_month: 0

      else: if pay_frequency == "weekly": expected_pay_period_amount * weekly_conversion_factor

      else: if pay_frequency == "biweekly": expected_pay_period_amount * biweekly_conversion_factor

      else: monthly_amount'
- name: self_employment_countable_payment
  kind: derived
  entity: Payment
  dtype: Money
  unit: USD
  period: Month
  source: KEESM 13360, self-employment income
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: gross receipts minus a 25% standard deduction for expenses
  versions:
  - effective_from: '2026-01-01'
    formula: "if income_kind == \"self_employment\":\n  max(0, self_employment_gross_receipts\
      \ - (if client_disputes_standard_deduction_and_requests_actual_costs: self_employment_actual_costs\
      \ else: self_employment_gross_receipts * self_employment_expense_rate))\nelse:\
      \ 0"
- name: categorical_exemption_group_one
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: KEESM 13361, enumerated exempt income
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: Only the following incomes are exempt in determining eligibility
  versions:
  - effective_from: '2026-01-01'
    formula: 'payment_type == "able_account_distribution"

      or payment_type == "agent_orange_settlement"

      or payment_type == "alaska_native_claim"

      or payment_type == "aleut_title_ii"

      or payment_type == "temporary_census_earnings"

      or payment_type == "child_care_subsidy"

      or payment_type == "spina_bifida_vietnam_veteran_child"

      or payment_type == "crime_victims_fund"

      or payment_type == "cryptocurrency"

      or payment_type == "earned_income_tax_credit_lump_sum"

      or payment_type == "family_subsidy"

      or payment_type == "filipino_veterans_equity_compensation"

      or payment_type == "foster_grandparent_program"

      or payment_type == "hpog"

      or payment_type == "holocaust_reparation"

      or payment_type == "independent_living_foster_care"

      or payment_type == "indian_claims_settlement"

      or payment_type == "jtpa_unearned_allowance"

      or payment_type == "loan"

      or payment_type == "older_americans_act_title_v"'
- name: categorical_exemption_group_two
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: KEESM 13361, enumerated exempt income
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: Only the following incomes are exempt in determining eligibility
  versions:
  - effective_from: '2026-01-01'
    formula: 'payment_type == "radiation_exposure_compensation"

      or payment_type == "refugee_match_grant"

      or payment_type == "refugee_reception_and_placement"

      or payment_type == "kansas_rehabilitation_services"

      or payment_type == "ricky_ray_hemophilia_relief"

      or payment_type == "ira_or_401k_savings_withdrawal"

      or payment_type == "score_or_ace"

      or payment_type == "senior_health_aide_or_companion"

      or payment_type == "shared_living_shelter_payment"

      or payment_type == "summer_ebt"

      or payment_type == "va_child_trust_unavailable_for_subsistence"

      or payment_type == "vista"

      or payment_type == "youth_service_corps"

      or payment_type == "gate_money"

      or payment_type == "diversion_payment_in_lieu_of_tanf"

      or payment_type == "relocation_assistance_navajo_hopi"

      or payment_type == "japanese_ancestry_reparation"

      or payment_type == "national_community_service_nontraining"

      or payment_type == "renal_dialysis_home_care_incentive"

      or payment_type == "federal_state_local_emergency_vendor_assistance"'
- name: conditional_exempt_payment
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: KEESM 13361, conditional exempt income
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: Foster care and Permanent Custodianship Subsidy payments are exempt
            if the child(ren) is not included in the household
  versions:
  - effective_from: '2026-01-01'
    formula: '(income_kind == "earnings" and recipient_age < child_earned_income_age_limit)

      or (payment_type == "combat_pay" and payment_is_additional_pay_for_combat_zone_deployment)

      or (payment_type == "foster_care_or_custodianship_subsidy" and not foster_child_included_in_household)

      or (payment_type == "educational_income" and payment_is_for_educational_grant_scholarship_or_loan
      and not payment_is_monthly_living_stipend_or_educational_benefit)

      or (payment_type == "housing_rental_assistance" and payment_is_federal_state_or_local_housing_rental_assistance)

      or (payment_type == "in_kind_assistance" and payment_is_in_kind_assistance)

      or (payment_type == "vendor_payment" and payment_is_direct_third_party_vendor_payment)

      or (payment_type == "vendor_payment" and payment_is_qualifying_temporary_housing_vendor_assistance)

      or (payment_type == "vendor_payment" and payment_is_migrant_vendor_assistance)

      or (payment_type == "reimbursement" and payment_is_for_identified_nonliving_expense_and_used_as_intended)

      or (payment_type == "repair_or_replacement_settlement" and repair_or_replacement_settlement_used_as_intended_within_six_months)

      or (payment_type == "repatriated_americans" and repatriation_repayment_agreement_signed)

      or (payment_type == "relocation_assistance" and relocation_payment_is_under_uniform_relocation_act)

      or (payment_type == "disaster_assistance" and payment_is_from_presidentially_declared_disaster_assistance)

      or (payment_type == "secretary_of_interior_tribal_funds" and payment_is_tribal_fund_verified_exempt)

      or (payment_type == "individual_development_account" and payment_is_deposited_into_or_withdrawn_for_intended_ida_purpose)

      or (payment_type == "pass_plan" and payment_is_qualified_pass_plan_disability_benefit_or_wage)

      or (payment_type == "work_employment_program" and payment_is_qualified_work_program_support_or_incentive)

      or (payment_type == "work_plan_allocation" and payment_is_approved_work_plan_allocation)

      or (payment_type == "tax_refund" and payment_is_tax_rebate_or_refund)

      or (payment_type == "interest_to_burial_fund" and payment_is_interest_credited_to_exempt_burial_fund)

      or (payment_type == "child_account_interest" and recipient_age < child_earned_income_age_limit
      and payment_is_interest_from_child_account)

      or (payment_type == "va_benefit" and payment_is_qualifying_va_ume_or_birth_defect_benefit)

      or (payment_type == "national_community_service" and not (payment_is_on_the_job_training_or_paid_work_experience
      and (recipient_age >= training_income_age_limit or not recipient_under_parental_control_of_household_member)))

      or (payment_type == "wioa" and not (payment_is_on_the_job_training_or_paid_work_experience
      and recipient_age >= training_income_age_limit))

      or (payment_type == "retroactive_ssi_installment" and payment_is_retroactive_ssi_installment)'
- name: capped_or_documented_exempt_amount
  kind: derived
  entity: Payment
  dtype: Money
  unit: USD
  period: Month
  source: KEESM 13361, capped gifts, donations, interest, Indian income and documented
    uses
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: Amounts in excess of $300 shall be considered as countable unearned
            income
  versions:
  - effective_from: '2026-01-01'
    formula: "if payment_type == \"charitable_donation\" and payment_is_based_on_need_from_nonprofit_charity:\n\
      \  min(normalized_monthly_payment, max(0, charity_quarter_exemption_limit -\
      \ charitable_donations_earlier_in_quarter))\nelse: if payment_type == \"irregular_gift\"\
      \ and payment_is_irregular and payment_is_unpredictable:\n  min(normalized_monthly_payment,\
      \ max(0, gift_month_exemption_limit - gift_amounts_earlier_in_month))\nelse:\
      \ if payment_type == \"interest_or_dividend\" and payment_is_irregular and payment_is_unpredictable\
      \ and normalized_monthly_payment + interest_and_dividends_earlier_in_quarter\
      \ < irregular_interest_quarter_limit:\n  normalized_monthly_payment\nelse: if\
      \ payment_type == \"indian_trust_land_income\" and payment_is_covered_indian_trust_land_income:\n\
      \  min(normalized_monthly_payment, max(0, indian_trust_land_calendar_year_limit\
      \ - indian_trust_land_income_earlier_in_calendar_year))\nelse: if payment_type\
      \ == \"death_benefit\" and payment_is_for_burial_or_last_illness_and_documented:\n\
      \  min(normalized_monthly_payment, payment_is_used_for_burial_or_last_illness)\n\
      else: if payment_type == \"mineral_rights_or_oil_royalty\" and payment_is_mineral_rights_or_oil_royalty:\n\
      \  min(normalized_monthly_payment, mandatory_severance_tax)\nelse: 0"
- name: lump_sum_exempt
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: KEESM 13361, Lump sums
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: us-ks/manual/dcf/keesm/2026-01-01/keesm13360
          excerpt: a nonrecurring one-time payment
  versions:
  - effective_from: '2026-01-01'
    formula: 'payment_is_nonrecurring

      and payment_is_unpredictable

      and (payment_type == "lump_sum" or payment_is_lump_sum_tax_refund_rebate_or_credit)'
- name: payment_exempt_amount
  kind: derived
  entity: Payment
  dtype: Money
  unit: USD
  period: Month
  source: KEESM 13361, Exempt Income
  metadata:
