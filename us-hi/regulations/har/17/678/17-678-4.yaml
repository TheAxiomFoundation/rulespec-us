format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-hi/regulation/har/17/678/17-678-4
  summary: |-
    "the monthly standard of need shall be one hundred per cent of the federal poverty level established by the federal government in 2006"; the Hawaii federal poverty level is divided by twelve and rounded down. For individuals in domiciliary care homes, the monthly standard of need is the dollar value of the level of care.
rules:
  - name: standard_of_need_federal_poverty_level_rate
    kind: parameter
    dtype: Rate
    source: HAR §17-678-4(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/678/17-678-4
              excerpt: "one hundred per cent of the federal poverty level"
    versions:
      - effective_from: '2008-01-17'
        formula: |-
          1
  - name: annual_to_monthly_divisor
    kind: parameter
    dtype: Count
    source: HAR §17-678-4(a)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/678/17-678-4
              excerpt: "shall be divided by twelve"
    versions:
      - effective_from: '2008-01-17'
        formula: |-
          12
  - name: monthly_standard_of_need
    kind: derived
    entity: Person
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-678-4(a)-(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/678/17-678-4
              excerpt: "rounded off to the next lower whole dollar"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-hi/regulation/har/17/678/17-678-4
              excerpt: "dollar value of the level of care"
    versions:
      - effective_from: '2008-01-17'
        formula: |-
          if individual_in_independent_living_arrangement_or_residential_treatment_facility: floor((federal_poverty_level_for_hawaii_established_by_federal_government_in_2006 * standard_of_need_federal_poverty_level_rate) / annual_to_monthly_divisor) else: if individual_in_domiciliary_care_home: domiciliary_care_home_level_of_care_dollar_value else: 0
