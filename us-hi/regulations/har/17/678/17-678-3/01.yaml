format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-hi/regulation/har/17/678/17-678-3.01
  summary: |-
    The monthly assistance allowance for TANF individuals shall be sixty-two per cent of the standard of need. After the first two full months of assistance, the allowance for work eligible households shall be reduced by twenty percent, except for a work eligible household in which each adult in the assistance unit is an independent minor parent and is a full-time student as defined in section 17-656.1-2.
  deferred_outputs:
    - output: us-hi:regulations/har/17/678/17-678-3/01#hi_tanf
      reason: The final monthly TANF allowance depends on the exception for a work eligible household in which each adult is an independent minor parent and a full-time student as defined in missing section 17-656.1-2.
      source_values:
        - us-hi:regulations/har/17/678/17-678-3/01#tanf_monthly_assistance_allowance_rate
        - us-hi:regulations/har/17/678/17-678-3/01#work_eligible_household_reduction_rate
rules:
  - name: tanf_monthly_assistance_allowance_rate
    kind: parameter
    dtype: Rate
    source: HAR §17-678-3.01(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/678/17-678-3.01
              excerpt: "sixty-two per cent of the standard of need"
    versions:
      - effective_from: '2009-08-07'
        formula: |-
          0.62
  - name: work_eligible_household_reduction_rate
    kind: parameter
    dtype: Rate
    source: HAR §17-678-3.01(b)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/678/17-678-3.01
              excerpt: "shall be reduced by twenty percent"
    versions:
      - effective_from: '2009-08-07'
        formula: |-
          0.20
  - name: tanf_base_monthly_assistance_allowance
    kind: derived
    entity: TanfUnit
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-678-3.01(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/678/17-678-3.01
              excerpt: "sixty-two per cent of the standard of need"
    versions:
      - effective_from: '2009-08-07'
        formula: |-
          max(0, standard_of_need * tanf_monthly_assistance_allowance_rate)
