format: rulespec/v1
imports:
  - us-hi:regulations/har/17/678/17-678-3/01#tanf_base_monthly_assistance_allowance
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-hi/regulation/har/17/678/17-678-5
  summary: |-
    For individuals in independent living arrangements, the standard of assistance is the total dollar value of the monthly assistance allowance and special circumstance allowance. For individuals in residential treatment facilities, it is the monthly assistance allowance. For individuals in domiciliary care homes, it is the dollar value authorized by the legislature. Amounts used are not rounded, and the total standard of assistance is rounded down to the next lower whole dollar.
