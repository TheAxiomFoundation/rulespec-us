format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-hi/regulation/har/17/680/page-11
  summary: |-
    "The monthly financial assistance payment for individuals, who are prospectively determined eligible, shall be determined by subtracting the monthly net income from the monthly standard of assistance"; recipients and first-day applicants receive the full monthly payment; applicants from the second through the end of the month receive a prorated initial payment using a standard thirty-day month, with thirty-first-day applications treated as thirtieth-day applications.
rules:
  - name: full_payment_application_day
    kind: parameter
    dtype: Count
    source: HAR §17-680-12(b)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: first of the month
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          1
  - name: prorated_application_start_day
    kind: parameter
    dtype: Count
    source: HAR §17-680-12(b)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: between the second to the end of the month
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          2
  - name: standard_proration_month_days
    kind: parameter
    dtype: Count
    source: HAR §17-680-12(b)(3)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: standard thirty-day month
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          30
  - name: proration_numerator_base_day
    kind: parameter
    dtype: Count
    source: HAR §17-680-12(b)(3)(C)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: thirty-one minus the calendar day
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          31
  - name: application_day_treated_for_thirty_first
    kind: parameter
    dtype: Count
    source: HAR §17-680-12(b)(3)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: thirty-first of a month shall be treated as though it applied on the thirtieth
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          30
  - name: hi_tanf
    kind: derived
    entity: TanfUnit
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-680-12(a)-(b)(3)(C)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: subtracting the monthly net income from the monthly standard of assistance
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: Recipients shall be provided the full monthly financial assistance payment
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: Applicants shall be provided the full monthly financial assistance payment when they apply on the first
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/680/page-11
              excerpt: multiply the amount of the monthly financial assistance by the ratio of thirty-one minus the calendar day
          - path: versions[0].formula
            kind: import
            import:
              target: us-hi:regulations/har/17/680/17-680-12#full_payment_application_day
              output: full_payment_application_day
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us-hi:regulations/har/17/680/17-680-12#prorated_application_start_day
              output: prorated_application_start_day
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us-hi:regulations/har/17/680/17-680-12#standard_proration_month_days
              output: standard_proration_month_days
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us-hi:regulations/har/17/680/17-680-12#proration_numerator_base_day
              output: proration_numerator_base_day
              hash: sha256:local
          - path: versions[0].formula
            kind: import
            import:
              target: us-hi:regulations/har/17/680/17-680-12#application_day_treated_for_thirty_first
              output: application_day_treated_for_thirty_first
              hash: sha256:local
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          if prospectively_determined_eligible and recipient:
            max(0, monthly_standard_of_assistance - monthly_net_income)
          else:
            if prospectively_determined_eligible and applicant and application_calendar_day == full_payment_application_day:
              max(0, monthly_standard_of_assistance - monthly_net_income)
            else:
              if prospectively_determined_eligible and applicant and application_calendar_day >= prorated_application_start_day and application_calendar_day <= proration_numerator_base_day and family_meets_all_conditions_of_eligibility:
                max(0, monthly_standard_of_assistance - monthly_net_income) * ((proration_numerator_base_day - (if application_calendar_day == proration_numerator_base_day: application_day_treated_for_thirty_first else: application_calendar_day)) / standard_proration_month_days)
              else:
                0
