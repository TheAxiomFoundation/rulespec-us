format: rulespec/v1
imports:
  - us-hi:regulations/har/17/678/17-678-3/01#tanf_base_monthly_assistance_allowance
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
  summary: |-
    "A household is eligible for benefits if" total monthly gross income does not exceed "one hundred eighty-five percent of the household's standard of need" and monthly net income does not exceed the standard of assistance. Monthly net income is monthly net earned income plus monthly unearned income. Net earned income deducts twenty percent, then $200, then an earned income disregard, and capped incapacitated-adult care costs.
rules:
  - name: tanf_gross_income_limit_rate
    kind: parameter
    dtype: Rate
    source: HAR §17-676-54.1(a)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "one hundred eighty-five percent"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          1.85
  - name: tanf_earned_income_standard_deduction_rate
    kind: parameter
    dtype: Rate
    source: HAR §17-676-54.1(c)(1), (d)(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "twenty percent"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          0.20
  - name: tanf_earned_income_flat_deduction
    kind: parameter
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-676-54.1(c)(2), (d)(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "two hundred dollars"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          200
  - name: tanf_applicant_earned_income_disregard_rate
    kind: parameter
    dtype: Rate
    source: HAR §17-676-54.1(c)(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "thirty-six percent earned income disregard"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          0.36
  - name: tanf_adult_recipient_earned_income_disregard_rate_first_twenty_four_months
    kind: parameter
    dtype: Rate
    source: HAR §17-676-54.1(d)(3)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "A fifty-five percent earned income disregard for an adult recipient"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          0.55
  - name: tanf_dependent_child_earned_income_disregard_rate
    kind: parameter
    dtype: Rate
    source: HAR §17-676-54.1(d)(3)(A)-(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "thirty-six percent earned income disregard for a dependent child"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          0.36
  - name: tanf_adult_recipient_earned_income_disregard_rate_month_twenty_five_through_sixty
    kind: parameter
    dtype: Rate
    source: HAR §17-676-54.1(d)(3)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "A thirty-six percent earned income disregard for an adult recipient"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          0.36
  - name: tanf_first_disregard_schedule_month_limit
    kind: parameter
    dtype: Count
    source: HAR §17-676-54.1(d)(3)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "month one to month twenty-four"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          24
  - name: tanf_second_disregard_schedule_start_month
    kind: parameter
    dtype: Count
    source: HAR §17-676-54.1(d)(3)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "month twenty-five"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          25
  - name: tanf_second_disregard_schedule_end_month
    kind: parameter
    dtype: Count
    source: HAR §17-676-54.1(d)(3)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "through month sixty"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          60
  - name: tanf_incapacitated_adult_care_full_time_cap
    kind: parameter
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-676-54.1(c)(4)(A), (d)(4)(A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "$175 a month"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          175
  - name: tanf_incapacitated_adult_care_less_than_full_time_cap
    kind: parameter
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-676-54.1(c)(4)(B), (d)(4)(B)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "$165 a month"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          165
  - name: applicant_monthly_net_earned_income_for_eligibility
    kind: derived
    entity: TanfUnit
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-676-54.1(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "not to exceed: (A) $175 a month ... (B) $165 a month"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          max(0, (max(0, max(0, applicant_monthly_gross_earned_income - (applicant_monthly_gross_earned_income * tanf_earned_income_standard_deduction_rate)) - (tanf_earned_income_flat_deduction * applicant_earner_count)) * (1 - tanf_applicant_earned_income_disregard_rate)) - min(actual_incapacitated_adult_care_cost, (if applicant_employed_full_time: tanf_incapacitated_adult_care_full_time_cap else: tanf_incapacitated_adult_care_less_than_full_time_cap) * incapacitated_adults_receiving_financial_assistance_count))
  - name: monthly_net_income_for_eligibility
    kind: derived
    entity: TanfUnit
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-676-54.1(b)-(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "adding the household's monthly net earned income and monthly unearned income"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          max(0, applicant_monthly_net_earned_income_for_eligibility + monthly_unearned_income)
  - name: monthly_net_earned_income_for_assistance_or_continued_eligibility
    kind: derived
    entity: TanfUnit
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-676-54.1(d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "month one to month twenty-four ... month twenty-five through month sixty"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          max(0, (max(0, max(0, adult_recipient_monthly_gross_earned_income - (adult_recipient_monthly_gross_earned_income * tanf_earned_income_standard_deduction_rate)) - (tanf_earned_income_flat_deduction * adult_recipient_earner_count)) * (1 - (if employed_adult_tanf_benefit_month_count_for_disregard_schedule <= tanf_first_disregard_schedule_month_limit: tanf_adult_recipient_earned_income_disregard_rate_first_twenty_four_months else: if employed_adult_tanf_benefit_month_count_for_disregard_schedule >= tanf_second_disregard_schedule_start_month and employed_adult_tanf_benefit_month_count_for_disregard_schedule <= tanf_second_disregard_schedule_end_month: tanf_adult_recipient_earned_income_disregard_rate_month_twenty_five_through_sixty else: tanf_adult_recipient_earned_income_disregard_rate_month_twenty_five_through_sixty))) + (max(0, max(0, dependent_child_monthly_gross_earned_income - (dependent_child_monthly_gross_earned_income * tanf_earned_income_standard_deduction_rate)) - (tanf_earned_income_flat_deduction * dependent_child_earner_count)) * (1 - tanf_dependent_child_earned_income_disregard_rate)) - min(actual_incapacitated_adult_care_cost, (if applicant_or_recipient_employed_full_time: tanf_incapacitated_adult_care_full_time_cap else: tanf_incapacitated_adult_care_less_than_full_time_cap) * incapacitated_adults_receiving_financial_assistance_count))
  - name: monthly_net_income_for_assistance_or_continued_eligibility
    kind: derived
    entity: TanfUnit
    dtype: Money
    period: Month
    unit: USD
    source: HAR §17-676-54.1(b), (d)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "adding the household's monthly net earned income and monthly unearned income"
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          max(0, monthly_net_earned_income_for_assistance_or_continued_eligibility + monthly_unearned_income)
  - name: hi_tanf
    kind: derived
    entity: TanfUnit
    dtype: Judgment
    period: Month
    source: HAR §17-676-54.1(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: predicate
            source:
              corpus_citation_path: us-hi/regulation/har/17/676/17-676-54.1
              excerpt: "A household is eligible for benefits if"
          - path: versions[0].formula
            kind: import
            import:
              target: us-hi:regulations/har/17/678/17-678-3/01#tanf_base_monthly_assistance_allowance
              output: tanf_base_monthly_assistance_allowance
              hash: sha256:921aeb500a82fdb9ac9308e9a14fc5e26fe7a8036fb3d39b36092d9a542c04c6
    versions:
      - effective_from: '2010-01-13'
        formula: |-
          total_monthly_gross_income <= standard_of_need * tanf_gross_income_limit_rate
          and monthly_net_income_for_eligibility <= tanf_base_monthly_assistance_allowance
