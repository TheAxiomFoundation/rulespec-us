# Nevada Constitution article 10, section 1(9) prohibits a personal income tax
# on natural persons. These input-free cases are named for materially different
# full-year-resident profiles to make explicit that income, filing status,
# deductions, exemptions, and surtaxes cannot change the legal pre-credit zero.
# Credit and net-liability amounts below are fail-closed sentinels guarded by
# explicit typed source holds, not substantive zero-liability assertions.
