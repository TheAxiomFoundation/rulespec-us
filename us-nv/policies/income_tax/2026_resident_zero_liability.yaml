format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-nv/statute/constitution/article-10/section-1/subsection-9/block-1
      - us-nv/statute/constitution/article-10/section-1/source-note/block-1
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us-nv/statute/constitution/article-10/section-1/subsection-9
        - us-nv/statute/constitution/article-10/section-1/source-note
      rationale: |-
        The Nevada Legislature's official Constitution, captured as of
        2026-07-24, prohibits an income tax on the wages or personal income of
        natural persons. Its official amendment history records ratification
        of the operative 1989 amendment, the later 2002 amendment, and
        rejection of the proposed 2014 amendment. Together the current text
        and amendment history ground application to tax year 2026.

        The same subsection expressly preserves the State's authority to tax
        the income or revenue of a business, so this module does not treat a
        natural person's business or entity tax as personal income tax.

        This authority proves zero natural-person personal income tax before
        credits. It does not prove that Nevada has no independently refundable
        credit or otherwise establish a complete signed net-liability surface.
        The downstream credit and net-liability outputs therefore remain
        explicitly deferred behind typed source holds.
  summary: |-
    Nevada tax-year-2026 full-year-resident natural-person personal-income-tax
    surface. Article 10, section 1, subsection 9 prohibits an income tax on a
    natural person's wages or personal income, so the source-backed
    personal-income-tax amount before credits is zero. This is the legal
    absence of a personal income tax, not a fictional zero-percent bracket or
    zero-income assumption.

    The pinned constitutional authority does not establish the absence of
    independently refundable credits or a complete signed net-liability
    surface. The after-nonrefundable-credit, refundable-credit, and net
    liability outputs therefore return fail-closed zero sentinels while typed
    source holds remain active. Those sentinels are not substantive claims
    that the corresponding stages equal zero.

    Taxes on a business or entity, including taxes measured by business income
    or revenue, are expressly outside this module. Payments, filing
    administration, local taxes, and nonresident allocation are also outside
    scope.
  deferred_outputs:
    - output: us-nv:policies/income_tax/2026_resident_zero_liability#nv_pit_2026_resident_personal_income_tax_after_nonrefundable_credits
      reason: |-
        The pinned constitutional prohibition establishes the pre-credit tax
        amount but does not provide a complete nonrefundable-credit surface.
      source_values:
        - us-nv:policies/income_tax/2026_resident_zero_liability#nv_pit_2026_nonrefundable_credit_source_hold_applies
    - output: us-nv:policies/income_tax/2026_resident_zero_liability#nv_pit_2026_resident_refundable_personal_income_tax_credits
      reason: |-
        The pinned constitutional prohibition does not prove the absence of
        independently refundable natural-person credits.
      source_values:
        - us-nv:policies/income_tax/2026_resident_zero_liability#nv_pit_2026_refundable_credit_source_hold_applies
    - output: us-nv:policies/income_tax/2026_resident_zero_liability#nv_pit_2026_resident_net_personal_income_tax_liability_before_payments
      reason: |-
        Signed net liability cannot be completed until the nonrefundable and
        refundable credit holds are cleared and their ordering is pinned.
      source_values:
        - us-nv:policies/income_tax/2026_resident_zero_liability#nv_pit_2026_net_liability_source_hold_applies
rules:
  - name: nv_pit_2026_natural_person_income_tax_prohibition_applies
    kind: derived
    dtype: Boolean
    period: Year
    source: Nev. Const. art. 10, § 1(9)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-nv/statute/constitution/article-10/section-1/subsection-9/block-1
              excerpt: "No income tax shall be levied upon the wages or personal income of natural persons."
    versions:
      - effective_from: '2026-01-01'
        formula: true

  - name: nv_pit_2026_constitutional_prohibition_current_for_tax_year
    kind: derived
    dtype: Boolean
    period: Year
    source: Nev. Const. art. 10, § 1 official amendment history, current as of 2026-07-24
    metadata:
      proof:
