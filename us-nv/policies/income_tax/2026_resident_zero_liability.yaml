            kind: formula
            source:
              corpus_citation_path: us-nv/statute/constitution/article-10/section-1/source-note/block-1
              excerpt: "approved and ratified by the people at a special election held on May 2, 1989"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-nv/statute/constitution/article-10/section-1/source-note/block-1
              excerpt: "approved and ratified by the people at the 2002 General Election"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-nv/statute/constitution/article-10/section-1/source-note/block-1
              excerpt: "not approved and ratified by the people at the 2014 General Election"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: true

