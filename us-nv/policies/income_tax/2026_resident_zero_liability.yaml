format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: us-nv/statute/constitution/article-10/section-1/subsection-9/block-1
    upstream_source_check:
      status: complete_current_authority
      checked_paths:
        - us-nv/statute/constitution/article-10/section-1/subsection-9
      rationale: |-
        The current official Nevada Constitution prohibits an income tax on
        the wages or personal income of natural persons. The same subsection
        expressly preserves the State's authority to tax the income or revenue
        of a business, so this module does not treat a natural person's
        business or entity tax as personal income tax.
  summary: |-
    Complete Nevada full-year-resident natural-person personal-income-tax
    pipeline for tax year 2026. Article 10, section 1, subsection 9 prohibits
    an income tax on a natural person's wages or personal income. Accordingly
    no resident personal-income-tax deduction, exemption, surtax, or credit
    stage applies, and personal-income-tax liability is zero before credits,
    after nonrefundable credits, after refundable credits, and before
    payments. This is the legal absence of a personal income tax, not a
    fictional zero-percent bracket or zero-income assumption.
    Taxes on a business or entity, including taxes measured by business income
    or revenue, are expressly outside this module. Payments, filing
    administration, local taxes, and nonresident allocation are also outside
    scope.
rules:
  - name: nv_pit_2026_natural_person_income_tax_prohibition_applies
    kind: derived
    dtype: Boolean
    period: Year
    source: Nev. Const. art. 10, § 1(9)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-nv/statute/constitution/article-10/section-1/subsection-9/block-1
              excerpt: "No income tax shall be levied upon the wages or personal income of natural persons."
    versions:
      - effective_from: '2026-01-01'
        formula: true

  - name: nv_pit_2026_business_income_or_revenue_tax_carveout_preserved
    kind: derived
    dtype: Boolean
    period: Year
    source: Nev. Const. art. 10, § 1(9)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-nv/statute/constitution/article-10/section-1/subsection-9/block-1
              excerpt: "taxes may be levied upon the income or revenue of any business in whatever form it may be conducted for profit in the State."
    versions:
      - effective_from: '2026-01-01'
        formula: true

