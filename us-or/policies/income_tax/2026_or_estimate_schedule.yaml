format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-or/statute/316.037
      - us-or/form/individual-income-tax/2026/or-estimate/document-1
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us-or/statute/316.037
        - us-or/form/individual-income-tax/2026/or-estimate/document-1
      rationale: |-
        ORS 316.037(1)(a) imposes tax on resident taxable income and subsection
        (1)(b) directs the Department of Revenue to publish an annually indexed
        replacement table while retaining the statutory rates. The official
        tax-year-2026 Publication OR-ESTIMATE supplies that replacement schedule
        on page 3. Chart S applies to single and married-separate returns; Chart J
        applies to joint returns, heads of household, and qualifying surviving
        spouses. Each row expressly supplies its upper bound, base amount, rate,
        and excess-income floor.

        Publication OR-ESTIMATE is an estimated-tax source. It does not establish
        the complete tax-year-2026 annual Oregon taxable-income construction,
        specialty-rate branches, credits, final-return ordering, or net
        liability. This module therefore owns only the estimated ordinary
        schedule amount for caller-supplied completed worksheet taxable income.
        It validates the five filing-status flags strictly, fails closed for an
        invalid status or negative input, and makes no final-return or
        PolicyEngine-parity claim.
  summary: |-
    Canonical tax-year-2026 Publication OR-ESTIMATE Chart S/J calculation.
    The caller supplies completed Oregon taxable income for the estimate
    worksheet and exactly one filing status. The module applies every printed
    base-plus-excess row without rounding and exposes only an explicitly
    estimated ordinary schedule tax amount.
  deferred_outputs:
    - output: us-or:policies/income_tax/2026_or_estimate_schedule#complete_annual_oregon_taxable_income
      reason: |-
        Publication OR-ESTIMATE does not contain all operative annual
        federal-to-Oregon additions, subtractions, modifications, deductions,
        or final Form OR-40 instructions. Completed estimate-workbook taxable
        income remains an input boundary.
    - output: us-or:policies/income_tax/2026_or_estimate_schedule#complete_annual_tax_before_credits
      reason: |-
        Qualified-business rates, farm-gain rates, farm-income averaging,
        separate taxes, recaptures, and final-return rounding require annual or
        specialty sources not supplied by Publication OR-ESTIMATE.
      source_values:
        - us-or:policies/income_tax/2026_or_estimate_schedule#or_pit_2026_or_estimate_schedule_tax_amount
    - output: us-or:policies/income_tax/2026_or_estimate_schedule#complete_annual_tax_after_credits
      reason: |-
        The estimated-tax publication does not establish the complete annual
        credit inventory or final-return credit ordering.
    - output: us-or:policies/income_tax/2026_or_estimate_schedule#complete_annual_net_income_tax_liability
      reason: |-
        Refundable credits, the surplus kicker, payments, recaptures, and
        annual-return ordering are outside this estimated-only source.
rules:
  - name: or_pit_2026_or_estimate_taxable_income
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: Publication OR-ESTIMATE worksheet line 13, supplied completed Oregon taxable income
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "Oregon taxable income. Line 7 minus line 12."
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "2026 Publication OR-ESTIMATE"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: max(0, or_pit_2026_or_estimate_oregon_taxable_income)

  - name: or_pit_2026_or_estimate_filing_status_count
    kind: derived
    entity: TaxUnit
    dtype: Count
    period: Year
    source: Publication OR-ESTIMATE Chart S and Chart J filing-status categories
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "Chart S: Single or Married filing separately"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "Chart J: Married filing jointly, Head of household, or Qualifying surviving spouse"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          (if or_pit_2026_or_estimate_is_single: 1 else: 0)
          + (if or_pit_2026_or_estimate_is_married_filing_separately: 1 else: 0)
          + (if or_pit_2026_or_estimate_is_married_filing_jointly: 1 else: 0)
          + (if or_pit_2026_or_estimate_is_head_of_household: 1 else: 0)
          + (if or_pit_2026_or_estimate_is_qualifying_surviving_spouse: 1 else: 0)

  - name: or_pit_2026_or_estimate_input_domain_is_valid
    kind: derived
    entity: TaxUnit
    dtype: Judgment
    period: Year
    source: Publication OR-ESTIMATE requires one Chart S/J status and nonnegative worksheet taxable income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "Use the tax rate chart for your filing status on page 3 to figure the tax on the amount on line 13."
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          or_pit_2026_or_estimate_filing_status_count == 1
          and or_pit_2026_or_estimate_oregon_taxable_income >= 0

  - name: or_pit_2026_or_estimate_row_index_two
    kind: parameter
    dtype: Count
    source: Internal third-row index for the source-backed Chart S table
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: definition, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $11,400 but not over $125,000"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '2'}]

  - name: or_pit_2026_or_estimate_row_index_three
    kind: parameter
    dtype: Count
    source: Internal fourth-row index for the source-backed Chart S table
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: definition, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $125,000"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '3'}]

  - name: or_pit_2026_or_estimate_row_index_four
    kind: parameter
    dtype: Count
    source: Internal first Chart J row index in the combined source-backed table
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: definition, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Chart J ... Not over $9,100"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '4'}]

  - name: or_pit_2026_or_estimate_row_index_five
    kind: parameter
    dtype: Count
    source: Internal second Chart J row index in the combined source-backed table
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: definition, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $9,100 but not over $22,800"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '5'}]

  - name: or_pit_2026_or_estimate_row_index_six
    kind: parameter
    dtype: Count
    source: Internal third Chart J row index in the combined source-backed table
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: definition, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $22,800 but not over $250,000"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '6'}]

  - name: or_pit_2026_or_estimate_row_index_seven
    kind: parameter
    dtype: Count
    source: Internal fourth Chart J row index in the combined source-backed table
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: definition, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $250,000"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '7'}]

  - name: or_pit_2026_or_estimate_chart_s_first_upper_bound
    kind: parameter
    dtype: Money
    unit: USD
    source: 2026 Publication OR-ESTIMATE Chart S first upper bound
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Not over $4,550"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '4550'}]

  - name: or_pit_2026_or_estimate_chart_s_second_upper_bound
    kind: parameter
    dtype: Money
    unit: USD
    source: 2026 Publication OR-ESTIMATE Chart S second upper bound
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $4,550 but not over $11,400"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '11400'}]

  - name: or_pit_2026_or_estimate_chart_s_third_upper_bound
    kind: parameter
    dtype: Money
    unit: USD
    source: 2026 Publication OR-ESTIMATE Chart S third upper bound
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $11,400 but not over $125,000"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '125000'}]

  - name: or_pit_2026_or_estimate_chart_j_first_upper_bound
    kind: parameter
    dtype: Money
    unit: USD
    source: 2026 Publication OR-ESTIMATE Chart J first upper bound
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Not over $9,100"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '9100'}]

  - name: or_pit_2026_or_estimate_chart_j_second_upper_bound
    kind: parameter
    dtype: Money
    unit: USD
    source: 2026 Publication OR-ESTIMATE Chart J second upper bound
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $9,100 but not over $22,800"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '22800'}]

  - name: or_pit_2026_or_estimate_chart_j_third_upper_bound
    kind: parameter
    dtype: Money
    unit: USD
    source: 2026 Publication OR-ESTIMATE Chart J third upper bound
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, excerpt: "Over $22,800 but not over $250,000"}}]}}
    versions: [{effective_from: '2026-01-01', effective_to: '2026-12-31', formula: '250000'}]

  - name: or_pit_2026_or_estimate_bracket_selector
    kind: derived
    entity: TaxUnit
    dtype: Count
    period: Year
    source: 2026 Publication OR-ESTIMATE Chart S and Chart J row selection
    metadata:
      private: true
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "Rate charts for estimating 2026 Oregon tax"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if not or_pit_2026_or_estimate_input_domain_is_valid:
            0
          else: if (
            or_pit_2026_or_estimate_is_married_filing_jointly
            or or_pit_2026_or_estimate_is_head_of_household
            or or_pit_2026_or_estimate_is_qualifying_surviving_spouse
          ):
            if or_pit_2026_or_estimate_taxable_income <= or_pit_2026_or_estimate_chart_j_first_upper_bound: or_pit_2026_or_estimate_row_index_four
            else: if or_pit_2026_or_estimate_taxable_income <= or_pit_2026_or_estimate_chart_j_second_upper_bound: or_pit_2026_or_estimate_row_index_five
            else: if or_pit_2026_or_estimate_taxable_income <= or_pit_2026_or_estimate_chart_j_third_upper_bound: or_pit_2026_or_estimate_row_index_six
            else: or_pit_2026_or_estimate_row_index_seven
          else:
            if or_pit_2026_or_estimate_taxable_income <= or_pit_2026_or_estimate_chart_s_first_upper_bound: 0
            else: if or_pit_2026_or_estimate_taxable_income <= or_pit_2026_or_estimate_chart_s_second_upper_bound: 1
            else: if or_pit_2026_or_estimate_taxable_income <= or_pit_2026_or_estimate_chart_s_third_upper_bound: or_pit_2026_or_estimate_row_index_two
            else: or_pit_2026_or_estimate_row_index_three

  - name: or_pit_2026_or_estimate_bracket_floor
    kind: parameter
    dtype: Money
    unit: USD
    indexed_by: or_pit_2026_or_estimate_bracket_selector
    source: 2026 Publication OR-ESTIMATE Chart S and Chart J excess-income floors
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, table: {header: "2026 Chart S and Chart J", row_key: bracket, column_key: excess_floor}}}]}}
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        values: {0: 0, 1: 4550, 2: 11400, 3: 125000, 4: 0, 5: 9100, 6: 22800, 7: 250000}

  - name: or_pit_2026_or_estimate_bracket_base
    kind: parameter
    dtype: Money
    unit: USD
    indexed_by: or_pit_2026_or_estimate_bracket_selector
    source: 2026 Publication OR-ESTIMATE Chart S and Chart J printed base amounts
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, table: {header: "2026 Chart S and Chart J", row_key: bracket, column_key: base_tax}}}]}}
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        values: {0: 0, 1: 216, 2: 678, 3: 10618, 4: 0, 5: 432, 6: 1357, 7: 21237}

  - name: or_pit_2026_or_estimate_bracket_rate
    kind: parameter
    dtype: Rate
    indexed_by: or_pit_2026_or_estimate_bracket_selector
    source: 2026 Publication OR-ESTIMATE Chart S and Chart J marginal rates
    metadata: {private: true, proof: {atoms: [{path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1, table: {header: "2026 Chart S and Chart J", row_key: bracket, column_key: marginal_rate}}}]}}
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        values: {0: 0.0475, 1: 0.0675, 2: 0.0875, 3: 0.099, 4: 0.0475, 5: 0.0675, 6: 0.0875, 7: 0.099}

  - name: or_pit_2026_or_estimate_schedule_tax_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    source: 2026 Publication OR-ESTIMATE page 3 ordinary estimated-tax rate charts
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-or/statute/316.037
              excerpt: "The amount of the tax shall be determined in accordance with the following table"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "Use the tax rate chart for your filing status on page 3 to figure the tax on the amount on line 13."
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: us-or/form/individual-income-tax/2026/or-estimate/document-1
              excerpt: "Rate charts for estimating 2026 Oregon tax"
    versions:
      - effective_from: '2026-01-01'
        effective_to: '2026-12-31'
        formula: |-
          if or_pit_2026_or_estimate_input_domain_is_valid:
            or_pit_2026_or_estimate_bracket_base[or_pit_2026_or_estimate_bracket_selector]
            + or_pit_2026_or_estimate_bracket_rate[or_pit_2026_or_estimate_bracket_selector]
            * max(
              0,
              or_pit_2026_or_estimate_taxable_income
              - or_pit_2026_or_estimate_bracket_floor[or_pit_2026_or_estimate_bracket_selector]
            )
          else:
            0
inputs:
  - name: or_pit_2026_or_estimate_oregon_taxable_income
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: USD
    description: Completed Oregon taxable income from Publication OR-ESTIMATE worksheet line 13.
  - {name: or_pit_2026_or_estimate_is_single, entity: TaxUnit, dtype: Judgment, period: Year, description: Single filing status for Chart S.}
  - {name: or_pit_2026_or_estimate_is_married_filing_separately, entity: TaxUnit, dtype: Judgment, period: Year, description: Married filing separately status for Chart S.}
  - {name: or_pit_2026_or_estimate_is_married_filing_jointly, entity: TaxUnit, dtype: Judgment, period: Year, description: Married filing jointly status for Chart J.}
  - {name: or_pit_2026_or_estimate_is_head_of_household, entity: TaxUnit, dtype: Judgment, period: Year, description: Head-of-household status for Chart J.}
  - {name: or_pit_2026_or_estimate_is_qualifying_surviving_spouse, entity: TaxUnit, dtype: Judgment, period: Year, description: Qualifying surviving spouse status for Chart J.}
