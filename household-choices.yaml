        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/variables/gov/states/mt/tax/income/deductions/itemized/medical/mt_medical_expense_deduction_indiv.py
        models: absent
        basis: >-
          Each spouse's column counts only that spouse's own medical expenses
          (other_medical_expenses on the head or spouse), so a dependent's
          expenses are deducted in neither column.
        cites_entry: false
    proposed:
      - repo: PolicyEngine/policyengine-us
        pr: https://github.com/PolicyEngine/policyengine-us/pull/10276
        path: policyengine_us/variables/gov/states/mt/tax/income/deductions/itemized/medical/mt_medical_and_dental_expenses_indiv.py
        models: convention
    full_optimization: >-
      Evaluate the couple's net income at both ends of the share and at each
      point where a column's medical floor binds or its tax rate changes,
      together with the other separate-filing choices and the filing choice.

statutory_not_choice:
  - jurisdiction: us-mt
    citation: MCA 2021 15-30-2131(1)(c)(vi)(D)
    note: >-
      Spouses filing separately on the same form divide the dependent care
      deduction equally; the statute fixes the split, so it is not a choice.
