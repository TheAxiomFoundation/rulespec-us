# Household choices: the points where the law lets a household pick among
# options and the pick can change tax or benefits. Axiom models each choice as
# an input; the default here is what a caller supplies when the household
# states nothing. The simulation layer optimizes. See tools/README.md
# ("Household choices") and tools/household_choices.py.
version: 1
entries:
  - id: itemized-deduction-election
    jurisdiction: us
    program: income-tax
    question: >-
      Does the taxpayer elect to itemize deductions instead of taking the
      standard deduction?
    actor: taxpayer
    texts:
      - corpus_citation_path: us/statute/26/63/e/1
        excerpt: >-
          Unless an individual makes an election under this subsection for the
          taxable year, no itemized deduction shall be allowed for the taxable
          year.
    domain:
      kind: boolean
      per: tax-unit
    default:
      value: false
      basis: statute
      note: With no election, 63(e)(1) allows no itemized deduction.
    objective:
      measure: net-income
      scope: household
    optimization:
      structure: two-way
    axiom:
      # 63(e) isn't encoded yet; these modules take the election as an input.
      consumers:
        - input: us:statutes/26/55#input.tax_unit_itemizes
          polarity: same
        - input: us:statutes/26/170/p#input.individual_does_not_elect_to_itemize_deductions_for_taxable_year
          polarity: inverse
    implementations:
      - repo: PolicyEngine/policyengine-us
        commit: ce9377ee80157a17eb730fa1b8550b4d433c696c
        path: policyengine_us/variables/gov/irs/income/taxable_income/deductions/tax_unit_itemizes.py
        variable: tax_unit_itemizes
        models: optimized
        objective:
          measure: federal-income-tax
          scope: tax-unit
        basis: >-
          When gov.simulation.branch_to_determine_itemization is true, it
          compares the tax unit's federal income tax with and without
          itemizing and takes the lower. Liabilities within the formula's
          floating-point tolerance count as a tie, and on a tie it itemizes
          when itemized deductions exceed the standard deduction.
        cites_entry: false
    tests:
      - repo: PolicyEngine/policyengine-us
        commit: ce9377ee80157a17eb730fa1b8550b4d433c696c
        path: policyengine_us/tests/policy/baseline/gov/irs/income/taxable_income/deductions/tax_unit_itemizes.yaml
        name: 2026 - the itemization choice uses the section 68 limitation net of the QBI deduction
        pins: [optimum]
        variable: tax_unit_itemizes
        chooses: true
    full_optimization: >-
      Compare the two choices on the household's net income, so that state and
      local taxes that depend on the federal election count too.

  - id: qualifying-child-claim-by-non-parent
    jurisdiction: us
    program: income-tax
    question: >-
      When a child's parents may claim the child as a qualifying child, does no
      parent claim the child, so that another taxpayer whose adjusted gross
      income is higher than any parent's may claim the child?
    actor: eligible-claimants
    texts:
      - corpus_citation_path: us/statute/26/152/c/4
        excerpt: >-
          If the parents of an individual may claim such individual as a
          qualifying child but no parent so claims the individual, such
          individual may be claimed as the qualifying child of another taxpayer
          but only if the adjusted gross income of such taxpayer is higher than
          the highest adjusted gross income of any parent of the individual.
    domain:
      kind: boolean
      per: person
    default:
      value: false
      basis: statute
      note: >-
        False means a parent claims the child, and 152(c)(4)(A) and (B) decide
        which taxpayer the child belongs to.
    objective:
      measure: net-income
      scope: household
    optimization:
      structure: two-way
    axiom:
      input: us:statutes/26/152/c#input.parents_of_individual_may_claim_individual_but_no_parent_claims
    full_optimization: >-
      Compare the household's net income with a parent claiming the child and
      with the other eligible taxpayer claiming the child.

  # Montana, tax years 2021 to 2023: married spouses could file separate
  # returns, and spouses filing separately on one form chose how to divide
  # some items between their columns. The five choices interact, so they are
  # coupled. From tax year 2024 Montana uses the federal filing status.
  - id: separate-or-joint-return
    jurisdiction: us-mt
    program: income-tax
    question: >-
      Do married spouses file separate Montana returns instead of a joint
      return?
    actor: spouses-jointly
    years:
      from: 2021
      to: 2023
      type: tax
    texts:
      - corpus_citation_path: us-mt/statute/15-30-2602--mca-2021/block-1
        excerpt: >-
          each taxpayer who is married and living with a husband or wife and
          is required to file a return may, at the taxpayer's option, file a
          joint return with the husband or wife even though one of the spouses
          has neither gross income nor deductions.
      - corpus_citation_path: us-mt/form/mtdor/ty2021/form-2-instructions/document-1
        excerpt: >-
          you and your spouse have the option to file your Montana tax return
          either jointly or separately.
      - corpus_citation_path: us-mt/form/mtdor/ty2022/form-2-instructions/document-1
        excerpt: >-
          you and your spouse have the option to file your Montana tax return
          either jointly or separately.
      - corpus_citation_path: us-mt/form/mtdor/ty2023/form-2-instructions/document-1
        excerpt: >-
          you and your spouse have the option to file your Montana tax return
          either jointly or separately. Beginning in Tax Year 2024, taxpayers
          must use the same filing status used on the federal Form 1040.
    text_kinds:
      us-mt/form/mtdor/ty2021/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2022/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2023/form-2-instructions/document-1: instructions
    domain:
      kind: boolean
      per: tax-unit
      coupled_with:
        - us-mt:separate-filing-itemize-election
        - us-mt:separate-filing-dependent-exemptions
        - us-mt:separate-same-form-charitable-allocation
        - us-mt:separate-filing-dependent-medical-allocation
    default:
      value: true
      basis: statute
      note: >-
        15-30-2602(2) makes a joint return the taxpayer's option, so with no
        election the spouses file separately. The question asks about
        separate filing so that true matches PolicyEngine-US's
        mt_files_separately; an Axiom slot for the joint-return election
        would be an inverse consumer. True covers separate filing on one form,
        which the instructions call the Filing Status 2a election, and on
        separate forms (Filing Status 2b and 2c).
    objective:
      measure: net-income
      scope: tax-unit
    optimization:
      structure: two-way
    implementations:
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/variables/gov/states/mt/tax/income/filing/mt_files_separately.py
        variable: mt_files_separately
        models: optimized
        objective:
          measure: state-income-tax
          scope: tax-unit
        basis: >-
          While gov.states.mt.tax.income.married_filing_separately_on_same_return_allowed
          is true (2021 to 2023), it compares the sum of the spouses' separate
          Montana income taxes (mt_income_tax_indiv) with the joint tax
          (mt_income_tax_joint) and files separately when the sum is lower,
          so on a tie it files jointly. Separate filing is modeled on one
          form.
        cites_entry: false
    tests:
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/tests/policy/baseline/gov/states/mt/tax/income/mt_files_separately.yaml
        name: Joint under individual income
        pins: [optimum]
        variable: mt_files_separately
        chooses: false
    full_optimization: >-
      Compare the couple's net income filing jointly and filing separately,
      choosing the separate-filing choices (itemizing, each dependent's
      column and the split of shared deductions) at the same time.

  - id: separate-filing-itemize-election
    jurisdiction: us-mt
    program: income-tax
    question: >-
      When married spouses file separate Montana returns, do both itemize
      deductions instead of both taking the standard deduction?
    actor: spouses-jointly
    years:
      from: 2021
      to: 2023
      type: tax
    texts:
      - corpus_citation_path: us-mt/regulation/title-42/chapter-42-15/subchapter-42-15-5/rule-42-15-524--effective-2010-04-30/block-1
        excerpt: >-
          (1) If one spouse files separately and itemizes deductions, then both
          must do so.
      - corpus_citation_path: us-mt/form/mtdor/ty2021/form-2-instructions/document-1
        excerpt: >-
          When you and your spouse file, you must both use the standard deduction
          or itemize your deductions. You cannot use two different methods. If
          one spouse itemizes, the other one must itemize as well. When you elect
          to itemize your deductions, you must mark the box and include page 7 of
          Form 2 with your return. If you do not mark the box or do not include
          page 7, the processing of your return may be delayed, or your return
          may be adjusted using the standard deduction.
      - corpus_citation_path: us-mt/form/mtdor/ty2022/form-2-instructions/document-1
        excerpt: >-
          When you and your spouse file, you must both use the standard deduction
          or itemize your deductions. You cannot use two different methods. If
          one spouse itemizes, the other one must itemize as well. When you elect
          to itemize your deductions, you must mark the box and include page 7 of
          Form 2 with your return. If you do not mark the box or do not include
          page 7, the processing of your return may be delayed, or your return
          may be adjusted using the standard deduction.
      - corpus_citation_path: us-mt/form/mtdor/ty2023/form-2-instructions/document-1
        excerpt: >-
          When you and your spouse file, you must both use the standard deduction
          or itemize your deductions. You cannot use two different methods. If
          one spouse itemizes, the other one must itemize as well. When you elect
          to itemize your deductions, you must mark the box and include page 7 of
          Form 2 with your return. If you do not mark the box or do not include
          page 7, the processing of your return may be delayed, or your return
          may be adjusted using the standard deduction.
    text_kinds:
      us-mt/form/mtdor/ty2021/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2022/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2023/form-2-instructions/document-1: instructions
    domain:
      kind: boolean
      per: tax-unit
      coupled_with:
        - us-mt:separate-or-joint-return
        - us-mt:separate-filing-dependent-exemptions
        - us-mt:separate-same-form-charitable-allocation
        - us-mt:separate-filing-dependent-medical-allocation
    default:
      value: false
      basis: agency
      note: >-
        Itemizing is an election marked by a box on Form 2, and the
        instructions say a return without it may be adjusted using the
        standard deduction. So with no election both columns take the
        standard deduction.
    objective:
      measure: net-income
      scope: tax-unit
    optimization:
      structure: two-way
    implementations:
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/variables/gov/states/mt/tax/income/deductions/general/mt_tax_unit_itemizes.py
        variable: mt_tax_unit_itemizes
        models: convention
        basis: >-
          It itemizes when the spouses' Montana itemized deductions
          (mt_itemized_deductions_indiv) sum to more than their standard
          deductions (mt_standard_deduction_indiv), and mt_deductions_indiv
          applies the choice to both columns. It compares deduction totals,
          not tax, so where the columns face different tax rates it can
          choose the option with the higher combined tax. For a joint return,
          mt_taxable_income_joint deducts the larger of the joint totals, and
          no variable holds that choice.
        cites_entry: false
    tests:
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/tests/policy/baseline/gov/states/mt/tax/income/deductions/mt_tax_unit_itemizes.yaml
        name: Combined-AGI care phaseout keeps itemized deductions below the standard deduction
        pins: [default]
    full_optimization: >-
      Compare the couple's net income with both columns itemizing and with
      both taking the standard deduction, together with the filing choice
      and the other separate-filing allocations.

  - id: separate-filing-dependent-exemptions
    jurisdiction: us-mt
    program: income-tax
    question: >-
      When married spouses file separate Montana returns, which spouse claims
      the exemption for a dependent of both?
    actor: spouses-jointly
    years:
      from: 2021
      to: 2023
      type: tax
    texts:
      - corpus_citation_path: us-mt/form/mtdor/ty2021/form-2-instructions/document-1
        excerpt: >-
          If you are filing separately, and the same individual is the
          dependent of both, you must allocate this dependent to one or the
          other spouse. The same dependent cannot be claimed twice.
      - corpus_citation_path: us-mt/form/mtdor/ty2022/form-2-instructions/document-1
        excerpt: >-
          If you are filing separately, and the same individual is the
          dependent of both, you must allocate this dependent to one or the
          other spouse. The same dependent cannot be claimed twice.
      - corpus_citation_path: us-mt/form/mtdor/ty2023/form-2-instructions/document-1
        excerpt: >-
          If you are filing separately, and the same individual is the
          dependent of both, you must allocate this dependent to one or the
          other spouse. The same dependent cannot be claimed twice.
    text_kinds:
      us-mt/form/mtdor/ty2021/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2022/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2023/form-2-instructions/document-1: instructions
    domain:
      kind: enum
      per: person
      options: [taxpayer, spouse]
      coupled_with:
        - us-mt:separate-or-joint-return
        - us-mt:separate-filing-itemize-election
        - us-mt:separate-same-form-charitable-allocation
        - us-mt:separate-filing-dependent-medical-allocation
    default:
      value: taxpayer
      basis: convention
      note: >-
        The instructions put each such dependent in one spouse's column and
        name neither spouse. With nothing stated, the dependent goes in the
        taxpayer's column, Column A.
    objective:
      measure: net-income
      scope: tax-unit
    optimization:
      structure: finite
    implementations:
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/variables/gov/states/mt/tax/income/tax_calculation/mt_taxable_income_indiv.py
        models: absent
        basis: >-
          It divides the total of the dependent exemptions as an amount
          instead of placing each dependent. Up to the gap between the
          spouses' taxable incomes before dependent exemptions goes to the
          higher-income column, and the rest is halved between the columns.
          So one dependent's exemption can be split between the columns,
          which the instructions forbid, and no variable holds a dependent's
          column.
        cites_entry: false
    full_optimization: >-
      Enumerate each dependent's column together with the filing choice, the
      itemizing choice and the split of shared deductions, comparing the
      couple's net income.

  - id: separate-same-form-charitable-allocation
    jurisdiction: us-mt
    program: income-tax
    question: >-
      When married spouses who filed a joint federal return, or no federal
      return, file separate Montana returns on the same form, what share of
      their charitable deduction, paid from accounts both spouses own and not
      clearly attributable to one spouse, does the taxpayer's column claim?
    actor: spouses-jointly
    years:
      from: 2021
      to: 2023
      type: tax
    texts:
      - corpus_citation_path: us-mt/regulation/title-42/chapter-42-15/subchapter-42-15-5/rule-42-15-524--effective-2010-04-30/block-1
        excerpt: >-
          (3) If a married taxpayer files a separate Montana return, the
          following rules apply if the taxpayer filed a joint federal income tax
          return with the taxpayer's spouse or did not file a federal income tax
          return:
      - corpus_citation_path: us-mt/regulation/title-42/chapter-42-15/subchapter-42-15-5/rule-42-15-524--effective-2010-04-30/block-1
        excerpt: >-
          (b) if the spouses file a separate return on the same form, an
          itemized deduction not clearly attributable to one spouse may be
          divided as provided on the form;
      - corpus_citation_path: us-mt/regulation/title-42/chapter-42-15/subchapter-42-15-5/rule-42-15-524--effective-2010-04-30/block-1
        excerpt: >-
          (c) if one or both of the spouses files a separate return on a
          separate form, an itemized deduction not clearly attributable to one
          spouse must be divided equally unless the spouses enter into a
          binding written agreement providing a different division;
      - corpus_citation_path: us-mt/form/mtdor/ty2021/form-2-instructions/document-1
        excerpt: >-
          Payments made from accounts owned by both spouses that pertain to
          expenses not attributable specifically to one spouse can be
          allocated to either spouse in any proportional amount.
      - corpus_citation_path: us-mt/form/mtdor/ty2022/form-2-instructions/document-1
        excerpt: >-
          Payments made from accounts owned by both spouses that pertain to
          expenses not attributable specifically to one spouse can be
          allocated to either spouse in any proportional amount.
      - corpus_citation_path: us-mt/form/mtdor/ty2023/form-2-instructions/document-1
        excerpt: >-
          Payments made from accounts owned by both spouses that pertain to
          expenses not attributable specifically to one spouse can be
          allocated to either spouse in any proportional amount.
    text_kinds:
      us-mt/form/mtdor/ty2021/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2022/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2023/form-2-instructions/document-1: instructions
    domain:
      kind: share
      per: tax-unit
      bounds: ["0", "1"]
      coupled_with:
        - us-mt:separate-or-joint-return
        - us-mt:separate-filing-itemize-election
        - us-mt:separate-filing-dependent-exemptions
        - us-mt:separate-filing-dependent-medical-allocation
    default:
      value: "0.5"
      basis: convention
      note: >-
        ARM 42.15.524(3) governs spouses who filed a joint federal return or
        none. For spouses on the same form, (3)(b) lets them divide the
        deduction as the form provides, and the form allows any proportion,
        so the law sets no split. Half to each column is the convention. The
        equal division in (3)(c) binds spouses on separate forms who have no
        written agreement, not spouses on the same form.
    objective:
      measure: net-income
      scope: tax-unit
    optimization:
      structure: piecewise-linear
    implementations:
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/variables/gov/states/mt/tax/income/deductions/itemized/general/mt_itemized_deductions_indiv.py
        models: convention
        basis: >-
          It computes the charitable deduction only for the tax unit and puts
          gov.states.mt.tax.income.deductions.itemized.spouse_allocation_rate
          (one half) of it in each spouse's column, gifts attributable to one
          spouse included.
        cites_entry: false
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/variables/gov/states/mt/tax/income/deductions/itemized/federal_itemization/mt_itemized_deductions_for_federal_itemization_indiv.py
        models: convention
        basis: >-
          The same split, in the copy of the itemized deductions
          PolicyEngine-US computes for the federal itemization choice. That
          copy does not enter the Montana tax.
        cites_entry: false
    tests:
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/tests/policy/baseline/gov/states/mt/tax/income/deductions/itemized/mt_itemized_deductions_indiv.yaml
        name: Test case 3
        pins: [default]
      - repo: PolicyEngine/policyengine-us
        commit: dd7acdbabc15bc179c1392f229a1962366d96a6c
        path: policyengine_us/tests/policy/baseline/gov/states/mt/tax/income/deductions/itemized/federal_itemization/mt_itemized_deductions_for_federal_itemization_indiv.yaml
        name: Charitable allocation agrees across separate paths at default half share
        pins: [default]
    full_optimization: >-
      Evaluate the couple's net income at both ends of the share and at each
      point where a column's tax rate changes, together with the other
      separate-filing choices and the filing choice.

  - id: separate-filing-dependent-medical-allocation
    jurisdiction: us-mt
    program: income-tax
    question: >-
      When married spouses who filed a joint federal return, or no federal
      return, file separate Montana returns on the same form, what share of
      their dependents' medical and dental expenses other than insurance
      premiums, paid from accounts both spouses own, does the taxpayer's
      column claim?
    actor: spouses-jointly
    years:
      from: 2021
      to: 2023
      type: tax
    texts:
      - corpus_citation_path: us-mt/regulation/title-42/chapter-42-15/subchapter-42-15-5/rule-42-15-524--effective-2010-04-30/block-1
        excerpt: >-
          (3) If a married taxpayer files a separate Montana return, the
          following rules apply if the taxpayer filed a joint federal income tax
          return with the taxpayer's spouse or did not file a federal income tax
          return:
      - corpus_citation_path: us-mt/regulation/title-42/chapter-42-15/subchapter-42-15-5/rule-42-15-524--effective-2010-04-30/block-1
        excerpt: >-
          (b) if the spouses file a separate return on the same form, an
          itemized deduction not clearly attributable to one spouse may be
          divided as provided on the form;
      - corpus_citation_path: us-mt/form/mtdor/ty2021/form-2-instructions/document-1
        excerpt: >-
          Payments made from accounts owned by both spouses that pertain to
          expenses not attributable specifically to one spouse can be
          allocated to either spouse in any proportional amount.
      - corpus_citation_path: us-mt/form/mtdor/ty2022/form-2-instructions/document-1
        excerpt: >-
          Payments made from accounts owned by both spouses that pertain to
          expenses not attributable specifically to one spouse can be
          allocated to either spouse in any proportional amount.
      - corpus_citation_path: us-mt/form/mtdor/ty2023/form-2-instructions/document-1
        excerpt: >-
          Payments made from accounts owned by both spouses that pertain to
          expenses not attributable specifically to one spouse can be
          allocated to either spouse in any proportional amount.
    text_kinds:
      us-mt/form/mtdor/ty2021/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2022/form-2-instructions/document-1: instructions
      us-mt/form/mtdor/ty2023/form-2-instructions/document-1: instructions
    domain:
      kind: share
      per: tax-unit
      bounds: ["0", "1"]
      coupled_with:
        - us-mt:separate-or-joint-return
        - us-mt:separate-filing-itemize-election
        - us-mt:separate-filing-dependent-exemptions
        - us-mt:separate-same-form-charitable-allocation
    default:
