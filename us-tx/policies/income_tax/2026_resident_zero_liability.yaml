format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - us-tx/statute/constitution/article-8/section-24-a
      - us-tx/statute/constitution/article-8/section-24-b
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - us-tx/statute/constitution/article-8/section-24-a
        - us-tx/statute/constitution/article-8/section-24-b
      rationale: |-
        The Texas Legislative Council's current official Constitution,
        captured as of 2026-07-24, prohibits the legislature from imposing a
        tax on individuals' net incomes, including their shares of partnership
        and unincorporated-association income. Section 24-a was added in 2019
        and is present in the current text that governs tax year 2026.

        Section 24-b, added in 2025, separately prohibits a tax on realized or
        unrealized capital gains of an individual, family, estate, or trust.
        It expressly preserves ad valorem, sales, and use taxes, so this module
        does not treat those non-income taxes as individual income tax.

        This authority proves zero resident individual net-income tax before
        credits. It does not prove that Texas has no independently refundable
        credit or otherwise establish a complete signed net-liability surface.
        The downstream credit and net-liability outputs therefore remain
        explicitly deferred behind typed source holds.
  summary: |-
    Texas tax-year-2026 full-year-resident individual net-income-tax surface.
    Article VIII, section 24-a prohibits the legislature from imposing a tax
    on individuals' net incomes, so the source-backed individual-income-tax
    amount before credits is zero. This is the legal absence of an individual
    net-income tax, not a fictional zero-percent bracket or zero-income
    assumption.

    Article VIII, section 24-b separately prohibits capital-gains taxation of
    individuals, families, estates, and trusts while preserving ad valorem,
    sales, and use taxes. Those preserved taxes, business and entity taxes,
    payments, filing administration, local taxes, and nonresident allocation
    are outside this module.

    The pinned constitutional authority does not establish the absence of
    independently refundable credits or a complete signed net-liability
    surface. The after-nonrefundable-credit, refundable-credit, and net
    liability outputs therefore return fail-closed zero sentinels while typed
    source holds remain active. Those sentinels are not substantive claims
    that the corresponding stages equal zero.
  deferred_outputs:
    - output: us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_resident_individual_income_tax_after_nonrefundable_credits
      reason: |-
        The pinned constitutional prohibition establishes the pre-credit tax
        amount but does not provide a complete nonrefundable-credit surface.
      source_values:
        - us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_nonrefundable_credit_source_hold_applies
    - output: us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_resident_refundable_individual_income_tax_credits
      reason: |-
        The pinned constitutional prohibitions do not prove the absence of
        independently refundable individual credits.
      source_values:
        - us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_refundable_credit_source_hold_applies
    - output: us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_resident_net_individual_income_tax_liability_before_payments
      reason: |-
        Signed net liability cannot be completed until the nonrefundable and
        refundable credit holds are cleared and their ordering is pinned.
      source_values:
        - us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_net_liability_source_hold_applies
