# Texas Constitution article VIII, sections 24-a and 24-b prohibit individual
# net-income and capital-gains taxes. These input-free cases are named for
# materially different full-year-resident profiles to make explicit that
# federal income, filing status, deductions, exemptions, and surtaxes cannot
# change the legal pre-credit zero. Credit and net-liability amounts below are
# fail-closed sentinels guarded by typed source holds, not substantive zeros.
- name: single_low_income_full_year_resident
  period: {period_kind: tax_year, start: '2026-01-01', end: '2026-12-31'}
  input: {}
  output:
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_individual_net_income_tax_prohibition_applies: true
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_capital_gains_tax_prohibition_applies: true
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_non_income_tax_carveouts_preserved: true
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_resident_individual_income_tax_imposed: false
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_deduction_and_exemption_stage_applies: false
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_surtax_stage_applies: false
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_resident_individual_income_tax_before_credits: '0'
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_nonrefundable_credit_source_hold_applies: holds
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_resident_individual_income_tax_after_nonrefundable_credits: '0'
    us-tx:policies/income_tax/2026_resident_zero_liability#tx_pit_2026_refundable_credit_source_hold_applies: holds
