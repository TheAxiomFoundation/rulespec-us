  source_verification:
    corpus_citation_path: us/statute/26/1402
  summary: "(b) Self-employment income The term \u201Cself-employment income\u201D\
    \ means the net earnings from self-employment derived by an individual (other\
    \ than a nonresident alien individual, except as provided by an agreement under\
    \ section 233 of the Social Security Act) during any taxable year; except that\
    \ such term shall not include\u2014 (1) in the case of the tax imposed by section\
    \ 1401(a), that part of the net earnings from self-employment which is in excess\
    \ of (i) an amount equal to the contribution and benefit base (as determined under\
    \ section 230 of the Social Security Act) which is effective for the calendar\
    \ year in which such taxable year begins, minus (ii) the amount of the wages paid\
    \ to such individual during such taxable years; or (2) the net earnings from self-employment,\
    \ if such net earnings for the taxable year are less than $400. For purposes of\
    \ paragraph (1), the term \u201Cwages\u201D (A) includes such remuneration paid\
    \ to an employee for services included under an agreement entered into pursuant\
    \ to the provisions of section 3121( l ) (relating to coverage of citizens of\
    \ the United States who are employees of foreign affiliates of American employers),\
    \ as would be wages under section 3121(a) if such services constituted employment\
    \ under section 3121(b), and (B) includes compensation which is subject to the\
    \ tax imposed by section 3201 or 3211. An individual who is not a citizen of the\
    \ United States but who is a resident of the Commonwealth of Puerto Rico, the\
    \ Virgin Islands, Guam, or American Samoa shall not, for purposes of this chapter\
    \ be considered to be a nonresident alien individual. In the case of church employee\
    \ income, the special rules of subsection (j)(2) shall apply for purposes of paragraph\
    \ (2)."
