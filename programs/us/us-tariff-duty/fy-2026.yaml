# US tariff duty -- 2026 (T0 slice)
#
# Exposes the hand-authored CBP composition over the encoded USITC HTS
# line, chapter 99 overlay, and CBP de minimis modules: us_tariff_duty
# for the three encoded HTS statistical reporting numbers
# (7202.11.10.00, 7601.10.30.00, 9506.62.40.40) across the 2026
# IEEPA-termination / section 122 surcharge / section 232 / section 301
# windows, including the FR 2026-03829 postal flat-rate window. The
# broader tariff schedule (all other HTS lines and overlay headings) is
# out of the T0 slice, so hts_number outside the three encoded lines
# yields a zero base rate by construction.
program: us/us-tariff-duty
period: 2026-01
outputs:
  - us_tariff_duty
acknowledged_incomplete:
  - us_tariff_duty
scope:
  federal:
    - statutes/19/1321
    - statutes/19/1401a
