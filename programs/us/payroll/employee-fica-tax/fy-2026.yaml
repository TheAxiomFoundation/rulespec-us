# Employee-side federal FICA wage taxes -- tax year 2026
#
# This sibling is intentionally distinct from `oasdi-wage-tax`: it computes all
# three employee wage-tax components in 26 USC 3101 and names the domain-limited
# integration module that supplies the cap-aware outputs.

program: us/payroll/employee-fica-tax
period: '2026'

outputs:
  - employee_oasdi_wage_tax
  - employee_hospital_insurance_wage_tax
  - employee_additional_medicare_wage_tax

scope:
  federal:
    - policies/payroll/employee_fica_tax_pipeline
    - statutes/26/3121/a/1
