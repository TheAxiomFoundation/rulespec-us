# Eligibility join (rulespec-us#1116). Wiring only: every operand is a rule
# that an encoded module in scope already defines. The shape follows the
# Georgia and Maryland compositions (residency, eligible member, then a
# categorical route or the ordinary resource and income tests), with
# Arizona's encoded categorical determination as the categorical route.
transformations:
  - pattern: all_of
    name: az_ordinary_resource_and_income_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    conditions:
      - snap_resource_eligible
      - snap_standard_income_eligible

  - pattern: any_of
    name: az_income_and_resource_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    conditions:
      - na_categorically_eligible_for_benefit_calculation
      - az_ordinary_resource_and_income_eligible

  - pattern: all_of
    name: na_budgetary_unit_is_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    conditions:
      - snap_residency_eligible
      - snap_household_member_eligible
      - az_income_and_resource_eligible

  # Expanded categorical eligibility operands (rulespec-us#2335). Wiring only,
  # the same alias shape as the North Carolina spec (household_gross_income,
  # maximum_allowable_gross_income_limit). FAA5 NA Categorical Eligibility
  # block 5 tests the budgetary unit's gross income against 185% of the
  # current federal poverty level, and no rule in scope defined either
  # operand, so both compiled as supplied inputs. gross_income is the gross
  # income that the ordinary 7 CFR 273.9 test in this program reads.
  # current_federal_poverty_level_amount is the USDA FY 2026 monthly 100%
  # standard that the same test reads as the net income limit.
  - pattern: sum_terms
    name: gross_income
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    terms:
      - snap_total_gross_income

  - pattern: sum_terms
    name: current_federal_poverty_level_amount
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    terms:
      - snap_net_income_limit_100_percent_fpl_48_states_dc

  # Arizona standard medical deduction (rulespec-us#952). Wiring only: both
  # operands are rules that an encoded module in scope already defines. The
  # benefit reads the 7 CFR 273.10 net-income chain, where
  # snap_excess_medical_deduction_for_net_income is
  # `if household_entitled_to_excess_medical_deduction:
  #  max(0, snap_total_medical_expenses - snap_medical_expense_threshold)`
  # and both operands compiled as supplied inputs. The Arizona module
  # (FAA5 NA Medical Expenses and Deduction, block 2, corpus
  # us-az/manual/des/faa5/na-medical-expenses-and-deduction/block-2) computes
  # the deduction Arizona allows, but its medical_deduction reached only the
  # 7 USC 2014(e)(6)(A) twin chain, which no output reads.
  #
  # Entitlement: block 2 makes a budgetary unit "eligible for a medical
  # expense deduction when the budgetary unit's combined out-of-pocket medical
  # expense is greater than $35" for elderly or disabled participants
  # (also deceased and SSI participants under the stated conditions).
  # medical_expense_participant_is_deduction_eligible encodes that test.
  - pattern: all_of
    name: household_entitled_to_excess_medical_deduction
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 medical deduction composition
    conditions:
      - medical_expense_participant_is_deduction_eligible

  # Amount: block 2 allows "one of the following medical expense
  # deductions": the Standard Medical Deduction net amount of $145, or "the
  # actual amount, minus the $35 disregard"; medical_deduction is that
  # amount, already net of the disregard. 7 CFR 273.10(e)(1)(i)(C)
  # (corpus us/regulation/7/273/10) subtracts snap_medical_expense_threshold
  # ($35) from snap_total_medical_expenses, so the term adds the threshold
  # back: max(0, medical_deduction + 35 - 35) = medical_deduction, because
  # medical_deduction is never negative. The federal step therefore passes
  # Arizona's deduction through unchanged.
  - pattern: derived_formula
    name: snap_total_medical_expenses
    effective_from: '2026-01-01'
    entity: Household
    dtype: Money
    period: Month
    unit: USD
    source: axiom-programs/us-az/snap/fy-2026 medical deduction composition
    formula: medical_deduction + snap_medical_expense_threshold

  # Elderly or disabled participant (block 2). Block 2 allows the deduction
  # "for NA budgetary units with participants who are elderly or have a
  # disability" and refers to Arizona's special-circumstances page for who is
  # elderly or disabled; that page is not in the corpus, and Arizona applies
  # the federal SNAP definition (7 USC 2012(j), corpus us/statute/7/2012/j),
  # which snap_household_has_elderly_or_disabled_member encodes from each
  # member's snap_member_is_elderly_or_disabled, the same fact the shelter
  # cap and asset limit read. Binding the Arizona fact to it keeps the two
  # from diverging. The "with medical expenses" part is not lost: the module
  # still requires medical_expenses_belong_to_and_are_billed_to_elderly_or_disabled_participant
  # and combined expenses over $35 in the same conjunct. The deceased and SSI
  # routes of block 2 are separate disjuncts on their own inputs and are not
  # affected.
  - pattern: all_of
    name: budgetary_unit_includes_elderly_or_disabled_participant_with_medical_expenses
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 medical deduction composition
    conditions:
      - snap_household_has_elderly_or_disabled_member
