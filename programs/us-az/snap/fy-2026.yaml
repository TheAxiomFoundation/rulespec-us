# Arizona Nutrition Assistance (SNAP) -- FY 2026
#
# Arizona's executable Nutrition Assistance surface lives in the DES FAA5
# FY 2026 benefit-calculation composition, which now composes the federal
# USDA FY 2026 SNAP chain (7 CFR 273.10 whole-dollar computation) with
# Arizona's FAA5 utility-allowance eligibility rules and the FAA6.J.09
# amounts, exposing the issued benefit as snap_benefit (rulespec-us#830
# pattern). The federal modules are scoped here so the composition's imports
# resolve; the inline snap_benefit bridge was removed because the
# composition now defines it (keeping the inline copy would create a
# duplicate derived rule).

program: us-az/snap
period: 2026-01

outputs:
  - snap_eligible
  - snap_benefit

# Coverage review: 61 named rules = W 11, M 37, P 10, U 3.
# M/P concern member composition, procedure, or other determinations.
# W: the composition's snap_eligible reads na_budgetary_unit_is_eligible. The
# transformations below derive that name from encoded rules (rulespec-us#1116):
# federal residency, the positive eligible-member chain, and either the
# Arizona categorical route or the ordinary federal resource and income tests.
# Remaining W debt: the Arizona categorical rules still read supplied BCE/ECE
# status facts, and the Arizona gross and net income test modules are not yet
# the income branch.
# U: three TBA rules may be a SNAP eligibility route or separate TBA status.
# Record partial coverage pending supervised module repairs and a TBA ruling.
acknowledged_incomplete:
  - snap_eligible

scope:
  federal:
    - policies/usda/snap/state-plan-composition
    - policies/usda/snap/fy-2026-cola/maximum-allotments
    - policies/usda/snap/fy-2026-cola/deductions
    - policies/usda/snap/fy-2026-cola/income-eligibility-standards
    - regulations/7-cfr/273/3
    - regulations/7-cfr/273/4
    - regulations/7-cfr/273/5
    - regulations/7-cfr/273/6
    - regulations/7-cfr/273/7
    - regulations/7-cfr/273/8
    - regulations/7-cfr/273/9
    - regulations/7-cfr/273/10
    - regulations/7-cfr/273/24
    - statutes/7/2012/j
    - statutes/7/2014/e/2
    - statutes/7/2014/e/6/A
    - statutes/7/2017/a

  state:
    - policies/des/faa5/dependent-care-expense/na-dependent-care
    - policies/des/faa5/disqualified-na-participant-s-effect-on-the-na/disqualified-participant-effect-on-na-benefit-amount
    - policies/des/faa5/na-categorical-eligibility/basic-categorical-eligibility
    - policies/des/faa5/na-categorical-eligibility/categorical-eligibility-benefit-calculation
    - policies/des/faa5/na-categorical-eligibility/expanded-categorical-eligibility
    - policies/des/faa5/na-child-support-expense/allowable-deductions
    - policies/des/faa5/na-eligibility-and-benefit-determination/benefit-amount
    - policies/des/faa5/na-eligibility-and-benefit-determination/first-month-benefit-proration
    - policies/des/faa5/na-eligibility-and-benefit-determination/fy-2026-benefit-calculation
    - policies/des/faa5/na-eligibility-and-benefit-determination/gross-income-test
    - policies/des/faa5/na-eligibility-and-benefit-determination/net-income-test
    - policies/des/faa5/na-medical-expenses-and-deduction/medical-deduction
    - policies/des/faa5/na-transitional-benefit-assistance-tba
    - policies/des/faa5/na-utility-expenses-and-allowances/utility-allowance-eligibility
    - policies/des/faa6/utility-allowance-current-amount
    - policies/des/faa5/shelter-expenses-and-deduction/shelter-deduction
    - policies/des/faa5/supplemental-payments-and-restored-benefits

# Eligibility join (rulespec-us#1116). Wiring only: every operand is a rule
# that an encoded module in scope already defines. The shape follows the
# Georgia and Maryland compositions (residency, eligible member, then a
# categorical route or the ordinary resource and income tests), with
# Arizona's encoded categorical determination as the categorical route.
transformations:
  - pattern: all_of
    name: az_ordinary_resource_and_income_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    conditions:
      - snap_resource_eligible
      - snap_standard_income_eligible

  - pattern: any_of
    name: az_income_and_resource_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    conditions:
      - na_categorically_eligible_for_benefit_calculation
      - az_ordinary_resource_and_income_eligible

  - pattern: all_of
    name: na_budgetary_unit_is_eligible
    effective_from: '2026-01-01'
    entity: Household
    dtype: Judgment
    period: Month
    source: axiom-programs/us-az/snap/fy-2026 eligibility composition
    conditions:
      - snap_residency_eligible
      - snap_household_member_eligible
      - az_income_and_resource_eligible
